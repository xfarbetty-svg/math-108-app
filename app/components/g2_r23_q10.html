<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G2-R-2-3 Q10 乘法交換律教具</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --success-color: #7ed321;
            --error-color: #d0021b;
            --bg-color: #f9fbfd;
            --text-color: #333;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-color);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .unit-tag {
            background: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            display: inline-block;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-color);
            margin: 10px 0;
            line-height: 1.4;
        }

        .visual-area {
            background: white;
            border: 2px dashed #ccc;
            border-radius: 12px;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 15px;
        }

        .svg-container {
            width: 100%;
            height: 160px;
        }

        .toggle-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 5px;
            transition: transform 0.2s;
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #ddd;
            padding: 12px 5px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
        }

        .option-btn.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .option-btn.wrong {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        #feedback {
            text-align: center;
            height: 24px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .formula-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            color: #555;
            margin-top: 5px;
        }

        circle {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="header">
        <span class="unit-tag">G2-R-2-3 乘法交換律</span>
        <div class="question-text">「6 的 7 倍」和「7 的 6 倍」結果相同，用乘法算式記作？</div>
    </div>

    <div class="visual-area">
        <div id="formula-label" class="formula-display">6 × 7 = 42</div>
        <svg id="dot-svg" class="svg-container" viewBox="0 0 300 160">
            <!-- Dots will be generated by JS -->
        </svg>
        <button class="toggle-btn" onclick="toggleView()">切換視角 (旋轉陣列)</button>
    </div>

    <div class="options-grid">
        <button class="option-btn" onclick="checkAnswer(0, this)">6 × 7 ＝ 7 × 6</button>
        <button class="option-btn" onclick="checkAnswer(1, this)">6 ＋ 7 ＝ 7 ＋ 6</button>
        <button class="option-btn" onclick="checkAnswer(2, this)">6 × 7 ＞ 7 × 6</button>
        <button class="option-btn" onclick="checkAnswer(3, this)">6 × 6 ＝ 7 × 7</button>
    </div>

    <div id="feedback"></div>
</div>

<script>
    const svg = document.getElementById('dot-svg');
    const formulaLabel = document.getElementById('formula-label');
    const feedback = document.getElementById('feedback');
    let isSixBySeven = true; // true: 6x7, false: 7x6

    // 初始化 42 個點
    function initDots() {
        for (let i = 0; i < 42; i++) {
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", "8");
            circle.setAttribute("fill", "#4a90e2");
            circle.id = `dot-${i}`;
            svg.appendChild(circle);
        }
        updateDots();
    }

    function updateDots() {
        const paddingX = 40;
        const paddingY = 30;
        const spacing = 25;

        if (isSixBySeven) {
            // 6 的 7 倍：7 組，每組 6 個 (直向排列)
            // 或是理解為 6x7 矩陣：6列 7行
            formulaLabel.innerText = "6 × 7 = 42 (6的7倍)";
            for (let i = 0; i < 42; i++) {
                const row = i % 6;
                const col = Math.floor(i / 6);
                const dot = document.getElementById(`dot-${i}`);
                dot.setAttribute("cx", paddingX + col * spacing + 45);
                dot.setAttribute("cy", paddingY + row * spacing);
                dot.setAttribute("fill", "#4a90e2");
            }
        } else {
            // 7 的 6 倍：6 組，每組 7 個
            formulaLabel.innerText = "7 × 6 = 42 (7的6倍)";
            for (let i = 0; i < 42; i++) {
                const row = i % 7;
                const col = Math.floor(i / 7);
                const dot = document.getElementById(`dot-${i}`);
                dot.setAttribute("cx", paddingX + col * spacing + 60);
                dot.setAttribute("cy", paddingY + row * spacing - 10);
                dot.setAttribute("fill", "#f5a623");
            }
        }
    }

    function toggleView() {
        isSixBySeven = !isSixBySeven;
        updateDots();
    }

    function checkAnswer(index, btn) {
        // 重置所有按鈕
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => {
            b.classList.remove('correct', 'wrong');
            b.disabled = false;
        });

        if (index === 0) {
            btn.classList.add('correct');
            feedback.innerText = "太棒了！乘法交換順序結果不變。";
            feedback.style.color = "var(--success-color)";
            // 答對後鎖定
            buttons.forEach(b => b.disabled = true);
            triggerWinEffect();
        } else {
            btn.classList.add('wrong');
            feedback.innerText = "再試試看，找找看乘法算式。";
            feedback.style.color = "var(--error-color)";
        }
    }

    function triggerWinEffect() {
        const dots = document.querySelectorAll('circle');
        dots.forEach((dot, i) => {
            setTimeout(() => {
                dot.setAttribute("fill", "#7ed321");
                dot.setAttribute("r", "10");
                setTimeout(() => dot.setAttribute("r", "8"), 200);
            }, i * 10);
        });
    }

    // 啟動
    initDots();
</script>

</body>
</html>
