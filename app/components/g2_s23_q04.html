<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G2-S-2-3 直尺操作微教具 Q04</title>
    <style>
        :root {
            --primary: #7bc9b2;
            --primary-dark: #318a70;
            --accent: #ffd166;
            --text: #3d3a34;
            --bg: #fff9f0;
            --paper: #ffffff;
            --correct: #4caf50;
            --wrong: #ff5252;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 420px;
            background: url('../assets/demo/bg_desk.webp') center/cover no-repeat;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 249, 240, 0.85);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .header {
            background: var(--paper);
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            border-left: 5px solid var(--primary);
        }

        .question {
            font-size: 16px;
            line-height: 1.4;
            color: var(--text);
            font-weight: bold;
            margin: 0;
        }

        .stage {
            flex: 1;
            background: var(--paper);
            border-radius: 12px;
            margin-bottom: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .ruler-container {
            width: 340px;
            height: 120px;
            position: relative;
        }

        .ruler-svg {
            width: 100%;
            height: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .opt-btn {
            background: var(--paper);
            border: 2px solid #e0e0e0;
            padding: 10px;
            border-radius: 10px;
            font-size: 15px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-weight: 500;
        }

        .opt-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(123, 201, 178, 0.3);
        }

        .footer {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .check-btn {
            flex: 1;
            background: var(--primary-dark);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .check-btn:active { transform: scale(0.98); }

        .feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            padding: 20px;
            border-radius: 15px;
            background: var(--bg-card);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 10;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
        }

        .feedback.show { transform: translate(-50%, -50%) scale(1); }

        .feedback h3 { margin: 0 0 10px 0; font-size: 20px; }
        .feedback p { margin: 0 0 15px 0; color: #666; font-size: 14px; line-height: 1.5; }

        .close-fdb {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* Drawing Animation */
        .drawing-line {
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            transition: stroke-dashoffset 0.5s ease-out;
        }

        .pencil-icon {
            transition: all 0.5s ease-out;
        }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="wrap">
    <div class="overlay"></div>
    <div class="content">
        <div class="header">
            <p class="question">畫一條 5 公分長的直線，小華從刻度 2 開始畫，應畫到刻度幾？</p>
        </div>

        <div class="stage">
            <div class="ruler-container">
                <svg class="ruler-svg" viewBox="0 0 350 120">
                    <!-- Ruler Body -->
                    <rect x="5" y="40" width="340" height="60" rx="6" fill="#fff" stroke="#3d3a34" stroke-width="2" />
                    
                    <!-- Ticks -->
                    <g id="ticks-group"></g>

                    <!-- Drawing Area -->
                    <line id="base-line" x1="80" y1="30" x2="80" y2="30" stroke="#7bc9b2" stroke-width="4" stroke-linecap="round" class="drawing-line" />
                    
                    <!-- Pencil -->
                    <g id="pencil" class="pencil-icon" style="opacity: 0;">
                        <path d="M0,0 L-5,-15 L5,-15 Z" fill="#ffd166" transform="translate(80, 25)" />
                        <rect x="-5" y="-35" width="10" height="20" fill="#ffd166" transform="translate(80, 25)" />
                        <rect x="-5" y="-40" width="10" height="5" fill="#ff5252" transform="translate(80, 25)" />
                    </g>

                    <!-- Start Point Marker -->
                    <circle cx="80" cy="30" r="4" fill="#318a70" />
                    <text x="80" y="20" font-size="10" text-anchor="middle" fill="#318a70" font-weight="bold">起點</text>
                </svg>
            </div>
        </div>

        <div class="options-grid">
            <div class="opt-btn" onclick="selectOption(0)">刻度 5</div>
            <div class="opt-btn" onclick="selectOption(1)">刻度 6</div>
            <div class="opt-btn" onclick="selectOption(2)">刻度 7</div>
            <div class="opt-btn" onclick="selectOption(3)">刻度 8</div>
        </div>

        <div class="footer">
            <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
        </div>
    </div>

    <div id="feedback" class="feedback">
        <h3 id="f-title"></h3>
        <p id="f-desc"></p>
        <button class="close-fdb" onclick="closeFeedback()">繼續練習</button>
    </div>
</div>

<script>
    const options = [5, 6, 7, 8];
    const correctIndex = 2;
    let selectedIndex = -1;

    // Initialize Ruler Ticks
    function initRuler() {
        const group = document.getElementById('ticks-group');
        let html = '';
        // 0 to 10 cm, each cm is 30px, offset 20px
        for (let i = 0; i <= 100; i++) {
            const x = 20 + (i * 3);
            let h = 8;
            if (i % 10 === 0) {
                h = 20;
                html += `<text x="${x}" y="${40 + h + 15}" font-size="12" text-anchor="middle" fill="#3d3a34">${i/10}</text>`;
            } else if (i % 5 === 0) {
                h = 14;
            }
            html += `<line x1="${x}" y1="40" x2="${x}" y2="${40 + h}" stroke="#3d3a34" stroke-width="1" />`;
        }
        group.innerHTML = html;
    }

    function selectOption(idx) {
        selectedIndex = idx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((b, i) => b.classList.toggle('active', i === idx));
        
        updateDrawing(options[idx]);
    }

    function updateDrawing(targetScale) {
        const line = document.getElementById('base-line');
        const pencil = document.getElementById('pencil');
        const startX = 20 + (2 * 30); // Scale 2
        const endX = 20 + (targetScale * 30);
        
        line.setAttribute('x2', endX);
        line.style.strokeDashoffset = 0;
        
        pencil.style.opacity = 1;
        pencil.setAttribute('transform', `translate(${endX - 80}, 0)`);
        
        // Add a little bounce effect
        pencil.animate([
            { transform: `translate(${endX - 80}px, 0px)` },
            { transform: `translate(${endX - 80}px, -5px)` },
            { transform: `translate(${endX - 80}px, 0px)` }
        ], { duration: 300 });
    }

    function checkAnswer() {
        if (selectedIndex === -1) return;

        const fdb = document.getElementById('feedback');
        const title = document.getElementById('f-title');
        const desc = document.getElementById('f-desc');

        if (selectedIndex === correctIndex) {
            fdb.classList.add('success'); fdb.classList.remove('fail');
            title.innerText = "太棒了！";
            title.style.color = "var(--correct)";
            desc.innerText = "從刻度 2 開始畫 5 公分，算式是 2 + 5 = 7，所以會畫到刻度 7。";
        } else {
            title.innerText = "再試試看！";
            title.style.color = "var(--wrong)";
            desc.innerText = "想一想，從 2 開始往後數 5 公分，會停在哪個數字呢？";
        }
        fdb.classList.add('show');
    }

    function closeFeedback() {
        document.getElementById('feedback').classList.remove('show');
    }

    initRuler();
window.check = typeof checkAnswer !== "undefined" ? checkAnswer : () => {};
</script>

<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
