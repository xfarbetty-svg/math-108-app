<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>S-4-6 平面圖形的全等・108 課綱互動教具</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
:root{
  --bg:var(--bg-main, #fcfbf9);
  --card:var(--bg-card, #ffffff);
  --ink:var(--text-primary, #1e293b);
  --ink-soft:var(--text-secondary, #64748b);
  --line:var(--border-color, #e2e8f0);
  --a:var(--accent-primary, #2563eb);
  --mint:var(--accent-mint, #0d9488);
  --sky:var(--accent-sky, #0284c7);
  --elev:var(--bg-elevated, #f1f5f9);
  --ok:#16a34a; --warn:#ea580c; --hl:#fef08a;
  --shadow:0 3px 10px rgba(0,0,0,0.06);
  --radius:12px;
  --shape-a:rgba(37, 99, 235, 0.22);
  --shape-a-stroke:#2563eb;
  --shape-b:rgba(234, 88, 12, 0.22);
  --shape-b-stroke:#ea580c;
  --shape-ok:rgba(22, 163, 74, 0.24);
  --shape-ok-stroke:#16a34a;
}
html[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --ink:#f8fafc; --ink-soft:#94a3b8;
  --line:#334155; --elev:#1e293b; --ok:#4ade80; --warn:#fb923c;
  --shadow:0 3px 10px rgba(0,0,0,0.28);
  --shape-a:rgba(96, 165, 250, 0.28);
  --shape-a-stroke:#60a5fa;
  --shape-b:rgba(251, 146, 60, 0.28);
  --shape-b-stroke:#fb923c;
  --shape-ok:rgba(74, 222, 128, 0.28);
  --shape-ok-stroke:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;max-width:100vw;overflow-x:hidden;height:auto;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:4px 8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
[hidden]{display:none!important}
#app{width:100%;max-width:480px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:4px;overflow:visible}

.head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--ink-soft);min-height:22px}
.head-left{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.head b{font-size:12px;color:var(--ink);white-space:nowrap}
.head-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#btn-theme{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}

.activity-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--elev);padding:3px;border-radius:999px;flex-wrap:nowrap;max-width:100%}
.activity-nav::-webkit-scrollbar{display:none}
.act-btn{flex:0 0 auto;padding:4px 9px;font-size:11px;font-weight:800;border-radius:999px;color:var(--ink-soft);white-space:nowrap;transition:all .15s}
.act-btn.active{background:var(--card);color:var(--a);box-shadow:0 2px 5px rgba(0,0,0,.08)}

.act-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);max-width:100%;overflow:visible}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.card-badge{background:var(--elev);color:var(--a);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;white-space:nowrap}
.card-title{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage-canvas{width:100%;background:var(--elev);border-radius:10px;border:1px solid var(--line);padding:2px;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none}
.stage-canvas svg{width:100%;max-width:340px;height:118px;display:block;touch-action:none;user-select:none}

.interact-panel{background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:4px 6px;display:flex;flex-direction:column;gap:4px;text-align:center;max-width:100%}
.btn-grid{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn-action{background:var(--card);border:1.2px solid var(--line);color:var(--ink);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;transition:all .12s;white-space:nowrap}
.btn-action:hover{border-color:var(--a)}
.btn-action.primary{background:var(--a);border-color:var(--a);color:#fff}
.btn-action.active{background:var(--a);border-color:var(--a);color:#fff}

.info-bubble{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:10.5px;line-height:1.32;color:var(--ink);font-weight:700;text-align:left;min-height:18px}
.info-bubble.ok{border-color:var(--ok);color:var(--ok)}
.info-bubble.warn{border-color:var(--warn);color:var(--warn)}

.steps-box{background:var(--card);border:1.5px solid var(--ok);border-radius:8px;padding:5px 7px;font-size:10px;line-height:1.35;color:var(--ink);display:flex;flex-direction:column;gap:2px;text-align:left}
.step-line b{color:var(--ok);margin-right:3px}

/* 嚴格雙模式隔離：q-mode 下強制隱藏所有概念活動頁籤與卡片 */
.q-mode .activity-nav,
.q-mode #act-0-view,
.q-mode #act-1-view,
.q-mode #act-2-view{display:none!important}
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="head-left">
      <b>🧩 平面圖形的全等</b>
      <span id="qtag" class="card-badge" hidden></span>
    </div>
    <div class="head-right">
      <button type="button" id="btn-theme">🌙 深色</button>
    </div>
  </div>

  <nav class="activity-nav" id="activityNav">
    <button type="button" class="act-btn active" data-act="0">① 拼布磁磚平移</button>
    <button type="button" class="act-btn" data-act="1">② 風車葉片旋轉</button>
    <button type="button" class="act-btn" data-act="2">③ 蝴蝶剪紙翻轉</button>
  </nav>

  <!-- 概念探索：活動一（拼布磁磚平移疊合） -->
  <section class="act-card" id="act-0-view">
    <div class="card-head">
      <span class="card-badge">活動一・拼布磁磚平移疊合</span>
      <span class="card-title">拖曳磁磚平移對齊目標框</span>
    </div>
    <div class="stage-canvas">
      <svg id="svg0" viewBox="0 0 340 118"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action primary" id="act0Snap">自動平移疊合 ▶</button>
        <button type="button" class="btn-action" id="act0Reset">重置磁磚</button>
      </div>
      <div class="info-bubble" id="act0Msg">用手指或滑鼠拖曳藍色拼布磁磚，試著向右平移疊合到橘色框線！</div>
    </div>
  </section>

  <!-- 概念探索：活動二（風車葉片旋轉疊合） -->
  <section class="act-card" id="act-1-view" hidden>
    <div class="card-head">
      <span class="card-badge">活動二・風車葉片旋轉疊合</span>
      <span class="card-title">拖曳或旋轉葉片對齊目標位置</span>
    </div>
    <div class="stage-canvas">
      <svg id="svg1" viewBox="0 0 340 118"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action" id="act1Rot45">順時針轉 45°</button>
        <button type="button" class="btn-action primary" id="act1Rot90">轉 90° 疊合</button>
        <button type="button" class="btn-action" id="act1Reset">重置角度</button>
      </div>
      <div class="info-bubble" id="act1Msg">拖曳風車葉片或點擊按鈕旋轉，轉到 180° 時兩片葉片完全疊合！</div>
    </div>
  </section>

  <!-- 概念探索：活動三（蝴蝶剪紙翻轉鏡像疊合） -->
  <section class="act-card" id="act-2-view" hidden>
    <div class="card-head">
      <span class="card-badge">活動三・蝴蝶剪紙翻轉鏡像</span>
      <span class="card-title">翻轉剪紙並拖曳至中線重疊</span>
    </div>
    <div class="stage-canvas">
      <svg id="svg2" viewBox="0 0 340 118"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action primary" id="act2Flip">左右翻轉（鏡像）</button>
        <button type="button" class="btn-action" id="act2Align">移至中線疊合</button>
        <button type="button" class="btn-action" id="act2Reset">重置</button>
      </div>
      <div class="info-bubble" id="act2Msg">先點擊「左右翻轉」，再拖曳右翼蝴蝶剪紙向左靠攏中線疊合！</div>
    </div>
  </section>

  <!-- 真題模式（?q=1..10）：嚴格零劇透，不自帶題幹與四選項 -->
  <section class="act-card" id="examView" hidden>
    <div class="card-head">
      <span class="card-badge" id="examBadge">真題圖解</span>
      <span class="card-title" id="examHintTitle">操作教具觀察全等疊合</span>
    </div>
    <div class="stage-canvas">
      <svg id="examStage" viewBox="0 0 340 118"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid" id="examControls"></div>
      <div class="btn-grid">
        <button type="button" class="btn-action primary" id="verifyBtn">驗證疊合</button>
        <button type="button" class="btn-action" id="revealSteps">一步一步看算理 🔍</button>
        <button type="button" class="btn-action" id="resetExamBtn">重置</button>
      </div>
      <div class="info-bubble" id="examMsg">請依題意操作上方教具，觀察對應頂點、對應邊或對應角。</div>
      <div class="steps-box" id="stepsBox" hidden></div>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);
  const qRaw = params.get('q');
  const qNum = qRaw ? parseInt(qRaw, 10) : 0;
  const isExam = Number.isInteger(qNum) && qNum >= 1 && qNum <= 10;
  window.__S46_MODE__ = isExam ? ('q' + qNum) : 'concept';

  const state = {
    act0X: 52,
    act1Angle: 0,
    act2Flipped: false,
    act2X: 225,
    exam: {}
  };
  window.__S46_STATE__ = state;

  /* ---------- 主題同步（Light / Dark） ---------- */
  function applyTheme(t){
    const mode = (t === 'dark') ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', mode);
    const btn = document.getElementById('btn-theme');
    if(btn) btn.textContent = mode === 'dark' ? '☀️ 淺色' : '🌙 深色';
  }
  applyTheme(params.get('theme') || 'light');
  document.getElementById('btn-theme').addEventListener('click', function(){
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(cur);
  });
  window.addEventListener('message', function(ev){
    const d = ev && ev.data;
    if(d && d.type === 'THEME_CHANGE') applyTheme(d.theme);
  });

  /* ---------- 通用 Pointer 拖曳（SVG 座標轉換） ---------- */
  function clientToSvg(svg, clientX, clientY){
    const r = svg.getBoundingClientRect();
    if(!r.width || !r.height) return { x: 170, y: 59 };
    return {
      x: ((clientX - r.left) / r.width) * 340,
      y: ((clientY - r.top) / r.height) * 118
    };
  }
  function attachSvgDrag(svg, onMove){
    let dragging = false;
    svg.addEventListener('pointerdown', function(e){
      dragging = true;
      if(svg.setPointerCapture) try { svg.setPointerCapture(e.pointerId); } catch(_){}
      onMove(clientToSvg(svg, e.clientX, e.clientY));
    });
    svg.addEventListener('pointermove', function(e){
      if(!dragging) return;
      onMove(clientToSvg(svg, e.clientX, e.clientY));
    });
    const stop = function(e){
      dragging = false;
      if(svg.releasePointerCapture) try { svg.releasePointerCapture(e.pointerId); } catch(_){}
    };
    svg.addEventListener('pointerup', stop);
    svg.addEventListener('pointercancel', stop);
  }

  /* ---------- 概念探索（活動一～三） ---------- */
  function showAct(idx){
    [0,1,2].forEach(i => {
      document.getElementById('act-' + i + '-view').hidden = (i !== idx);
      document.querySelector('.act-btn[data-act="' + i + '"]').classList.toggle('active', i === idx);
    });
    if(idx === 0) renderAct0();
    if(idx === 1) renderAct1();
    if(idx === 2) renderAct2();
  }
  document.querySelectorAll('.act-btn').forEach(b => {
    b.addEventListener('click', () => showAct(parseInt(b.dataset.act, 10)));
  });

  // 活動一：拼布磁磚平移疊合
  function renderAct0(){
    const svg = document.getElementById('svg0');
    const tx = Math.round(state.act0X);
    const targetX = 215;
    const matched = Math.abs(tx - targetX) <= 8;
    const drawX = matched ? targetX : tx;
    svg.innerHTML = `
      <defs><pattern id="g0" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--line)" stroke-width="0.7"/></pattern></defs>
      <rect width="340" height="118" fill="url(#g0)"/>
      <!-- 目標橘框磁磚 (基準位置 x=215) -->
      <polygon points="215,24 285,24 299,94 201,94" fill="var(--shape-b)" stroke="var(--shape-b-stroke)" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="250" y="16" font-size="9.5" font-weight="800" fill="var(--shape-b-stroke)" text-anchor="middle">目標拼布位置</text>
      <!-- 可拖曳藍色磁磚 -->
      <g transform="translate(${drawX - 52}, 0)" style="cursor:grab">
        <polygon points="52,24 122,24 136,94 38,94" fill="${matched ? 'var(--shape-ok)' : 'var(--shape-a)'}" stroke="${matched ? 'var(--shape-ok-stroke)' : 'var(--shape-a-stroke)'}" stroke-width="2.2"/>
        <circle cx="52" cy="24" r="3" fill="var(--ink)"/>
        <text x="87" y="64" font-size="10" font-weight="900" fill="var(--ink)" text-anchor="middle">拼布磁磚</text>
      </g>
      <text x="170" y="110" font-size="9" font-weight="800" fill="var(--ink-soft)" text-anchor="middle">向右平移距離：${Math.max(0, Math.round((drawX - 52)/2))} 格單位</text>
    `;
    const msg = document.getElementById('act0Msg');
    msg.className = 'info-bubble ' + (matched ? 'ok' : '');
    msg.textContent = matched
      ? '✓ 完全疊合！形狀與大小都一樣的磁磚，經過「平移」後能完全重疊，就是全等圖形！'
      : '用手指或滑鼠向右拖曳藍色拼布磁磚，對齊橘色目標框！';
  }
  attachSvgDrag(document.getElementById('svg0'), (pt) => {
    state.act0X = Math.max(40, Math.min(235, pt.x - 25));
    renderAct0();
  });
  document.getElementById('act0Snap').onclick = () => { state.act0X = 215; renderAct0(); };
  document.getElementById('act0Reset').onclick = () => { state.act0X = 52; renderAct0(); };

  // 活動二：風車葉片旋轉疊合
  function renderAct1(){
    const svg = document.getElementById('svg1');
    const ang = ((state.act1Angle % 360) + 360) % 360;
    const matched = Math.abs(ang - 180) <= 10;
    const drawAng = matched ? 180 : ang;
    svg.innerHTML = `
      <circle cx="170" cy="59" r="46" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- 目標葉片（在左側 180° 方向） -->
      <polygon points="170,59 112,42 124,78" fill="var(--shape-b)" stroke="var(--shape-b-stroke)" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="90" y="63" font-size="9" font-weight="800" fill="var(--shape-b-stroke)" text-anchor="end">目標葉片</text>
      <!-- 可旋轉葉片（初始在右側 0°） -->
      <g transform="rotate(${drawAng} 170 59)" style="cursor:grab">
        <polygon points="170,59 228,76 216,40" fill="${matched ? 'var(--shape-ok)' : 'var(--shape-a)'}" stroke="${matched ? 'var(--shape-ok-stroke)' : 'var(--shape-a-stroke)'}" stroke-width="2.2"/>
        <circle cx="228" cy="76" r="3" fill="var(--warn)"/>
      </g>
      <circle cx="170" cy="59" r="4.5" fill="var(--ink)"/>
      <text x="275" y="22" font-size="9.5" font-weight="900" fill="var(--ink)">旋轉：${Math.round(drawAng)}°</text>
    `;
    const msg = document.getElementById('act1Msg');
    msg.className = 'info-bubble ' + (matched ? 'ok' : '');
    msg.textContent = matched
      ? '✓ 旋轉 180° 完全疊合！全等圖形即使方向不同，透過「旋轉」一樣能完全重合。'
      : '拖曳風車葉片或點擊按鈕旋轉，轉到 180° 看看能否和目標葉片疊合！';
  }
  attachSvgDrag(document.getElementById('svg1'), (pt) => {
    const deg = Math.round(Math.atan2(pt.y - 59, pt.x - 170) * 180 / Math.PI);
    state.act1Angle = (deg + 360) % 360;
    renderAct1();
  });
  document.getElementById('act1Rot45').onclick = () => { state.act1Angle = (state.act1Angle + 45) % 360; renderAct1(); };
  document.getElementById('act1Rot90').onclick = () => { state.act1Angle = 180; renderAct1(); };
  document.getElementById('act1Reset').onclick = () => { state.act1Angle = 0; renderAct1(); };

  // 活動三：蝴蝶剪紙翻轉鏡像疊合
  function renderAct2(){
    const svg = document.getElementById('svg2');
    const fl = state.act2Flipped;
    const rx = Math.round(state.act2X);
    const matched = fl && Math.abs(rx - 170) <= 12;
    const drawX = matched ? 170 : rx;
    // 左翼（基準，中線在 x=170）
    const leftWing = `M 170,40 C 132,12 92,26 105,60 C 115,82 145,100 170,84 Z`;
    // 右翼（若未翻轉，開口朝右不對稱；翻轉後開口朝左與左翼鏡像）
    const wingPath = `M 0,40 C 38,12 78,26 65,60 C 55,82 25,100 0,84 Z`;
    const scaleX = fl ? -1 : 1;
    svg.innerHTML = `
      <line x1="170" y1="10" x2="170" y2="108" stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="170" y="114" font-size="8.5" font-weight="800" fill="var(--ink-soft)" text-anchor="middle">對稱摺線（翻轉軸）</text>
      <path d="${leftWing}" fill="var(--shape-b)" stroke="var(--shape-b-stroke)" stroke-width="2"/>
      <text x="116" y="58" font-size="9.5" font-weight="900" fill="var(--shape-b-stroke)">左翼</text>
      <g transform="translate(${drawX}, 0) scale(${scaleX}, 1)" style="cursor:grab">
        <path d="${wingPath}" fill="${matched ? 'var(--shape-ok)' : 'var(--shape-a)'}" stroke="${matched ? 'var(--shape-ok-stroke)' : 'var(--shape-a-stroke)'}" stroke-width="2.2"/>
      </g>
      <text x="275" y="20" font-size="9.5" font-weight="800" fill="var(--ink)">${fl ? '已鏡像翻轉' : '尚未翻轉'}</text>
    `;
    const msg = document.getElementById('act2Msg');
    msg.className = 'info-bubble ' + (matched ? 'ok' : '');
    msg.textContent = matched
      ? '✓ 左右翻轉後沿摺線完全疊合！這就是「翻轉」全等，對應頂點與對應邊完全重合！'
      : (fl ? '已翻轉成鏡像方向！請向左拖曳右翼剪紙到中線（x=170）疊合。' : '先點擊「左右翻轉（鏡像）」，再拖曳右翼向中線靠攏！');
  }
  attachSvgDrag(document.getElementById('svg2'), (pt) => {
    state.act2X = Math.max(162, Math.min(265, pt.x));
    renderAct2();
  });
  document.getElementById('act2Flip').onclick = () => { state.act2Flipped = !state.act2Flipped; renderAct2(); };
  document.getElementById('act2Align').onclick = () => { state.act2Flipped = true; state.act2X = 170; renderAct2(); };
  document.getElementById('act2Reset').onclick = () => { state.act2Flipped = false; state.act2X = 225; renderAct2(); };

  /* ---------- 真題模式（Q1~Q10 專屬 SVG 與操作驗證） ---------- */
  const EXAM_SPECS = {
    1: {
      badge: '真題 Q1・獅湖 110-1',
      title: '拖曳三角形觀察形狀大小與重疊',
      steps: [

              <polygon points="200,24 240,94 100,94" fill="var(--shape-a)" stroke="var(--shape-a-stroke)" stroke-width="2"/>
            </g>
            <line x1="200" y1="24" x2="100" y2="94" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>
            <text x="170" y="110" font-size="9" font-weight="800" fill="var(--warn)" text-anchor="middle">${r ? '梯形上底≠下底，旋轉後無法疊合！' : '梯形沿對角線剪開'}</text>
          `;
        } else {
          svg.innerHTML = `
            <polygon points="110,24 220,24 100,94" fill="var(--shape-b)" stroke="var(--shape-b-stroke)" stroke-width="2"/>
            <g transform="${r ? 'rotate(180 160 59)' : ''}">
              <polygon points="220,24 210,94 100,94" fill="${r?'var(--shape-ok)':'var(--shape-a)'}" stroke="${r?'var(--shape-ok-stroke)':'var(--shape-a-stroke)'}" stroke-width="2"/>
            </g>
            <line x1="220" y1="24" x2="100" y2="94" stroke="var(--ok)" stroke-width="2" stroke-dasharray="4 3"/>
            <text x="170" y="110" font-size="9" font-weight="800" fill="var(--ok)" text-anchor="middle">${r ? '✓ 平行四邊形旋轉 180° 完全疊合！' : '平行四邊形沿對角線剪開'}</text>
          `;
        }
        ctrl.innerHTML = `
          <button type="button" class="btn-action ${isTrap?'active':''}" id="q9Trap">梯形</button>
          <button type="button" class="btn-action ${!isTrap?'active':''}" id="q9Para">平行四邊形</button>
          <button type="button" class="btn-action primary" id="q9Rot">${r ? '復原' : '旋轉 180° 試疊合 ↻'}</button>
        `;
        ctrl.querySelector('#q9Trap').onclick = () => { st.shape = 'trap'; st.rot = false; renderExam(); };
        ctrl.querySelector('#q9Para').onclick = () => { st.shape = 'para'; st.rot = false; renderExam(); };
        ctrl.querySelector('#q9Rot').onclick = () => { st.rot = !r; renderExam(); };
      },
      check: (st) => ({ ok: st.shape === 'trap' && st.rot, msg: (st.shape === 'trap' && st.rot) ? '✓ 實測梯形旋轉 180° 後無法重合，只有梯形無法得到兩個全等三角形！' : '請選擇「梯形」並點擊「旋轉 180° 試疊合」驗證！' })
    },
    10: {
      badge: '真題 Q10・內湖 111-2',
      title: '剪開得兩個全等等腰三角形測試',
      steps: [
        '菱形四條邊都相等，沿對角線剪開後，每個三角形都有兩條等長的腰，是等腰三角形。',
        '這兩個等腰三角形的三邊長完全相同，旋轉 180° 可完全疊合（全等）。',
        '一般長方形鄰邊不等長，剪開後是兩股不等長的直角三角形，不是等腰三角形。'
      ],
      init: { shape: 'rhombus', split: false },
      render(st, svg, ctrl){
        const isRh = st.shape === 'rhombus';
        const sp = st.split;
        if(isRh){
          svg.innerHTML = `
            <polygon points="170,18 225,59 115,59" fill="var(--shape-b)" stroke="var(--shape-b-stroke)" stroke-width="2"/>
            <g transform="translate(0, ${sp ? 12 : 0})">
              <polygon points="170,100 225,59 115,59" fill="var(--shape-ok)" stroke="var(--shape-ok-stroke)" stroke-width="2"/>
            </g>
            <text x="170" y="114" font-size="9" font-weight="800" fill="var(--ok)" text-anchor="middle">${sp ? '✓ 四邊等長 → 兩個全等的等腰三角形！' : '菱形（四條邊一樣長）'}</text>
          `;
        } else {
          svg.innerHTML = `
            <polygon points="110,24 230,24 110,88" fill="var(--shape-b)" stroke="var(--shape-b-stroke)" stroke-width="2"/>
            <g transform="translate(${sp ? 10 : 0}, ${sp ? 10 : 0})">
              <polygon points="230,24 230,88 110,88" fill="var(--shape-a)" stroke="var(--shape-a-stroke)" stroke-width="2"/>
            </g>
            <text x="170" y="114" font-size="9" font-weight="800" fill="var(--warn)" text-anchor="middle">${sp ? '長方形長≠寬 → 不是等腰三角形' : '一般長方形（長≠寬）'}</text>
          `;
        }
        ctrl.innerHTML = `
          <button type="button" class="btn-action ${isRh?'active':''}" id="q10Rh">菱形</button>
          <button type="button" class="btn-action ${!isRh?'active':''}" id="q10Rect">長方形</button>
          <button type="button" class="btn-action primary" id="q10Split">${sp ? '合起來' : '沿對角線剪開 ✂'}</button>
        `;
        ctrl.querySelector('#q10Rh').onclick = () => { st.shape = 'rhombus'; st.split = false; renderExam(); };
        ctrl.querySelector('#q10Rect').onclick = () => { st.shape = 'rect'; st.split = false; renderExam(); };
        ctrl.querySelector('#q10Split').onclick = () => { st.split = !sp; renderExam(); };
      },
      check: (st) => ({ ok: st.shape === 'rhombus' && st.split, msg: (st.shape === 'rhombus' && st.split) ? '✓ 菱形沿對角線剪開，可得到兩個全等的等腰三角形！' : '請選擇「菱形」並點擊「沿對角線剪開」觀察兩腰長度！' })
    }
  };

  function renderExam(){
    const cfg = EXAM_SPECS[qNum];
    if(!cfg) return;
    cfg.render(state.exam, document.getElementById('examStage'), document.getElementById('examControls'));
  }

  function initExam(){
    document.body.classList.add('q-mode');
    document.getElementById('activityNav').hidden = true;
    [0,1,2].forEach(i => { document.getElementById('act-' + i + '-view').hidden = true; });
    document.getElementById('examView').hidden = false;

    const cfg = EXAM_SPECS[qNum];
    if(!cfg) return;
    const qtag = document.getElementById('qtag');
    qtag.textContent = '真題 Q' + qNum;
    qtag.hidden = false;
    document.getElementById('examBadge').textContent = cfg.badge;
    document.getElementById('examHintTitle').textContent = cfg.title;

    state.exam = Object.assign({}, cfg.init);
    const stepsBox = document.getElementById('stepsBox');
    stepsBox.hidden = true;
    stepsBox.innerHTML = cfg.steps.map((s, idx) => `<div class="step-line"><b>步驟 ${idx+1}：</b>${s}</div>`).join('');

    if(cfg.onDrag){
      attachSvgDrag(document.getElementById('examStage'), (pt) => cfg.onDrag(state.exam, pt));
    }

    document.getElementById('verifyBtn').onclick = function(){
      const res = cfg.check(state.exam);
      const m = document.getElementById('examMsg');
      m.className = 'info-bubble ' + (res.ok ? 'ok' : 'warn');
      m.textContent = res.msg;
      if(res.ok) stepsBox.hidden = false;
    };
    document.getElementById('revealSteps').onclick = function(){ stepsBox.hidden = !stepsBox.hidden; };
    document.getElementById('resetExamBtn').onclick = function(){
      state.exam = Object.assign({}, cfg.init);
      stepsBox.hidden = true;
      const m = document.getElementById('examMsg');
      m.className = 'info-bubble';
      m.textContent = '已重置操作狀態，請重新操作。';
      renderExam();
    };
    renderExam();
  }

  if(isExam) initExam();
  else showAct(0);
})();
</script>
</body>
</html>
