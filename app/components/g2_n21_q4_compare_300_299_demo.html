<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-1-Q04 300□299</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --coral:#ff8a65; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:8px 10px 14px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:15px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.compare { display:grid; grid-template-columns:1fr 44px 1fr; align-items:start; gap:4px; }
.side { text-align:center; }
.side-num { font-size:20px; font-weight:800; margin-bottom:3px; }
.blocks { display:flex; flex-direction:column; align-items:center; gap:3px; }
.hrow { display:flex; gap:3px; }
.hundred { width:22px; height:22px; border:1.5px solid var(--ink); background:var(--mint); border-radius:3px; display:grid; grid-template:repeat(2,1fr)/repeat(2,1fr); }
.hundred i { border:0.5px solid rgba(0,0,0,.3); }
.trow { display:flex; gap:2px; justify-content:center; }
.tenbar { width:8px; height:20px; border:1.2px solid var(--ink); background:var(--coral); border-radius:2px; }
.onerow { display:flex; gap:2px; justify-content:center; }
.one { width:7px; height:7px; border:1.2px solid var(--ink); background:var(--lemon); border-radius:2px; }
.box-mid { display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:26px; }
.vs { font-size:11px; font-weight:800; color:var(--ink-soft); }
.slot { width:40px; height:40px; border:2.5px dashed var(--ink-soft); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:var(--mint-deep); }
.hint { font-size:10.5px; font-weight:700; color:var(--ink-soft); }
.opts { display:flex; justify-content:center; gap:10px; }
.opt-btn { width:64px; border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:9px 0; font-size:20px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:8px 30px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>112-1 內湖 期中 二、7-(1)</small>在 □ 中填入 ＞、＜ 或 ＝：300 □ 299</p>
  </div>
  <div class="card">
    <div class="compare">
      <div class="side">
        <div class="side-num">300</div>
        <div class="blocks" id="left"></div>
      </div>
      <div class="box-mid">
        <span class="vs">比一比</span>
        <div class="slot" id="slot"></div>
        <span class="hint">點下面的符號</span>
      </div>
      <div class="side">
        <div class="side-num">299</div>
        <div class="blocks" id="right"></div>
      </div>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var hundred = '<div class="hundred"><i></i><i></i><i></i><i></i></div>';
  var left = document.getElementById('left');
  left.innerHTML = '<div class="hrow">' + hundred.repeat(3) + '</div>';
  var right = document.getElementById('right');
  right.innerHTML =
    '<div class="hrow">' + hundred.repeat(2) + '</div>' +
    '<div class="trow">' + '<div class="tenbar"></div>'.repeat(9) + '</div>' +
    '<div class="onerow">' + '<div class="one"></div>'.repeat(9) + '</div>';
  var CHOICES = ['＞', '＜', '＝'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      document.getElementById('slot').textContent = c;
      hide();
    });
    optBox.appendChild(b);
  });
  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！先比百位：3 個百比 2 個百多，所以 300 ＞ 299。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：三位數比大小，先從百位比起——左邊 3 塊百格板，右邊只有 2 塊。';
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-1-Q04', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
