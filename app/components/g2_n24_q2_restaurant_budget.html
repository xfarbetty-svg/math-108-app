<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-4-Q02 餐廳 1000 元夠不夠</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --sky: #4ea8de;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 14px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.tray { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 4px 0; }
.wallet {
  border: 2px solid var(--sky);
  border-radius: 10px;
  background: #eef6fd;
  padding: 6px 8px;
  text-align: center;
}
.wallet svg { display: block; margin: 0 auto 2px; }
.wallet span { font-size: 11px; font-weight: 900; color: #1d3557; display: block; }
.dish {
  border: 2px solid var(--line);
  border-radius: 10px;
  background: #fdfbf7;
  padding: 6px 8px;
  text-align: center;
  transition: all 0.18s;
}
.dish.sel { border-color: var(--mint-deep); background: #eafaf4; transform: translateY(-2px); }
.dish span { font-size: 11px; font-weight: 900; color: #b45309; display: block; }
.est-hint {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 800;
  color: var(--mint-deep);
  background: #eafaf4;
  border-radius: 999px;
  padding: 4px 10px;
  text-align: center;
  line-height: 1.4;
}

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>112-2 內湖 期中 四、1.(2)</small>美食餐廳：兒童餐 212 元、小火鍋 880 元、三明治 105 元、蛋糕 198 元。媽媽帶 1000 元要買一個蛋糕和一個三明治，請問 1000 元夠不夠？</p>
  </div>
  <div class="card">
    <div class="tray">
      <div class="wallet">
        <svg width="44" height="28" viewBox="0 0 44 28"><rect x="2" y="4" width="40" height="20" rx="3" fill="#8ecae6" stroke="#1d3557" stroke-width="1.6"/><circle cx="35" cy="14" r="3" fill="#fff"/><text x="22" y="18" font-size="9" font-weight="900" text-anchor="middle" fill="#1d3557">1000</text></svg>
        <span>媽媽帶 1000 元</span>
      </div>
      <div class="dish" id="dish-cake">
        <svg width="34" height="28" viewBox="0 0 34 28"><rect x="5" y="14" width="24" height="10" rx="2" fill="none" stroke="#ff8a65" stroke-width="2"/><line x1="17" y1="14" x2="17" y2="9" stroke="#ff8a65" stroke-width="2"/><circle cx="17" cy="7" r="2.4" fill="#ff8a65"/></svg>
        <span>蛋糕 198 元</span>
      </div>
      <div class="dish" id="dish-sand">
        <svg width="34" height="28" viewBox="0 0 34 28"><path d="M6 12 L28 12 L17 5 Z" fill="none" stroke="#318a70" stroke-width="2"/><rect x="6" y="12" width="22" height="4" fill="none" stroke="#318a70" stroke-width="2"/><rect x="6" y="16" width="22" height="4" fill="none" stroke="#318a70" stroke-width="2"/></svg>
        <span>三明治 105 元</span>
      </div>
    </div>
    <div class="est-hint" id="hint">點下方選項，先估估看 200＋100 再比一比</div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['夠', '不夠'];
  var ANSWER = 0;
  var picked = -1;

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      document.getElementById('dish-cake').classList.add('sel');
      document.getElementById('dish-sand').classList.add('sel');
      document.getElementById('hint').textContent = '蛋糕 198→約200、三明治 105→約100，200＋100＝300 元，300 遠小於 1000';
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！200＋100＝300 元，300 遠小於 1000 元，所以 1000 元夠（精算 198＋105＝303 也一樣夠）。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：蛋糕約 200 元、三明治約 100 元，兩樣合起來大約多少？跟 1000 元比比看大小。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-4-Q02', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
