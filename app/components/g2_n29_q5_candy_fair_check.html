<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-9-Q05 糖果平分整除判定</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-label { font-size:11px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-plate { font-size:10.5px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:5px 4px; font-size:13.5px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.tool-btn.on { background:var(--mint-deep); color:#fff; }
.status { text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-soft); min-height:18px; }
.status b { color:var(--ink); }
.status .warn { color:var(--red); }
.leftover { display:none; }
.leftover.show { display:''; }
@keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-2px); } 75% { transform:translateX(2px); } }
.leftover.show { animation:shake .5s infinite; }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:8px; font-size:22px; font-weight:800; }
.v-eq .res { color:var(--mint-deep); }
.v-eq .unit { font-size:13px; font-weight:800; color:var(--ink-soft); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
.v-notes .warn { color:var(--red); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
.vq.show .v-eq { animation:pop .3s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>36 顆糖果平分判定</small>把 36 顆糖果平分，下列哪一種分法「沒辦法」剛好平分？</p>
  </div>
  <div class="card">
    <!-- 日系繪本場景：36 顆糖果 6×6 點陣，點選分法後呈現每人份量與剩下糖果 -->
    <svg class="scene-svg" viewBox="0 0 360 248" role="img" aria-label="36 顆糖果排成 6 乘 6">
      <defs>
        <g id="cy"><circle cx="0" cy="0" r="9" stroke="var(--ink)" stroke-width="1.2"/></g>
      </defs>
      <g id="candies"></g>
      <g id="plates"></g>
      <line x1="18" y1="200" x2="342" y2="200" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="180" y="242" class="t-caption" id="cap">糖果總共有 36 顆</text>
    </svg>
    <div class="tools">
      <button type="button" class="tool-btn" data-n="2">平分給 2 個弟弟</button>
      <button type="button" class="tool-btn" data-n="8">平分給 8 個鄰居</button>
      <button type="button" class="tool-btn" data-n="3">平分給 3 個朋友</button>
      <button type="button" class="tool-btn" data-n="4">平分給 4 個同學</button>
    </div>
    <p class="status" id="status">點一種分法，看看糖果分不分得完。</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-eq"><span class="res">36 ÷ 8</span><span class="unit">＝ 4 顆 …… 剩 4 顆</span></div>
    <p class="v-notes">36÷2＝18、36÷3＝12、36÷4＝9 都<b>剛好分完</b>；<br>只有平分給 <b>8 個鄰居</b>：每人 4 顆後<span class="warn">還剩下 4 顆</span>（8×4＝32），<br>所以「平分給 8 個鄰居」<span class="warn">沒辦法剛好平分</span>。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var CHOICES = ['平分給 2 個弟弟', '平分給 8 個鄰居', '平分給 3 個朋友', '平分給 4 個同學'];
  var ANSWER = 1;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  var status = document.getElementById('status');
  var candiesG = document.getElementById('candies');
  var platesG = document.getElementById('plates');
  var cap = document.getElementById('cap');
  var COLORS = ['#ef6b6b', '#f4b26a', '#ffd166', '#a8c97f', '#7bc9b2', '#9ec9e8'];
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  function el(name, attrs, parent) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function build() {
    candiesG.textContent = '';
    var xs = [44, 100, 156, 212, 268, 324];
    var ys = [44, 74, 104, 134, 164, 190];
    var idx = 0;
    ys.forEach(function (y) {
      xs.forEach(function (x) {
        var g = el('g', { transform: 'translate(' + x + ',' + y + ')' }, candiesG);
        var use = el('use', { href: '#cy' }, g);
        use.setAttribute('fill', COLORS[idx % COLORS.length]);
        idx++;
      });
    });
  }
  var btns = Array.prototype.slice.call(document.querySelectorAll('.tool-btn'));
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      var n = b.dataset.n - 0;
      btns.forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      divide(n);
    });
  });
  var leftoverRings = [];
  function divide(n) {
    platesG.textContent = '';
    leftoverRings.forEach(function (r) { r.remove(); });
    leftoverRings = [];
    var per = Math.floor(36 / n);
    var left = 36 - per * n;
    var xs = [];
    for (var i = 0; i < n; i++) xs.push(40 + i * (280 / Math.max(1, n - 1)));
    xs.forEach(function (cx) {
      el('ellipse', { cx: cx, cy: 226, rx: 18, ry: 5.5, fill: '#fff', stroke: 'var(--ink-soft)', 'stroke-width': 1.2 }, platesG);
      var t = el('text', { x: cx, y: 212, 'class': 't-plate' }, platesG);
      t.textContent = per + ' 顆';
    });
    var capText, st;
    if (left === 0) {
      capText = '平分給 ' + n + ' 人：每人 ' + per + ' 顆，剛好分完！';
      st = '平分給 <b>' + n + '</b> 人：每人 <b>' + per + '</b> 顆，<b>剛好分完</b> ✔';
      say('平分給 ' + n + ' 人，每人 ' + per + ' 顆，剛好分完。');
    } else {
      capText = '每人 ' + per + ' 顆之後，還剩下 ' + left + ' 顆分不完！';
      st = '平分給 <b>' + n + '</b> 人：每人 ' + per + ' 顆，<span class="warn">還剩下 ' + left + ' 顆沒辦法分完！</span>';
      say('平分給 ' + n + ' 人，還剩下 ' + left + ' 顆沒辦法分完。');
    }
    cap.textContent = capText;
    status.innerHTML = st;
    var last = candiesG.lastChild;
    for (var k = 36 - left; k < 36; k++) {
      var g = candiesG.children[k];
      leftoverRings.push(el('circle', { cx: 0, cy: 0, r: 13, fill: 'none', stroke: 'var(--red)', 'stroke-width': 2.5 }, g));
    }
  }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el2) { el2.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！36 顆平分給 8 人會剩下 4 顆，沒辦法剛好平分。';
      vq.classList.add('show');
      say('答對！36 顆平分給 8 人，會剩下 4 顆，沒辦法剛好平分。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：用「人數 × 每人顆數」去湊 36，湊不滿的就是分不完的那一種。';
    say('再想想看：用人數乘以每人顆數去湊 36。');
    return { ok: false, picked: picked };
  };
  build();
  window.__q = { id: 'G2-N-2-9-Q05', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
