<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #6cace4;
            --secondary-color: #ffb3ba;
            --bg-color: #fdfcf0;
            --text-color: #4a4a4a;
            --correct-color: #88d8b0;
            --wrong-color: #ff6f69;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        .wrap {
            width: 100%;
            max-width: 480px;
            height: 420px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 4px solid #e0e0e0;
        }

        .header {
            padding: 8px 12px;
            background-color: var(--bg-card);
            border-bottom: 2px dashed #ccc;
            font-size: 14px;
            line-height: 1.35;
            color: var(--text-color);
            font-weight: bold;
        }

        .canvas-area {
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-area svg {
            width: 100%;
            max-height: 130px;
        }

        .options-area {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 6px 10px;
            background-color: var(--bg-card);
        }

        .opt-btn {
            padding: 6px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: var(--bg-card);
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            text-align: center;
            color: var(--text-color);
        }

        .opt-btn:hover {
            background-color: #f9f9f9;
            border-color: var(--primary-color);
        }

        .opt-btn.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: #4a90e2;
        }

        .controls {
            padding: 6px;
            margin-bottom: 6px;
            display: flex;
            justify-content: center;
            background-color: var(--bg-card);
        }

        .check-btn {
            padding: 6px 28px;
            background-color: #ffcc5c;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            box-shadow: 0 3px 0 #e6b850;
        }

        .check-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #e6b850;
        }

        #feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
        }

        .show-feedback {
            animation: pop 0.6s ease-out forwards;
        }

        @keyframes pop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        svg {
            width: 100%;
            height: 100%;
        }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="wrap">
    <div class="header">
        在方格紙上，圖形 A 佔了 12 個方格，圖形 B 佔了 9 個方格。請問圖形 A 的面積比圖形 B 多了幾個方格？
    </div>

    <div class="canvas-area">
        <svg viewBox="0 0 400 220">
            <!-- Grid Background -->
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="1"/>
                </pattern>
            </defs>
            <rect x="20" y="10" width="360" height="180" fill="url(#grid)" stroke="#ccc" />

            <!-- Shape A (12 squares: 4x3) -->
            <g transform="translate(40, 40)">
                <rect x="0" y="0" width="80" height="60" fill="#a2d2ff" fill-opacity="0.7" stroke="#4a90e2" stroke-width="2" rx="4" />
                <text x="40" y="-10" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">圖形 A</text>
                <!-- Inner grid lines for A -->
                <path d="M 20 0 V 60 M 40 0 V 60 M 60 0 V 60 M 0 20 H 80 M 0 40 H 80" stroke="#4a90e2" stroke-width="0.5" stroke-dasharray="2,2" />
                <text x="40" y="35" text-anchor="middle" font-size="12" fill="#2c5282">12 個</text>
            </g>

            <!-- Shape B (9 squares: 3x3) -->
            <g transform="translate(240, 40)">
                <rect x="0" y="0" width="60" height="60" fill="#ffccac" fill-opacity="0.7" stroke="#e67e22" stroke-width="2" rx="4" />
                <text x="30" y="-10" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">圖形 B</text>
                <!-- Inner grid lines for B -->
                <path d="M 20 0 V 60 M 40 0 V 60 M 0 20 H 60 M 0 40 H 60" stroke="#e67e22" stroke-width="0.5" stroke-dasharray="2,2" />
                <text x="30" y="35" text-anchor="middle" font-size="12" fill="#7b341e">9 個</text>
            </g>

            <!-- Decorative Elements -->
            <circle cx="380" cy="200" r="15" fill="#ffeb3b" opacity="0.3" />
            <circle cx="20" cy="200" r="10" fill="#4caf50" opacity="0.2" />
        </svg>
        <div id="feedback"></div>
    </div>

    <div class="options-area">
        <div class="opt-btn" onclick="selectOption(0)">1. 2個</div>
        <div class="opt-btn" onclick="selectOption(1)">2. 3個</div>
        <div class="opt-btn" onclick="selectOption(2)">3. 4個</div>
        <div class="opt-btn" onclick="selectOption(3)">4. 21個</div>
    </div>

    <div class="controls">
        <button class="check-btn" onclick="window.check()">檢查答案</button>
    </div>
</div>

<script>
    let selectedIdx = -1;
    const correctIdx = 1; // 3個

    function selectOption(idx) {
        selectedIdx = idx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((btn, i) => {
            if (i === idx) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });
        // Reset feedback when selecting new option
        const feedback = document.getElementById('feedback');
        feedback.classList.remove('show-feedback');
    }

    window.check = function() {
        if (selectedIdx === -1) return;

        const feedback = document.getElementById('feedback');
        feedback.classList.remove('show-feedback');
        
        // Trigger reflow
        void feedback.offsetWidth;

        if (selectedIdx === correctIdx) {
            feedback.textContent = "太棒了！正確";
            feedback.style.color = "var(--correct-color)";
            feedback.classList.add('success', 'correct');
            feedback.classList.remove('fail', 'wrong');
        } else {
            feedback.textContent = "再試試看喔！";
            feedback.style.color = "var(--wrong-color)";
            feedback.classList.add('fail', 'wrong');
            feedback.classList.remove('success', 'correct');
        }
        
        feedback.classList.add('show-feedback');
    };
</script>

<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
