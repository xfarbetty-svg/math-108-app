<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加型：樹上的小鳥</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #f0fdf4;
            color: #0f172a;
            padding: 6px; /* Reduced padding */
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px; /* Max width for mobile-first */
            background: #ffffff;
            border-radius: 12px; /* Smaller border radius */
            padding: 10px 12px; /* Reduced padding */
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #bbf7d0;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 2px; } /* Reduced margin */
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 14.5px; font-weight: 700; margin-bottom: 6px; color: #1e293b; line-height: 1.35; } /* Smaller font, reduced margin, added line-height */
        /* 390px 手機 One-Screen：整張 SVG viewBox 500x180 等比縮放，絕不用 px 絕對定位 */
        .tree-stage {
            position: relative;
            width: 100%;
            max-width: 480px; /* Fixed max-width */
            height: 175px; /* Fixed height */
            margin: 0 auto 6px; /* Reduced margin */
            border: 2px solid #86efac;
            border-radius: 14px;
            background: linear-gradient(180deg, #eff6ff 0%, #f0fdf4 70%);
            overflow: hidden;
        }
        .tree-stage svg { display: block; width: 100%; height: 100%; object-fit: contain; } /* Ensure SVG fits and scales */
        .bird-holder, .bird-g {
            transition: transform 0.6s cubic-bezier(.3,1.4,.5,1), opacity 0.6s ease;
        }
        .bird-g { cursor: pointer; }
        .badge-g { display: none; }
        .bird-g.counted .badge-g { display: block; }
        .count-strip {
            position: absolute;
            top: 10px;
            left: 12px;
            font-size: 11px; /* Smaller font */
            font-weight: 800;
            color: #14532d;
            background: rgba(255,255,255,0.85);
            border: 1.5px solid #86efac;
            border-radius: 6px; /* Smaller border radius */
            padding: 2px 8px; /* Smaller padding */
        }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 6px; flex-wrap: wrap; } /* Reduced margin */
        .fly-btn {
            min-height: 36px; /* Smaller min-height */
            background: #16a34a;
            color: #fff;
            font-size: 13px; /* Smaller font */
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 6px 14px; /* Smaller padding */
            cursor: pointer;
        }
        .fly-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .reset-btn {
            min-height: 36px; /* Smaller min-height */
            background: #ffffff;
            color: #334155;
            font-size: 13px; /* Smaller font */
            font-weight: 700;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 6px 14px; /* Smaller padding */
            cursor: pointer;
        }
        .equation-strip { text-align: center; font-size: 13.5px; font-weight: 800; color: #14532d; min-height: 1.2em; margin-bottom: 6px; } /* Smaller font, reduced margin, min-height */
        .opt-group { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 6px; } /* Reduced gap and margin */
        .opt-btn {
            min-height: 36px; /* Smaller min-height */
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 13px; /* Smaller font */
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            padding: 6px 12px; /* Smaller padding */
        }
        .opt-btn.active { background: #16a34a; border-color: #16a34a; color: #ffffff; }
        .footer-action { display: none; justify-content: center; margin-top: 6px; } /* Reduced margin */
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 14px; /* Smaller font */
            font-weight: 700;
            padding: 6px 28px; /* Smaller padding */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            min-height: 38px; /* Smaller min-height */
        }
        .result-banner {
            margin-top: 6px; /* Reduced margin */
            padding: 8px; /* Smaller padding */
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 13px; /* Smaller font */
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">忠孝 114-1 期末 九、4</span>
    </div>

    <div class="stem">樹上原來有 6 隻鳥，又飛來 3 隻後，樹上共有幾隻？</div>

    <div class="tree-stage" id="treeStage">
        <svg id="treeSvg" viewBox="0 0 500 180" role="img" aria-label="樹上的小鳥教具"></svg>
        <div class="count-strip" id="countStrip">樹上現在：6 隻</div>
    </div>

    <div class="action-row">
        <button class="fly-btn" id="flyBtn" onclick="flyIn()">🕊 再飛來 3 隻！</button>
        <button class="reset-btn" onclick="resetAll()">重來</button>
    </div>
    <div class="equation-strip" id="equationStrip">原來 6 隻，還沒有新朋友飛來。</div>

    <div class="opt-group" id="opts"></div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    const SVGNS = 'http://www.w3.org/2000/svg';

    // 小鳥（SVG 使用者座標系繪製，頭朝左、尾朝右，腳點為群組原點）
    const birdMarkup = (bodyColor) => `
        <g class="bird-g">
            <!-- 身體與胸腹 -->
            <path d="M-10,0 Q-15,-10 -5,-18 C5,-22 10,-12 12,-5 Q10,5 -5,8 C-10,7 -15,5 -10,0 Z"
                  fill="${bodyColor}" stroke="#3b82f6" stroke-width="1.2"/>
            <!-- 頭部 -->
            <circle cx="-10" cy="-12" r="6" fill="${bodyColor}" stroke="#3b82f6" stroke-width="1.2"/>
            <!-- 眼睛 -->
            <circle cx="-12" cy="-13" r="1.8" fill="#0f172a"/>
            <circle cx="-12.5" cy="-13.8" r="0.7" fill="#ffffff"/>
            <!-- 鳥喙 -->
            <polygon points="-16,-10 -20,-12 -16,-14" fill="#fbbf24" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- 翅膀 -->
            <path d="M-2,-10 Q3,-15 8,-10 Q3,-5 -2,-10 Z" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.2"/>
            <!-- 尾羽 -->
            <path d="M10,-2 Q14,-8 18,-6 Q16,0 10,-2 Z" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.2"/>
            <!-- 爪子 -->
            <path d="M-3,5 L-5,8 M0,5 L-2,8 M3,5 L1,8" stroke="#a16207" stroke-width="1.5" stroke-linecap="round"/>
            <g class="badge-g">
                <circle cy="-18" r="8.5" fill="#16a34a" stroke="#ffffff" stroke-width="1.5"/>
                <text class="badge-num" y="-14.2" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff"></text>
            </g>
        </g>`;

    // 樹幹與樹冠（通道三 Google AI Studio 算力池重繪：日系童話繪本風，500x180 viewBox）
    const treeLayer = `
        <g pointer-events="none">
          <defs>
            <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#713f12" />
              <stop offset="50%" stop-color="#a16207" />
              <stop offset="100%" stop-color="#854d0e" />
            </linearGradient>
            <linearGradient id="leafGradMain" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#34d399" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <linearGradient id="leafGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#a7f3d0" />
              <stop offset="100%" stop-color="#10b981" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
              <feOffset dx="0" dy="2" result="offsetblur" />
              <feComponentTransfer>
                <feFuncA type="linear" slope="0.2" />
              </feComponentTransfer>
              <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- 樹冠底層 (深色陰影層) -->
          <path d="M30 80 C 10 80, 0 110, 20 130 C 40 150, 80 145, 100 135 C 130 155, 180 150, 220 140 C 270 160, 340 155, 390 140 C 440 150, 480 130, 470 100 C 460 70, 420 60, 380 70 C 350 40, 280 30, 220 50 C 180 30, 110 30, 70 55 C 40 45, 20 60, 30 80 Z" fill="#047857" filter="url(#softShadow)" />

          <!-- 樹冠中層 (主色調) -->
          <path d="M50 85 C 35 85, 25 105, 40 120 C 60 135, 90 130, 110 120 C 140 140, 190 135, 230 125 C 280 145, 350 140, 400 125 C 440 135, 470 115, 460 95 C 450 75, 410 70, 380 80 C 350 55, 290 45, 240 65 C 200 45, 130 45, 90 65 C 65 55, 45 70, 50 85 Z" fill="url(#leafGradMain)" />

          <!-- 樹幹與主要枝幹（生動自然有機曲線） -->
          <path d="M45 180 C 55 178, 40 165, 50 150 C 60 130, 65 120, 75 110 C 90 95, 140 100, 200 92 C 280 82, 360 85, 435 95 L 435 105 C 360 95, 280 92, 200 102 C 140 110, 95 115, 85 130 C 75 155, 85 175, 70 180 Z" fill="url(#trunkGrad)" />
          
          <!-- 次要向上延伸枝幹 -->
          <path d="M72 115 C 65 100, 55 90, 58 70 C 60 55, 80 45, 95 40 L 100 48 C 85 52, 72 60, 70 75 C 68 90, 75 105, 82 112 Z" fill="#854d0e" opacity="0.9" />

          <!-- 樹皮細緻紋理 -->
          <g stroke="#582f0e" stroke-width="0.8" stroke-linecap="round" opacity="0.4">
            <path d="M58 170 Q 62 160 58 150" />
            <path d="M68 140 Q 72 130 68 120" />
            <path d="M150 102 Q 180 98 210 100" />
            <path d="M300 95 Q 330 92 360 96" />
          </g>

          <!-- 樹冠頂層 (高光透光層) -->
          <path d="M80 75 C 70 75, 65 85, 75 95 C 90 105, 120 100, 140 90 C 170 110, 220 105, 260 95 C 310 115, 380 110, 420 95 C 440 85, 430 70, 400 75 C 370 55, 310 50, 260 70 C 220 55, 150 55, 110 75 Z" fill="url(#leafGradLight)" opacity="0.8" />

          <!-- 裝飾小嫩葉與亮點 -->
          <g fill="#ecfdf5">
            <ellipse cx="120" cy="65" rx="4" ry="2" transform="rotate(-15 120 65)" />
            <ellipse cx="280" cy="55" rx="3" ry="1.5" transform="rotate(20 280 55)" />
            <ellipse cx="410" cy="85" rx="4" ry="2" transform="rotate(-10 410 85)" />
            <circle cx="180" cy="75" r="1.5" opacity="0.6" />
            <circle cx="340" cy="65" r="1.2" opacity="0.6" />
          </g>

          <!-- 樹枝末梢點綴嫩芽 -->
          <g fill="#10b981">
            <path d="M435 95 Q 445 90 455 98 Q 445 105 435 100 Z" />
            <path d="M95 40 Q 105 35 115 42 Q 105 50 95 45 Z" />
          </g>
        </g>`;

    // 6 隻原住鳥位置（樹冠與枝頭）＋ 3 隻飛入鳥的落點（棲息在橫向主樹枝上）
    const ORIG_POS = [
        { x: 95, y: 42 }, { x: 150, y: 52 }, { x: 210, y: 48 },
        { x: 270, y: 50 }, { x: 330, y: 56 }, { x: 390, y: 70 }
    ];
    const NEW_POS = [
        { x: 180, y: 86 }, { x: 250, y: 82 }, { x: 320, y: 84 }
    ];

    let userAnswer = null;
    const ANSWER_INDEX = 1;
    let arrived = 0;   // 已飛入 0..3

    function makeBird(pos, color) {
        const holder = document.createElementNS(SVGNS, 'g');
        holder.setAttribute('class', 'bird-holder');
        holder.innerHTML = birdMarkup(color);
        const bird = holder.firstElementChild;
        holder.style.transformOrigin = '0 0';
        holder.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(0.8)`;
        bird.addEventListener('click', () => {
            bird.classList.toggle('counted');
            renumber();
        });
        return holder;
    }

    function renumber() {
        // 依「已飛入」狀態重編 1..(6+arrived)
        let n = 1;
        document.querySelectorAll('#treeSvg .bird-g').forEach((el) => {
            const badge = el.querySelector('.badge-g');
            if (el.classList.contains('counted')) {
                badge.style.display = 'block';
                el.querySelector('.badge-num').textContent = n++;
            } else {
                badge.style.display = 'none';
            }
        });
        const total = 6 + arrived;
        document.getElementById('countStrip').innerText = '樹上現在：' + total + ' 隻';
        document.getElementById('equationStrip').innerHTML = arrived === 0
            ? '原來 6 隻，還沒有新朋友飛來。'
            : (arrived === 3
                ? '6 ＋ 3 ＝ <span style="color:#16a34a">9</span> 🎉'
                : `6 ＋ ${arrived} ＝ ${total}…還有 ${(3 - arrived)} 隻在路上`);
    }

    function flyIn() {
        if (arrived >= 3) return;
        const pos = NEW_POS[arrived];
        const holder = makeBird(pos, '#38bdf8');
        const bird = holder.firstElementChild;
        // 起飛點在畫面外下方（SVG 使用者座標系，隨 viewBox 等比縮放，390px 不跑版）
        holder.style.transform = `translate(${pos.x}px, 200px) scale(0.4)`;
        bird.style.opacity = '0';
        document.getElementById('treeSvg').appendChild(holder);
        arrived++;
        void holder.getBoundingClientRect(); // 強制 reflow → 觸發飛入動畫
        requestAnimationFrame(() => {
            holder.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(0.8)`;
            bird.style.opacity = '1';
        });
        document.getElementById('flyBtn').disabled = arrived === 3;
        renumber();
    }

    function resetAll() {
        arrived = 0;
        document.querySelectorAll('#treeSvg .bird-holder').forEach((el) => el.remove());
        document.getElementById('flyBtn').disabled = false;
        renumber();
    }

    function build() {
        const svg = document.getElementById('treeSvg');
        svg.innerHTML = treeLayer;
        ORIG_POS.forEach((p) => svg.appendChild(makeBird(p, '#f59e0b')));
        renumber();

        const group = document.getElementById('opts');
        [
            '6 - 3 = 3，共 3 隻',
            '6 + 3 = 9，共 9 隻',
            '6 + 4 = 10，共 10 隻',
            '9 - 6 = 3，共 3 隻'
        ].forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = function () {
                group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                userAnswer = idx;
            };
            group.appendChild(btn);
        });
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (userAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '先選一個算式再檢查喔！';
            return;
        }
        if (userAnswer === ANSWER_INDEX) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對！6＋3＝9，樹上共有 9 隻鳥（添加型：「又飛來」是變多，用加法）';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '再想想：「又飛來 3 隻」是變多還是變少？點小鳥數數看樹上現在有幾隻！';
        }
    }

    build();
</script>

</body>
</html>
