<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-12-Q09 天平個別單位等量代換秤重</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; --water:#cde8f7; --apple:#e85d5d; --block:#f2b279; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:12.5px; font-weight:800; line-height:1.4; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-num { font-size:11px; font-weight:800; fill:var(--ink-soft); }
.opts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:#fff; border-radius:10px; padding:5px 2px; font-size:12.5px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.status { text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-soft); min-height:18px; }
.status b { color:var(--ink); }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:6px; font-size:17px; font-weight:800; }
.v-eq .res { color:var(--red); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
.vq.show .v-eq { animation:pop .3s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>天平個別單位等量代換秤重</small>天平左邊放 1 瓶礦泉水，右邊放 6 個積木會剛好平衡；天平左邊放 1 顆蘋果，右邊放 4 個積木會剛好平衡。1 瓶礦泉水比 1 顆蘋果重幾個積木？</p>
  </div>
  <div class="card">
    <!-- 日系繪本場景：雙天平對照，水＝6積木、蘋果＝4積木 -->
    <svg class="scene-svg" viewBox="0 0 360 224" role="img" aria-label="左天平水與6積木平衡，右天平蘋果與4積木平衡">
      <text x="90"  y="18" class="t-caption">天平一：礦泉水</text>
      <text x="270" y="18" class="t-caption">天平二：蘋果</text>
      <line x1="40"  y1="66" x2="140" y2="66" stroke="var(--ink)" stroke-width="2.4"/>
      <line x1="220" y1="66" x2="320" y2="66" stroke="var(--ink)" stroke-width="2.4"/>
      <line x1="90"  y1="66" x2="90"  y2="96"  stroke="var(--ink)" stroke-width="2.4"/>
      <line x1="270" y1="66" x2="270" y2="96"  stroke="var(--ink)" stroke-width="2.4"/>
      <line x1="46"  y1="66" x2="34"  y2="80"  stroke="var(--ink)" stroke-width="2"/>
      <line x1="134" y1="66" x2="146" y2="80"  stroke="var(--ink)" stroke-width="2"/>
      <line x1="226" y1="66" x2="214" y2="80"  stroke="var(--ink)" stroke-width="2"/>
      <line x1="314" y1="66" x2="326" y2="80"  stroke="var(--ink)" stroke-width="2"/>
      <path d="M24 84 Q24 76 44 76 L64 84 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M116 84 Q136 76 156 84 L136 84 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4" transform="translate(-20 0)"/>
      <path d="M204 84 Q204 76 224 76 L244 84 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/>
      <path d="M296 84 Q316 76 336 84 L316 84 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="32" y="60" width="18" height="26" rx="4" fill="var(--water)" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="224" cy="70" r="12" fill="var(--apple)" stroke="var(--ink)" stroke-width="1.5"/>
      <path d="M224 58 Q226 52 232 52" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
      <g id="blocksL"></g>
      <g id="blocksR"></g>
      <g id="diff" opacity="0">
        <rect x="176" y="96" width="14" height="14" rx="3" fill="var(--red)" stroke="var(--ink)" stroke-width="1.2"/>
        <text x="183" y="126" class="t-num" text-anchor="middle" fill="var(--red)">多出來的</text>
      </g>
      <text x="90"  y="150" class="t-num" text-anchor="middle">1 瓶水＝6 個積木</text>
      <text x="270" y="150" class="t-num" text-anchor="middle">1 顆蘋果＝4 個積木</text>
      <text x="180" y="176" class="t-caption">都用積木來秤，多出幾個？</text>
    </svg>
    <div class="tools">
      <button type="button" class="tool-btn" id="tool">比一比多出來的積木 🟧</button>
    </div>
    <p class="status" id="status">兩台天平都用「積木」當作共同的秤，把兩個數字放在一起比。</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-eq"><span>6－4</span><span>＝</span><span class="res">2 個積木</span></div>
    <p class="v-notes">1 瓶水＝<b>6 個積木</b>、1 顆蘋果＝<b>4 個積木</b>。<br>同樣用積木來秤，6－4＝2，<br>所以礦泉水比蘋果重 <b>2 個積木</b>。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ['10 個積木', '6 個積木', '4 個積木', '2 個積木'];
  var ANSWER = 3;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  var status = document.getElementById('status');
  var tool = document.getElementById('tool');
  var on = false;
  var NS = 'http://www.w3.org/2000/svg';
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  function block(g, x, y, fill) {
    var r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', y);
    r.setAttribute('width', 13); r.setAttribute('height', 13);
    r.setAttribute('rx', 3);
    r.setAttribute('fill', fill || 'var(--block)');
    r.setAttribute('stroke', 'var(--ink)');
    r.setAttribute('stroke-width', 1.2);
    g.appendChild(r);
  }
  function buildBlocks() {
    var L = document.getElementById('blocksL');
    var R = document.getElementById('blocksR');
    while (L.firstChild) L.removeChild(L.firstChild);
    while (R.firstChild) R.removeChild(R.firstChild);
    for (var i = 0; i < 6; i++) block(L, 118 + (i % 3) * 16, 88 + Math.floor(i / 3) * 15, i >= 4 && on ? 'var(--red)' : 'var(--block)');
    for (var j = 0; j < 4; j++) block(R, 298 + (j % 3) * 16, 88 + Math.floor(j / 3) * 15);
  }
  buildBlocks();
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  tool.addEventListener('click', function () {
    on = !on;
    buildBlocks();
    document.getElementById('diff').setAttribute('opacity', on ? '1' : '0');
    status.innerHTML = on ? '水那邊比蘋果那邊<b>多了幾個積木</b>？數數看紅色的。' : '兩台天平都用「積木」當作共同的秤，把兩個數字放在一起比。';
    if (on) say('把兩邊的積木比一比，看看多出幾個。');
  });
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！6－4＝2，礦泉水比蘋果重 2 個積木。';
      vq.classList.add('show');
      say('答對！六減四等於二，重兩個積木。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：問「重多少」要把兩邊的積木數相減，不是相加。';
    say('再想想看：重多少要用相減的。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-12-Q09', answer: ANSWER };
})();
</script>
</body>
</html>
