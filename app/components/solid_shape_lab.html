<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>形體操作實驗室 · G1-S-1-2（描繪、複製、拼貼、堆疊）</title>
<style>
  :root{
    --wood-1:#d9a066; --wood-2:#b57b45; --wood-dark:#8a5a2e;
    --cream:#fdf6e9; --ink:#4e342e;
    --red:#e53935; --green:#43a047; --gold:#ffb300; --pink:#ff2d95; --blue:#1e88e5;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 15% 12%, #fff7e0 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #f3e3c3 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    font-family:"YuanTi TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  }
  #app{ max-width:960px; margin:0 auto; padding:3px 8px 6px; }

  /* ── 頂部迷你木牌 ── */
  header{
    background:linear-gradient(180deg,var(--wood-1),var(--wood-2));
    border:2.5px solid var(--wood-dark); border-radius:11px;
    box-shadow:0 2px 0 var(--wood-dark);
    padding:2px 10px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.25);
    display:flex; align-items:center; gap:7px; height:24px;
  }
  header h1{ margin:0; font-size:13.5px; letter-spacing:.5px; white-space:nowrap; }
  header .code{
    font-size:10px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.55);
    border-radius:7px; padding:0 6px; white-space:nowrap;
  }

  /* ── 五題模式分頁 ── */
  .tabs{ display:flex; gap:3px; margin-top:3px; }
  .tab{
    flex:1 1 0; min-height:44px; border:2.5px solid var(--wood-dark); border-radius:10px; cursor:pointer;
    background:linear-gradient(180deg,#fff3d6,#ffe1a8); color:var(--ink); text-shadow:none;
    font-weight:700; font-size:10.5px; line-height:1.12; padding:1px 1px;
    box-shadow:0 2px 0 var(--wood-dark); transition:transform .12s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  }
  .tab b{ font-size:11.5px; }
  .tab:active{ transform:translateY(1.5px); box-shadow:0 .5px 0 var(--wood-dark); }
  .tab.active{ background:linear-gradient(180deg,#ffdf6b,#ffc233); }

  /* ── 題目橫幅 ── */
  .q-banner{
    margin:3px 0 0; background:#fff; border:2.5px dashed var(--wood-2);
    border-radius:10px; padding:3px 9px; position:relative;
    font-size:12.5px; font-weight:700; line-height:1.35;
  }
  .q-banner .badge{
    display:inline-block; background:#ffe082; border:1.5px solid var(--gold);
    border-radius:6px; font-size:10.5px; padding:0 5px; margin-right:4px; vertical-align:1px; white-space:nowrap;
  }
  .q-banner .source{
    position:absolute; top:2px; right:6px; font-size:10.5px; color:#b9a58a; font-weight:400; letter-spacing:.3px;
  }
  .key-phrase{ color:var(--red); text-decoration:underline wavy var(--red) 1.5px; text-underline-offset:2px; }

  .mode{ display:none; }
  .mode.on{ display:block; }

  /* ── 共用按鈕列（熱區 ≥44px）── */
  .btn-row{ display:flex; gap:4px; margin-top:3px; }
  .chip, .act{
    flex:1 1 0; min-height:44px; border-radius:10px; cursor:pointer; font-family:inherit;
    font-weight:700; font-size:11px; line-height:1.15; padding:1px 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
    transition:transform .12s;
  }
  .chip{
    background:linear-gradient(180deg,#fff,#f3ead8); border:2px solid #c8a06a; color:var(--ink);
    box-shadow:0 2px 0 #a5814e;
  }
  .act{
    background:linear-gradient(180deg,#66bb6a,#43a047); border:2px solid #2e7d32; color:#fff;
    text-shadow:0 1px 0 rgba(0,0,0,.25); box-shadow:0 2px 0 #2e7d32;
  }
  .chip:active,.act:active{ transform:translateY(1.5px); box-shadow:0 .5px 0 #a5814e; }
  .chip.sel{ background:linear-gradient(180deg,#ffe082,#ffc233); border-color:var(--gold); box-shadow:0 2px 0 var(--gold); }
  .chip.pressing{ animation:press .3s ease; }
  @keyframes press{ 0%{transform:scale(1);} 45%{transform:scale(.88) translateY(2px);} 100%{transform:scale(1);} }

  .stage-box{
    margin-top:3px; border:2.5px solid var(--wood-dark); border-radius:11px;
    background:linear-gradient(180deg,#fffdf4,#fdf3dc);
    box-shadow:0 2px 0 var(--wood-dark); overflow:hidden;
  }
  .stage-box svg{ display:block; width:100%; height:auto; }

  /* ── 動態破招提示列 ── */
  .note{
    margin-top:3px; min-height:24px; background:#fff; border:2px dashed var(--wood-2); border-radius:9px;
    padding:1px 9px; font-size:11.5px; font-weight:700; line-height:1.3;
    display:flex; align-items:center; gap:6px;
  }
  .note .note-text{ flex:1 1 auto; }
  .note .zz{ color:var(--red); }
  .note .mini-btn{
    flex:0 0 auto; min-height:28px; border:2px solid var(--wood-dark); border-radius:8px; background:#fff3d6;
    font-weight:700; font-size:11px; padding:1px 9px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .note.good{ background:#e8f5e9; border-color:var(--green); color:#1b5e20; }
  .note.warn{ background:#fff3e0; border-color:var(--gold); color:#8d5b00; }

  /* ── 答題區（2×2 等寬 Grid + 檢查）── */
  .opt-grid{ display:grid; grid-template-columns:1fr 1fr; gap:3px; margin-top:3px; }
  .opt-btn{
    min-height:32px; border:2px solid #c8a06a; border-radius:9px; background:#fff; color:var(--ink);
    font-family:inherit; font-weight:700; font-size:11.5px; line-height:1.22; padding:1px 7px; cursor:pointer;
    box-shadow:0 2px 0 #a5814e; display:flex; align-items:center; justify-content:center;
  }
  .opt-btn:active{ transform:translateY(1.5px); }
  .opt-btn.active{ background:#1e88e5; border-color:#0d47a1; color:#fff; box-shadow:0 2px 0 #0d47a1; }
  .check-row{ display:flex; align-items:center; gap:8px; margin-top:3px; min-height:30px; }
  .check-btn{
    flex:0 0 auto; min-height:32px; padding:2px 22px; border:none; border-radius:9px; cursor:pointer;
    background:#263238; color:#fff; font-family:inherit; font-size:13px; font-weight:800;
    box-shadow:0 2px 0 #10171a;
  }
  .check-btn:active{ transform:translateY(1.5px); }
  .result{ flex:1 1 auto; font-size:11.5px; font-weight:700; line-height:1.3; }
  .result.success{ color:#1b5e20; }
  .result.fail{ color:#b71c1c; }

  /* ════ Q1 滾動與堆高 ════ */
  #stage1 .slope-face{ fill:#e3b578; stroke:var(--wood-dark); stroke-width:2; }
  #stage1 .ground{ stroke:var(--wood-dark); stroke-width:2.5; stroke-linecap:round; }
  #stage1 .platform{ fill:#c68b4f; stroke:var(--wood-dark); stroke-width:2; }
  #stage1 .lane-tag{ font-size:10px; font-weight:800; fill:var(--wood-dark); }
  .obj{ transition:transform .8s ease; }
  .wobble{ animation:wob .7s ease-in-out 2; transform-origin:50% 100%; }
  @keyframes wob{ 0%,100%{ transform:rotate(0deg);} 25%{ transform:rotate(-7deg);} 75%{ transform:rotate(7deg);} }

  /* ════ Q2 描描看 ════ */
  #paperSvg .paper{ fill:#ffffff; stroke:#c9b28a; stroke-width:2; }
  #paperSvg .slot{ fill:#fbf9f3; stroke:#e4d9c2; stroke-width:1.2; stroke-dasharray:4 3; }
  #paperSvg .stamped{ fill:none; stroke:var(--red); stroke-width:2.8; stroke-linejoin:round; stroke-linecap:round; }
  #paperSvg .stamp-pop{ animation:spop .3s ease; transform-box:fill-box; transform-origin:center; }
  @keyframes spop{ 0%{ transform:scale(1.6); opacity:0;} 60%{ transform:scale(.92); opacity:1;} 100%{ transform:scale(1);} }

  /* ════ Q3 等角積木 ════ */
  .blk{ cursor:pointer; transition:opacity .3s, filter .3s; }
  .blk .f-top{ fill:#fcf8ee; stroke:#6b4a26; stroke-width:1.5; stroke-linejoin:round; }
  .blk .f-l{ fill:#d4a86a; stroke:#6b4a26; stroke-width:1.5; stroke-linejoin:round; }
  .blk .f-r{ fill:#b8823f; stroke:#6b4a26; stroke-width:1.5; stroke-linejoin:round; }
  .blk.lit .f-top{ fill:#fff3c4; }
  .blk.lit .f-l{ fill:#ffca28; }
  .blk.lit .f-r{ fill:#f57f17; }
  .blk.lit{ filter:drop-shadow(0 0 5px rgba(255,179,0,1)); }
  .blk .num{ font-size:13px; font-weight:800; fill:#5d3800; opacity:0; pointer-events:none; text-anchor:middle; }
  .blk.lit .num{ opacity:1; }
  #hiddenFace{ opacity:0; transition:opacity .3s; pointer-events:none; }
  #hiddenFace polygon{ fill:rgba(229,57,53,.22); stroke:var(--red); stroke-width:2.2; stroke-dasharray:5 3; }
  #isoSvg.xray #hiddenFace{ opacity:1; }
  #isoSvg.xray .blk.top-block,
  #isoSvg.xray #blkLeft,
  #isoSvg.xray #blkRight{ opacity:.55; }
  #isoSvg.xray #blkBottom{ opacity:1; filter:drop-shadow(0 0 6px rgba(229,57,53,.85)); }
  #isoSvg.xray #blkBottom .f-top{ fill:#ffebee; stroke:var(--red); stroke-dasharray:4 2; }
  #isoSvg.xray #blkBottom .f-l{ fill:#ffcdd2; stroke:var(--red); stroke-dasharray:4 2; }
  #isoSvg.xray #blkBottom .f-r{ fill:#ef9a9a; stroke:var(--red); stroke-dasharray:4 2; }

  /* ════ Q4 拼圖卡 ════ */
  #stage4 .card-tri{ transition:transform .8s cubic-bezier(.35,1.15,.5,1); }
  #stage4 .card-tri polygon{ stroke:#7a4b00; stroke-width:2; stroke-linejoin:round; }
  #cardA polygon{ fill:#7ec8f7; } #cardB polygon{ fill:#ffb3d9; }
  #cardA.done polygon,#cardB.done polygon{ fill:#ffd54f; }
  #targetRect{ fill:rgba(255,213,79,0); stroke:#a5814e; stroke-width:2; stroke-dasharray:6 4; }
  #targetRect.done{ fill:rgba(255,213,79,.5); stroke:var(--gold); }
  #stage4 .goal-tag{ font-size:10px; font-weight:800; fill:#a5814e; }
  #stage4 .card-tag{ font-size:12px; font-weight:800; }

  /* ════ Q5 幾何火車 ════ */
  #stage5 .tag{ font-size:11px; font-weight:800; fill:#7a0033; opacity:0; }
  #stage5 svg .hl{ animation:hlpulse .9s ease 3; }
  #stage5 svg .hl .body-el{ stroke:var(--pink); stroke-width:3.2; }
  #stage5 svg .hl .tag{ opacity:1; }
  @keyframes hlpulse{ 0%,100%{ filter:none; } 50%{ filter:drop-shadow(0 0 5px rgba(255,45,149,.95)); } }

  @media (min-width:640px){
    #app{ padding:10px 16px 16px; }
    .q-banner{ font-size:15px; }
    .chip,.act,.opt-btn{ font-size:13px; }
    .note{ font-size:13px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>形體操作實驗室</h1>
    <span class="code">108 課綱 G1 · S-1-2</span>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="q-banner">
    <span class="badge" id="qBadge">第 1 題</span><span id="qStem"></span>
    <span class="source" id="qSource"></span>
  </div>

  <!-- ════════ Q1 滾動與堆高 ════════ -->
  <section class="mode" id="mode1">
    <div class="stage-box" id="stage1">
      <svg viewBox="0 0 360 112" id="rollSvg" aria-label="滾動與堆高測試台">
        <!-- 左：斜坡滾動測試區 -->
        <text class="lane-tag" x="12" y="12">① 滾動測試（斜坡）</text>
        <polygon class="slope-face" points="12,100 88,44 88,100"></polygon>
        <line class="ground" x1="4" y1="100" x2="168" y2="100"></line>
        <!-- 皮球（球體） -->
        <g id="obBall">
          <circle r="11" fill="#e53935" stroke="#a02723" stroke-width="2"></circle>
          <path d="M -7,-6 Q 0,-1 -7,7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"></path>
          <circle cx="-3" cy="-4" r="2" fill="#fff" opacity=".8"></circle>
        </g>
        <!-- 木積木（正方體） -->
        <g id="obCube">
          <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#d99a4e" stroke="#8a5a2e" stroke-width="2"></rect>
          <rect x="-10" y="-10" width="20" height="6" rx="2" fill="#ecc389" stroke="#8a5a2e" stroke-width="1.2"></rect>
          <circle cx="0" cy="2" r="2.8" fill="#8a5a2e" opacity=".55"></circle>
        </g>
        <!-- 茶葉罐（圓柱）橫放 -->
        <g id="obCylL">
          <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#4fb3bf" stroke="#22707a" stroke-width="2"></rect>
          <ellipse cx="14" cy="0" rx="4.5" ry="10" fill="#a7e0e6" stroke="#22707a" stroke-width="1.8"></ellipse>
          <rect x="-9" y="-5" width="12" height="10" rx="2" fill="#fff" opacity=".85"></rect>
        </g>
        <!-- 茶葉罐立放 -->
        <g id="obCylS" style="display:none">
          <rect x="-10" y="-18" width="20" height="36" rx="3" fill="#4fb3bf" stroke="#22707a" stroke-width="2"></rect>
          <ellipse cx="0" cy="-18" rx="10" ry="4" fill="#a7e0e6" stroke="#22707a" stroke-width="1.8"></ellipse>
          <rect x="-6" y="-10" width="12" height="10" rx="2" fill="#fff" opacity=".85"></rect>
        </g>
        <!-- 右：堆高測試平台 -->
        <text class="lane-tag" x="196" y="12">② 堆高測試（平台）</text>
        <line class="ground" x1="188" y1="104" x2="356" y2="104"></line>
        <rect class="platform" x="234" y="92" width="112" height="12" rx="2"></rect>
        <!-- 堆高測試用副本 -->
        <g id="stCube" class="obj" opacity="0">
          <rect x="-10" y="-10" width="20" height="20" rx="2" fill="#d99a4e" stroke="#8a5a2e" stroke-width="2"></rect>
          <rect x="-10" y="-10" width="20" height="6" rx="2" fill="#ecc389" stroke="#8a5a2e" stroke-width="1.2"></rect>
        </g>
        <g id="stCylL" class="obj" opacity="0">
          <rect x="-14" y="-10" width="28" height="20" rx="3" fill="#4fb3bf" stroke="#22707a" stroke-width="2"></rect>
          <ellipse cx="14" cy="0" rx="4.5" ry="10" fill="#a7e0e6" stroke="#22707a" stroke-width="1.8"></ellipse>
        </g>
        <g id="stCylS" class="obj" opacity="0">
          <rect x="-10" y="-18" width="20" height="36" rx="3" fill="#4fb3bf" stroke="#22707a" stroke-width="2"></rect>
          <ellipse cx="0" cy="-18" rx="10" ry="4" fill="#a7e0e6" stroke="#22707a" stroke-width="1.8"></ellipse>
        </g>
        <g id="stBall" class="obj" opacity="0">
          <circle r="11" fill="#e53935" stroke="#a02723" stroke-width="2"></circle>
          <path d="M -7,-6 Q 0,-1 -7,7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"></path>
        </g>
      </svg>
    </div>
    <div class="btn-row">
      <button class="act" id="btnRoll">▶ 滾動測試<small>溜下斜坡</small></button>
      <button class="act" id="btnStack">▦ 堆高測試<small>疊上平台</small></button>
      <button class="chip sel" id="chipBall" data-obj="ball">🔴 皮球<small>球體</small></button>
      <button class="chip" id="chipCube" data-obj="cube">🧊 木積木<small>正方體</small></button>
      <button class="chip" id="chipCyl" data-obj="cyl">🛢 茶葉罐<small>圓柱</small></button>
    </div>
    <div class="note"><span class="note-text" id="note1"></span><span class="note-tools" id="tools1"></span></div>
    <div class="opt-grid" id="opts1"></div>
    <div class="check-row"><button class="check-btn" id="check1">檢查答案</button><span class="result" id="result1"></span></div>
  </section>

  <!-- ════════ Q2 物品底面描描看 ════════ -->
  <section class="mode" id="mode2">
    <div class="stage-box" id="stage2">
      <svg viewBox="0 0 360 112" id="paperSvg" aria-label="白紙蓋印描繪區">
        <rect class="paper" x="24" y="4" width="312" height="104" rx="6"></rect>
        <text x="36" y="18" font-size="10" font-weight="800" fill="#b9a58a">白紙 · 把物品平平的底面蓋下來描一描</text>
        <g id="slots">
          <rect class="slot" x="44" y="24" width="128" height="36" rx="4"></rect>
          <rect class="slot" x="188" y="24" width="128" height="36" rx="4"></rect>
          <rect class="slot" x="44" y="66" width="128" height="36" rx="4"></rect>
          <rect class="slot" x="188" y="66" width="128" height="36" rx="4"></rect>
        </g>
        <g id="stamps"></g>
      </svg>
    </div>
    <div class="btn-row" id="stampRow">
      <button class="chip" data-kind="cyl">🛢 圓柱<small>→ 圓形</small></button>
      <button class="chip" data-kind="cube">🧊 正方體<small>→ 正方形</small></button>
      <button class="chip" data-kind="tissue">📦 面紙盒<small>→ 長方形</small></button>
      <button class="chip" data-kind="tri">🔺 三角柱<small>→ 三角形</small></button>
      <button class="chip" id="btnClear">🧽 擦乾淨<small>重蓋</small></button>
    </div>
    <div class="note"><span class="note-text" id="note2"></span><span class="note-tools" id="tools2"></span></div>
    <div class="opt-grid" id="opts2"></div>
    <div class="check-row"><button class="check-btn" id="check2">檢查答案</button><span class="result" id="result2"></span></div>
  </section>

  <!-- ════════ Q3 等角透視積木點數 ════════ -->
  <section class="mode" id="mode3">
    <div class="stage-box" id="stage3">
      <svg viewBox="0 0 360 126" id="isoSvg" aria-label="等角透視立體城堡">
        <line x1="80" y1="120" x2="280" y2="120" stroke="#c8b28a" stroke-width="2" stroke-dasharray="8 6"></line>
        <!-- 底層後 (0,0,0) - 被上層壓住且被前兩塊擋住的底座 -->
        <g class="blk" id="blkBottom">
          <polygon class="f-top" points="180,36 210,52 180,68 150,52"></polygon>
          <polygon class="f-l" points="150,52 180,68 180,100 150,84"></polygon>
          <polygon class="f-r" points="180,68 210,52 210,84 180,100"></polygon>
          <text class="num" x="180" y="60">①</text>
        </g>
        <!-- X-Ray 透視頂面標示 -->
        <g id="hiddenFace"><polygon points="180,36 210,52 180,68 150,52"></polygon></g>
        <!-- 上層 (0,0,1) - 穩穩立在底座正上方 -->
        <g class="blk top-block" id="blkTop">
          <polygon class="f-top" points="180,4 210,20 180,36 150,20"></polygon>
          <polygon class="f-l" points="150,20 180,36 180,68 150,52"></polygon>
          <polygon class="f-r" points="180,36 210,20 210,52 180,68"></polygon>
          <text class="num" x="180" y="26">②</text>
        </g>
        <!-- 底層左前 (0,1,0) -->
        <g class="blk" id="blkLeft">
          <polygon class="f-top" points="150,52 180,68 150,84 120,68"></polygon>
          <polygon class="f-l" points="120,68 150,84 150,116 120,100"></polygon>
          <polygon class="f-r" points="150,84 180,68 180,100 150,116"></polygon>
          <text class="num" x="150" y="76">③</text>
        </g>
        <!-- 底層右前 (1,0,0) -->
        <g class="blk" id="blkRight">
          <polygon class="f-top" points="210,52 240,68 210,84 180,68"></polygon>
          <polygon class="f-l" points="180,68 210,84 210,116 180,100"></polygon>
          <polygon class="f-r" points="210,84 240,68 240,100 210,116"></polygon>
          <text class="num" x="210" y="76">④</text>
        </g>
      </svg>
    </div>
    <div class="btn-row">
      <button class="act" id="btnXray">🔦 X-Ray 光透<small>看穿看不見的積木</small></button>
      <button class="chip" id="countChip">👀 已點數：0 / 4 個積木<small>點積木亮金光</small></button>
    </div>
    <div class="note"><span class="note-text" id="note3"></span><span class="note-tools" id="tools3"></span></div>
    <div class="opt-grid" id="opts3"></div>
    <div class="check-row"><button class="check-btn" id="check3">檢查答案</button><span class="result" id="result3"></span></div>
  </section>

  <!-- ════════ Q4 三角形圖卡拼拼看 ════════ -->
  <section class="mode" id="mode4">

let snd = null;
function thump(){ /* 蓋印／點數音效：WebAudio 純合成，無外部檔案 */
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return; /* DEGRADED:環境無 AudioContext 時略過音效（互動回饋仍有動畫） */
    /* 只在真實使用者手勢後啟用，避免未授權自動播放；機器人/無手勢環境靜默略過 */
    if(!snd && !(navigator.userActivation && navigator.userActivation.hasBeenActive)) return;
    snd = snd || new AC();
    const o = snd.createOscillator(), g = snd.createGain();
    o.type = 'sine'; o.frequency.value = 150;
    g.gain.setValueAtTime(.35, snd.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, snd.currentTime + .18);
    o.connect(g); g.connect(snd.destination);
    o.start(); o.stop(snd.currentTime + .2);
  }catch(e){ /* DEGRADED:音效播放失敗不影響操作流程 */ }
}
async function anim(el, transform, dur, ease){
  el.style.transition = 'transform ' + dur + 'ms ' + (ease || 'ease');
  el.style.transform = transform;
  await sleep(dur + 30);
}

  const chip = document.querySelector('#stampRow .chip[data-kind="' + kind + '"]');
  if(chip){ chip.classList.remove('pressing'); void chip.offsetWidth; chip.classList.add('pressing'); }
  thump();
  const idx = q2.count % 4;
  q2.count++; q2.kinds.push(kind);
  const [cx, cy] = Q2_SLOT[idx];
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', 'stamped stamp-pop');
  g.setAttribute('transform', 'translate(' + cx + ',' + cy + ') rotate(' + ((q2.count * 47) % 9 - 4) + ')');
  g.innerHTML = Q2_SHAPE[kind].svg;
  $('stamps').appendChild(g);
  const names = q2.kinds.slice(-4).map((k) => Q2_SHAPE[k].label).join('、');
  setNote(2, '蓋好了！紙上出現<b>' + Q2_SHAPE[kind].label + '</b>（已蓋 ' + q2.count + ' 個印：' + names + '）。<span class="zz">立體的平底 = 平面圖形！</span>', 'good');
}
function q2Init(){
  document.querySelectorAll('#stampRow .chip[data-kind]').forEach((c) => { c.onclick = () => q2Stamp(c.dataset.kind); });
  $('btnClear').onclick = () => {
    $('stamps').innerHTML = ''; q2.count = 0; q2.kinds = [];
    setNote(2, '紙擦乾淨了！再蓋一次看看，每次蓋出來的形狀都一樣喔。', '');
  };
}

/* ════════ Q3：等角透視積木點數 ════════ */
const q3 = { lit:new Set() };
const Q3_NAME = { blkBottom:'底層後面那塊', blkTop:'上面那塊', blkRight:'底層右邊那塊', blkLeft:'底層左邊那塊' };
function q3Init(){
  document.querySelectorAll('#stage3 .blk').forEach((b) => {
    b.onclick = () => {
      const id = b.id;
      if(q3.lit.has(id)){ q3.lit.delete(id); b.classList.remove('lit'); }
      else{ q3.lit.add(id); b.classList.add('lit'); thump(); }
      $('countChip').innerHTML = '👀 已點數：' + q3.lit.size + ' / 4 個積木<small>點積木亮金光</small>';
      if(q3.lit.size === 4){
        setNote(3, '全部點亮了！<span class="zz">城堡一共用了 4 個正方體積木</span>：底層 3 塊 ＋ 上層 1 塊。', 'good');
      }else{
        setNote(3, '點亮了' + Q3_NAME[id] + '！已點數 ' + q3.lit.size + ' 個。想一想：還有沒有被壓住看不到的？', '');
      }
    };
  });
  $('btnXray').onclick = () => {
    const on = $('isoSvg').classList.toggle('xray');
    $('btnXray').innerHTML = on ? '🔦 關閉光透<small>恢復正常視線</small>' : '🔦 X-Ray 光透<small>看穿看不見的積木</small>';
    setNote(3, on
      ? '光透開啟！<span class="zz">看到了嗎？上層積木底下還壓著 1 塊</span>，虛線紅框就是它被藏住的底面，千萬不能漏數！'
      : '光透關閉。記住喔：看起來 3 塊，其實上層底下還藏著 1 塊，一共是 4 塊！', 'warn');
  };
}

/* ════════ Q4：三角形圖卡拼拼看 ════════ */
const q4 = {
  A:{ rot:1, flip:false, cx:52, cy:48 },
  B:{ rot:2, flip:false, cx:116, cy:84 },
  done:false
};
function q4Apply(){
  ['A','B'].forEach((k) => {
    const s = q4[k];
    $('card' + k).style.transform =
      'translate(' + s.cx + 'px,' + s.cy + 'px) rotate(' + (s.rot * 90) + 'deg) scale(' + (s.flip ? -1 : 1) + ',1) translate(-26px,-15px)';
  });
}
function q4Check(){
  if(q4.done) return;
  if(q4.A.rot === 2 && !q4.A.flip && q4.B.rot === 0 && !q4.B.flip){
    q4.done = true;
    $('cardA').classList.add('done'); $('cardB').classList.add('done');
    $('targetRect').classList.add('done');
    $('cardA').style.transform = 'translate(274px,56px) rotate(180deg) scale(2)';
    $('cardB').style.transform = 'translate(274px,56px) scale(2)';
    thump();
    setNote(4, '拼出長方形了！🎉 <span class="zz">兩個完全一樣的直角三角形，斜邊對斜邊，就是一個長方形！</span>', 'good');
  }else{
    setNote(4, '還沒拼起來～<span class="zz">提示：斜邊（最長的那一邊）要對斜邊</span>，把圖卡轉到剛剛好再試試！', '');
  }
}
function q4Init(){
  $('btnRotA').onclick = () => { if(q4.done) return; q4.A.rot = (q4.A.rot + 1) % 4; q4Apply(); q4Check(); };
  $('btnRotB').onclick = () => { if(q4.done) return; q4.B.rot = (q4.B.rot + 1) % 4; q4Apply(); q4Check(); };
  $('btnFlipA').onclick = () => { if(q4.done) return; q4.A.flip = !q4.A.flip; q4Apply(); q4Check(); };
  $('btnFlipB').onclick = () => { if(q4.done) return; q4.B.flip = !q4.B.flip; q4Apply(); q4Check(); };
  const rb = document.createElement('button');
  rb.className = 'mini-btn'; rb.textContent = '🔄 重來';
  rb.onclick = () => {
    q4.A.rot = 1; q4.A.flip = false; q4.B.rot = 2; q4.B.flip = false; q4.done = false;
    $('cardA').classList.remove('done'); $('cardB').classList.remove('done');
    $('targetRect').classList.remove('done');
    q4Apply();
    setNote(4, QS[3].hint, '');
  };
  $('tools4').appendChild(rb);
  q4Apply();
}

/* ════════ Q5：幾何圖形火車數數看 ════════ */
const Q5_COUNT = { circle:4, rect:2, sq:3, tri:2 };
const Q5_LABEL = { circle:'圓形', rect:'長方形', sq:'正方形', tri:'三角形' };
function q5Init(){
  document.querySelectorAll('.shape-btn').forEach((b) => {
    b.onclick = () => {
      const shape = b.dataset.shape;
      const active = b.classList.contains('sel');
      document.querySelectorAll('.shape-btn').forEach((x) => x.classList.remove('sel'));
      document.querySelectorAll('#stage5 .sh').forEach((g) => g.classList.remove('hl'));
      if(!active){
        b.classList.add('sel');
        document.querySelectorAll('#stage5 .sh[data-shape="' + shape + '"]').forEach((g) => g.classList.add('hl'));
        setNote(5, Q5_LABEL[shape] + '亮起來了，即時統計：<b>' + Q5_COUNT[shape] + ' 個</b>！照著編號 1、2、3… 指著數一遍。', 'good');
      }else{
        setNote(5, QS[4].hint, '');
      }
    };
  });
}

/* ════════ 啟動 ════════ */
let curQ = 1;
buildTabs();
initOpts();
q1Init(); q2Init(); q3Init(); q4Init(); q5Init();
const urlQ = parseInt(new URLSearchParams(location.search).get('q'), 10);
showQ(QS.some((d) => d.q === urlQ) ? urlQ : 1);
</script>
