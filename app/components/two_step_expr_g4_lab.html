<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>N-4-3 兩步驟應用問題與併式・觀念小教室</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
  :root{--n43-bg:var(--bg-main);--n43-card:var(--bg-card);--n43-line:var(--border-color);--n43-ink:var(--text-primary);--n43-sub:var(--text-secondary);--n43-a:var(--accent-primary);--n43-b:var(--accent-mint);--n43-c:var(--accent-sky);--n43-warn:#c2410c;--n43-hl:#fde68a}
  html[data-theme="dark"]{--n43-warn:#fca5a5;--n43-hl:#7c5c1e;--n43-bg:#12151a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{font-family:'Segoe UI','Microsoft JhengHei',Tahoma,sans-serif;background:var(--n43-bg);color:var(--n43-ink);margin:0;padding:8px;height:auto;min-height:0;overflow-x:hidden}
  .wrap{width:100%;max-width:100%;display:flex;flex-direction:column;gap:4px}
  .head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10px;color:var(--n43-sub)}
  .head b{color:var(--n43-ink);font-size:13px}
  .mini{border:1px solid var(--n43-line);background:var(--n43-card);color:var(--n43-ink);font-size:10px;border-radius:12px;padding:3px 8px;cursor:pointer}
  .mini.pri{background:var(--n43-a);color:#fff;border-color:var(--n43-a)}
  .src{font-size:9px;color:var(--n43-sub);line-height:1.2;min-height:12px}
  .stem{background:var(--n43-card);border-left:4px solid var(--n43-a);border-radius:9px;padding:4px 7px;font-size:10.5px;line-height:1.32;min-height:30px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{border:1px solid var(--n43-line);background:var(--n43-card);color:var(--n43-sub);border-radius:13px;padding:3px 8px;font-size:9.5px;cursor:pointer}
  .tab.on{background:var(--n43-a);color:#fff;border-color:var(--n43-a)}
  .board{background:var(--n43-card);border:1px solid var(--n43-line);border-radius:11px;padding:5px 7px;min-height:112px;max-height:150px;overflow:auto}
  .cap{font-size:9px;color:var(--n43-sub);margin-bottom:3px}
  .pool{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:34px;padding:3px;border:1px dashed var(--n43-line);border-radius:8px}
  .card{border:1px solid var(--n43-a);background:color-mix(in srgb,var(--n43-a) 10%,var(--n43-card));color:var(--n43-ink);border-radius:7px;padding:5px 7px;font-size:10.5px;font-weight:700;cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
  .card.paren{border-color:var(--n43-c);background:color-mix(in srgb,var(--n43-c) 14%,var(--n43-card))}
  .slots{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .slot{min-width:44px;min-height:26px;border:2px dashed var(--n43-line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--n43-sub);padding:2px}
  .slot .card{cursor:default}
  .slot.filled{border-style:solid;border-color:var(--n43-b)}
  .blk{display:inline-block;border:1px solid var(--n43-line);border-radius:6px;padding:3px 6px;margin:2px 3px 2px 0;font-size:10.5px;cursor:pointer;background:var(--n43-card);color:var(--n43-ink)}
  .blk.hit{outline:2px solid var(--n43-b);background:color-mix(in srgb,var(--n43-b) 20%,transparent)}
  .blk.bad{outline:2px solid var(--n43-warn);color:var(--n43-warn)}
  .seg{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin:3px 0}
  .segbar{height:19px;border-radius:4px;background:color-mix(in srgb,var(--n43-c) 30%,transparent);border:1px solid var(--n43-c);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--n43-ink);padding:0 5px;white-space:nowrap}
  .segbar.cut{background:color-mix(in srgb,var(--n43-warn) 18%,transparent);border-color:var(--n43-warn)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .opt{border:1px solid var(--n43-line);background:var(--n43-card);color:var(--n43-ink);border-radius:8px;padding:4px 6px;font-size:10px;cursor:pointer;text-align:left}
  .opt.sel{border-color:var(--n43-a);background:color-mix(in srgb,var(--n43-a) 14%,transparent)}
  .opt.right{border-color:var(--n43-b);background:color-mix(in srgb,var(--n43-b) 18%,transparent)}
  .opt.wrong{border-color:var(--n43-warn)}
  .steps{background:var(--n43-card);border:1px solid var(--n43-line);border-radius:9px;padding:4px 7px;min-height:30px;max-height:48px;overflow:auto;font-size:9.5px;line-height:1.3}
  .steps b{color:var(--n43-a)}
  .ln{opacity:0;transition:opacity .2s}
  .ln.show{opacity:1}
  .act{display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
  .msg{font-size:9.5px;color:var(--n43-b);min-height:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><b>N-4-3 兩步驟・併式</b><span id="qtag">第 ? 題 / 10</span><button class="mini" id="theme">Dark</button></div>
  <div class="src" id="src"></div>
  <div class="stem" id="stem"></div>
  <div class="tabs"><button class="tab on" data-t="0">① 算式合併天平</button><button class="tab" data-t="1">② 運算順序階梯</button><button class="tab" data-t="2">③ 線段圖配對</button></div>
  <div class="board"><div class="cap" id="cap"></div><div id="zone"></div></div>
  <div class="opts" id="opts"></div>
  <div class="steps" id="steps"></div>
  <div class="act"><button class="mini pri" id="next">下一步 ▸</button><button class="mini" id="reset">重置教具</button><span class="msg" id="msg"></span></div>
</div>
<script>
const P=new URLSearchParams(location.search);
let Q=Math.max(1,Math.min(10,parseInt(P.get('q')||'1',10)||1));
const L=[
 {s:'高雄市獅湖國小 113-1 期末 p3・六、應用題 3',stem:'老師把 240 條彩色紙藤平分給 12 位學生，5 位學生共拿到幾條紙藤？把做法用一個算式記下來。',c:['20 條','60 條','100 條','1200 條'],ans:2,exp:'240÷12×5',s1:'240÷12＝20（一位學生拿到的條數）',s2:'20×5＝100（五位學生共拿到）',trap:'240÷(12×5)＝4（把 12 位與 5 位先相乘，意義全錯）',need:false,first:'240÷12',chunks:['240÷12','12×5'],seg:['240 條','÷12 位','×5 位 → 100']},
 {s:'高雄市獅湖國小 113-1 期末 p3・六、應用題 7',stem:'農夫採了 568 顆草莓，不小心把 28 顆壓爛了，剩下的每 20 顆裝成 1 盒，可裝成幾盒？把做法用一個有括號的算式記下來。',c:['27 盒','29 盒','28 盒','30 盒'],ans:0,exp:'(568−28)÷20',s1:'568−28＝540（沒壓爛的草莓）',s2:'540÷20＝27（盒）',trap:'568−28÷20＝554（漏括號會先算 28÷20，錯）',need:true,first:'568−28',chunks:['568−28','28÷20'],seg:['568 顆','−28 壓爛','÷20 → 27 盒']},
 {s:'高雄市永安國小 114-1 期末 p2・四(5)',stem:'丹丹到文具行買文具，一本著色簿 40 元，一盒水彩 199 元。丹丹買 7 本著色簿和一盒水彩，共要付幾元？合併成一個有括號的算式。',c:['280 元','1673 元','279 元','479 元'],ans:3,exp:'(40×7)＋199',s1:'40×7＝280（7 本著色簿）',s2:'280＋199＝479（元）',trap:'(40＋199)×7＝1673（把水彩也買 7 盒，錯）',need:false,first:'40×7',chunks:['40×7','7＋199'],seg:['7 本 ×40','＋水彩 199','→ 479 元']},
 {s:'高雄市永安國小 114-1 期末 p2・六(3)',stem:'鉛筆 10 枝賣 60 元，皮皮有 48 元，可以買幾枝鉛筆？',c:['80 枝','8 枝','48 枝','6 枝'],ans:1,exp:'48÷(60÷10)',s1:'60÷10＝6（每枝鉛筆的價錢）',s2:'48÷6＝8（枝）',trap:'48÷60÷10＝0.08（漏括號會連除兩次，錯）',need:true,first:'60÷10',chunks:['48÷60','60÷10'],seg:['10 枝 60 元','每枝 6 元','48÷6 → 8 枝']},
 {s:'高雄市永安國小 114-1 期末 p2・六(4)',stem:'5 籃釋迦共重 6500 公克，一個空籃子重 300 公克，每籃平均裝幾公克的釋迦？',c:['1000 公克','1300 公克','1150 公克','1240 公克'],ans:0,exp:'(6500−300×5)÷5',s1:'300×5＝1500（空籃總重）；6500−1500＝5000（釋迦淨重）',s2:'5000÷5＝1000（公克/籃）',trap:'6500−300×5÷5＝6350（先算 300×5÷5，錯）',need:true,first:'300×5',chunks:['6500−300','300×5'],seg:['6500 g','−空籃 1500','÷5 → 1000 g']},
 {s:'臺北市南湖國小 111-1 期末 p3・園遊會應用',stem:'奇諾比奧在園遊會時，把 240 顆巧克力平分裝成 12 包，每包賣 120 元，請問平均一顆巧克力賣多少元？（把作法用一個算式記下來）',c:['20 元','24 元','6 元','12 元'],ans:2,exp:'120×12÷240',s1:'120×12＝1440（12 包總價）',s2:'1440÷240＝6（元/顆）',trap:'240÷12×120＝2400（把包數與價錢調反，錯）',need:false,first:'120×12',chunks:['120×12','12÷240'],seg:['12 包 ×120','÷240 顆','→ 6 元/顆']},
 {s:'臺北市南湖國小 111-2 期中 p1・選擇題 1',stem:'學校舉辦兒童節闖關活動，一袋餅乾有 56 包，關主把 4 袋餅乾平分給 7 個班級，每個班級會分到幾包餅乾？',c:['8 包','32 包','14 包','224 包'],ans:1,exp:'56×4÷7',s1:'56×4＝224（4 袋共幾包）',s2:'224÷7＝32（每班）',trap:'4×7÷56＝0.5（被分與分的對象調反，錯）',need:false,first:'56×4',chunks:['56×4','4÷7'],seg:['4 袋 ×56','÷7 班','→ 32 包']},
 {s:'臺北市南湖國小 112-1 期末 p3・應用題 4',stem:'阿二水果行進貨 840 顆蘋果，老闆將蘋果分裝成 70 盒水果禮盒，今天賣出 12 盒水果禮盒，共賣出幾顆蘋果？',c:['12 顆','120 顆','10080 顆','144 顆'],ans:3,exp:'840÷70×12',s1:'840÷70＝12（每盒蘋果數）',s2:'12×12＝144（12 盒賣出）',trap:'840÷(70×12)＝1（先乘會把盒子總數當除數，錯）',need:false,first:'840÷70',chunks:['840÷70','70×12'],seg:['840 顆 ÷70','每盒 12 顆','×12 盒 → 144']},
 {s:'臺北市南湖國小 113-1 期末 p3・應用題 3',stem:'一個月餅賣 25 元，每 6 個裝一盒，媽媽身上有 900 元，她最多可以買幾盒月餅？',c:['6 盒','36 盒','150 盒','60 盒'],ans:0,exp:'900÷25÷6',s1:'900÷25＝36（900 元可買幾個）',s2:'36÷6＝6（盒）',trap:'900÷(25÷6)＝216（先算 25÷6，錯）',need:false,first:'900÷25',chunks:['900÷25','25÷6'],seg:['900 元 ÷25','36 個 ÷6','→ 6 盒']},
 {s:'高雄市獅湖國小 114-1 期末 p3・五(4)',stem:'小春每小時走 1040 公尺，小夏每小時走 1018 公尺，兩個人同時同地同方向走 5 小時之後，兩人相距幾公尺？（把做法用一個算式記下來）',c:['22 公尺','5290 公尺','110 公尺','1100 公尺'],ans:2,exp:'(1040−1018)×5',s1:'1040−1018＝22（每小時相差）',s2:'22×5＝110（5 小時後相距）',trap:'1040−1018×5＝1050（先乘會算成小夏走 5 小時，錯）',need:true,first:'1040−1018',chunks:['1040−1018','1018×5'],seg:['每小時差 22','×5 小時','→ 110 m']}
];
if(P.get('theme')==='dark'||P.get('theme')==='light')document.documentElement.dataset.theme=P.get('theme');
const d=L[Q-1],$=id=>document.getElementById(id);
$('qtag').textContent='第 '+Q+' 題 / 10';$('src').textContent='真題出處：'+d.s;$('stem').textContent=d.stem;
let picked=-1,stepN=0,mode=0,placed=[null,null,null,null],hitFirst=-1;
function card(k,txt,paren){return '<div class="card'+(paren?' paren':'')+'" data-k="'+k+'">'+txt+'</div>';}
function renderOpts(){
  $('opts').innerHTML=d.c.map((x,i)=>'<div class="opt'+(picked===i?(i===d.ans?' right':' wrong'):'')+'" data-i="'+i+'">'+(i+1)+'. '+x+'</div>').join('');
  $('opts').onclick=e=>{const o=e.target.closest('.opt');if(!o||picked>=0)return;picked=+o.dataset.i;stepN=0;renderOpts();renderSteps();$('msg').textContent=picked===d.ans?'答對了！點「下一步」看算理':'再想想，點下一步看拆解';};
}
function renderSteps(){
  $('steps').innerHTML=picked<0?'<div>選出答案後，點「下一步」看算理拆解。</div>':
    ['<div class="ln'+(stepN>0?' show':'')+'">① 先算：'+d.s1+'</div>',
     '<div class="ln'+(stepN>1?' show':'')+'">② 後算：'+d.s2+'</div>',
     '<div class="ln'+(stepN>2?' show':'')+'"><b>併式：</b>'+d.exp+'　<b>陷阱：</b>'+d.trap+'</div>'].join('');
}
function render0(){
  $('cap').textContent='活動一：拖曳算式積木與括號卡，拼出單一併式（真實 pointerdown / move / up）';
  const e=d.exp, f=d.first;
  let asm;
  if(e.startsWith('(')){const close=e.indexOf(')');asm=['(',e.slice(1,close),e.slice(close)];}
  else if(e.includes('(')){const i=e.indexOf('('),close=e.indexOf(')');asm=[e.slice(0,i+1),e.slice(i+1,close),e.slice(close)];}
  else{asm=['（無括號）',f,e.replace(f,'')];}
  const pool=[card('pre',asm[0],asm[0].includes('(')?1:0),card('e1',asm[1]),card('post',asm[2])];
  const names=['前段','先算的算式','後段'];
  $('zone').innerHTML='<div class="pool" id="pool">'+pool.join('')+'</div><div class="slots" id="slots">'+names.map((n,i)=>'<div class="slot" data-i="'+i+'">'+n+'</div>').join('')+'</div>';
  bindDrag();
}
function bindDrag(){
  const pool=$('pool');if(!pool)return;
  pool.addEventListener('pointerdown',e=>{
    const c=e.target.closest('.card');if(!c||c.parentNode.id!=='pool')return;
    c.setPointerCapture(e.pointerId);const sx=e.clientX,sy=e.clientY;
    c.style.position='relative';c.style.zIndex='9';
    const mv=ev=>{c.style.transform='translate('+(ev.clientX-sx)+'px,'+(ev.clientY-sy)+'px)';};
    const up=ev=>{
      c.releasePointerCapture(e.pointerId);c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);
      const under=document.elementFromPoint(ev.clientX,ev.clientY);
      const slot=under&&under.closest?under.closest('.slot'):null;
      if(slot&&!slot.firstChild){
        const want=['pre','e1','post'][+slot.dataset.i];
        slot.appendChild(c);slot.classList.add('filled');
        slot.textContent='';slot.appendChild(c);
        if(c.dataset.k===want)c.style.borderColor='var(--n43-b)';else c.style.borderColor='var(--n43-warn)';
        c.style.transform='translate(0,0)';c.style.position='';c.style.zIndex='';
        check();
      }else{c.style.transform='translate(0,0)';c.style.position='';c.style.zIndex='';}
    };
    c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);
  });
}
function check(){
  const got=[...document.querySelectorAll('.slot')].map(s=>s.firstChild&&s.firstChild.dataset?s.firstChild.dataset.k:null);
  const want=['pre','e1','post'];
  const ok=want.every((k,i)=>got[i]===k);
  if(ok){$('msg').textContent='✓ 拼式成功：'+(d.need?'括號不可省！':'此題括號可省略');stepN=3;renderSteps();}
  else if(got.filter(Boolean).length===4)$('msg').textContent='✗ 順序不對，想想「先算的要加括號嗎？」';
}
function render1(){
  $('cap').textContent='活動二：點擊「第一步先算哪一塊」，正確才往下化簡';
  $('zone').innerHTML='<div>'+d.chunks.map((c,i)=>'<span class="blk" data-i="'+i+'">'+c+'</span>').join('<span style="font-size:11px">＋</span>')+'</div><div class="cap" id="ordermsg">算式：'+d.exp+'　（先乘除後加減，有括號先算）</div>';
  document.querySelectorAll('.blk').forEach(b=>b.onclick=()=>{
    if(+b.dataset.i===0){b.classList.add('hit');$('ordermsg').textContent='✓ 第一步先算 '+d.first+' → '+d.s1;stepN=Math.max(stepN,1);}
    else{b.classList.add('bad');$('ordermsg').textContent='✗ 這一塊不是第一步，再看運算順序。';}
  });
}
function render2(){
  $('cap').textContent='活動三：點選與情境線段圖相符的正確併式（對照常見迷思）';
  $('zone').innerHTML='<div class="seg">'+d.seg.map((s,i)=>'<div class="segbar'+(i===1?' cut':'')+'">'+s+'</div>').join('<span>→</span>')+'</div>'+
    '<div><span class="blk" data-x="1">✓ '+d.exp+'</span><span class="blk" data-x="0">✗ '+d.trap.split('＝')[0]+'</span></div><div class="cap" id="pairmsg">選一個併式</div>';
  const bs=document.querySelectorAll('[data-x]');
  bs.forEach(b=>b.onclick=()=>{
    if(+b.dataset.x===1){b.classList.add('hit');$('pairmsg').textContent='✓ 正確：'+d.exp+'＝'+d.c[d.ans];}
    else{b.classList.add('bad');$('pairmsg').textContent='✗ 迷思：'+d.trap;}
  });
}
function render(){renderOpts();renderSteps();if(mode===0)render0();else if(mode===1)render1();else render2();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');mode=+t.dataset.t;render();
});
$('next').onclick=()=>{if(picked<0){$('msg').textContent='請先選一個答案';return;}stepN=Math.min(3,stepN+1);renderSteps();};
$('reset').onclick=()=>{picked=-1;stepN=0;render();$('msg').textContent='';};
$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('theme').textContent=dark?'Dark':'Light';};
render();
</script>
</body>
</html>
