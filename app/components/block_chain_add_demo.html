<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-1-5 長度：方格積木□拼合長度</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #eff6ff;
            color: #0f172a;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #bfdbfe;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; color: #1e293b; line-height: 1.4; }
        .playground {
            border: 2px solid #93c5fd;
            border-radius: 14px;
            background: #f8fafc;
            padding: 6px;
            margin-bottom: 12px;
        }
        .playground svg { display: block; width: 100%; height: auto; }
        .blk { cursor: pointer; }
        .badge-g { display: none; }
        .blk.counted .badge-g { display: block; }
        .blk.counted .blk-body { stroke: #1d4ed8; stroke-width: 3; }
        .formula-line { text-align: center; font-size: 1.1rem; font-weight: 800; color: #1d4ed8; min-height: 1.5em; margin-bottom: 10px; }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
        .merge-btn {
            min-height: 44px;
            background: #16a34a;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 26px;
            cursor: pointer;
        }
        .merge-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .reset-btn {
            min-height: 44px;
            background: #ffffff;
            color: #334155;
            font-size: 1rem;
            font-weight: 700;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .opt-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .opt-btn {
            min-height: 44px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            padding: 8px 14px;
        }
        .opt-btn.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .footer-action { display: flex; justify-content: center; margin-top: 8px; }
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-banner {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.02rem;
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
        @media (max-width: 640px) {
            body { padding: 4px 6px; }
            .container { padding: 8px 10px; max-width: 480px; }
            .stem { font-size: 14px; margin-bottom: 8px; line-height: 1.35; }
            .playground { margin-bottom: 6px; padding: 4px; border-radius: 12px; }
            .formula-line { font-size: 13.5px; min-height: 1.4em; margin-bottom: 6px; }
            .action-row { margin-bottom: 6px; gap: 6px; }
            .merge-btn, .reset-btn { min-height: 36px; padding: 6px 14px; font-size: 13px; border-radius: 10px; }
            .opt-group { gap: 6px; margin-bottom: 6px; }
            .opt-btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }
            .footer-action { margin-top: 4px; }
            .check-btn { min-height: 38px; padding: 6px 28px; font-size: 14px; }
            .result-banner { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">獅湖 114-2 期中 · 個別單位拼合</span>
    </div>

    <div class="stem">彩色筆和 8 個□一樣長，橡皮擦和 3 個□一樣長。<br>合起來和幾個□一樣長？</div>

    <div class="playground">
        <svg id="blockSvg" viewBox="0 0 470 200" role="img" aria-label="方格積木拼合教具"></svg>
    </div>

    <div class="formula-line" id="formulaLine">彩色筆 ＝ 8 個□、橡皮擦 ＝ 3 個□</div>

    <div class="action-row">
        <button class="merge-btn" id="mergeBtn" onclick="mergeBlocks()">🧩 合起來拼在一起</button>
        <button class="reset-btn" onclick="resetAll()">重來</button>
    </div>

    <div class="opt-group" id="opts"></div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    const SVGNS = 'http://www.w3.org/2000/svg';
    const GREEN_N = 8, ORANGE_N = 3;
    const SIZE = 30, PITCH = 36, ROW1_Y = 52, ROW2_Y = 128;
    const X0 = 72;
    const MERGE_DX = GREEN_N * PITCH, MERGE_DY = ROW1_Y - ROW2_Y;   // 橘色列滑到綠色列尾端
    let userAnswer = null;
    const ANSWER_INDEX = 0;
    let merged = false, countSeq = 0;

    function blkArt(fill) {
        return `
        <g class="blk-inner">
            <g class="badge-g" transform="translate(0 -8)">
                <circle cx="15" cy="-14" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
                <text class="badge-num" x="15" y="-10.5" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff"></text>
            </g>
            <rect class="blk-body" x="0" y="0" width="${SIZE}" height="${SIZE}" rx="5" fill="${fill}" stroke="#0f172a" stroke-width="1.8"/>
            <text x="15" y="21" text-anchor="middle" font-size="15" font-weight="800" fill="rgba(255,255,255,0.85)">□</text>
        </g>`;
    }

    function makeBlk(fill, x, y, seq) {
        const wrap = document.createElementNS(SVGNS, 'g');
        wrap.setAttribute('transform', `translate(${x} ${y})`);
        wrap.innerHTML = blkArt(fill);
        const blk = wrap.firstElementChild;
        blk.classList.add('blk');
        blk.dataset.seq = seq;
        blk.addEventListener('click', () => {
            if (blk.classList.contains('counted')) return;
            countSeq++;
            blk.classList.add('counted');
            blk.querySelector('.badge-num').textContent = countSeq;
            document.getElementById('formulaLine').innerHTML =
                `已點數 <b>${countSeq}</b> 個□…${countSeq === GREEN_N + ORANGE_N ? '數完了！合起來和 <b>11</b> 個□一樣長 ✅' : '繼續數！'}`;
        });
        return wrap;
    }

    function mergeBlocks() {
        if (merged) return;
        merged = true;
        document.getElementById('mergeBtn').disabled = true;
        const g = document.getElementById('orangeGroup');
        // rAF 內插橘色列滑到綠色列尾端
        const t0 = performance.now(), DUR = 900;
        function frame(now) {
            const p = Math.min(1, (now - t0) / DUR);
            const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            g.setAttribute('transform', `translate(${(X0 + MERGE_DX * e).toFixed(1)} ${(ROW2_Y + MERGE_DY * e).toFixed(1)})`);
            if (p < 1) requestAnimationFrame(frame);
            else {
                document.getElementById('formulaLine').innerHTML =
                    '合起來排成一列！點積木一個一個數：8 個綠□ ＋ 3 個橘□';
            }
        }
        requestAnimationFrame(frame);
    }

    function resetAll() {
        merged = false; countSeq = 0;
        document.getElementById('mergeBtn').disabled = false;
        document.getElementById('orangeGroup').setAttribute('transform', `translate(${X0} ${ROW2_Y})`);
        document.querySelectorAll('#blockSvg .blk').forEach((b) => {
            b.classList.remove('counted');
            b.querySelector('.badge-num').textContent = '';
        });
        document.getElementById('formulaLine').innerHTML = '彩色筆 ＝ 8 個□、橡皮擦 ＝ 3 個□';
    }

    function build() {
        const svg = document.getElementById('blockSvg');
        svg.innerHTML = `
            <g pointer-events="none">
                <rect x="0" y="0" width="470" height="200" fill="#f8fafc"/>
                <rect x="6" y="30" width="66" height="18" rx="6" fill="#dcfce7"/>
                <text x="39" y="43" text-anchor="middle" font-size="11" font-weight="800" fill="#16a34a">彩色筆</text>
                <rect x="6" y="106" width="66" height="18" rx="6" fill="#ffedd5"/>
                <text x="39" y="119" text-anchor="middle" font-size="11" font-weight="800" fill="#ea580c">橡皮擦</text>
                <g id="rowLabels">
                    <text x="39" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#16a34a">8 個□</text>
                    <text id="orangeLabel" x="39" y="156" text-anchor="middle" font-size="13" font-weight="800" fill="#ea580c">3 個□</text>
                </g>
            </g>`;
        const green = document.createElementNS(SVGNS, 'g');
        green.id = 'greenGroup';
        svg.appendChild(green);
        for (let i = 0; i < GREEN_N; i++) green.appendChild(makeBlk('#4ade80', X0 + i * PITCH, ROW1_Y, i + 1));
        const orange = document.createElementNS(SVGNS, 'g');
        orange.id = 'orangeGroup';
        svg.appendChild(orange);
        for (let i = 0; i < ORANGE_N; i++) orange.appendChild(makeBlk('#fb923c', X0 + i * PITCH, ROW2_Y, GREEN_N + i + 1));

        const group = document.getElementById('opts');
        ['11 個□', '9 個□', '12 個□', '10 個□'].forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = function () {
                group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                userAnswer = idx;
            };
            group.appendChild(btn);
        });
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (userAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '先選一個答案再檢查喔！';
            return;
        }
        if (userAnswer === ANSWER_INDEX) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對！8 ＋ 3 ＝ 11，合起來和 11 個□一樣長！';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '再想想：把 8 個□和 3 個□排成一列，接著數 9、10、11 喔！';
        }
    }

    build();
</script>

</body>
</html>
