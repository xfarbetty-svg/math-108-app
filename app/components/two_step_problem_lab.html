<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3-N-3-7 解題（兩步驟應用問題） 階梯式解題實驗台</title>
    <style>
        :root {
            --bg: #fff9f0;
            --card: #ffffff;
            --coral: #ff8a65;
            --mint: #7bc9b2;
            --lemon: #ffd166;
            --text-dark: #333;
            --muted: #b0a08a;
            --success: #7bc9b2;
            --error: #e57373;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: auto; min-height: auto; margin: 0; padding: 0; }
        body {
            padding: 3px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 100%;
            height: auto;
            min-height: auto;
            background: transparent;
            border: none;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .header {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin: 0;
            letter-spacing: 1px;
        }
        .question-box {
            background: var(--card);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.35;
            min-height: 38px;
            display: flex;
            align-items: center;
            box-shadow: 0 6px 18px rgba(149,117,76,0.10);
            border-left: 4px solid var(--coral);
        }
        .calc-card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(149,117,76,0.10);
            padding: 4px 8px 6px;
        }
        .calc-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            width: 100%;
            max-width: 170px;
            height: auto;
            display: block;
        }
        .expr { font-size: 16px; fill: var(--text-dark); font-weight: 600; }
        .expr-coral { font-size: 16px; fill: var(--coral); font-weight: bold; }
        .expr-mint { font-size: 15px; fill: var(--mint); font-weight: bold; }
        .expr-red { font-size: 14px; fill: #e57373; font-weight: bold; }
        .place-label { font-size: 9px; fill: var(--muted); }
        .cap { font-size: 12px; min-height: 15px; text-align: center; color: var(--coral); font-weight: bold; line-height: 1.3; }
        .controls { display: flex; flex-direction: column; gap: 4px; }
        .step-btn, .check-btn {
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 3px 10px rgba(149,117,76,0.18);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .step-btn { background: linear-gradient(135deg, var(--coral), #ff9e85); }
        .check-btn { background: linear-gradient(135deg, var(--mint), #93d8c4); }
        .step-btn:active, .check-btn:active { transform: scale(0.95) translateY(1px); box-shadow: 0 1px 4px rgba(149,117,76,0.18); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .opt-btn {
            min-height: 32px;
            height: auto;
            padding: 4px 6px;
            line-height: 1.25;
            border: 2px solid #f0e6d8;
            background: var(--card);
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(149,117,76,0.08);
        }
        .opt-btn:active { transform: scale(0.96); }
        .opt-btn.selected { border-color: var(--coral); background: #fff3ec; }
        .feedback {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 22px;
            border-radius: 999px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
            max-width: 96vw;
        }
        .success { background: var(--mint); }
        .fail { background: var(--error); }
    </style>
</head>
<body>

<div id="app">
    <div class="header">內湖・陽明段考真題 · 兩步驟應用問題（不含併式）</div>

    <div class="question-box" id="qText">載入中...</div>

    <div class="calc-card">
        <div class="calc-area">
            <svg id="svgCanvas" viewBox="0 0 240 168">
                <g id="drawLayer"></g>
            </svg>
        </div>
        <div class="cap" id="stepCap"></div>
    </div>

    <div class="controls">
        <button class="step-btn" onclick="nextStep()">一步一步看算理 ▶</button>
        <div class="options-grid" id="options"></div>
        <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
    </div>

    <div id="feedback" class="feedback"></div>
</div>

<script>
    const QUESTIONS = {
        1:  { mode: 'associate', stem: '學校訂購 4 箱鉛筆，每箱有 5 盒，每盒有 12 枝。小明算「(4 × 5) × 12」，小華算「4 × (5 × 12)」，請問誰算出來的鉛筆總枝數比較多？',
              correct: '一樣多，都是 240 枝', choices: ['一樣多，都是 240 枝', '小明算的多', '小華算的多', '無法比較'],
              caps: ['小明路徑：先算總盒數 4 × 5 ＝ 20 盒，再算總枝數 20 × 12 ＝ 240 枝', '小華路徑：先算一箱枝數 5 × 12 ＝ 60 枝，再算 4 箱 60 × 4 ＝ 240 枝', '兩條路徑都得到 240 枝 → 連乘先算前面兩數或後面兩數，積都相同（乘法結合律）'] },
        2:  { mode: 'compare', stem: '不用真正算出答案，動動腦比比看：算式「8 × 4 × 2」和「8 × 4 ÷ 2」，在中間 ( ? ) 該填入什麼符號？',
              correct: '＞', choices: ['＞', '＜', '＝', '無法判斷'],
              caps: ['兩邊前面的 8 × 4 ＝ 32 完全相同，先記住共同部分', '左邊再乘以 2：32 × 2 ＝ 64（乘法越乘越大）', '右邊再除以 2：32 ÷ 2 ＝ 16（除法越除越小）', '64 ＞ 16 → 8 × 4 × 2 ＞ 8 × 4 ÷ 2，天平左邊下沉'] },
        3:  { mode: 'estimate', stem: '媽媽到麵包店，買了 3 條各 48 元的手撕麵包，又買了一罐 65 元的果醬。媽媽帶了 250 元，請問大約還剩下多少元？',
              correct: '大約剩下 35 元', choices: ['大約剩下 35 元', '大約剩下 85 元', '大約剩下 135 元', '錢不夠付'],
              caps: ['第一步先算 3 條麵包的花費：48 × 3 ＝ 144 元', '第二步加上果醬算總花費：144 ＋ 65 ＝ 209 元', '媽媽付 250 元找零：250 － 209 ＝ 41 元', '41 元最接近選項「大約剩下 35 元」→ 兩步驟先乘後加再減！'] },
        4:  { mode: 'detective', stem: '題目：「果汁每瓶 25 元，紅茶每瓶 15 元，小華各買了 4 瓶，一共要付多少元？」小明算成「25 ＋ 15 × 4 ＝ 25 ＋ 60 ＝ 85 元」，請問小明哪裡算錯了？',
              correct: '他少算了 25 元的果汁也買了 4 瓶，應該把兩者都乘以 4 或先加起來再乘以 4',
              choices: ['他少算了 25 元的果汁也買了 4 瓶，應該把兩者都乘以 4 或先加起來再乘以 4', '他計算乘法算錯了，15 × 4 不等於 60', '他應該用減法而不是加法', '小明完全算對了，沒有錯誤'],
              caps: ['放大鏡聚焦小明的算式 25 ＋ 15 × 4 ＝ 85：只有紅茶乘以 4，果汁只算了 1 瓶！', '題目說「各買了 4 瓶」：果汁有 4 瓶、紅茶也有 4 瓶', '正確算法一：先算一組多少錢 25 ＋ 15 ＝ 40 元，再算 4 組 40 × 4 ＝ 160 元', '正確算法二：25 × 4 ＝ 100 與 15 × 4 ＝ 60，合起來 100 ＋ 60 ＝ 160 元 → 正確答案 160 元'] },
        5:  { mode: 'wire_trap', stem: '妙妙用一條長 123 公分的繩子圍一張正方形的桌面一圈後，繩子還剩下 19 公分。請問這張正方形桌面的邊長是多少公分？',
              correct: '26 公分', choices: ['26 公分', '31 公分', '24 公分', '28 公分'],
              caps: ['繩長 123 公分，圍完一圈還剩下 19 公分', '第一步先算真正圍在桌上的周長：123 － 19 ＝ 104 公分（直接 123 ÷ 4 是大陷阱！）', '第二步正方形 4 個邊一樣長：104 ÷ 4 ＝ 26 公分', '驗算：26 × 4 ＝ 104，加上剩下 19 ＝ 123 公分 ✓ 邊長 26 公分'] },
        6:  { mode: 'boxes', stem: '亞立克果子工坊的手工酒心巧克力，每 8 顆裝成一盒，4 盒裝成一箱。阿姨買了 2 箱送給朋友，請問裡面一共裝了多少顆巧克力？',
              correct: '64 顆', choices: ['64 顆', '32 顆', '48 顆', '72 顆'],
              caps: ['雙層包裝：每盒 8 顆、每箱 4 盒、阿姨買 2 箱', '第一步先算一箱有幾顆：8 × 4 ＝ 32 顆', '第二步再算 2 箱的總顆數：32 × 2 ＝ 64 顆', '另一條路：先算總盒數 4 × 2 ＝ 8 盒，再算 8 × 8 ＝ 64 顆，答案相同 ✓'] },
        7:  { mode: 'oranges', stem: '一盒橘子有 12 顆，奶奶買了 3 盒，把全部的橘子平分送給 6 個鄰居。請問每一個鄰居可以拿到幾顆橘子？',
              correct: '6 顆', choices: ['6 顆', '4 顆', '2 顆', '8 顆'],
              caps: ['第一步先算奶奶一共買了多少顆：12 × 3 ＝ 36 顆', '第二步把 36 顆平分給 6 個鄰居：36 ÷ 6 ＝ 6 顆', '驗算：6 顆 × 6 人 ＝ 36 顆，剛好分完 ✓ 每人 6 顆'] },
        8:  { mode: 'apples', stem: '媽媽買了 160 顆蘋果，每 8 顆裝成一盒後，分送給鄰居 18 盒，請問媽媽還剩下幾盒蘋果？',
              correct: '2 盒', choices: ['2 盒', '4 盒', '16 盒', '8 盒'],
              caps: ['第一步先算 160 顆蘋果一共能裝成幾盒：160 ÷ 8 ＝ 20 盒', '第二步送給鄰居 18 盒後算剩下的：20 － 18 ＝ 2 盒', '驗算：剩下的 2 盒有 2 × 8 ＝ 16 顆，全部 20 × 8 ＝ 160 顆 ✓ 還剩 2 盒'] },
        9:  { mode: 'milk_toast', stem: '烘焙師傅用 1 公升（即 1000 毫升）的鮮奶做 6 條土司，做完後鮮奶還剩下 100 毫升。請問做一條土司平均需要多少毫升的鮮奶？',
              correct: '150 毫升', choices: ['150 毫升', '180 毫升', '120 毫升', '160 毫升'],
              caps: ['1 公升 ＝ 1000 毫升，做完後還剩 100 毫升', '第一步先算實際用掉的鮮奶：1000 － 100 ＝ 900 毫升', '第二步平分給 6 條土司：900 ÷ 6 ＝ 150 毫升', '驗算：150 × 6 ＝ 900，加上剩下 100 ＝ 1000 毫升 ✓ 平均 150 毫升'] },
        10: { mode: 'balloons', stem: '內湖國小每間教室佈置 20 顆氣球，每層樓有 5 間教室，3 層樓一共要佈置幾顆氣球呢？',
              correct: '300 顆', choices: ['300 顆', '250 顆', '150 顆', '100 顆'],
              caps: ['第一步先算一層樓 5 間教室需要幾顆：20 × 5 ＝ 100 顆', '第二步再算 3 層樓的總數：100 × 3 ＝ 300 顆', '階梯累計：一層 100 → 兩層 200 → 三層 300 顆 ✓ 一共 300 顆'] }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const qId = urlParams.get('q') || 1;
    const q = QUESTIONS[qId];
    let currentStep = 0;
    let selectedAns = null;

    function totalSteps() { return q.caps.length; }

    function setCap() {
        const el = document.getElementById('stepCap');
        if (currentStep === 0) { el.innerText = '按「一步一步看算理」開始演繹！'; return; }
        el.innerText = q.caps[currentStep - 1];
    }

    function init() {
        document.getElementById('qText').innerText = q.stem;
        renderOptions();
        render();
    }

    function renderOptions() {
        const container = document.getElementById('options');
        const shuffled = [...q.choices].sort(() => Math.random() - 0.5);
        container.innerHTML = '';
        shuffled.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = c;
            btn.onclick = () => {
                selectedAns = c;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            container.appendChild(btn);
        });
    }

    function checkAnswer() {
        const fb = document.getElementById('feedback');
        if (!selectedAns) { fb.innerText = '先選一個答案喔！'; fb.className = 'feedback fail'; fb.style.display = 'block'; setTimeout(() => fb.style.display = 'none', 1200); return; }
        if (selectedAns === q.correct) {
            fb.innerText = '答對了！' + (q.caps[q.caps.length - 1] || '');
            fb.className = 'feedback success';
        } else {
            fb.innerText = '再想想看～按「一步一步看算理」提示！';
            fb.className = 'feedback fail';
        }
        fb.style.display = 'block';
        setTimeout(() => fb.style.display = 'none', 1500);
    }

    function nextStep() {
        if (currentStep < totalSteps()) { currentStep++; render(); }
    }

    function render() {
        if (q.mode === 'associate') renderAssociate();
        else if (q.mode === 'compare') renderCompare();
        else if (q.mode === 'estimate') renderEstimate();
        else if (q.mode === 'detective') renderDetective();
        else if (q.mode === 'wire_trap') renderWireTrap();
        else if (q.mode === 'boxes') renderBoxes();
        else if (q.mode === 'oranges') renderOranges();
        else if (q.mode === 'apples') renderApples();
        else if (q.mode === 'milk_toast') renderMilkToast();
        else if (q.mode === 'balloons') renderBalloons();
        setCap();
    }

    function resetView() {
        document.getElementById('svgCanvas').setAttribute('viewBox', '0 0 240 168');
        return '';
    }

    /* ===== 模式 1：連乘結合律雙軌推導卡（小明 vs 小華，雙雙 240） ===== */
    function renderAssociate() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        svg += `<text x="120" y="14" text-anchor="middle" class="place-label">連乘：4 箱 × 5 盒 × 12 枝</text>`;
        // 小明軌道卡
        const s = currentStep;
        svg += `<rect x="8" y="22" width="104" height="64" rx="10" fill="#fff" stroke="#f0e6d8" stroke-width="1.5"/>`;
        svg += `<text x="60" y="36" text-anchor="middle" class="place-label" style="font-size:10px;fill:#ff8a65;font-weight:bold">小明的算法</text>`;
        svg += `<text x="60" y="54" text-anchor="middle" class="expr" style="font-size:12px">(4 × 5) × 12</text>`;
        if (s >= 1) svg += `<text x="60" y="72" text-anchor="middle" class="expr-coral" style="font-size:11px">4 × 5 ＝ 20 盒</text>`;
        if (s >= 3) svg += `<text x="60" y="83" text-anchor="middle" class="place-label" style="font-size:10px">20 × 12 ＝ 240 枝</text>`;
        // 小華軌道卡
        svg += `<rect x="128" y="22" width="104" height="64" rx="10" fill="#fff" stroke="#f0e6d8" stroke-width="1.5"/>`;
        svg += `<text x="180" y="36" text-anchor="middle" class="place-label" style="font-size:10px;fill:#7bc9b2;font-weight:bold">小華的算法</text>`;
        svg += `<text x="180" y="54" text-anchor="middle" class="expr" style="font-size:12px">4 × (5 × 12)</text>`;
        if (s >= 2) svg += `<text x="180" y="72" text-anchor="middle" class="expr-mint" style="font-size:11px">5 × 12 ＝ 60 枝</text>`;
        if (s >= 2) svg += `<text x="180" y="83" text-anchor="middle" class="place-label" style="font-size:10px">60 × 4 ＝ 240 枝</text>`;
        // 合流結論
        if (s >= 3) {
            svg += `<rect x="28" y="112" width="184" height="40" rx="12" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="130" text-anchor="middle" class="expr-mint" style="font-size:13px">一樣多！都是 240 枝</text>`;
            svg += `<text x="120" y="146" text-anchor="middle" class="place-label" style="font-size:10px;fill:#26a69a">連乘先算哪一組，積都相同</text>`;
        } else {
            svg += `<rect x="28" y="112" width="184" height="40" rx="12" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="120" y="136" text-anchor="middle" class="place-label" style="font-size:11px">誰的比較多？</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 2：雙天平 8×4×2 vs 8×4÷2（左沈右浮） ===== */
    function renderCompare() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        const sunk = s >= 3;
        const ly = sunk ? 100 : 92;
        const ry = sunk ? 84 : 92;
        svg += `<text x="120" y="14" text-anchor="middle" class="place-label">8 × 4 ＝ 32 兩邊都相同</text>`;
        // 天平梁與支點
        svg += `<line x1="58" y1="${ly}" x2="182" y2="${ry}" stroke="#a1887f" stroke-width="3" stroke-linecap="round"/>`;
        svg += `<polygon points="112,146 128,146 120,130" fill="#a1887f"/>`;
        svg += `<circle cx="120" cy="130" r="4" fill="#8d6e63"/>`;
        // 左盤：8×4×2
        svg += `<line x1="58" y1="${ly}" x2="58" y2="${ly + 6}" stroke="#a1887f" stroke-width="2"/>`;
        svg += `<rect x="10" y="${ly + 6}" width="96" height="40" rx="9" fill="#fff" stroke="#f0e6d8" stroke-width="1.5"/>`;
        svg += `<text x="58" y="${ly + 21}" text-anchor="middle" class="expr" style="font-size:12px">8 × 4 × 2</text>`;
        if (s >= 2) svg += `<text x="58" y="${ly + 38}" text-anchor="middle" class="expr-coral" style="font-size:12px">32 × 2 ＝ 64</text>`;
        // 右盤：8×4÷2
        svg += `<line x1="182" y1="${ry}" x2="182" y2="${ry + 6}" stroke="#a1887f" stroke-width="2"/>`;
        svg += `<rect x="134" y="${ry + 6}" width="96" height="40" rx="9" fill="#fff" stroke="#f0e6d8" stroke-width="1.5"/>`;
        svg += `<text x="182" y="${ry + 21}" text-anchor="middle" class="expr" style="font-size:12px">8 × 4 ÷ 2</text>`;
        if (s >= 3) svg += `<text x="182" y="${ry + 38}" text-anchor="middle" class="expr-mint" style="font-size:12px">32 ÷ 2 ＝ 16</text>`;
        if (s >= 4) {
            svg += `<text x="120" y="${sunk ? 74 : 126}" text-anchor="middle" class="expr-red" style="font-size:14px">64 ＞ 16 → 填「＞」</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 3：採買階梯進度條（麵包144 → 總花費209 → 找零41） ===== */
    function renderEstimate() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        // 階梯三格：144 → 209 → 41
        const steps = [
            { label: '3 條麵包', expr: '48 × 3 ＝ 144', y: 108, color: '#ff8a65', show: s >= 1 },
            { label: '＋果醬 總花費', expr: '144 ＋ 65 ＝ 209', y: 68, color: '#ffb74d', show: s >= 2 },
            { label: '付 250 找零', expr: '250 － 209 ＝ 41', y: 28, color: '#7bc9b2', show: s >= 3 }
        ];
        steps.forEach((st, i) => {
            svg += `<rect x="${14 + i * 6}" y="${st.y}" width="86" height="30" rx="8" fill="${st.show ? '#fff' : '#faf5ec'}" stroke="${st.show ? st.color : '#f0e6d8'}" stroke-width="1.5"/>`;
            svg += `<text x="${57 + i * 6}" y="${st.y + 13}" text-anchor="middle" class="place-label" style="font-size:9px">${st.label}</text>`;
            if (st.show) svg += `<text x="${57 + i * 6}" y="${st.y + 26}" text-anchor="middle" class="expr-coral" style="font-size:10px">${st.expr}</text>`;
            else svg += `<text x="${57 + i * 6}" y="${st.y + 26}" text-anchor="middle" class="place-label" style="font-size:10px">？</text>`;
        });
        // 階梯虛線連接
        svg += `<line x1="100" y1="106" x2="114" y2="98" stroke="#d7c9b4" stroke-width="1.4" stroke-dasharray="3 2"/>`;
        svg += `<line x1="140" y1="66" x2="154" y2="58" stroke="#d7c9b4" stroke-width="1.4" stroke-dasharray="3 2"/>`;
        if (s >= 4) {
            svg += `<text x="120" y="158" text-anchor="middle" class="expr-mint" style="font-size:11px">剩下 41 元 ≈ 大約 35~40 元</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 4：小明改錯放大鏡（85 ✗ → 160 ✓） ===== */
    function renderDetective() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        // 錯誤算式卡（紅色警告燈）
        svg += `<rect x="10" y="18" width="220" height="34" rx="10" fill="${s >= 1 ? '#fdecea' : '#fff'}" stroke="${s >= 1 ? '#e57373' : '#f0e6d8'}" stroke-width="1.5"/>`;
        svg += `<text x="20" y="33" class="place-label" style="font-size:9px;fill:#e57373">小明的算法</text>`;
        svg += `<text x="120" y="46" text-anchor="middle" class="${s >= 1 ? 'expr-red' : 'expr'}" style="font-size:12px">25 ＋ 15 × 4 ＝ 85 ${s >= 1 ? '✗' : ''}</text>`;
        if (s >= 1) svg += `<circle cx="222" cy="35" r="7" fill="#e57373"/><text x="222" y="39" text-anchor="middle" style="font-size:9px;fill:#fff;font-weight:bold">!</text>`;
        if (s >= 2) svg += `<text x="120" y="64" text-anchor="middle" class="place-label" style="font-size:10px;fill:#e57373">「各買 4 瓶」→ 果汁也要乘以 4！</text>`;
        // 正確階梯卡
        if (s >= 3) {
            svg += `<rect x="10" y="74" width="220" height="30" rx="10" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="94" text-anchor="middle" class="expr-mint" style="font-size:12px">先算一組：25 ＋ 15 ＝ 40 元</text>`;
        }
        if (s >= 4) {
            svg += `<rect x="10" y="110" width="220" height="30" rx="10" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="130" text-anchor="middle" class="expr-mint" style="font-size:12px">再算 4 組：40 × 4 ＝ 160 元 ✓</text>`;
            svg += `<text x="120" y="156" text-anchor="middle" class="place-label" style="font-size:10px;fill:#26a69a">正確答案是一共 160 元（小明漏乘果汁）</text>`;
        } else {
            svg += `<rect x="10" y="110" width="220" height="30" rx="10" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="120" y="130" text-anchor="middle" class="place-label" style="font-size:11px">正確算法是？</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 5：繩子剪裁動畫（123 → 減19 → 104 → 圍4邊26） ===== */
    function renderWireTrap() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        // 繩子長條
        svg += `<text x="120" y="14" text-anchor="middle" class="place-label">繩子全長 123 公分</text>`;
        const ropeY = 26;
        svg += `<rect x="14" y="${ropeY}" width="212" height="16" rx="8" fill="#e6c88f" stroke="#c9a86a" stroke-width="1.2"/>`;
        // 繩端刻度標記（初始步驟即渲染）
        svg += `<line x1="14" y1="${ropeY - 4}" x2="14" y2="${ropeY + 20}" stroke="#c9a86a" stroke-width="1.5"/>`;
        svg += `<line x1="226" y1="${ropeY - 4}" x2="226" y2="${ropeY + 20}" stroke="#c9a86a" stroke-width="1.5"/>`;
        if (s >= 1) {
            // 剪掉剩下的 19 公分（右端小段）
            svg += `<rect x="196" y="${ropeY}" width="30" height="16" rx="8" fill="#f6e3c3" stroke="#c9a86a" stroke-width="1.2" stroke-dasharray="3 2"/>`;
            svg += `<text x="210" y="${ropeY + 28}" text-anchor="middle" class="place-label" style="font-size:9px;fill:#c9a86a">剩 19</text>`;
            svg += `<line x1="196" y1="${ropeY - 4}" x2="196" y2="${ropeY + 20}" stroke="#e57373" stroke-width="2" stroke-dasharray="3 2"/>`;
        }
        if (s >= 2) {
            svg += `<text x="120" y="72" text-anchor="middle" class="expr-coral" style="font-size:13px">123 － 19 ＝ 104（周長）</text>`;
            svg += `<text x="120" y="86" text-anchor="middle" class="place-label" style="font-size:9px;fill:#e57373">先扣剩下的，不能直接 123 ÷ 4！</text>`;
        }
        // 正方形桌面
        const sqX = 70, sqY = 96, sqW = 62, sqH = 52;
        if (s >= 3) {
            svg += `<rect x="${sqX}" y="${sqY}" width="${sqW}" height="${sqH}" rx="6" fill="#fffaf2" stroke="#c9a86a" stroke-width="3"/>`;
            svg += `<text x="${sqX + sqW / 2}" y="${sqY + sqH / 2 + 4}" text-anchor="middle" class="expr-mint" style="font-size:12px">104 ÷ 4</text>`;
            svg += `<text x="${sqX + sqW / 2}" y="${sqY + sqH / 2 + 18}" text-anchor="middle" class="expr-mint" style="font-size:11px">＝ 26 公分</text>`;
            // 四邊等長小標記
            svg += `<text x="${sqX - 8}" y="${sqY + sqH / 2 + 4}" text-anchor="end" class="place-label" style="font-size:9px">4 邊等長</text>`;
            // 完整算式揭示
            svg += `<text x="186" y="112" text-anchor="middle" class="expr-mint" style="font-size:11px">104 ÷ 4 ＝ 26</text>`;
            svg += `<text x="186" y="128" text-anchor="middle" class="place-label" style="font-size:9px;fill:#26a69a">邊長 26 公分</text>`;
        } else {
            svg += `<rect x="${sqX}" y="${sqY}" width="${sqW}" height="${sqH}" rx="6" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="${sqX + sqW / 2}" y="${sqY + sqH / 2 + 4}" text-anchor="middle" class="place-label" style="font-size:10px">正方形桌面</text>`;
        }
        if (s >= 4) {
            svg += `<text x="182" y="122" text-anchor="middle" class="expr-mint" style="font-size:11px">驗算 ✓</text>`;
            svg += `<text x="182" y="136" text-anchor="middle" class="place-label" style="font-size:9px;fill:#26a69a">26 × 4 ＋ 19 ＝ 123</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 6：雙層包裝盒（每盒8顆 → 一箱32顆 → 2箱64顆） ===== */
    function renderBoxes() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        svg += `<text x="120" y="14" text-anchor="middle" class="place-label">每盒 8 顆 · 4 盒裝一箱 · 買 2 箱</text>`;
        // 一箱（4 小盒）
        const bx = 24, by = 26;
        svg += `<rect x="${bx}" y="${by}" width="88" height="66" rx="8" fill="#fff" stroke="#c9a86a" stroke-width="2"/>`;
        for (let i = 0; i < 4; i++) {
            const gx = bx + 6 + (i % 2) * 40, gy = by + 6 + Math.floor(i / 2) * 28;
            svg += `<rect x="${gx}" y="${gy}" width="36" height="24" rx="5" fill="#f6e3c3" stroke="#c9a86a" stroke-width="1"/>`;
            svg += `<circle cx="${gx + 12}" cy="${gy + 12}" r="5" fill="#8d5524"/><circle cx="${gx + 24}" cy="${gy + 12}" r="5" fill="#8d5524"/>`;
        }
        if (s >= 2) svg += `<text x="${bx + 44}" y="${by + 78}" text-anchor="middle" class="expr-coral" style="font-size:12px">8 × 4 ＝ 32 顆</text>`;
        else svg += `<text x="${bx + 44}" y="${by + 78}" text-anchor="middle" class="place-label" style="font-size:10px">一箱 = ？顆</text>`;
        // 第二箱 + 總覽
        if (s >= 3) {
            const bx2 = 132;
            svg += `<rect x="${bx2}" y="${by}" width="88" height="66" rx="8" fill="#fff" stroke="#c9a86a" stroke-width="2"/>`;
            for (let i = 0; i < 4; i++) {
                const gx = bx2 + 6 + (i % 2) * 40, gy = by + 6 + Math.floor(i / 2) * 28;
                svg += `<rect x="${gx}" y="${gy}" width="36" height="24" rx="5" fill="#f6e3c3" stroke="#c9a86a" stroke-width="1"/>`;
                svg += `<circle cx="${gx + 12}" cy="${gy + 12}" r="5" fill="#8d5524"/><circle cx="${gx + 24}" cy="${gy + 12}" r="5" fill="#8d5524"/>`;
            }
            svg += `<text x="${bx2 + 44}" y="${by + 78}" text-anchor="middle" class="expr-coral" style="font-size:12px">32 × 2 ＝ 64</text>`;
            svg += `<rect x="28" y="112" width="184" height="40" rx="12" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="130" text-anchor="middle" class="expr-mint" style="font-size:13px">一共 64 顆巧克力 ✓</text>`;
            svg += `<text x="120" y="146" text-anchor="middle" class="place-label" style="font-size:10px;fill:#26a69a">連乘兩步：先算一箱，再乘 2 箱</text>`;
        } else {
            svg += `<rect x="132" y="${by}" width="88" height="66" rx="8" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="176" y="${by + 36}" text-anchor="middle" class="place-label" style="font-size:10px">第 2 箱</text>`;
            svg += `<text x="176" y="${by + 52}" text-anchor="middle" class="place-label" style="font-size:10px">總共？顆</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 7：橘子裝箱平分（3盒36顆 → 平分6籃各6顆） ===== */
    function renderOranges() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        svg += `<text x="120" y="14" text-anchor="middle" class="place-label">一盒 12 顆 × 3 盒</text>`;
        // 三盒橘子
        for (let b = 0; b < 3; b++) {
            const ox = 14 + b * 34, oy = 22;
            svg += `<rect x="${ox}" y="${oy}" width="30" height="40" rx="6" fill="#fff" stroke="#e8a33d" stroke-width="1.5"/>`;
            if (s >= 1) {
                for (let i = 0; i < 4; i++) {
                    svg += `<circle cx="${ox + 10 + (i % 2) * 10}" cy="${oy + 11 + Math.floor(i / 2) * 10}" r="4" fill="#f5a623"/>`;
                }
            } else {
                svg += `<text x="${ox + 15}" y="${oy + 25}" text-anchor="middle" class="place-label" style="font-size:9px">？顆</text>`;
            }
        }
        if (s >= 1) svg += `<text x="120" y="76" text-anchor="middle" class="expr-coral" style="font-size:12px">12 × 3 ＝ 36 顆</text>`;
        if (s >= 2) {
            // 6 個鄰居籃子
            for (let i = 0; i < 6; i++) {
                const bx = 12 + (i % 3) * 40, by = 86 + Math.floor(i / 3) * 30;
                svg += `<path d="M ${bx} ${by} h 30 l -4 20 h -22 Z" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.3"/>`;
                svg += `<circle cx="${bx + 15}" cy="${by + 10}" r="4" fill="#f5a623"/>`;
                svg += `<text x="${bx + 15}" y="${by + 17}" text-anchor="middle" class="place-label" style="font-size:7px;fill:#26a69a">6</text>`;
            }
            svg += `<text x="196" y="104" text-anchor="middle" class="expr-mint" style="font-size:12px">36 ÷ 6 ＝ 6</text>`;
            svg += `<text x="196" y="120" text-anchor="middle" class="place-label" style="font-size:9px;fill:#26a69a">每人 6 顆 ✓</text>`;
        } else {
            svg += `<rect x="14" y="88" width="212" height="58" rx="10" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="120" y="120" text-anchor="middle" class="place-label" style="font-size:11px">平分給 6 個鄰居，每人幾顆？</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 8：蘋果分裝（160÷8=20盒 → 送18盒 → 剩2盒高亮） ===== */
    function renderApples() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        svg += `<text x="120" y="14" text-anchor="middle" class="place-label">160 顆蘋果 · 每 8 顆裝一盒</text>`;
        if (s >= 1) {
            // 20 個盒子格子（4列5行）
            for (let i = 0; i < 20; i++) {
                const gx = 14 + (i % 10) * 21, gy = 24 + Math.floor(i / 10) * 22;
                const sent = s >= 2 && i < 18;
                const remain = s >= 2 && i >= 18;
                svg += `<rect x="${gx}" y="${gy}" width="18" height="18" rx="4" fill="${sent ? '#f0ece4' : (remain ? '#e8f7f1' : '#fff')}" stroke="${remain ? '#7bc9b2' : '#e0d5c3'}" stroke-width="${remain ? 2 : 1}" opacity="${sent ? 0.5 : 1}"/>`;
                svg += `<circle cx="${gx + 9}" cy="${gy + 9}" r="4" fill="${sent ? '#d9cfc0' : '#e05a4e'}"/>`;
            }
            svg += `<text x="120" y="82" text-anchor="middle" class="expr-coral" style="font-size:12px">160 ÷ 8 ＝ 20 盒</text>`;
        } else {
            svg += `<rect x="14" y="24" width="212" height="42" rx="10" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="120" y="50" text-anchor="middle" class="place-label" style="font-size:11px">160 顆可以裝成幾盒？</text>`;
        }
        if (s >= 2) {
            svg += `<text x="120" y="102" text-anchor="middle" class="place-label" style="font-size:10px;fill:#a1887f">灰色 18 盒送鄰居 ↘ 剩下綠框 2 盒</text>`;
            svg += `<rect x="28" y="112" width="184" height="40" rx="12" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="130" text-anchor="middle" class="expr-mint" style="font-size:13px">20 － 18 ＝ 2 盒 ✓</text>`;
            svg += `<text x="120" y="146" text-anchor="middle" class="place-label" style="font-size:10px;fill:#26a69a">先除後減：先裝盒，再減送走的</text>`;
        } else {
            svg += `<rect x="28" y="100" width="184" height="44" rx="12" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="120" y="126" text-anchor="middle" class="place-label" style="font-size:11px">送出 18 盒後剩幾盒？</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 9：鮮奶量筒（1000ml → 減100 → 900ml ÷ 6條土司） ===== */
    function renderMilkToast() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        // 量筒
        const cx = 40, topY = 20, botY = 150, w = 34;
        svg += `<rect x="${cx}" y="${topY}" width="${w}" height="${botY - topY}" rx="6" fill="#f4fbff" stroke="#90c7e8" stroke-width="2"/>`;
        const milkTop = s >= 1 ? topY + 18 : topY + 2;
        svg += `<rect x="${cx + 2}" y="${milkTop}" width="${w - 4}" height="${botY - milkTop - 2}" rx="4" fill="#cfe9f7"/>`;
        svg += `<text x="${cx + w / 2}" y="${topY + 13}" text-anchor="middle" class="place-label" style="font-size:8px;fill:#e57373">剩 100ml</text>`;
        svg += `<text x="${cx + w / 2 + 2}" y="${botY - 6}" text-anchor="middle" class="place-label" style="font-size:8px">1000ml</text>`;
        if (s >= 2) svg += `<text x="120" y="40" text-anchor="middle" class="expr-coral" style="font-size:12px">1000 － 100 ＝ 900</text>`;
        if (s >= 3) {
            // 6 條土司（2列3行）
            for (let i = 0; i < 6; i++) {
                const tx = 92 + (i % 3) * 38, ty = 58 + Math.floor(i / 3) * 40;
                svg += `<rect x="${tx}" y="${ty}" width="32" height="34" rx="8" fill="#f7d9a8" stroke="#d9a86a" stroke-width="1.4"/>`;
                svg += `<rect x="${tx + 4}" y="${ty + 4}" width="24" height="12" rx="6" fill="#fce8c8"/>`;
                svg += `<text x="${tx + 16}" y="${ty + 30}" text-anchor="middle" class="place-label" style="font-size:7px;fill:#a17844">150ml</text>`;
            }
            svg += `<text x="168" y="146" text-anchor="middle" class="expr-mint" style="font-size:12px">900 ÷ 6 ＝ 150</text>`;
            svg += `<text x="168" y="160" text-anchor="middle" class="place-label" style="font-size:9px;fill:#26a69a">每條平均 150 毫升 ✓</text>`;
        } else {
            svg += `<rect x="92" y="58" width="114" height="76" rx="10" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="149" y="100" text-anchor="middle" class="place-label" style="font-size:11px">6 條土司平均用？</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 10：教學大樓氣球階梯累計（每層100 → 三層300） ===== */
    function renderBalloons() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        const s = currentStep;
        const floors = 3, fw = 110, fh = 34, fx = 52;
        svg += `<text x="120" y="13" text-anchor="middle" class="place-label">每層 5 間教室 · 每間 20 顆</text>`;
        for (let f = 0; f < floors; f++) {
            const fy = 18 + f * (fh + 6);
            const done = s >= 1;
            svg += `<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" rx="6" fill="${done ? '#fff' : '#faf5ec'}" stroke="${done ? '#ff8a65' : '#e0d5c3'}" stroke-width="1.6"/>`;
            for (let r = 0; r < 5; r++) {
                svg += `<rect x="${fx + 8 + r * 20}" y="${fy + 6}" width="16" height="14" rx="3" fill="${done ? '#e3f2fd' : '#f0ece4'}" stroke="#90a4ae" stroke-width="0.8"/>`;
                if (done) svg += `<circle cx="${fx + 16 + r * 20}" cy="${fy + 12}" r="2.4" fill="#f05a7e"/>`;
            }
            if (done) svg += `<text x="${fx + fw + 6}" y="${fy + 22}" text-anchor="start" class="expr-coral" style="font-size:10px">100 顆</text>`;
            else svg += `<text x="${fx + fw + 6}" y="${fy + 22}" text-anchor="start" class="place-label" style="font-size:9px">？</text>`;
        }
        if (s >= 1) svg += `<text x="120" y="150" text-anchor="middle" class="expr-coral" style="font-size:11px">一層樓：20 × 5 ＝ 100 顆</text>`;
        if (s >= 2) {
            svg += `<rect x="14" y="120" width="212" height="38" rx="10" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="136" text-anchor="middle" class="expr-mint" style="font-size:12px">3 層樓：100 × 3 ＝ 300 顆</text>`;
            svg += `<text x="120" y="152" text-anchor="middle" class="place-label" style="font-size:9px;fill:#26a69a">100 → 200 → 300，階梯累計 ✓</text>`;
        } else {
            svg += `<rect x="14" y="120" width="212" height="38" rx="10" fill="none" stroke="#b2dfdb" stroke-width="1.4" stroke-dasharray="4 3"/>`;
            svg += `<text x="120" y="144" text-anchor="middle" class="place-label" style="font-size:11px">3 層樓一共要幾顆？</text>`;
        }
        layer.innerHTML = svg;
    }

    init();
</script>
