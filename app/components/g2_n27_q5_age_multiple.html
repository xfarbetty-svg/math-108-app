<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-7-Q05 父女年齡倍數棒棒圖</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.age { text-align: center; }
.age-title { font-size: 11px; font-weight: 900; color: #0e7490; letter-spacing: 2px; margin-bottom: 2px; }
.age-stage { display: flex; justify-content: center; }
.age-line { font-size: 13.5px; font-weight: 900; color: #0e7490; margin-top: 2px; min-height: 17px; }
.flip-btn {
  margin-top: 3px;
  border: 2px solid #0e7490;
  background: #fff;
  color: #0e7490;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.flip-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #cffafe; color: #0e7490; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card age">
    <p class="stem"><small>112-2 內湖 期中 四、2</small>曉玉今年 8 歲，爸爸的年紀是曉玉的 5 倍，請問爸爸今年是幾歲？</p>
    <div class="age-title">✦ 父女年齡倍數棒棒圖 ✦</div>
    <div class="age-stage" id="age-stage"></div>
    <div class="age-line" id="age-line"></div>
    <div>
      <button type="button" class="flip-btn" id="flip">翻開爸爸的年齡</button>
      <span class="mode-label" id="mode-label">目前：蓋著</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['40 歲', '45 歲', '35 歲', '13 歲'];
  var ANSWER = 0;
  var picked = -1;
  var revealed = false;

  var stage = document.getElementById('age-stage');
  var ageLine = document.getElementById('age-line');
  var flipBtn = document.getElementById('flip');
  var modeLabel = document.getElementById('mode-label');

  /* 曉玉：1 個 8；爸爸：5 個 8 疊起來 */
  function barsSVG(isRevealed) {
    var s = '<svg width="312" height="140" viewBox="0 0 312 140">';
    var baseY = 112, segH = 20, w = 64;
    /* 曉玉：1 格 */
    var sx = 46;
    s += '<rect x="' + sx + '" y="' + (baseY - segH) + '" width="' + w + '" height="' + segH + '" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>';
    s += '<text x="' + (sx + w / 2) + '" y="' + (baseY - 6) + '" font-size="11" font-weight="900" text-anchor="middle" fill="#1e3a5f">8</text>';
    s += '<text x="' + (sx + w / 2) + '" y="' + (baseY + 16) + '" font-size="11" font-weight="900" text-anchor="middle" fill="#3d3a34">曉玉 8 歲</text>';
    s += '<text x="' + (sx + w / 2) + '" y="' + (baseY - segH - 6) + '" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">1 個 8</text>';
    /* 爸爸：5 格 */
    var dx = 186;
    for (var i = 0; i < 5; i++) {
      var y = baseY - (i + 1) * segH;
      s += '<rect x="' + dx + '" y="' + y + '" width="' + w + '" height="' + (segH - 2) + '" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>';
      if (isRevealed) {
        s += '<text x="' + (dx + w / 2) + '" y="' + (y + 14) + '" font-size="11" font-weight="900" text-anchor="middle" fill="#7c2d12">8</text>';
      }
    }
    if (isRevealed) {
      s += '<text x="' + (dx + w / 2) + '" y="' + (baseY - 5 * segH - 6) + '" font-size="11" font-weight="900" text-anchor="middle" fill="#0e7490">5 個 8 ＝ 8×5＝40</text>';
      s += '<text x="' + (dx + w / 2) + '" y="' + (baseY + 16) + '" font-size="11" font-weight="900" text-anchor="middle" fill="#3d3a34">爸爸 40 歲</text>';
    } else {
      s += '<rect x="' + dx + '" y="' + (baseY - 5 * segH) + '" width="' + w + '" height="' + (5 * segH - 4) + '" rx="4" fill="#e7e5e4" opacity="0.92"/>';
      s += '<text x="' + (dx + w / 2) + '" y="' + (baseY - 5 * segH + 30) + '" font-size="13" font-weight="900" text-anchor="middle" fill="#78716c">？</text>';
      s += '<text x="' + (dx + w / 2) + '" y="' + (baseY + 16) + '" font-size="11" font-weight="900" text-anchor="middle" fill="#3d3a34">爸爸 ？歲</text>';
      s += '<text x="' + (dx + w / 2) + '" y="' + (baseY - 5 * segH - 6) + '" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">5 個 8 疊起來</text>';
    }
    s += '<line x1="30" y1="' + baseY + '" x2="282" y2="' + baseY + '" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>';
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = barsSVG(revealed);
    if (revealed) {
      ageLine.textContent = '5 個 8：8×5＝40（歲）';
      modeLabel.textContent = '目前：已翻開';
      flipBtn.textContent = '蓋回來';
    } else {
      ageLine.textContent = '爸爸的年紀 = 5 個 8';
      modeLabel.textContent = '目前：蓋著';
      flipBtn.textContent = '翻開爸爸的年齡';
    }
  }

  flipBtn.addEventListener('click', function () { revealed = !revealed; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！爸爸的年紀是 5 個 8：8×5＝40 歲。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：「5 倍」是 5 個 8 疊起來，要用乘法 8×5，不是 8＋5；也不是 9×5 或 7×5。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-7-Q05', answer: ANSWER };

  render();
})();
</script>
</body>
</html>
