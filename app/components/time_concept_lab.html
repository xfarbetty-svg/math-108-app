<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3-N-3-17 時間四幕式實驗室</title>
    <style>
        :root {
            --bg-night: #0f172a;
            --bg-day: #38bdf8;
            --accent-yellow: #fde047;
            --accent-orange: #fb923c;
            --text-light: #f8fafc;
            --glass: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            width: 390px; height: 420px;
            background: var(--bg-night);
            color: var(--text-light);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background 0.8s ease;
        }
        /* Header */
        .header {
            height: 38px; padding: 4px 12px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.35);
        }
        .title { font-size: 13px; font-weight: bold; color: var(--accent-yellow); }
        .mute-btn { cursor: pointer; font-size: 18px; }

        /* Main Display Area */
        .stage {
            flex: 1; position: relative;
            display: flex; flex-direction: column; align-items: center;
            padding: 6px 10px;
        }

        /* Clock SVG */
        #clock-container {
            width: 155px; height: 155px; position: relative;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.4));
        }
        .hand { stroke-linecap: round; transform-origin: 100px 100px; transition: transform 0.25s cubic-bezier(0.4, 1.8, 0.55, 0.44); }
        #hand-sec { stroke: #ef4444; stroke-width: 2; }
        #hand-min { stroke: #ffffff; stroke-width: 3.5; }
        #hand-hour { stroke: var(--accent-yellow); stroke-width: 5.5; }

        /* Act Specific UI */
        .ui-panel {
            width: 100%; margin-top: 6px;
            display: none; flex-direction: column; align-items: center;
            gap: 6px;
        }
        .ui-panel.active { display: flex; }
        
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        button {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.25);
            color: white; padding: 5px 11px; border-radius: 16px;
            font-size: 11px; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        button:active { transform: scale(0.92); background: var(--accent-orange); }
        
        /* Timeline Act 3 */
        .timeline-container {
            width: 330px; height: 32px; position: relative;
            background: rgba(255,255,255,0.12); border-radius: 6px; margin-top: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .timeline-mark {
            position: absolute; top: 0; height: 100%; width: 1px; background: rgba(255,255,255,0.3);
        }
        #time-cursor {
            position: absolute; top: -3px; width: 3px; height: 38px;
            background: var(--accent-yellow); transition: left 0.3s;
            box-shadow: 0 0 6px var(--accent-yellow);
        }
        .timeline-label { position: absolute; bottom: 2px; font-size: 8px; transform: translateX(-50%); color: #cbd5e1; }

        /* Movie Act 4 */
        .movie-info { 
            font-size: 12px; text-align: center; background: rgba(0,0,0,0.45); 
            padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(251, 146, 60, 0.4);
            line-height: 1.4;
        }

        /* Navigation */
        .nav {
            height: 48px; display: flex; background: rgba(0,0,0,0.65);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 10px; opacity: 0.65; cursor: pointer; gap: 2px;
        }
        .nav-item.active { opacity: 1; color: var(--accent-yellow); border-top: 2px solid var(--accent-yellow); font-weight: bold; }

        /* Digital Display */
        .digital-time {
            font-family: monospace; font-size: 20px; margin: 3px 0;
            color: var(--accent-yellow); text-shadow: 0 0 5px var(--accent-orange);
            font-weight: bold;
        }
        .sub-desc {
            font-size: 11px; color: #94a3b8; text-align: center;
        }
    </style>
    <script src="../js/audio_manager.js"></script>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="header">
    <div class="title" id="act-title">Act 1: 秒的感受與60進位</div>
    <div class="mute-btn" onclick="speakHint()">🔊</div>
</div>

<div class="stage" id="main-stage">
    <div id="clock-container">
        <svg viewBox="0 0 200 200" width="155" height="155">
            <circle cx="100" cy="100" r="95" fill="rgba(30,41,59,0.85)" stroke="#64748b" stroke-width="2.5"/>
            <!-- Ticks -->
            <g id="ticks"></g>
            <!-- Numbers -->
            <text x="100" y="28" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">12</text>
            <text x="175" y="104" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
            <text x="100" y="180" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
            <text x="25" y="104" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">9</text>
            <!-- Hands -->
            <line id="hand-hour" x1="100" y1="100" x2="100" y2="58" class="hand" />
            <line id="hand-min" x1="100" y1="100" x2="100" y2="34" class="hand" />
            <line id="hand-sec" x1="100" y1="100" x2="100" y2="24" class="hand" />
            <circle cx="100" cy="100" r="4.5" fill="#fde047" />
        </svg>
    </div>

    <div class="digital-time" id="digital-display">10:00:00</div>

    <!-- Act 1: Seconds -->
    <div id="act1" class="ui-panel active">
        <div class="btn-group">
            <button onclick="tickSec()">💓 滴答走1秒</button>
            <button id="auto-btn" onclick="toggleAuto()">▶️ 連續走60秒</button>
            <button onclick="resetTime()">🔄 重置</button>
        </div>
        <div class="sub-desc" id="act1-desc">觀察：秒針每走滿 60 秒，分針就「啪」前進 1 小格（1分鐘）！</div>
    </div>

    <!-- Act 2: Gear Linkage -->
    <div id="act2" class="ui-panel">
        <div class="btn-group">
            <button onclick="addTime(5)">+5 分鐘</button>
            <button onclick="addTime(15)">+15 分鐘</button>
            <button onclick="addTime(60)">+1 小時 (60分)</button>
        </div>
        <div class="sub-desc" id="act2-desc">分針走一圈（60分），時針走一大格（30度）。背景隨晝夜平滑變換！</div>
    </div>

    <!-- Act 3: 24H Timeline -->
    <div id="act3" class="ui-panel">
        <div class="timeline-container" id="timeline">
            <div id="time-cursor"></div>
        </div>
        <div class="btn-group" style="margin-top:6px">
            <button onclick="setTime(10,0)">10:00 (上午10時)</button>
            <button onclick="setTime(14,0)">14:00 (下午2時)</button>
            <button onclick="setTime(20,30)">20:30 (晚上8時半)</button>
        </div>
        <div class="sub-desc">跨過中午 12:00，24 小時制直接加上 12（下午 2 時 = 14:00）。</div>
    </div>

    <!-- Act 4: Movie -->
    <div id="act4" class="ui-panel">
        <div class="movie-info" id="movie-info">
            🎬 <b>神奇貓咪大冒險</b><br>
            上午 10:45 開演 · 片長 90 分鐘 (1時30分)
        </div>
        <button onclick="playMovie()" id="movie-btn" style="background: var(--accent-orange);">🎞️ 模擬放映結束時間</button>
        <div class="sub-desc" id="movie-result">點擊演繹：10:45 + 1小時30分 = 下午 12:15 散場！</div>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" id="tab-act1" onclick="switchAct(1)"><span>⏱️</span><span>Act 1 秒感</span></div>
    <div class="nav-item" id="tab-act2" onclick="switchAct(2)"><span>⚙️</span><span>Act 2 齒輪</span></div>
    <div class="nav-item" id="tab-act3" onclick="switchAct(3)"><span>📏</span><span>Act 3 24小時</span></div>
    <div class="nav-item" id="tab-act4" onclick="switchAct(4)"><span>🎬</span><span>Act 4 經過時間</span></div>
</div>

<div id="act-1-view" style="display:block;"></div>
<div id="act-2-view" style="display:none;"></div>
<div id="act-3-view" style="display:none;"></div>
<div id="act-4-view" style="display:none;"></div>

<script>
    let h = 10, m = 0, s = 0;
    let autoTimer = null;
    let currentAct = 1;

    // Initialize Clock Ticks
    const ticksG = document.getElementById('ticks');
    for(let i=0; i<60; i++) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const angle = i * 6;
        const r1 = (i % 5 === 0) ? 80 : 88;
        line.setAttribute('x1', 100 + r1 * Math.sin(angle * Math.PI/180));
        line.setAttribute('y1', 100 - r1 * Math.cos(angle * Math.PI/180));
        line.setAttribute('x2', 100 + 92 * Math.sin(angle * Math.PI/180));
        line.setAttribute('y2', 100 - 92 * Math.cos(angle * Math.PI/180));
        line.setAttribute('stroke', i % 5 === 0 ? '#fde047' : '#64748b');
        line.setAttribute('stroke-width', i % 5 === 0 ? '2' : '1');
        ticksG.appendChild(line);
    }

    // Initialize Timeline
    const timeline = document.getElementById('timeline');
    for(let i=0; i<=24; i+=3) {
        const mark = document.createElement('div');
        mark.className = 'timeline-mark';
        mark.style.left = (i / 24 * 100) + '%';
        const label = document.createElement('div');
        label.className = 'timeline-label';
        label.innerText = i + 'h';
        label.style.left = (i / 24 * 100) + '%';
        timeline.appendChild(mark);
        timeline.appendChild(label);
    }

    function updateClock() {
        const sDeg = s * 6;
        const mDeg = m * 6 + s * 0.1;
        const hDeg = (h % 12) * 30 + m * 0.5;

        document.getElementById('hand-sec').style.transform = `rotate(${sDeg}deg, 100, 100)`;
        document.getElementById('hand-min').style.transform = `rotate(${mDeg}deg, 100, 100)`;
        document.getElementById('hand-hour').style.transform = `rotate(${hDeg}deg, 100, 100)`;
        
        const displayH = h.toString().padStart(2, '0');
        const displayM = m.toString().padStart(2, '0');
        const displayS = s.toString().padStart(2, '0');
        document.getElementById('digital-display').innerText = `${displayH}:${displayM}:${displayS}`;

        // Act 3 Timeline Cursor
        const totalMinutes = h * 60 + m;
        document.getElementById('time-cursor').style.left = (totalMinutes / 1440 * 100) + '%';

        // Background Color (Day/Night)
        const hourFloat = h + m/60;
        if(hourFloat >= 6 && hourFloat < 16) {
            document.body.style.background = "linear-gradient(to bottom, #0284c7, #38bdf8)";
        } else if(hourFloat >= 16 && hourFloat < 19) {
            document.body.style.background = "linear-gradient(to bottom, #c2410c, #ea580c)";
        } else {
            document.body.style.background = "linear-gradient(to bottom, #090d16, #0f172a)";
        }
    }

    function tickSec() {
        s += 1;
        if (s >= 60) { s = 0; m += 1; }
        if (m >= 60) { m = 0; h = (h + 1) % 24; }
        updateClock();
    }

    function toggleAuto() {
        if (autoTimer) {
            clearInterval(autoTimer);
            autoTimer = null;
            document.getElementById('auto-btn').innerText = "▶️ 連續走60秒";
        } else {
            document.getElementById('auto-btn').innerText = "⏸️ 暫停";
            let count = 0;
            autoTimer = setInterval(() => {
                tickSec();
                count++;
                if (count >= 60) {
                    clearInterval(autoTimer);
                    autoTimer = null;
                    document.getElementById('auto-btn').innerText = "▶️ 連續走60秒";
                    speakHint("剛好滿60秒！分針精確前進了1小格！");
                }
            }, 80);
        }
    }

    function addTime(mins) {
        m += mins;
        while (m >= 60) { m -= 60; h = (h + 1) % 24; }
        s = 0;
        updateClock();
    }

    function setTime(nh, nm) {
        h = nh; m = nm; s = 0;
        updateClock();
    }

    function resetTime() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        h = 10; m = 0; s = 0;
        updateClock();
    }

    function playMovie() {
        setTime(10, 45);
        document.getElementById('movie-result').innerText = "開始播放：10:45 ... 時間流逝中 ...";
        let step = 0;
        const timer = setInterval(() => {
            addTime(15);
            step++;
            if (step >= 6) { // 6 * 15 = 90 mins
                clearInterval(timer);
                document.getElementById('movie-result').innerText = "🎉 散場時間：中午 12:15！(10:45 + 90分)";
                speakHint("電影放映結束！散場時間是中午12時15分！");
            }
        }, 300);
    }

    function switchAct(act) {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        currentAct = act;
        document.querySelectorAll('.nav-item').forEach((el, i) => el.classList.toggle('active', i === act-1));
        document.querySelectorAll('.ui-panel').forEach((el, i) => el.classList.toggle('active', i === act-1));
        for (let i = 1; i <= 4; i++) {
            const v = document.getElementById(`act-${i}-view`);
            if (v) v.style.display = (i === act) ? 'block' : 'none';
        }
        
        const titles = [
            "Act 1: 秒的感受與60進位",
            "Act 2: 齒輪強連動與晝夜",
            "Act 3: 12/24 小時制對照數線",
            "Act 4: 生活時刻與經過時間"
        ];
        document.getElementById('act-title').innerText = titles[act-1];

        if (act === 1) resetTime();
        if (act === 2) setTime(9, 0);
        if (act === 3) setTime(14, 0);
        if (act === 4) setTime(10, 45);
        speakHint();
    }

    function speakHint(customText) {
        const text = customText || (document.getElementById('act-title') ? document.getElementById('act-title').innerText : '');
        if (!text) return;
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'TTS_SPEAK', text: text }, '*');
        } else if (window.AudioManager) {
            window.AudioManager.play(text);
        }
    }

    // Init
    updateClock();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
