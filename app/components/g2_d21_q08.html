<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G2-D-2-1 Q08 - 分類與呈現</title>
    <style>
        :root {
            --primary-bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
            --accent-color: #0984e3;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--primary-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .question-box {
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            padding: 12px 8px;
            font-size: 1rem;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            background: var(--bg-card);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-color);
        }

        .option-btn:hover {
            border-color: var(--accent-color);
            background: #f1f9ff;
        }

        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: var(--correct-color);
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: var(--wrong-color);
        }

        #feedback {
            margin-top: 15px;
            font-weight: bold;
            height: 24px;
        }

        /* SVG Styling */
        .bar-watermelon { fill: #ff4757; stroke: #2f3542; stroke-width: 1; }
        .bar-guava { fill: #7bed9f; stroke: #2f3542; stroke-width: 1; }
        .bar-mango { fill: #ffa502; stroke: #2f3542; stroke-width: 1; }
        .bar-banana { fill: #eccc68; stroke: #2f3542; stroke-width: 1; }
        
        .axis-line { stroke: #2d3436; stroke-width: 2; }
        .baseline { stroke: #000000; stroke-width: 4; stroke-linecap: square; }
        .grid-line { stroke: #dfe6e9; stroke-width: 1; stroke-dasharray: 2; }
        .label-text { font-size: 12px; fill: #2d3436; font-weight: bold; }
        .value-text { font-size: 10px; fill: #636e72; }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="app-container">
    <div class="question-box">
        <div class="question-text">觀察班級喜愛水果直條圖，哪一種水果最受歡迎？</div>
    </div>

    <div class="chart-container">
        <!-- SVG 直條圖 -->
        <svg viewBox="0 0 320 220" width="100%" height="auto">
            <!-- 網格背景 (每2人一格) -->
            <line x1="40" y1="180" x2="300" y2="180" class="grid-line" />
            <line x1="40" y1="160" x2="300" y2="160" class="grid-line" />
            <line x1="40" y1="140" x2="300" y2="140" class="grid-line" />
            <line x1="40" y1="120" x2="300" y2="120" class="grid-line" />
            <line x1="40" y1="100" x2="300" y2="100" class="grid-line" />
            <line x1="40" y1="80" x2="300" y2="80" class="grid-line" />
            <line x1="40" y1="60" x2="300" y2="60" class="grid-line" />
            <line x1="40" y1="40" x2="300" y2="40" class="grid-line" />
            <line x1="40" y1="20" x2="300" y2="20" class="grid-line" />

            <!-- Y軸標籤 -->
            <text x="30" y="185" class="value-text" text-anchor="end">0</text>
            <text x="30" y="145" class="value-text" text-anchor="end">4</text>
            <text x="30" y="105" class="value-text" text-anchor="end">8</text>
            <text x="30" y="65" class="value-text" text-anchor="end">12</text>
            <text x="30" y="25" class="value-text" text-anchor="end">16</text>
            <text x="20" y="15" class="value-text" text-anchor="middle">(人)</text>

            <!-- 直條 (1人 = 10單位高度) -->
            <!-- 西瓜 12 -->
            <rect x="60" y="60" width="40" height="120" class="bar-watermelon" />
            <!-- 芭樂 8 -->
            <rect x="120" y="100" width="40" height="80" class="bar-guava" />
            <!-- 芒果 15 -->
            <rect x="180" y="30" width="40" height="150" class="bar-mango" />
            <!-- 香蕉 6 -->
            <rect x="240" y="120" width="40" height="60" class="bar-banana" />

            <!-- 0刻度粗黑基準線 (嚴格切齊底部) -->
            <line x1="40" y1="180" x2="300" y2="180" class="baseline" />
            <line x1="40" y1="20" x2="40" y2="180" class="axis-line" />

            <!-- X軸標籤 -->
            <text x="80" y="205" class="label-text" text-anchor="middle">西瓜</text>
            <text x="140" y="205" class="label-text" text-anchor="middle">芭樂</text>
            <text x="200" y="205" class="label-text" text-anchor="middle">芒果</text>
            <text x="260" y="205" class="label-text" text-anchor="middle">香蕉</text>
        </svg>
    </div>

    <div class="options-grid" id="options-container">
        <button class="option-btn" onclick="checkAnswer(0)">芒果（15人）</button>
        <button class="option-btn" onclick="checkAnswer(1)">西瓜（12人）</button>
        <button class="option-btn" onclick="checkAnswer(2)">芭樂（8人）</button>
        <button class="option-btn" onclick="checkAnswer(3)">香蕉（6人）</button>
    </div>

    <div id="feedback"></div>
</div>

<script>
    const correctAnswer = 0;
    let answered = false;

    function checkAnswer(index) {
        if (answered) return;
        
        const buttons = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback');
        
        if (index === correctAnswer) {
            buttons[index].classList.add('correct');
            feedback.innerText = "太棒了！芒果的高度最高，是 15 人。";
            feedback.style.color = "var(--correct-color)";
            createConfetti();
        } else {
            buttons[index].classList.add('wrong');
            buttons[correctAnswer].classList.add('correct');
            feedback.innerText = "再看一次，哪一個直條最高呢？";
            feedback.style.color = "var(--wrong-color)";
        }
        
        answered = true;
    }

    function createConfetti() {
        // 簡單的答對特效
        for(let i=0; i<20; i++) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.left = Math.random() * 100 + 'vw';
            div.style.top = '-10px';
            div.style.width = '10px';
            div.style.height = '10px';
            div.style.backgroundColor = ['#ff4757','#7bed9f','#ffa502','#eccc68'][Math.floor(Math.random()*4)];
            div.style.borderRadius = '50%';
            div.style.zIndex = '100';
            document.body.appendChild(div);
            
            const animation = div.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(100vh) rotate(${Math.random()*360}deg)`, opacity: 0 }
            ], {
                duration: 1000 + Math.random() * 1000,
                easing: 'ease-out'
            });
            
            animation.onfinish = () => div.remove();
        }
    }
</script>

<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
