<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-8-Q05 曉雪摺紙鶴時間計算</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.timeline { text-align: center; }
.timeline-title { font-size: 11px; font-weight: 900; color: #0e7490; letter-spacing: 2px; margin-bottom: 2px; }
.timeline-stage { display: flex; justify-content: center; }
.timeline-line { font-size: 13.5px; font-weight: 900; color: #0e7490; margin-top: 2px; min-height: 17px; }
.flip-btn {
  margin-top: 3px;
  border: 2px solid #0e7490;
  background: var(--bg-card);
  color: #0e7490;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.flip-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #cffafe; color: #0e7490; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card timeline">
    <p class="stem"><small>113-2 內湖 期末 二、2</small>曉雪摺一隻紙鶴要花 3 分鐘，她摺了 9 隻紙鶴，中間休息了 15 分鐘，請問曉雪摺完紙鶴，總共花了幾分鐘？</p>
    <div class="timeline-title">✦ 紙鶴時間軸 ✦</div>
    <div class="timeline-stage" id="tl-stage"></div>
    <div class="timeline-line" id="tl-line"></div>
    <div>
      <button type="button" class="flip-btn" id="flip">標出總時間</button>
      <span class="mode-label" id="mode-label">目前：排時間軸</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['42 分鐘', '27 分鐘', '24 分鐘', '18 分鐘'];
  var ANSWER = 0;
  var picked = -1;
  var revealed = false;

  var stage = document.getElementById('tl-stage');
  var line = document.getElementById('tl-line');
  var flipBtn = document.getElementById('flip');
  var modeLabel = document.getElementById('mode-label');

  function crane(x, y, sc) {
    var s = '<g transform="translate(' + x + ',' + y + ') scale(' + (sc || 1) + ')">';
    s += '<path d="M0 10 L14 0 L4 10 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="1" stroke-linejoin="round"/>';
    s += '<path d="M0 10 L14 0 L12 12 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="1" stroke-linejoin="round"/>';
    s += '<circle cx="13.2" cy="1.4" r="1" fill="#7f1d1d"/>';
    s += '</g>';
    return s;
  }

  function timelineSVG(isRevealed) {
    var s = '<svg width="316" height="132" viewBox="0 0 316 132">';
    /* 軸線 */
    var axY = 92;
    s += '<line x1="10" y1="' + axY + '" x2="306" y2="' + axY + '" stroke="#a8a29e" stroke-width="2" stroke-linecap="round"/>';
    /* 9 隻紙鶴（每隻 3 分鐘段）＋15 分鐘休息段 */
    var seg = 24; /* 9×24 = 216 + rest 48 + label */
    for (var i = 0; i < 9; i++) {
      var x0 = 16 + i * seg;
      s += '<rect x="' + x0 + '" y="' + (axY - 14) + '" width="' + (seg - 4) + '" height="14" rx="3" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>';
      s += '<text x="' + (x0 + (seg - 4) / 2) + '" y="' + (axY - 3.5) + '" font-size="9" font-weight="900" text-anchor="middle" fill="#b91c1c">' + (isRevealed ? '3' : '?') + '</text>';
      s += crane(x0 + 2, axY - 34, 0.55);
    }
    var rx = 16 + 9 * seg;
    s += '<rect x="' + rx + '" y="' + (axY - 14) + '" width="52" height="14" rx="3" fill="#d6d3d1" stroke="#78716c" stroke-width="1"/>';
    s += '<text x="' + (rx + 26) + '" y="' + (axY - 3.5) + '" font-size="9" font-weight="900" text-anchor="middle" fill="#44403c">15</text>';
    s += '<text x="' + (rx + 26) + '" y="' + (axY - 18) + '" font-size="8.5" font-weight="900" text-anchor="middle" fill="#57534e">☕ 休息</text>';
    /* 軸刻度文字 */
    s += '<text x="10" y="106" font-size="9" font-weight="700" fill="#78716c">開始</text>';
    s += '<text x="306" y="106" font-size="9" font-weight="700" text-anchor="end" fill="#78716c">摺完紙鶴</text>';
    if (!isRevealed) {
      s += '<text x="158" y="126" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">摺紙鶴的時間 + 休息時間 = 總共時間</text>';
    } else {
      s += '<rect x="16" y="110" width="284" height="16" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>';
      s += '<text x="158" y="121.5" font-size="10.5" font-weight="900" text-anchor="middle" fill="#065f46">3×9＝27（分），27＋15＝42 ＝ 共 42 分鐘</text>';
    }
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = timelineSVG(revealed);
    if (revealed) {
      line.textContent = '先乘：3×9＝27（分鐘）→ 再加：27＋15＝42';
      modeLabel.textContent = '目前：已標好';
      flipBtn.textContent = '收回時間軸';
    } else {
      line.textContent = '9 隻紙鶴排上時間軸，中間休息 15 分鐘';
      modeLabel.textContent = '目前：排時間軸';
      flipBtn.textContent = '標出總時間';
    }
  }

  flipBtn.addEventListener('click', function () { revealed = !revealed; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, answer: '', msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！先算摺紙鶴 3×9＝27 分鐘，再加休息 15 分鐘：27＋15＝42 分鐘。';
      return { ok: true, answer: CHOICES[picked] };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：題目問「總共」——摺紙鶴的時間（3×9＝27）和休息 15 分鐘都要算進去。';
    return { ok: false, answer: CHOICES[picked] };
  };

  window.__q = { id: 'G2-N-2-8-Q05', correct_index: ANSWER, choices: CHOICES };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
