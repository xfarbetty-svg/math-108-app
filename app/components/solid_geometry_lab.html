<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G3-S-3-4 幾何形體之操作（真題題幹圖）</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
  :root {
    --paper:#fdfbf7; --ink:#3d3a34; --line:#4b4a46; --muted:#8a857b;
    --wood:#d2b48c; --fill-a:#f6e4c9; --fill-b:#dcebf5; --fill-c:#ece0f4;
    --accent:#f4694b; --grid:#b9c4cf;
  }
  html[data-theme="dark"] {
    --paper:var(--bg-main); --ink:var(--text-primary); --line:var(--svg-stroke);
    --muted:var(--text-secondary); --wood:#334155; --fill-a:#3b3529; --fill-b:#243b50; --fill-c:#3b3348;
    --accent:var(--accent-primary); --grid:#475569;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; max-width:390px; height:420px; overflow:hidden; }
  body { font-family:"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--paper); color:var(--ink); }
  #app { width:100%; max-width:390px; height:420px; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; }
  .topbar { height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
            padding:0 12px; background:var(--bg-elevated); border-bottom:1px solid var(--border-color); }
  .topbar .name { font-size:12px; font-weight:700; color:var(--ink); }
  .topbar .qtag { font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent);
                  border-radius:9px; padding:1px 7px; }
  .scene { position:relative; flex:1; width:100%; max-width:390px; height:352px; overflow:hidden; }
  .scene svg { display:block; width:100%; max-width:390px; height:340px; }
  .scene .cap { font-size:12px; fill:var(--ink); font-weight:700; }
  .scene .lbl { font-size:12px; fill:var(--ink); font-weight:700; }
  .scene .dim { font-size:11px; fill:var(--muted); }
  .scene .hit { cursor:pointer; }
  .scene .hit.on { stroke:var(--accent); }
  .footer { height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
            padding:0 16px; background:var(--bg-elevated); border-top:1px solid var(--border-color); }
  .footer .hint { font-size:10px; color:var(--muted); max-width:270px; }
  .footer .count { font-size:10px; color:var(--muted); font-weight:700; white-space:nowrap; }

/* G3 窄屏_one-screen 收斂 */
#q-badge, #q-focus, .q-badge, .q-focus, .qtag, #qtag {
  max-width: calc(100% - 16px) !important; right: 8px !important; box-sizing: border-box !important;
  white-space: normal !important; overflow-wrap: anywhere !important;
}
svg text { max-width: 100%; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><span class="name">S-3-4 幾何形體之操作</span><span class="qtag" id="qtag">Q01</span></div>
  <div class="scene" id="scene"></div>
  <div class="footer"><span class="hint" id="hint"></span><span class="count" id="count">已標記 0 處</span></div>
</div>

<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const qNum = (() => { const n = parseInt(params.get('q'), 10); return n >= 1 && n <= 4 ? n : 1; })();
  const theme = params.get('theme');
  if (theme === 'dark' || theme === 'light') {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('math108_theme', theme); } catch (e) {}
  } else {
    try { document.documentElement.dataset.theme = localStorage.getItem('math108_theme') || 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });

  const wrap = (inner) => '<svg viewBox="0 0 390 340" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
  const txt = (x, y, s, cls, anchor) => '<text x="' + x + '" y="' + y + '" class="' + (cls || 'lbl') + '" text-anchor="' + (anchor || 'middle') + '">' + s + '</text>';
  const line = (x1, y1, x2, y2, w) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--line)" stroke-width="' + (w || 5) + '" stroke-linecap="round"/>';
  const stick = (x1, y1, x2, y2) => '<line class="hit" data-kind="stick" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>';

  // 題組一：木棍排出圖案（3 / 5 / 7 根）
  function sticksScene() {
    let s = txt(195, 24, '題目：下面是用木棍排出來的圖案', 'cap');
    s += stick(28, 70, 92, 70) + stick(28, 70, 60, 126) + stick(92, 70, 60, 126);
    s += txt(60, 150, '圖①', 'lbl');
    // 圖②：梯形 5 根（上、下、兩腰、中間一根）
    s += stick(146, 70, 222, 70) + stick(134, 126, 234, 126) +
         stick(146, 70, 134, 126) + stick(222, 70, 234, 126) + stick(176, 70, 184, 126);
    s += txt(184, 150, '圖②', 'lbl');
    // 圖③：兩個相連梯形 7 根
    s += stick(252, 70, 310, 70) + stick(310, 70, 368, 70) +
         stick(244, 126, 310, 126) + stick(310, 126, 376, 126) +
         stick(252, 70, 244, 126) + stick(310, 70, 310, 126) + stick(368, 70, 376, 126);
    s += txt(310, 150, '圖③', 'lbl');
    s += txt(195, 186, '後面還有「……」', 'dim');
    s += txt(195, 224, '(1) 圖③比圖②多用幾根木棍？', 'lbl');
    s += txt(195, 256, '(2) 圖⑤需要用幾根木棍？', 'lbl');
    s += txt(195, 300, '點選木棍可以逐根標記', 'dim');
    s += txt(195, 326, '兩小題請一起看同一組圖案', 'dim');
    return wrap(s);
  }

  // 圓規題：折線甲 + A 點虛線 + 圓規
  function compassScene() {
    let s = txt(195, 24, '以 A 點為起點，在虛線上畫出和甲線一樣長的線', 'cap');
    const pts = [[56, 96], [108, 72], [162, 116], [216, 80], [268, 124]];
    for (let i = 0; i < pts.length - 1; i++) {
      s += '<line class="hit" data-kind="seg" x1="' + pts[i][0] + '" y1="' + pts[i][1] + '" x2="' + pts[i + 1][0] + '" y2="' + pts[i + 1][1] + '" stroke="var(--line)" stroke-width="4"/>';
    }
    pts.forEach((p) => { s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="var(--ink)"/>'; });
    s += txt(38, 84, '甲', 'lbl');
    s += '<line x1="56" y1="238" x2="332" y2="238" stroke="var(--grid)" stroke-width="2" stroke-dasharray="7 6"/>';
    s += '<circle cx="56" cy="238" r="5" fill="var(--ink)"/>';
    s += txt(56, 262, 'A', 'lbl');
    s += '<circle cx="296" cy="122" r="6" fill="none" stroke="var(--line)" stroke-width="3"/>';
    s += '<line x1="294" y1="128" x2="278" y2="196" stroke="var(--line)" stroke-width="4"/>';
    s += '<line x1="300" y1="128" x2="316" y2="196" stroke="var(--line)" stroke-width="4"/>';
    s += txt(297, 216, '圓規', 'dim');
    s += txt(195, 300, '甲線有幾個轉折點？先數一數', 'dim');
    s += txt(195, 326, '虛線左端是 A 點', 'dim');
    return wrap(s);
  }

  // base-ten 積木圖形
  const cube = (x, y) =>
    '<rect x="' + (x + 7) + '" y="' + (y - 7) + '" width="38" height="38" fill="var(--fill-a)" stroke="var(--line)" stroke-width="2"/>' +
    '<rect x="' + x + '" y="' + y + '" width="38" height="38" fill="var(--fill-a)" stroke="var(--line)" stroke-width="2"/>';
  const flat = (x, y) => '<rect x="' + x + '" y="' + y + '" width="38" height="38" fill="var(--fill-b)" stroke="var(--line)" stroke-width="2"/>';
  const rod = (x, y) => '<rect x="' + x + '" y="' + y + '" width="66" height="9" fill="var(--fill-c)" stroke="var(--line)" stroke-width="2"/>';
  const unit = (x, y) => '<rect x="' + x + '" y="' + y + '" width="11" height="11" fill="var(--fill-a)" stroke="var(--line)" stroke-width="1.5"/>';

  function blocksScene(which) {
    let s = '';
    if (which === 3) {
      s += txt(195, 22, '題目：數數看，下圖的積木合起來是多少？', 'cap');
      s += cube(30, 56) + txt(49, 112, '千', 'dim');
      for (let i = 0; i < 5; i++) s += flat(96 + i * 46, 56);
      s += txt(195, 112, '百', 'dim');
      for (let i = 0; i < 4; i++) s += rod(50, 140 + i * 20);
      s += txt(195, 236, '十', 'dim');
      [[40, 250], [120, 250], [200, 250]].forEach((g) => { for (let k = 0; k < 5; k++) s += unit(g[0] + k * 12, g[1]); });
      for (let k = 0; k < 1; k++) s += unit(280 + k * 12, 250);
      s += txt(195, 284, '一：分成 5、5、5、1 四群', 'dim');
      s += txt(195, 314, '點選各類積木，對照千、百、十、一的位置', 'dim');
    } else {
      s += txt(195, 22, '題目：數數看，合起來的數字是多少？', 'cap');
      [34, 100, 166, 232].forEach((x) => { s += cube(x, 42); });
      s += txt(195, 100, '千', 'dim');
      [28, 94, 160, 226, 292].forEach((x) => { s += flat(x, 112); });
      s += txt(195, 168, '百', 'dim');
      [40, 130, 220, 310].forEach((x) => { s += rod(x, 182); s += rod(x, 198); });
      s += txt(195, 226, '十', 'dim');
      [80, 92, 104].forEach((x) => { s += unit(x, 244); });
      s += txt(195, 284, '一', 'dim');
      s += txt(195, 314, '長條代表十，平面代表百，立方代表千', 'dim');
    }
    return wrap(s);
  }

  const HINTS = [
    '點選木棍數一數，看看圖形怎麼長大。',
    '數數甲線有幾個轉折點，A 點在虛線左端。',
    '點選各類積木，對照千、百、十、一的位置。',
    '點選各類積木，對照千、百、十、一的位置。'
  ];
  const scene = document.getElementById('scene');
  scene.innerHTML = qNum === 1 ? sticksScene() : qNum === 2 ? compassScene() : blocksScene(qNum);
  document.getElementById('qtag').textContent = 'Q' + String(qNum).padStart(2, '0');
  document.getElementById('hint').textContent = HINTS[qNum - 1];

  let marked = 0;
  scene.addEventListener('click', function (e) {
    const t = e.target.closest('.hit');
    if (!t) return;
    const on = !t.classList.contains('on');
    t.classList.toggle('on', on);
    marked += on ? 1 : -1;
    document.getElementById('count').textContent = '已標記 ' + marked + ' 處';
  });
})();
</script>
</body>
</html>
