<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G3-S-3-4 幾何形體之操作（真題題幹圖）</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
  :root {
    --paper:#fdfbf7; --ink:#3d3a34; --line:#4b4a46; --muted:#8a857b;
    --wood:#d2b48c; --added:#b07d3f; --fill-a:#f6e4c9; --fill-b:#dcebf5; --fill-c:#ece0f4;
    --accent:#f4694b; --grid:#b9c4cf;
  }
  html[data-theme="dark"] {
    --paper:var(--bg-main); --ink:var(--text-primary); --line:var(--svg-stroke);
    --muted:var(--text-secondary); --wood:#334155; --added:#8fb6d4; --fill-a:#3b3529; --fill-b:#243b50; --fill-c:#3b3348;
    --accent:var(--accent-primary); --grid:#475569;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; max-width:390px; height:420px; overflow:hidden; }
  body { font-family:"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--paper); color:var(--ink); }
  #app { width:100%; max-width:390px; height:420px; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; }
  .topbar { height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
            padding:0 12px; background:var(--bg-elevated); border-bottom:1px solid var(--border-color); }
  .topbar .name { font-size:12px; font-weight:700; color:var(--ink); }
  .topbar .qtag { font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent);
                  border-radius:9px; padding:1px 7px; }
  .scene { position:relative; flex:1; width:100%; max-width:390px; height:352px; overflow:hidden; }
  .scene svg { display:block; width:100%; max-width:390px; height:340px; }
  .scene .cap { font-size:12px; fill:var(--ink); font-weight:700; }
  .scene .lbl { font-size:12px; fill:var(--ink); font-weight:700; }
  .scene .dim { font-size:11px; fill:var(--muted); }
  .scene .cnt { font-size:12px; fill:var(--accent); font-weight:700; }
  .scene .hit { cursor:pointer; }
  .scene .wood { stroke:var(--line); stroke-width:6; stroke-linecap:round; transition:stroke .12s; }
  .scene .added .wood { stroke:var(--added); }
  .scene .hit.on .wood { stroke:var(--accent); }
  .scene .tap { stroke:transparent; stroke-width:18; stroke-linecap:round; pointer-events:stroke; }
  .scene .joint { fill:var(--line); pointer-events:none; }
  /* q=2 圓規複製教具專用 */
  .progress { font-size:10px; font-weight:700; color:var(--accent); white-space:nowrap; }
  .compass { transition:transform .28s ease; pointer-events:none; }
  .scene .c-leg, .scene .c-handle { stroke:var(--line); stroke-width:3.5; stroke-linecap:round; }
  .scene .c-pivot { fill:var(--paper); stroke:var(--line); stroke-width:2; }
  .scene .c-cap { fill:var(--line); }
  .scene .c-foot { fill:var(--accent); }
  .scene .seg.sel .seg-line { stroke:var(--accent); stroke-width:6; }
  .scene .copy-seg { stroke-linecap:round; stroke-width:6; }
  .scene .copy-tick { fill:none; stroke-width:2.5; }
  #measureTag { font-size:11px; fill:var(--accent); font-weight:700; pointer-events:none; }
  .footer { height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
            padding:0 16px; background:var(--bg-elevated); border-top:1px solid var(--border-color); }
  .footer .hint { font-size:10px; color:var(--muted); max-width:270px; }
  .footer .count { font-size:10px; color:var(--muted); font-weight:700; white-space:nowrap; }
  .q2 .footer { padding:0 10px; gap:8px; }
  .act { font-family:inherit; font-size:11px; font-weight:700; padding:5px 10px; border-radius:8px;
         border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer;
         -webkit-appearance:none; appearance:none; white-space:nowrap; }
  .act:disabled { opacity:.4; cursor:default; }
  .act.reset { background:transparent; color:var(--ink); border-color:var(--border-color); }

/* G3 窄屏_one-screen 收斂 */
#q-focus, .q-focus, .qtag, #qtag {
  max-width: calc(100% - 16px) !important; right: 8px !important; box-sizing: border-box !important;
  white-space: normal !important; overflow-wrap: anywhere !important;
}
svg text { max-width: 100%; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><span class="name">S-3-4 幾何形體之操作</span><span class="qtag" id="qtag">Q01</span></div>
  <div class="scene" id="scene"></div>
  <div class="footer"><span class="hint" id="hint"></span><span class="count" id="count">已標記 0 處</span></div>
</div>

<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const qNum = (() => { const n = parseInt(params.get('q'), 10); return n >= 1 && n <= 4 ? n : 1; })();
  const theme = params.get('theme');
  if (theme === 'dark' || theme === 'light') {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('math108_theme', theme); } catch (e) {}
  } else {
    try { document.documentElement.dataset.theme = localStorage.getItem('math108_theme') || 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });

  const wrap = (inner) => '<svg viewBox="0 0 390 340" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
  const txt = (x, y, s, cls, anchor) => '<text x="' + x + '" y="' + y + '" class="' + (cls || 'lbl') + '" text-anchor="' + (anchor || 'middle') + '">' + s + '</text>';
  const line = (x1, y1, x2, y2, w) => '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--line)" stroke-width="' + (w || 5) + '" stroke-linecap="round"/>';
  const stick = (x1, y1, x2, y2) => '<line class="hit" data-kind="stick" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>';

  // 題組一：木棍排出圖案（3 / 5 / 7 根）
  // 每根都是「有端點圓點的獨立木棍」；共用邊只畫一次，新增的 2 根用暖色標示。
  function sticksScene() {
    // segs: [x1,y1,x2,y2,是否為新增]
    function figure(segs) {
      let out = '';
      const pts = {};
      segs.forEach(function (s) {
        const extra = s[4] ? ' added' : '';
        out += '<g class="hit' + extra + '" data-kind="stick">' +
          '<line class="wood" x1="' + s[0] + '" y1="' + s[1] + '" x2="' + s[2] + '" y2="' + s[3] + '"/>' +
          '<line class="tap" x1="' + s[0] + '" y1="' + s[1] + '" x2="' + s[2] + '" y2="' + s[3] + '"/>' +
          '</g>';
        pts[s[0] + ',' + s[1]] = 1;
        pts[s[2] + ',' + s[3]] = 1;
      });
      Object.keys(pts).forEach(function (k) {
        const p = k.split(',');
        out += '<circle class="joint" cx="' + p[0] + '" cy="' + p[1] + '" r="4"/>';
      });
      return out;
    }
    const YT = 62, YB = 109;
    let s = '';
    s += txt(14, 24, '數數看：下面是用木棍排成的圖案', 'cap', 'start');
    s += '<text id="stickCount" x="372" y="24" class="cnt" text-anchor="end">已點 0 根</text>';

    // 圖①：1 個倒三角形，3 根
    s += figure([[16, YT, 70, YT], [70, YT, 43, YB], [43, YB, 16, YT]]);
    s += txt(43, 138, '圖①', 'lbl');

    // 圖②：右側共享一邊接出 1 個正三角形，共 5 根（新增 2 根為暖色）
    s += figure([[122, YT, 176, YT], [176, YT, 149, YB], [149, YB, 122, YT],
                 [149, YB, 203, YB, 1], [203, YB, 176, YT, 1]]);
    s += txt(162, 138, '圖②', 'lbl');

    // 圖③：再接出 1 個倒三角形，共 7 根
    s += figure([[232, YT, 286, YT], [286, YT, 259, YB], [259, YB, 232, YT],
                 [259, YB, 313, YB, 1], [313, YB, 286, YT, 1],
                 [286, YT, 340, YT, 1], [340, YT, 313, YB, 1]]);
    s += txt(286, 138, '圖③', 'lbl');

    s += txt(195, 176, '(1) 圖③比圖②多用幾根木棍？', 'lbl');
    s += txt(195, 204, '(2) 圖⑤需要用幾根木棍？', 'lbl');
    s += txt(195, 244, '每往右多接一個三角形（組成梯形），會多用幾根木棍呢？', 'dim');
    s += txt(195, 268, '點擊木棍數一數！', 'dim');
    return wrap(s);
  }

  // 圓規題：折線甲 + A 點虛線 + 可操作圓規（真實量距／張合／逐段截取）
  const Q2_PTS = [[56, 110], [108, 86], [162, 130], [216, 94], [268, 138]];
  const Q2_COLORS = ['#f4694b', '#3b82f6', '#16a34a', '#a855f7'];
  const Q2_X0 = 56, Q2_X1 = 336, Q2_Y = 240, Q2_LEG = 72;

  // 以垂直平分線定位圓規：兩腳（局部 ±half, Q2_LEG）旋轉 φ 後精準落在線段兩端。
  function compassPose(a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.sqrt(dx * dx + dy * dy);
    const phi = Math.atan2(dy, dx);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    return {
      len: len, half: len / 2, rot: phi * 180 / Math.PI,
      qx: mx + Q2_LEG * Math.sin(phi), qy: my - Q2_LEG * Math.cos(phi)
    };
  }

  function compassMarkup() {
    return '<g id="compass" class="compass" data-state="idle" data-half="28" data-rot="0" ' +
      'transform="translate(300,168) rotate(0)">' +
      '<line class="c-handle" x1="0" y1="0" x2="0" y2="-14"/>' +
      '<circle class="c-cap" cx="0" cy="-15" r="3"/>' +
      '<circle class="c-pivot" cx="0" cy="0" r="4.5"/>' +
      '<line class="c-leg" x1="0" y1="0" x2="-28" y2="' + Q2_LEG + '"/>' +
      '<line class="c-leg" x1="0" y1="0" x2="28" y2="' + Q2_LEG + '"/>' +
      '<circle class="c-foot" cx="-28" cy="' + Q2_LEG + '" r="3.5"/>' +
      '<circle class="c-foot" cx="28" cy="' + Q2_LEG + '" r="3.5"/>' +
      '</g>';
  }

  function compassScene() {
    let s = txt(195, 20, '以 A 點為起點，在虛線上畫出和甲線一樣長的直線', 'cap');
    s += '<g id="segs">';
    for (let i = 0; i < Q2_PTS.length - 1; i++) {
      const a = Q2_PTS[i], b = Q2_PTS[i + 1];
      s += '<g class="hit seg" data-kind="seg" data-idx="' + i + '">' +
        '<line class="seg-line" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] +
        '" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>' +
        '<line class="tap" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>' +
        '</g>';
    }
    s += '</g>';
    Q2_PTS.forEach((p) => { s += '<circle class="joint" cx="' + p[0] + '" cy="' + p[1] + '" r="4"/>'; });
    s += '<text id="measureTag" x="0" y="0" text-anchor="middle" style="display:none">✓ 已量取</text>';
    s += txt(34, 88, '甲', 'lbl');
    s += '<line x1="' + Q2_X0 + '" y1="' + Q2_Y + '" x2="' + Q2_X1 + '" y2="' + Q2_Y +
         '" stroke="var(--grid)" stroke-width="2" stroke-dasharray="7 6"/>';
    s += '<circle cx="' + Q2_X0 + '" cy="' + Q2_Y + '" r="5" fill="var(--ink)"/>';
    s += txt(Q2_X0, 264, 'A', 'lbl');
    s += '<g id="drawLayer"></g>';
    s += compassMarkup();
    s += txt(195, 292, '① 點折線甲的一段量距　② 按下方按鈕逐段截取', 'dim');
    s += '<text id="q2hint" x="195" y="316" class="dim" text-anchor="middle">圓規量的是長度，形狀可以從折線變成直線</text>';
    return wrap(s);
  }

  // base-ten 積木圖形
  const cube = (x, y) =>
    '<rect x="' + (x + 7) + '" y="' + (y - 7) + '" width="38" height="38" fill="var(--fill-a)" stroke="var(--line)" stroke-width="2"/>' +
    '<rect x="' + x + '" y="' + y + '" width="38" height="38" fill="var(--fill-a)" stroke="var(--line)" stroke-width="2"/>';
  const flat = (x, y) => '<rect x="' + x + '" y="' + y + '" width="38" height="38" fill="var(--fill-b)" stroke="var(--line)" stroke-width="2"/>';
  const rod = (x, y) => '<rect x="' + x + '" y="' + y + '" width="66" height="9" fill="var(--fill-c)" stroke="var(--line)" stroke-width="2"/>';
  const unit = (x, y) => '<rect x="' + x + '" y="' + y + '" width="11" height="11" fill="var(--fill-a)" stroke="var(--line)" stroke-width="1.5"/>';

  function blocksScene(which) {
    let s = '';
    if (which === 3) {
      s += txt(195, 22, '題目：數數看，下圖的積木合起來是多少？', 'cap');
      s += cube(30, 56) + txt(49, 112, '千', 'dim');
      for (let i = 0; i < 5; i++) s += flat(96 + i * 46, 56);
      s += txt(195, 112, '百', 'dim');
      for (let i = 0; i < 4; i++) s += rod(50, 140 + i * 20);
      s += txt(195, 236, '十', 'dim');
      [[40, 250], [120, 250], [200, 250]].forEach((g) => { for (let k = 0; k < 5; k++) s += unit(g[0] + k * 12, g[1]); });
      for (let k = 0; k < 1; k++) s += unit(280 + k * 12, 250);
      s += txt(195, 284, '一：分成 5、5、5、1 四群', 'dim');
      s += txt(195, 314, '點選各類積木，對照千、百、十、一的位置', 'dim');
    } else {
      s += txt(195, 22, '題目：數數看，合起來的數字是多少？', 'cap');
      [34, 100, 166, 232].forEach((x) => { s += cube(x, 42); });
      s += txt(195, 100, '千', 'dim');
      [28, 94, 160, 226, 292].forEach((x) => { s += flat(x, 112); });
      s += txt(195, 168, '百', 'dim');
      [40, 130, 220, 310].forEach((x) => { s += rod(x, 182); s += rod(x, 198); });
      s += txt(195, 226, '十', 'dim');
      [80, 92, 104].forEach((x) => { s += unit(x, 244); });
      s += txt(195, 284, '一', 'dim');
      s += txt(195, 314, '長條代表十，平面代表百，立方代表千', 'dim');
    }
    return wrap(s);
  }

  const HINTS = [
    '點擊木棍數一數，看看每次多幾根。',
    '數數甲線有幾個轉折點，A 點在虛線左端。',
    '點選各類積木，對照千、百、十、一的位置。',
    '點選各類積木，對照千、百、十、一的位置。'
  ];
  const scene = document.getElementById('scene');
  scene.innerHTML = qNum === 1 ? sticksScene() : qNum === 2 ? compassScene() : blocksScene(qNum);
  document.getElementById('qtag').textContent = 'Q' + String(qNum).padStart(2, '0');
  document.getElementById('hint').textContent = HINTS[qNum - 1];

  if (qNum === 2) {
    document.getElementById('app').classList.add('q2');
    document.querySelector('.topbar').insertAdjacentHTML('beforeend',
      '<span id="q2progress" class="progress">已複製 0 / 4 段</span>');
    document.querySelector('.footer').innerHTML =
      '<button id="btnPlace" class="act" disabled>📍 移到 A 點虛線截取此段</button>' +
      '<button id="btnReset" class="act reset">↺ 重置</button>';

    const segEls = Array.prototype.slice.call(scene.querySelectorAll('.seg'));
    const segs = [];
    for (let i = 0; i < Q2_PTS.length - 1; i++) segs.push(compassPose(Q2_PTS[i], Q2_PTS[i + 1]));
    const drawLayer = scene.querySelector('#drawLayer');
    const compass = scene.querySelector('#compass');
    const measureTag = scene.querySelector('#measureTag');
    const q2hint = scene.querySelector('#q2hint');
    const btnPlace = document.getElementById('btnPlace');
    const btnReset = document.getElementById('btnReset');
    const progress = document.getElementById('q2progress');
    let selected = -1, cursor = Q2_X0, copied = 0;

    function setCompass(pose, state) {
      compass.setAttribute('transform', 'translate(' + pose.qx.toFixed(1) + ',' + pose.qy.toFixed(1) +
        ') rotate(' + pose.rot.toFixed(1) + ')');
      const legs = compass.querySelectorAll('.c-leg');
      const feet = compass.querySelectorAll('.c-foot');
      const h = pose.half.toFixed(1);
      legs[0].setAttribute('x2', -h); legs[1].setAttribute('x2', h);
      feet[0].setAttribute('cx', -h); feet[1].setAttribute('cx', h);
      compass.setAttribute('data-half', h);
      compass.setAttribute('data-rot', pose.rot.toFixed(1));
      compass.setAttribute('data-state', state);
    }
    function clearSelection() {
      segEls.forEach(function (g) { g.classList.remove('sel'); });
      measureTag.style.display = 'none';
      selected = -1;
      btnPlace.disabled = true;
    }
    function reset() {
      drawLayer.innerHTML = '';
      cursor = Q2_X0; copied = 0;
      progress.textContent = '已複製 0 / 4 段';
      clearSelection();
      setCompass({ qx: 300, qy: 168, half: 28, rot: 0 }, 'idle');
      q2hint.textContent = '圓規量的是長度，形狀可以從折線變成直線';
    }

    segEls.forEach(function (g, idx) {
      g.addEventListener('click', function () {
        selected = idx;
        segEls.forEach(function (o) { o.classList.remove('sel'); });
        g.classList.add('sel');
        setCompass(segs[idx], 'measuring');
        measureTag.setAttribute('x', (Q2_PTS[idx][0] + Q2_PTS[idx + 1][0]) / 2);
        measureTag.setAttribute('y', (Q2_PTS[idx][1] + Q2_PTS[idx + 1][1]) / 2 - 16);
        measureTag.style.display = '';
        btnPlace.disabled = false;
        q2hint.textContent = '圓規已張開對齊第 ' + (idx + 1) + ' 段，按按鈕移到虛線截取。';
      });
    });

    btnPlace.addEventListener('click', function () {
      if (selected < 0) return;
      const pose = segs[selected];
      const len = pose.len;
      if (cursor + len > Q2_X1) {
        q2hint.textContent = '虛線空間不足，請按「↺ 重置」重新量取。';
        return;
      }
      const x1 = cursor, x2 = cursor + len;
      const color = Q2_COLORS[copied % Q2_COLORS.length];
      drawLayer.insertAdjacentHTML('beforeend',
        '<line class="copy-seg" data-copy="' + (copied + 1) + '" x1="' + x1.toFixed(1) + '" y1="' + Q2_Y +
        '" x2="' + x2.toFixed(1) + '" y2="' + Q2_Y + '" stroke="' + color + '"/>' +
        '<path class="copy-tick" d="M ' + (x2 - 8).toFixed(1) + ' ' + Q2_Y + ' A 8 8 0 0 1 ' +
        (x2 + 8).toFixed(1) + ' ' + Q2_Y + '" stroke="' + color + '"/>' +
        '<circle cx="' + x2.toFixed(1) + '" cy="' + Q2_Y + '" r="3.5" fill="' + color + '"/>');
      cursor = x2; copied += 1;
      progress.textContent = '已複製 ' + copied + ' / 4 段';
      setCompass({ qx: (x1 + x2) / 2, qy: Q2_Y - Q2_LEG, half: len / 2, rot: 0 }, 'placed');
      clearSelection();
      q2hint.textContent = copied === 4
        ? '已複製 4 段！想想看：折線拉直後和甲線有什麼關係？'
        : '已截取到第 ' + copied + ' 段，換一段再量量看。';
    });

    btnReset.addEventListener('click', reset);
    reset();
  }

  let marked = 0;
  scene.addEventListener('click', function (e) {
    if (qNum === 2) return; // q=2 由圓規專屬事件處理，不套用標記計數
    const t = e.target.closest('.hit');
    if (!t) return;
    const on = !t.classList.contains('on');
    t.classList.toggle('on', on);
    marked += on ? 1 : -1;
    const label = qNum === 1 ? '已點 ' + marked + ' 根' : '已標記 ' + marked + ' 處';
    document.getElementById('count').textContent = label;
    const badge = document.getElementById('stickCount');
    if (badge) badge.textContent = label;
  });
})();
</script>
</body>
</html>
