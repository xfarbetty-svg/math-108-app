<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3-N-3-8 解題（四則估算） 四則估算實驗台</title>
    <style>
        :root {
            --bg: #fff9f0;
            --card: #ffffff;
            --coral: #ff8a65;
            --mint: #7bc9b2;
            --lemon: #ffd166;
            --text-dark: #333;
            --muted: #b0a08a;
            --success: #7bc9b2;
            --error: #e57373;
            --sky: #4fc3f7;
            --indigo: #5c6bc0;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: auto; min-height: auto; margin: 0; padding: 0; }
        body {
            padding: 6px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 100%;
            height: auto;
            min-height: auto;
            background: transparent;
            border: none;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .header {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin: 0;
            letter-spacing: 1px;
        }
        .question-box {
            background: var(--card);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12.5px;
            line-height: 1.3;
            min-height: 34px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 14px rgba(149,117,76,0.08);
            border-left: 4px solid var(--coral);
        }
        .calc-card {
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(149,117,76,0.08);
            padding: 3px 6px 4px;
        }
        .calc-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
        }
        .expr { font-size: 14px; fill: var(--text-dark); font-weight: 600; }
        .expr-coral { font-size: 14px; fill: var(--coral); font-weight: bold; }
        .expr-mint { font-size: 13px; fill: var(--mint); font-weight: bold; }
        .expr-red { font-size: 12.5px; fill: var(--error); font-weight: bold; }
        .place-label { font-size: 9px; fill: var(--muted); }
        .cap { font-size: 11.5px; min-height: 16px; text-align: center; color: var(--coral); font-weight: bold; line-height: 1.25; }
        .controls { display: flex; flex-direction: column; gap: 4px; }
        .step-btn, .check-btn {
            border: none;
            color: white;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 3px 8px rgba(149,117,76,0.15);
            transition: all 0.2s ease;
        }
        .step-btn { background: var(--mint); }
        .step-btn:hover { background: #66bb9a; }
        .check-btn { background: var(--coral); }
        .check-btn:hover { background: #ff7043; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .option-btn {
            background: #fff;
            border: 1.5px solid #ebd9c8;
            color: var(--text-dark);
            padding: 6px 4px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            text-align: center;
            line-height: 1.2;
        }
        .option-btn:hover {
            border-color: var(--coral);
            background: #fff5ee;
        }
        .option-btn.selected {
            background: var(--coral);
            border-color: var(--coral);
            color: #fff;
            box-shadow: 0 3px 10px rgba(255,138,101,0.3);
        }
        .feedback {
            display: none;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.35;
            text-align: center;
            font-weight: 500;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #e8f7f1; color: #2e7d32; border: 1px solid var(--mint); }
        .feedback.wrong { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">✦ G3-N-3-8 四則估算實驗台 ✦</div>
    <div class="question-box" id="questionBox">載入題目中...</div>
    <div class="calc-card">
        <div class="calc-area">
            <svg id="drawSvg" viewBox="0 0 240 170">
                <g id="drawLayer"></g>
            </svg>
        </div>
        <div class="cap" id="capText">點擊「逐步算理」看估算動態</div>
    </div>
    <div class="controls">
        <button class="step-btn" id="stepBtn" onclick="nextStep()">🔍 逐步算理演繹 (0/3)</button>
        <div class="options-grid" id="optionsGrid"></div>
        <button class="check-btn" id="checkBtn" onclick="checkAnswer()">確認答案</button>
        <div class="feedback" id="feedbackBox"></div>
    </div>
</div>

<script>
    /* ===== 10 題真題資料庫（SSOT 與 10-Type Matrix 映射） ===== */
    const QUESTIONS = [
        {
            q: 1,
            stem: "估估看，「507 ＋ 291」的計算結果最接近哪一個數？",
            options: ["800", "700", "900", "1000"],
            answer_index: 0,
            visual_mode: "round_add",
            final_reveal: "最接近 800",
            total_steps: 3,
            explanations: [
                "取整百概數：507 最接近整百數 500",
                "取整百概數：291 最接近整百數 300",
                "500 ＋ 300 ＝ 800 ✓ 最接近 800"
            ],
            feedback: "答對了！507 看成 500，291 看成 300，500 ＋ 300 ＝ 800 → 最接近 800"
        },
        {
            q: 2,
            stem: "估估看，把最接近「495 × 6」答案的數找出來：",
            options: ["3000", "4000", "5000", "2000"],
            answer_index: 0,
            visual_mode: "radar_scale",
            final_reveal: "最接近 3000",
            total_steps: 3,
            explanations: [
                "495 非常接近整百數 500",
                "利用整百乘法估算：500 × 6 ＝ 3000",
                "實際 495 × 6 ＝ 2970 → 最接近 3000 ✓"
            ],
            feedback: "答對了！495 看成 500，500 × 6 ＝ 3000（實際 2970）→ 最接近 3000"
        },
        {
            q: 3,
            stem: "麵包店裡一個培根麵包賣 48 元，媽媽買了 7 個，大約要付多少元？",
            options: ["350 元", "280 元", "180 元", "100 元"],
            answer_index: 0,
            visual_mode: "bakery",
            final_reveal: "大約 350 元",
            total_steps: 3,
            explanations: [
                "生活採買單價估算：48 元很接近 50 元",
                "買 7 個麵包：50 × 7 ＝ 350 元",
                "實際 48 × 7 ＝ 336 元 → 大約要付 350 元 ✓"
            ],
            feedback: "答對了！48 元看成 50 元，50 × 7 ＝ 350 元（實際 336 元）→ 大約 350 元"
        },
        {
            q: 4,
            stem: "小明計算「495 × 6」時，寫出的答案是「4970」。請利用估算方法檢查，他的答案合不合理？",
            options: ["不合理，因為 495 看成 500，500 × 6 ＝ 3000，答案不可能到四千多", "合理，因為 495 比 400 大，所以四千多很正常", "合理，計算乘法本來就會變很大", "不一定，必須實際重算才能知道"],
            answer_index: 0,
            visual_mode: "detective",
            final_reveal: "不合理 (應接近 3000)",
            total_steps: 4,
            explanations: [
                "估算雷達：495 最多不會超過 500",
                "即便用 500 × 6 計算，結果也才 3000",
                "小明算成 4970 ✗ 遠超出合理範圍！",
                "合理性檢驗：一眼看出算錯了 ✓ 答案不合理"
            ],
            feedback: "答對了！495 ≈ 500，500 × 6 ＝ 3000，結果應在 3000 左右，4970 明顯太大了，不合理！"
        },
        {
            q: 5,
            stem: "棒球帽一頂 859 元，小丸子想要買 2 頂，如果她準備了 1500 元，夠不夠買 2 頂？",
            options: ["不夠，因為 859 比 850 大，850 × 2 ＝ 1700 元，1500 元不夠買", "夠，因為 1500 元是一筆大錢", "夠，859 看成 800，800 × 2 ＝ 1600 元很接近", "無法用估算判斷"],
            answer_index: 0,
            visual_mode: "cap_budget",
            final_reveal: "不夠買 (需約 1700 元)",
            total_steps: 3,
            explanations: [
                "預算防低估原則：859 元比 850 元多",
                "買 2 頂至少需要：850 × 2 ＝ 1700 元",
                "小丸子只有 1500 元 ＜ 1700 元 → 絕對不夠買！✓"
            ],
            feedback: "答對了！859 ＞ 850，850 × 2 ＝ 1700 ＞ 1500，準備 1500 元不夠買！"
        },
        {
            q: 6,
            stem: "估估看，「4903 ＋ 1991」的計算結果最接近哪一個數？",
            options: ["7000", "6000", "8000", "5000"],
            answer_index: 0,
            visual_mode: "thousands_add",
            final_reveal: "最接近 7000",
            total_steps: 3,
            explanations: [
                "四位數大數取千位：4903 最接近 5000",
                "四位數大數取千位：1991 最接近 2000",
                "5000 ＋ 2000 ＝ 7000 ✓ 最接近 7000"
            ],
            feedback: "答對了！4903 看成 5000，1991 看成 2000，5000 ＋ 2000 ＝ 7000 → 最接近 7000"
        },
        {
            q: 7,
            stem: "估估看，把最接近「7150 － 1100」答案的數圈起來：",
            options: ["6000", "5000", "4000", "7000"],
            answer_index: 0,
            visual_mode: "thousands_sub",
            final_reveal: "最接近 6000",
            total_steps: 3,
            explanations: [
                "四位數大數取千位：7150 最接近 7000",
                "四位數大數取千位：1100 最接近 1000",
                "7000 － 1000 ＝ 6000 ✓ 最接近 6000"
            ],
            feedback: "答對了！7150 看成 7000，1100 看成 1000，7000 － 1000 ＝ 6000 → 最接近 6000"
        },
        {
            q: 8,
            stem: "估估看，「907 － 289」的計算結果最接近哪一個數？",
            options: ["600", "500", "700", "400"],
            answer_index: 0,
            visual_mode: "hundreds_sub",
            final_reveal: "最接近 600",
            total_steps: 3,
            explanations: [
                "取整百概數：907 最接近整百數 900",
                "取整百概數：289 最接近整百數 300",
                "900 － 300 ＝ 600 ✓ 最接近 600"
            ],
            feedback: "答對了！907 看成 900，289 看成 300，900 － 300 ＝ 600 → 最接近 600"
        },
        {
            q: 9,
            stem: "估算「29 × 5」，請選出最接近正確答案的選項：",
            options: ["150", "100", "200", "250"],
            answer_index: 0,
            visual_mode: "snack_multiply",
            final_reveal: "最接近 150",
            total_steps: 3,
            explanations: [
                "二位數單價取整十：29 最接近整十數 30",
                "整十乘法估算：30 × 5 ＝ 150",
                "實際 29 × 5 ＝ 145 → 最接近 150 ✓"
            ],
            feedback: "答對了！29 看成 30，30 × 5 ＝ 150（實際 145）→ 最接近 150"
        },
        {
            q: 10,
            stem: "估估看，把最接近「1930 ＋ 3130」答案的數圈起來：",
            options: ["5000", "4000", "6000", "3000"],
            answer_index: 0,
            visual_mode: "thousands_sum",
            final_reveal: "最接近 5000",
            total_steps: 3,
            explanations: [
                "取整千概數：1930 最接近 2000",
                "取整千概數：3130 最接近 3000",
                "2000 ＋ 3000 ＝ 5000 ✓ 最接近 5000"
            ],
            feedback: "答對了！1930 看成 2000，3130 看成 3000，2000 ＋ 3000 ＝ 5000 → 最接近 5000"
        }
    ];

    let currentQ = 1;
    let currentStep = 0;
    let selectedOption = -1;

    function init() {
        const params = new URLSearchParams(window.location.search);
        const qVal = parseInt(params.get('q')) || 1;
        currentQ = (qVal >= 1 && qVal <= 10) ? qVal : 1;
        const qData = QUESTIONS[currentQ - 1];

        document.getElementById('questionBox').textContent = qData.stem;
        currentStep = 0;
        selectedOption = -1;
        updateStepUI();
        renderOptions();
        renderVisual();
    }

    function renderOptions() {
        const qData = QUESTIONS[currentQ - 1];
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => selectOption(idx);
            grid.appendChild(btn);
        });
        document.getElementById('feedbackBox').className = 'feedback';
    }

    function selectOption(idx) {
        selectedOption = idx;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn, i) => {
            if (i === idx) btn.classList.add('selected');
            else btn.classList.remove('selected');
        });
    }

    function checkAnswer() {
        if (selectedOption < 0) {
            alert('請先選擇一個答案！');
            return;
        }
        const qData = QUESTIONS[currentQ - 1];
        const fb = document.getElementById('feedbackBox');
        if (selectedOption === qData.answer_index) {
            fb.className = 'feedback show correct';
            fb.textContent = qData.feedback;
            currentStep = qData.total_steps;
            updateStepUI();
            renderVisual();
        } else {
            fb.className = 'feedback show wrong';
            fb.textContent = '差一點點！試試點擊「逐步算理演繹」查看取概數策略再選一次。';
        }
    }

    function nextStep() {
        const qData = QUESTIONS[currentQ - 1];
        if (currentStep < qData.total_steps) {
            currentStep++;
        } else {
            currentStep = 0;
        }
        updateStepUI();
        renderVisual();
    }

    function updateStepUI() {
        const qData = QUESTIONS[currentQ - 1];
        const btn = document.getElementById('stepBtn');
        const cap = document.getElementById('capText');
        btn.textContent = `🔍 逐步算理演繹 (${currentStep}/${qData.total_steps})`;
        if (currentStep === 0) {
            cap.textContent = "點擊「逐步算理」看估算動態";
        } else {
            cap.textContent = qData.explanations[currentStep - 1];
        }
    }

    function resetView() {
        return `<rect x="0" y="0" width="240" height="170" fill="none"/>`;
    }

    function renderVisual() {
        const qData = QUESTIONS[currentQ - 1];
        switch (qData.visual_mode) {
            case 'round_add': renderRoundAdd(); break;
            case 'radar_scale': renderRadarScale(); break;
            case 'bakery': renderBakery(); break;
            case 'detective': renderDetective(); break;
            case 'cap_budget': renderCapBudget(); break;
            case 'thousands_add': renderThousandsAdd(); break;
            case 'thousands_sub': renderThousandsSub(); break;
            case 'hundreds_sub': renderHundredsSub(); break;
            case 'snack_multiply': renderSnackMultiply(); break;
            case 'thousands_sum': renderThousandsSum(); break;
        }
    }

    /* ===== 模式 1：507+291 整百概數滑桿 ===== */
    function renderRoundAdd() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        // 507 槽
        svg += `<rect x="18" y="16" width="90" height="42" rx="10" fill="#fff3ec" stroke="#ff8a65" stroke-width="1.5"/>`;
        svg += `<text x="63" y="34" text-anchor="middle" class="expr" style="font-size:13px">507</text>`;
        if (currentStep >= 1) {
            svg += `<text x="63" y="50" text-anchor="middle" class="expr-coral" style="font-size:12px">≈ 500</text>`;
        }
        svg += `<text x="120" y="42" text-anchor="middle" class="expr-coral" style="font-size:18px">＋</text>`;
        // 291 槽
        svg += `<rect x="132" y="16" width="90" height="42" rx="10" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
        svg += `<text x="177" y="34" text-anchor="middle" class="expr" style="font-size:13px">291</text>`;
        if (currentStep >= 2) {
            svg += `<text x="177" y="50" text-anchor="middle" class="expr-mint" style="font-size:12px">≈ 300</text>`;
        }
        // 結合總和卡
        if (currentStep >= 3) {
            svg += `<line x1="20" y1="74" x2="220" y2="74" stroke="#d7ccc8" stroke-width="2"/>`;
            svg += `<rect x="40" y="88" width="160" height="36" rx="12" fill="#fff" stroke="#ff8a65" stroke-width="2"/>`;
            svg += `<text x="120" y="111" text-anchor="middle" class="expr-coral" style="font-size:15px">500 ＋ 300 ＝ 800 ✓</text>`;
            svg += `<text x="120" y="146" text-anchor="middle" class="expr-mint" style="font-size:12px">最接近 800</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 2：495×6 數線雷達鎖定 3000 ===== */
    function renderRadarScale() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        // 數線軸 2000 ~ 4000
        svg += `<line x1="20" y1="65" x2="220" y2="65" stroke="#a1887f" stroke-width="3" stroke-linecap="round"/>`;
        const ticks = [
            { x: 30, val: "2000" },
            { x: 120, val: "3000" },
            { x: 210, val: "4000" }
        ];
        ticks.forEach(t => {
            svg += `<line x1="${t.x}" y1="58" x2="${t.x}" y2="72" stroke="#a1887f" stroke-width="2"/>`;
            svg += `<text x="${t.x}" y="86" text-anchor="middle" class="place-label" style="font-size:10px">${t.val}</text>`;
        });
        // 495 ≈ 500 卡片
        svg += `<rect x="50" y="10" width="140" height="26" rx="8" fill="#fff" stroke="#ffd166" stroke-width="1.5"/>`;
        svg += `<text x="120" y="27" text-anchor="middle" class="expr" style="font-size:12px">495 × 6  (495 ≈ 500)</text>`;
        // 指針定位
        if (currentStep >= 2) {
            svg += `<circle cx="120" cy="65" r="7" fill="#ff8a65"/>`;
            svg += `<polygon points="120,54 114,42 126,42" fill="#ff8a65"/>`;
            svg += `<text x="120" y="38" text-anchor="middle" class="expr-coral" style="font-size:11px">500 × 6 ＝ 3000</text>`;
        }
        if (currentStep >= 3) {
            svg += `<rect x="36" y="112" width="168" height="34" rx="10" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="133" text-anchor="middle" class="expr-mint" style="font-size:13px">實際 2970 → 最接近 3000 ✓</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 3：培根麵包 48×7 ≈ 50×7 ＝ 350 ===== */
    function renderBakery() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        // 麵包貨架展示
        svg += `<rect x="16" y="14" width="208" height="58" rx="10" fill="#fff" stroke="#f0e6d8" stroke-width="1.5"/>`;
        svg += `<text x="120" y="32" text-anchor="middle" class="expr" style="font-size:12px">培根麵包 7 個 (單價 48 元)</text>`;
        for (let i = 0; i < 7; i++) {
            const bx = 28 + i * 27;
            svg += `<circle cx="${bx}" cy="52" r="10" fill="#ffd166" stroke="#ffb74d" stroke-width="1.2"/>`;
            svg += `<text x="${bx}" y="56" text-anchor="middle" style="font-size:11px">🥓</text>`;
        }
        if (currentStep >= 1) {
            svg += `<rect x="50" y="80" width="140" height="24" rx="8" fill="#fff3ec" stroke="#ff8a65" stroke-width="1.2"/>`;
            svg += `<text x="120" y="96" text-anchor="middle" class="expr-coral" style="font-size:12px">48 元 ≈ 50 元</text>`;
        }
        if (currentStep >= 2) {
            svg += `<rect x="30" y="112" width="180" height="38" rx="10" fill="#e8f7f1" stroke="#7bc9b2" stroke-width="1.5"/>`;
            svg += `<text x="120" y="130" text-anchor="middle" class="expr-mint" style="font-size:13px">50 × 7 ＝ 350 元</text>`;
            svg += `<text x="120" y="144" text-anchor="middle" class="place-label" style="font-size:9px">實際 48 × 7 ＝ 336 元 → 大約 350 元 ✓</text>`;
        }
        layer.innerHTML = svg;
    }

    /* ===== 模式 4：小明算 4970 除錯放大鏡 ===== */
    function renderDetective() {
        let svg = resetView();
        const layer = document.getElementById('drawLayer');
        // 放大鏡圖示
