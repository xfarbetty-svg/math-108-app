<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-1-5 長度：等長繩子量腰圍間接比較</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #eff6ff;
            color: #0f172a;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #bfdbfe;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.2rem; font-weight: 700; margin-bottom: 14px; color: #1e293b; line-height: 1.4; }
        .playground {
            border: 2px solid #93c5fd;
            border-radius: 14px;
            background: #f0fdf4;
            padding: 6px;
            margin-bottom: 12px;
        }
        .playground svg { display: block; width: 100%; height: auto; }
        .leftover { opacity: 0; transition: opacity 0.6s ease; }
        svg.expanded .leftover { opacity: 1; }
        .pair-note { text-align: center; font-size: 1.05rem; font-weight: 800; color: #1d4ed8; min-height: 1.6em; margin-bottom: 10px; }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
        .expand-btn {
            min-height: 44px;
            background: #ca8a04;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 26px;
            cursor: pointer;
        }
        .expand-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .reset-btn {
            min-height: 44px;
            background: #ffffff;
            color: #334155;
            font-size: 1rem;
            font-weight: 700;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .opt-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
        .opt-btn {
            min-height: 44px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            padding: 8px 14px;
        }
        .opt-btn.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .footer-action { display: flex; justify-content: center; margin-top: 8px; }
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-banner {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.02rem;
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
        @media (max-width: 640px) {
            body { padding: 4px 6px; }
            .container { padding: 8px 10px; max-width: 480px; }
            .stem { font-size: 14px; margin-bottom: 8px; line-height: 1.35; }
            .playground { margin-bottom: 6px; padding: 4px; border-radius: 12px; }
            .pair-note { font-size: 13px; min-height: 1.2em; margin-bottom: 6px; }
            .action-row { margin-bottom: 6px; gap: 6px; }
            .expand-btn, .reset-btn { min-height: 36px; padding: 6px 14px; font-size: 13px; border-radius: 10px; }
            .opt-group { gap: 6px; margin-bottom: 6px; }
            .opt-btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }
            .footer-action { margin-top: 4px; }
            .check-btn { min-height: 38px; padding: 6px 28px; font-size: 14px; }
            .result-banner { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">獅湖 114-2 期中 · 間接比較</span>
    </div>

    <div class="stem">用一樣長的兩條繩子，分別繞大熊和小兔的腰圍一圈。<br>大熊剩下的繩子比較短（剩 5 cm），小兔剩下的繩子比較長（剩 18 cm）。誰的腰圍比較長？</div>

    <div class="playground">
        <svg id="beltSvg" viewBox="0 0 450 235" role="img" aria-label="等長繩子量腰圍教具"></svg>
    </div>

    <div class="pair-note" id="pairNote">兩條繩子一樣長！繞完腰圍後，把「剩下的繩子」展開來比一比。</div>

    <div class="action-row">
        <button class="expand-btn" id="expandBtn" onclick="expandRopes()">📏 展開剩下的繩子</button>
        <button class="reset-btn" onclick="resetAll()">重來</button>
    </div>

    <div class="opt-group" id="opts"></div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    // 大熊：胖身體（腰圍繩繞一大圈，用掉多）→ 剩 5 cm；小兔：瘦身體 → 剩 18 cm
    let userAnswer = null;
    const ANSWER_INDEX = 0;

    function bearArt() {
        return `
        <g>
            <circle cx="34" cy="16" r="7" fill="#a16207" stroke="#0f172a" stroke-width="1.4"/>
            <circle cx="86" cy="16" r="7" fill="#a16207" stroke="#0f172a" stroke-width="1.4"/>
            <circle cx="60" cy="34" r="26" fill="#ca8a04" stroke="#0f172a" stroke-width="1.6"/>
            <circle cx="52" cy="30" r="2.6" fill="#0f172a"/>
            <circle cx="68" cy="30" r="2.6" fill="#0f172a"/>
            <ellipse cx="60" cy="38" rx="5" ry="3.6" fill="#7c2d12"/>
            <ellipse cx="60" cy="88" rx="44" ry="30" fill="#ca8a04" stroke="#0f172a" stroke-width="1.6"/>
            <ellipse id="bearRope" cx="60" cy="88" rx="52" ry="37" fill="none" stroke="#a16207" stroke-width="4.5" stroke-dasharray="10 6"/>
        </g>`;
    }

    function rabbitArt() {
        return `
        <g>
            <ellipse cx="40" cy="18" rx="6" ry="16" fill="#e5e7eb" stroke="#0f172a" stroke-width="1.4"/>
            <ellipse cx="66" cy="18" rx="6" ry="16" fill="#e5e7eb" stroke="#0f172a" stroke-width="1.4"/>
            <circle cx="53" cy="36" r="21" fill="#f4f4f5" stroke="#0f172a" stroke-width="1.6"/>
            <circle cx="46" cy="33" r="2.4" fill="#0f172a"/>
            <circle cx="60" cy="33" r="2.4" fill="#0f172a"/>
            <path d="M 50 40 Q 53 43 56 40" fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M 60 38 L 63 39 L 60 40 Z" fill="#fb7185"/>
            <ellipse cx="53" cy="84" rx="27" ry="28" fill="#f4f4f5" stroke="#0f172a" stroke-width="1.6"/>
            <ellipse id="rabbitRope" cx="53" cy="84" rx="33" ry="34" fill="none" stroke="#a16207" stroke-width="4.5" stroke-dasharray="10 6"/>
        </g>`;
    }

    function expandRopes() {
        const svg = document.getElementById('beltSvg');
        svg.classList.add('expanded');
        document.getElementById('expandBtn').disabled = true;
        document.getElementById('pairNote').innerHTML =
            '兩條繩子本來一樣長 → <span style="color:#b45309">剩得越少，代表繞腰圍用掉越多，腰圍越長！</span><br>' +
            '大熊剩 <b>5 cm</b>（用掉多）＜ 小兔剩 <b>18 cm</b>（用掉少）';
    }

    function resetAll() {
        const svg = document.getElementById('beltSvg');
        svg.classList.remove('expanded');
        document.getElementById('expandBtn').disabled = false;
        document.getElementById('pairNote').innerHTML = '兩條繩子一樣長！繞完腰圍後，把「剩下的繩子」展開來比一比。';
    }

    function build() {
        const svg = document.getElementById('beltSvg');
        svg.innerHTML = `
            <g pointer-events="none">
                <rect x="0" y="0" width="450" height="235" fill="#f0fdf4"/>
                <rect x="6" y="6" width="62" height="18" rx="6" fill="#fef3c7"/>
                <text x="37" y="19" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">大熊</text>
                <rect x="238" y="6" width="62" height="18" rx="6" fill="#f1f5f9"/>
                <text x="269" y="19" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">小兔</text>
                <line x1="225" y1="10" x2="225" y2="130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
            </g>
            <g id="bearWrap" transform="translate(60 0)">${bearArt()}</g>
            <g id="rabbitWrap" transform="translate(265 0)">${rabbitArt()}</g>
            <g class="leftover" pointer-events="none">
                <path d="M 30 172 q 8 -7 16 0 t 16 0" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
                <text x="86" y="177" font-size="13" font-weight="800" fill="#dc2626">剩下的繩子：5 cm（很短）</text>
                <path d="M 262 172 q 8 -7 16 0 t 16 0 t 16 0 t 16 0 t 16 0 t 16 0" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
                <text x="380" y="177" font-size="13" font-weight="800" fill="#16a34a">18 cm</text>
                <text x="225" y="205" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e293b">剩 5 cm ＜ 剩 18 cm → 大熊用掉比較多</text>
                <text x="225" y="224" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b45309">→ 大熊的腰圍比較長！</text>
            </g>`;

        const group = document.getElementById('opts');
        ['大熊的腰圍比較長', '小兔的腰圍比較長', '一樣長（用掉一樣多）'].forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = function () {
                group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                userAnswer = idx;
            };
            group.appendChild(btn);
        });
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (userAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '先選一個答案再檢查喔！';
            return;
        }
        if (userAnswer === ANSWER_INDEX) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對！繩子總長一樣：剩得越少＝用掉越多＝腰圍越長，所以大熊的腰圍比較長！';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '再想想：剩下的繩子越「短」，表示繞腰圍「用掉」越「多」喔！按「展開剩下的繩子」看看。';
        }
    }

    build();
</script>

</body>
</html>
