<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-2-Q04 天平數感比大小</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint: #7bc9b2;
  --mint-deep: #318a70;
  --lemon: #ffd166;
  --coral: #ff8a65;
  --sky: #4ea8de;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 14px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

/* 天平視覺區 */
.balance-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 4px;
  position: relative;
}
.balance-svg {
  width: 100%;
  max-width: 320px;
  height: 120px;
}
.hint-badge {
  font-size: 11px;
  font-weight: 800;
  color: var(--mint-deep);
  background: #eafaf4;
  padding: 2px 10px;
  border-radius: 999px;
  margin-top: 4px;
}

.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 10px 6px;
  font-size: 18px;
  font-weight: 900;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>113-1 獅湖 期中 三、(2)</small>不計算，在 □ 中填入 ＞、＜ 或 ＝：<br><b>44 ＋ 34　□　44 ＋ 22</b></p>
  </div>
  <div class="card balance-stage">
    <svg class="balance-svg" viewBox="0 0 320 120">
      <!-- 底座支架 -->
      <polygon points="160,50 145,110 175,110" fill="#a89f91" />
      <circle cx="160" cy="50" r="5" fill="#5c5549" />
      <!-- 橫桿 (左邊稍重傾斜 -6 度) -->
      <g transform="rotate(-6, 160, 50)" id="beam-group">
        <line x1="30" y1="50" x2="290" y2="50" stroke="#5c5549" stroke-width="4" stroke-linecap="round" />
        <!-- 左秤盤 -->
        <line x1="60" y1="50" x2="60" y2="78" stroke="#8a857b" stroke-width="1.5" />
        <path d="M 30,78 Q 60,95 90,78 Z" fill="#7bc9b2" stroke="#318a70" stroke-width="1.5" />
        <text x="60" y="72" text-anchor="middle" font-size="12" font-weight="900" fill="#1d3557">44 ＋ 34</text>
        <!-- 右秤盤 -->
        <line x1="260" y1="50" x2="260" y2="78" stroke="#8a857b" stroke-width="1.5" />
        <path d="M 230,78 Q 260,95 290,78 Z" fill="#ffd166" stroke="#b45309" stroke-width="1.5" />
        <text x="260" y="72" text-anchor="middle" font-size="12" font-weight="900" fill="#78350f">44 ＋ 22</text>
      </g>
    </svg>
    <div class="hint-badge">數感技巧：兩邊都有 44，直接比 34 和 22！</div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['＞', '＜', '＝'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');

  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！兩邊都有相同的 44，因為 34 ＞ 22，所以 44＋34 ＞ 44＋22。完全不用硬算！';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：兩邊都加 44，加比較大數字的一邊，結果一定比較大喔！';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-2-Q04', answer: ANSWER };
})();
</script>
</body>
</html>
