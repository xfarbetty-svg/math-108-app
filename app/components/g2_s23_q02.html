<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G2-S-2-3 直尺操作微教具 Q02</title>
    <style>
        :root {
            --ink: #3d3a34;
            --mint: #7bc9b2;
            --dark-mint: #318a70;
            --yellow: #ffd166;
            --paper: #fff9f0;
            --white: #ffffff;
            --gray: #a0a0a0;
            --accent: #ff85a1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 420px;
            background: url('../assets/demo/bg_desk.webp') center/cover, var(--paper);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-radius: 12px;
        }

        /* 柔和遮罩層 */
        .wrap::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 249, 240, 0.85);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .question {
            font-size: 1.1rem;
            color: var(--ink);
            font-weight: bold;
            margin-bottom: 10px;
            background: var(--white);
            padding: 8px 12px;
            border-radius: 20px;
            border-left: 5px solid var(--mint);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stage {
            flex: 1;
            min-height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .opt-btn {
            background: var(--white);
            border: 2px solid var(--mint);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--ink);
            transition: all 0.2s;
            text-align: center;
        }

        .opt-btn:active { transform: scale(0.95); }
        .opt-btn.selected {
            background: var(--mint);
            color: white;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .check-btn {
            flex: 1;
            background: var(--dark-mint);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #256a56;
        }

        .check-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #256a56;
        }

        .feedback {
            height: 40px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .feedback.show { opacity: 1; }
        .feedback.correct { background: #e8f5e9; color: #2e7d32; }
        .feedback.wrong { background: #ffebee; color: #c62828; }

        /* 動畫效果 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .highlight-ribbon { cursor: pointer; }
        .highlight-ribbon:hover { opacity: 0.9; }
        
        .hint-text {
            font-size: 12px;
            fill: var(--accent);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .hint-text.active { opacity: 1; }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="wrap">
    <div class="content">
        <div class="question">緞帶左端對準刻度 3，右端對準刻度 10，這條緞帶長幾公分？</div>
        
        <div class="stage">
            <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
                <!-- 直尺本體 -->
                <rect x="10" y="70" width="340" height="50" rx="4" fill="#fff" stroke="#d0d0d0" stroke-width="1" />
                
                <!-- 刻度生成 (0-15cm) -->
                <!-- 1cm = 20px, 起點 0cm 在 x=30 -->
                <g id="ticks">
                    <!-- JS 動態生成或手動寫入 -->
                    <!-- 毫米刻度 -->
                    <path d="M 30 70 L 30 85 M 50 70 L 50 85 M 70 70 L 70 85 M 90 70 L 90 85 M 110 70 L 110 85 M 130 70 L 130 85 M 150 70 L 150 85 M 170 70 L 170 85 M 190 70 L 190 85 M 210 70 L 210 85 M 230 70 L 230 85 M 250 70 L 250 85 M 270 70 L 270 85 M 290 70 L 290 85 M 310 70 L 310 85 M 330 70 L 330 85" stroke="#888" stroke-width="1" />
                    <!-- 數字 -->
                    <text x="30" y="105" font-size="10" text-anchor="middle" fill="#555">0</text>
                    <text x="50" y="105" font-size="10" text-anchor="middle" fill="#555">1</text>
                    <text x="70" y="105" font-size="10" text-anchor="middle" fill="#555">2</text>
                    <text x="90" y="105" font-size="10" text-anchor="middle" fill="#555">3</text>
                    <text x="110" y="105" font-size="10" text-anchor="middle" fill="#555">4</text>
                    <text x="130" y="105" font-size="10" text-anchor="middle" fill="#555">5</text>
                    <text x="150" y="105" font-size="10" text-anchor="middle" fill="#555">6</text>
                    <text x="170" y="105" font-size="10" text-anchor="middle" fill="#555">7</text>
                    <text x="190" y="105" font-size="10" text-anchor="middle" fill="#555">8</text>
                    <text x="210" y="105" font-size="10" text-anchor="middle" fill="#555">9</text>
                    <text x="230" y="105" font-size="10" text-anchor="middle" fill="#555">10</text>
                    <text x="250" y="105" font-size="10" text-anchor="middle" fill="#555">11</text>
                    <text x="270" y="105" font-size="10" text-anchor="middle" fill="#555">12</text>
                    <text x="290" y="105" font-size="10" text-anchor="middle" fill="#555">13</text>
                    <text x="310" y="105" font-size="10" text-anchor="middle" fill="#555">14</text>
                    <text x="330" y="105" font-size="10" text-anchor="middle" fill="#555">15</text>
                </g>

                <!-- 緞帶 (3cm to 10cm) -->
                <g class="highlight-ribbon" onclick="toggleHint()">
                    <rect x="90" y="40" width="140" height="18" rx="4" fill="var(--yellow)" stroke="#e67e22" stroke-width="2" />
                    <!-- 緞帶紋理 -->
                    <path d="M 95 40 L 95 58 M 110 40 L 110 58 M 125 40 L 125 58 M 140 40 L 140 58 M 155 40 L 155 58 M 170 40 L 170 58 M 185 40 L 185 58 M 200 40 L 200 58 M 215 40 L 215 58" stroke="rgba(255,255,255,0.5)" stroke-width="1" />
                </g>

                <!-- 標記指示 -->
                <line x1="90" y1="35" x2="90" y2="70" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3,2" />
                <line x1="230" y1="35" x2="230" y2="70" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3,2" />
                
                <!-- 減法提示 (預設隱藏) -->
                <g id="hint-group" class="hint-text">
                    <path d="M 90 30 Q 160 15 230 30" fill="none" stroke="var(--accent)" stroke-width="2" />
                    <text x="160" y="15" text-anchor="middle">10 - 3 = ?</text>
                    <circle cx="90" cy="70" r="4" fill="var(--accent)" />
                    <circle cx="230" cy="70" r="4" fill="var(--accent)" />
                </g>
            </svg>
        </div>

        <div class="options" id="options">
            <div class="opt-btn" onclick="selectOption(0)">7公分</div>
            <div class="opt-btn" onclick="selectOption(1)">10公分</div>
            <div class="opt-btn" onclick="selectOption(2)">13公分</div>
            <div class="opt-btn" onclick="selectOption(3)">3公分</div>
        </div>

        <div class="controls">
            <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>
</div>

<script>
    let selectedIdx = -1;
    const correctIdx = 0;
    const feedbackEl = document.getElementById('feedback');
    const hintGroup = document.getElementById('hint-group');

    function selectOption(idx) {
        selectedIdx = idx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((btn, i) => {
            btn.classList.toggle('selected', i === idx);
        });
        feedbackEl.classList.remove('show');
    }

    function toggleHint() {
        hintGroup.classList.toggle('active');
    }

    function checkAnswer() {
        if (selectedIdx === -1) {
            showFeedback('請先選擇一個答案喔！', 'wrong');
            return;
        }

        if (selectedIdx === correctIdx) {
            showFeedback('太棒了！算式是 10 - 3 = 7 公分', 'correct');
            hintGroup.classList.add('active');
            createConfetti();
        } else {
            showFeedback('再試試看！觀察緞帶的起點和終點。', 'wrong');
        }
    }

    function showFeedback(text, type) {
        feedbackEl.innerText = text;
        feedbackEl.className = 'feedback show ' + type;
    }

    function createConfetti() {
        // 簡單的成功視覺反饋
        const stage = document.querySelector('.stage');
        for(let i=0; i<15; i++) {
            const dot = document.createElement('div');
            dot.style.position = 'absolute';
            dot.style.width = '8px';
            dot.style.height = '8px';
            dot.style.backgroundColor = ['#ffd166','#7bc9b2','#ff85a1'][Math.floor(Math.random()*3)];
            dot.style.borderRadius = '50%';
            dot.style.left = '50%';
            dot.style.top = '50%';
            dot.style.zIndex = '10';
            stage.appendChild(dot);

            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 50;
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist;

            dot.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], {
                duration: 800,
                easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
            }).onfinish = () => dot.remove();
        }
    }

    // 初始化：毫米刻度細節
    (function initRuler() {
        const ticksG = document.getElementById('ticks');
        let pathData = "";
        for (let i = 0; i <= 150; i++) {
            if (i % 10 === 0) continue; // 跳過公分大刻度
            const x = 30 + i * 2;
            const h = (i % 5 === 0) ? 8 : 5;
            pathData += `M ${x} 70 L ${x} ${70+h} `;
        }
        const mmTicks = document.createElementNS("http://www.w3.org/2000/svg", "path");
        mmTicks.setAttribute("d", pathData);
        mmTicks.setAttribute("stroke", "#bbb");
        mmTicks.setAttribute("stroke-width", "0.5");
        ticksG.insertBefore(mmTicks, ticksG.firstChild);
    })();
window.check = typeof checkAnswer !== "undefined" ? checkAnswer : () => {};
</script>

<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
