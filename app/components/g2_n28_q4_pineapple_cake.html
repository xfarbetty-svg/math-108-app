<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-8-Q04 鳳梨酥裝盒剩餘</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.bakery { text-align: center; }
.bakery-title { font-size: 11px; font-weight: 900; color: #0e7490; letter-spacing: 2px; margin-bottom: 2px; }
.bakery-stage { display: flex; justify-content: center; }
.bakery-line { font-size: 13.5px; font-weight: 900; color: #0e7490; margin-top: 2px; min-height: 17px; }
.flip-btn {
  margin-top: 3px;
  border: 2px solid #0e7490;
  background: #fff;
  color: #0e7490;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.flip-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #cffafe; color: #0e7490; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card bakery">
    <p class="stem"><small>114-1 永安 期末 五、(4)</small>麵包店裡共有 87 個鳳梨酥，9 個裝成一盒，共裝了 9 盒，還剩下幾個鳳梨酥？</p>
    <div class="bakery-title">✦ 烘焙坊出爐盤 ✦</div>
    <div class="bakery-stage" id="bakery-stage"></div>
    <div class="bakery-line" id="bakery-line"></div>
    <div>
      <button type="button" class="flip-btn" id="flip">數數裝盒結果</button>
      <span class="mode-label" id="mode-label">目前：剛出爐</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['6 個', '81 個', '16 個', '9 個'];
  var ANSWER = 0;
  var picked = -1;
  var revealed = false;

  var stage = document.getElementById('bakery-stage');
  var line = document.getElementById('bakery-line');
  var flipBtn = document.getElementById('flip');
  var modeLabel = document.getElementById('mode-label');

  /* 9 盒（每盒 9 個 3×3）＋ 烤盤剩餘 6 個 */
  function bakerySVG(isRevealed) {
    var s = '<svg width="316" height="148" viewBox="0 0 316 148">';
    for (var b = 0; b < 9; b++) {
      var bx = 8 + b * 34;
      s += '<rect x="' + bx + '" y="14" width="30" height="34" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>';
      for (var d = 0; d < 9; d++) {
        var dx = bx + 5 + (d % 3) * 9;
        var dy = 20 + Math.floor(d / 3) * 9;
        s += '<circle cx="' + dx + '" cy="' + dy + '" r="3.4" fill="#fbbf24" stroke="#92400e" stroke-width="0.8"/>';
      }
      s += '<text x="' + (bx + 15) + '" y="60" font-size="9" font-weight="900" text-anchor="middle" fill="#92400e">' + (isRevealed ? '9' : '?') + '</text>';
    }
    s += '<text x="158" y="72" font-size="10" font-weight="900" text-anchor="middle" fill="#b45309">' + (isRevealed ? '9 盒 × 每盒 9 個 ＝ 9×9 ＝ 81 個已裝盒' : '9 盒，每盒 9 個，裝好幾個？') + '</text>';
    /* 烤盤：剩餘 6 個 */
    s += '<rect x="96" y="80" width="124" height="30" rx="6" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5"/>';
    for (var r = 0; r < 6; r++) {
      s += '<circle cx="' + (112 + r * 17) + '" cy="95" r="5.5" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>';
    }
    if (isRevealed) {
      s += '<rect x="228" y="80" width="80" height="30" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>';
      s += '<text x="268" y="99" font-size="11" font-weight="900" text-anchor="middle" fill="#065f46">剩 87−81</text>';
      s += '<rect x="8" y="118" width="300" height="16" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>';
      s += '<text x="158" y="130" font-size="11" font-weight="900" text-anchor="middle" fill="#065f46">87−81＝6，還剩下 6 個鳳梨酥</text>';
    } else {
      s += '<text x="268" y="99" font-size="11" font-weight="900" text-anchor="middle" fill="#78716c">剩 ？個</text>';
      s += '<text x="158" y="128" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">先算裝了幾個，再用總數扣掉</text>';
      s += '<text x="158" y="142" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">兩步驟一起想</text>';
    }
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = bakerySVG(revealed);
    if (revealed) {
      line.textContent = '先乘：9×9＝81（個裝盒）→ 再減：87−81＝6';
      modeLabel.textContent = '目前：已數完';
      flipBtn.textContent = '重新出爐';
    } else {
      line.textContent = '87 個鳳梨酥，9 個裝一盒，裝了 9 盒';
      modeLabel.textContent = '目前：剛出爐';
      flipBtn.textContent = '數數裝盒結果';
    }
  }

  flipBtn.addEventListener('click', function () { revealed = !revealed; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, answer: '', msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！先算 9×9＝81 個裝盒，再算 87−81＝6 個剩下。';
      return { ok: true, answer: CHOICES[picked] };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：題目問「剩下幾個」——先算裝盒總數 9×9＝81，再用 87 扣掉 81，不是只回答裝盒數。';
    return { ok: false, answer: CHOICES[picked] };
  };

  window.__q = { id: 'G2-N-2-8-Q04', correct_index: ANSWER, choices: CHOICES };

  render();
})();
</script>
</body>
</html>
