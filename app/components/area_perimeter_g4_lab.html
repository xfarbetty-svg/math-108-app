<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>G4-N-4-11 面積：「平方公尺」與周長面積公式・108 課綱互動教具</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
:root{
  --bg:var(--bg-main); --card:var(--bg-card); --ink:var(--text-primary);
  --ink-soft:var(--text-secondary); --line:var(--border-color);
  --a:var(--accent-primary); --mint:var(--accent-mint); --sky:var(--accent-sky);
  --lemon:var(--accent-lemon); --elev:var(--bg-elevated);
  --ok:#1f8f58; --warn:#c2410c; --perim:#dc2626; --area-fill:#bfdbfe; --area-stroke:#2563eb;
  --cut-fill:#fef08a; --cut-stroke:#ca8a04; --hole-fill:#f1f5f9;
  --shadow:0 4px 14px var(--shadow-color); --radius:14px;
}
html[data-theme="dark"]{
  --ok:#4ade80; --warn:#fb923c; --perim:#f87171; --area-fill:#1e3a8a; --area-stroke:#60a5fa;
  --cut-fill:#713f12; --cut-stroke:#facc15; --hole-fill:#1e293b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;max-width:100vw;overflow-x:hidden;height:auto;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:4px 8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{width:100%;max-width:540px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:4px;overflow:visible}

.head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--ink-soft);min-height:22px}
.head-left{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.head b{font-size:12px;color:var(--ink);white-space:nowrap}
.head-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#btn-theme{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}

.activity-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--elev);padding:3px;border-radius:999px;flex-wrap:nowrap;max-width:100%}
.activity-nav::-webkit-scrollbar{display:none}
.act-btn{flex:0 0 auto;padding:4px 9px;font-size:11px;font-weight:800;border-radius:999px;color:var(--ink-soft);white-space:nowrap;transition:all .15s}
.act-btn.active{background:var(--card);color:var(--a);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.act-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);max-width:100%;overflow:visible}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.card-badge{background:var(--elev);color:var(--a);font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.card-title{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-desc{font-size:10px;line-height:1.28;color:var(--ink-soft)}

.stage-canvas{width:100%;background:var(--elev);border-radius:10px;border:1px solid var(--line);padding:2px;display:flex;justify-content:center;align-items:center;gap:8px;overflow:hidden;touch-action:none}
.stage-canvas svg{width:100%;max-width:320px;height:114px;display:block;touch-action:none;user-select:none}

.interact-panel{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:4px 6px;display:flex;flex-direction:column;gap:4px;text-align:center;max-width:100%}
.btn-grid{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn-action{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:10px;font-weight:800;padding:3px 7px;border-radius:8px;transition:all .12s;white-space:nowrap}
.btn-action.primary{background:var(--a);border-color:var(--a);color:#fff}
.btn-action.active,.btn-action:active{background:var(--a);border-color:var(--a);color:#fff}

.info-bubble{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:10px;line-height:1.28;color:var(--ink);font-weight:700;text-align:left;min-height:18px}
.info-bubble.ok{border-color:var(--ok);color:var(--ok)}
.info-bubble.warn{border-color:var(--warn);color:var(--warn)}

.vgrid-wrap{display:flex;justify-content:center;align-items:center;gap:6px;flex-shrink:0}
.vgrid{display:inline-grid;grid-template-columns:repeat(5,14px);gap:1px;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;font-weight:800;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 5px}
.vgrid .c{text-align:center;line-height:14px}
.vgrid .bar{grid-column:1/-1;height:1.5px;background:var(--ink);margin:1px 0}
.vgrid .hl{color:var(--a)}

.steps-box{background:var(--card);border:1.5px solid var(--ok);border-radius:8px;padding:4px 7px;text-align:left;display:flex;flex-direction:column;gap:2px}
.step-line{font-size:9.8px;line-height:1.25;color:var(--ink)}
.step-line b{color:var(--a)}
.final-line{font-size:10.2px;font-weight:900;color:var(--ok)}

.btn-go-quiz{width:100%;background:var(--a);color:#fff;font-size:11px;font-weight:900;padding:5px;border-radius:10px;text-align:center}
body.q-mode .activity-nav,body.q-mode .concept-footer{display:none!important}
[hidden]{display:none!important}
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="head-left">
      <b>N-4-11 面積「平方公尺」與周長面積</b>
      <span id="qtag">108 課綱活動</span>
    </div>
    <div class="head-right">
      <button type="button" id="btn-theme" aria-label="切換深淺主題">🌙 深色</button>
    </div>
  </div>

  <nav class="activity-nav" id="actNav">
    <button type="button" class="act-btn active" data-act="0">🧩 活動一・百格地墊</button>
    <button type="button" class="act-btn" data-act="1">🌱 活動二・菜園圍籬</button>
    <button type="button" class="act-btn" data-act="2">🛝 活動三・遊戲區切補</button>
  </nav>

  <!-- 概念探索視圖 -->
  <section id="conceptView" class="act-card">
    <div class="card-head">
      <span class="card-badge" id="cBadge">活動一</span>
      <span class="card-title" id="cTitle">客廳拼接地墊：1 m² ＝ 10,000 cm²</span>
    </div>
    <p class="card-desc" id="cDesc">點選地墊數量與格線，觀察 1 公尺＝100 公分如何變成 10,000 平方公分。</p>
    <div class="stage-canvas" id="cStage"></div>
    <div class="interact-panel" id="cPanel"></div>
    <div class="info-bubble" id="cBubble">提示：1 公尺 × 1 公尺 ＝ 100 公分 × 100 公分 ＝ 10,000 平方公分。</div>
  </section>

  <!-- 真題演練視圖（?q=1..10） -->
  <section id="examView" class="act-card" hidden>
    <div class="card-head">
      <span class="card-badge" id="eBadge">真題互動</span>
      <span class="card-title" id="eTitle">面積與周長互動分析</span>
    </div>
    <p class="card-desc" id="eDesc">先動手操作圖形觀察邊長與單位關係，再決定選項。</p>
    <div class="stage-canvas" id="examStage"></div>
    <div class="interact-panel" id="ePanel"></div>
    <div class="info-bubble" id="eBubble">操作提示：點擊上方互動鈕觀察變化。</div>
    <div class="steps-box" id="stepsBox" hidden></div>
  </section>

  <div class="concept-footer" id="conceptFooter">
    <button type="button" class="btn-go-quiz" id="btnGoQuiz">📝 進入真題實戰演練 (Q1~Q10)</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- 主題同步（Light / Dark） ---------- */
function applyTheme(theme){
  var t = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  var btn = document.getElementById('btn-theme');
  if(btn) btn.textContent = t === 'dark' ? '☀️ 淺色' : '🌙 深色';
}
var qs = new URLSearchParams(location.search);
var initTheme = qs.get('theme') || localStorage.getItem('math_app_theme') || 'light';
applyTheme(initTheme);
document.getElementById('btn-theme').addEventListener('click', function(){
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try{ localStorage.setItem('math_app_theme', next); }catch(e){}
  if(window.parent && window.parent !== window){
    window.parent.postMessage({ type:'THEME_CHANGE', theme: next }, '*');
  }
});
window.addEventListener('message', function(ev){
  if(ev.data && ev.data.type === 'THEME_CHANGE') applyTheme(ev.data.theme);
});

/* ---------- 工具函式 ---------- */
function svgWrap(inner, vb){
  return '<svg viewBox="' + (vb || '0 0 320 114') + '" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
}
function vMulGrid(aStr, bStr, rows){
  var html = '<div class="vgrid-wrap"><div class="vgrid">';
  var pad = function(s){
    var arr = String(s).padStart(5, ' ').split('');
    return arr.map(function(c){ return '<span class="c">' + (c === ' ' ? '&nbsp;' : c) + '</span>'; }).join('');
  };
  html += pad(aStr);
  html += '<span class="c hl">×</span>' + pad(bStr).slice(26);
  html += '<span class="bar"></span>';
  rows.forEach(function(r, idx){
    if(idx === rows.length - 1 && rows.length > 1) html += '<span class="bar"></span>';
    html += pad(r);
  });
  html += '</div></div>';
  return html;
}
function vDivGrid(divisor, dividend, quotient, sub){
  var html = '<div class="vgrid-wrap"><div class="vgrid" style="grid-template-columns:repeat(4,15px)">';
  var row = function(arr){ return arr.map(function(c){ return '<span class="c">' + c + '</span>'; }).join(''); };
  html += row(['&nbsp;', '&nbsp;', quotient[0], quotient[1]]);
  html += '<span class="c hl">)</span><span class="c" style="grid-column:2/-1;border-top:1.5px solid var(--ink);letter-spacing:5px">' + dividend + '</span>';
  html += row([divisor, '&nbsp;', sub[0], sub[1]]);
  html += '<span class="bar"></span>';
  html += row(['&nbsp;', '&nbsp;', '0', '8']);
  html += '</div></div>';
  return html;
}

/* ---------- 概念探索三活動 ---------- */
var actIdx = 0;
var actState = {
  mats: 1, zoom: 10, // 活動一：1~4 m², zoom=10(10x10拼片) or 100(100x100細格)
  gw: 6, gh: 4, gMode: 'both', // 活動二：菜園寬2..8, 高2..6, mode: perim/area/both
  shape: 'L', cutMode: 'cut' // 活動三：L / T(凸字型), cut / fill
};

function renderConcept(){
  var cBadge = document.getElementById('cBadge');
  var cTitle = document.getElementById('cTitle');
  var cDesc = document.getElementById('cDesc');
  var cStage = document.getElementById('cStage');
  var cPanel = document.getElementById('cPanel');
  var cBubble = document.getElementById('cBubble');

  document.querySelectorAll('.act-btn').forEach(function(b){
    b.classList.toggle('active', Number(b.dataset.act) === actIdx);
  });

  if(actIdx === 0){
    cBadge.textContent = '活動一・單位換算';
    cTitle.textContent = '客廳拼接地墊：1 m² ＝ 10,000 cm²';
    cDesc.textContent = '調整客廳地墊片數，並切換「10×10 拼片」與「100×100 公分細格」觀察進位！';
    var m = actState.mats;
    var svg = '';
    for(var i = 0; i < m; i++){
      var ox = 16 + i * 74;
      svg += '<rect x="' + ox + '" y="18" width="66" height="66" rx="4" fill="var(--area-fill)" stroke="var(--area-stroke)" stroke-width="2"/>';
      var step = actState.zoom === 10 ? 6.6 : 3.3;
      var cnt = actState.zoom === 10 ? 10 : 20;
      for(var k = 1; k < cnt; k++){
        var p = (k * step).toFixed(1);
        svg += '<line x1="' + (ox + Number(p)) + '" y1="18" x2="' + (ox + Number(p)) + '" y2="84" stroke="var(--area-stroke)" stroke-opacity="0.28" stroke-width="0.6"/>';
        svg += '<line x1="' + ox + '" y1="' + (18 + Number(p)) + '" x2="' + (ox + 66) + '" y2="' + (18 + Number(p)) + '" stroke="var(--area-stroke)" stroke-opacity="0.28" stroke-width="0.6"/>';
      }
      svg += '<text x="' + (ox + 33) + '" y="13" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--ink)">1m (100cm)</text>';
      svg += '<text x="' + (ox + 33) + '" y="98" text-anchor="middle" font-size="9" font-weight="800" fill="var(--a)">1 m²</text>';
    }
    svg += '<text x="14" y="55" font-size="9" font-weight="800" fill="var(--ink)" transform="rotate(-90 10 55)" text-anchor="middle">1m (100cm)</text>';
    cStage.innerHTML = svgWrap(svg, '0 0 320 108');
    cPanel.innerHTML = '<div class="btn-grid">' +
      [1,2,3,4].map(function(n){
        return '<button type="button" class="btn-action' + (actState.mats===n?' active':'') + '" data-mat="' + n + '">' + n + ' 塊地墊 (' + n + ' m²)</button>';
      }).join('') +
      '<button type="button" class="btn-action primary" id="btnZoomToggle">' + (actState.zoom===10?'🔍 切換 100×100 公分格':'🧩 切換 10×10 拼片') + '</button>' +
      '</div>';
    cBubble.className = 'info-bubble ok';
    cBubble.textContent = m + ' 平方公尺 ＝ ' + m + ' × (100 × 100) ＝ ' + (m * 10000).toLocaleString() + ' 平方公分（每塊都有 10,000 個 1 cm² 小方格）';
    cPanel.querySelectorAll('[data-mat]').forEach(function(b){
      b.addEventListener('click', function(){ actState.mats = Number(b.dataset.mat); renderConcept(); });
    });
    document.getElementById('btnZoomToggle').addEventListener('click', function(){
      actState.zoom = actState.zoom === 10 ? 100 : 10;
      renderConcept();
    });
  } else if(actIdx === 1){
    cBadge.textContent = '活動二・公式推導';
    cTitle.textContent = '開心菜園：紅線周長 vs 藍磚面積（可拖曳縮放）';
    cDesc.textContent = '拖曳菜園右下角圓點改變長寬，觀察「外框圍籬」與「內部鋪磚」的差別！';
    var w = actState.gw, h = actState.gh;
    var cw = w * 24, ch = h * 14;
    var ox = 42, oy = 14;
    var svg = '';
    if(actState.gMode === 'area' || actState.gMode === 'both'){
      svg += '<rect x="' + ox + '" y="' + oy + '" width="' + cw + '" height="' + ch + '" fill="var(--area-fill)" stroke="none"/>';
      for(var c = 1; c < w; c++) svg += '<line x1="' + (ox + c*24) + '" y1="' + oy + '" x2="' + (ox + c*24) + '" y2="' + (oy + ch) + '" stroke="var(--area-stroke)" stroke-opacity="0.45" stroke-width="1"/>';
      for(var r = 1; r < h; r++) svg += '<line x1="' + ox + '" y1="' + (oy + r*14) + '" x2="' + (ox + cw) + '" y2="' + (oy + r*14) + '" stroke="var(--area-stroke)" stroke-opacity="0.45" stroke-width="1"/>';
    }
    if(actState.gMode === 'perim' || actState.gMode === 'both'){
      svg += '<rect x="' + ox + '" y="' + oy + '" width="' + cw + '" height="' + ch + '" fill="none" stroke="var(--perim)" stroke-width="3.5"/>';
    } else {
      svg += '<rect x="' + ox + '" y="' + oy + '" width="' + cw + '" height="' + ch + '" fill="none" stroke="var(--area-stroke)" stroke-width="1.5"/>';
    }
    svg += '<text x="' + (ox + cw/2) + '" y="' + (oy - 3) + '" text-anchor="middle" font-size="10" font-weight="800" fill="var(--ink)">長 ' + w + ' m</text>';
    svg += '<text x="' + (ox - 6) + '" y="' + (oy + ch/2 + 3) + '" text-anchor="end" font-size="10" font-weight="800" fill="var(--ink)">寬 ' + h + ' m</text>';
    svg += '<circle id="dragGarden" cx="' + (ox + cw) + '" cy="' + (oy + ch) + '" r="8" fill="var(--a)" stroke="#fff" stroke-width="2" style="cursor:nwse-resize"/>';
    svg += '<text x="292" y="42" text-anchor="end" font-size="10" font-weight="800" fill="var(--perim)">周長＝' + ((w+h)*2) + ' m</text>';
    svg += '<text x="292" y="60" text-anchor="end" font-size="10" font-weight="800" fill="var(--area-stroke)">面積＝' + (w*h) + ' m²</text>';
    cStage.innerHTML = svgWrap(svg, '0 0 320 112');
    cPanel.innerHTML = '<div class="btn-grid">' +
      '<button type="button" class="btn-action' + (actState.gMode==='perim'?' active':'') + '" data-gm="perim">🔴 只看紅線周長</button>' +
      '<button type="button" class="btn-action' + (actState.gMode==='area'?' active':'') + '" data-gm="area">🟦 只看藍磚面積</button>' +
      '<button type="button" class="btn-action' + (actState.gMode==='both'?' active':'') + '" data-gm="both">🔀 同時比較</button>' +
      '<button type="button" class="btn-action" id="btnSquarePreset">🟩 調成 4×4 正方形</button>' +
      '</div>';
    cBubble.className = 'info-bubble ok';
    cBubble.textContent = '周長 ＝ (' + w + '＋' + h + ') × 2 ＝ ' + ((w+h)*2) + ' m ｜ 面積 ＝ ' + w + ' × ' + h + ' ＝ ' + (w*h) + ' m²';
    cPanel.querySelectorAll('[data-gm]').forEach(function(b){
      b.addEventListener('click', function(){ actState.gMode = b.dataset.gm; renderConcept(); });
    });
    document.getElementById('btnSquarePreset').addEventListener('click', function(){
      actState.gw = 4; actState.gh = 4; renderConcept();
    });
    /* 綁定真實 pointerdown/move/up 拖曳縮放 */
    var handle = document.getElementById('dragGarden');
    var svgEl = cStage.querySelector('svg');
    if(handle && svgEl){
      var dragging = false;
      var updateFromPointer = function(ev){
        var pt = svgEl.getBoundingClientRect();
        var sx = (ev.clientX - pt.left) * (320 / pt.width);
        var sy = (ev.clientY - pt.top) * (112 / pt.height);
        var nw = Math.max(2, Math.min(8, Math.round((sx - ox) / 24)));
        var nh = Math.max(2, Math.min(6, Math.round((sy - oy) / 14)));
        if(nw !== actState.gw || nh !== actState.gh){
          actState.gw = nw; actState.gh = nh; renderConcept();
        }
      };
      handle.addEventListener('pointerdown', function(ev){
        dragging = true;
        if(handle.setPointerCapture) handle.setPointerCapture(ev.pointerId);
        ev.preventDefault();
      });
      svgEl.addEventListener('pointermove', function(ev){ if(dragging) updateFromPointer(ev); });
      window.addEventListener('pointerup', function(){ dragging = false; }, { once: false });
    }
  } else {
    cBadge.textContent = '活動三・複合圖形';
    cTitle.textContent = '兒童遊戲區：L 型與凸字型切割／填補';
    cDesc.textContent = '切換複合形狀與「切割法／填補法」，觀察算式如何把陌生圖形變長方形！';
    var isL = actState.shape === 'L';
    var isCut = actState.cutMode === 'cut';
    var svg = '';
    if(isL){
      // L型：總寬 12m (左6m高8m, 右6m高4m)
      svg += '<polygon points="60,18 120,18 120,56 180,56 180,94 60,94" fill="var(--area-fill)" stroke="var(--area-stroke)" stroke-width="2"/>';
      if(isCut){
        svg += '<line x1="120" y1="56" x2="120" y2="94" stroke="var(--perim)" stroke-width="2.5" stroke-dasharray="4 3"/>';
        svg += '<text x="90" y="60" text-anchor="middle" font-size="10" font-weight="900" fill="var(--ink)">6×8＝48</text>';
        svg += '<text x="150" y="78" text-anchor="middle" font-size="10" font-weight="900" fill="var(--ink)">6×4＝24</text>';
      } else {
        svg += '<rect x="120" y="18" width="60" height="38" fill="var(--cut-fill)" fill-opacity="0.65" stroke="var(--cut-stroke)" stroke-width="2" stroke-dasharray="4 3"/>';
        svg += '<text x="150" y="40" text-anchor="middle" font-size="9.5" font-weight="900" fill="var(--warn)">補 6×4＝24</text>';
      }
      svg += '<text x="90" y="13" text-anchor="middle" font-size="9" font-weight="800" fill="var(--ink)">6m</text>';
      svg += '<text x="52" y="58" text-anchor="end" font-size="9" font-weight="800" fill="var(--ink)">8m</text>';
      svg += '<text x="120" y="106" text-anchor="middle" font-size="9" font-weight="800" fill="var(--ink)">底 12m</text>';
      svg += '<text x="186" y="78" font-size="9" font-weight="800" fill="var(--ink)">4m</text>';
    } else {
      // 凸字型：外框14x8，上方中間凸起6x4
      svg += '<polygon points="90,18 150,18 150,52 190,52 190,92 50,92 50,52 90,52" fill="var(--area-fill)" stroke="var(--area-stroke)" stroke-width="2"/>';
      if(isCut){
        svg += '<line x1="90" y1="52" x2="150" y2="52" stroke="var(--perim)" stroke-width="2.5" stroke-dasharray="4 3"/>';
        svg += '<text x="120" y="38" text-anchor="middle" font-size="9.5" font-weight="900" fill="var(--ink)">6×4＝24</text>';

      svg += '<text x="146" y="44" text-anchor="middle" font-size="8.5" font-weight="900" fill="var(--warn)">16×8</text>';
    } else if(m8 === 'cut'){
      svg += '<line x1="134" y1="64" x2="134" y2="88" stroke="var(--perim)" stroke-width="2" stroke-dasharray="3 2"/>';
      svg += '<line x1="158" y1="64" x2="158" y2="88" stroke="var(--perim)" stroke-width="2" stroke-dasharray="3 2"/>';
      svg += '<text x="122" y="54" text-anchor="middle" font-size="8" font-weight="900" fill="var(--ink)">192</text>';
      svg += '<text x="146" y="79" text-anchor="middle" font-size="8" font-weight="900" fill="var(--ink)">64</text>';
      svg += '<text x="170" y="54" text-anchor="middle" font-size="8" font-weight="900" fill="var(--ink)">192</text>';
    }
    svg += '<text x="146" y="102" text-anchor="middle" font-size="9" font-weight="800" fill="var(--ink)">外框 24m × 24m（凹洞寬 8m 深 16m）</text>';
    stage.innerHTML = svgWrap(svg, '0 0 292 108');
    panel.innerHTML = renderControls(
      '<button type="button" class="btn-action' + (m8==='fill'?' active':'') + '" data-q8="fill">🧩 填補法 (24² − 16×8)</button>' +
      '<button type="button" class="btn-action' + (m8==='cut'?' active':'') + '" data-q8="cut">✂️ 切割法 (拆成 3 塊)</button>'
    );
    bubble.textContent = m8==='fill' ? '補成 24×24 大正方形後，減掉中間 16×8 凹洞。' : m8==='cut' ? '切成左 24×8、中 8×8、右 24×8 三塊相加。' : '選擇「填補法」或「切割法」顯示輔助線。';
    panel.querySelectorAll('[data-q8]').forEach(function(b){ b.onclick = function(){ qState.q8Mode = b.dataset.q8; renderExam(8); }; });
  } else if(q === 9){
    var mk = qState.q9Marked;
    var svg = '<rect x="95" y="14" width="120" height="84" fill="var(--area-fill)" stroke="var(--area-stroke)" stroke-width="2"/>';
    svg += '<rect x="135" y="36" width="40" height="40" fill="' + (mk?'var(--cut-fill)':'var(--hole-fill)') + '" stroke="' + (mk?'var(--perim)':'var(--line)') + '" stroke-width="2" stroke-dasharray="' + (mk?'4 3':'none') + '"/>';
    svg += '<text x="155" y="10" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--ink)">長 10m</text>';
    svg += '<text x="88" y="58" text-anchor="end" font-size="9.5" font-weight="800" fill="var(--ink)">寬 8m</text>';
    svg += '<text x="155" y="60" text-anchor="middle" font-size="9" font-weight="900" fill="' + (mk?'var(--warn)':'var(--ink)') + '">' + (mk?'扣 4×4＝16':'4m×4m') + '</text>';
    stage.innerHTML = svgWrap(svg, '0 0 300 106');
    panel.innerHTML = renderControls('<button type="button" class="btn-action' + (mk?' active':'') + '" id="btnQ9">' + (mk?'⬜ 取消標示':'🔍 標示挖空扣除') + '</button>');
    bubble.textContent = mk ? '大長方形 10×8 ＝ 80 m²，扣除中間挖空 4×4 ＝ 16 m²！' : '點擊按鈕觀察「整體減去挖空」的圖形關係。';
    document.getElementById('btnQ9').onclick = function(){ qState.q9Marked = !qState.q9Marked; renderExam(9); };
  } else if(q === 10){
    var cfgs = [{w:9,h:1},{w:8,h:2},{w:6,h:4},{w:5,h:5}];
    var cur = cfgs[qState.q10Cfg];
    var rw = cur.w * 20, rh = cur.h * 16;
    var ox = Math.round((240 - rw)/2), oy = Math.round((96 - rh)/2);
    var svg = '<rect x="' + ox + '" y="' + oy + '" width="' + rw + '" height="' + rh + '" fill="var(--area-fill)" stroke="var(--perim)" stroke-width="2.5"/>';
    for(var c=1;c<cur.w;c++) svg += '<line x1="' + (ox+c*20) + '" y1="' + oy + '" x2="' + (ox+c*20) + '" y2="' + (oy+rh) + '" stroke="var(--area-stroke)" stroke-opacity="0.45"/>';
    for(var r=1;r<cur.h;r++) svg += '<line x1="' + ox + '" y1="' + (oy+r*16) + '" x2="' + (ox+rw) + '" y2="' + (oy+r*16) + '" stroke="var(--area-stroke)" stroke-opacity="0.45"/>';
    svg += '<text x="295" y="40" text-anchor="end" font-size="10" font-weight="800" fill="var(--perim)">周長＝20 cm</text>';
    svg += '<text x="295" y="60" text-anchor="end" font-size="10.5" font-weight="900" fill="var(--area-stroke)">面積＝' + (cur.w*cur.h) + ' cm²</text>';
    stage.innerHTML = svgWrap(svg, '0 0 310 100');
    panel.innerHTML = renderControls(
      cfgs.map(function(c, idx){
        return '<button type="button" class="btn-action' + (qState.q10Cfg===idx?' active':'') + '" data-q10="' + idx + '">' + c.w + '×' + c.h + '</button>';
      }).join('')
    );
    bubble.textContent = '目前 ' + cur.w + ' × ' + cur.h + '：周長固定 20 cm，面積是 ' + (cur.w * cur.h) + ' cm²。比較四種形狀！';
    panel.querySelectorAll('[data-q10]').forEach(function(b){ b.onclick = function(){ qState.q10Cfg = Number(b.dataset.q10); renderExam(10); }; });
  }

  var revealBtn = document.getElementById('revealSteps');
  if(revealBtn){
    revealBtn.onclick = function(){
      stepsBox.hidden = !stepsBox.hidden;
      revealBtn.textContent = stepsBox.hidden ? '🔍 一步一步看算理' : '🙈 收合算理步驟';
    };
  }
}

/* ---------- 入口模式分派 ---------- */
var qNum = parseInt(qs.get('q') || '', 10);
var isQMode = Number.isInteger(qNum) && qNum >= 1 && qNum <= 10;
window.__N411_MODE__ = isQMode ? 'exam' : 'concept';
window.__N411_Q__ = isQMode ? qNum : 0;

if(isQMode){
  document.body.classList.add('q-mode');
  document.getElementById('qtag').textContent = '真題實戰 Q' + qNum;
  document.getElementById('conceptView').hidden = true;
  document.getElementById('examView').hidden = false;
  document.getElementById('stepsBox').hidden = true;
  renderExam(qNum);
} else {
  document.getElementById('conceptView').hidden = false;
  document.getElementById('examView').hidden = true;
  document.querySelectorAll('.act-btn').forEach(function(b){
    b.addEventListener('click', function(){ actIdx = Number(b.dataset.act); renderConcept(); });
  });
  document.getElementById('btnGoQuiz').addEventListener('click', function(){
    if(window.parent && window.parent !== window){
      window.parent.postMessage({ type:'SWITCH_TO_EXAM' }, '*');
    } else {
      location.search = '?q=1';
    }
  });
  renderConcept();
}
})();
</script>
</body>
</html>
