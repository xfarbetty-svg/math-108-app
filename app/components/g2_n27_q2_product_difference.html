<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-7-Q02 青蛙跳跳階梯</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.lab { text-align: center; }
.lab-title { font-size: 11px; font-weight: 900; color: #b45309; letter-spacing: 2px; margin-bottom: 2px; }
.lab-stage { display: flex; justify-content: center; }
.gap-line { font-size: 13.5px; font-weight: 900; color: #b45309; margin-top: 2px; min-height: 17px; }
.jump-btn {
  margin-top: 3px;
  border: 2px solid #b45309;
  background: var(--bg-card);
  color: #b45309;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.jump-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #fef3c7; color: #b45309; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card lab">
    <p class="stem"><small>112-2 內湖 期中 一、(7)</small>10×3 比 10×8 的乘數少（ ），積少（ ）。</p>
    <div class="lab-title">✦ 青蛙跳跳數線階梯 ✦</div>
    <div class="lab-stage" id="lab-stage"></div>
    <div class="gap-line" id="gap-line"></div>
    <div>
      <button type="button" class="jump-btn" id="jump">讓青蛙跳差距</button>
      <span class="mode-label" id="mode-label">目前：兩座積</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['少 5 ，積少 50', '少 5 ，積少 30', '少 8 ，積少 80', '少 3 ，積少 30'];
  var ANSWER = 0;
  var picked = -1;
  var jumped = false;

  var stage = document.getElementById('lab-stage');
  var gapLine = document.getElementById('gap-line');
  var jumpBtn = document.getElementById('jump');
  var modeLabel = document.getElementById('mode-label');

  /* 數線 0~80，每格 10；綠弧 0→30（10×3），藍弧 0→80（10×8），橘虛線 30→80（差 5 步＝50） */
  function lineSVG(showGap) {
    var s = '<svg width="330" height="102" viewBox="0 0 330 102">';
    var x0 = 18, step = 36, baseY = 78;
    s += '<line x1="' + (x0 - 8) + '" y1="' + baseY + '" x2="' + (x0 + 8 * step + 12) + '" y2="' + baseY + '" stroke="#92400e" stroke-width="2" stroke-linecap="round"/>';
    for (var i = 0; i <= 8; i++) {
      var x = x0 + i * step;
      s += '<line x1="' + x + '" y1="' + (baseY - 4) + '" x2="' + x + '" y2="' + (baseY + 4) + '" stroke="#92400e" stroke-width="2"/>';
      s += '<text x="' + x + '" y="' + (baseY + 16) + '" font-size="9.5" font-weight="800" text-anchor="middle" fill="#92400e">' + (i * 10) + '</text>';
    }
    /* 綠弧：0 → 30 */
    var gx = x0 + 3 * step;
    s += '<path d="M ' + x0 + ' ' + (baseY - 6) + ' Q ' + (x0 + gx) / 2 + ' 30 ' + gx + ' ' + (baseY - 6) + '" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>';
    s += '<text x="' + ((x0 + gx) / 2) + '" y="24" font-size="10" font-weight="900" text-anchor="middle" fill="#16a34a">10×3＝30</text>';
    /* 藍弧：0 → 80 */
    var bx = x0 + 8 * step;
    s += '<path d="M ' + x0 + ' ' + (baseY - 10) + ' Q ' + (x0 + bx) / 2 + ' 6 ' + bx + ' ' + (baseY - 10) + '" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>';
    s += '<text x="' + ((x0 + bx) / 2) + '" y="12" font-size="10" font-weight="900" text-anchor="middle" fill="#2563eb">10×8＝80</text>';
    /* 青蛙 */
    s += '<circle cx="' + gx + '" cy="' + (baseY - 2) + '" r="5" fill="#16a34a"/>';
    s += '<circle cx="' + bx + '" cy="' + (baseY - 2) + '" r="5" fill="#2563eb"/>';
    if (showGap) {
      s += '<path d="M ' + gx + ' ' + (baseY - 8) + ' Q ' + (gx + bx) / 2 + ' 40 ' + bx + ' ' + (baseY - 8) + '" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>';
      s += '<text x="' + ((gx + bx) / 2) + '" y="42" font-size="10" font-weight="900" text-anchor="middle" fill="#ea580c">再跳 5 步＝50</text>';
    }
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = lineSVG(jumped);
    if (jumped) {
      gapLine.textContent = '乘數差 8−3＝5，積差 80−30＝50';
      modeLabel.textContent = '目前：跳差距';
      jumpBtn.textContent = '收起差距';
    } else {
      gapLine.textContent = '10×3＝30、10×8＝80';
      modeLabel.textContent = '目前：兩座積';
      jumpBtn.textContent = '讓青蛙跳差距';
    }
  }

  jumpBtn.addEventListener('click', function () { jumped = !jumped; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！乘數少 8−3＝5，積就少 5 個 10，80−30＝50。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：青蛙從 30 跳到 80 要跳幾步？每步 10，5 步就是 50——比的是兩個積的「差」。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-7-Q02', answer: ANSWER };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
