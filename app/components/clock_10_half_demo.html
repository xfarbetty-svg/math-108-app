<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-1-6 時間：半點鐘報讀（短針在10與11之間）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #eff6ff;
            color: #0f172a;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #bfdbfe;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; color: #1e293b; }
        .playground {
            border: 2px solid #93c5fd;
            border-radius: 14px;
            background: #fefce8;
            padding: 6px;
            margin-bottom: 14px;
            display: flex;
            justify-content: center;
        }
        .playground svg { display: block; width: 100%; max-width: 300px; height: auto; }
        #guideArc, #guideLabel { opacity: 0; transition: opacity .5s; }
        svg.revealed #guideArc, svg.revealed #guideLabel { opacity: 1; }
        svg.revealed #hourHand { stroke-width: 12; }
        .pair-note { text-align: center; font-size: 1.05rem; font-weight: 800; color: #1d4ed8; min-height: 1.6em; margin-bottom: 10px; }
        .action-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
        .reveal-btn {
            min-height: 44px;
            background: #d97706;
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 22px;
            cursor: pointer;
        }
        .reset-btn {
            min-height: 44px;
            background: #ffffff;
            color: #334155;
            font-size: 1rem;
            font-weight: 700;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .opt-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
        .opt-btn {
            min-height: 44px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            padding: 8px 14px;
        }
        .opt-btn.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .footer-action { display: flex; justify-content: center; margin-top: 10px; }
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-banner {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
        @media (max-width: 640px) {
            body { padding: 4px 6px; }
            .container { padding: 8px 10px; max-width: 480px; }
            .stem { font-size: 14.5px; margin-bottom: 8px; line-height: 1.35; }
            .playground { margin-bottom: 6px; padding: 4px; border-radius: 12px; }
            .pair-note { font-size: 13px; min-height: 1.2em; margin-bottom: 6px; }
            .action-row { margin-bottom: 6px; gap: 6px; }
            .reveal-btn, .reset-btn { min-height: 36px; padding: 6px 12px; font-size: 12.5px; border-radius: 10px; }
            .opt-group { gap: 6px; margin-bottom: 6px; }
            .opt-btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }
            .footer-action { margin-top: 6px; }
            .check-btn { min-height: 38px; padding: 6px 28px; font-size: 14px; }
            .result-banner { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">獅湖 114-1 期末 · 日常時間用語</span>
    </div>

    <div class="stem">短針指在 10 和 11 之間，長針指在 6，是幾點半？</div>

    <div class="playground">
        <svg id="clockSvg" viewBox="0 0 300 260" role="img" aria-label="半點鐘教具"></svg>
    </div>

    <div class="pair-note" id="pairNote">短針停在 10 和 11 的正中間，長針筆直朝下指在 6 —— 幾點半呢？</div>

    <div class="action-row">
        <button class="reveal-btn" id="revealBtn" onclick="reveal()">💡 算理解密</button>
        <button class="reset-btn" id="resetBtn" onclick="resetAll()">重來</button>
    </div>

    <div class="opt-group" id="opts"></div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    // 鐘面幾何：中心 (150,136)。10 點半：短針 = (10 + 0.5)×30 = 315°，長針指 6 = 180°
    const CX = 150, CY = 136;
    const HOUR_ANGLE = 315, MINUTE_ANGLE = 180;
    let userAnswer = null;
    const ANSWER_INDEX = 0;

    function clockPt(r, deg) {
        const rad = deg * Math.PI / 180;
        return [CX + r * Math.sin(rad), CY - r * Math.cos(rad)];
    }

    function buildClock() {
        let s = `<circle cx="${CX}" cy="${CY}" r="104" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
                 <circle cx="${CX}" cy="${CY}" r="96" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>`;
        for (let n = 1; n <= 12; n++) {
            const [tx, ty] = clockPt(92, n * 30);
            s += `<line x1="${CX + (tx - CX) * 0.94}" y1="${CY + (ty - CY) * 0.94}" x2="${tx}" y2="${ty}" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>`;
            const [nx, ny] = clockPt(72, n * 30);
            s += `<text x="${nx}" y="${ny + 5.5}" text-anchor="middle" font-size="15" font-weight="800" fill="#334155">${n}</text>`;
        }
        // 扇形指引：10（300°）到 11（330°）之間的黃色扇形，說明短針「走過 10、還沒到 11」
        const [a1x, a1y] = clockPt(88, 300);
        const [a2x, a2y] = clockPt(88, 330);
        const [lx, ly] = clockPt(112, 315);
        s += `<g id="minuteGlow"><line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - 72}" stroke="#93c5fd" stroke-width="14" stroke-linecap="round"/></g>
              <path id="guideArc" d="M ${CX} ${CY} L ${a1x} ${a1y} A 88 88 0 0 1 ${a2x} ${a2y} Z" fill="#fbbf24" opacity="0"/>
              <g id="hourWrap" transform="rotate(${HOUR_ANGLE} ${CX} ${CY})">
                  <line id="hourHand" x1="${CX}" y1="${CY + 10}" x2="${CX}" y2="${CY - 50}" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
              </g>
              <g id="minuteWrap" transform="rotate(${MINUTE_ANGLE} ${CX} ${CY})">
                  <line id="minuteHand" x1="${CX}" y1="${CY + 10}" x2="${CX}" y2="${CY - 72}" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
              </g>
              <circle cx="${CX}" cy="${CY}" r="7" fill="#334155"/>
              <text id="guideLabel" x="${lx}" y="${ly}" text-anchor="middle" font-size="11" font-weight="800" fill="#b45309">還沒到 11！</text>`;
        document.getElementById('clockSvg').innerHTML = s;
    }

    function reveal() {
        document.getElementById('clockSvg').classList.add('revealed');
        setNote('短針走過 <span style="color:#b45309">10</span> 但還沒到 <span style="color:#b45309">11</span>，所以是 <span style="color:#d97706">10 點半</span>，千萬不能看成 11 點半！');
    }

    function setNote(html) { document.getElementById('pairNote').innerHTML = html; }

    function resetAll() {
        document.getElementById('clockSvg').classList.remove('revealed');
        setNote('短針停在 10 和 11 的正中間，長針筆直朝下指在 6 —— 幾點半呢？');
    }

    function buildOpts() {
        const group = document.getElementById('opts');
        ['10 點半', '11 點半', '9 點半'].forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = function () {
                group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                userAnswer = idx;
            };
            group.appendChild(btn);
        });
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (userAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '先選一個答案再檢查喔！';
            return;
        }
        if (userAnswer === ANSWER_INDEX) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對！短針走過 10 還沒到 11、長針指 6 —— 就是 10 點半！';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '再想想：短針只走過 10、還沒到 11，是 10 點半，不是 11 點半！';
        }
    }

    buildClock();
    buildOpts();
</script>

</body>
</html>
