<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">>
    <title>G3-R-3-1 乘除互逆實驗室</title>
    <style>
        :root {
            --brass: #B8860B;
            --wood: #5D4037;
            --paper: #FDFBF7;
            --accent: #8B4513;
        }
        html[data-theme="dark"] {
            --brass: #C9A227; --wood: #334155; --paper: #1F2736; --accent: #86D9B8;
        }
        html[data-theme="dark"] body { background: var(--bg-main); color: var(--text-primary); }
        html[data-theme="dark"] .view p,
        html[data-theme="dark"] #act2-desc,
        html[data-theme="dark"] .formula-display { color: var(--text-primary); }
        html[data-theme="dark"] .formula-display { border-color: var(--border-color); background: var(--bg-elevated); }
        html[data-theme="dark"] .notebook { background: var(--bg-card); border-color: var(--border-color); color: var(--text-primary); }
        html[data-theme="dark"] .tab { background: var(--bg-elevated); color: var(--text-primary); }
        html[data-theme="dark"] .tab.active { background: var(--paper); color: var(--accent); }
        html[data-theme="dark"] .btn { background: var(--accent-primary); }
        .q-badge { position: absolute; top: 3px; right: 8px; background: var(--brass); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 7px; border-radius: 10px; z-index: 500; }
        .q-focus { position: absolute; top: 28px; right: 8px; max-width: 170px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 2px 7px; font-size: 9px; font-weight: bold; color: var(--text-primary); z-index: 500; pointer-events: none; }
        .q-scene { position:absolute; left:0; right:0; top:0; bottom:0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding:34px 8px 6px; z-index:450; overflow: hidden; }
        .q-scene svg { display: block; width: 100%; height: 100%; }
        .q-scene .t { font-size: 12px; fill: var(--text-primary); font-weight: 700; }
        .q-scene .s { font-size: 11px; fill: var(--text-secondary); }
        .q-scene .b { fill: var(--bg-elevated); stroke: var(--accent-primary); stroke-width: 1.5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            width:100%; max-width:390px; height: 420px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: #d7ccc8;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        /* 導航標籤 */
        .tabs {
            display: flex; background: var(--wood); padding: 4px 2px 0; gap: 2px;
        }
        .tab {
            flex: 1; padding: 6px 2px; font-size: 11px; text-align: center;
            background: #8d6e63; color: #fff; border-radius: 4px 4px 0 0;
            cursor: pointer; border: none; transition: 0.3s;
        }
        .tab.active { background: var(--paper); color: var(--wood); font-weight: bold; }

        /* 主容器 */
        .viewport {
            flex: 1; background: var(--paper); position: relative;
            border: 4px solid var(--wood); overflow: hidden;
        }
        .view {
            display: none; width: 100%; height: 100%; padding: 8px;
            flex-direction: column; align-items: center;
        }
        .view.active { display: flex; }

        /* 共通組件 */
        .title { font-size: 14px; color: var(--accent); font-weight: bold; margin-bottom: 6px; }
        .btn {
            background: var(--brass); color: white; border: none;
            padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;
        }
        .btn:active { transform: scale(0.95); }

        /* Act 1: 乘除互逆家族 */
        .triangle-card {
            width: 160px; height: 140px; position: relative; margin-top: 8px;
            background: #e0c097; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: 4px solid var(--wood); display: flex; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .num { position: absolute; font-size: 22px; font-weight: bold; color: var(--wood); }
        .num-top { top: 24px; }
        .num-left { bottom: 8px; left: 24px; }
        .num-right { bottom: 8px; right: 24px; }
        .formula-display {
            margin-top: 12px; font-size: 18px; font-family: monospace; font-weight: bold;
            background: var(--bg-card); padding: 6px 16px; border: 2px dashed var(--wood); border-radius: 6px;
        }

        /* Act 2: 天平移項 */
        .balance-stage { width: 100%; height: 120px; position: relative; margin-top: 10px; }
        .beam { width: 220px; height: 6px; background: var(--brass); position: absolute; left: 75px; top: 30px; transition: 0.5s; border-radius: 3px; }
        .pivot { width: 8px; height: 70px; background: var(--brass); position: absolute; left: 181px; top: 30px; }
        .pan { width: 70px; height: 8px; background: var(--wood); position: absolute; top: 70px; border-radius: 4px; }
        .pan-l { left: 45px; } .pan-r { right: 45px; }
        .weight { position: absolute; bottom: 10px; width: 100%; text-align: center; font-weight: bold; font-size: 13px; color: #3e2723; }
        .move-btn { margin-top: 25px; }

        /* Act 3: 驗算偵探 */
        .notebook {
            width: 90%; background: var(--bg-card); border: 1px solid #ddd; border-left: 4px solid #ef5350;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.08); padding: 8px 12px; position: relative; font-size: 12px; line-height: 1.5;
        }
        .error-mark { color: red; font-weight: bold; font-size: 13px; border: 2px solid red; padding: 3px 6px; display: none; margin-top: 6px; border-radius: 4px; }

        /* Act 4: 魔術箱 */
        .magic-box {
            width: 220px; height: 75px; border: 3px solid var(--brass);
            background: #4e342e; color: #ffd700; display: flex;
            align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
            border-radius: 8px; margin: 12px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* 語音控制 */
        .voice-ctrl {
            position: absolute; bottom: 5px; right: 8px;
            background: rgba(255,255,255,0.9); border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;
        }
    
/* G3 窄屏_one-screen 收斂 */
#q-badge, #q-focus, .q-badge, .q-focus, .qtag, #qtag {
  max-width: calc(100% - 16px) !important; right: 8px !important; box-sizing: border-box !important;
  white-space: normal !important; overflow-wrap: anywhere !important;
}
svg text { max-width: 100%; }
</style>

<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body id="app">

<div class="tabs">
    <button class="tab active" id="tab-act1" onclick="switchAct(1)">1. 互逆家族</button>
    <button class="tab" id="tab-act2" onclick="switchAct(2)">2. 天平移項</button>
    <button class="tab" id="tab-act3" onclick="switchAct(3)">3. 驗算偵探</button>
    <button class="tab" id="tab-act4" onclick="switchAct(4)">4. 魔術箱</button>
</div>

<div class="viewport">
    <div id="q-badge" class="q-badge"></div>
    <div id="q-focus" class="q-focus"></div>
    <div id="q-scene" class="q-scene"></div>
    <!-- Act 1 -->
    <div id="act-1-view" class="view active">
        <div class="title">點擊卡片：旋轉探索 4 個等價算式！</div>
        <div class="triangle-card" onclick="rotateAct1()">
            <div class="num num-top">24</div>
            <div class="num num-left">4</div>
            <div class="num num-right">6</div>
        </div>
        <div id="act1-formula" class="formula-display">4 × 6 = 24</div>
        <p style="font-size: 11px; color: #666; margin-top: 8px;">乘法與除法是一家人！倒過來看就是除法。</p>
    </div>

    <!-- Act 2 -->
    <div id="act-2-view" class="view">
        <div class="title">移項實驗：乘法變除法</div>
        <div class="balance-stage">
            <div class="beam" id="beam"></div>
            <div class="pivot"></div>
            <div class="pan pan-l" id="pan-l">
                <div class="weight" id="weight-l">3 × ❓</div>
            </div>
            <div class="pan pan-r" id="pan-r">
                <div class="weight" id="weight-r">15</div>
            </div>
        </div>
        <button class="btn move-btn" onclick="toggleTransposition()" id="trans-btn">將 ×3 移到右邊</button>
        <div id="act2-desc" style="margin-top:8px; font-size:12px; font-weight:bold; color:#5d4037">天平平衡：3 × ❓ = 15</div>
    </div>

    <!-- Act 3 -->
    <div id="act-3-view" class="view">
        <div class="title">抓出驗算的大漏洞！</div>
        <div class="notebook">
            <p>題目：84 ÷ 7 = ?</p>
            <p>小明算：<span style="color:#d32f2f; font-weight:bold">11 ... 餘 7</span></p>
            <hr style="border:none; border-top:1px dashed #ccc">
            <div id="act3-check">
                <p>驗算看似正確：11 × 7 + 7 = 84</p>
                <p id="act3-hint" style="color:red; font-size:12px; font-weight:bold;"></p>
            </div>
        </div>
        <button class="btn" style="margin-top:8px" onclick="checkAct3()">開始偵查漏洞</button>
        <div id="act3-error" class="error-mark">⚠️ 餘數 (7) 等於除數 (7)！還可以再除 1 次！商應為 12！</div>
    </div>

    <!-- Act 4 -->
    <div id="act-4-view" class="view">
        <div class="title">未知數算式魔術箱</div>
        <div class="magic-box" id="magic-q">❓ × 8 = 72</div>
        <div style="display:flex; gap:8px;">
            <button class="btn" onclick="solveMagic()">倒推破解</button>
            <button class="btn" style="background:#555" onclick="nextMagic()">下一題</button>
        </div>
        <div id="magic-ans" style="margin-top:10px; font-size:16px; color:var(--accent); font-weight:bold;"></div>
    </div>

    <div class="voice-ctrl" onclick="toggleMute()">🔊</div>
</div>

<script>
    let isMuted = false;

    function speak(text) {
        if (typeof isMuted !== 'undefined' && isMuted) return;
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'TTS_SPEAK', text: text }, '*');
        } else if (window.AudioManager) {
            window.AudioManager.play(text);
        }
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.querySelector('.voice-ctrl').innerText = isMuted ? '🔇' : '🔊';
    }

    function switchAct(n) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`act-${n}-view`).classList.add('active');
        document.getElementById(`tab-act${n}`).classList.add('active');
        
        if(n===1) speak("乘法與除法互為逆運算，就像一家人。");
        if(n===2) speak("在天平兩邊移動數字，乘以三移到右邊變成除以三。");
        if(n===3) speak("注意！餘數絕對不能等於或大於除數喔！");
        if(n===4) speak("利用乘除互逆關係，找出消失的數字吧。");
    }
    const showAct = switchAct;

    // Act 1 Logic
    let act1Idx = 0;
    const formulas = ["4 × 6 = 24", "6 × 4 = 24", "24 ÷ 4 = 6", "24 ÷ 6 = 4"];
    function rotateAct1() {
        act1Idx = (act1Idx + 1) % 4;
        document.getElementById('act1-formula').innerText = formulas[act1Idx];
        speak(formulas[act1Idx].replace('×','乘以').replace('÷','除以').replace('=','等於'));
    }

    // Act 2 Logic
    let isTransposed = false;
    function toggleTransposition() {
        isTransposed = !isTransposed;
        const btn = document.getElementById('trans-btn');
        const wl = document.getElementById('weight-l');
        const wr = document.getElementById('weight-r');
        const desc = document.getElementById('act2-desc');
        
        if(isTransposed) {
            wl.innerText = "❓";
            wr.innerText = "15 ÷ 3";
            btn.innerText = "還原算式";
            desc.innerText = "移項後：❓ = 15 ÷ 3 = 5！";
            speak("把乘以三移到右邊，變成了除以三，所以問號等於五！");
        } else {
            wl.innerText = "3 × ❓";
            wr.innerText = "15";
            btn.innerText = "將 ×3 移到右邊";
            desc.innerText = "天平平衡：3 × ❓ = 15";
        }
    }

    // Act 3 Logic
    function checkAct3() {
        document.getElementById('act3-hint').innerText = "驗算雖然乘起來是84，但除法規定：餘數必須小於除數！";
        document.getElementById('act3-error').style.display = "block";
        speak("抓到了！餘數等於除數，代表還可以再除一次，商應該是十二！");
    }

    // Act 4 Logic
    let currentMagic = 0;
    const magics = [
        { q: "❓ × 8 = 72", a: "72 ÷ 8 = 9 ➔ ❓ = 9" },
        { q: "56 ÷ ❓ = 7", a: "56 ÷ 7 = 8 ➔ ❓ = 8" },
        { q: "❓ ÷ 6 = 12", a: "12 × 6 = 72 ➔ ❓ = 72" },
        { q: "9 × ❓ = 81", a: "81 ÷ 9 = 9 ➔ ❓ = 9" }
    ];
    function solveMagic() {
        document.getElementById('magic-ans').innerText = "倒推： " + magics[currentMagic].a;
        speak("倒推算式：" + magics[currentMagic].a);
    }
    function nextMagic() {
        currentMagic = (currentMagic + 1) % magics.length;
        document.getElementById('magic-q').innerText = magics[currentMagic].q;
        document.getElementById('magic-ans').innerText = "";
    }

    // ?q=1..10 題號視覺模式（與題庫 component_path 對齊）
    const qNum = (() => {
        const n = parseInt(new URLSearchParams(location.search).get('q'), 10);
        return Number.isInteger(n) && n >= 1 && n <= 10 ? n : 1;
    })();
const SV = (inner) => '<svg viewBox="0 0 360 340" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
const T = (x, y, s, c) => '<text class="' + (c || 's') + '" x="' + x + '" y="' + y + '" text-anchor="middle">' + s + '</text>';
const B = (x, y, w, h, a, b) => '<rect class="b" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6"/>' +
  T(x + w / 2, y + (b ? 17 : 25), a, 't') + (b ? T(x + w / 2, y + 34, b, 's') : '');
const AR = (x1, x2, y) => '<line x1="' + x1 + '" y1="' + y + '" x2="' + (x2 - 8) + '" y2="' + y + '" stroke="var(--accent-primary)" stroke-width="2"/>' +
  '<path d="M' + (x2 - 8) + ',' + (y - 5) + ' L' + x2 + ',' + y + ' L' + (x2 - 8) + ',' + (y + 5) + '" fill="none" stroke="var(--accent-primary)" stroke-width="2"/>';
const R31 = {"1":"<svg viewBox=\"0 0 360 340\" preserveAspectRatio=\"xMidYMid meet\"><text class=\"t\" x=\"180\" y=\"24\" text-anchor=\"middle\">比較兩個算式，□ 裡該填什麼符號？</text><rect class=\"b\" x=\"15\" y=\"80\" width=\"145\" height=\"62\" rx=\"6\"/><text class=\"t\" x=\"87.5\" y=\"97\" text-anchor=\"middle\">200 × 3</text><text class=\"s\" x=\"87.5\" y=\"114\" text-anchor=\"middle\">3 個 200 相乘</text><text class=\"t\" x=\"180\" y=\"116\" text-anchor=\"middle\">□</text><rect class=\"b\" x=\"200\" y=\"80\" width=\"145\" height=\"62\" rx=\"6\"/><text class=\"t\" x=\"272.5\" y=\"97\" text-anchor=\"middle\">200+200+200</text><text class=\"s\" x=\"272.5\" y=\"114\" text-anchor=\"middle\">3 個 200 相加</text><text class=\"s\" x=\"180\" y=\"200\" text-anchor=\"middle\">先用乘法意義想想，再判斷大小</text></svg>","2":"<svg viewBox=\"0 0 360 340\" preserveAspectRatio=\"xMidYMid meet\"><text class=\"t\" x=\"180\" y=\"24\" text-anchor=\"middle\">被除數 ÷ 除數 ＝ 商</text><rect class=\"b\" x=\"15\" y=\"85\" width=\"105\" height=\"58\" rx=\"6\"/><text class=\"t\" x=\"67.5\" y=\"102\" text-anchor=\"middle\">（　）</text><text class=\"s\" x=\"67.5\" y=\"119\" text-anchor=\"middle\">被除數</text><text class=\"t\" x=\"126\" y=\"116\" text-anchor=\"middle\">÷</text><rect class=\"b\" x=\"143\" y=\"85\" width=\"74\" height=\"58\" rx=\"6\"/><text class=\"t\" x=\"180\" y=\"102\" text-anchor=\"middle\">8</text><text class=\"s\" x=\"180\" y=\"119\" text-anchor=\"middle\">除數</text><text class=\"t\" x=\"226\" y=\"116\" text-anchor=\"middle\">＝</text><rect class=\"b\" x=\"243\" y=\"85\" width=\"102\" height=\"58\" rx=\"6\"/><text class=\"t\" x=\"294\" y=\"102\" text-anchor=\"middle\">32</text><text class=\"s\" x=\"294\" y=\"119\" text-anchor=\"middle\">商</text><text class=\"s\" x=\"180\" y=\"205\" text-anchor=\"middle\">知道除數和商，要怎麼找回被除數？</text></svg>","3":"<svg viewBox=\"0 0 360 340\" preserveAspectRatio=\"xMidYMid meet\"><text class=\"t\" x=\"180\" y=\"24\" text-anchor=\"middle\">兩條算式都和 85、4 有關</text><rect class=\"b\" x=\"15\" y=\ <script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
