<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-6-Q05 積木條旋轉對齊</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.blocks { text-align: center; }
.blocks-title { font-size: 11px; font-weight: 900; color: #0e7490; letter-spacing: 2px; margin-bottom: 2px; }
.bar-stage { display: flex; justify-content: center; }
.add-line { font-size: 14px; font-weight: 900; color: #0e7490; margin-top: 2px; }
.convert-btn {
  margin-top: 4px;
  border: 2px solid #0e7490;
  background: var(--bg-card);
  color: #0e7490;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.convert-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #cffafe; color: #0e7490; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>112-1 內湖 期末 一、2</small>5＋5＋5＋5＝20，寫成乘法算式是？</p>
  </div>
  <div class="card blocks">
    <div class="blocks-title">✦ 積木條：連加 → 乘法 ✦</div>
    <div class="bar-stage" id="bar-stage"></div>
    <div class="add-line" id="add-line">5＋5＋5＋5＝20</div>
    <div>
      <button type="button" class="convert-btn" id="convert">旋轉對齊成乘法</button>
      <span class="mode-label" id="mode-label">目前：連加</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['5 × 4 ＝ 20', '4 × 5 ＝ 20', '5 ＋ 4 ＝ 9', '20 ÷ 4 ＝ 5'];
  var ANSWER = 0;
  var picked = -1;
  var mode = 'add'; /* add | mul */

  var stage = document.getElementById('bar-stage');
  var addLine = document.getElementById('add-line');
  var convert = document.getElementById('convert');
  var modeLabel = document.getElementById('mode-label');

  function barSVG(vertical) {
    /* 4 條 5 格數立方積木 */
    var s = '<svg width="312" height="76" viewBox="0 0 312 76">';
    var colors = ['#22d3ee', '#34d399', '#fbbf24', '#f472b6'];
    if (!vertical) {
      for (var b = 0; b < 4; b++) {
        var x = 8 + b * 76;
        for (var c = 0; c < 5; c++) {
          s += '<rect x="' + (x + c * 14) + '" y="' + (10 + b * 15) + '" width="13" height="14" rx="2" fill="' + colors[b] + '" stroke="#0e7490" stroke-width="1"/>';
        }
        s += '<text x="' + (x + 72) + '" y="' + (21 + b * 15) + '" font-size="9" font-weight="900" fill="#0e7490">5</text>';
      }
    } else {
      /* 旋轉對齊：4 條直立，被乘數 5 在前 */
      for (var b2 = 0; b2 < 4; b2++) {
        var x2 = 40 + b2 * 58;
        for (var c2 = 0; c2 < 5; c2++) {
          s += '<rect x="' + x2 + '" y="' + (16 + c2 * 11) + '" width="24" height="10" rx="2" fill="' + colors[b2] + '" stroke="#0e7490" stroke-width="1"/>';
        }
      }
      s += '<text x="20" y="45" font-size="10" font-weight="900" fill="#0e7490">5</text>';
      s += '<text x="20" y="57" font-size="8" font-weight="900" fill="#64748b">每份</text>';
      s += '<text x="288" y="45" font-size="10" font-weight="900" fill="#0e7490">4</text>';
      s += '<text x="282" y="57" font-size="8" font-weight="900" fill="#64748b">份數</text>';
    }
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = barSVG(mode === 'mul');
    if (mode === 'add') {
      addLine.textContent = '5＋5＋5＋5＝20（4 個 5 連加）';
      modeLabel.textContent = '目前：連加';
      convert.textContent = '旋轉對齊成乘法';
    } else {
      addLine.textContent = '每份是 5、共有 4 份 → 5×4＝20';
      modeLabel.textContent = '目前：乘法';
      convert.textContent = '轉回連加看看';
    }
  }

  convert.addEventListener('click', function () { mode = mode === 'add' ? 'mul' : 'add'; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！連加「4 個 5」，被乘數（每份 5）寫前面、乘數（4 份）寫後面，記作 5×4＝20。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：照照積木條——每份是 5、有 4 份。乘法算式裡「每份的數」要寫在乘號前面，後面寫份數。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-6-Q05', answer: ANSWER };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
