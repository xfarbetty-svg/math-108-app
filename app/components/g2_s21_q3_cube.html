<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-S-2-1-Q03 正方體特徵判斷</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.stage { position:relative; width:100%; height:140px; border-radius:12px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.stage-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:brightness(.92) contrast(1.05); }
.stage-overlay { position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,249,240,.3) 100%); backdrop-filter:blur(1.5px); }
.scene-svg { position:relative; z-index:2; display:block; width:100%; height:100%; }
.edge { transition:stroke .2s, stroke-width .2s; }
.face-hl { transition:filter .25s; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:4px; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:4px 12px; font-size:11.5px; font-weight:800; cursor:pointer; }
.tool-btn.on { background:var(--mint-deep); color:#fff; }
.status { text-align:center; font-size:11.5px; font-weight:800; color:var(--ink-soft); min-height:16px; margin-top:3px; }
.status b { color:var(--ink); }
.t-num { font-size:10px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.opts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:6px 4px; font-size:13px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border:none; border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); cursor:pointer; }
.result-banner { display:none; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>正方體特徵判斷</small>有塊積木每個邊一樣長、每個面都一樣大，這個積木是什麼體？先動手量量看、比比看！</p>
  </div>
  <div class="card">
    <div class="stage">
      <img src="../assets/demo/bg_toy_room.webp" class="stage-bg" alt="玩具房背景">
      <div class="stage-overlay"></div>
      <svg class="scene-svg" viewBox="0 0 360 140" role="img" aria-label="Isometric 正方體積木">
        <ellipse cx="180" cy="118" rx="52" ry="7" fill="rgba(61,58,52,.12)"/>
        <!-- Isometric 純 SVG 正方體（s=32）：頂面最亮 / 側左中亮 / 側右背光 / 1px 白高光接縫 -->
        <g id="cube">
          <polygon class="face-hl" points="180,44 207.7,60 180,76 152.3,60" fill="#fff2b2" stroke="#fffdf8" stroke-width="1"/>
          <polygon class="face-hl" points="152.3,60 180,76 180,108 152.3,92" fill="#ffd166" stroke="#fffdf8" stroke-width="1"/>
          <polygon class="face-hl" points="180,76 207.7,60 207.7,92 180,108" fill="#e6b840" stroke="#fffdf8" stroke-width="1"/>
          <!-- 12 條邊：4 上 + 3 直立 + 3 下（看得見 10 條，另 2 條藏在後面） -->
          <line class="edge" x1="180"   y1="44"  x2="207.7" y2="60"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="207.7" y1="60"  x2="180"   y2="76"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="180"   y1="76"  x2="152.3" y2="60"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="152.3" y1="60"  x2="180"   y2="44"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="180"   y1="76"  x2="180"   y2="108" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="152.3" y1="60"  x2="152.3" y2="92"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="207.7" y1="60"  x2="207.7" y2="92"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="152.3" y1="92"  x2="180"   y2="108" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line class="edge" x1="180"   y1="108" x2="207.7" y2="92"  stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <!-- 藏在後面的 2 條邊（虛線提示） -->
          <line class="edge" x1="180" y1="44" x2="180" y2="76" stroke="rgba(61,58,52,.35)" stroke-width="1.4" stroke-dasharray="3 3"/>
          <line class="edge" x1="152.3" y1="92" x2="180" y2="76" stroke="rgba(61,58,52,0)" stroke-width="1.4"/>
          <line class="edge" x1="180" y1="76" x2="207.7" y2="92" stroke="rgba(61,58,52,0)" stroke-width="1.4"/>
          <polygon points="180,44 207.7,60 180,76 152.3,60" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
          <!-- 皺摺貼紙小裝飾 -->
          <circle cx="180" cy="60" r="4" fill="#ff6b6b" stroke="#c24141" stroke-width="1"/>
        </g>
        <text x="180" y="134" class="t-num">正方體積木（每個邊都一樣長的猜測待你驗證！）</text>
      </svg>
    </div>
    <div class="tools">
      <button type="button" class="tool-btn" id="btnEdge">量量看邊長 📏</button>
      <button type="button" class="tool-btn" id="btnFace">比比看面 🔍</button>
    </div>
    <p class="status" id="status">這塊積木的邊和面，藏著什麼秘密？量量看！</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" type="button" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ["正方體", "長方體", "圓柱體", "球體"];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var status = document.getElementById('status');
  var btnEdge = document.getElementById('btnEdge');
  var btnFace = document.getElementById('btnFace');
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  var edges = document.querySelectorAll('#cube .edge');
  var faces = document.querySelectorAll('#cube .face-hl');
  var timer = null, step = -1, mode = null;
  function clearFx() {
    if (timer) { clearInterval(timer); timer = null; }
    step = -1; mode = null;
    Array.prototype.forEach.call(edges, function (e) { e.setAttribute('stroke-width', e.getAttribute('stroke-dasharray') ? '1.4' : '1.6'); if (!e.getAttribute('stroke-dasharray')) e.setAttribute('stroke', 'var(--ink)'); });
    Array.prototype.forEach.call(faces, function (f) { f.style.filter = ''; });
    btnEdge.classList.remove('on'); btnFace.classList.remove('on');
  }

  btnEdge.addEventListener('click', function () {
    var wasOn = btnEdge.classList.contains('on');
    clearFx();
    if (wasOn) { status.innerHTML = '這塊積木的邊和面，藏著什麼秘密？量量看！'; return; }
    btnEdge.classList.add('on'); mode = 'edge'; step = 0;
    var visible = Array.prototype.filter.call(edges, function (e) { return !e.getAttribute('stroke-dasharray') && e.getAttribute('stroke') !== 'rgba(61,58,52,0)'; });
    say('量量看，每一條邊都一樣長嗎？');
    timer = setInterval(function () {
      if (step >= visible.length) {
        clearInterval(timer); timer = null;
        Array.prototype.forEach.call(visible, function (e) { e.setAttribute('stroke', '#318a70'); e.setAttribute('stroke-width', '2.6'); });
        status.innerHTML = '看得見的 <b>10 條邊</b>都一樣長，藏在後面的 <b>2 條</b>也一樣長——<b>12 條邊全部等長！</b>';
        say('十二條邊全部一樣長！');
        return;
      }
      visible[step].setAttribute('stroke', '#ff6b6b');
      visible[step].setAttribute('stroke-width', '2.6');
      status.innerHTML = '量第 <b>' + (step + 1) + '</b> 條邊……好像都一樣長？';
      step += 1;
    }, 260);
  });

  btnFace.addEventListener('click', function () {
    var wasOn = btnFace.classList.contains('on');
    clearFx();
    if (wasOn) { status.innerHTML = '這塊積木的邊和面，藏著什麼秘密？量量看！'; return; }
    btnFace.classList.add('on'); mode = 'face'; step = 0;
    say('比比看，每一個面都一樣大嗎？');
    timer = setInterval(function () {
      Array.prototype.forEach.call(faces, function (f) { f.style.filter = ''; });
      if (step >= faces.length) {
        clearInterval(timer); timer = null;
        Array.prototype.forEach.call(faces, function (f) { f.style.filter = 'brightness(1.12)'; });
        status.innerHTML = '看得見的 <b>3 個面</b>都一樣大，轉過去另外 3 個面也一樣——<b>6 個面全部相等！</b>';
        say('六個面都一樣大！');
        return;
      }
      faces[step].style.filter = 'brightness(1.2) saturate(1.25)';
      status.innerHTML = '比第 <b>' + (step + 1) + '</b> 個面……好像都一樣大？';
      step += 1;
    }, 550);
  });

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！每個邊一樣長、每個面都一樣大，就是正方體。';
      say('答對！就是正方體。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：長方體的邊不一定每條一樣長；圓柱體和球體根本沒有邊喔！';
    say('再想想看：每個邊一樣長、每個面都一樣大，才是正方體。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-S-2-1-Q03', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
