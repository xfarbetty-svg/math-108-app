<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-1-5 長度：彎曲緞帶拉直比一比</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #eff6ff;
            color: #0f172a;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #bfdbfe;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; color: #1e293b; }
        .playground {
            border: 2px solid #93c5fd;
            border-radius: 14px;
            background: #fefce8;
            padding: 6px;
            margin-bottom: 14px;
        }
        .playground svg { display: block; width: 100%; height: auto; }
        .pair-note { text-align: center; font-size: 1.1rem; font-weight: 800; color: #1d4ed8; min-height: 1.6em; margin-bottom: 10px; }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
        .stretch-btn {
            min-height: 44px;
            background: #e11d48;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 26px;
            cursor: pointer;
        }
        .stretch-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .reset-btn {
            min-height: 44px;
            background: #ffffff;
            color: #334155;
            font-size: 1rem;
            font-weight: 700;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .opt-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
        .opt-btn {
            min-height: 44px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            padding: 8px 14px;
        }
        .opt-btn.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .footer-action { display: flex; justify-content: center; margin-top: 10px; }
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-banner {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
        @media (max-width: 640px) {
            body { padding: 4px 6px; }
            .container { padding: 8px 10px; max-width: 480px; }
            .stem { font-size: 14.5px; margin-bottom: 8px; line-height: 1.35; }
            .playground { margin-bottom: 6px; padding: 4px; border-radius: 12px; }
            .pair-note { font-size: 13px; min-height: 1.2em; margin-bottom: 6px; }
            .action-row { margin-bottom: 6px; gap: 6px; }
            .stretch-btn, .reset-btn { min-height: 36px; padding: 6px 14px; font-size: 13px; border-radius: 10px; }
            .opt-group { gap: 6px; margin-bottom: 6px; }
            .opt-btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }
            .footer-action { margin-top: 6px; }
            .check-btn { min-height: 38px; padding: 6px 28px; font-size: 14px; }
            .result-banner { margin-top: 6px; padding: 6px 8px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">忠孝 114-1 期中 · 長度比一比</span>
    </div>

    <div class="stem">比比看，哪一條緞帶比較長？<br><span style="font-size:0.8em;color:#64748b">紅緞帶彎彎曲曲的，不能只看兩端距離喔！</span></div>

    <div class="playground">
        <svg id="ribbonSvg" viewBox="0 0 450 220" role="img" aria-label="彎曲緞帶拉直教具"></svg>
    </div>

    <div class="pair-note" id="pairNote">紅緞帶捲成波浪，兩端看起來好近！把它拉直才知道真正的長度。</div>

    <div class="action-row">
        <button class="stretch-btn" id="stretchBtn" onclick="stretchRibbon()">✨ 拉直緞帶</button>
        <button class="reset-btn" onclick="resetAll()">重來</button>
    </div>

    <div class="opt-group" id="opts"></div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    // 藍緞帶：直線 60→370（長 310）。紅緞帶：波浪 70→240，拉直後 70→410（長 340 ＞ 藍）
    const RIBBON_Y_BLUE = 78, RIBBON_Y_RED = 158;
    const RED_X0 = 70, RED_X_END_WAVY = 240, RED_X_END_STRAIGHT = 410;
    const WAVY_AMP = 44;
    let userAnswer = null;
    const ANSWER_INDEX = 0;
    let stretched = false, animating = false;

    // 波浪路徑：amp 由 WAVY_AMP → 0、右端由 RED_X_END_WAVY → RED_X_END_STRAIGHT 連續內插
    function redPath(t) {
        const amp = WAVY_AMP * (1 - t);
        const xEnd = RED_X_END_WAVY + (RED_X_END_STRAIGHT - RED_X_END_WAVY) * t;
        const span = xEnd - RED_X0;
        const segs = 4, segLen = span / segs;
        let d = `M ${RED_X0} ${RIBBON_Y_RED}`;
        for (let i = 0; i < segs; i++) {
            const dir = (i % 2 === 0) ? -1 : 1;
            const mx = RED_X0 + segLen * (i + 0.5);
            const ex = RED_X0 + segLen * (i + 1);
            d += ` Q ${mx.toFixed(1)} ${(RIBBON_Y_RED + dir * amp).toFixed(1)} ${ex.toFixed(1)} ${RIBBON_Y_RED}`;
        }
        return d;
    }

    function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function stretchRibbon() {
        if (stretched || animating) return;
        animating = true;
        document.getElementById('stretchBtn').disabled = true;
        const path = document.getElementById('redRibbon');
        const t0 = performance.now(), DUR = 900;
        function frame(now) {
            const p = Math.min(1, (now - t0) / DUR);
            const d = redPath(easeInOut(p));
            path.setAttribute('d', d);
            document.getElementById('redRibbonHi').setAttribute('d', d);
            if (p < 1) requestAnimationFrame(frame);
            else {
                stretched = true; animating = false;
                document.getElementById('pairNote').innerHTML =
                    '雖然看起來藍緞帶端點遠，但<span style="color:#e11d48">紅緞帶彎彎曲曲，拉直後更長</span>！✨';
            }
        }
        requestAnimationFrame(frame);
    }

    function resetAll() {
        stretched = false; animating = false;
        document.getElementById('stretchBtn').disabled = false;
        document.getElementById('redRibbon').setAttribute('d', redPath(0));
        document.getElementById('pairNote').innerHTML = '紅緞帶捲成波浪，兩端看起來好近！把它拉直才知道真正的長度。';
    }

    function build() {
        const svg = document.getElementById('ribbonSvg');
        svg.innerHTML = `
            <g pointer-events="none">
                <rect x="0" y="0" width="450" height="220" fill="#fefce8"/>
                <rect x="8" y="58" width="58" height="18" rx="6" fill="#dbeafe"/>
                <text x="37" y="71" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">藍緞帶</text>
                <rect x="8" y="138" width="58" height="18" rx="6" fill="#ffe4e6"/>
                <text x="37" y="151" text-anchor="middle" font-size="11" font-weight="800" fill="#e11d48">紅緞帶</text>
                <circle cx="60" cy="${RIBBON_Y_BLUE}" r="4" fill="#1d4ed8"/>
                <circle cx="370" cy="${RIBBON_Y_BLUE}" r="4" fill="#1d4ed8"/>
            </g>
            <path id="blueRibbon" d="M 60 ${RIBBON_Y_BLUE} L 370 ${RIBBON_Y_BLUE}" fill="none" stroke="#3b82f6" stroke-width="13" stroke-linecap="round"/>
            <path id="blueRibbonHi" d="M 60 ${RIBBON_Y_BLUE - 3} L 370 ${RIBBON_Y_BLUE - 3}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
            <path id="redRibbon" d="${redPath(0)}" fill="none" stroke="#fb7185" stroke-width="13" stroke-linecap="round"/>
            <path id="redRibbonHi" d="" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>`;

        const group = document.getElementById('opts');
        ['紅緞帶比較長', '藍緞帶比較長', '一樣長'].forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = function () {
                group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                userAnswer = idx;
            };
            group.appendChild(btn);
        });
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (userAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '先選一個答案再檢查喔！';
            return;
        }
        if (userAnswer === ANSWER_INDEX) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對！曲線拉直才公平比較：紅緞帶拉直後超出藍緞帶一截 → 紅緞帶比較長！';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '再想想：彎曲的緞帶兩端距離短是假象！按「拉直緞帶」再比一次。';
        }
    }

    build();
</script>

</body>
</html>
