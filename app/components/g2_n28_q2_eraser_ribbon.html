<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-8-Q02 橡皮擦與緞帶長度</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.ruler { text-align: center; }
.ruler-title { font-size: 11px; font-weight: 900; color: #0e7490; letter-spacing: 2px; margin-bottom: 2px; }
.ruler-stage { display: flex; justify-content: center; }
.ruler-line { font-size: 13.5px; font-weight: 900; color: #0e7490; margin-top: 2px; min-height: 17px; }
.flip-btn {
  margin-top: 3px;
  border: 2px solid #0e7490;
  background: var(--bg-card);
  color: #0e7490;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.flip-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #cffafe; color: #0e7490; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card ruler">
    <p class="stem"><small>114-1 永安 期末 五、(2)</small>一塊橡皮擦 6 公分，橡皮擦的 6 倍再多 4 公分，就和緞帶一樣長。緞帶長幾公分？</p>
    <div class="ruler-title">✦ 雙層量尺比對台 ✦</div>
    <div class="ruler-stage" id="ruler-stage"></div>
    <div class="ruler-line" id="ruler-line"></div>
    <div>
      <button type="button" class="flip-btn" id="flip">量出緞帶總長</button>
      <span class="mode-label" id="mode-label">目前：只排橡皮擦</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['40 公分', '36 公分', '24 公分', '64 公分'];
  var ANSWER = 0;
  var picked = -1;
  var revealed = false;

  var stage = document.getElementById('ruler-stage');
  var line = document.getElementById('ruler-line');
  var flipBtn = document.getElementById('flip');
  var modeLabel = document.getElementById('mode-label');

  /* 比例：1 公分 = 7.5px，40cm = 300px */
  function rulerSVG(isRevealed) {
    var s = '<svg width="316" height="148" viewBox="0 0 316 148">';
    /* 上層：6 塊 6cm 橡皮擦並排（36cm = 270px）+ 4cm 綠色緞帶尾端 */
    for (var i = 0; i < 6; i++) {
      var x = 8 + i * 45;
      s += '<rect x="' + x + '" y="18" width="43" height="20" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>';
      s += '<text x="' + (x + 21) + '" y="32" font-size="10" font-weight="900" text-anchor="middle" fill="#7c2d12">6</text>';
    }
    s += '<rect x="278" y="18" width="30" height="20" rx="4" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>';
    s += '<text x="293" y="32" font-size="10" font-weight="900" text-anchor="middle" fill="#14532d">4</text>';
    s += '<text x="150" y="52" font-size="10" font-weight="900" text-anchor="middle" fill="#b45309">橡皮擦的 6 倍（6×6）</text>';
    s += '<text x="293" y="52" font-size="10" font-weight="900" text-anchor="middle" fill="#15803d">再多 4</text>';
    /* 下層：總長度條 */
    if (!isRevealed) {
      s += '<rect x="8" y="70" width="270" height="22" rx="6" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5"/>';
      s += '<rect x="278" y="70" width="30" height="22" rx="6" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="3 2"/>';
      s += '<text x="158" y="85" font-size="11" font-weight="900" text-anchor="middle" fill="#78716c">緞帶總長 = ？公分</text>';
      s += '<text x="158" y="112" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">先算 6 的 6 倍，再多 4 公分</text>';
      s += '<text x="158" y="128" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">兩步驟一起想</text>';
    } else {
      s += '<rect x="8" y="70" width="270" height="22" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>';
      s += '<rect x="278" y="70" width="30" height="22" rx="6" fill="#86efac" stroke="#15803d" stroke-width="1.5"/>';
      s += '<text x="143" y="85" font-size="11" font-weight="900" text-anchor="middle" fill="#7c2d12">6×6＝36</text>';
      s += '<text x="293" y="85" font-size="11" font-weight="900" text-anchor="middle" fill="#14532d">＋4</text>';
      s += '<rect x="8" y="104" width="300" height="16" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>';
      s += '<text x="158" y="116" font-size="11" font-weight="900" text-anchor="middle" fill="#065f46">36＋4＝40（公分）</text>';
      s += '<text x="158" y="138" font-size="11" font-weight="900" text-anchor="middle" fill="#3d3a34">緞帶長 40 公分</text>';
    }
    /* 公分刻度 */
    for (var c = 0; c <= 40; c += 5) {
      s += '<line x1="' + (8 + c * 7.5) + '" y1="60" x2="' + (8 + c * 7.5) + '" y2="66" stroke="#a8a29e" stroke-width="1.5"/>';
    }
    s += '<line x1="8" y1="66" x2="308" y2="66" stroke="#a8a29e" stroke-width="1"/>';
    s += '<text x="299" y="66" font-size="8" font-weight="700" text-anchor="middle" fill="#78716c">40cm</text>';
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = rulerSVG(revealed);
    if (revealed) {
      line.textContent = '先乘：6×6＝36（公分）→ 再加：36＋4＝40';
      modeLabel.textContent = '目前：已量好';
      flipBtn.textContent = '收回量尺';
    } else {
      line.textContent = '6 塊橡皮擦排好，尾端再多 4 公分';
      modeLabel.textContent = '目前：只排橡皮擦';
      flipBtn.textContent = '量出緞帶總長';
    }
  }

  flipBtn.addEventListener('click', function () { revealed = !revealed; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, answer: '', msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！先算 6×6＝36 公分，再多 4 公分：36＋4＝40 公分。';
      return { ok: true, answer: CHOICES[picked] };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：「6 倍再多 4」要兩步做完：先乘 6×6＝36，再加 4，不是只停在 36。';
    return { ok: false, answer: CHOICES[picked] };
  };

  window.__q = { id: 'G2-N-2-8-Q02', correct_index: ANSWER, choices: CHOICES };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
