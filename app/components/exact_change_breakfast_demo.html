<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早餐剛好 46 元</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; color: #1e293b; line-height: 1.4; }
        .pay-zone {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }
        .bank {
            background: #fef9c3;
            border: 2px dashed #ca8a04;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .bank-title { font-size: 0.95rem; font-weight: 800; color: #854d0e; }
        .bank-btn {
            position: relative;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s ease;
            min-width: 46px;
            min-height: 46px;
        }
        .bank-btn:active { transform: scale(0.9); }
        .bank-btn:hover { filter: brightness(1.08); }
        .bank-btn svg { display: block; margin: 0 auto; }
        .bank-btn .plus {
            position: absolute;
            top: -4px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #0f172a;
            color: #fff;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tray {
            background: #f8fafc;
            border: 2px solid #1e293b;
            border-radius: 12px;
            padding: 10px;
            min-height: 110px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 5px;
            justify-content: center;
        }
        .tray .empty-hint { color: #94a3b8; font-size: 0.9rem; align-self: center; }
        .tray-coin { position: relative; cursor: pointer; border-radius: 50%; transition: transform 0.1s ease; }
        .tray-coin:active { transform: scale(0.9); }
        .tray-coin:hover { filter: brightness(0.95); }
        .total-line {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 800;
            color: #334155;
            margin-bottom: 8px;
        }
        .total-line .amount { color: #2563eb; font-size: 1.2rem; }
        .feedback-line {
            min-height: 30px;
            text-align: center;
            font-size: 1.02rem;
            font-weight: 700;
            color: #334155;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 10px;
        }
        .feedback-line.ok { background: #dcfce7; color: #166534; }
        .footer-action { display: flex; justify-content: center; }
        .btn {
            min-height: 42px;
            padding: 8px 24px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-reset { background: #e2e8f0; color: #334155; }
        @media (max-width: 640px) {
            body { padding: 4px 6px; }
            .container { padding: 8px 10px; max-width: 480px; }
            .stem { font-size: 14px; margin-bottom: 6px; }
            .pay-zone { grid-template-columns: 96px 1fr; gap: 6px; margin-bottom: 6px; }
            .bank { padding: 6px 4px; gap: 6px; }
            .bank-title { font-size: 12.5px; }
            .bank-btn svg { width: 38px !important; height: 38px !important; }
            .tray { min-height: 96px; padding: 6px; gap: 4px; }
            .tray-coin svg { width: 30px !important; height: 30px !important; }
            .tray .empty-hint { font-size: 12px; }
            .total-line { font-size: 14px; margin-bottom: 6px; }
            .total-line .amount { font-size: 16px; }
            .feedback-line { font-size: 13px; min-height: 26px; margin-bottom: 8px; }
            .btn { min-height: 38px; padding: 6px 18px; font-size: 13.5px; }
        }
    </style>
</head>
<body>
<!-- 共用漸層定義 -->
<svg width="0" height="0" style="position:absolute">
    <defs>
        <radialGradient id="cg10" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffe9a8"/>
            <stop offset="70%" stop-color="#e6b23c"/>
            <stop offset="100%" stop-color="#c98f1d"/>
        </radialGradient>
        <radialGradient id="cg1" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="70%" stop-color="#cbd5e1"/>
            <stop offset="100%" stop-color="#94a3b8"/>
        </radialGradient>
    </defs>
</svg>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">忠孝 114-2 期末</span>
    </div>

    <div class="stem">我今天的早餐花了 46 元。怎麼付錢才會剛好？用 10 元和 1 元付付看。</div>

    <div class="pay-zone">
        <div class="bank">
            <div class="bank-title">硬幣庫</div>
            <button class="bank-btn" id="addTen" title="放 1 個 10 元進托盤">
                <svg width="44" height="44" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="19" fill="url(#cg10)" stroke="#8a6a1c" stroke-width="2"/>
                    <circle cx="20" cy="20" r="13.5" fill="none" stroke="#8a6a1c" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
                    <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6b5210">10</text>
                </svg>
                <span class="plus">＋</span>
            </button>
            <button class="bank-btn" id="addOne" title="放 1 個 1 元進托盤">
                <svg width="44" height="44" viewBox="0 0 40 40">
                    <circle cx="20" cy="20" r="19" fill="url(#cg1)" stroke="#64748b" stroke-width="2"/>
                    <circle cx="20" cy="20" r="13.5" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
                    <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">1</text>
                </svg>
                <span class="plus">＋</span>
            </button>
        </div>
        <div class="tray" id="tray"><div class="empty-hint">點左邊硬幣庫，把錢放進托盤</div></div>
    </div>

    <div class="total-line">托盤合計：　<span class="amount" id="totalAmt">0</span>　元</div>
    <div class="feedback-line" id="feedback">目標：剛好 46 元</div>

    <div class="footer-action">
        <button class="btn btn-reset" onclick="resetAll()">🔄 重置</button>
    </div>
    <div class="result-banner" id="resultBanner" style="margin-top:8px;padding:8px 10px;border-radius:10px;text-align:center;font-weight:700;font-size:0.98rem;display:none;"></div>
</div>

<script>
    const TARGET = 46;
    let count10 = 0, count1 = 0;

    const tenSvg = `<svg width="34" height="34" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="19" fill="url(#cg10)" stroke="#8a6a1c" stroke-width="2"/>
        <circle cx="20" cy="20" r="13.5" fill="none" stroke="#8a6a1c" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
        <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6b5210">10</text>
    </svg>`;
    const oneSvg = `<svg width="34" height="34" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="19" fill="url(#cg1)" stroke="#64748b" stroke-width="2"/>
        <circle cx="20" cy="20" r="13.5" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
        <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">1</text>
    </svg>`;

    function renderTray() {
        const tray = document.getElementById('tray');
        tray.innerHTML = '';
        if (count10 === 0 && count1 === 0) {
            tray.innerHTML = '<div class="empty-hint">點左邊硬幣庫，把錢放進托盤</div>';
            return;
        }
        for (let i = 0; i < count10; i++) {
            const d = document.createElement('div');
            d.className = 'tray-coin';
            d.title = '點一下收回 10 元';
            d.innerHTML = tenSvg;
            d.onclick = function () { count10--; update(); };
            tray.appendChild(d);
        }
        for (let i = 0; i < count1; i++) {
            const d = document.createElement('div');
            d.className = 'tray-coin';
            d.title = '點一下收回 1 元';
            d.innerHTML = oneSvg;
            d.onclick = function () { count1--; update(); };
            tray.appendChild(d);
        }
    }

    function update() {
        renderTray();
        const total = count10 * 10 + count1;
        document.getElementById('totalAmt').innerText = total;
        const fb = document.getElementById('feedback');
        const banner = document.getElementById('resultBanner');
        fb.classList.remove('ok');
        banner.className = '';
        banner.style.display = 'none';
        if (total === 0) {
            fb.innerText = '目標：剛好 46 元';
            return;
        }
        if (total < TARGET) {
            fb.innerText = `現在 ${total} 元，還差 ${TARGET - total} 元才到 46 元`;
        } else if (total > TARGET) {
            fb.innerText = `現在 ${total} 元，比 46 元多了 ${total - TARGET} 元，付太多了！`;
        } else {
            fb.classList.add('ok');
            fb.innerText = `🎉 剛好 46 元（${count10} 個 10 元、${count1} 個 1 元）！`;
            banner.style.display = 'block';
            banner.style.background = '#dcfce7';
            banner.style.color = '#166534';
            banner.innerText = '🎉 剛好 46 元！' + (count10 === 4 && count1 === 6 ? '（4 個 10 元＋6 個 1 元，最聰明的付法）' : `（${count10} 個 10 元、${count1} 個 1 元，也是剛好！）`);
        }
    }

    function resetAll() {
        count10 = 0;
        count1 = 0;
        update();
    }

    document.getElementById('addTen').onclick = function () { count10++; update(); };
    document.getElementById('addOne').onclick = function () { count1++; update(); };
    update();
</script>
</body>
</html>
