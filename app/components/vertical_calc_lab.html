<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3-N-3-2 加減直式計算教具</title>
    <style>
        :root {
            --bg: #fff9f0;
            --card: #ffffff;
            --coral: #ff8a65;
            --mint: #7bc9b2;
            --lemon: #ffd166;
            --sky: #7db8e8;
            --text-dark: #333;
            --success: #7bc9b2;
            --error: #e57373;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 6px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            height: auto;
            min-height: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 100%;
            height: auto;
            min-height: auto;
            background: transparent;
            border: none;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .header {
            font-size: 11px;
            color: #b0a08a;
            text-align: center;
            margin: 0;
            letter-spacing: 1px;
        }
        .question-box {
            background: var(--card);
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            color: var(--text-dark);
            min-height: 44px;
            display: flex;
            align-items: center;
            box-shadow: 0 6px 18px rgba(149,117,76,0.10);
            border-left: 4px solid var(--coral);
        }
        .calc-card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(149,117,76,0.10);
            padding: 6px 8px;
        }
        .calc-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            width: 100%;
            max-width: 260px;
            height: auto;
            display: block;
        }
        .digit { font-size: 24px; font-weight: 600; fill: var(--text-dark); font-family: 'Courier New', Courier, monospace; }
        .op { font-size: 22px; fill: var(--text-dark); }
        .carry { font-size: 13px; fill: var(--coral); font-weight: bold; }
        .borrow { font-size: 12px; fill: var(--error); font-weight: bold; }
        .slash { stroke: var(--error); stroke-width: 2; stroke-linecap: round; }
        .line { stroke: var(--text-dark); stroke-width: 2; stroke-linecap: round; }
        .grid-line { stroke: #e8ddcc; stroke-width: 1; stroke-dasharray: 2 3; }
        .glow { filter: drop-shadow(0 0 2px rgba(255,138,101,0.8)); }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .step-btn, .check-btn {
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 3px 10px rgba(149,117,76,0.18);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .step-btn { background: linear-gradient(135deg, var(--coral), #ff9e85); }
        .check-btn { background: linear-gradient(135deg, var(--mint), #93d8c4); }
        .step-btn:active, .check-btn:active { transform: scale(0.95) translateY(1px); box-shadow: 0 1px 4px rgba(149,117,76,0.18); }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .opt-btn {
            height: 36px;
            border: 2px solid #f0e6d8;
            background: var(--card);
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(149,117,76,0.08);
        }
        .opt-btn:active { transform: scale(0.96); }
        .opt-btn.selected { border-color: var(--coral); background: #fff3ec; }

        .feedback {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 22px;
            border-radius: 999px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .success { background: var(--mint); }
        .fail { background: var(--error); }
    </style>
</head>
<body>

<div id="app">
    <div class="header">臺北市內湖國小段考真題</div>
    <div class="question-box" id="qText">載入中...</div>

    <div class="calc-card">
        <div class="calc-area" id="calc-area">
            <svg id="svgCanvas" viewBox="0 0 240 180">
                <!-- Grid Lines -->
                <line x1="40" y1="10" x2="40" y2="170" class="grid-line" />
                <line x1="85" y1="10" x2="85" y2="170" class="grid-line" />
                <line x1="130" y1="10" x2="130" y2="170" class="grid-line" />
                <line x1="175" y1="10" x2="175" y2="170" class="grid-line" />
                <line x1="220" y1="10" x2="220" y2="170" class="grid-line" />

                <!-- Labels -->
                <text x="50" y="15" font-size="8" fill="#b0a08a">千</text>
                <text x="95" y="15" font-size="8" fill="#b0a08a">百</text>
                <text x="140" y="15" font-size="8" fill="#b0a08a">十</text>
                <text x="185" y="15" font-size="8" fill="#b0a08a">個</text>

                <g id="drawLayer"></g>
            </svg>
        </div>
    </div>

    <div class="controls">
        <button class="step-btn" onclick="nextStep()">一步一步看算理 ▶</button>
        <div class="options-grid" id="options"></div>
        <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
    </div>

    <div id="feedback" class="feedback"></div>
</div>

<script>
    const questions = {
        1: { q: "用直式算算看：5319 ＋ 806 ＝ ( ? )", n1: 5319, n2: 806, op: '+', ans: 6125 },
        2: { q: "用直式算算看：2015 － 207 ＝ ( ? )", n1: 2015, n2: 207, op: '-', ans: 1808 },
        3: { q: "用直式算算看：3397 ＋ 1826 ＝ ( ? )", n1: 3397, n2: 1826, op: '+', ans: 5223 },
        4: { q: "用直式算算看：4000 － 1368 ＝ ( ? )", n1: 4000, n2: 1368, op: '-', ans: 2632 },
        5: { q: "用直式算算看：3677 ＋ 4189 ＝ ( ? )", n1: 3677, n2: 4189, op: '+', ans: 7866 },
        6: { q: "用直式算算看：7800 － 4831 ＝ ( ? )", n1: 7800, n2: 4831, op: '-', ans: 2969 },
        7: { q: "演唱會的門票，第一週賣出了 7406 張票，第二週比第一週多賣了 1193 張，第二週賣出了幾張票？", n1: 7406, n2: 1193, op: '+', ans: 8599 },
        8: { q: "一本小說有 1022 頁，姐姐已經看了 237 頁，還剩下幾頁沒有看？", n1: 1022, n2: 237, op: '-', ans: 785 },
        9: { q: "一件上衣 1399 元，一件褲子比上衣貴 1200 元，一件褲子是多少元？", n1: 1399, n2: 1200, op: '+', ans: 2599 },
        10: { q: "皮卡丘玩偶一個 1200 元，比一個卡比獸玩偶便宜 300 元，一個卡比獸玩偶是多少元？", n1: 1200, n2: 300, op: '+', ans: 1500 }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const qId = urlParams.get('q') || 1;
    const currentQ = questions[qId];
    let currentStep = 0;
    let selectedAns = null;

    function init() {
        document.getElementById('qText').innerText = currentQ.q;
        renderOptions();
        renderCalc();
    }

    function renderOptions() {
        const container = document.getElementById('options');
        const choices = [currentQ.ans, currentQ.ans + 10, currentQ.ans - 1, currentQ.ans + 100].sort(() => Math.random() - 0.5);
        container.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = c;
            btn.onclick = () => {
                selectedAns = c;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            container.appendChild(btn);
        });
    }

    function getDigits(num) {
        return num.toString().padStart(4, '0').split('').map(Number);
    }

    function renderCalc() {
        const layer = document.getElementById('drawLayer');
        layer.innerHTML = '';
        const d1 = getDigits(currentQ.n1);
        const d2 = getDigits(currentQ.n2);
        const res = getDigits(currentQ.ans);
        const xPos = [55, 100, 145, 190];

        // Operator
        layer.innerHTML += `<text x="15" y="105" class="op">${currentQ.op}</text>`;
        layer.innerHTML += `<line x1="10" y1="120" x2="230" y2="120" class="line" />`;

        // Numbers
        for(let i=0; i<4; i++) {
            // Num 1
            layer.innerHTML += `<text x="${xPos[i]}" y="70" class="digit">${d1[i]}</text>`;
            // Num 2
            if (currentQ.n2.toString().padStart(4, ' ')[i] !== ' ') {
                layer.innerHTML += `<text x="${xPos[i]}" y="105" class="digit">${d2[i]}</text>`;
            }
            // Result (Step based)
            if (currentStep > (3-i)) {
                layer.innerHTML += `<text x="${xPos[i]}" y="155" class="digit" style="fill:var(--mint)">${res[i]}</text>`;
            }
        }

        // Logic Visuals (Carry/Borrow)
        if (currentQ.op === '+') {
            let carry = 0;
            for (let i=3; i>=0; i--) {
                let sum = d1[i] + d2[i] + carry;
                if (currentStep > (3-i) && sum >= 10 && i > 0) {
                    layer.innerHTML += `<text x="${xPos[i-1]}" y="35" class="carry glow">①</text>`;
                    carry = 1;
                } else {
                    carry = 0;
                }
            }
        } else {
            // Subtraction Borrowing Logic
            let tempD1 = [...d1];
            for (let i=3; i>=0; i--) {
                if (currentStep > (3-i)) {
                    if (tempD1[i] < d2[i]) {
                        // Need borrow
                        let j = i - 1;
                        while (tempD1[j] === 0 && j >= 0) j--;
                        if (j >= 0) {
                            // Slash the source
                            layer.innerHTML += `<line x1="${xPos[j]}" y1="70" x2="${xPos[j]+20}" y2="50" class="slash" />`;
                            layer.innerHTML += `<text x="${xPos[j]}" y="45" class="borrow">${tempD1[j]-1}</text>`;

                            // Fill intermediate zeros
                            for (let k = j + 1; k < i; k++) {
                                layer.innerHTML += `<line x1="${xPos[k]}" y1="70" x2="${xPos[k]+20}" y2="50" class="slash" />`;
                                layer.innerHTML += `<text x="${xPos[k]}" y="45" class="borrow">9</text>`;
                                tempD1[k] = 9;
                            }
                            // Add 10 to current
                            layer.innerHTML += `<text x="${xPos[i]}" y="45" class="borrow">10</text>`;
                            tempD1[j]--;
                        }
                    }
                }
            }
        }
    }

    function nextStep() {
        currentStep = (currentStep + 1) % 6;
        if (currentStep === 5) currentStep = 0;
        renderCalc();
    }

    function checkAnswer() {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        if (selectedAns === currentQ.ans) {
            fb.innerText = "太棒了！計算正確";
            fb.className = "feedback success";
            currentStep = 4;
            renderCalc();
        } else {
            fb.innerText = "再試試看喔！";
            fb.className = "feedback fail";
        }
        setTimeout(() => fb.style.display = 'none', 2000);
    }

    init();
</script>

</body>
</html>
