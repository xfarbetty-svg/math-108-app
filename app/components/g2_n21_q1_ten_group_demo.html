<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-1-Q01 數字卡排最大三位數</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint: #7bc9b2;
  --mint-deep: #318a70;
  --lemon: #ffd166;
  --coral: #ff8a65;
  --sky: #4ea8de;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 14px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

/* 數字卡展示區 */
.cards-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px 4px;
}
.source-cards {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.num-card {
  width: 42px;
  height: 52px;
  background: #fff;
  border: 2px solid var(--sky);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 900;
  color: #1d3557;
  box-shadow: 0 3px 8px rgba(78, 168, 222, 0.18);
}
.arrow-down {
  font-size: 11px;
  font-weight: 800;
  color: var(--mint-deep);
  background: #eafaf4;
  padding: 2px 10px;
  border-radius: 999px;
}
.board-slots {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.slot {
  width: 60px;
  height: 64px;
  background: #fdfbf7;
  border: 2px dashed #d5cbbe;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.slot.filled {
  border-style: solid;
  border-color: var(--mint-deep);
  background: #f0fdf9;
}
.slot-tag {
  font-size: 10px;
  font-weight: 800;
  color: var(--ink-soft);
  margin-bottom: 1px;
}
.slot-val {
  font-size: 24px;
  font-weight: 900;
  color: var(--mint-deep);
}

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>113-1 內湖 期中 一、1 (高階思維)</small>用「3」、「0」、「8」三張數字卡，排出的「最大三位數」是多少？</p>
  </div>
  <div class="card cards-stage">
    <div class="source-cards">
      <div class="num-card">3</div>
      <div class="num-card">0</div>
      <div class="num-card">8</div>
    </div>
    <div class="arrow-down" id="arrow-hint">排排看：點選下方選項放入定位板</div>
    <div class="board-slots">
      <div class="slot" id="slot-box-h">
        <span class="slot-tag">百位</span>
        <span class="slot-val" id="slot-h">?</span>
      </div>
      <div class="slot" id="slot-box-t">
        <span class="slot-tag">十位</span>
        <span class="slot-val" id="slot-t">?</span>
      </div>
      <div class="slot" id="slot-box-u">
        <span class="slot-tag">個位</span>
        <span class="slot-val" id="slot-u">?</span>
      </div>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['830', '803', '380', '308'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');

  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      // 動態更新卡牌槽展示選擇的數字
      if (c === '830') { setSlots('8', '3', '0'); }
      else if (c === '803') { setSlots('8', '0', '3'); }
      else if (c === '380') { setSlots('3', '8', '0'); }
      else if (c === '308') { setSlots('3', '0', '8'); }
      hide();
    });
    optBox.appendChild(b);
  });

  function setSlots(h, t, u) {
    document.getElementById('slot-h').textContent = h;
    document.getElementById('slot-t').textContent = t;
    document.getElementById('slot-u').textContent = u;
    document.getElementById('slot-box-h').classList.add('filled');
    document.getElementById('slot-box-t').classList.add('filled');
    document.getElementById('slot-box-u').classList.add('filled');
    document.getElementById('arrow-hint').textContent = '你排出的數是：' + h + t + u;
  }

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！要排最大三位數，百位要放最大的 8，十位放次大的 3，個位放 0，得到 830。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：要想數字最大，百位必須放這三個數字中最大的那一個！';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-1-Q01', answer: ANSWER };
})();
</script>
</body>
</html>
