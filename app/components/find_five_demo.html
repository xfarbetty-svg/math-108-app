<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>把答案是 5 的圈起來</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #f0fdf4;
            color: #0f172a;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #86efac;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; color: #1e293b; }
        .stem-sub { font-size: 1.02rem; font-weight: 700; color: #475569; margin-bottom: 16px; }
        .chip-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        @media (max-width: 640px) { .chip-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        .chip-wrap { position: relative; }
        .chip {
            width: 100%;
            min-height: 64px;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #334155;
            cursor: pointer;
            position: relative;
            z-index: 1;
            transition: transform 0.1s ease;
        }
        .chip:active { transform: scale(0.95); }
        .chip .chip-ans {
            position: absolute;
            top: 4px;
            right: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #64748b;
            display: none;
        }
        .chip.show-ans .chip-ans { display: block; }
        .lasso {
            position: absolute;
            inset: -7px -9px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 2;
        }
        .chip-wrap.circled .lasso { opacity: 1; }
        .chip-wrap.circled .chip { border-color: #16a34a; background: #f0fdf4; }
        .toolbar { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .hint-btn {
            min-height: 44px;
            background: #ffffff;
            border: 2px solid #86efac;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #15803d;
            cursor: pointer;
            padding: 8px 16px;
        }
        .clear-btn {
            min-height: 44px;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 800;
            color: #475569;
            cursor: pointer;
            padding: 8px 16px;
        }
        .count-line { text-align: center; font-size: 1.05rem; font-weight: 700; color: #15803d; margin-bottom: 14px; min-height: 1.6em; }
        .footer-action { display: flex; justify-content: center; margin-top: 6px; }
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-banner {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">忠孝 114-1 期末 六、把答案是 5 的圈起來</span>
    </div>

    <div class="stem">把答案是 5 的算式圈起來</div>
    <div class="stem-sub">先心算每個算式的答案，等於 5 的點一下圈起來（共有 5 個）</div>

    <div class="chip-grid" id="chips"></div>

    <div class="toolbar">
        <button class="hint-btn" id="hintBtn" onclick="toggleAns()">🔍 逐題算算看（提示）</button>
        <button class="clear-btn" onclick="clearAll()">🧽 全部擦掉重圈</button>
    </div>

    <div class="count-line" id="countLine">你圈了 0 個，目標是圈 5 個。</div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    // 真題（六、把答案是 5 的圈起來 10%）：10 個算式，恰好 5 個答案是 5
    const EXPRS = [
        { text: '7 - 3',   ans: 4 },
        { text: '2 + 4',   ans: 6 },
        { text: '9 - 7',   ans: 2 },
        { text: '0 + 5',   ans: 5 },
        { text: '4 + 1',   ans: 5 },
        { text: '10 - 5',  ans: 5 },
        { text: '8 - 3',   ans: 5 },
        { text: '1 + 7',   ans: 8 },
        { text: '10 - 10', ans: 0 },
        { text: '6 - 1',   ans: 5 }
    ];
    const CORRECT = new Set([3, 4, 5, 6, 9]); // 0+5、4+1、10-5、8-3、6-1
    const lassoSvg = `
    <svg class="lasso" viewBox="0 0 100 60" preserveAspectRatio="none">
        <ellipse cx="50" cy="30" rx="46" ry="25" fill="none" stroke="#16a34a" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="240 40" transform="rotate(-4 50 30)"/>
    </svg>`;

    const selected = new Set();
    let ansShown = false;

    function build() {
        const wrap = document.getElementById('chips');
        EXPRS.forEach((e, i) => {
            const cell = document.createElement('div');
            cell.className = 'chip-wrap';
            cell.innerHTML = `
                <button class="chip" id="chip-${i}">${e.text}<span class="chip-ans">＝${e.ans}</span></button>
                ${lassoSvg}`;
            cell.onclick = () => toggle(i);
            wrap.appendChild(cell);
        });
    }

    function toggle(i) {
        const cell = document.querySelectorAll('.chip-wrap')[i];
        if (selected.has(i)) { selected.delete(i); cell.classList.remove('circled'); }
        else { selected.add(i); cell.classList.add('circled'); }
        document.getElementById('countLine').innerText =
            '你圈了 ' + selected.size + ' 個，目標是圈 5 個。';
        document.getElementById('resultBanner').className = 'result-banner';
    }

    function toggleAns() {
        ansShown = !ansShown;
        document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('show-ans', ansShown));
        document.getElementById('hintBtn').innerText = ansShown ? '🙈 把答案收起來' : '🔍 逐題算算看（提示）';
    }

    function clearAll() {
        selected.clear();
        document.querySelectorAll('.chip-wrap').forEach((c) => c.classList.remove('circled'));
        document.getElementById('countLine').innerText = '你圈了 0 個，目標是圈 5 個。';
        document.getElementById('resultBanner').className = 'result-banner';
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (selected.size === 0) {
            banner.className = 'result-banner fail';
            banner.innerText = '先算一算，把答案是 5 的算式點一下圈起來！';
            return;
        }
        const wrong = [...selected].filter((i) => !CORRECT.has(i));
        const missed = [...CORRECT].filter((i) => !selected.has(i));
        if (wrong.length === 0 && missed.length === 0) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 全對！答案是 5 的正好 5 個：0＋5、4＋1、10－5、8－3、6－1！';
        } else {
            banner.className = 'result-banner fail';
            let msg = '再檢查一遍：';
            if (missed.length) msg += '還有 ' + missed.length + ' 個答案是 5 的沒圈到；';
            if (wrong.length) msg += '有 ' + wrong.length + ' 個圈錯了（它們的答案不是 5）；';
            msg += '每個算式都要先算出答案再決定喔！';
            banner.innerText = msg;
        }
    }

    build();
</script>

</body>
</html>
