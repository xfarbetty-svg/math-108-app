<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-7-Q04 飛鏢同心圓乘法盤</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.wheel { text-align: center; }
.wheel-title { font-size: 11px; font-weight: 900; color: #be185d; letter-spacing: 2px; margin-bottom: 2px; }
.wheel-stage { display: flex; justify-content: center; }
.prod-line { font-size: 13px; font-weight: 900; color: #be185d; margin-top: 2px; min-height: 16px; }
.dart-btn {
  margin-top: 3px;
  border: 2px solid #be185d;
  background: #fff;
  color: #be185d;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.dart-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #fce7f3; color: #be185d; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 5px 6px;
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
.fade { transition: opacity 0.25s ease-out; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card wheel">
    <p class="stem"><small>111-1 內湖 期末 三、6</small>完成乘法表：中間的數是 7，乘以第二圈的數（3, 6, 8, 9），等於最外圈的數。</p>
    <div class="wheel-title">✦ 飛鏢同心圓乘法盤 ✦</div>
    <div class="wheel-stage" id="wheel-stage"></div>
    <div class="prod-line" id="prod-line"></div>
    <div>
      <button type="button" class="dart-btn" id="dart">飛鏢發射！</button>
      <span class="mode-label" id="mode-label">目前：待射擊</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['21、42、56、63', '21、42、54、63', '14、42、56、70', '21、36、56、63'];
  var ANSWER = 0;
  var picked = -1;
  var revealed = false;

  var stage = document.getElementById('wheel-stage');
  var prodLine = document.getElementById('prod-line');
  var dartBtn = document.getElementById('dart');
  var modeLabel = document.getElementById('mode-label');

  /* 同心圓三層：中心 7，中圈 3/6/8/9，外圈 21/42/56/63（四象限） */
  var MID = [3, 6, 8, 9];
  var OUT = [21, 42, 56, 63];
  var COLORS = ['#fca5a5', '#fcd34d', '#86efac', '#93c5fd'];
  var LIGHT = ['#fee2e2', '#fef9c3', '#dcfce7', '#dbeafe'];

  function polar(cx, cy, r, deg) {
    var rad = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  function sectorPath(cx, cy, r0, r1, a0, a1) {
    var p1 = polar(cx, cy, r1, a0), p2 = polar(cx, cy, r1, a1);
    var p3 = polar(cx, cy, r0, a1), p4 = polar(cx, cy, r0, a0);
    var large = (a1 - a0) > 180 ? 1 : 0;
    return 'M ' + p1[0] + ' ' + p1[1] +
      ' A ' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + p2[0] + ' ' + p2[1] +
      ' L ' + p3[0] + ' ' + p3[1] +
      ' A ' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + p4[0] + ' ' + p4[1] + ' Z';
  }
  function wheelSVG(isRevealed) {
    var cx = 84, cy = 75, s = '<svg width="168" height="156" viewBox="0 0 168 156">';
    for (var k = 0; k < 4; k++) {
      var a0 = -45 + k * 90, a1 = a0 + 90, mid = a0 + 45;
      s += '<path d="' + sectorPath(cx, cy, 48, 73, a0, a1) + '" fill="' + LIGHT[k] + '" stroke="#e5e0d5" stroke-width="1"/>';
      var mMid = polar(cx, cy, 61, mid);
      s += '<text class="fade" x="' + mMid[0] + '" y="' + (mMid[1] + 4) + '" font-size="12.5" font-weight="900" text-anchor="middle" fill="#9a3412" opacity="' + (isRevealed ? 1 : 0) + '">' + OUT[k] + '</text>';
      s += '<text class="fade" x="' + mMid[0] + '" y="' + (mMid[1] + 4) + '" font-size="12.5" font-weight="900" text-anchor="middle" fill="#c084fc" opacity="' + (isRevealed ? 0 : 1) + '">?</text>';
      var mIn = polar(cx, cy, 33, mid);
      s += '<path d="' + sectorPath(cx, cy, 18, 48, a0, a1) + '" fill="' + COLORS[k] + '" stroke="#fff" stroke-width="1.5"/>';
      s += '<text x="' + mIn[0] + '" y="' + (mIn[1] + 4.5) + '" font-size="13" font-weight="900" text-anchor="middle" fill="#1e3a5f">' + MID[k] + '</text>';
    }
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="17" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>';
    s += '<text x="' + cx + '" y="' + (cy + 5.5) + '" font-size="15" font-weight="900" text-anchor="middle" fill="#7c2d12">7</text>';
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = wheelSVG(revealed);
    if (revealed) {
      prodLine.textContent = '7×3＝21、7×6＝42、7×8＝56、7×9＝63';
      modeLabel.textContent = '目前：已命中';
      dartBtn.textContent = '收回飛鏢';
    } else {
      prodLine.textContent = '中圈 × 中心 7 ＝ 外圈？';
      modeLabel.textContent = '目前：待射擊';
      dartBtn.textContent = '飛鏢發射！';
    }
  }

  dartBtn.addEventListener('click', function () { revealed = !revealed; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！外圈每一格都是「7 × 中圈數」：21、42、56、63。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：外圈每格都是 7 的倍數——54 不是 7 的倍數（7×8＝56）、14 和 70 的中圈數不在 3、6、8、9 裡、36 也不是 7 的倍數。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-7-Q04', answer: ANSWER };

  render();
})();
</script>
</body>
</html>
