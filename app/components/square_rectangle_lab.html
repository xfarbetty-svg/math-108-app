<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S-3-2 正方形與長方形實驗室（真題題幹圖）</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
  :root {
    --paper: #fdfbf7; --ink: #3d3a34; --line: #4b4a46; --muted: #8a857b;
    --fill-a: #fff3d6; --fill-b: #e2f0fb; --fill-c: #f3e3f7; --grid: #b9c4cf;
    --accent: #f4694b; --tool: rgba(255,255,255,.82);
  }
  html[data-theme="dark"] {
    --paper: var(--bg-main); --ink: var(--text-primary); --line: var(--svg-stroke);
    --muted: var(--text-secondary); --fill-a: #33404f; --fill-b: #243b50; --fill-c: #3b3348;
    --grid: #475569; --accent: var(--accent-primary); --tool: rgba(31,39,54,.85);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; width:100%; max-width:390px; height:420px; overflow:hidden; }
  body { font-family:"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--paper); color:var(--ink); }
  #app { width:100%; max-width:390px; height:420px; background:var(--paper); display:flex; flex-direction:column; overflow:hidden; }
  .topbar { height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
            padding:0 12px; background:var(--bg-elevated); border-bottom:1px solid var(--border-color); }
  .topbar .name { font-size:12px; font-weight:700; color:var(--ink); }
  .topbar .qtag { font-size:11px; font-weight:700; color:var(--accent); border:1px solid var(--accent);
                  border-radius:9px; padding:1px 7px; }
  .scene { position:relative; flex:1; width:100%; max-width:390px; height:352px; overflow:hidden; }
  .scene svg { display:block; width:100%; max-width:390px; height:340px; }
  .scene .cap { font-size:12px; fill:var(--ink); font-weight:700; }
  .scene .lbl { font-size:12px; fill:var(--ink); font-weight:700; }
  .scene .dim { font-size:11px; fill:var(--muted); }
  .scene .shape { cursor:pointer; }
  .scene .shape.marked { stroke:var(--accent); stroke-width:4; }
  .scene .tick { opacity:0; stroke:var(--accent); stroke-width:2.5; }
  .scene .shape.marked .tick { opacity:1; }
  /* 可拖曳量具：直尺刻度 + 直角探针（真實 pointer 事件） */
  #tool { position:absolute; right:8px; bottom:12px; width:176px; height:44px; touch-action:none;
          cursor:grab; user-select:none; z-index:20; }
  #tool:active { cursor:grabbing; }
  #tool .bar { position:absolute; left:14px; bottom:0; width:162px; height:20px;
               background:var(--tool); border:2px solid var(--line); border-radius:2px;
               background-image:repeating-linear-gradient(90deg,transparent 0 39px,var(--line) 39px 41px); }
  #tool .arm { position:absolute; left:14px; bottom:0; width:18px; height:44px;
               background:var(--tool); border:2px solid var(--line); border-radius:2px; }
  #tool .cap { position:absolute; left:36px; bottom:-1px; font-size:8px; color:var(--muted); }
  .footer { height:34px; flex:none; display:flex; align-items:center; justify-content:space-between;
            padding:0 10px; background:var(--bg-elevated); border-top:1px solid var(--border-color); }
  .footer .hint { font-size:10px; color:var(--muted); max-width:300px; }
  .footer .info { font-size:10px; color:var(--accent); font-weight:700; }

/* G3 窄屏_one-screen 收斂 */
#q-badge, #q-focus, .q-badge, .q-focus, .qtag, #qtag {
  max-width: calc(100% - 16px) !important; right: 8px !important; box-sizing: border-box !important;
  white-space: normal !important; overflow-wrap: anywhere !important;
}
svg text { max-width: 100%; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><span class="name">S-3-2 正方形和長方形</span><span class="qtag" id="qtag">Q01</span></div>
  <div class="scene" id="scene">
    <div id="tool" title="可拖曳的直尺與直角量具">
      <div class="arm"></div><div class="bar"></div><div class="cap">0　1　2　3　4 cm</div>
    </div>
  </div>
  <div class="footer"><span class="hint" id="hint"></span><span class="info" id="info">拖曳量具・點選圖形</span></div>
</div>

<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const qNum = (() => { const n = parseInt(params.get('q'), 10); return n >= 1 && n <= 10 ? n : 1; })();
  const theme = params.get('theme');
  if (theme === 'dark' || theme === 'light') {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('math108_theme', theme); } catch (e) {}
  } else {
    try { document.documentElement.dataset.theme = localStorage.getItem('math108_theme') || 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });

  function poly(points, fill, cls) {
    return '<polygon class="shape ' + (cls || '') + '" points="' + points + '" fill="' + (fill || 'none') +
           '" stroke="var(--line)" stroke-width="2.5" stroke-linejoin="round"/>';
  }
  function rect(x, y, w, h, fill, cls, rx) {
    return '<rect class="shape ' + (cls || '') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h +
           '" rx="' + (rx || 0) + '" fill="' + (fill || 'none') + '" stroke="var(--line)" stroke-width="2.5"/>';
  }
  function text(x, y, str, cls, anchor) {
    return '<text x="' + x + '" y="' + y + '" class="' + (cls || 'lbl') + '" text-anchor="' + (anchor || 'middle') + '">' + str + '</text>';
  }
  function ticks(x, y, w, h) {
    return '<line class="tick" x1="' + (x + w / 2 - 6) + '" y1="' + (y - 3) + '" x2="' + (x + w / 2 + 6) + '" y2="' + (y - 3) + '"/>' +
           '<line class="tick" x1="' + (x + w / 2 - 6) + '" y1="' + (y + h + 3) + '" x2="' + (x + w / 2 + 6) + '" y2="' + (y + h + 3) + '"/>';
  }
  const wrap = (inner) => '<svg viewBox="0 0 390 340" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';

  const scenes = {
    1: () => wrap([
      text(195, 26, '題目：只要 4 個邊都一樣長，就一定是正方形嗎？', 'cap'),
      poly('100,86 174,170 100,254 26,170', 'var(--fill-a)', 'mark'),
      poly('244,110 340,110 340,230 244,230', 'var(--fill-b)', 'mark'),
      text(100, 284, '圖形甲', 'lbl'), text(292, 284, '圖形乙', 'lbl'),
      text(195, 312, '點選圖形，再用直尺與直角量具比一比', 'dim')
    ].join('')),
    2: () => wrap([
      text(195, 24, '先找出只有 4 個邊的圖形，再用三角板和直尺量一量', 'cap'),
      poly('26,74 102,68 108,132 32,138', 'var(--fill-b)', 'mark'), text(67, 158, 'ㄅ', 'lbl'),
      poly('195,64 240,100 195,136 150,100', 'var(--fill-c)', 'mark'), text(195, 158, 'ㄆ', 'lbl'),
      poly('292,72 362,72 376,136 278,136', 'var(--fill-b)', 'mark'), text(327, 158, 'ㄇ', 'lbl'),
      rect(100, 196, 60, 60, 'var(--fill-c)', 'mark'), text(130, 280, 'ㄈ', 'lbl'),
      poly('254,196 294,196 314,226 294,256 254,256 234,226', 'var(--fill-b)', 'mark'), text(274, 280, 'ㄉ', 'lbl'),
      text(195, 312, '(1) 有直角 (2) 每邊等長 (3) 正方形 (4) 長方形 — 整組一起看', 'dim')
    ].join('')),
    3: () => gridScene('在 1cm 方格紙上畫一個邊長 4 公分的正方形'),
    4: () => gridScene('在 1cm 方格紙上畫一個長 5 公分、寬 3 公分的長方形'),
    5: () => wrap([
      text(195, 26, '題目：正方形海報紙四邊總共長 160 公分', 'cap'),
      rect(115, 88, 160, 160, 'var(--fill-a)', 'mark'),
      '<rect x="100" y="72" width="190" height="190" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 5"/>',
      text(195, 62, '四邊總長 160 公分', 'lbl'),
      text(195, 282, '正方形', 'dim'),
      text(195, 312, '想清楚：四邊總長要平均分給幾條邊？', 'dim')
    ].join('')),
    6: () => wrap([
      text(195, 26, '題目：邊長 3、5、3、5 公分，且有 4 個直角', 'cap'),
      rect(95, 96, 200, 130, 'var(--fill-b)', 'mark'),
      text(195, 88, '5 公分', 'lbl'), text(195, 246, '5 公分', 'lbl'),
      text(78, 166, '3 公分', 'lbl'), text(312, 166, '3 公分', 'lbl'),
      '<path d="M95 110 h14 v-14 M295 110 h-14 v-14 M95 212 h14 v14 M295 212 h-14 v14" fill="none" stroke="var(--accent)" stroke-width="2"/>',
      text(195, 292, '量量看四個角與四條邊', 'dim'),
      text(195, 316, '選出符合的圖形名稱', 'dim')
    ].join('')),
    7: () => wrap([
      text(195, 26, '題目：從 3 根 2cm 與 2 根 4cm 吸管中任選 4 根', 'cap'),
      rect(38, 104, 96, 16, 'var(--fill-a)', '', 8), text(86, 96, '2cm', 'lbl'),
      rect(38, 150, 96, 16, 'var(--fill-a)', '', 8), text(86, 142, '2cm', 'lbl'),
      rect(38, 196, 96, 16, 'var(--fill-a)', '', 8), text(86, 188, '2cm', 'lbl'),
      rect(222, 124, 140, 16, 'var(--fill-b)', '', 8), text(292, 116, '4cm', 'lbl'),
      rect(222, 184, 140, 16, 'var(--fill-b)', '', 8), text(292, 176, '4cm', 'lbl'),
      text(195, 280, '左邊 3 根短吸管，右邊 2 根長吸管', 'dim'),
      text(195, 312, '數數看有幾根長吸管、幾根短吸管', 'dim')
    ].join('')),
    8: () => wrap([
      text(195, 26, '題目：如下圖，正方形的每邊長是多少公分？', 'cap'),
      rect(110, 66, 170, 170, 'none', 'mark'),
      '<circle cx="195" cy="151" r="85" fill="var(--fill-b)" stroke="var(--line)" stroke-width="2.5"/>',
      '<line x1="110" y1="151" x2="280" y2="151" stroke="var(--accent)" stroke-width="2.5"/>',
      '<circle cx="195" cy="151" r="3" fill="var(--ink)"/>',
      text(195, 143, '4 公分', 'lbl'),
      text(195, 264, '水平直徑貫穿圓心', 'dim'),
      text(195, 312, '比對內切圓直徑與正方形邊長', 'dim')
    ].join('')),
    9: () => wrap([
      text(195, 26, '題目：比較正方形與長方形的邊和角', 'cap'),
      rect(48, 96, 118, 118, 'var(--fill-a)', 'mark'),
      rect(224, 96, 148, 118, 'var(--fill-b)', 'mark'),
      text(107, 240, '圖形甲', 'lbl'), text(298, 240, '圖形乙', 'lbl'),
      text(195, 284, '四個選項都在講邊與角的性質', 'dim'),
      text(195, 312, '找出與圖形特徵不相符的那一句', 'dim')
    ].join('')),
    10: () => wrap([
      text(195, 24, '題目：用尺和三角板量一量，ㄅ～ㄊ 哪些是正方形、哪些是長方形？', 'cap'),
      rect(24, 64, 84, 52, 'var(--fill-b)', 'mark'), text(66, 140, 'ㄅ', 'lbl'),
      rect(156, 64, 78, 52, 'var(--fill-c)', 'mark', 14), text(195, 140, 'ㄆ', 'lbl'),
      poly('306,56 342,90 306,124 270,90', 'var(--fill-a)', 'mark'), text(306, 148, 'ㄇ', 'lbl'),
      poly('26,182 104,182 124,238 46,238', 'var(--fill-c)', 'mark'), text(75, 262, 'ㄈ', 'lbl'),
      rect(158, 182, 58, 58, 'var(--fill-a)', 'mark'), text(187, 262, 'ㄉ', 'lbl'),
      '<g transform="rotate(-18 310 210)"><rect class="shape mark" x="272" y="184" width="76" height="48" fill="var(--fill-b)" stroke="var(--line)" stroke-width="2.5"/></g>',
      text(310, 262, 'ㄊ', 'lbl'),
      text(195, 300, '(1) 正方形有哪些？　(2) 長方形有哪些？', 'dim'),
      text(195, 322, '圓角、旋轉、平行四邊形都要仔細量', 'dim')
    ].join(''))
  };

  function gridScene(caption) {
    const x0 = 90, y0 = 78, cell = 30, cols = 7, rows = 7;
    let g = '<text x="195" y="24" class="cap" text-anchor="middle">' + caption + '</text>';
    g += '<text x="' + (x0 + 15) + '" y="' + (y0 - 10) + '" class="dim">1cm</text>';
    g += '<text x="' + (x0 - 24) + '" y="' + (y0 + 20) + '" class="dim">1cm</text>';
    for (let r = 0; r <= rows; r++) g += '<line x1="' + x0 + '" y1="' + (y0 + r * cell) + '" x2="' + (x0 + cols * cell) + '" y2="' + (y0 + r * cell) + '" stroke="var(--grid)" stroke-width="1"/>';
    for (let c = 0; c <= cols; c++) g += '<line x1="' + (x0 + c * cell) + '" y1="' + y0 + '" x2="' + (x0 + c * cell) + '" y2="' + (y0 + rows * cell) + '" stroke="var(--grid)" stroke-width="1"/>';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      g += '<rect class="gcell" data-r="' + r + '" data-c="' + c + '" x="' + (x0 + c * cell + 1) + '" y="' + (y0 + r * cell + 1) +
           '" width="' + (cell - 2) + '" height="' + (cell - 2) + '" fill="transparent" stroke="none" style="cursor:crosshair"/>';
    }
    g += '<text x="195" y="306" class="dim">點選格子試著畫出題目要求的圖形</text>';
    g += '<text id="counter" x="195" y="328" class="lbl">已選：0 格</text>';
    return wrap(g);
  }

  const HINTS = [
    '用眼睛和量具比比看：四邊等長就夠了嗎？',
    '用直角尺量量看，再選出符合的選項。',
    '每格邊長 1 公分，點選格子試著畫畫看。',
    '每格邊長 1 公分，點選格子試著畫畫看。',
    '四邊總長已知，想想正方形有幾條等長的邊。',
    '量量看四個角和四條邊，這是什麼圖形？',
    '數數看有幾根長吸管、幾根短吸管。',
    '直徑已經標在圖上，比對正方形的邊。',
    '比較兩個圖形的邊和角，找出錯誤的敘述。',
    '小心圓角與平行四邊形，量量看再選。'
  ];

  const scene = document.getElementById('scene');
  scene.insertAdjacentHTML('afterbegin', (scenes[qNum] || scenes[1])());
  // 底部 44px 為可拖曳量具保留區：移除會被量具遮住的冗餘說明（提示已於頁尾重複呈現）
  const counter0 = document.getElementById('counter');
  if (counter0) counter0.setAttribute('y', '292');
  scene.querySelectorAll('text').forEach(function (t) {
    const y = parseFloat(t.getAttribute('y'));
    if (y >= 296 && t.id !== 'counter') t.remove();
  });
  document.getElementById('qtag').textContent = 'Q' + String(qNum).padStart(2, '0');
  document.getElementById('hint').textContent = HINTS[qNum - 1];

  // 點選圖形：標記（只有提示記號，沒有答案文字）
  scene.addEventListener('click', function (e) {
    const shape = e.target.closest('.shape');
    if (shape) shape.classList.toggle('marked');
    const cell = e.target.closest('.gcell');
    if (cell) {
      const on = cell.getAttribute('fill') === 'transparent';
      cell.setAttribute('fill', on ? 'var(--accent)' : 'transparent');
      cell.setAttribute('opacity', on ? '0.45' : '1');
      const n = scene.querySelectorAll('.gcell[fill="var(--accent)"]').length;
      const c = document.getElementById('counter');
      if (c) c.textContent = '已選：' + n + ' 格';
    }
  });

  // 真實 pointer 事件拖曳量具
  const tool = document.getElementById('tool');
  let dragging = false, ox = 0, oy = 0;
  tool.addEventListener('pointerdown', function (e) {
    dragging = true;
    const r = tool.getBoundingClientRect(), s = scene.getBoundingClientRect();
    ox = e.clientX - r.left; oy = e.clientY - r.top;
    tool.setPointerCapture(e.pointerId);
  });
  tool.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    const s = scene.getBoundingClientRect();
    const x = Math.max(0, Math.min(s.width - tool.offsetWidth, e.clientX - s.left - ox));
    const y = Math.max(0, Math.min(s.height - tool.offsetHeight, e.clientY - s.top - oy));
    tool.style.left = x + 'px'; tool.style.top = y + 'px';
    tool.style.right = 'auto'; tool.style.bottom = 'auto';
  });
  const stop = () => { dragging = false; };
  tool.addEventListener('pointerup', stop);
  tool.addEventListener('pointercancel', stop);
})();
</script>
</body>
</html>
