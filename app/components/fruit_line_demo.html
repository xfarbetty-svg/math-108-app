<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>水果排一列圈圈看 · 第幾個 vs 幾個 (v12.2)</title>
<style>
  :root{
    --fs: clamp(34px, 8vw, 60px);        /* 水果格子尺寸 */
    --wood-1:#d9a066; --wood-2:#b57b45; --wood-dark:#8a5a2e;
    --cream:#fdf6e9; --ink:#4e342e;
    --red:#e53935; --green:#43a047; --gold:#ffb300;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 15% 12%, #fff7e0 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #f3e3c3 0%, transparent 50%),
      var(--cream);
    color:var(--ink);
    font-family:"YuanTi TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    min-height:100vh;
  }
  #app{ max-width:960px; margin:0 auto; padding:10px 10px 28px; }

  /* ── 頂部木牌標題 ── */
  header{
    background:linear-gradient(180deg,var(--wood-1),var(--wood-2));
    border:4px solid var(--wood-dark); border-radius:16px;
    box-shadow:0 4px 0 var(--wood-dark), 0 8px 14px rgba(90,55,20,.25);
    padding:10px 14px 12px; position:relative; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.25);
  }
  header::before{ /* 木紋 */
    content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none;
    background:repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.08) 46px 48px);
  }
  header h1{ margin:0; font-size:clamp(18px,4.6vw,26px); letter-spacing:1px; }
  header .sub{ font-size:12px; opacity:.92; margin-top:2px; }
  .tabs{ display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  .tab{
    border:2.5px solid var(--wood-dark); border-radius:12px; cursor:pointer;
    background:linear-gradient(180deg,#fff3d6,#ffe1a8); color:var(--ink);
    text-shadow:none; font-weight:700; font-size:13px; padding:5px 9px;
    box-shadow:0 3px 0 var(--wood-dark); transition:transform .12s;
    display:flex; align-items:center; gap:4px;
  }
  .tab .dot{ width:8px; height:8px; border-radius:50%; background:#c8b28a; }
  .tab:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--wood-dark); }
  .tab.active{ background:linear-gradient(180deg,#ffdf6b,#ffc233); }
  .tab.active .dot{ background:var(--green); }
  .tab.done .dot{ background:var(--red); }

  /* ── 題目橫幅 ── */
  .q-banner{
    margin:12px 2px 0; background:#fff; border:3px dashed var(--wood-2);
    border-radius:14px; padding:10px 12px; position:relative;
    font-size:clamp(15px,4vw,19px); font-weight:700; line-height:1.5;
  }
  .q-banner .badge{
    display:inline-block; background:#ffe082; border:2px solid var(--gold);
    border-radius:8px; font-size:12px; padding:1px 7px; margin-right:6px;
    vertical-align:2px; white-space:nowrap;
  }
  .q-banner .source{
    position:absolute; top:4px; right:8px; font-size:11px; color:#b9a58a;
    font-weight:400; letter-spacing:.5px;
  }
  .key-phrase{ color:var(--red); text-decoration:underline wavy var(--red) 2px; text-underline-offset:3px; }

  /* ── 果園木檯 ── */
  .board{
    margin-top:12px; position:relative;
    background:linear-gradient(180deg,var(--wood-1) 0%,var(--wood-2) 100%);
    border:4px solid var(--wood-dark); border-radius:18px;
    box-shadow:0 5px 0 var(--wood-dark), 0 10px 18px rgba(90,55,20,.3);
    padding:12px 8px 14px; overflow:hidden;
  }
  .board::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(90deg, transparent 0 52px, rgba(0,0,0,.07) 52px 55px);
  }
  .strip{ display:flex; align-items:stretch; gap:4px; position:relative; }
  .sign{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; background:#fff6df; border:2.5px solid var(--wood-dark); border-radius:10px;
    font-weight:800; color:var(--wood-dark); padding:6px 3px; min-width:26px;
    box-shadow:0 2px 0 var(--wood-dark); align-self:center;
  }
  .sign .emo{ font-size:16px; }
  .sign .txt{ font-size:11px; writing-mode:vertical-rl; letter-spacing:2px; }
  @media (min-width:640px){
    .sign{ flex-direction:row; gap:6px; padding:8px 12px; min-width:0; }
    .sign .txt{ writing-mode:horizontal-tb; font-size:14px; letter-spacing:1px; }
    .sign .emo{ font-size:18px; }
  }

  .fruit-row{
    flex:1 1 auto; display:flex; gap:2px; overflow-x:auto; overflow-y:hidden;
    padding:30px 6px 12px; scroll-snap-type:x proximity; position:relative;
    scrollbar-width:thin;
  }
  .fruit-row::-webkit-scrollbar{ height:6px; }
  .fruit-row::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.5); border-radius:3px; }

  .cell{
    position:relative; flex:0 0 auto; width:var(--fs); height:var(--fs);
    background:none; border:none; padding:0; margin:0; cursor:pointer;
    scroll-snap-align:center; border-radius:50%;
  }
  .cell svg.fruit{ width:100%; height:100%; display:block; filter:drop-shadow(0 2px 1px rgba(60,30,0,.25)); transition:transform .15s; }
  .cell:hover svg.fruit{ transform:translateY(-3px); }
  .cell.pressed svg.fruit{ animation:pop .45s ease; }
  @keyframes pop{
    0%{ transform:scale(1); } 35%{ transform:scale(1.28) rotate(-6deg); }
    65%{ transform:scale(.92) rotate(4deg); } 100%{ transform:scale(1); }
  }
  .cell.sel svg.fruit{ transform:translateY(-4px) scale(1.06); }
  .cell.demo svg.fruit{ animation:pop .45s ease; transform:translateY(-5px) scale(1.1); }

  /* 手繪紅蠟筆套索 */
  svg.lasso{
    position:absolute; inset:-4%; width:108%; height:108%;
    pointer-events:none; opacity:0; transform:scale(.4) rotate(-12deg);
    transition:opacity .18s, transform .28s cubic-bezier(.34,1.56,.64,1);
  }
  .cell.sel svg.lasso, .cell.demo svg.lasso{ opacity:1; transform:scale(1) rotate(-4deg); }
  .big-lasso{
    position:absolute; pointer-events:none; opacity:0; z-index:3;
    transition:opacity .25s, transform .35s cubic-bezier(.34,1.56,.64,1);
    transform:scale(.7);
  }
  .big-lasso.show{ opacity:1; transform:scale(1); }

  /* 順序數字氣泡 */
  .bubble{
    position:absolute; top:0; left:50%; transform:translateX(-50%) scale(0);
    background:#fff; border:2px solid var(--red); color:var(--red);
    font-weight:900; font-size:12px; min-width:20px; height:20px; line-height:16px;
    border-radius:10px; padding:0 3px; text-align:center; z-index:4;
    transition:transform .25s cubic-bezier(.34,1.8,.64,1);
    box-shadow:0 2px 0 rgba(180,40,40,.3); pointer-events:none;
  }
  .bubble.show{ transform:translateX(-50%) scale(1); }
  .cell.final svg.lasso{ stroke-width:5; }

  /* ── 提示與控制 ── */
  .hint{
    margin:10px 2px 0; background:#fffbe8; border:2.5px solid var(--gold);
    border-radius:12px; padding:8px 12px; font-size:clamp(13px,3.6vw,15px); line-height:1.55;
  }
  .hint b{ color:var(--red); }
  .controls{ display:flex; gap:10px; margin-top:12px; justify-content:center; flex-wrap:wrap; }
  .btn{
    font-family:inherit; font-size:clamp(15px,4.2vw,18px); font-weight:800; cursor:pointer;
    border-radius:14px; padding:10px 22px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.2);
    border:3px solid; box-shadow:0 4px 0; transition:transform .1s;
    min-height:44px; min-width:44px;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0; }
  .btn-ok{ background:linear-gradient(180deg,#66bb6a,#2e7d32); border-color:#1b5e20; box-shadow-color:#1b5e20; box-shadow:0 4px 0 #1b5e20; }
  .btn-re{ background:linear-gradient(180deg,#ffee58,#f9a825); border-color:#f57f17; box-shadow:0 4px 0 #f57f17; color:#5d4037; text-shadow:none; }

  .feedback{
    margin-top:12px; border-radius:14px; padding:12px 14px; line-height:1.65;
    font-size:clamp(14px,3.9vw,16.5px); font-weight:600; display:none; position:relative;
    border:3px solid;
  }
  .feedback.show{ display:block; animation:rise .3s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  .feedback.good{ background:#e8f5e9; border-color:#66bb6a; color:#1b5e20; }
  .feedback.bad{ background:#ffebee; border-color:#ef9a9a; color:#b71c1c; }
  .feedback.think{ background:#fff8e1; border-color:#ffb300; color:#7a4f01; }
  .feedback .big-emo{ font-size:30px; margin-right:6px; vertical-align:-4px; }
  .feedback .why{ display:block; margin-top:6px; font-size:.92em; font-weight:500; }

  /* 慶祝星星 */
  .star{ position:fixed; z-index:99; pointer-events:none; font-size:22px; animation:fly .95s ease-out forwards; }
  @keyframes fly{
    from{ transform:translate(0,0) scale(.6) rotate(0deg); opacity:1; }
    to{ transform:translate(var(--dx),var(--dy)) scale(1.25) rotate(var(--rot)); opacity:0; }
  }

  footer{ text-align:center; margin-top:14px; font-size:11px; color:#b9a58a; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🍓 水果排一列圈圈看</h1>
    <div class="sub">「第幾個」vs「幾個」大陷阱 · 忠孝國小 114-1 期中真題改編</div>
    <div class="tabs" id="tabs"></div>
  </header>

  <div class="q-banner">
    <span class="badge" id="qBadge">關卡 1</span><span id="qText"></span>
    <div class="source">真題來源：高雄市忠孝國小 114 學年度一年級期中考 · 第三大題-2</div>
  </div>

  <div class="board">
    <div class="strip">
      <div class="sign"><span class="emo">👈</span><span class="txt">左邊</span></div>
      <div class="fruit-row" id="row"></div>
      <div class="sign"><span class="emo">👉</span><span class="txt">右邊</span></div>
    </div>
  </div>

  <div class="hint" id="hint"></div>

  <div class="controls">
    <button class="btn btn-ok" id="btnOk">✅ 確認答案</button>
    <button class="btn btn-re" id="btnRe">🔄 重數一次</button>
  </div>

  <div class="feedback" id="fb"></div>

  <footer>純前端離線教具 · 028-1 國小數學 APP · 鐵律一：每單元嚴格真題 10 題精神之單題打樣</footer>
</div>

<script>
"use strict";

/* ════════ 關卡資料（SSOT） ════════ */
const LEVELS = [
  { id:"watermelon", name:"西瓜", emo:"🍉", type:"ordinal", side:"right", n:5,
    q:'從<span class="key-phrase">右邊</span>數起，圈出<span class="key-phrase">第 5 顆</span>西瓜。',
    tip:'「<b>第 5 顆</b>」是序數，只有 <b>1 顆</b>！從右邊開始數：1, 2, 3, 4, 5，就是它！' },
  { id:"waxapple", name:"蓮霧", emo:"🍎", type:"cardinal", side:"left", n:8,
    q:'從<span class="key-phrase">左邊</span>數起，圈出<span class="key-phrase">前面 8 顆</span>蓮霧。',
    tip:'「<b>前面 8 顆</b>」是數量（基數），共有 <b>8 顆</b>！要把左邊前 8 顆全部圈起來！' },
  { id:"starfruit", name:"楊桃", emo:"⭐", type:"ordinal", side:"right", n:7,
    q:'從<span class="key-phrase">右邊</span>數起，圈出<span class="key-phrase">第 7 顆</span>楊桃。',
    tip:'「<b>第 7 顆</b>」是序數，只有 <b>1 顆</b>！從右邊數到 7 就是它！' },
  { id:"lemon", name:"檸檬", emo:"🍋", type:"cardinal", side:"left", n:6,
    q:'從<span class="key-phrase">左邊</span>數起，圈出<span class="key-phrase">前面 6 顆</span>檸檬。',
    tip:'「<b>前面 6 顆</b>」是數量（基數），總共有 <b>6 顆</b>！' },
];
const TOTAL = 10; // 每列固定 10 顆

/* ════════ 純向量 SVG 水果工廠 ════════ */
const FACE = `
  <g class="face">
    <circle cx="41" cy="52" r="3.4" fill="#4e342e"/>
    <circle cx="59" cy="52" r="3.4" fill="#4e342e"/>
    <circle cx="42.2" cy="50.8" r="1.1" fill="#fff"/>
    <circle cx="60.2" cy="50.8" r="1.1" fill="#fff"/>
    <path d="M44,60 Q50,66 56,60" fill="none" stroke="#4e342e" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="33" cy="59" r="4" fill="#ff8a80" opacity=".45"/>
    <circle cx="67" cy="59" r="4" fill="#ff8a80" opacity=".45"/>
  </g>`;

function svgWatermelon(){
  return `<svg class="fruit" viewBox="0 0 100 100">
    <defs><clipPath id="wmC"><circle cx="50" cy="55" r="37"/></clipPath></defs>
    <circle cx="50" cy="55" r="37" fill="#8bc34a"/>
    <g clip-path="url(#wmC)" stroke="#2e7d32" stroke-width="7.5" fill="none" stroke-linecap="round">
      <path d="M30,16 C24,45 26,72 33,94"/>
      <path d="M50,14 C47,45 47,75 50,96"/>
      <path d="M70,16 C74,45 72,72 66,94"/>
    </g>
    <circle cx="50" cy="55" r="37" fill="none" stroke="#33691e" stroke-width="3.5"/>
    <path d="M50,19 Q54,13 60,12" fill="none" stroke="#33691e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M50,19 Q44,11 37,13 Q44,17 49,21 Z" fill="#66bb6a" stroke="#33691e" stroke-width="2"/>
    <ellipse cx="36" cy="38" rx="9" ry="5" fill="#fff" opacity=".35" transform="rotate(-25 36 38)"/>
  </svg>`;
}
function svgWaxapple(){
  return `<svg class="fruit" viewBox="0 0 100 100">
    <defs><linearGradient id="waG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5350"/><stop offset="1" stop-color="#b71c1c"/>
    </linearGradient></defs>
    <path d="M50,22 C76,22 84,50 79,70 C75,86 62,92 50,92 C38,92 25,86 21,70 C16,50 24,22 50,22 Z"
      fill="url(#waG)" stroke="#8e0000" stroke-width="3.5"/>
    <path d="M50,22 Q52,16 50,12" fill="none" stroke="#5d4037" stroke-width="4" stroke-linecap="round"/>
    <path d="M51,15 Q62,6 72,12 Q62,19 52,17 Z" fill="#66bb6a" stroke="#33691e" stroke-width="2.4"/>
    <path d="M33,34 Q28,46 31,58" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".4"/>
    <ellipse cx="50" cy="30" rx="10" ry="4" fill="#ff8a80" opacity=".5"/>
  </svg>`;
}
function svgStarfruit(){
  const pts=[]; const cx=50, cy=56, R=40, r=17;
  for(let i=0;i<10;i++){
    const a=-Math.PI/2 + i*Math.PI/5;
    const rad=(i%2===0)?R:r;
    pts.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));
  }
  return `<svg class="fruit" viewBox="0 0 100 100">
    <defs><linearGradient id="stG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ee9c"/><stop offset="1" stop-color="#c0ca33"/>
    </linearGradient></defs>
    <polygon points="${pts.join(" ")}" fill="url(#stG)" stroke="#827717" stroke-width="3.5"
      stroke-linejoin="round" transform="rotate(8 50 56)"/>
    <g stroke="#9e9d24" stroke-width="2" opacity=".8" transform="rotate(8 50 56)">
      <line x1="50" y1="56" x2="50" y2="16"/><line x1="50" y1="56" x2="88" y2="43"/>
      <line x1="50" y1="56" x2="74" y2="88"/><line x1="50" y1="56" x2="26" y2="88"/>
      <line x1="50" y1="56" x2="12" y2="43"/>
    </g>
    <path d="M50,13 Q52,8 56,7" fill="none" stroke="#827717" stroke-width="3" stroke-linecap="round" transform="rotate(8 50 56)"/>
  </svg>`;
}
function svgLemon(){
  return `<svg class="fruit" viewBox="0 0 100 100">
    <defs><linearGradient id="leG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#fbc02d"/>
    </linearGradient></defs>
    <path d="M14,58 Q12,50 18,46 Q22,34 36,30 Q50,26 64,30 Q78,34 82,46 Q88,50 86,58 Q88,66 82,70 Q78,82 64,86 Q50,90 36,86 Q22,82 18,70 Q12,66 14,58 Z"
      fill="url(#leG)" stroke="#f57f17" stroke-width="3.5"/>
    <circle cx="14" cy="58" r="5" fill="#fbc02d" stroke="#f57f17" stroke-width="3"/>
    <circle cx="86" cy="58" r="5" fill="#fbc02d" stroke="#f57f17" stroke-width="3"/>
    <path d="M50,30 Q54,22 62,20" fill="none" stroke="#5d4037" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M55,26 Q66,16 76,22 Q66,29 56,28 Z" fill="#66bb6a" stroke="#33691e" stroke-width="2.2"/>
    <ellipse cx="32" cy="42" rx="8" ry="4" fill="#fff" opacity=".5" transform="rotate(-20 32 42)"/>
  </svg>`;
}
const FRUIT_SVG = { watermelon:svgWatermelon, waxapple:svgWaxapple, starfruit:svgStarfruit, lemon:svgLemon };

/* 手繪蠟筆粗糙橢圓路徑 */
function roughEllipse(rx, ry){
  const N=18, cx=50, cy=50, pts=[];
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2 - Math.PI/2;
    const jrx=rx*(0.92+0.10*Math.sin(i*2.7)), jry=ry*(0.92+0.10*Math.cos(i*3.3));
    pts.push([cx+jrx*Math.cos(a), cy+jry*Math.sin(a)]);
  }
  let d="M"+pts[0][0].toFixed(1)+","+pts[0][1].toFixed(1);
  for(let i=1;i<=N;i++){
    const p=pts[i%N], q=pts[i-1];
    d+=" Q"+q[0].toFixed(1)+","+q[1].toFixed(1)+" "+((q[0]+p[0])/2).toFixed(1)+","+((q[1]+p[1])/2).toFixed(1);
  }
  return d+" Z";
}
const LASSO_D = roughEllipse(42, 42);

/* ════════ 狀態 ════════ */
const state = LEVELS.map(()=>({ sel:new Set(), answered:false, revealed:false }));
let cur = 0;
let timers = [];

function expectedSet(li){
  const L=LEVELS[li], s=new Set();
  if(L.type==="ordinal"){
    s.add(L.side==="right" ? TOTAL-L.n : L.n-1);
  }else{
    for(let i=0;i<L.n;i++) s.add(L.side==="left" ? i : TOTAL-1-i);
  }
  return s;
}
/* 破招數數序列：依題目方向依序 [{idx, count}] */
function demoSeq(li){
  const L=LEVELS[li], seq=[];
  for(let c=1;c<=L.n;c++){
    seq.push({ idx: L.side==="left" ? c-1 : TOTAL-c, count:c });
  }
  return seq;
}
function sideName(L){ return L.side==="left" ? "左" : "右"; }
function posFromTap(li, idx){
  const L=LEVELS[li];
  return L.side==="left" ? idx+1 : TOTAL-idx;
}

/* ════════ 渲染 ════════ */
const rowEl=document.getElementById("row");
const tabsEl=document.getElementById("tabs");
const fbEl=document.getElementById("fb");
const hintEl=document.getElementById("hint");
const qTextEl=document.getElementById("qText");
const qBadgeEl=document.getElementById("qBadge");

function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function later(fn,ms){ timers.push(setTimeout(fn,ms)); }

function buildTabs(){
  tabsEl.innerHTML="";
  LEVELS.forEach((L,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===cur?" active":"")+(state[i].answered?" done":"");
    b.innerHTML=`<span class="dot"></span>${L.emo} ${L.name}`;
    b.onclick=()=>gotoLevel(i);
    tabsEl.appendChild(b);
  });
}

function render(){
  clearTimers();
  const L=LEVELS[cur], st=state[cur];
  qBadgeEl.textContent=`關卡 ${cur+1} / ${LEVELS.length}`;
  qTextEl.innerHTML=L.q;
  hintEl.innerHTML="💡 破招提示："+L.tip;
  fbEl.className="feedback"; fbEl.innerHTML="";
  rowEl.innerHTML="";
  const svgFn=FRUIT_SVG[L.id];
  for(let i=0;i<TOTAL;i++){
    const cell=document.createElement("button");
    cell.className="cell"; cell.dataset.idx=i;
    cell.setAttribute("aria-label", `${L.name} 第 ${i+1} 顆（從左數）`);
    cell.innerHTML =
      `<span class="bubble"></span>`+
      svgFn()+
      `<svg class="lasso" viewBox="0 0 100 100" preserveAspectRatio="none">
         <path d="${LASSO_D}" fill="none" stroke="#e53935" stroke-width="4.5"
           stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
       </svg>`;
    if(st.sel.has(i)) cell.classList.add("sel"), showBubble(cell, st.bubbleText?st.bubbleText[i]:posFromTap(cur,i));
    cell.addEventListener("click", ()=>tapFruit(i, cell));
    rowEl.appendChild(cell);
  }
  buildTabs();
  if(st.revealed && !st.answered) runDemo(true); // 切回已破招未答對的關卡：重播破招
}

function showBubble(cell, num){
  const b=cell.querySelector(".bubble");
  b.textContent=num; b.classList.add("show");
}
function hideBubble(cell){ cell.querySelector(".bubble").classList.remove("show"); }

/* ════════ 互動 ════════ */
function tapFruit(idx, cell){
  const st=state[cur];
  if(st.answered){ // 已答對：只給鼓勵彈跳
    cell.classList.remove("pressed"); void cell.offsetWidth; cell.classList.add("pressed");
    return;
  }
  cell.classList.remove("pressed"); void cell.offsetWidth; cell.classList.add("pressed");
  if(st.sel.has(idx)){
    st.sel.delete(idx); cell.classList.remove("sel"); hideBubble(cell);
  }else{
    st.sel.add(idx); cell.classList.add("sel");
    showBubble(cell, posFromTap(cur, idx));
  }
}

function setFeedback(kind, html){
  fbEl.className="feedback show "+kind;
  fbEl.innerHTML=html;
}

function celebrate(){
  const emos=["⭐","🎉","🍓","✨","💛","🏅"];
  for(let i=0;i<14;i++){
    const s=document.createElement("span");
    s.className="star"; s.textContent=emos[i%emos.length];
    const ang=Math.random()*Math.PI*2, dist=70+Math.random()*130;
    s.style.left="50%"; s.style.top="40%";
    s.style.setProperty("--dx", (Math.cos(ang)*dist).toFixed(0)+"px");
    s.style.setProperty("--dy", (Math.sin(ang)*dist-40).toFixed(0)+"px");
    s.style.setProperty("--rot", (Math.random()*360-180).toFixed(0)+"deg");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 1000);
  }
}

/* ════════ 破招動畫：老師依方向逐顆數數 ════════ */
function runDemo(silent){
  const L=LEVELS[cur], st=state[cur], seq=demoSeq(cur);
  const cells=[...rowEl.querySelectorAll(".cell")];
  // 清場（保留答對狀態不會進到這裡）
  cells.forEach(c=>{ c.classList.remove("sel","demo","final"); hideBubble(c); });
  removeBigLasso();
  let t=300;
  seq.forEach((s,k)=>{
    later(()=>{
      const c=cells[s.idx];
      c.classList.add("demo"); showBubble(c, s.count);
    }, t); t+=520;
  });
  later(()=>{
    if(L.type==="ordinal"){
      const c=cells[seq[seq.length-1].idx];
      c.classList.add("final");
    }else{
      drawBigLasso(seq[0].idx, seq[seq.length-1].idx);
    }
    st.revealed=true;
    if(!silent){
      const kind=L.type==="ordinal"?"ordinal":"cardinal";
      setFeedback("think",
        `🕵️ <b>破招解析</b>（${kind==="ordinal"?"序數·第幾個":"基數·幾個"}）：`+
        (L.type==="ordinal"
          ? `「第 ${L.n} 顆」是<b>序數</b> → 從${sideName(L)}邊數 <b>1, 2, … ${L.n}</b>，只有<b>單獨 1 顆</b>被圈起來！`
          : `「前面 ${L.n} 顆」是<b>基數</b> → 從${sideName(L)}邊數出來的<b>一整群 ${L.n} 顆</b>，全部圈進同一個大圈圈！`)+
        `<span class="why">按「🔄 重數一次」再自己圈圈看一次吧！</span>`);
    }
  }, t+200);
}

function removeBigLasso(){
  const old=rowEl.querySelector(".big-lasso");
  if(old) old.remove();
}
function drawBigLasso(firstIdx, lastIdx){
  removeBigLasso();
  const cells=[...rowEl.querySelectorAll(".cell")];
  const a=cells[firstIdx], b=cells[lastIdx];
  const x0=a.offsetLeft-6, x1=b.offsetLeft+b.offsetWidth+6;
  const y0=a.offsetTop-4, y1=a.offsetTop+a.offsetHeight+8;
  const w=x1-x0, h=y1-y0;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","big-lasso");
  svg.setAttribute("viewBox","0 0 100 100");
  svg.setAttribute("preserveAspectRatio","none");
  svg.style.left=(x0-3)+"px"; svg.style.top=(y0-3)+"px";
  svg.style.width=(w+6)+"px"; svg.style.height=(h+6)+"px";
  svg.innerHTML=`<path d="${LASSO_D}" fill="none" stroke="#e53935" stroke-width="4"
    stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".9"/>`;
  rowEl.appendChild(svg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>svg.classList.add("show")));
}

/* ════════ 判卷 ════════ */
function sameSet(a, bSet){
  if(a.length!==bSet.size) return false;
  return a.every(x=>bSet.has(x));
}

function check(){
  const L=LEVELS[cur], st=state[cur];
  if(st.answered){ setFeedback("good", `🌟 已經答對囉！按關卡按鈕挑戰下一題！`); return; }
  const sel=[...st.sel].sort((x,y)=>x-y);
  if(sel.length===0){
    setFeedback("think", `_pointer 先點水果，用紅色蠟筆圈圈把答案圈起來喔！`.replace("_pointer ","👇 "));
    return;
  }
  const exp=expectedSet(cur);
  if(sameSet(sel, exp)){
    // ── 答對 ──
    st.answered=true; buildTabs();
    const cells=[...rowEl.querySelectorAll(".cell")];
    if(L.type==="ordinal"){ cells[[...exp][0]].classList.add("final"); }
    else{ drawBigLasso([...exp][0], [...exp][exp.size-1]); }
    celebrate();
    setFeedback("good",
      `<span class="big-emo">🎉</span><b>答對了！好厲害！</b>`+
      (L.type==="ordinal"
        ? `「第 ${L.n} 顆」是序數 → 就只有<b>單獨這 1 顆</b>！`
        : `「前面 ${L.n} 顆」是基數 → 一共圈了 <b>${L.n} 顆</b>！`));
    if(cur<LEVELS.length-1){
      later(()=>{ gotoLevel(cur+1); }, 1900);
    }else{
      later(()=>setFeedback("good",
        `<span class="big-emo">🏆</span><b>四關全破！</b>你已經完全分清楚「<b>第幾顆</b>」和「<b>幾顆</b>」了！`), 1900);
    }
    return;
  }
  // ── 答錯：精準指出序數/基數混淆 ──
  const n=L.n, isOrd=L.type==="ordinal";
  let msg;
  if(isOrd && sel.length>1){
    msg=`🤔 你圈了 <b>${sel.length} 顆</b>！可是「第 ${n} 顆」<b>只有 1 顆</b>喔～<br>`+
        `<b>這是「第幾顆」還是「幾個」呢？</b>`;
  }else if(isOrd){
    msg=`🤔 圈錯顆了！要從<b>${sideName(L)}邊</b>開始數：1, 2, 3… 數到 ${n}！<br>`+
        `<b>這是「第幾顆」還是「幾個」呢？</b>`;
  }else if(sel.length===1){
    msg=`🤔 你只圈了 <b>1 顆</b>！可是「前面 ${n} 顆」<b>有 ${n} 顆</b>喔～<br>`+
        `<b>這是「第幾顆」還是「幾個」呢？</b>`;
  }else if(sel.length<n){
    msg=`🤔 還差一點點！「前面 ${n} 顆」要圈滿 <b>${n} 顆</b>，你只圈了 ${sel.length} 顆～<br>`+
        `<b>這是「第幾顆」還是「幾個」呢？</b>`;
  }else{
    msg=`🤔 圈太多了！只要從<b>${sideName(L)}邊</b>數來的前 ${n} 顆喔～<br>`+
        `<b>這是「第幾顆」還是「幾個」呢？</b>`;
  }
  setFeedback("bad", msg+`<span class="why">看！老師破招示範來囉 👇</span>`);
  later(()=>runDemo(false), 900);
}

function resetLevel(){
  const st=state[cur];
  st.sel.clear(); st.answered=false; st.revealed=false;
  render();
}

function gotoLevel(i){
  cur=i;
  render();
}

document.getElementById("btnOk").addEventListener("click", check);
document.getElementById("btnRe").addEventListener("click", resetLevel);

render();
</script>
</body>
</html>
