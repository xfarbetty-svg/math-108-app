<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水果排一列圈圈看 · 忠孝國小 114-1 期中 第三大題第 2 題</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
        background: #fdf6ec;
        background-image: radial-gradient(#f3e4c8 1.2px, transparent 1.2px);
        background-size: 26px 26px;
        color: #4a2c12;
        padding: 16px 10px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }
    .app {
        width: 100%;
        max-width: 960px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .meta-row { display: flex; justify-content: flex-end; }
    .source-tag { font-size: 11px; color: #b0a08c; }
    .title {
        font-size: 1.35rem; font-weight: 800; color: #6b3f1d;
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .title .chip {
        font-size: 0.7rem; font-weight: 700; color: #fff;
        background: #e76f51; border-radius: 999px; padding: 3px 10px;
    }
    .subtitle { font-size: 0.85rem; color: #9c7a4e; }

    /* ===== 關卡切換 ===== */
    .level-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .lv-btn {
        flex: 1 1 0; min-width: 72px;
        border: 3px solid #8b5a2b; border-radius: 14px;
        background: linear-gradient(#fff8ec, #fdeed3);
        color: #6b3f1d; font-weight: 800; font-size: 0.85rem;
        padding: 8px 4px; cursor: pointer;
        box-shadow: 0 3px 0 #8b5a2b;
        transition: transform .12s;
    }
    .lv-btn .em { font-size: 1.2rem; display: block; }
    .lv-btn:hover { transform: translateY(-2px); }
    .lv-btn.active { background: linear-gradient(#ffe9b8, #ffd58a); box-shadow: 0 1px 0 #8b5a2b; transform: translateY(2px); }
    .lv-btn.done::after { content: " ✓"; color: #2a9d3f; }

    /* ===== 題目卡 ===== */
    .question-card {
        background: #fffdf6; border: 3px dashed #d8a44c; border-radius: 16px;
        padding: 12px 16px; font-size: 1.1rem; line-height: 1.7; font-weight: 700;
        position: relative;
    }
    .question-card .q-num {
        position: absolute; top: -12px; left: 14px;
        background: #e76f51; color: #fff; font-size: 0.72rem; font-weight: 800;
        border-radius: 999px; padding: 2px 10px;
    }
    .crayon-word {
        color: #d62828; font-weight: 900;
        background: linear-gradient(transparent 60%, #ffe08a 60%);
        border-radius: 4px; padding: 0 2px;
    }

    /* ===== 果園木架 ===== */
    .shelf {
        position: relative;
        border-radius: 20px;
        border: 6px solid #8b5a2b;
        background:
            repeating-linear-gradient(90deg, rgba(0,0,0,.045) 0 2px, transparent 2px 46px),
            repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 12px),
            linear-gradient(180deg, #c98d4e 0%, #b97b3f 55%, #a96a32 100%);
        box-shadow: inset 0 3px 8px rgba(255,255,255,.25), inset 0 -6px 12px rgba(0,0,0,.18), 0 8px 18px rgba(107,63,29,.25);
        padding: 12px 8px 16px;
        overflow: hidden;
    }
    .shelf-top-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 6px; margin-bottom: 4px;
    }
    .sign {
        flex: 0 0 auto;
        background: linear-gradient(#a9713f, #8a5527);
        border: 3px solid #6e4218; border-radius: 10px;
        color: #fff8ec; font-weight: 900; font-size: 0.95rem;
        padding: 6px 10px; white-space: nowrap;
        box-shadow: 0 3px 0 #5d3714, inset 0 1px 3px rgba(255,255,255,.3);
        position: relative;
    }
    .sign::before, .sign::after {
        content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%;
        background: #5d3714; box-shadow: inset 0 1px 1px rgba(0,0,0,.6);
        top: 4px;
    }
    .sign::before { left: 5px; }
    .sign::after { right: 5px; }
    .sign.left { transform: rotate(-3deg); }
    .sign.right { transform: rotate(3deg); }
    .shelf-label {
        font-size: 0.8rem; color: #fff3dd; font-weight: 800;
        text-shadow: 0 1px 2px rgba(0,0,0,.35);
        text-align: center; flex: 1 1 auto;
    }

    .scroll-area { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
    .row-wrap { position: relative; display: inline-block; min-width: 100%; }
    .fruit-row {
        display: flex; gap: 6px; align-items: flex-end;
        padding: 30px 6px 10px;
    }
    .lasso-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

    /* ===== 水果 ===== */
    .fruit {
        position: relative; flex: 0 0 auto;
        width: clamp(56px, 15vw, 86px);
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
        border: none; background: none; padding: 0;
        transition: transform .15s;
    }
    .fruit svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); }
    .fruit:active { transform: scale(.92); }
    .fruit.sel { transform: translateY(-8px) scale(1.08); }
    .fruit.sel svg { filter: drop-shadow(0 8px 6px rgba(214,40,40,.35)); }
    .fruit.pop { animation: popBounce .45s cubic-bezier(.34,1.56,.64,1); }
    @keyframes popBounce {
        0% { transform: scale(1); }
        35% { transform: scale(1.28) rotate(-6deg); }
        65% { transform: scale(.92) rotate(4deg); }
        100% { transform: translateY(-8px) scale(1.08); }
    }
    .fruit.demo-glow svg { filter: drop-shadow(0 0 8px #ffd166) drop-shadow(0 4px 3px rgba(0,0,0,.25)); }

    .bubble {
        position: absolute; top: -26px; left: 50%;
        transform: translateX(-50%) scale(0);
        width: 32px; height: 32px; border-radius: 50%;
        background: #fffdf6; border: 3px solid #d62828;
        color: #d62828; font-weight: 900; font-size: 1rem;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 2px 4px rgba(0,0,0,.2);
        transition: transform .25s cubic-bezier(.34,1.56,.64,1);
        z-index: 3;
    }
    .bubble.show { transform: translateX(-50%) scale(1); }
    .bubble.demo { background: #ffd166; border-color: #b36b00; color: #7a4b00; }
    .bubble::after {
        content: ""; position: absolute; bottom: -7px; left: 50%;
        transform: translateX(-50%);
        border: 6px solid transparent; border-top-color: #d62828; border-bottom: none;
    }

    /* ===== 控制列 ===== */
    .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hud {
        font-weight: 800; font-size: 0.95rem; color: #6b3f1d;
        background: #fff3dd; border: 2px solid #e0c08a; border-radius: 999px;
        padding: 6px 14px;
    }
    .hud b { color: #d62828; font-size: 1.15rem; }
    .btn {
        border: 3px solid #6b3f1d; border-radius: 14px;
        font-weight: 900; font-size: 1rem; cursor: pointer;
        padding: 10px 20px; box-shadow: 0 4px 0 #6b3f1d;
        transition: transform .12s;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b3f1d; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-check { background: linear-gradient(#ffcf7d, #f5a623); color: #5d3714; }
    .btn-reset { background: linear-gradient(#eef3f8, #d8e4ee); color: #3a5a78; }
    .btn-next { background: linear-gradient(#9be89b, #4caf50); color: #123d14; border-color: #2a6e2d; box-shadow: 0 4px 0 #2a6e2d; }

    /* ===== 回饋面板 ===== */
    .feedback {
        border-radius: 16px; padding: 14px 16px; font-weight: 700;
        line-height: 1.7; display: none; position: relative;
    }
    .feedback.show { display: block; animation: slideUp .35s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .feedback.good {
        background: linear-gradient(#e8f8e4, #d2f0cc);
        border: 3px solid #4caf50; color: #1d5c20;
    }
    .feedback.bad {
        background: linear-gradient(#fdeceb, #fbd9d6);
        border: 3px solid #e76f51; color: #8a2313;
        animation: slideUp .35s ease, shake .5s ease .35s;
    }
    @keyframes shake {
        0%,100% { transform: translateX(0); }
        20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
        60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
    }
    .feedback .fb-title { font-size: 1.15rem; font-weight: 900; }
    .feedback .fb-sub { font-size: 0.95rem; margin-top: 6px; }
    .feedback .fb-explain {
        margin-top: 10px; background: rgba(255,255,255,.7);
        border-radius: 10px; padding: 10px 12px; font-size: 0.92rem;
        border: 2px dashed currentColor;
    }
    .feedback .fb-actions { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .fb-actions .btn { font-size: 0.9rem; padding: 8px 16px; }
    .key-point { color: #d62828; font-weight: 900; }

    /* ===== 撒花 ===== */
    .confetti { position: fixed; top: -20px; font-size: 1.4rem; pointer-events: none; z-index: 99; animation: fall linear forwards; }
    @keyframes fall {
        to { transform: translateY(105vh) rotate(540deg); opacity: .6; }
    }

    .final-banner {
        display: none; text-align: center; font-weight: 900;
        background: linear-gradient(#fff3dd, #ffe3b0);
        border: 3px solid #f5a623; border-radius: 16px;
        padding: 14px; font-size: 1.15rem; color: #7a4b00;
    }
    .final-banner.show { display: block; animation: slideUp .4s ease; }

    /* ===== 手機 390px ===== */
    @media (max-width: 480px) {
        .title { font-size: 1.1rem; }
        .question-card { font-size: 1rem; padding: 14px 12px 10px; }
        .sign { font-size: 0.72rem; padding: 4px 6px; }
        .shelf-label { font-size: 0.68rem; }
        .fruit-row { gap: 4px; padding: 28px 4px 10px; }
        .controls .btn { flex: 1 1 auto; }
        .hud { width: 100%; text-align: center; }
    }
</style>
</head>
<body>
<div class="app">
    <div class="meta-row"><span class="source-tag">真题來源：高雄市忠孝國小 114-1 期中 · 第三大題第 2 題</span></div>

    <div class="feedback" id="feedback"></div>

<script>
(function () {
    "use strict";

    /* ====================== 關卡資料（真題四道連續關卡） ====================== */
    var TOTAL = 10;
    var LEVELS = [
        {
            id: "melon", emoji: "🍉", name: "西瓜", symbol: "#f-melon",
            q: "從 <span class='crayon-word'>👉 右邊</span> 數起，圈出 <span class='crayon-word'>第 5 顆</span> 西瓜。",
            mode: "ordinal", dir: "right", n: 5,
            explain: "「第 5 顆」是<b>序數</b>，只有 <span class='key-point'>單獨 1 顆</span>！從右邊開始數：1、2、3、4、5 —— 就是它（左邊數來第 6 顆）！",
            trap: "把「第 5 顆」圈成 5 顆？不行喔！「第幾個」永遠只有 1 個。"
        },
        {
            id: "wax", emoji: "🍎", name: "蓮霧", symbol: "#f-wax",
            q: "從 <span class='crayon-word'>👈 左邊</span> 數起，圈出 <span class='crayon-word'>前面 8 顆</span> 蓮霧。",
            mode: "cardinal", dir: "left", n: 8,
            explain: "「前面 8 顆」是<b>數量（基數）</b>，共有 <span class='key-point'>8 顆</span>！要把左邊前面 8 顆<b>全部</b>圈在同一個大圈圈裡！",
            trap: "只圈「第 8 顆」那 1 顆？不行喔！「前面 8 顆」是一整群 8 顆。"
        },
        {
            id: "star", emoji: "⭐", name: "楊桃", symbol: "#f-star",
            q: "從 <span class='crayon-word'>👉 右邊</span> 數起，圈出 <span class='crayon-word'>第 7 顆</span> 楊桃。",
            mode: "ordinal", dir: "right", n: 7,
            explain: "「第 7 顆」是<b>序數</b>，只有 <span class='key-point'>單獨 1 顆</span>！從右邊數：1、2、3、4、5、6、7 —— 就是它（左邊數來第 4 顆）！",
            trap: "「第幾個」只指一顆，圈一堆就掉進陷阱啦！"
        },
        {
            id: "lemon", emoji: "🍋", name: "檸檬", symbol: "#f-lemon",
            q: "從 <span class='crayon-word'>👈 左邊</span> 數起，圈出 <span class='crayon-word'>前面 6 顆</span> 檸檬。",
            mode: "cardinal", dir: "left", n: 6,
            explain: "「前面 6 顆」是<b>數量（基數）</b>，總共有 <span class='key-point'>6 顆</span>！從左邊開始把前面 6 顆全部圈起來！",
            trap: "「前面 6 顆」是一整群 6 顆，不是只有第 6 顆那一顆喔！"
        }
    ];

    /* ====================== 狀態 ====================== */
    var cur = 0;
    var sel = new Set();          // 已圈選的左起索引 (0-based)
    var done = [false, false, false, false];
    var locked = false;           // 破招動畫進行中，鎖定互動
    var demoTimer = null;
    var fruitEls = [];

    var $ = function (id) { return document.getElementById(id); };
    var fruitRow = $("fruitRow"), lassoLayer = $("lassoLayer");

    var dirName = function (dir) { return dir === "left" ? "左邊" : "右邊"; };

    /* ====================== 簡易 WebAudio 音效（零依賴） ====================== */
    var audioCtx = null;
    function beep(freq, dur, type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type || "sine"; o.frequency.value = freq;
            g.gain.setValueAtTime(0.12, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            o.connect(g).connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + dur);
        } catch (e) { /* 靜音環境降級，不阻擋互動 */ }
    }
    var sPop = function () { beep(660, 0.12, "triangle"); };
    var sGood = function () { beep(523, 0.15); setTimeout(function(){ beep(659,0.15); }, 120); setTimeout(function(){ beep(784,0.25); }, 240); };
    var sBad  = function () { beep(220, 0.3, "sawtooth"); };

    /* ====================== 關列 UI ====================== */
    function buildLevelBar() {
        var bar = $("levelBar"); bar.innerHTML = "";
        LEVELS.forEach(function (lv, i) {
            var b = document.createElement("button");
            b.className = "lv-btn" + (i === cur ? " active" : "") + (done[i] ? " done" : "");
            b.innerHTML = "<span class='em'>" + lv.emoji + "</span>關卡 " + (i + 1) + "·" + lv.name;
            b.addEventListener("click", function () { if (!locked) gotoLevel(i); });
            bar.appendChild(b);
        });
    }

    function gotoLevel(i) {
        stopDemo();
        cur = i;
        sel = new Set();
        locked = false;
        hideFeedback();
        $("finalBanner").classList.remove("show");
        $("btnCheck").disabled = true;
        $("btnCheck").textContent = "✅ 確認答案";
        $("btnNext") && $("btnNext").remove();
        buildLevelBar();
        renderQuestion();
        renderFruits();
        updateHUD();
    }

    function renderQuestion() {
        var lv = LEVELS[cur];
        $("qNum").textContent = "關卡 " + (cur + 1);
        $("qText").innerHTML = lv.q;
    }

    function renderFruits() {
        var lv = LEVELS[cur];
        fruitRow.innerHTML = "";
        fruitEls = [];
        for (var i = 0; i < TOTAL; i++) {
            var f = document.createElement("div");
            f.className = "fruit";
            f.setAttribute("role", "button");
            f.setAttribute("aria-label", "第 " + (i + 1) + " 顆" + lv.name);
            f.innerHTML = "<svg viewBox='0 0 100 100'><use href='" + lv.symbol + "'/></svg>" +
                          "<div class='bubble'></div>";
            f.addEventListener("click", function (idx) {
                return function () { toggleFruit(idx); };
            })(i);
            fruitRow.appendChild(f);
            fruitEls.push(f);
        }
        clearLasso();
    }

    /* ====================== 圈選互動 ====================== */
    function toggleFruit(idx) {
        if (locked) return;
        var el = fruitEls[idx];
        el.classList.remove("pop");
        void el.offsetWidth; // 重觸發動畫
        el.classList.add("pop");
        sPop();
        if (sel.has(idx)) { sel.delete(idx); }
        else { sel.add(idx); }
        renderSelState();
    }

    function bubbleNum(idx) {
        var dir = LEVELS[cur].dir;
        return dir === "left" ? idx + 1 : TOTAL - idx;
    }

    function renderSelState() {
        fruitEls.forEach(function (el, idx) {
            var isSel = sel.has(idx);
            el.classList.toggle("sel", isSel);
            var bub = el.querySelector(".bubble");
            if (isSel) {
                bub.textContent = bubbleNum(idx);
                bub.classList.add("show");
                bub.classList.remove("demo");
            } else {
                bub.classList.remove("show");
            }
        });
        drawLasso(Array.from(sel).sort(function (a, b) { return a - b; }));
        updateHUD();
        $("btnCheck").disabled = sel.size === 0 || locked;
    }

    function updateHUD() {
        var hud = $("hud");
        if (sel.size === 0) {
            hud.innerHTML = "還沒圈喔！點水果開始圈圈 👆";
        } else {
            hud.innerHTML = "已圈 <b>" + sel.size + "</b> 顆";
        }
    }

    /* ====================== 蠟筆套索（SVG 手繪圈圈） ====================== */
    function clearLasso() { lassoLayer.innerHTML = ""; }

    function drawLasso(indices) {
        clearLasso();
        if (!indices.length) return;
        var first = fruitEls[indices[0]], last = fruitEls[indices[indices.length - 1]];
        var x1 = first.offsetLeft, x2 = last.offsetLeft + last.offsetWidth;
        var yTop = first.offsetTop, h = first.offsetHeight;
        var cx = (x1 + x2) / 2, cy = yTop + h / 2;
        var rx = (x2 - x1) / 2 + 14, ry = h / 2 + 16;
        var NS = "http://www.w3.org/2000/svg";
        [ { rot: -2, dash: 0 }, { rot: 2.5, dash: 1 } ].forEach(function (cfg, k) {
            var e = document.createElementNS(NS, "ellipse");
            e.setAttribute("cx", cx); e.setAttribute("cy", cy);
            e.setAttribute("rx", rx); e.setAttribute("ry", ry);
            e.setAttribute("transform", "rotate(" + cfg.rot + " " + cx + " " + cy + ")");
            e.setAttribute("fill", "none");
            e.setAttribute("stroke", k === 0 ? "#d62828" : "#e76f51");
            e.setAttribute("stroke-width", k === 0 ? 5 : 3);
            e.setAttribute("stroke-linecap", "round");
            e.setAttribute("filter", "url(#crayonWobble)");
            e.setAttribute("pathLength", "100");
            e.setAttribute("stroke-dasharray", "100");
            e.setAttribute("stroke-dashoffset", "100");
            e.style.animation = "lassoDraw .5s ease forwards";
            e.style.animationDelay = (k * 0.18) + "s";
            lassoLayer.appendChild(e);
        });
    }
    // lassoDraw keyframes（動態注入，避免 inline style keyframes 限制）
    var styleTag = document.createElement("style");
    styleTag.textContent = "@keyframes lassoDraw { to { stroke-dashoffset: 0; } }";
    document.head.appendChild(styleTag);

    /* ====================== 判答 ====================== */
    function expectedSet(lv) {
        var set = [];
        if (lv.mode === "ordinal") {
            var leftIdx = lv.dir === "left" ? lv.n - 1 : TOTAL - lv.n;
            set = [leftIdx];
        } else {
            var start = lv.dir === "left" ? 0 : TOTAL - lv.n;
            for (var i = 0; i < lv.n; i++) set.push(start + i);
        }
        return set;
    }

    function sameSet(a, b) {
        if (a.length !== b.length) return false;
        var bs = new Set(b);
        return a.every(function (x) { return bs.has(x); });
    }

    function checkAnswer() {
        if (locked || sel.size === 0) return;
        var lv = LEVELS[cur];
        var expected = expectedSet(lv);
        var selArr = Array.from(sel).sort(function (a, b) { return a - b; });
        if (sameSet(selArr, expected)) {
            onCorrect(lv);
        } else {
            onWrong(lv, selArr, expected);
        }
    }

    function onCorrect(lv) {
        sGood();
        confetti();
        done[cur] = true;
        buildLevelBar();
        var isLast = done.every(Boolean);
        showFeedback(true,
            "🎉 圈對了！就是這樣！",
            lv.mode === "ordinal"
                ? "「第 " + lv.n + " 顆」只有 <span class='key-point'>1 顆</span>，你圈得真準！"
                : "「前面 " + lv.n + " 顆」共有 <span class='key-point'>" + lv.n + " 顆</span>，一顆都沒漏掉！",
            lv.explain,
            isLast ? null : [{ label: "➡️ 下一關", cls: "btn-next", fn: function () { gotoLevel(cur + 1); } }]
        );
        if (isLast) {
            $("finalBanner").classList.add("show");
            setTimeout(confetti, 400);
            setTimeout(confetti, 900);
        } else {
            setTimeout(function () { if (!locked) gotoLevel(cur + 1); }, 2600); // 自動推進
        }
    }

    function onWrong(lv, selArr, expected) {
        sBad();
        var title, sub;
        if (lv.mode === "ordinal") {
            if (selArr.length > 1) {
                title = "🤔 你圈了 " + selArr.length + " 顆，但「第 " + lv.n + " 顆」只有 <span class='key-point'>1 顆</span>！";
                sub = lv.trap;
            } else {
                title = "🤔 圈到隔壁去了！";
                sub = "再從" + dirName(lv.dir) + "慢慢數一次：1、2、3…數到 " + lv.n + " 就是它！";
            }
        } else {
            if (selArr.length === 1) {
                title = "🤔 你只圈了 1 顆，但「前面 " + lv.n + " 顆」共有 <span class='key-point'>" + lv.n + " 顆</span>！";
                sub = lv.trap;
            } else if (selArr.length < lv.n) {
                title = "🤔 你只圈了 " + selArr.length + " 顆，還有沒圈到的喔！";
                sub = "「前面 " + lv.n + " 顆」要全部圈進來，一共 " + lv.n + " 顆。";
            } else {
                title = "🤔 圈錯位置囉！";
                sub = "要從" + dirName(lv.dir) + "開始數，前面 " + lv.n + " 顆全部圈起來。";
            }
        }
        showFeedback(false, title, sub + "<br><b>想一想：這是「第幾顆」還是「幾顆」呢？</b>", "");
        // 展開破招動畫：自動示範正確數法與圈法
        setTimeout(function () { runDemo(lv, expected); }, 1000);
    }

    /* ====================== 破招動畫：示範正確數法 ====================== */
    function runDemo(lv, expected) {
        stopDemo();
        locked = true;
        sel = new Set();
        renderSelState();
        $("btnCheck").disabled = true;
        // 數數順序：依題目方向依序點亮
        var order = [];
        for (var k = 1; k <= TOTAL; k++) {
            order.push(lv.dir === "left" ? k - 1 : TOTAL - k); // 第 k 個數到的左起索引
        }
        var step = 0;
        demoTimer = setInterval(function () {
            if (step >= order.length) {
                stopDemo();
                // 畫出正確套索並揭曉答案
                fruitEls.forEach(function (el, idx) {
                    el.querySelector(".bubble").classList.remove("show", "demo");
                    el.classList.remove("demo-glow");
                });
                expected.forEach(function (idx) {
                    sel.add(idx);
                    fruitEls[idx].classList.add("sel");
                    var bub = fruitEls[idx].querySelector(".bubble");
                    bub.textContent = bubbleNum(idx);
                    bub.classList.add("show");
                });
                drawLasso(expected.slice().sort(function (a, b) { return a - b; }));
                sGood();
                updateHUD();
                locked = false;
                $("btnCheck").disabled = false;
                var lvNow = LEVELS[cur];
                showFeedback(false,
                    "👀 看清楚了嗎？正確圈法是這樣！",
                    (lvNow.mode === "ordinal"
                        ? "「第 " + lvNow.n + " 顆」只有 <span class='key-point'>1 顆</span>——從" + dirName(lvNow.dir) + "數到 " + lvNow.n + " 的那一顆！"
                        : "「前面 " + lvNow.n + " 顆」共有 <span class='key-point'>" + lvNow.n + " 顆</span>——從" + dirName(lvNow.dir) + "開始整群圈起來！"),
                    lvNow.explain,
                    [{ label: "🔁 懂了！重數一次", cls: "btn-reset", fn: function () { resetRound(); } }]
                );
                return;
            }
            var idx = order[step];
            var el = fruitEls[idx];
            el.classList.add("demo-glow");
            el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
            var bub = el.querySelector(".bubble");
            bub.textContent = step + 1;
            bub.classList.remove("show"); void bub.offsetWidth;
            bub.classList.add("show", "demo");
            sPop();
            step++;
        }, 520);
    }

    function stopDemo() {
        if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
        fruitEls.forEach(function (el) {
            el.classList.remove("demo-glow");
            el.classList.remove("sel");
            var bub = el.querySelector(".bubble");
            if (bub) bub.classList.remove("show", "demo");
        });
        clearLasso();
        sel = new Set();
        updateHUD();
    }

    function resetRound() {
        stopDemo();
        locked = false;
        hideFeedback();
        $("btnCheck").disabled = true;
        $("btnCheck").textContent = "✅ 確認答案";
        $("btnNext") && $("btnNext").remove();
        fruitEls.forEach(function (el) { el.classList.remove("sel", "demo-glow", "pop"); });
        sel = new Set();
        renderSelState();
    }

    /* ====================== 回饋面板 ====================== */
    function showFeedback(good, title, sub, explain, actions) {
        var fb = $("feedback");
        fb.className = "feedback show " + (good ? "good" : "bad");
        var html = "<div class='fb-title'>" + title + "</div>" +
                   "<div class='fb-sub'>" + sub + "</div>";
        if (explain) html += "<div class='fb-explain'>💡 <b>算理破招：</b>" + explain + "</div>";
        if (actions && actions.length) {
            html += "<div class='fb-actions'>";
            actions.forEach(function (a, i) {
                html += "<button class='btn " + (a.cls || "") + "' data-act='" + i + "'>" + a.label + "</button>";
            });
            html += "</div>";
        }
        fb.innerHTML = html;
        if (actions) {
            actions.forEach(function (a, i) {
                var b = fb.querySelector("[data-act='" + i + "']");
                if (b) b.addEventListener("click", a.fn);
                if (a.cls === "btn-next") b.id = "btnNext";
            });
        }
        fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function hideFeedback() {
        var fb = $("feedback");
        fb.className = "feedback";
        fb.innerHTML = "";
    }

    /* ====================== 撒花 ====================== */
    function confetti() {
        var emojis = ["🌟", "🍎", "✨", "🎉", "🍉", "🍋", "⭐", "💛"];
        for (var i = 0; i < 22; i++) {
            var s = document.createElement("span");
            s.className = "confetti";
            s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            s.style.left = (Math.random() * 100) + "vw";
            s.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
            s.style.animationDelay = (Math.random() * 0.5) + "s";
            document.body.appendChild(s);
            setTimeout(function (n) { return function () { n.remove(); }; }(s), 3600);
        }
    }

    /* ====================== 綁定與啟動 ====================== */
    $("btnCheck").addEventListener("click", checkAnswer);
    $("btnReset").addEventListener("click", resetRound);
    window.addEventListener("resize", function () {
        if (sel.size) drawLasso(Array.from(sel).sort(function (a, b) { return a - b; }));
    });

    gotoLevel(0);
})();
</script>
</body>
</html>
