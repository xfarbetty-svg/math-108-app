<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-S-2-2-Q10 展開圖摺疊成正方體</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:3px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:4px 6px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13px; font-weight:800; line-height:1.3; }
.stem small { display:block; font-size:10px; font-weight:700; color:var(--ink-soft); margin-bottom:1px; }
.stage { position:relative; width:100%; height:130px; border-radius:10px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.stage-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:brightness(.92) contrast(1.05); }
.stage-overlay { position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,249,240,.3) 100%); backdrop-filter:blur(1.5px); }
.scene-svg { position:relative; z-index:2; display:block; width:100%; height:100%; }
#gnet { transform-box:fill-box; transform-origin:center; transition:opacity .4s ease; }
#gnet.folded { opacity:0; pointer-events:none; }
#gnet .cell { transform-box:fill-box; transform-origin:center; transition:transform .8s cubic-bezier(.5,0,.4,1); }
#gnet.folded .cell { transform:var(--fold); }
#gcube { transform-box:fill-box; transform-origin:center; opacity:0; transform:scale(.45); transition:opacity .45s ease .9s, transform .6s cubic-bezier(.2,1.4,.4,1) .9s; pointer-events:none; }
#gcube.built { opacity:1; transform:scale(1); }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:4px; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:4px 12px; font-size:11.5px; font-weight:800; cursor:pointer; }
.tool-btn.on { background:var(--mint-deep); color:#fff; }
.status { text-align:center; font-size:11.5px; font-weight:800; color:var(--ink-soft); min-height:16px; margin-top:3px; }
.status b { color:var(--mint-deep); }
.t-lab { font-size:11px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:9px; padding:4px 3px; font-size:12px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border:none; border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); cursor:pointer; }
.result-banner { display:none; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>展開圖摺疊與頂點邊計數</small>將 6 個正方形組成的展開圖摺疊後，會變成什麼形體？有幾個頂點和幾條邊？</p>
  </div>
  <div class="card">
    <div class="stage">
      <img src="../assets/demo/bg_desk.webp" class="stage-bg" alt="書桌背景">
      <div class="stage-overlay"></div>
      <svg class="scene-svg" viewBox="0 0 360 150" role="img" aria-label="正方體展開圖摺疊動畫">
        <ellipse cx="180" cy="120" rx="46" ry="6" fill="rgba(61,58,52,.12)" id="shadowCube" opacity="0"/>
        <!-- 十字型展開圖：6 個 38px 正方形（1-4-1） -->
        <g id="gnet" transform="translate(101,8)">
          <g class="cell" style="--fold:translate(60px,42px) rotate(270deg) scale(.22); transition-delay:0ms">
            <rect x="0" y="48" width="38" height="38" fill="#ffd166" stroke="#fffdf8" stroke-width="1.5"/><text x="19" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(61,58,52,.7)">1</text>
          </g>
          <g class="cell" style="--fold:translate(20px,42px) rotate(-270deg) scale(.22); transition-delay:70ms">
            <rect x="40" y="48" width="38" height="38" fill="#fff2b2" stroke="#fffdf8" stroke-width="1.5"/><text x="59" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(61,58,52,.7)">2</text>
          </g>
          <g class="cell" style="--fold:translate(-20px,42px) rotate(270deg) scale(.22); transition-delay:140ms">
            <rect x="80" y="48" width="38" height="38" fill="#ffd166" stroke="#fffdf8" stroke-width="1.5"/><text x="99" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(61,58,52,.7)">3</text>
          </g>
          <g class="cell" style="--fold:translate(-60px,42px) rotate(-270deg) scale(.22); transition-delay:210ms">
            <rect x="120" y="48" width="38" height="38" fill="#fff2b2" stroke="#fffdf8" stroke-width="1.5"/><text x="139" y="72" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(61,58,52,.7)">4</text>
          </g>
          <g class="cell" style="--fold:translate(20px,84px) rotate(-270deg) scale(.22); transition-delay:280ms">
            <rect x="40" y="6" width="38" height="38" fill="#e6b840" stroke="#fffdf8" stroke-width="1.5"/><text x="59" y="30" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(61,58,52,.7)">5</text>
          </g>
          <g class="cell" style="--fold:translate(20px,0px) rotate(270deg) scale(.22); transition-delay:350ms">
            <rect x="40" y="90" width="38" height="38" fill="#e6b840" stroke="#fffdf8" stroke-width="1.5"/><text x="59" y="114" text-anchor="middle" font-size="10" font-weight="800" fill="rgba(61,58,52,.7)">6</text>
          </g>
        </g>
        <!-- 摺好後的 Isometric 正方體（s=32）：頂面最亮 / 側左中亮 / 側右背光 -->
        <g id="gcube">
          <polygon points="180,40 207.7,56 180,72 152.3,56" fill="#fff2b2" stroke="#fffdf8" stroke-width="1"/>
          <polygon points="152.3,56 180,72 180,104 152.3,88" fill="#ffd166" stroke="#fffdf8" stroke-width="1"/>
          <polygon points="180,72 207.7,56 207.7,88 180,104" fill="#e6b840" stroke="#fffdf8" stroke-width="1"/>
          <line x1="180" y1="40" x2="207.7" y2="56" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="207.7" y1="56" x2="180" y2="72" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="180" y1="72" x2="152.3" y2="56" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="152.3" y1="56" x2="180" y2="40" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="180" y1="72" x2="180" y2="104" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="152.3" y1="56" x2="152.3" y2="88" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="207.7" y1="56" x2="207.7" y2="88" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="152.3" y1="88" x2="180" y2="104" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="180" y1="104" x2="207.7" y2="88" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="180" y1="40" x2="180" y2="72" stroke="rgba(61,58,52,.35)" stroke-width="1.4" stroke-dasharray="3 3"/>
        </g>
        <text x="180" y="146" class="t-lab" id="cap">6 個正方形組成的十字型展開圖</text>
      </svg>
    </div>
    <div class="tools">
      <button type="button" class="tool-btn" id="btnFold">摺疊成正方體 📦</button>
    </div>
    <p class="status" id="status">先看好 6 個正方形的位置，再點按鈕看它摺成什麼形體！</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" type="button" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  // SSOT：data/units/G2/S-2-2.json → G2-S-2-2-Q10（字字對齊，嚴防劇透：未作答前不顯示解析）
  var CHOICES = ['正方體，有 8 個頂點和 12 條邊', '長方體，有 8 個頂點和 10 條邊', '正方體，有 6 個頂點和 8 條邊', '長方體，有 12 個頂點和 6 條邊'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var status = document.getElementById('status');
  var btnFold = document.getElementById('btnFold');
  var gnet = document.getElementById('gnet');
  var gcube = document.getElementById('gcube');
  var cap = document.getElementById('cap');
  var shadow = document.getElementById('shadowCube');
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      banner.className = 'result-banner'; banner.textContent = '';
    });
    optBox.appendChild(b);
  });

  var folded = false;
  btnFold.addEventListener('click', function () {
    folded = !folded;
    btnFold.classList.toggle('on', folded);
    if (folded) {
      gnet.classList.add('folded');
      gcube.classList.add('built');
      shadow.setAttribute('opacity', '1');
      btnFold.textContent = '展開回原狀 ✂️';
      cap.textContent = '摺好了！6 個正方形剛好圍成封閉形體';
      setTimeout(function () {
        if (folded) {
          status.innerHTML = '摺好了！是<b>正方體</b>：8 個頂點、12 條邊、6 個面。';
          say('摺好了，是正方體，八個頂點十二條邊。');
        }
      }, 1450);
    } else {
      gcube.classList.remove('built');
      shadow.setAttribute('opacity', '0');
      gnet.classList.remove('folded');
      btnFold.textContent = '摺疊成正方體 📦';
      cap.textContent = '6 個正方形組成的十字型展開圖';
      status.textContent = '展開圖回到原位，再摺一次看看！';
    }
  });

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！6 個一樣大的正方形沿線摺疊圍成正方體，有 8 個頂點和 12 條邊。';
      say('答對！是正方體。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：6 個一樣大的正方形剛好圍成「正方體」；頂點數和面數沒有對應關係——摺好後是 8 個頂點、12 條邊。';
    say('再想想看，是正方體。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-S-2-2-Q10', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
