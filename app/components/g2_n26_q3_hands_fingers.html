<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-6-Q03 小手手點名陣列</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.hands { text-align: center; }
.hands-title { font-size: 11px; font-weight: 900; color: #d97706; letter-spacing: 2px; margin-bottom: 2px; }
.hand-row { display: flex; justify-content: center; gap: 2px; }
.hand-slot { cursor: pointer; border-radius: 10px; padding: 2px; transition: all 0.15s; }
.hand-slot.lit { background: #fef3c7; box-shadow: 0 0 0 2px #f59e0b; }
.counter-chip {
  display: inline-block; margin-top: 4px; border-radius: 999px; padding: 3px 14px;
  font-size: 12px; font-weight: 900; background: #fef3c7; color: #b45309;
  transition: all 0.2s;
}
.counter-chip.gold { background: #dcfce7; color: #166534; box-shadow: 0 0 0 3px rgba(49, 138, 112, 0.15); }
.reset-btn {
  margin-left: 8px;
  border: 2px solid #d97706;
  background: var(--bg-card);
  color: #d97706;
  border-radius: 999px;
  padding: 2px 12px;
  font-size: 11px;
  font-weight: 900;
  cursor: pointer;
}

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>111-1 內湖 期末 三、5</small>7 隻手一共有幾根手指頭？用乘法算式記作（　）×（　）＝（　）。</p>
  </div>
  <div class="card hands">
    <div class="hands-title">✦ 小手手點名：點一隻手數一次 ✦</div>
    <div class="hand-row" id="hand-row"></div>
    <div><span class="counter-chip" id="counter">點小手開始數：0</span><button type="button" class="reset-btn" id="reset">重新數</button></div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['5 × 7 ＝ 35', '7 × 5 ＝ 35', '5 ＋ 7 ＝ 12', '5 × 6 ＝ 30'];
  var ANSWER = 0;
  var picked = -1;
  var lit = 0;

  var row = document.getElementById('hand-row');
  var counter = document.getElementById('counter');

  function handSVG(l) {
    /* 繪本風小手：手掌 + 5 指展開 */
    var fingerFill = l ? '#fbbf24' : '#fde68a';
    var palmFill = l ? '#f59e0b' : '#fcd9a8';
    var s = '<svg width="46" height="44" viewBox="0 0 46 44">';
    var fx = [8, 15, 22, 29, 36];
    var fh = [16, 21, 23, 21, 16];
    for (var i = 0; i < 5; i++) {
      s += '<rect x="' + (fx[i] - 2.5) + '" y="' + (18 - fh[i]) + '" width="5" height="' + (fh[i] + 3) + '" rx="2.5" fill="' + fingerFill + '" stroke="#b45309" stroke-width="1.2"/>';
    }
    s += '<ellipse cx="22" cy="32" rx="14" ry="10" fill="' + palmFill + '" stroke="#b45309" stroke-width="1.2"/>';
    s += '<text x="22" y="36" font-size="9" font-weight="900" text-anchor="middle" fill="#7c2d12">手' + (l ? '✋' : '') + '</text>';
    s += '</svg>';
    return s;
  }

  function render() {
    var html = '';
    for (var h = 0; h < 7; h++) {
      html += '<div class="hand-slot' + (h < lit ? ' lit' : '') + '" data-i="' + h + '" title="第 ' + (h + 1) + ' 隻手">' + handSVG(h < lit) + '</div>';
    }
    row.innerHTML = html;
    Array.prototype.forEach.call(row.children, function (el) {
      el.addEventListener('click', function () {
        var i = Number(el.getAttribute('data-i'));
        lit = Math.min(7, i + 1);
        render();
        hide();
      });
    });
    if (lit === 0) {
      counter.textContent = '點小手開始數：0';
      counter.className = 'counter-chip';
    } else {
      var total = lit * 5;
      counter.textContent = '點到第 ' + lit + ' 隻手：5 連加 ' + (lit - 1) + ' 次＋5 ＝ ' + total + ' 根';
      counter.className = lit === 7 ? 'counter-chip gold' : 'counter-chip';
      if (lit === 7) counter.textContent = '7 隻手全部點完：35 根手指頭！';
    }
  }

  document.getElementById('reset').addEventListener('click', function () { lit = 0; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！每隻手 5 根手指頭（單位量）寫前面，7 隻手寫後面，記作 5×7＝35 根。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：一手點完是 5，兩手是 10……單位量「每隻手 5 根」要寫在乘號前面，乘號後面寫幾？';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-6-Q03', answer: ANSWER };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
