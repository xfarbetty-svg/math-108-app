<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>G3-N-3-9 咪咪果凍盒概念小教室 · v2.0 五幕靜態打樣</title>
<!--
  G3-N-3-9 簡單分數的加減（同分母）｜咪咪概念小教室 v2.0
  真實認知衝突 ➔ 實物裝盒 ➔ 荒謬對比（12 格 vs 24 格）➔ 口訣定案。
  唯一道具：12 格長方形水晶果凍盒（4 欄 x 3 列）。
  左 48% 咪咪姿態演武／右 52% 向量黑板分鏡。
  驗收：node tests/verify_g3_n39_static.js
-->
<style>
:root {
  --bg: #f4efe6;
  --card: #fffdf8;
  --ink: #3d3a34;
  --ink-soft: #857f73;
  --mint: #7bc9b2;
  --mint-deep: #2f8a70;
  --lemon: #ffd166;
  --gold: #f2b23e;
  --coral: #ff8a65;
  --coral-deep: #e8553a;
  --sky: #8ecae6;
  --line: #ece2d3;
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; padding: 16px 12px 20px;
  overflow-x: hidden;
}

/* ===== 16:9 打樣主視窗：嚴格 48 : 52 ===== */
.stage {
  width: min(1280px, 100%);
  aspect-ratio: 16 / 9;
  display: grid;
  grid-template-columns: 48fr 52fr;
  background: var(--card);
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 18px 48px rgba(120, 92, 46, 0.16);
  position: relative;
}

/* ===== 左 48%：咪咪主持與姿態演武 ===== */
.left-pane {
  position: relative;
  padding: 18px 18px 16px 22px;
  display: flex; flex-direction: column;
  gap: 10px;
  background:
    radial-gradient(120% 90% at 12% 8%, #eef8ef 0%, rgba(238, 248, 239, 0) 62%),
    linear-gradient(160deg, #dcecdf 0%, #cfe4d8 48%, #c3ded3 100%);
  overflow: hidden;
}
.left-pane::before,
.left-pane::after {
  content: ""; position: absolute; border-radius: 50%;
  background: rgba(255, 255, 255, 0.42); pointer-events: none;
}
.left-pane::before { width: 210px; height: 210px; left: -70px; bottom: -60px; }
.left-pane::after { width: 130px; height: 130px; right: -44px; top: -36px; }

.speech {
  position: relative; z-index: 2;
  align-self: flex-start; max-width: 97%;
  background: #fff;
  border: 2px solid #e6f0e6;
  border-radius: 18px 18px 18px 6px;
  padding: 9px 13px;
  font-size: 14.5px; line-height: 1.48; font-weight: 600;
  color: #41503f;
  box-shadow: 0 6px 16px rgba(64, 96, 74, 0.10);
}
.speech .who {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
  color: var(--mint-deep); margin-bottom: 2px;
}
.speech .frac { font-weight: 800; color: #2f8a70; }

.portrait {
  position: relative; z-index: 1;
  flex: 1 1 auto; min-height: 0;
  border-radius: 20px;
  overflow: hidden;
  border: 5px solid #ffffff;
  box-shadow: 0 12px 26px rgba(62, 92, 72, 0.18);
  background: #a9c4ad;
}
.portrait img {
  display: block; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 30%;
  transform: scale(1.03);
  transition: transform 220ms ease, filter 220ms ease;
}
.portrait[data-pose="confused"] img { transform: scale(1.04) rotate(-2deg); object-position: 50% 26%; }
.portrait[data-pose="point"] img { transform: scale(1.07); object-position: 46% 22%; }
.portrait[data-pose="count"] img { transform: scaleX(-1) scale(1.08); object-position: 54% 22%; }
.portrait[data-pose="eureka"] img { transform: scale(1.05); filter: saturate(1.1) brightness(1.05); }
.portrait[data-pose="cheer"] img { transform: scale(1.08); filter: saturate(1.16) brightness(1.03); }

.pose-badge {
  position: absolute; right: 10px; top: 10px;
  display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.94);
  border: 2px solid #ffe0a3;
  font-size: 22px; line-height: 1;
  box-shadow: 0 6px 14px rgba(80, 60, 20, 0.18);
}
.portrait[data-pose="eureka"] .pose-badge {
  background: #fff6cf;
  box-shadow: 0 0 0 6px rgba(255, 214, 94, 0.32), 0 6px 16px rgba(160, 110, 10, 0.24);
}
.portrait[data-pose="cheer"] .pose-badge { animation: none; }
.pose-label {
  position: absolute; right: 10px; top: 57px;
  background: rgba(47, 138, 112, 0.92); color: #fff;
  border-radius: 999px; padding: 3px 9px;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em;
}
.portrait .nameplate {
  position: absolute; left: 10px; bottom: 10px;
  background: rgba(255, 255, 255, 0.94);
  border-radius: 999px; padding: 5px 13px;
  font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em;
  color: #3f6d58;
  box-shadow: 0 3px 10px rgba(40, 70, 52, 0.16);
}
.portrait .nameplate small { font-weight: 600; color: #7d9a8a; font-size: 10px; letter-spacing: 0.14em; }

/* ===== 右 52%：向量黑板演武 ===== */
.right-pane {
  position: relative;
  padding: 16px 22px 14px;
  display: flex; flex-direction: column; align-items: center;
  gap: 9px;
  background:
    linear-gradient(rgba(244, 239, 230, 0) 0%, rgba(244, 239, 230, 0.55) 100%),
    repeating-linear-gradient(0deg, #fffdf8 0 31px, #f6f0e4 31px 32px),
    repeating-linear-gradient(90deg, #fffdf8 0 31px, #f6f0e4 31px 32px);
  background-color: #fffdf8;
  border-left: 2px dashed #e8ddcb;
  overflow: hidden;
}

.shot-tag {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 8px;
  background: #e8f6ef; color: #2f8a70;
  border: 1.5px solid #c6e8da; border-radius: 999px;
  padding: 4px 13px; font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em;
}
.shot-tag .num {
  display: inline-grid; place-items: center;
  width: 19px; height: 19px; border-radius: 50%;
  background: var(--mint-deep); color: #fff; font-size: 11.5px;
}
.board-title {
  font-size: 23px; font-weight: 900; letter-spacing: 0.02em; line-height: 1.25;
  color: #36332d; text-align: center;
}
.board-zone {
  position: relative; width: 100%; flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
}

/* 算式列 */
.equation {
  display: flex; align-items: center; justify-content: center; flex-wrap: nowrap;
  gap: 8px; font-size: 28px; font-weight: 800; line-height: 1;
  color: #3d3a34; white-space: nowrap;
}
.equation .op { font-size: 24px; color: #9a917f; font-weight: 800; }
.equation .qmark {
  display: inline-grid; place-items: center;
  min-width: 44px; height: 44px; padding: 0 8px;
  border-radius: 12px; background: #fff4d6; border: 2.5px dashed var(--gold);
  color: #b8791c; font-size: 25px;
}
.equation .result {
  display: inline-flex; align-items: center; gap: 7px;
  background: linear-gradient(180deg, #ffe9a8, #ffd166);
  border: 2.5px solid #e9a92c; border-radius: 14px;
  padding: 4px 13px; color: #8a4d05;
  box-shadow: 0 4px 0 #e3a52a;
}
.equation .unit { font-size: 21px; font-weight: 900; color: #5b5549; }
.check-ok { font-size: 25px; line-height: 1; }

/* 分數排版 */
.frac {
  display: inline-flex; flex-direction: column; align-items: center;
  vertical-align: middle; line-height: 1.06; font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.frac > span { display: block; padding: 0 0.16em; }
.frac > .den { border-top: 2.5px solid currentColor; padding-top: 0.04em; }

/* Shot 01：兩盤果凍 */
.plate-row { display: flex; align-items: stretch; justify-content: center; gap: 16px; width: 100%; }
.plate-card {
  width: 44%; max-width: 252px;
  background: #fff; border: 2px solid #efe4d2; border-radius: 16px;
  padding: 5px 7px 3px;
  box-shadow: 0 8px 18px rgba(120, 100, 60, 0.10);
}
.plate-card svg { display: block; width: 100%; height: auto; }
.plate-label { text-align: center; font-size: 12.5px; font-weight: 800; color: #6b6254; padding-bottom: 2px; }
.plate-label b { color: #2f8a70; font-size: 14px; }

.peer-bubble {
  width: 100%; max-width: 560px;
  display: flex; align-items: flex-start; gap: 9px;
  background: #eef6ff; border: 2px solid #bcdcf5; border-radius: 16px;
  padding: 8px 13px; color: #2d5573;
  font-size: 13.5px; font-weight: 700; line-height: 1.45;
  box-shadow: 0 6px 14px rgba(60, 100, 140, 0.10);
}
.peer-bubble .peer-avatar {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  background: #d7ecff; display: grid; place-items: center; font-size: 17px;
}
.peer-bubble .peer-name { display: block; font-size: 10.5px; font-weight: 900; letter-spacing: 0.08em; color: #4d7fa5; }
.peer-bubble p { margin: 0; }
.peer-bubble .frac { font-size: 18px; color: #d9361c; margin: 0 2px; }

/* Shot 02：入盒標註 */
.unit-note {
  display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap;
  background: #fff8e6; border: 2px solid #f3d58b; border-radius: 14px;
  padding: 7px 16px; font-size: 16px; font-weight: 800; color: #8a5a12;
}
.unit-note .frac { color: #c2701a; font-size: 19px; }
.unit-note b { color: #2f8a70; }

/* 果凍盒 */
.box-stage { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.jelly-box {
  width: 100%; max-width: 470px; height: auto;
  filter: drop-shadow(0 12px 18px rgba(120, 150, 170, 0.18));
}
.jelly-box .glass { fill: rgba(255, 255, 255, 0.72); stroke: #b8d9e8; stroke-width: 2.5; }
.jelly-box .glass-shine { fill: #ffffff; opacity: 0.55; }
.jelly-box .unit-label { font-size: 10px; font-weight: 800; fill: #a8801f; text-anchor: middle; }
.jelly-box .count-path { fill: none; stroke: #e07b2a; stroke-width: 3; stroke-dasharray: 6 5; opacity: 0.85; }
.jelly-box .count-label circle { fill: #2f8a70; stroke: #fff; stroke-width: 2; }
.jelly-box .count-label text { fill: #fff; font-size: 13px; font-weight: 900; text-anchor: middle; }

.count-legend {
  display: inline-flex; align-items: center; gap: 5px;
  background: #eef8f3; border: 1.5px solid #bfe3d3; border-radius: 999px;
  padding: 4px 14px; font-size: 13px; font-weight: 800; color: #2f8a70;
}
.count-legend .dot { color: #e07b2a; font-weight: 900; }

/* Shot 04：12 格 vs 24 格荒謬對比 */
.compare-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.compare-card {
  position: relative; width: 43%; max-width: 268px;
  background: #fff; border: 2px solid #e9dfcf; border-radius: 16px;
  padding: 7px 7px 5px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  box-shadow: 0 8px 18px rgba(120, 100, 60, 0.10);
}
.compare-card.fake { border-color: #f3b6a8; background: #fff7f5; }
.compare-card svg { display: block; width: 100%; height: auto; }
.compare-card figcaption { font-size: 12px; font-weight: 800; color: #6b6254; }
.compare-card.fake figcaption { color: #b04b31; }
.spec-chip {
  position: absolute; top: 5px; right: 5px;
  background: #2f8a70; color: #fff; border-radius: 999px;
  padding: 2px 9px; font-size: 11px; font-weight: 900;
}
.spec-chip.danger { background: #d9361c; }
.vs-badge {
  display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 50%;
  background: #f4efe6; border: 2px solid #e3d8c6;
  color: #9a917f; font-size: 12px; font-weight: 900;
}
.fake-x {
  position: absolute; left: 50%; top: 52%;
  width: 66%; height: auto; transform: translate(-50%, -50%);
  pointer-events: none;
}
.fake-x line { stroke: #e8270c; stroke-width: 10; stroke-linecap: round; }
.cracks { position: absolute; left: 50%; top: 52%; width: 78%; height: auto; transform: translate(-50%, -50%); pointer-events: none; }
.cracks polyline { fill: none; stroke: #f0683f; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.compare-note {
  font-size: 13.5px; font-weight: 800; color: #b04b31;
  background: #fff1ec; border: 1.5px solid #f6cbbf; border-radius: 999px;
  padding: 4px 14px;
}

/* Shot 05：定案與金牌 */
.gold-plaque {
  display: inline-flex; align-items: center; gap: 7px;
  background: linear-gradient(180deg, #ffe9a8, #ffcf5c);
  border: 2.5px solid #e9a92c; border-radius: 999px;
  padding: 7px 20px; font-size: 17px; font-weight: 900; color: #7d4604;
  box-shadow: 0 5px 0 #e3a52a, 0 10px 20px rgba(190, 140, 30, 0.22);
}
.gold-plaque .medal { font-size: 19px; }
.stage[data-shot="5"] .jelly-box .glass { stroke: #f3d27c; stroke-width: 3; }
.stage[data-shot="5"] .jelly-box .jelly-ring { opacity: 1; }
.stage[data-shot="5"] .jelly-box .jelly-body { filter: drop-shadow(0 0 8px rgba(255, 196, 40, 0.95)); }
.stage[data-shot="4"] #jelly-box .glass { stroke: #7bc9b2; stroke-width: 3; }
.stage[data-shot="4"] .compare-card.fake .jelly-box { opacity: 0.55; filter: grayscale(0.35); }

.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; width: 9px; height: 9px; border-radius: 2px; opacity: 0.9; }

/* 底部幕次切換 */
.shot-nav {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  margin-top: 12px; max-width: 1280px;
}
.shot-nav button {
  font-family: inherit; cursor: pointer;
  border: 2px solid #e3d8c6; background: #fffdf8; color: #7a7264;
  border-radius: 999px; padding: 7px 15px; font-size: 13.5px; font-weight: 800;
  letter-spacing: 0.02em;
}
.shot-nav button:hover { border-color: #bfdccf; color: #2f8a70; }
.shot-nav button[aria-current="true"] {
  background: #2f8a70; border-color: #2f8a70; color: #fff;
  box-shadow: 0 4px 12px rgba(47, 138, 112, 0.28);
}

@media (max-width: 900px) {
  .stage { border-radius: 18px; }
  .left-pane { padding: 13px 12px 12px 14px; gap: 8px; }
  .speech { font-size: 12px; padding: 7px 10px; border-radius: 14px 14px 14px 5px; }
  .portrait { border-width: 4px; }
  .pose-badge { width: 32px; height: 32px; font-size: 17px; right: 7px; top: 7px; }
  .pose-label { font-size: 9px; right: 7px; top: 43px; padding: 2px 7px; }
  .right-pane { padding: 11px 12px 10px; gap: 7px; }
  .board-title { font-size: 17.5px; }
  .equation { font-size: 21px; gap: 5px; }
  .equation .qmark { min-width: 33px; height: 33px; font-size: 19px; border-radius: 9px; }
  .equation .unit { font-size: 16px; }
  .plate-row { gap: 8px; }
  .plate-card { padding: 3px 5px 2px; border-radius: 12px; }
  .plate-label { font-size: 10.5px; }
  .peer-bubble { font-size: 11px; padding: 6px 9px; gap: 6px; }
  .peer-bubble .peer-avatar { width: 24px; height: 24px; font-size: 14px; }
  .unit-note { font-size: 12.5px; padding: 5px 10px; }
  .unit-note .frac { font-size: 15px; }
  .jelly-box { max-width: 380px; }
  .count-legend { font-size: 11px; padding: 3px 10px; }
  .compare-card { padding: 5px 5px 3px; border-radius: 12px; }
  .compare-card figcaption { font-size: 10px; }
  .spec-chip { font-size: 9px; padding: 1px 7px; }
  .vs-badge { width: 26px; height: 26px; font-size: 10px; }
  .compare-note { font-size: 11px; padding: 3px 10px; }
  .gold-plaque { font-size: 13px; padding: 5px 14px; }
  .shot-nav button { padding: 6px 11px; font-size: 12px; }
  .shot-tag { font-size: 10.5px; padding: 3px 9px; }
}
@media (max-width: 560px) {
  body { padding: 8px 6px 14px; }
  .stage { aspect-ratio: auto; min-height: 500px; grid-template-columns: 1fr; grid-template-rows: 32% 68%; }
  .right-pane { border-left: none; border-top: 2px dashed #e8ddcb; }
  .jelly-box { max-width: 330px; }
}
</style>
</head>
<body>
  <div class="stage" id="stage" data-shot="1" data-pose="confused">
    <section class="left-pane" aria-label="咪咪角色區">
      <div class="speech" id="speech">
        <span class="who">咪咪 MIMI</span>
        <span id="speech-text"></span>
      </div>
      <div class="portrait" id="portrait" data-pose="confused">
        <img id="mimi" alt="咪咪立繪" draggable="false">
        <div class="pose-badge" id="pose-badge" aria-hidden="true">？</div>
        <span class="pose-label" id="pose-label">困惑</span>
        <span class="nameplate">咪咪 <small>MIMI</small></span>
      </div>
    </section>

    <section class="right-pane" aria-label="果凍盒與算式區">
      <div class="shot-tag" id="shot-tag"><span class="num">1</span><span id="shot-tag-text">直覺的陷阱</span></div>
      <h1 class="board-title" id="board-title">直覺的陷阱</h1>
      <div id="board-slot" class="board-zone"></div>
    </section>
  </div>

  <nav class="shot-nav" id="shot-nav" aria-label="幕次切換">
    <button type="button" data-shot-btn="1">① 直覺的陷阱</button>
    <button type="button" data-shot-btn="2">② 建立基準</button>
    <button type="button" data-shot-btn="3">③ 動態累加</button>
    <button type="button" data-shot-btn="4">④ 痛擊迷思</button>
    <button type="button" data-shot-btn="5">⑤ 算理大成</button>
  </nav>

<script>
(function () {
  'use strict';

  window.__N39_VERSION__ = '2.0';

  /* ---------- 唯一道具：12 格（4 欄 x 3 列）水晶果凍盒幾何 ---------- */
  var COLS = 4, ROWS = 3, CELLS = COLS * ROWS; // 12
  var VB_W = 440, VB_H = 330;
  var PAD = 10, GAP = 12;
  var CELL_W = (VB_W - PAD * 2 - (COLS - 1) * GAP) / COLS;   // 96
  var CELL_H = (VB_H - PAD * 2 - (ROWS - 1) * GAP) / ROWS;   // 95.33

  var BASE_COLORS = ['#ff8fb1', '#ffab63', '#ffd95e'];                  // 左盤原有 3 顆（粉橘黃）

                      '#9fe0d0', '#f7b267', '#b0a4ff'];

  /* ---------- v2.0 五幕：姿態曲線與台詞 ---------- */
  var SHOTS = {
    1: {

      pose: 'confused',

    },
    2: {

      title: '12 格果凍盒出場',
      pose: 'point',
      poseLabel: '指盒',
      badge: '👈',
      speech: '看！這是一個 12 格的果凍盒，放進 3 顆，就是 3 個十二分之一，也就是十二分之三盒。'
    },
    3: {

      title: '一顆一顆放進去',
      pose: 'count',
      poseLabel: '數數',
      badge: '🔢',
      speech: '現在把另外 7 顆也放進同一個盒子裡……一顆、兩顆……加上原來的，一共放了 10 顆！'
    },
    4: {
      name: '痛擊迷思',
      title: '桌上的盒子根本沒有變成 24 格呀！',
      pose: 'eureka',
      poseLabel: '頓悟',
      badge: '💡',
      speech: '你看！裝完 10 顆，盒子還是眼前這個 12 格的盒子，根本沒有變成 24 格呀！分母是盒子的規格，絕對不能相加！'
    },
    5: {

    }
  };

  var MIMI_IMG = {
    confused: '../assets/characters/g3_mimi/mimi_speaking_1024.png',
    point: '../assets/characters/g3_mimi/mimi_ready_point_1024.png',
    count: '../assets/characters/g3_mimi/mimi_ready_point_1024.png',
    eureka: '../assets/characters/g3_mimi/mimi_speaking_1024.png',
    cheer: '../assets/characters/g3_mimi/mimi_speaking_1024.png'
  };

  /* ---------- SVG 小工具 ---------- */
  function cellXY(i, cols, cellW, cellH, gap, pad) {
    var col = i % cols, row = Math.floor(i / cols);
    return { x: pad + col * (cellW + gap), y: pad + row * (cellH + gap) };
  }

  function frac(n, d) {
    return '<span class="frac"><span class="num">' + n + '</span><span class="den">' + d + '</span></span>';
  }

  function shade(hex, amt) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r + 255 * amt)));
    g = Math.max(0, Math.min(255, Math.round(g + 255 * amt)));
    b = Math.max(0, Math.min(255, Math.round(b + 255 * amt)));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  /* ---------- 果凍盒：12 格（4x3）或 24 格（6x4） ---------- */
  function buildBox(opt) {
    var cols = opt.cols || COLS;
    var rows = opt.rows || ROWS;
    var total = cols * rows;
    var filled = opt.filled || 0;
    var vbW = cols === 4 ? VB_W : 660;
    var vbH = rows === 3 ? VB_H : 440;
    var pad = 10;
    var gap = cols === 4 ? 12 : 10;
    var cellW = (vbW - pad * 2 - (cols - 1) * gap) / cols;
    var cellH = (vbH - pad * 2 - (rows - 1) * gap) / rows;
    var id = opt.id || 'jelly-box';
    var defs = [];
    var body = [];
    var countIdx = 0;

    if (opt.countFrom) {
      var pts = [];
      for (var c = opt.countFrom - 1; c < filled; c++) {
        var pc = cellXY(c, cols, cellW, cellH, gap, pad);
        pts.push((pc.x + cellW / 2).toFixed(1) + ',' + (pc.y + cellH / 2).toFixed(1));
      }
      if (pts.length > 1) {
        body.push('<polyline class="count-path" data-count-path="1" points="' + pts.join(' ') + '"/>');
      }
    }

    for (var i = 0; i < total; i++) {
      var p = cellXY(i, cols, cellW, cellH, gap, pad);
      var isFilled = i < filled;
      body.push('<g class="cell" data-cell="' + i + '">');
      body.push('<rect class="glass" x="' + p.x + '" y="' + p.y + '" width="' + cellW + '" height="' + cellH + '" rx="14"/>');
      body.push('<rect class="glass-shine" x="' + (p.x + 12) + '" y="' + (p.y + 10) + '" width="' + (cellW - 24) + '" height="9" rx="4.5"/>');
      if (isFilled) {
        var color = i < 3 ? BASE_COLORS[i] : ADDED_COLORS[(i - 3) % ADDED_COLORS.length];
        var gid = id + '-jg' + i;
        defs.push('<linearGradient id="' + gid + '" x1="0" y1="0" x2="0.35" y2="1">' +
          '<stop offset="0%" stop-color="' + color + '"/>' +
          '<stop offset="58%" stop-color="' + color + '"/>' +
          '<stop offset="100%" stop-color="' + shade(color, -0.16) + '"/>' +
          '</linearGradient>');
        body.push('<g class="jelly-group" data-jelly="' + i + '">');
        body.push('<rect class="jelly-ring" x="' + (p.x + 7) + '" y="' + (p.y + 7) + '" width="' + (cellW - 14) + '" height="' + (cellH - 14) + '" rx="20" fill="none" stroke="#ffd44d" stroke-width="3" opacity="0"/>');
        body.push('<rect class="jelly-body' + (opt.glow ? ' gold-glow' : '') + '" x="' + (p.x + 8) + '" y="' + (p.y + 9) + '" width="' + (cellW - 16) + '" height="' + (cellH - 18) + '" rx="19" fill="url(#' + gid + ')"/>');
        body.push('<ellipse cx="' + (p.x + 34) + '" cy="' + (p.y + 32) + '" rx="11" ry="6.5" fill="#ffffff" opacity="0.62"/>');
        body.push('<ellipse cx="' + (p.x + 60) + '" cy="' + (p.y + 22) + '" rx="4" ry="2.6" fill="#ffffff" opacity="0.45"/>');
        body.push('</g>');
      }
      if (opt.unitLabels && isFilled) {
        body.push('<text class="unit-label" x="' + (p.x + cellW / 2) + '" y="' + (p.y + cellH - 12) + '">1/12</text>');
      }
      if (opt.countFrom) {
        if (i >= opt.countFrom - 1 && i < filled) {
          countIdx += 1;
          body.push('<g class="count-label" data-count="' + (i + 1) + '">' +
            '<circle cx="' + (p.x + 19) + '" cy="' + (p.y + 19) + '" r="13"/>' +
            '<text x="' + (p.x + 19) + '" y="' + (p.y + 24) + '">' + (i + 1) + '</text></g>');
        }
      }
      body.push('</g>');
    }
    return '<svg class="jelly-box' + (opt.cls ? ' ' + opt.cls : '') + '" id="' + id + '" data-filled="' + filled +
      '" data-cols="' + cols + '" data-rows="' + rows + '" viewBox="0 0 ' + vbW + ' ' + vbH +
      '" role="img" aria-label="' + (cols * rows) + ' 格長方形水晶果凍盒，其中 ' + filled + ' 格有果凍">' +
      '<defs>' + defs.join('') + '</defs>' + body.join('') + '</svg>';
  }

  /* ---------- 果凍小圖（Shot 01 兩盤） ---------- */
  function jellyBlob(cx, cy, color, idx) {
    var gid = 'plate-jg' + idx;
    return '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0.3" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '"/><stop offset="100%" stop-color="' + shade(color, -0.14) + '"/>' +
      '</linearGradient></defs>' +
      '<g class="plate-jelly" data-jelly="' + idx + '">' +
      '<ellipse cx="' + cx + '" cy="' + (cy + 3) + '" rx="19" ry="14" fill="' + shade(color, -0.3) + '" opacity="0.28"/>' +
      '<ellipse cx="' + cx + '" cy="' + cy + '" rx="18" ry="14" fill="url(#' + gid + ')" stroke="#ffffff" stroke-width="1.4"/>' +
      '<ellipse cx="' + (cx - 6) + '" cy="' + (cy - 5) + '" rx="5.5" ry="3.2" fill="#ffffff" opacity="0.65"/>' +
      '</g>';
  }

  function buildPlate(count, side) {
    var c = side === 'left' ? BASE_COLORS : ADDED_COLORS;
    var positions = side === 'left'
      ? [[104, 64], [136, 83], [104, 100]]
      : [[84, 55], [120, 48], [156, 57], [102, 78], [138, 78], [120, 102], [172, 88]];
    var g = '';
    for (var i = 0; i < count; i++) {
      g += jellyBlob(positions[i][0], positions[i][1], c[i % c.length], (side === 'left' ? 'L' : 'R') + i);
    }
    return '<div class="plate-card" data-plate="' + side + '" data-count="' + count + '">' +
      '<svg viewBox="0 0 240 150" role="img" aria-label="' + (side === 'left' ? '左' : '右') + '盤 ' + count + ' 顆果凍">' +
      '<ellipse cx="120" cy="92" rx="104" ry="47" fill="#ffffff" stroke="#d9ecf5" stroke-width="2.5"/>' +
      '<ellipse cx="120" cy="88" rx="93" ry="38" fill="#f2fbff" stroke="#e3f2fa" stroke-width="2"/>' +
      g + '</svg>' +
      '<div class="plate-label">' + (side === 'left' ? '左盤' : '右盤') + ' <b>' + count + '</b> 顆</div>' +
      '</div>';
  }

  /* ---------- 各幕右側黑板內容（v2.0 分鏡） ---------- */
  function boardHTML(shot) {
    if (shot === 1) {
      return '<div class="equation" id="equation">' + frac(3, 12) +
          '<span class="op">＋</span>' + frac(7, 12) +
          '<span class="op">＝</span><span class="qmark">?</span></div>' +
        '<div class="plate-row">' + buildPlate(3, 'left') + buildPlate(7, 'right') + '</div>' +
        '<div class="peer-bubble" data-myth="1024">' +
          '<span class="peer-avatar" aria-hidden="true">🙋</span>' +
          '<div><span class="peer-name">小夥伴搶答</span>' +
          '<p>我知道！3＋7＝10，12＋12＝24，答案是 ' + frac(10, 24) + ' 盒！</p></div>' +
        '</div>';
    }
    if (shot === 2) {
      return '<div class="box-stage">' + buildBox({ filled: 3, unitLabels: true }) + '</div>' +
        '<div class="unit-note">這是 <b>3 個</b> ' + frac(1, 12) + ' 盒，也就是 ' + frac(3, 12) + ' 盒</div>';
    }
    if (shot === 3) {
      return '<div class="box-stage">' + buildBox({ filled: 10, countFrom: 4 }) + '</div>' +
        '<div class="count-legend">點數軌跡 <span class="dot">4 → 5 → 6 → 7 → 8 → 9 → 10</span>，盒子裡一共 10 顆</div>';
    }
    if (shot === 4) {
      var real = buildBox({ filled: 10 });
      var fake = buildBox({ cols: 6, rows: 4, filled: 10, id: 'fake-box', cls: 'fake-box' });
      return '<div class="compare-row">' +
          '<figure class="compare-card real" data-compare="real">' +
            '<span class="spec-chip">12 格</span>' +
            real +
            '<figcaption>桌上真實的盒子（裝 10 顆）</figcaption>' +
          '</figure>' +
          '<div class="vs-badge" aria-hidden="true">VS</div>' +
          '<figure class="compare-card fake" data-compare="fake">' +
            '<span class="spec-chip danger">24 格</span>' +
            fake +
            '<svg class="fake-x" id="fake-x" viewBox="0 0 100 100" aria-hidden="true">' +
              '<line x1="14" y1="14" x2="86" y2="86"/><line x1="86" y1="14" x2="14" y2="86"/>' +
            '</svg>' +
            '<svg class="cracks" viewBox="0 0 200 130" aria-hidden="true">' +
              '<polyline data-crack="1" points="18,52 34,60 26,74 42,82"/>' +
              '<polyline data-crack="2" points="182,40 166,50 176,64 158,72"/>' +
              '<polyline data-crack="3" points="96,118 108,104 98,92 112,80"/>' +
            '</svg>' +
            '<figcaption>虛構的巨無霸大盒子（裝 10 顆）</figcaption>' +
          '</figure>' +
        '</div>' +
        '<div class="compare-note">12 格就是 12 格，分母是盒子的規格，不能相加！</div>';
    }
    return '<div class="equation final" id="equation">' + frac(3, 12) +
        '<span class="op">＋</span>' + frac(7, 12) +
        '<span class="op">＝</span>' + frac('3+7', 12) +
        '<span class="op">＝</span><span class="result">' + frac(10, 12) + '<span class="unit">盒</span></span>' +
        '<span class="check-ok" aria-label="正確">✅</span></div>' +
      '<div class="box-stage">' + buildBox({ filled: 10, glow: true }) + '</div>' +
      '<div class="gold-plaque"><span class="medal" aria-hidden="true">🏅</span>盒子沒變大，分母就不動！</div>' +
      confettiHTML();
  }

  function confettiHTML() {
    var colors = ['#ff8fb1', '#ffd166', '#8fd8b0', '#7fc8ef', '#c9a2ef', '#ffab63'];
    var out = '<div class="confetti" aria-hidden="true">';
    for (var i = 0; i < 18; i++) {
      var left = (i * 37 + 11) % 96;
      var top = (i * 53 + 7) % 92;
      var rot = (i * 37) % 180;
      out += '<i style="left:' + left + '%;top:' + top + '%;background:' + colors[i % colors.length] +
        ';transform:rotate(' + rot + 'deg)"></i>';
    }
    return out + '</div>';
  }

  /* ---------- 幕次切換 ---------- */
  var stage = document.getElementById('stage');
  var slot = document.getElementById('board-slot');
  var speechText = document.getElementById('speech-text');
  var mimi = document.getElementById('mimi');
  var portrait = document.getElementById('portrait');
  var poseBadge = document.getElementById('pose-badge');
  var poseLabel = document.getElementById('pose-label');
  var tagNum = document.querySelector('#shot-tag .num');
  var tagText = document.getElementById('shot-tag-text');
  var title = document.getElementById('board-title');

  function render(shot) {
    var cfg = SHOTS[shot];
    stage.dataset.shot = String(shot);
    stage.dataset.pose = cfg.pose;
    portrait.dataset.pose = cfg.pose;
    slot.innerHTML = boardHTML(shot);
    speechText.textContent = cfg.speech;
    poseBadge.textContent = cfg.badge;
    poseLabel.textContent = cfg.poseLabel;
    tagNum.textContent = String(shot);
    tagText.textContent = cfg.name;
    title.textContent = cfg.title;
    var src = MIMI_IMG[cfg.pose];
    if (mimi.getAttribute('src') !== src) mimi.setAttribute('src', src);
    Array.prototype.forEach.call(document.querySelectorAll('[data-shot-btn]'), function (b) {
      b.setAttribute('aria-current', Number(b.dataset.shotBtn) === shot ? 'true' : 'false');
    });
    window.__N39_SHOT__ = shot;
  }

  function shotFromUrl() {
    var m = /[?&]shot=([1-5])\b/.exec(location.search);
    if (m) return Number(m[1]);
    var h = /#shot-?([1-5])\b/.exec(location.hash);
    return h ? Number(h[1]) : 1;
  }

  document.getElementById('shot-nav').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-shot-btn]');
    if (!btn) return;
    render(Number(btn.dataset.shotBtn));
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      var next = window.__N39_SHOT__ + (e.key === 'ArrowRight' ? 1 : -1);
      if (next >= 1 && next <= 5) render(next);
    }
  });

  render(shotFromUrl());

  /* ---------- 就緒訊號（截圖腳本等待） ---------- */
  function markReady() {
    window.__N39_READY__ = true;
    document.documentElement.dataset.ready = 'true';
  }
  var imgOk = mimi.complete && mimi.naturalWidth > 0;
  if (imgOk) markReady();
  else mimi.addEventListener('load', markReady, { once: true });
  mimi.addEventListener('error', function () {
    window.__N39_IMG_ERROR__ = true;
    markReady();
  }, { once: true });
})();
</script>
</body>
</html>
