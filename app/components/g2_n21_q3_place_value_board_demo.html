<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-1-Q03 定位板記數</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --coral:#ff8a65; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:8px 10px 14px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:15px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.board { display:grid; grid-template-columns:repeat(3,1fr); border:2px solid var(--ink); border-radius:10px; overflow:hidden; }
.col + .col { border-left:2px solid var(--ink); }
.col-hd { background:var(--lemon); font-size:12.5px; font-weight:800; text-align:center; padding:4px 0; border-bottom:2px solid var(--ink); }
.col-body { min-height:66px; padding:4px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px; }
.hundred { width:24px; height:24px; border:1.5px solid var(--ink); background:var(--mint); border-radius:3px; display:grid; grid-template:repeat(2,1fr)/repeat(2,1fr); }
.hundred i { border:0.5px solid rgba(0,0,0,.3); }
.tenbar { width:24px; height:7px; border:1.5px solid var(--ink); background:var(--coral); border-radius:2px; }
.one { width:8px; height:8px; border:1.5px solid var(--ink); background:var(--lemon); border-radius:2px; }
.ones-row { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; justify-items:center; margin-top:4px; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:6px 8px; font-size:12px; font-weight:800; color:var(--ink); text-align:left; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:8px 30px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>112-1 內湖 期中 二、3</small>2 個百、7 個十和 8 個一合起來是（　　）。在定位板上記作：</p>
  </div>
  <div class="card">
    <div class="board">
      <div class="col"><div class="col-hd">百位</div><div class="col-body" id="c100"></div></div>
      <div class="col"><div class="col-hd">十位</div><div class="col-body" id="c10"></div></div>
      <div class="col"><div class="col-hd">個位</div><div class="col-body"><div class="ones-row" id="c1"></div></div></div>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var hundred = '<div class="hundred"><i></i><i></i><i></i><i></i></div>';
  document.getElementById('c100').innerHTML = hundred.repeat(2);
  document.getElementById('c10').innerHTML = '<div class="tenbar"></div>'.repeat(7);
  var one = '<div class="one"></div>';
  document.getElementById('c1').innerHTML = one.repeat(4) + one.repeat(4);
  var CHOICES = [
    '278，百位記 2、十位記 7、個位記 8',
    '287，百位記 2、十位記 8、個位記 7',
    '270，百位記 2、十位記 7、個位記 0',
    '728，百位記 7、十位記 2、個位記 8'
  ];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！百位寫 2、十位寫 7、個位寫 8，合起來就是 278。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：先數百位有幾板，再數十位有幾條，最後數個位有幾個小方塊，一個位置一個數字。';
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-1-Q03', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
