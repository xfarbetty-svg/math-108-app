<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>比較型：操場比一比</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #eff6ff;
            color: #0f172a;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #bfdbfe;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; color: #1e293b; }
        /* 390px 手機 One-Screen：單張 SVG viewBox 450x220，兩列對齊不再 flex-wrap 斷行 */
        .playground {
            border: 2px solid #93c5fd;
            border-radius: 14px;
            background: #f8fafc;
            padding: 6px;
            margin-bottom: 14px;
        }
        .playground svg { display: block; width: 100%; height: auto; }
        .kid { cursor: pointer; user-select: none; transition: transform 0.25s ease; }
        .badge-g { display: none; }
        .kid.counted .badge-g { display: block; }
        .lasso {
            fill: none;
            stroke: #dc2626;
            stroke-width: 3;
            stroke-dasharray: 7 5;
            stroke-linecap: round;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .kid.leftover .lasso { opacity: 1; }
        .pair-note { text-align: center; font-size: 1.1rem; font-weight: 800; color: #1d4ed8; min-height: 1.6em; margin-bottom: 10px; }
        .action-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
        .pair-btn {
            min-height: 44px;
            background: #2563eb;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 10px 26px;
            cursor: pointer;
        }
        .pair-btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
        .reset-btn {
            min-height: 44px;
            background: #ffffff;
            color: #334155;
            font-size: 1rem;
            font-weight: 700;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .opt-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .opt-btn {
            min-height: 44px;
            background: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            color: #334155;
            padding: 8px 14px;
        }
        .opt-btn.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
        .footer-action { display: flex; justify-content: center; margin-top: 12px; }
        .check-btn {
            background: #0f172a;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .result-banner {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            display: none;
        }
        .result-banner.success { display: block; background: #dcfce7; color: #166534; }
        .result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">忠孝 114-1 期末 九、2</span>
    </div>

    <div class="stem">操場上有 8 個人：5 個男生、3 個女生，男生比女生多幾個人？</div>

    <div class="playground">
        <svg id="yardSvg" viewBox="0 0 450 220" role="img" aria-label="操場比一比教具"></svg>
    </div>

    <div class="pair-note" id="pairNote">按「一對一配對」，1 個男生牽 1 個女生！</div>

    <div class="action-row">
        <button class="pair-btn" id="pairBtn" onclick="pairOne()">🤝 一對一配對（下一對）</button>
        <button class="reset-btn" onclick="resetAll()">重來</button>
    </div>

    <div class="opt-group" id="opts"></div>

    <div class="footer-action">
        <button class="check-btn" onclick="check()">檢查答案</button>
    </div>
    <div class="result-banner" id="resultBanner"></div>
</div>

<script>
    const SVGNS = 'http://www.w3.org/2000/svg';

    // 小朋友（SVG 使用者座標系繪製，腳底為群組原點，身高約 82 單位）
    const boyArt = `
        <g class="anim-g">
            <ellipse cx="0" cy="1" rx="16" ry="3.5" fill="#e2e8f0"/>
            <path d="M-7 -26 L-10 0 M7 -26 L10 0" stroke="#1e40af" stroke-width="5" stroke-linecap="round"/>
            <rect x="-12" y="-52" width="24" height="27" rx="7" fill="#60a5fa" stroke="#0f172a" stroke-width="1.8"/>
            <circle class="head" cx="0" cy="-66" r="10.5" fill="#fcd34d" stroke="#0f172a" stroke-width="1.8"/>
            <path d="M-10.5 -70 Q0 -81 10.5 -70 L10.5 -74 Q0 -84 -10.5 -74 Z" fill="#2563eb" stroke="#0f172a" stroke-width="1.2"/>
            <circle cx="-3.5" cy="-67" r="1.4" fill="#0f172a"/>
            <circle cx="3.5" cy="-67" r="1.4" fill="#0f172a"/>
            <path d="M-3.5 -62 Q0 -59.5 3.5 -62" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
            <ellipse class="lasso" cx="0" cy="-38" rx="26" ry="40"/>
            <g class="badge-g">
                <circle cy="-88" r="9.5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
                <text class="badge-num" y="-84.5" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff"></text>
            </g>
        </g>`;

    const girlArt = `
        <g class="anim-g">
            <ellipse cx="0" cy="1" rx="16" ry="3.5" fill="#e2e8f0"/>
            <path d="M-7 -26 L-10 0 M7 -26 L10 0" stroke="#be185d" stroke-width="5" stroke-linecap="round"/>
            <rect x="-12" y="-52" width="24" height="27" rx="7" fill="#f9a8d4" stroke="#0f172a" stroke-width="1.8"/>
            <circle class="head" cx="0" cy="-66" r="10.5" fill="#fbcfe8" stroke="#0f172a" stroke-width="1.8"/>
            <path d="M-10 0 L-16 -14 M10 0 L16 -14" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M-10.5 -64 Q-13 -80 0 -78 Q13 -80 10.5 -64 Q6 -73 0 -73 Q-6 -73 -10.5 -64 Z" fill="#ec4899" stroke="#0f172a" stroke-width="1.2"/>
            <circle cx="-3.5" cy="-67" r="1.4" fill="#0f172a"/>
            <circle cx="3.5" cy="-67" r="1.4" fill="#0f172a"/>
            <path d="M-3.5 -62 Q0 -59.5 3.5 -62" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
            <ellipse class="lasso" cx="0" cy="-38" rx="26" ry="40"/>
            <g class="badge-g">
                <circle cy="-88" r="9.5" fill="#be185d" stroke="#ffffff" stroke-width="1.5"/>
                <text class="badge-num" y="-84.5" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff"></text>
            </g>
        </g>`;

    // 5 個男生欄位 + 3 個女生欄位（女生精準對齊前 3 個男生欄，一對一配對一目了然）
    // 首欄 x=75 給左上標籤晶片留位，徽章不重疊
    const BOY_X = [75, 155, 235, 315, 395];
    const GIRL_X = [75, 155, 235];
    const BOY_BASE = 102, GIRL_BASE = 214;

    let userAnswer = null;
    const ANSWER_INDEX = 2;
    let paired = 0;   // 已配對 0..3

    function makeKid(art, x, base, rowKey) {
        const wrap = document.createElementNS(SVGNS, 'g');
        wrap.setAttribute('transform', `translate(${x} ${base})`);
        wrap.innerHTML = art;
        const kid = wrap.firstElementChild;
        kid.classList.add('kid');
        kid.dataset.row = rowKey;
        kid.addEventListener('click', () => {
            kid.classList.toggle('counted');
            let n = 1;
            document.querySelectorAll(`#yardSvg .kid[data-row="${rowKey}"]`).forEach((k) => {
                const badge = k.querySelector('.badge-g');
                if (k.classList.contains('counted')) {
                    badge.style.display = 'block';
                    k.querySelector('.badge-num').textContent = n++;
                } else {
                    badge.style.display = 'none';
                }
            });
        });
        return wrap;
    }

    function kidsIn(rowSel) {
        return [...document.querySelectorAll(`#yardSvg .kid[data-row="${rowSel}"]`)];
    }

    function pairOne() {
        if (paired >= 3) return;
        // 配對：第 paired 個女生 ↔ 同欄位第 paired 個男生（同 x 欄，上下牽手）
        const b = kidsIn('b')[paired], g = kidsIn('g')[paired];
        const bAnim = b, gAnim = g; // kid 本身即 anim-g（CSS transition 掛在 .kid .anim-g 上）
        bAnim.style.transform = 'translateY(10px) scale(0.92)';
        gAnim.style.transform = 'translateY(-10px) scale(0.92)';
        setTimeout(() => {
            bAnim.style.transform = '';
            gAnim.style.transform = '';
            [['#9333ea', b], ['#9333ea', g]].forEach(([, k]) => {
                k.querySelector('.badge-g').style.display = 'block';
                k.querySelector('.badge-g circle').setAttribute('fill', '#9333ea');
                k.querySelector('.badge-num').textContent = '牽✓';
            });
        }, 220);
        paired++;
        updateNote();
    }

    function updateNote() {
        const note = document.getElementById('pairNote');
        if (paired < 3) {
            note.innerHTML = `已配對 ${paired} 對，還有 ${3 - paired} 個女生等著配對…`;
        } else {
            kidsIn('b').forEach((b, i) => { if (i >= 3) b.classList.add('leftover'); });
            document.getElementById('pairBtn').disabled = true;
            note.innerHTML = '女生配完了！剩下 <span style="color:#dc2626">2 個男生</span>沒有牽到 → 男生比女生多 <span style="color:#dc2626">2</span> 人 🎉';
        }
    }

    function resetAll() {
        paired = 0;
        document.querySelectorAll('#yardSvg .kid').forEach((el) => {
            el.classList.remove('counted', 'leftover');
            el.querySelector('.badge-g').style.display = 'none';
            el.querySelector('.badge-g circle').setAttribute('fill', el.dataset.row === 'b' ? '#2563eb' : '#be185d');
            el.style.transform = '';
        });
        document.getElementById('pairBtn').disabled = false;
        updateNote();
    }

    function build() {
        const svg = document.getElementById('yardSvg');
        let labels = `
            <g pointer-events="none">
                <rect x="4" y="4" width="54" height="18" rx="6" fill="#dbeafe"/>
                <text x="31" y="16.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">男生5人</text>
                <line x1="10" y1="110" x2="440" y2="110" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
                <rect x="4" y="26" width="54" height="18" rx="6" fill="#fce7f3"/>
                <text x="31" y="38.5" text-anchor="middle" font-size="11" font-weight="800" fill="#be185d">女生3人</text>
                <line x1="10" y1="218" x2="440" y2="218" stroke="#ec4899" stroke-width="2" stroke-dasharray="6 4"/>
            </g>`;
        svg.innerHTML = labels;
        BOY_X.forEach((x) => svg.appendChild(makeKid(boyArt, x, BOY_BASE, 'b')));
        GIRL_X.forEach((x) => svg.appendChild(makeKid(girlArt, x, GIRL_BASE, 'g')));

        const group = document.getElementById('opts');
        [
            '5 + 3 = 8，多 8 人',
            '8 - 5 = 3，多 3 人',
            '5 - 3 = 2，多 2 人',
            '8 - 3 = 5，多 5 人'
        ].forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = function () {
                group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                userAnswer = idx;
            };
            group.appendChild(btn);
        });
    }

    function check() {
        const banner = document.getElementById('resultBanner');
        if (userAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '先選一個算式再檢查喔！';
            return;
        }
        if (userAnswer === ANSWER_INDEX) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對！5－3＝2，男生多 2 人（比較型：大數－小數＝差）';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '再想想：「多幾人」是 5 人和 3 人配對後剩下的人數，不是全部 8 人喔！';
        }
    }

    build();
</script>

</body>
</html>
