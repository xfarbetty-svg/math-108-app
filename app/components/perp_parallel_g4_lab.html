<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>S-4-5 垂直與平行・108 課綱互動教具</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
:root{
  --bg:var(--bg-main, #fcfbf9);
  --card:var(--bg-card, #ffffff);
  --ink:var(--text-primary, #1e293b);
  --ink-soft:var(--text-secondary, #64748b);
  --line:var(--border-color, #e2e8f0);
  --a:var(--accent-primary, #2563eb);
  --mint:var(--accent-mint, #0d9488);
  --sky:var(--accent-sky, #0284c7);
  --elev:var(--bg-elevated, #f1f5f9);
  --ok:#16a34a; --warn:#ea580c; --hl:#fef08a;
  --shadow:0 3px 10px rgba(0,0,0,0.06);
  --radius:12px;
  --ruler-bg:rgba(254, 240, 138, 0.55);
  --ruler-stroke:#ca8a04;
  --square-bg:rgba(186, 230, 253, 0.62);
  --square-stroke:#0284c7;
  --line-main:#2563eb;
  --line-sec:#dc2626;
  --line-perp:#059669;
}
html[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --ink:#f8fafc; --ink-soft:#94a3b8;
  --line:#334155; --elev:#1e293b; --ok:#4ade80; --warn:#fb923c;
  --shadow:0 3px 10px rgba(0,0,0,0.28);
  --ruler-bg:rgba(202, 138, 4, 0.30);
  --ruler-stroke:#eab308;
  --square-bg:rgba(2, 132, 199, 0.38);
  --square-stroke:#38bdf8;
  --line-main:#60a5fa;
  --line-sec:#f87171;
  --line-perp:#34d399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;max-width:100vw;overflow-x:hidden;height:auto;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:4px 8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
[hidden]{display:none!important}
#app{width:100%;max-width:480px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:4px;overflow:visible}

.head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--ink-soft);min-height:22px}
.head-left{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.head b{font-size:12px;color:var(--ink);white-space:nowrap}
.head-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#btn-theme{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}

.activity-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--elev);padding:3px;border-radius:999px;flex-wrap:nowrap;max-width:100%}
.activity-nav::-webkit-scrollbar{display:none}
.act-btn{flex:0 0 auto;padding:4px 9px;font-size:11px;font-weight:800;border-radius:999px;color:var(--ink-soft);white-space:nowrap;transition:all .15s}
.act-btn.active{background:var(--card);color:var(--a);box-shadow:0 2px 5px rgba(0,0,0,.08)}

.act-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);max-width:100%;overflow:visible}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.card-badge{background:var(--elev);color:var(--a);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;white-space:nowrap}
.card-title{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage-canvas{width:100%;background:var(--elev);border-radius:10px;border:1px solid var(--line);padding:2px;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none}
.stage-canvas svg{width:100%;max-width:340px;height:118px;display:block;touch-action:none;user-select:none}

.interact-panel{background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:4px 6px;display:flex;flex-direction:column;gap:4px;text-align:center;max-width:100%}
.btn-grid{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn-action{background:var(--card);border:1.2px solid var(--line);color:var(--ink);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;transition:all .12s;white-space:nowrap}
.btn-action:hover{border-color:var(--a)}
.btn-action.primary{background:var(--a);border-color:var(--a);color:#fff}
.btn-action.active{background:var(--a);border-color:var(--a);color:#fff}

.info-bubble{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:10.5px;line-height:1.32;color:var(--ink);font-weight:700;text-align:left;min-height:18px}
.info-bubble.ok{border-color:var(--ok);color:var(--ok)}
.info-bubble.warn{border-color:var(--warn);color:var(--warn)}

.steps-box{background:var(--card);border:1.5px solid var(--ok);border-radius:8px;padding:5px 7px;font-size:10px;line-height:1.35;color:var(--ink);display:flex;flex-direction:column;gap:2px;text-align:left}
.step-line b{color:var(--ok);margin-right:3px}

/* 嚴格雙模式隔離：q-mode 下強制隱藏所有概念活動頁籤與卡片 */
.q-mode .activity-nav,
.q-mode #act-0-view,
.q-mode #act-1-view,
.q-mode #act-2-view{display:none!important}
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="head-left">
      <b>📐 垂直與平行</b>
      <span id="qtag" class="card-badge" hidden></span>
    </div>
    <div class="head-right">
      <button type="button" id="btn-theme">🌙 深色</button>
    </div>
  </div>

  <nav class="activity-nav" id="activityNav">
    <button type="button" class="act-btn active" data-act="0">① 十字路口找垂線</button>
    <button type="button" class="act-btn" data-act="1">② 直尺推平行軌道</button>
    <button type="button" class="act-btn" data-act="2">③ 鐵軌枕木等距尺</button>
  </nav>

  <!-- 概念探索：活動一（十字路口與直角三角板找垂線） -->
  <section class="act-card" id="act-0-view">
    <div class="card-head">
      <span class="card-badge">活動一・十字路口與垂線</span>
      <span class="card-title">拖曳三角板對齊斑馬線口</span>
    </div>
    <div class="stage-canvas" id="canvas-0">
      <svg id="svg0" viewBox="0 0 340 118">
        <!-- 東西向馬路（基準線） -->
        <rect x="10" y="80" width="320" height="24" rx="3" fill="var(--ruler-bg)" stroke="var(--ruler-stroke)" stroke-width="1.2"/>
        <line x1="15" y1="80" x2="325" y2="80" stroke="var(--ink)" stroke-width="2"/>
        <text x="22" y="96" font-size="9" font-weight="800" fill="var(--ruler-stroke)">東西向道路（直尺基準邊）</text>
        <!-- 斑馬線口目標點 A -->
        <circle cx="170" cy="80" r="4" fill="var(--warn)"/>
        <text x="170" y="114" font-size="9.5" font-weight="900" fill="var(--warn)" text-anchor="middle">路口燈柱 A 點</text>
        <!-- 可拖曳三角板 -->
        <g id="square0" transform="translate(95, 80)" style="cursor:ew-resize">
          <polygon points="0,0 58,0 0,-62" fill="var(--square-bg)" stroke="var(--square-stroke)" stroke-width="1.6"/>
          <path d="M 0,-10 L 10,-10 L 10,0" fill="none" stroke="var(--square-stroke)" stroke-width="1.2"/>
          <circle cx="20" cy="-16" r="6" fill="var(--card)" stroke="var(--square-stroke)" stroke-width="1.2"/>
          <text x="20" y="-13" font-size="8" font-weight="900" fill="var(--square-stroke)" text-anchor="middle">拖</text>
        </g>
        <!-- 垂線與直角記號 -->
        <g id="perpLine0" hidden>
          <line x1="170" y1="80" x2="170" y2="10" stroke="var(--line-sec)" stroke-width="2.4" stroke-dasharray="3,3"/>
          <rect x="170" y="70" width="10" height="10" fill="none" stroke="var(--line-sec)" stroke-width="1.5"/>
          <text x="184" y="28" font-size="9.5" font-weight="900" fill="var(--line-sec)">南北向垂線 (90°)</text>
        </g>
      </svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action" id="s0Left">◀ 向左滑</button>
        <button type="button" class="btn-action" id="s0Right">向右滑 ▶</button>
        <button type="button" class="btn-action primary" id="s0Draw">✓ 畫出垂線</button>
        <button type="button" class="btn-action" id="s0Reset">重置</button>
      </div>
      <div class="info-bubble" id="info0">左右拖曳三角板，讓直角頂點對齊路口燈柱 A 點，再按「畫出垂線」。</div>
    </div>
  </section>

  <!-- 概念探索：活動二（直尺＋三角板滑動推平行線軌道） -->
  <section class="act-card" id="act-1-view" hidden>
    <div class="card-head">
      <span class="card-badge">活動二・直尺推平行軌道</span>
      <span class="card-title">沿直尺導軌滑動推平行線</span>
    </div>
    <div class="stage-canvas" id="canvas-1">
      <svg id="svg1" viewBox="0 0 340 118">
        <!-- 固定直尺導軌 -->
        <g id="ruler1" transform="translate(28, 8)">
          <rect x="0" y="0" width="26" height="102" rx="3" fill="var(--ruler-bg)" stroke="var(--ruler-stroke)" stroke-width="1.2"/>
          <line x1="26" y1="0" x2="26" y2="102" stroke="var(--ink)" stroke-width="1.8"/>
          <text x="13" y="54" font-size="8.5" font-weight="800" fill="var(--ruler-stroke)" text-anchor="middle" transform="rotate(-90 13 54)">直尺固定導軌</text>
        </g>
        <!-- 原軌道甲 -->
        <line x1="54" y1="32" x2="310" y2="32" stroke="var(--line-main)" stroke-width="2.2"/>
        <rect x="54" y="22" width="10" height="10" fill="none" stroke="var(--line-main)" stroke-width="1.2"/>
        <text x="275" y="26" font-size="9" font-weight="800" fill="var(--line-main)">軌道甲</text>
        <!-- 可拖曳三角板 -->
        <g id="square1" transform="translate(54, 32)" style="cursor:ns-resize">
          <polygon points="0,0 68,0 0,50" fill="var(--square-bg)" stroke="var(--square-stroke)" stroke-width="1.6"/>
          <path d="M 0,10 L 10,10 L 10,0" fill="none" stroke="var(--square-stroke)" stroke-width="1.2"/>
          <circle cx="22" cy="18" r="6" fill="var(--card)" stroke="var(--square-stroke)" stroke-width="1.2"/>
          <text x="22" y="21" font-size="8" font-weight="900" fill="var(--square-stroke)" text-anchor="middle">拖</text>
        </g>
        <!-- 推出的平行軌道乙 -->
        <g id="lineB1" hidden>
          <line x1="54" y1="86" x2="310" y2="86" stroke="var(--line-sec)" stroke-width="2.2" stroke-dasharray="3,3"/>
          <rect x="54" y="76" width="10" height="10" fill="none" stroke="var(--line-sec)" stroke-width="1.2"/>
          <text x="275" y="80" font-size="9" font-weight="800" fill="var(--line-sec)">軌道乙 ∥ 甲</text>
        </g>
      </svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action" id="s1Up">▲ 往上推</button>
        <button type="button" class="btn-action" id="s1Down">▼ 往下推</button>
        <button type="button" class="btn-action primary" id="s1Draw">✓ 畫出平行軌道</button>
        <button type="button" class="btn-action" id="s1Reset">重置</button>
      </div>
      <div class="info-bubble" id="info1">按住三角板沿直尺導軌上下拖曳，再畫出與甲線平行的軌道乙。</div>
    </div>
  </section>

  <!-- 概念探索：活動三（鐵軌枕木與兩平行線間等距測量尺） -->
  <section class="act-card" id="act-2-view" hidden>
    <div class="card-head">
      <span class="card-badge">活動三・鐵軌枕木等距尺</span>
      <span class="card-title">拖曳測量尺檢查平行鐵軌間距</span>
    </div>
    <div class="stage-canvas" id="canvas-2">
      <svg id="svg2" viewBox="0 0 340 118">
        <!-- 兩條平行鐵軌 -->
        <line x1="20" y1="28" x2="320" y2="28" stroke="var(--line-main)" stroke-width="2.4"/>
        <text x="24" y="21" font-size="9" font-weight="800" fill="var(--line-main)">上鐵軌 L1</text>
        <line x1="20" y1="88" x2="320" y2="88" stroke="var(--line-main)" stroke-width="2.4"/>
        <text x="24" y="103" font-size="9" font-weight="800" fill="var(--line-main)">下鐵軌 L2</text>
        <!-- 固定枕木參考 -->
        <line x1="75" y1="28" x2="75" y2="88" stroke="var(--ink-soft)" stroke-width="1.4" stroke-dasharray="2,2"/>
        <line x1="255" y1="28" x2="255" y2="88" stroke="var(--ink-soft)" stroke-width="1.4" stroke-dasharray="2,2"/>
        <!-- 傾斜紅色斜木 D（無直角記號 ∟，標示 6.2 cm > 5.0 cm） -->
        <g id="probeD" hidden style="display:none">
          <line x1="225" y1="28" x2="275" y2="88" stroke="var(--line-sec)" stroke-width="3.4" stroke-linecap="round"/>
          <circle cx="225" cy="28" r="3.2" fill="var(--line-sec)"/>
          <circle cx="275" cy="88" r="3.2" fill="var(--line-sec)"/>
          <path d="M 260,88 A 15,15 0 0 1 266,75" fill="none" stroke="var(--line-sec)" stroke-width="1.5"/>
          <text x="234" y="81" font-size="8.5" font-weight="900" fill="var(--line-sec)">非直角</text>
          <rect x="242" y="45" width="90" height="18" rx="5" fill="var(--card)" stroke="var(--line-sec)" stroke-width="1.5"/>
          <text x="287" y="57" font-size="8.5" font-weight="900" fill="var(--line-sec)" text-anchor="middle">6.2 cm &gt; 5.0 cm</text>
        </g>
        <!-- 可拖曳等距測量尺 -->
        <g id="probeSlider2" transform="translate(165, 0)" style="cursor:ew-resize">
          <line x1="0" y1="28" x2="0" y2="88" stroke="var(--ok)" stroke-width="2.6"/>
          <rect x="0" y="78" width="9" height="9" fill="none" stroke="var(--ok)" stroke-width="1.3"/>
          <rect x="-24" y="47" width="48" height="18" rx="5" fill="var(--card)" stroke="var(--ok)" stroke-width="1.4"/>
          <text x="0" y="59" font-size="8.5" font-weight="900" fill="var(--ok)" text-anchor="middle">5.0 cm</text>
        </g>
      </svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action active" id="btnA">量左枕木(75)</button>
        <button type="button" class="btn-action" id="btnB">量中段(165)</button>
        <button type="button" class="btn-action" id="btnC">量右枕木(255)</button>
        <button type="button" class="btn-action" id="btnD">測試斜木 D</button>
      </div>
      <div class="info-bubble ok" id="info2">左右拖曳綠色垂直測量尺，鐵軌垂直間距處處都是 5.0 cm！</div>
    </div>
  </section>

  <!-- 真題演練模式 (帶 ?q=1..10 時唯獨顯示) -->
  <section class="act-card" id="examView" hidden>
    <div class="card-head">
      <span class="card-badge" id="examBadge">真題測驗</span>
      <span class="card-title" id="examHintTitle">動手幾何操作台</span>
    </div>
    <div class="stage-canvas" id="examStageWrap">
      <svg id="examStage" viewBox="0 0 340 118"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid" id="examControls"></div>
      <div class="btn-grid">
        <button type="button" class="btn-action primary" id="verifyBtn">✓ 檢查操作</button>
        <button type="button" class="btn-action" id="revealSteps">🔍 看算理拆解</button>
        <button type="button" class="btn-action" id="resetExamBtn">重置</button>
      </div>
      <div class="info-bubble" id="examMsg">請在圖上動手操作或拖曳驗證，再點「檢查操作」。</div>
      <div class="steps-box" id="stepsBox" hidden></div>
    </div>
  </section>
</div>

<script>
(function(){
  const btnTheme = document.getElementById('btn-theme');
  function applyTheme(theme){
    const t = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('math108_theme', t); } catch (e) {}
    btnTheme.textContent = t === 'dark' ? '☀️ 淺色' : '🌙 深色';
  }
  btnTheme.onclick = function(){
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  };
  const urlParams = new URLSearchParams(window.location.search);
  const paramTheme = urlParams.get('theme');
  if(paramTheme === 'dark' || paramTheme === 'light'){
    applyTheme(paramTheme);
  } else {
    try {
      const saved = localStorage.getItem('math108_theme');
      if(saved) applyTheme(saved);
    } catch (e) {}
  }
  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'THEME_CHANGE') applyTheme(e.data.theme);
  });

  // 通用 SVG 拖曳工具（支援真實 pointerdown / pointermove / pointerup）
  function attachSvgDrag(svgEl, onMove){
    if(!svgEl) return;
    let dragging = false;
    function toSvgPt(ev){
      const rect = svgEl.getBoundingClientRect();
      const vb = svgEl.viewBox.baseVal;
      const x = ((ev.clientX - rect.left) / (rect.width || 1)) * vb.width;
      const y = ((ev.clientY - rect.top) / (rect.height || 1)) * vb.height;
      return { x, y };
    }
    svgEl.addEventListener('pointerdown', function(ev){
      dragging = true;
      try { svgEl.setPointerCapture(ev.pointerId); } catch(e){}
      onMove(toSvgPt(ev), 'down');
    });
    svgEl.addEventListener('pointermove', function(ev){
      if(!dragging) return;
      onMove(toSvgPt(ev), 'move');
    });
    svgEl.addEventListener('pointerup', function(ev){
      if(!dragging) return;
      dragging = false;
      onMove(toSvgPt(ev), 'up');
    });
    svgEl.addEventListener('pointercancel', function(){ dragging = false; });
  }

  const state = window.__S45_STATE__ = { s0X: 95, s1Y: 32, s2X: 165, exam: {} };
  const actBtns = document.querySelectorAll('.act-btn');

  function showAct(idx){
    actBtns.forEach(function(b, i){
      b.classList.toggle('active', i === idx);
      const v = document.getElementById('act-' + i + '-view');
      if(v) v.hidden = (i !== idx);
    });
  }
  actBtns.forEach(function(b){
    b.onclick = function(){ showAct(parseInt(b.getAttribute('data-act'), 10)); };
  });

  // --- 活動一：十字路口與直角三角板找垂線 ---
  const square0 = document.getElementById('square0');
  const perp0 = document.getElementById('perpLine0');
  const info0 = document.getElementById('info0');
  function updateS0(){
    square0.setAttribute('transform', 'translate(' + Math.round(state.s0X) + ', 80)');
    if(Math.abs(state.s0X - 170) <= 6){
      info0.textContent = '三角板直角頂點已對齊 A 點！請按「畫出垂線」。';
      info0.className = 'info-bubble ok';
    } else {
      info0.textContent = '拖曳三角板對齊 A 點（目前 x=' + Math.round(state.s0X) + '，目標 x=170）。';
      info0.className = 'info-bubble';
    }
  }
  attachSvgDrag(document.getElementById('svg0'), function(pt){
    state.s0X = Math.max(30, Math.min(260, pt.x - 15));
    updateS0();
  });
  document.getElementById('s0Left').onclick = function(){ state.s0X = Math.max(30, state.s0X - 15); updateS0(); };
  document.getElementById('s0Right').onclick = function(){ state.s0X = Math.min(260, state.s0X + 15); updateS0(); };
  document.getElementById('s0Draw').onclick = function(){
    if(Math.abs(state.s0X - 170) <= 10){
      state.s0X = 170; updateS0();
      perp0.hidden = false;
      info0.textContent = '✓ 垂線完成！南北向與東西向相交成 90° 直角。';
      info0.className = 'info-bubble ok';
    } else {
      info0.textContent = '⚠️ 請先拖曳或滑動三角板使直角頂點對齊路口燈柱 A 點！';
      info0.className = 'info-bubble warn';
    }
  };
  document.getElementById('s0Reset').onclick = function(){ state.s0X = 95; perp0.hidden = true; updateS0(); };

  // --- 活動二：直尺＋三角板滑動推平行線軌道 ---
  const square1 = document.getElementById('square1');
  const lineB1 = document.getElementById('lineB1');
  const info1 = document.getElementById('info1');
  function updateS1(){

    },
    8: {
      badge: '真題 Q8・獅湖 114-2',
      title: '滑動測量尺驗證兩平行線等距性',
      steps: [
        '將垂直測量尺拖曳至左端、中段與右端。',
        '每次讀取的垂直線段長度皆固定為 4.5 cm。',
        '證明兩平行線之間的距離處處相等。'
      ],
      init: { px: 170 },
      render(st, svg, ctrl){
        svg.innerHTML = `
          <line x1="25" y1="28" x2="315" y2="28" stroke="var(--line-main)" stroke-width="2.2"/>
          <line x1="25" y1="88" x2="315" y2="88" stroke="var(--line-main)" stroke-width="2.2"/>
          <g transform="translate(${Math.round(st.px)}, 0)">
            <line x1="0" y1="28" x2="0" y2="88" stroke="var(--ok)" stroke-width="2.6"/>
            <rect x="0" y="79" width="9" height="9" fill="none" stroke="var(--ok)" stroke-width="1.3"/>
            <rect x="-22" y="48" width="44" height="17" rx="5" fill="var(--card)" stroke="var(--ok)" stroke-width="1.4"/>
            <text x="0" y="60" font-size="8.5" font-weight="900" fill="var(--ok)" text-anchor="middle">4.5cm</text>
          </g>
          <text x="170" y="109" font-size="9.5" font-weight="800" fill="var(--ink)" text-anchor="middle">位置 x=${Math.round(st.px)}：實測距離 4.5 cm</text>
        `;
        ctrl.innerHTML = `
          <button type="button" class="btn-action" id="q8L">◀ 左端(65)</button>
          <button type="button" class="btn-action" id="q8M">中段(170)</button>
          <button type="button" class="btn-action" id="q8R">右端(275) ▶</button>
        `;
        ctrl.querySelector('#q8L').onclick = () => { st.px = 65; renderExam(); };
        ctrl.querySelector('#q8M').onclick = () => { st.px = 170; renderExam(); };
        ctrl.querySelector('#q8R').onclick = () => { st.px = 275; renderExam(); };
      },
      onDrag(st, pt){ st.px = Math.max(45, Math.min(295, pt.x)); renderExam(); },
      check: (st) => ({ ok: true, msg: '✓ 位置 x=' + Math.round(st.px) + ' 實測為 4.5 cm！兩平行線之間距離處處相等。' })
    },
    9: {
      badge: '真題 Q9・內湖 112-2',
      title: '五線交錯圖中找出和 A 線平行的線',
      steps: [
        '觀察內湖國小段考附圖中的 A、B、C、D、E 五條線。',
        'E 為水平線，B 為鉛直線，D 往右下傾斜，皆與 A 線相交。',
        '只有 C 線與 A 線傾斜方向完全相同且保持等距，故 C 線與 A 線平行。'
      ],
      init: { sel: null },
      render(st, svg, ctrl){
        const s = st.sel;
        // 忠實還原內湖 112-2 p1 一.2 附圖：E 橫線、B 鉛直線、A 與 C 左下往右上平行、D 左上往右下斜交
        svg.innerHTML = `
          <!-- E 水平線 -->
          <line x1="65" y1="86" x2="275" y2="86" stroke="var(--ink-soft)" stroke-width="1.8"/>
          <text x="280" y="90" font-size="9.5" font-weight="900" fill="var(--ink-soft)">E</text>
          <!-- B 鉛直線 -->
          <line x1="142" y1="16" x2="142" y2="108" stroke="${s==='B'?'var(--warn)':'var(--ink)'}" stroke-width="${s==='B'?2.8:1.8}"/>
          <text x="142" y="12" font-size="9.5" font-weight="900" fill="${s==='B'?'var(--warn)':'var(--ink)'}" text-anchor="middle">B</text>
          <!-- A 斜線 (基準) -->
          <line x1="78" y1="106" x2="132" y2="28" stroke="var(--line-main)" stroke-width="2.6"/>
          <text x="122" y="25" font-size="9.5" font-weight="900" fill="var(--line-main)">A</text>
          <!-- C 斜線 (平行 A) -->
          <line x1="158" y1="106" x2="212" y2="28" stroke="${s==='C'?'var(--ok)':'var(--ink)'}" stroke-width="${s==='C'?3:1.9}"/>
          <text x="215" y="26" font-size="9.5" font-weight="900" fill="${s==='C'?'var(--ok)':'var(--ink)'}">C</text>
          <!-- D 斜線 (相交) -->
          <line x1="192" y1="42" x2="255" y2="108" stroke="${s==='D'?'var(--warn)':'var(--ink)'}" stroke-width="${s==='D'?2.8:1.8}"/>
          <text x="228" y="64" font-size="9.5" font-weight="900" fill="${s==='D'?'var(--warn)':'var(--ink)'}">D</text>
        `;
        ctrl.innerHTML = ['A','B','C','D'].map(k => `<button type="button" class="btn-action ${s===k?'active':''}" data-ln="${k}">${k} 線</button>`).join('');
        ctrl.querySelectorAll('[data-ln]').forEach(b => { b.onclick = () => { st.sel = b.dataset.ln; renderExam(); }; });
      },
      check: (st) => ({ ok: st.sel === 'C', msg: st.sel === 'C' ? '✓ 正確！C 線與 A 線方向完全一致、延伸永不相交，兩線互相平行。' : '線 ' + (st.sel || '未選') + ' 會與 A 線相交（或為 A 本身），請選出與 A 平行的線！' })
    },
    10: {
      badge: '真題 Q10・內湖 113-2',
      title: '甲∥乙、丙⊥甲，延伸丙線看乙丙關係',
      steps: [
        '甲線與乙線互相平行，方向完全一致。',
        '丙線垂直於甲線，夾角為 90° 直角。',
        '將丙線繼續向下延伸穿過乙線，與乙線交角同樣也是 90°（互相垂直）。'
      ],
      init: { ext: false },
      render(st, svg, ctrl){
        svg.innerHTML = `
          <line x1="45" y1="34" x2="280" y2="34" stroke="var(--line-main)" stroke-width="2.2"/>
          <text x="288" y="38" font-size="9.5" font-weight="800" fill="var(--line-main)">甲</text>
          <line x1="45" y1="88" x2="280" y2="88" stroke="var(--line-main)" stroke-width="2.2"/>
          <text x="288" y="92" font-size="9.5" font-weight="800" fill="var(--line-main)">乙 (∥甲)</text>
          <line x1="155" y1="12" x2="155" y2="${st.ext?108:34}" stroke="var(--line-sec)" stroke-width="2.4"/>
          <text x="142" y="20" font-size="9.5" font-weight="800" fill="var(--line-sec)">丙</text>
          <rect x="155" y="34" width="9" height="9" fill="none" stroke="var(--line-sec)" stroke-width="1.3"/>
          ${st.ext ? '<rect x="155" y="79" width="9" height="9" fill="none" stroke="var(--ok)" stroke-width="1.5"/><text x="169" y="82" font-size="9.5" font-weight="900" fill="var(--ok)">交角 90°！</text>' : ''}
        `;
        ctrl.innerHTML = `<button type="button" class="btn-action primary" id="q10Ext">${st.ext ? '✓ 丙線已穿過乙線' : '延伸丙線穿過乙線 ▼'}</button>`;
        ctrl.querySelector('#q10Ext').onclick = () => { st.ext = true; renderExam(); };
      },
      check: (st) => ({ ok: st.ext, msg: st.ext ? '✓ 丙線穿過乙線同樣形成 90° 直角，因此乙線與丙線互相垂直！' : '請點擊「延伸丙線穿過乙線」觀察夾角！' })
    }
  };

  function renderExam(){
    const cfg = EXAM_SPECS[qNum];
    if(!cfg) return;
    cfg.render(state.exam, document.getElementById('examStage'), document.getElementById('examControls'));
  }

  function initExam(){
    document.body.classList.add('q-mode');
    document.getElementById('activityNav').hidden = true;
    [0,1,2].forEach(i => { document.getElementById('act-' + i + '-view').hidden = true; });
    document.getElementById('examView').hidden = false;

    const cfg = EXAM_SPECS[qNum];
    if(!cfg) return;
    const qtag = document.getElementById('qtag');
    qtag.textContent = '真題 Q' + qNum;
    qtag.hidden = false;
    document.getElementById('examBadge').textContent = cfg.badge;
    document.getElementById('examHintTitle').textContent = cfg.title;

    state.exam = Object.assign({}, cfg.init);
    const stepsBox = document.getElementById('stepsBox');
    stepsBox.hidden = true;
    stepsBox.innerHTML = cfg.steps.map((s, idx) => `<div class="step-line"><b>步驟 ${idx+1}：</b>${s}</div>`).join('');

    if(cfg.onDrag){
      attachSvgDrag(document.getElementById('examStage'), (pt) => cfg.onDrag(state.exam, pt));
    }

    document.getElementById('verifyBtn').onclick = function(){
      const res = cfg.check(state.exam);
      const m = document.getElementById('examMsg');
      m.className = 'info-bubble ' + (res.ok ? 'ok' : 'warn');
      m.textContent = res.msg;
      if(res.ok) stepsBox.hidden = false;
    };
    document.getElementById('revealSteps').onclick = function(){ stepsBox.hidden = !stepsBox.hidden; };
    document.getElementById('resetExamBtn').onclick = function(){
      state.exam = Object.assign({}, cfg.init);
      stepsBox.hidden = true;
      const m = document.getElementById('examMsg');
      m.className = 'info-bubble';
      m.textContent = '已重置操作狀態，請重新操作。';
      renderExam();
    };
    renderExam();
  }

  if(isExam) initExam();
  else showAct(0);
})();
</script>
</body>
</html>
