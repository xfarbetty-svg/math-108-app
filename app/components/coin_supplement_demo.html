<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍珠補錢買早餐</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .meta-row { display: flex; justify-content: flex-end; margin-bottom: 4px; }
        .source-tag { font-size: 11px; color: #94a3b8; }
        .stem { font-size: 1.15rem; font-weight: 700; margin-bottom: 10px; color: #1e293b; line-height: 1.4; }
        .have-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #eff6ff;
            border: 2px solid #93c5fd;
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 10px;
        }
        .have-coins { display: flex; gap: 4px; flex-wrap: wrap; }
        .have-label { font-size: 0.98rem; font-weight: 800; color: #1d4ed8; white-space: nowrap; }
        .supplement-title { font-size: 0.95rem; font-weight: 800; color: #475569; margin-bottom: 6px; }
        .add-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
        .add-btn {
            position: relative;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 50%;
            min-width: 46px;
            min-height: 46px;
            transition: transform 0.1s ease;
        }
        .add-btn:active { transform: scale(0.9); }
        .add-btn .plus {
            position: absolute;
            top: -4px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #0f172a;
            color: #fff;
            border-radius: 50%;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .added-tray {
            background: #fefce8;
            border: 2px dashed #ca8a04;
            border-radius: 12px;
            min-height: 78px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            align-content: flex-start;
            margin-bottom: 8px;
        }
        .added-tray .empty-hint { color: #a8a29e; font-size: 0.9rem; align-self: center; }
        .added-coin { position: relative; cursor: pointer; border-radius: 50%; }
        .added-coin:active { transform: scale(0.9); }
        .formula-line {
            text-align: center;
            font-size: 1.08rem;
            font-weight: 800;
            color: #334155;
            margin-bottom: 8px;
        }
        .formula-line .sum { color: #2563eb; }
        .feedback-line {
            min-height: 30px;
            text-align: center;
            font-size: 1.02rem;
            font-weight: 700;
            color: #334155;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 10px;
        }
        .feedback-line.ok { background: #dcfce7; color: #166534; }
        .footer-action { display: flex; justify-content: center; }
        .btn-reset {
            min-height: 42px;
            padding: 8px 24px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e2e8f0;
            color: #334155;
        }
        @media (max-width: 640px) {
            body { padding: 4px 6px; }
            .container { padding: 8px 10px; max-width: 480px; }
            .stem { font-size: 14px; margin-bottom: 6px; }
            .have-box { padding: 5px 8px; gap: 8px; margin-bottom: 8px; }
            .have-label { font-size: 13px; }
            .have-coins svg { width: 28px !important; height: 28px !important; }
            .supplement-title { font-size: 13px; margin-bottom: 4px; }
            .add-btn { min-width: 44px; min-height: 44px; }
            .add-btn svg { width: 40px !important; height: 40px !important; }
            .added-tray { min-height: 64px; padding: 6px; gap: 3px; margin-bottom: 6px; }
            .added-coin svg { width: 30px !important; height: 30px !important; }
            .formula-line { font-size: 14.5px; margin-bottom: 6px; }
            .feedback-line { font-size: 13px; min-height: 26px; margin-bottom: 8px; }
            .btn-reset { min-height: 38px; padding: 6px 18px; font-size: 13.5px; }
        }
    </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
    <defs>
        <radialGradient id="cg10" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#ffe9a8"/>
            <stop offset="70%" stop-color="#e6b23c"/>
            <stop offset="100%" stop-color="#c98f1d"/>
        </radialGradient>
        <radialGradient id="cg5" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#fefce8"/>
            <stop offset="70%" stop-color="#d9c94a"/>
            <stop offset="100%" stop-color="#a8902a"/>
        </radialGradient>
        <radialGradient id="cg1" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="70%" stop-color="#cbd5e1"/>
            <stop offset="100%" stop-color="#94a3b8"/>
        </radialGradient>
    </defs>
</svg>

<div class="container">
    <div class="meta-row">
        <span class="source-tag">永安 114-1 期末</span>
    </div>

    <div class="stem">珍珠想買 60 元的早餐，她的錢不夠，還要補多少元？點下面的硬幣補進來付付看。</div>

    <div class="have-box">
        <div class="have-label">珍珠現有：45 元<br><span style="font-size:11px;font-weight:600;color:#3b82f6;">（4 個 10 元＋1 個 5 元）</span></div>
        <div class="have-coins" id="haveCoins"></div>
    </div>

    <div class="supplement-title">補錢區（目標 60 元）：</div>
    <div class="add-row">
        <button class="add-btn" id="addTen" title="補 1 個 10 元">
            <svg width="44" height="44" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="19" fill="url(#cg10)" stroke="#8a6a1c" stroke-width="2"/>
                <circle cx="20" cy="20" r="13.5" fill="none" stroke="#8a6a1c" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
                <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6b5210">10</text>
            </svg>
            <span class="plus">＋</span>
        </button>
        <button class="add-btn" id="addFive" title="補 1 個 5 元">
            <svg width="44" height="44" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="19" fill="url(#cg5)" stroke="#7c6a1a" stroke-width="2"/>
                <circle cx="20" cy="20" r="13.5" fill="none" stroke="#7c6a1a" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
                <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#5c4e0e">5</text>
            </svg>
            <span class="plus">＋</span>
        </button>
        <button class="add-btn" id="addOne" title="補 1 個 1 元">
            <svg width="44" height="44" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="19" fill="url(#cg1)" stroke="#64748b" stroke-width="2"/>
                <circle cx="20" cy="20" r="13.5" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
                <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">1</text>
            </svg>
            <span class="plus">＋</span>
        </button>
    </div>

    <div class="added-tray" id="addedTray"><div class="empty-hint">點上面的硬幣，把錢補進來</div></div>

    <div class="formula-line" id="formulaLine">45 ＋ 0 ＝ <span class="sum">45</span>（還差 15 元）</div>
    <div class="feedback-line" id="feedback">目標：讓總金額剛好 60 元</div>

    <div class="footer-action">
        <button class="btn-reset" onclick="resetAll()">🔄 重置</button>
    </div>
</div>

<script>
    const HAVE = 45, TARGET = 60;
    let add10 = 0, add5 = 0, add1 = 0;

    const coinSvgs = {
        10: `<svg width="34" height="34" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="19" fill="url(#cg10)" stroke="#8a6a1c" stroke-width="2"/>
            <circle cx="20" cy="20" r="13.5" fill="none" stroke="#8a6a1c" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
            <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#6b5210">10</text>
        </svg>`,
        5: `<svg width="34" height="34" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="19" fill="url(#cg5)" stroke="#7c6a1a" stroke-width="2"/>
            <circle cx="20" cy="20" r="13.5" fill="none" stroke="#7c6a1a" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
            <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#5c4e0e">5</text>
        </svg>`,
        1: `<svg width="34" height="34" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="19" fill="url(#cg1)" stroke="#64748b" stroke-width="2"/>
            <circle cx="20" cy="20" r="13.5" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2.5 2" opacity="0.7"/>
            <text x="20" y="24.5" text-anchor="middle" font-size="12" font-weight="800" fill="#334155">1</text>
        </svg>`
    };

    // 上方「珍珠現有」靜態展示（4 個 10 元＋1 個 5 元）
    (function renderHave() {
        const box = document.getElementById('haveCoins');
        for (let i = 0; i < 4; i++) box.innerHTML += coinSvgs[10];
        box.innerHTML += coinSvgs[5];
    })();

    function renderTray() {
        const tray = document.getElementById('addedTray');
        tray.innerHTML = '';
        if (add10 + add5 + add1 === 0) {
            tray.innerHTML = '<div class="empty-hint">點上面的硬幣，把錢補進來</div>';
            return;
        }
        const items = [];
        for (let i = 0; i < add10; i++) items.push(10);
        for (let i = 0; i < add5; i++) items.push(5);
        for (let i = 0; i < add1; i++) items.push(1);
        items.forEach(v => {
            const d = document.createElement('div');
            d.className = 'added-coin';
            d.title = '點一下把這個硬幣拿回去';
            d.innerHTML = coinSvgs[v];
            d.onclick = function () {
                if (v === 10) add10--;
                else if (v === 5) add5--;
                else add1--;
                update();
            };
            tray.appendChild(d);
        });
    }

    function addedSum() { return add10 * 10 + add5 * 5 + add1; }

    function describeAdded() {
        const parts = [];
        if (add10 > 0) parts.push(`${add10} 個 10 元`);
        if (add5 > 0) parts.push(`${add5} 個 5 元`);
        if (add1 > 0) parts.push(`${add1} 個 1 元`);
        return parts.join('＋');
    }

    function update() {
        renderTray();
        const s = addedSum();
        const total = HAVE + s;
        const fb = document.getElementById('feedback');
        document.getElementById('formulaLine').innerHTML =
            `45 ＋ ${s} ＝ <span class="sum">${total}</span>` + (total < TARGET ? `（還差 ${TARGET - total} 元）` : '');
        fb.classList.remove('ok');
        if (s === 0) {
            fb.innerText = '目標：讓總金額剛好 60 元';
            return;
        }
        if (total < TARGET) {
            fb.innerText = `現在總共 ${total} 元，還差 ${TARGET - total} 元才到 60 元`;
        } else if (total > TARGET) {
            fb.innerText = `補到 ${total} 元了，比 60 元多 ${total - TARGET} 元，補太多啦！`;
        } else {
            fb.classList.add('ok');
            fb.innerText = `🎉 剛好補了 ${s} 元（${describeAdded()}），${HAVE}＋${s}＝60，可以買早餐了！`;
        }
    }

    function resetAll() {
        add10 = 0; add5 = 0; add1 = 0;
        update();
    }

    document.getElementById('addTen').onclick = function () { add10++; update(); };
    document.getElementById('addFive').onclick = function () { add5++; update(); };
    document.getElementById('addOne').onclick = function () { add1++; update(); };
    update();
</script>
</body>
</html>
