<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-5-Q01 自動換幣機</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.machine { text-align: center; }
.machine-title { font-size: 11px; font-weight: 900; color: #6b4fa1; letter-spacing: 2px; margin-bottom: 2px; }
.eq-row { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.slot { border: 2px dashed #d8cdf0; border-radius: 10px; background: #faf8ff; padding: 3px 5px 1px; }
.slot > span { display: block; font-size: 10px; font-weight: 900; color: #6b4fa1; margin-top: 1px; }
.hundreds-stack { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; min-height: 22px; max-width: 120px; }
.op { font-size: 16px; font-weight: 900; color: var(--ink-soft); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
.stepper button {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid #6b4fa1; background: var(--bg-card); color: #6b4fa1;
  font-size: 16px; font-weight: 900; cursor: pointer; transition: all 0.15s;
}
.stepper button:active { transform: scale(0.92); }
.stepper .count { font-size: 13px; font-weight: 900; color: var(--ink); min-width: 74px; }
.total-chip {
  display: inline-block; margin-top: 4px; border-radius: 999px; padding: 3px 14px;
  font-size: 12px; font-weight: 900; background: #f1ecfa; color: #6b4fa1;
  transition: all 0.2s;
}
.total-chip.gold { background: #dcfce7; color: #166534; box-shadow: 0 0 0 3px rgba(49, 138, 112, 0.15); }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>112-2 內湖 期中 一、⑷</small>1 張 1000 元可以換成 1 張 500 元加上（　）張 100 元和 10 個 10 元。</p>
  </div>
  <div class="card machine">
    <div class="machine-title">✦ 自動換幣機：湊到剛好 1000 元 ✦</div>
    <div class="eq-row">
      <div class="slot">
        <svg width="52" height="24" viewBox="0 0 52 24"><rect x="1.5" y="3" width="49" height="18" rx="2.5" fill="#e6d7f7" stroke="#6b4fa1" stroke-width="1.6"/><text x="26" y="16" font-size="9" font-weight="900" text-anchor="middle" fill="#4c3a72">1000</text></svg>
        <span>1 張</span>
      </div>
      <div class="op">＝</div>
      <div class="slot">
        <svg width="46" height="24" viewBox="0 0 46 24"><rect x="1.5" y="3" width="43" height="18" rx="2.5" fill="#cdeffd" stroke="#1d6f9e" stroke-width="1.6"/><text x="23" y="16" font-size="9" font-weight="900" text-anchor="middle" fill="#14496b">500</text></svg>
        <span>1 張</span>
      </div>
      <div class="op">＋</div>
      <div class="slot">
        <div class="hundreds-stack" id="h-stack"></div>
        <span>？張</span>
      </div>
      <div class="op">＋</div>
      <div class="slot">
        <svg width="34" height="24" viewBox="0 0 34 24"><circle cx="17" cy="12" r="10" fill="#f4e5c3" stroke="#a97b1f" stroke-width="1.6"/><text x="17" y="15.5" font-size="8.5" font-weight="900" text-anchor="middle" fill="#7a5410">10</text></svg>
        <span>10 個</span>
      </div>
    </div>
    <div class="stepper">
      <button type="button" id="minus" aria-label="減一張">−</button>
      <span class="count" id="count-label">100 元：0 張</span>
      <button type="button" id="plus" aria-label="加一張">＋</button>
    </div>
    <div class="total-chip" id="total-chip">機器小計：600 元</div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['4 張', '5 張', '3 張', '2 張'];
  var ANSWER = 0;
  var picked = -1;
  var n = 0;

  var stack = document.getElementById('h-stack');
  var countLabel = document.getElementById('count-label');
  var chip = document.getElementById('total-chip');

  function render() {
    var html = '';
    for (var i = 0; i < n; i++) {
      html += '<svg width="26" height="20" viewBox="0 0 26 20"><rect x="1" y="2.5" width="24" height="15" rx="2" fill="#cdeffd" stroke="#1d6f9e" stroke-width="1.4"/><text x="13" y="13.5" font-size="7.5" font-weight="900" text-anchor="middle" fill="#14496b">100</text></svg>';
    }
    if (n === 0) html = '<span style="font-size:10px;color:#b9a8e0;font-weight:800;">放入鈔票…</span>';
    stack.innerHTML = html;
    countLabel.textContent = '100 元：' + n + ' 張';
    var sum = 500 + n * 100 + 10 * 10;
    chip.textContent = '機器小計：' + sum + ' 元';
    if (sum === 1000) {
      chip.classList.add('gold');
      chip.textContent = '機器小計：1000 元，剛好！';
    } else {
      chip.classList.remove('gold');
    }
  }

  document.getElementById('minus').addEventListener('click', function () { if (n > 0) { n--; render(); hide(); } });
  document.getElementById('plus').addEventListener('click', function () { if (n < 9) { n++; render(); hide(); } });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      n = i + 2; /* 點選時同步帶入 2~5 張，讓機器即時試算 */
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      render();
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！500＋400＋100＝1000（10 個 10 元＝100 元），4 張 100 元剛好湊成 1 張 1000 元。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：先扣掉 1 張 500 元和 10 個 10 元（600 元），1000 還差多少？用換幣機湊湊看。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-5-Q01', answer: ANSWER };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
