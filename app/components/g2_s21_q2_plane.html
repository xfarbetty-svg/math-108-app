<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-S-2-1-Q02 平平的面辨識</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.stage { position:relative; width:100%; height:140px; border-radius:12px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.stage-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:brightness(.92) contrast(1.05); }
.stage-overlay { position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,249,240,.3) 100%); backdrop-filter:blur(1.5px); }
.scene-svg { position:relative; z-index:2; display:block; width:100%; height:100%; }
.item { cursor:pointer; }
.item .hl { opacity:0; transition:opacity .25s; }
.item.sel .hl { opacity:1; }
.item .piece { transition:transform .2s; transform-box:fill-box; transform-origin:center bottom; }
.item.sel .piece { transform:translateY(-3px); }
.face-hl { transition:filter .25s; }
.ghost { opacity:0; transition:opacity .25s; }
.show .ghost { opacity:1; }
.t-num { font-size:9.5px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.status { text-align:center; font-size:11.5px; font-weight:800; color:var(--ink-soft); min-height:16px; margin-top:3px; }
.status b { color:var(--ink); }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:#fff; border-radius:10px; padding:5px 6px; font-size:12px; font-weight:800; color:var(--ink); text-align:center; line-height:1.3; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border:none; border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); cursor:pointer; }
.result-banner { display:none; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>平平的面辨識</small>觀察下面形體，哪一種物品有平平的面？點點看它們，找找「平平的面」！</p>
  </div>
  <div class="card">
    <div class="stage">
      <img src="../assets/demo/bg_toy_room.webp" class="stage-bg" alt="玩具房背景">
      <div class="stage-overlay"></div>
      <svg class="scene-svg" viewBox="0 0 360 140" role="img" aria-label="魔術方塊、洋芋片圓筒與籃球">
        <ellipse cx="70" cy="112" rx="30" ry="5" fill="rgba(61,58,52,.12)"/>
        <ellipse cx="180" cy="116" rx="24" ry="5" fill="rgba(61,58,52,.12)"/>
        <ellipse cx="300" cy="114" rx="26" ry="5" fill="rgba(61,58,52,.12)"/>

        <!-- ① 魔術方塊：Isometric 純 SVG（s=26）四階光影，面可點亮 -->
        <g class="item" id="it-cube" data-key="cube">
          <ellipse class="hl" cx="70" cy="112" rx="30" ry="6" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <polygon class="face-hl" points="70,50 92.5,63 70,76 47.5,63" fill="#fff2b2" stroke="#fffdf8" stroke-width="1"/>
            <polygon class="face-hl" points="47.5,63 70,76 70,102 47.5,89" fill="#ffd166" stroke="#fffdf8" stroke-width="1"/>
            <polygon class="face-hl" points="70,76 92.5,63 92.5,89 70,102" fill="#e6b840" stroke="#fffdf8" stroke-width="1"/>
            <polygon points="70,50 92.5,63 70,76 47.5,63" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
            <polyline points="47.5,63 70,76 92.5,63" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
            <line x1="70" y1="50" x2="70" y2="102" stroke="var(--ink)" stroke-width="1.2"/>
          </g>
          <text x="70" y="133" class="t-num">魔術方塊</text>
        </g>

        <!-- ② 洋芋片圓筒：圓柱體，底面虛線圓可顯示 -->
        <g class="item" id="it-tube" data-key="tube">
          <ellipse class="hl" cx="180" cy="116" rx="24" ry="6" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <rect x="160" y="68" width="40" height="46" rx="3" fill="#e8875f" stroke="#b45309" stroke-width="1.5"/>
            <rect x="160" y="80" width="40" height="8" fill="#fdf0d5" opacity=".85"/>
            <rect x="160" y="92" width="40" height="8" fill="#fdf0d5" opacity=".85"/>
            <ellipse class="face-hl" cx="180" cy="68" rx="20" ry="7" fill="#ffd166" stroke="#b45309" stroke-width="1.5"/>
            <ellipse class="ghost" cx="180" cy="114" rx="20" ry="7" fill="none" stroke="#318a70" stroke-width="2" stroke-dasharray="4 3"/>
            <path d="M162,70 Q180,80 198,70" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
          </g>
          <text x="180" y="133" class="t-num">洋芋片圓筒</text>
        </g>

        <!-- ③ 籃球：球體 -->
        <g class="item" id="it-ball" data-key="ball">
          <ellipse class="hl" cx="300" cy="114" rx="26" ry="6" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <circle cx="300" cy="90" r="23" fill="#f59e4c" stroke="#b45309" stroke-width="1.5"/>
            <path d="M300,67 C287,80 287,100 300,113" fill="none" stroke="#b45309" stroke-width="1.6"/>
            <path d="M277,90 Q300,102 323,90" fill="none" stroke="#b45309" stroke-width="1.6"/>
            <path d="M287,73 Q293,70 298,69" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
          </g>
          <text x="300" y="133" class="t-num">籃球</text>
        </g>
      </svg>
    </div>
    <p class="status" id="status">點一個物品，找找有沒有<b>平平的面</b>！</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" type="button" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ["魔術方塊和洋芋片圓筒都有平平的面", "只有籃球有平平的面", "三種物品都沒有平平的面", "只有魔術方塊有平平的面"];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var status = document.getElementById('status');
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  var cubeG = document.getElementById('it-cube');
  var tubeG = document.getElementById('it-tube');
  var ballG = document.getElementById('it-ball');
  var cubeFaces = cubeG.querySelectorAll('.face-hl');
  var tourTimer = null, tourStep = -1;

  function select(key) {
    [cubeG, tubeG, ballG].forEach(function (g) {
      var on = g === (key === 'cube' ? cubeG : key === 'tube' ? tubeG : ballG);
      g.classList.toggle('sel', on);
      if (key === 'tube') g.classList.toggle('show', on);
      else g.classList.remove('show');
    });
  }
  function stopTour() {
    if (tourTimer) { clearInterval(tourTimer); tourTimer = null; }
    tourStep = -1;
    Array.prototype.forEach.call(cubeFaces, function (f) { f.style.filter = ''; });
  }

  cubeG.addEventListener('click', function () {
    stopTour();
    select('cube');
    var wasSel = cubeG.dataset.toured === '1';
    if (wasSel) {
      cubeG.dataset.toured = '';
      Array.prototype.forEach.call(cubeFaces, function (f) { f.style.filter = 'brightness(1.12)'; });
      status.innerHTML = '魔術方塊：<b>6 個面全是平平的面</b>！';
      say('魔術方塊，六個面全是平平的面！');
      return;
    }
    cubeG.dataset.toured = '1';
    tourStep = 0;
    tourTimer = setInterval(function () {
      Array.prototype.forEach.call(cubeFaces, function (f) { f.style.filter = ''; });
      if (tourStep >= cubeFaces.length) {
        stopTour();
        Array.prototype.forEach.call(cubeFaces, function (f) { f.style.filter = 'brightness(1.12)'; });
        status.innerHTML = '魔術方塊：每個面都平平的，<b>6 個平平的面</b>！';
        return;
      }
      cubeFaces[tourStep].style.filter = 'brightness(1.18) saturate(1.2)';
      status.innerHTML = '摸摸第 <b>' + (tourStep + 1) + '</b> 個面：是平平的還是彎彎的？';
      tourStep += 1;
    }, 550);
  });

  tubeG.addEventListener('click', function () {
    stopTour();
    select('tube');
    status.innerHTML = '洋芋片圓筒：<b>上下 2 個圓形的底面</b>是平平的面，側面才是彎彎的！';
    say('洋芋片圓筒，上下兩個圓形的底面是平平的面！');
  });

  ballG.addEventListener('click', function () {
    stopTour();
    select('ball');
    status.innerHTML = '籃球：<b>全是彎曲的面，沒有平平的面</b>！';
    say('籃球全是彎曲的面，沒有平平的面！');
  });

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！魔術方塊 6 個面都平平的，圓筒上下 2 個圓底面也平平的。';
      say('答對！魔術方塊和圓筒都有平平的面。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：圓筒上下底面也是平平的面；籃球才是全彎彎的，所以「只有」開頭都不成立！';
    say('再想想看：圓筒的上下底面也是平平的面。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-S-2-1-Q02', answer: ANSWER };
})();
</script>
</body>
</html>
