<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G2-S-2-4 Q09 多邊形的周長應用</title>
    <style>
        :root {
            --ink: #3d3a34;
            --mint: #7bc9b2;
            --dark-mint: #318a70;
            --yellow: #ffd166;
            --pink: #ff85a1;
            --paper: #fff9f0;
            --white: #ffffff;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 480px;
            height: 420px;
            background: var(--paper) url('../assets/demo/bg_desk.webp') center/cover;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
        }

        /* 遮罩層增加質感 */
        .wrap::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 249, 240, 0.85);
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .question {
            font-size: 1.1rem;
            color: var(--ink);
            line-height: 1.5;
            margin-bottom: 5px;
            font-weight: bold;
            background: var(--white);
            padding: 8px 12px;
            border-radius: 12px;
            border-left: 5px solid var(--mint);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stage { max-height: 115px;
            flex: 1;
            position: relative;
            background: rgba(255,255,255,0.5);
            border-radius: 15px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed var(--mint);
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .pentagon-path {
            fill: none;
            stroke: var(--ink);
            stroke-width: 3;
            stroke-linejoin: round;
        }

        .flow-path {
            fill: none;
            stroke: var(--yellow);
            stroke-width: 4;
            stroke-dasharray: 300;
            stroke-dashoffset: 300;
            stroke-linecap: round;
            pointer-events: none;
        }

        .side-label {
            font-size: 14px;
            fill: var(--dark-mint);
            font-weight: bold;
        }

        .ant {
            font-size: 24px;
            offset-path: path('M200,25 L247.5,59.5 L229.4,115.5 L170.6,115.5 L152.5,59.5 Z');
            offset-distance: 0%;
            position: absolute;
            z-index: 10;
            display: none;
        }

        @keyframes antWalk {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        @keyframes flowEffect {
            0% { stroke-dashoffset: 300; }
            100% { stroke-dashoffset: 0; }
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 5px;
        }

        .opt-btn {
            background: var(--white);
            border: 2px solid var(--mint);
            padding: 6px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            color: var(--ink);
            transition: all 0.2s;
            text-align: center;
        }

        .opt-btn:hover { background: #f0fcf8; }
        .opt-btn.selected {
            background: var(--mint);
            color: var(--white);
            transform: scale(0.98);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .check-btn {
            flex: 1;
            background: var(--dark-mint);
            color: var(--white);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #256a56;
        }

        .check-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #256a56;
        }

        .play-btn {
            background: var(--yellow);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 4px 0 #e6bc5c;
        }

        #feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            z-index: 100;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 80%;
        }

        #feedback.success {
            display: block;
            background: var(--yellow);
            color: var(--ink);
            border: 4px solid var(--white);
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #feedback.fail {
            display: block;
            background: var(--pink);
            color: var(--white);
            border: 4px solid var(--white);
            animation: shake 0.4s;
        }

        @keyframes pop {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) translateX(0); }
            25% { transform: translate(-50%, -50%) translateX(-10px); }
            75% { transform: translate(-50%, -50%) translateX(10px); }
        }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="wrap">
    <div class="content">
        <div class="question">
            正五邊形的每一條邊都是 2 公分，小螞蟻沿著花圃外圍走完一圈，總共走了多少公分？
        </div>

        <div class="stage">
            <div id="ant-sprite" class="ant">🐜</div>
            <svg viewBox="0 0 400 150">
                <!-- 正五邊形路徑 -->
                <path id="pentagon" class="pentagon-path" d="M200,25 L247.5,59.5 L229.4,115.5 L170.6,115.5 L152.5,59.5 Z" />
                <!-- 流光動畫路徑 -->
                <path id="flow" class="flow-path" d="M200,25 L247.5,59.5 L229.4,115.5 L170.6,115.5 L152.5,59.5 Z" />
                
                <!-- 標註邊長 -->
                <text x="230" y="40" class="side-label">2cm</text>
                <text x="250" y="90" class="side-label">2cm</text>
                <text x="190" y="135" class="side-label">2cm</text>
                <text x="135" y="90" class="side-label">2cm</text>
                <text x="155" y="40" class="side-label">2cm</text>
            </svg>
        </div>

        <div class="options">
            <div class="opt-btn" onclick="selectOption(0)">8公分</div>
            <div class="opt-btn" onclick="selectOption(1)">10公分</div>
            <div class="opt-btn" onclick="selectOption(2)">12公分</div>
            <div class="opt-btn" onclick="selectOption(3)">14公分</div>
        </div>

        <div class="controls">
            <button class="play-btn" onclick="playAnimation()" title="看小螞蟻走">🐾</button>
            <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
        </div>
    </div>

    <div id="feedback"></div>
</div>

<script>
    let selectedIndex = -1;
    const correctIndex = 1;
    const ant = document.getElementById('ant-sprite');
    const flow = document.getElementById('flow');
    const feedback = document.getElementById('feedback');

    function selectOption(index) {
        selectedIndex = index;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((btn, i) => {
            btn.classList.toggle('selected', i === index);
        });
        feedback.className = '';
        feedback.style.display = 'none';
    }

    function playAnimation() {
        // 重置動畫
        ant.style.display = 'block';
        ant.style.animation = 'none';
        flow.style.animation = 'none';
        
        // 強制重繪
        void ant.offsetWidth;
        void flow.offsetWidth;

        // 啟動動畫
        ant.style.animation = 'antWalk 3s linear infinite';
        flow.style.animation = 'flowEffect 3s linear infinite';
    }

    function checkAnswer() {
        if (selectedIndex === -1) return;

        if (selectedIndex === correctIndex) {
            feedback.innerHTML = "太棒了！<br>2 + 2 + 2 + 2 + 2 = 10<br>總共走了 10 公分";
            feedback.className = 'success';
            playAnimation();
        } else {
            feedback.innerHTML = "再試一次喔！<br>正五邊形有 5 條邊";
            feedback.className = 'fail';
            setTimeout(() => {
                feedback.style.display = 'none';
            }, 1500);
        }
    }

    // 暴露給外部的檢查介面
    window.check = checkAnswer;

    // 初始化：讓小螞蟻先露個臉
    setTimeout(() => {
        ant.style.display = 'block';
        ant.style.offsetDistance = '0%';
    }, 500);
</script>

<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
