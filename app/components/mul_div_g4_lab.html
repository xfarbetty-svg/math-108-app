<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>N-4-2 較大位數乘除計算・觀念小教室</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
  :root {
    --g4-bg: var(--bg-main, #fff9f0);
    --g4-card: var(--bg-card, #ffffff);
    --g4-line: var(--border-color, #f0e7da);
    --g4-ink: var(--text-primary, #3d3a34);
    --g4-sub: var(--text-secondary, #8a857b);
    --g4-a: var(--accent-primary, #f4694b);
    --g4-mint: var(--accent-mint, #10b981);
    --g4-sky: var(--accent-sky, #3b82f6);
    --g4-amber: #f59e0b;
    --g4-warn: #ef4444;
    --g4-hl: #fef3c7;
    --g4-slot: #f1f5f9;
  }
  html[data-theme="dark"] {
    --g4-bg: var(--bg-main, #161B26);
    --g4-card: var(--bg-card, #1F2736);
    --g4-line: var(--border-color, #334155);
    --g4-ink: var(--text-primary, #E2E8F0);
    --g4-sub: var(--text-secondary, #94A3B8);
    --g4-a: var(--accent-primary, #3B8276);
    --g4-mint: #34d399;
    --g4-sky: #60a5fa;
    --g4-amber: #fbbf24;
    --g4-warn: #f87171;
    --g4-hl: #4a3a12;
    --g4-slot: #283244;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { width: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background: var(--g4-bg);
    color: var(--g4-ink);
    margin: 0;
    padding: 6px 8px;
    height: auto;
    min-height: 0;
    overflow-x: hidden;
    font-size: 12px;
  }
  .wrap { width: 100%; max-width: 100%; display: flex; flex-direction: column; gap: 3px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 18px; }
  .head b { font-size: 12.5px; color: var(--g4-ink); white-space: nowrap; }
  .head-right { display: flex; align-items: center; gap: 5px; min-width: 0; }
  #qtag { font-size: 9px; color: var(--g4-sub); white-space: nowrap; }
  .theme-btn {
    width: 27px; height: 22px; flex: 0 0 auto;
    border: 1px solid var(--g4-line); border-radius: 8px;
    background: var(--g4-card); color: var(--g4-ink);
    cursor: pointer; font-size: 12px; line-height: 1;
  }
  .theme-btn:active { transform: scale(0.94); }
  .src { font-size: 8.5px; color: var(--g4-sub); line-height: 1.2; text-align: right; min-height: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-tabs { display: flex; gap: 3px; }
  .act-tab {
    flex: 1; min-width: 0;
    border: 1px solid var(--g4-line); background: var(--g4-card); color: var(--g4-sub);
    border-radius: 9px; padding: 3px 2px; font-size: 9px; font-weight: 600;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .act-tab.on { background: var(--g4-a); color: #fff; border-color: var(--g4-a); }
  body.q-mode .act-tabs { display: none !important; }
  body.q-mode .case-row { display: none !important; }
  body.q-mode .src { display: none !important; }
  .stage {
    background: var(--g4-card);
    border: 1px solid var(--g4-line);
    border-radius: 10px;
    padding: 4px 5px;
    height: 296px;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .stage-hint { font-size: 9.5px; color: var(--g4-sub); text-align: center; line-height: 1.2; width: 100%; }
  .case-row { display: flex; gap: 3px; flex-wrap: nowrap; overflow-x: auto; width: 100%; min-height: 20px; padding-bottom: 1px; }
  .case-chip {
    flex: 0 0 auto; border: 1px solid var(--g4-line); background: var(--g4-slot); color: var(--g4-sub);
    border-radius: 9px; padding: 2px 6px; font-size: 9px; cursor: pointer; white-space: nowrap;
  }
  .case-chip.on { background: var(--g4-sky); color: #fff; border-color: var(--g4-sky); }
  .msg { font-size: 9px; color: var(--g4-mint); min-height: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 60px; text-align: left; }
  .act-bar { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: nowrap; }
  .mini { flex: 0 0 auto; border: 1px solid var(--g4-line); background: var(--g4-card); color: var(--g4-ink); font-size: 9px; border-radius: 9px; padding: 3px 6px; cursor: pointer; }
  .mini.pri { background: var(--g4-a); color: #fff; border-color: var(--g4-a); }
  .mini.ok { background: var(--g4-mint); color: #fff; border-color: var(--g4-mint); }
  .mini.bad { border-color: var(--g4-warn); color: var(--g4-warn); }
  .mini:disabled { opacity: 0.45; }

  /* 乘法直式：固定 7 欄 = 符號 + 十萬/萬/千/百/十/個，個位永遠同一條垂直線 */
  .mul-grid { display: flex; flex-direction: column; align-items: center; gap: 0; }
  .vrow { display: grid; grid-template-columns: 22px repeat(6, 24px); align-items: center; justify-items: center; height: 20px; }
  .mul-grid.compact .vrow { grid-template-columns: 18px repeat(6, 20px); height: 17px; }
  .cell {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-family: "Courier New", Consolas, monospace; font-weight: 700;
    color: var(--g4-ink); border-radius: 3px; line-height: 1;
  }
  .mul-grid.compact .cell { font-size: 12px; }
  .cell.lab { font-size: 8px; color: var(--g4-sub); font-weight: 400; font-family: inherit; }
  .cell.sym { color: var(--g4-a); font-weight: 700; }
  .cell.carry { height: 100%; font-size: 8px; color: var(--g4-warn); align-items: flex-end; padding-bottom: 1px; }
  .cell.zero { color: var(--g4-mint); }
  .cell.hl { background: var(--g4-hl); outline: 1.5px solid var(--g4-amber); }
  .cell.hline { grid-column: span 6; width: 100%; height: 100%; border-top: 1.5px solid var(--g4-ink); }
  .cell.dtotal { color: var(--g4-a); }
  .row-hidden { visibility: hidden; }
  .tail-note { font-size: 8px; color: var(--g4-sub); line-height: 1.2; text-align: center; width: 100%; }
  .drag-pool { display: flex; gap: 3px; align-items: center; justify-content: center; width: 100%; min-height: 22px; }
  .drag-card {
    border: 1px solid var(--g4-sky); background: color-mix(in srgb, var(--g4-sky) 12%, var(--g4-card));
    color: var(--g4-ink); border-radius: 7px; padding: 2px 5px; font-size: 8.5px; font-weight: 600;
    cursor: grab; user-select: none; touch-action: none; white-space: nowrap;
  }
  .drag-card.done { opacity: 0.45; border-color: var(--g4-mint); }
  .drag-card:active { cursor: grabbing; transform: scale(1.05); }
  .drop-slot { border: 1px dashed var(--g4-line); border-radius: 6px; padding: 2px 5px; font-size: 8px; color: var(--g4-sub); white-space: nowrap; }

  /* 除法直式：標準國小廠字形除號（左側除數欄 + 上方橫線 + 逐層相乘相減落位） */
  .div-board { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .div-grid { display: grid; align-items: center; justify-items: center; }
  .drow { display: contents; }
  .dcell { width: 100%; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: "Courier New", Consolas, monospace; font-weight: 700; color: var(--g4-ink); line-height: 1; }
  .dcell.dlab { height: 13px; font-size: 8px; font-family: inherit; font-weight: 400; color: var(--g4-sub); }
  .dcell.dleft { justify-content: flex-end; padding-right: 4px; font-size: 11px; color: var(--g4-a); }
  .drow[data-kind="d"] .dcell.dleft { border-right: 2px solid var(--g4-ink); border-bottom-right-radius: 5px; }
  .dcell.dtop { border-top: 2px solid var(--g4-ink); }
  .dcell.qcell { color: var(--g4-sky); }
  .dcell.qcell.zero { color: var(--g4-mint); }
  .dcell.qcell.hl { background: var(--g4-hl); outline: 1.5px solid var(--g4-amber); border-radius: 3px; }
  .dcell.dprod { color: var(--g4-sub); }
  .dcell.dbrought { color: var(--g4-sky); background: color-mix(in srgb, var(--g4-sky) 12%, transparent); border-radius: 3px; }
  .dcell.dline { height: 4px; border-top: 0; }
  .dcell.dline.on { border-top: 1.5px solid var(--g4-ink); }
  .dcell.dfinal { background: color-mix(in srgb, var(--g4-mint) 16%, transparent); border-radius: 3px; color: var(--g4-mint); }

  /* 試商天平 */
  .balance-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .balance-svg { width: 220px; height: 56px; overflow: visible; }
  .balance-status { font-size: 9.5px; font-weight: 700; min-height: 13px; text-align: center; }
  .balance-ctrls { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .btn-tune { border: 1px solid var(--g4-line); background: var(--g4-card); color: var(--g4-ink); padding: 2px 6px; border-radius: 8px; font-size: 8.5px; font-weight: 600; cursor: pointer; }
  .btn-tune:hover, .btn-tune:active { background: var(--g4-sky); color: #fff; border-color: var(--g4-sky); }
  .div-note { font-size: 8px; color: var(--g4-sub); text-align: center; line-height: 1.2; }

  /* 簡算對比 */
  .simp-board { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
  .simp-side { display: flex; flex-direction: column; align-items: center; gap: 1px; border: 1px solid var(--g4-line); background: var(--g4-slot); border-radius: 8px; padding: 3px 7px; min-width: 86px; }
  .simp-side.ok { border-color: var(--g4-mint); background: color-mix(in srgb, var(--g4-mint) 14%, transparent); }
  .simp-side b { font-size: 12.5px; font-family: "Courier New", Consolas, monospace; color: var(--g4-ink); }
  .simp-tag { font-size: 8px; color: var(--g4-sub); }
  .simp-mid { font-size: 9px; font-weight: 700; color: var(--g4-amber); text-align: center; white-space: nowrap; }
  .simp-btns { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .simp-note { font-size: 8.5px; text-align: center; line-height: 1.2; color: var(--g4-sub); }
  .simp-note.ok { color: var(--g4-mint); font-weight: 700; }
  .simp-note.bad { color: var(--g4-warn); font-weight: 700; }

  /* 高位估算 */
  .est-box { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .est-left { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .est-q { font-size: 12px; font-weight: 700; color: var(--g4-ink); }
  .est-choices { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .est-choice { border: 1px solid var(--g4-line); background: var(--g4-slot); color: var(--g4-ink); padding: 3px 7px; border-radius: 10px; font-size: 9px; font-weight: 600; cursor: pointer; }
  .est-choice.best { border-color: var(--g4-mint); }
  .est-choice.active { background: var(--g4-amber); color: #fff; border-color: var(--g4-amber); }
  .est-feedback { font-size: 8.5px; line-height: 1.25; text-align: center; min-height: 12px; color: var(--g4-sub); }
  .est-reveal { display: none; width: 100%; flex-direction: column; align-items: center; gap: 1px; }
  .est-reveal.show { display: flex; }
  .est-reveal .div-grid { margin: 0 auto; }
  .est-box.revealed {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .est-box.revealed .est-left {
    flex: 1 1 0;
    min-width: 0;
    align-items: stretch;
    gap: 4px;
  }
  .est-box.revealed .est-q { font-size: 11.5px; text-align: center; }
  .est-box.revealed .est-choices { flex-direction: column; gap: 3px; }
  .est-box.revealed .est-choice { width: 100%; padding: 3px 6px; text-align: center; white-space: nowrap; }
  .est-box.revealed .est-feedback { text-align: left; font-size: 8.5px; }
  .est-box.revealed .est-reveal.show {
    flex: 0 0 auto;
    width: auto;
    justify-content: center;
  }
  .est-box.revealed .mul-grid.compact .vrow { height: 18px; }
  .est-box.revealed .mul-grid.compact .vrow.head-row { height: 14px; }
  .est-box.revealed .mul-grid.compact .vrow[data-row^="carry"] { height: 11px; }
  .est-box.revealed .mul-grid.compact .vrow:has(.hline) { height: 4px; }
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div class="wrap" id="app">
  <div class="head">
    <b>N-4-2 較大位數乘除計算</b>
    <div class="head-right">
      <span id="qtag">觀念小教室</span>
      <button type="button" id="btn-theme" class="theme-btn" title="切換深淺色">🌙</button>
    </div>
  </div>
  <div class="src" id="src"></div>
  <div class="act-tabs" id="actTabs">
    <button type="button" class="act-tab on" data-act="1">① 多位數乘法部分積</button>
    <button type="button" class="act-tab" data-act="2">② 除法試商天平</button>
    <button type="button" class="act-tab" data-act="3">③ 高位估算大挑戰</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="act-bar">
    <button type="button" class="mini pri" id="btn-next">下一步 ▸</button>
    <button type="button" class="mini" id="btn-hl">高光補0</button>
    <button type="button" class="mini" id="btn-carry">進位提示</button>
    <button type="button" class="mini" id="btn-reset">重置</button>
    <span class="msg" id="msg"></span>
  </div>
</div>
<script>
/* N-4-2 觀念小教室：乘法部分積／除法試商天平／高位估算（外殼統一題幹與四選項，本檔不重畫） */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var P = new URLSearchParams(location.search);
  var qRaw = P.get('q');
  var qParsed = parseInt(qRaw, 10);
  var isQMode = qRaw !== null && qRaw !== '' && isFinite(qParsed) && qParsed >= 1 && qParsed <= 10;
  var Q = isQMode ? qParsed : 0;
  if (isQMode) document.body.classList.add('q-mode');

  var EXAM = {
    1: { act: 1, kind: 'mul', a: 58, b: 317 },
    2: { act: 1, kind: 'mul', a: 513, b: 84 },
    3: { act: 1, kind: 'mul', a: 3008, b: 25 },
    4: { act: 1, kind: 'mul', a: 600, b: 50 },
    5: { act: 1, kind: 'mul', a: 125, b: 400 },
    6: { act: 2, kind: 'div1', a: 7006, b: 7 },
    7: { act: 2, kind: 'div2', a: 835, b: 27 },
    8: { act: 2, kind: 'div2', a: 987, b: 56 },
    9: { act: 3, kind: 'est', a: 2159, b: 503 },
    10: { act: 2, kind: 'simp', a: 42000, b: 300 }
  };

  var MUL_CASES = [
    { a: 58, b: 317, label: '58×317' },
    { a: 513, b: 84, label: '513×84' },
    { a: 3008, b: 25, label: '3008×25' },
    { a: 600, b: 50, label: '600×50' },
    { a: 125, b: 400, label: '125×400' }
  ];
  var DIV_CASES = [
    { a: 835, b: 27, kind: 'div2', label: '835÷27' },
    { a: 987, b: 56, kind: 'div2', label: '987÷56' },
    { a: 7006, b: 7, kind: 'div1', label: '7006÷7' },
    { a: 42000, b: 300, kind: 'simp', label: '42000÷300' }
  ];
  var EST_CASES = [
    { a: 58, b: 317, kind: 'mul', label: '58×317' },
    { a: 2159, b: 503, kind: 'div', label: '2159÷503' }
  ];

  function trialStart(a, b) {
    var aStr = String(a), bStr = String(b);
    var take = Math.min(bStr.length, aStr.length);
    var prefix = parseInt(aStr.slice(0, take), 10);
    var round = Math.max(10, Math.round(b / 10) * 10);
    return Math.max(1, Math.min(9, Math.floor(prefix / round) || 1));
  }

  var state = {
    act: 1,
    mul: { a: 58, b: 317 },
    div: { a: 835, b: 27, kind: 'div2' },
    est: { a: 58, b: 317, kind: 'mul' },
    stepN: 0,
    divStep: 0,
    simpStep: 0,
    simpPick: 0,
    trial: 2,
    hl: false,
    carry: false,
    estPick: -1,
    estReveal: false,
    dragIdx: -1
  };

  function setMsg(text) { $('msg').textContent = text || ''; }

  /* ---------- 主題：URL > localStorage > 外殼 postMessage ---------- */
  function applyTheme(theme, persist) {
    var t = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    if (persist) { try { localStorage.setItem('math108_theme', t); } catch (e) {} }
    var btn = $('btn-theme');
    if (btn) {
      btn.textContent = t === 'dark' ? '☀️' : '🌙';
      btn.title = t === 'dark' ? '切換 Light 模式' : '切換 Dark 模式';
    }
  }
  var bootTheme = 'light';
  var urlTheme = P.get('theme');
  if (urlTheme === 'dark' || urlTheme === 'light') {
    bootTheme = urlTheme;
  } else {
    try {
      var saved = localStorage.getItem('math108_theme');
      if (saved === 'dark' || saved === 'light') bootTheme = saved;
    } catch (e) {}
  }
  applyTheme(bootTheme, false);
  $('btn-theme').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next, true);
    setMsg(next === 'dark' ? '已切換深色模式' : '已切換淺色模式');
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && (e.data.theme === 'dark' || e.data.theme === 'light')) {
      applyTheme(e.data.theme, false);
    }
  });

  if (isQMode) {
    var cfg = EXAM[Q];
    state.act = cfg.act;
    if (cfg.kind === 'mul') state.mul = { a: cfg.a, b: cfg.b };
    if (cfg.kind === 'div1' || cfg.kind === 'div2' || cfg.kind === 'simp') {
      state.div = { a: cfg.a, b: cfg.b, kind: cfg.kind };
      state.trial = trialStart(cfg.a, cfg.b);
    }
    if (cfg.kind === 'est') state.est = { a: cfg.a, b: cfg.b, kind: 'div' };
    state.stepN = 0;
    state.divStep = 0;
  } else {
    state.stepN = 1;
    state.divStep = 1;
  }

  function paintHeader() {
    $('qtag').textContent = isQMode ? ('第 ' + Q + ' 題 / 10') : '觀念小教室';
    $('src').textContent = isQMode ? '' : '108 課綱 N-4-2・獅湖／內湖段考真題示例';
  }

  /* ---------- 乘法：部分積資料與直式 ---------- */
  function mulParts(a, b) {
    var bStr = String(b);
    var parts = [];
    for (var i = bStr.length - 1; i >= 0; i--) {
      var d = Number(bStr[i]);
      if (d === 0) continue;
      var shift = bStr.length - 1 - i;
      parts.push({ d: d, shift: shift, raw: a * d, val: a * d * Math.pow(10, shift) });
    }
    return parts;
  }

  function placeDigits(str, endCol, cols) {
    var arr = [];
    for (var i = 0; i < cols; i++) arr.push('');
    var s = String(str);
    var start = endCol - s.length + 1;
    for (var k = 0; k < s.length; k++) {
      var c = start + k;
      if (c >= 0 && c < cols) arr[c] = s[k];
    }
    return arr;
  }

  function trailingZeroCount(v) {
    var s = String(v);
    var n = 0;
    for (var i = s.length - 1; i >= 0; i--) {
      if (s[i] !== '0') break;
      n++;
    }
    return n;
  }

  function mulRow(cells, o) {
    o = o || {};
    var hidden = o.hidden ? ' row-hidden' : '';
    var cls = 'vrow' + (o.cls ? ' ' + o.cls : '') + hidden;
    var h = '<div class="' + cls + '" data-row="' + (o.row || '') + '">';
    h += '<div class="cell sym">' + (o.sym || '') + '</div>';
    var zeroFrom = o.zeroFrom;
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      var cc = o.cellCls || 'cell';
      if (zeroFrom !== undefined && i >= zeroFrom && c === '0') {
        cc += ' zero';
        if (o.hl) cc += ' hl';
      }
      h += '<div class="' + cc + '" data-col="' + i + '">' + c + '</div>';
    }
    h += '</div>';
    return h;
  }

  function mulHline(hidden) {
    return '<div class="vrow hrow' + (hidden ? ' row-hidden' : '') + '">' +
      '<div class="cell sym"></div><div class="cell hline"></div></div>';
  }

  function carryCells(a, d, shift, cols) {
    var arr = [];
    for (var i = 0; i < cols; i++) arr.push('');
    var digits = String(a).split('').map(Number).reverse();
    var carry = 0;
    var base = (cols - 1) - shift;
    for (var k = 0; k < digits.length; k++) {
      var p = digits[k] * d + carry;
      carry = Math.floor(p / 10);
      if (k < digits.length - 1 && carry > 0) {
        var col = base - (k + 1);
        if (col >= 0) arr[col] = String(carry);
      }
    }
    return arr;
  }

  function buildMulGrid(a, b, opts) {
    opts = opts || {};
    var cols = 6;
    var parts = mulParts(a, b);
    var total = a * b;
    var revealAll = !!opts.revealAll;
    var stepN = revealAll ? parts.length + 1 : state.stepN;
    var labels = ['十萬', '萬', '千', '百', '十', '個'];
    var gridCls = 'mul-grid' + (opts.compact ? ' compact' : '');
    var h = '<div class="' + gridCls + '" data-grid="mul">';
    var head = '<div class="vrow head-row" data-row="head"><div class="cell sym"></div>';
    for (var i = 0; i < labels.length; i++) head += '<div class="cell lab">' + labels[i] + '</div>';
    head += '</div>';
    h += head;
    h += mulRow(placeDigits(a, cols - 1, cols), { row: 'a' });
    h += mulRow(placeDigits(b, cols - 1, cols), { row: 'b', sym: '×' });
    h += mulHline(false);
    for (var p = 0; p < parts.length; p++) {
      var part = parts[p];
      var hidden = p >= stepN;
      if (state.carry || revealAll) {
        h += mulRow(carryCells(a, part.d, part.shift, cols), {
          row: 'carry' + p, cellCls: 'cell carry', hidden: hidden
        });
      }
      var cells = placeDigits(part.val, cols - 1, cols);
      var tz = trailingZeroCount(part.val);
      h += mulRow(cells, {
        row: 'p' + p,
        sym: '×' + part.d,
        hidden: hidden,
        zeroFrom: cols - tz,
        hl: state.hl
      });
    }
    h += mulHline(false);
    var totalHidden = stepN <= parts.length;
    h += mulRow(placeDigits(total, cols - 1, cols), {
      row: 'total', cellCls: 'cell dtotal', hidden: totalHidden
    });
    h += '</div>';
    return h;
  }

  function zeroTailNote(a, b) {
    var za = trailingZeroCount(a);
    var zb = trailingZeroCount(b);
    if (za + zb === 0) return '';
    var ca = a / Math.pow(10, za);
    var cb = b / Math.pow(10, zb);
    var core = ca * cb;
    var cz = trailingZeroCount(core);
    return '零尾拆解：' + ca + '×' + cb + '=' + core + '（自帶 ' + cz + ' 個 0）＋ 末尾 0 共 ' +
      za + '+' + zb + ' 個 → 積共 ' + (cz + za + zb) + ' 個 0';
  }

  function caseRow(items, activeLabel, type) {
    if (isQMode) return '';
    var h = '<div class="case-row">';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<button type="button" class="case-chip' + (it.label === activeLabel ? ' on' : '') +
        '" data-case="' + type + '" data-label="' + it.label + '">' + it.label + '</button>';
    }
    return h + '</div>';
  }

  function dragPool(parts) {
    var h = '<div class="drag-pool">';
    for (var i = 0; i < parts.length; i++) {
      h += '<div class="drag-card' + (i < state.stepN ? ' done' : '') + '" data-part="' + i +
        '" draggable="true" title="點一下或拖曳，揭開第 ' + (i + 1) + ' 層部分積">' +
        (i + 1) + '.部分積</div>';
    }
    h += '<span class="drop-slot" id="drop-slot">拖到這裡</span>';
    return h + '</div>';
  }

  function renderMul() {
    var a = state.mul.a, b = state.mul.b;
    var parts = mulParts(a, b);
    var h = caseRow(MUL_CASES, a + '×' + b, 'mul');
    h += '<div class="stage-hint">' + a + ' × ' + b + '：把乘數拆成位值，一層一層算部分積</div>';
    h += buildMulGrid(a, b, {});
    var tail = zeroTailNote(a, b);
    if (tail && (!isQMode || state.stepN > parts.length)) h += '<div class="tail-note">' + tail + '</div>';
    h += dragPool(parts);
    return h;
  }

  function bindMul() {
    var stage = $('stage');
    if (!stage) return;
    var cards = stage.querySelectorAll('.drag-card');
    for (var i = 0; i < cards.length; i++) {
      (function (card) {
        var idx = Number(card.dataset.part);
        function reveal() {
          state.stepN = Math.max(state.stepN, idx + 1);
          setMsg('已揭開第 ' + (idx + 1) + ' 層部分積');
          render();
        }
        card.addEventListener('click', reveal);
        card.addEventListener('pointerdown', function (e) {
          state.dragIdx = idx;
          try { card.setPointerCapture(e.pointerId); } catch (err) {}
        });
        card.addEventListener('pointerup', function (e) {
          if (state.dragIdx !== idx) return;
          var el = document.elementFromPoint(e.clientX, e.clientY);
          var onDrop = el && el.closest ? el.closest('#drop-slot') : null;
          reveal();
          if (onDrop) setMsg('部分積卡已拖曳放入直式！');
        });
      })(cards[i]);
    }
    var drop = $('drop-slot');
    if (drop) {
      drop.addEventListener('click', function () {
        state.stepN = Math.min(mulParts(state.mul.a, state.mul.b).length, state.stepN + 1);
        setMsg('已依序揭開部分積');
        render();
      });
      drop.addEventListener('pointerup', function () {
        if (state.dragIdx < 0) return;
        var idx = state.dragIdx;
        state.dragIdx = -1;
        state.stepN = Math.max(state.stepN, idx + 1);
        setMsg('部分積卡已放入直式！');
        render();
      });
    }
  }
  /* ---------- 除法：逐位商、直式除號、試商天平、同消 0 ---------- */
  function divPlan(a, b) {
    var ds = String(a).split('').map(Number);
    var rem = 0;
    var steps = ds.map(function (digit, i) {
      var cur = rem * 10 + digit;
      var q = Math.floor(cur / b);
      var prod = q * b;
      rem = cur - prod;
      return { i: i, cur: cur, q: q, prod: prod, rem: rem };
    });
    var firstQ = -1;
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].q > 0) { firstQ = i; break; }
    }
    if (firstQ < 0) firstQ = ds.length - 1;
    return { ds: ds, steps: steps, firstQ: firstQ, quotient: Math.floor(a / b), remainder: a % b };
  }

  function alignDigits(v, endCol, cols) {
    var arr = [];
    for (var i = 0; i < cols; i++) arr.push('');
    var s = String(v);
    var start = endCol - s.length + 1;
    for (var k = 0; k < s.length; k++) {
      var c = start + k;
      if (c >= 0 && c < cols) arr[c] = s[k];
    }
    return arr;
  }

  function renderBracket(a, b, opts) {
    opts = opts || {};
    var step = opts.step === undefined ? state.divStep : opts.step;
    var plan = divPlan(a, b);
    var m = plan.ds.length;
    var labels = ['千', '百', '十', '個'].slice(-m);
    var qArr = [];
    for (var qi = 0; qi < m; qi++) {
      var st = plan.steps[qi];
      if (qi < plan.firstQ) qArr.push('');
      else if (qi - plan.firstQ < step) qArr.push(String(st.q));
      else qArr.push('?');
    }
    var rows = [
      { kind: 'lab', cells: labels, visible: true },
      { kind: 'q', cells: qArr, visible: true },
      { kind: 'd', cells: plan.ds.map(String), visible: true }
    ];
    for (var si = plan.firstQ; si < m; si++) {
      var s = plan.steps[si];
      var visible = (si - plan.firstQ) < step;
      var spanLen = Math.max(String(s.prod).length, String(s.cur).length);
      rows.push({ kind: 'p', cells: alignDigits(s.prod, si, m), visible: visible });
      rows.push({ kind: 'h', from: Math.max(0, si - spanLen + 1), to: si, visible: visible });
      if (si < m - 1) {
        var cCells = alignDigits(s.rem, si, m);
        cCells[si + 1] = String(plan.ds[si + 1]);
        rows.push({ kind: 'c', cells: cCells, broughtCol: si + 1, visible: visible });
      } else {
        rows.push({ kind: 'r', cells: alignDigits(s.rem, si, m), visible: visible, final: true });
      }
    }
    var boardAttr = opts.isPlace ? 'place' : 'bracket';
    var h = '<div class="div-board" data-board="' + boardAttr + '"><div class="div-grid" style="grid-template-columns:38px repeat(' + m + ',24px)">';
    for (var r = 0; r < rows.length; r++) {
      var row = rows[r];
      var hidden = row.visible ? '' : ' row-hidden';
      h += '<div class="drow' + hidden + '" data-kind="' + row.kind + '">';
      if (row.kind === 'd') {
        h += '<div class="dcell dleft">' + b + '</div>';
        for (var c1 = 0; c1 < m; c1++) h += '<div class="dcell dtop" data-col="' + c1 + '">' + row.cells[c1] + '</div>';
      } else {
        h += '<div class="dcell dleft"></div>';
        for (var c2 = 0; c2 < m; c2++) {
          if (row.kind === 'h') {
            var on = c2 >= row.from && c2 <= row.to;
            h += '<div class="dcell dline' + (on ? ' on' : '') + '"></div>';
          } else {
            var cls = 'dcell';
            if (row.kind === 'lab') cls += ' dlab';
            if (row.kind === 'q') {
              cls += ' qcell';
              if (row.cells[c2] === '0') {
                cls += ' zero';
                if (state.hl) cls += ' hl';
              }
            }
            if (row.kind === 'p') cls += ' dprod';
            if (row.kind === 'c' && c2 === row.broughtCol) cls += ' dbrought';
            if (row.final) cls += ' dfinal';
            h += '<div class="' + cls + '" data-col="' + c2 + '">' + row.cells[c2] + '</div>';
          }
        }
      }
      h += '</div>';
    }
    h += '</div>';
    if (opts.isPlace) {
      var maxSteps = m - plan.firstQ;
      h += '<div class="div-note">' + (step >= maxSteps
        ? '千位 7÷7＝1；百位、十位、個位都不夠除 → 商補 0 占位，餘數 6。'
        : '按「下一步」逐層展開直式：不夠除時商補 0 占位。') + '</div>';
    }
    h += '</div>';
    return h;
  }

  function buildBalance(a, b) {
    var bLen = String(b).length;
    var take = Math.min(bLen, String(a).length);
    var prefix = parseInt(String(a).slice(0, take), 10);
    var round = Math.max(10, Math.round(b / 10) * 10);
    var trial = state.trial;
    var prod = b * trial;
    var rem = prefix - prod;
    var rot = 0;
    var status = '';
    var color = 'var(--g4-mint)';
    if (prod > prefix) {
      rot = -10;
      status = '乘積 ' + prod + ' ＞ ' + prefix + '，商 ' + trial + ' 太大，請「商減 1」';
      color = 'var(--g4-warn)';
    } else if (rem >= b) {
      rot = 10;
      status = '餘數 ' + rem + ' ≥ 除數 ' + b + '，商 ' + trial + ' 太小，請「商加 1」';
      color = 'var(--g4-amber)';
    } else {
      status = '天平平衡！商 ' + trial + ' 適中（餘數 ' + rem + ' ＜ ' + b + '）';
    }
    var h = '<div class="balance-wrap">';
    h += '<svg class="balance-svg" viewBox="0 0 220 56" aria-label="試商天平">';
    h += '<polygon points="110,20 99,50 121,50" fill="var(--g4-sub)" opacity="0.6"/>';
    h += '<line x1="76" y1="50" x2="144" y2="50" stroke="var(--g4-sub)" stroke-width="2"/>';
    h += '<g transform="rotate(' + rot + ',110,20)" style="transition:transform .25s ease;">';
    h += '<line x1="28" y1="20" x2="192" y2="20" stroke="var(--g4-ink)" stroke-width="3" stroke-linecap="round"/>';
    h += '<circle cx="110" cy="20" r="4" fill="var(--g4-a)"/>';
    h += '<line x1="42" y1="20" x2="42" y2="33" stroke="var(--g4-line)" stroke-width="1.5"/>';
    h += '<path d="M24 33 Q42 41 60 33 Z" fill="var(--g4-slot)" stroke="var(--g4-ink)" stroke-width="1.5"/>';
    h += '<text x="42" y="30" font-size="8" text-anchor="middle" fill="var(--g4-ink)" font-weight="bold">' + b + '×' + trial + '=' + prod + '</text>';
    h += '<line x1="178" y1="20" x2="178" y2="33" stroke="var(--g4-line)" stroke-width="1.5"/>';
    h += '<path d="M160 33 Q178 41 196 33 Z" fill="var(--g4-slot)" stroke="var(--g4-ink)" stroke-width="1.5"/>';
    h += '<text x="178" y="30" font-size="8" text-anchor="middle" fill="var(--g4-ink)" font-weight="bold">' + prefix + '</text>';
    h += '</g></svg>';
    h += '<div class="balance-status" style="color:' + color + '">' + status + '</div>';
    h += '<div class="balance-ctrls">';
    h += '<button type="button" class="btn-tune" id="btn-round-est">四捨五入估商</button>';
    h += '<button type="button" class="btn-tune" id="btn-tune-minus">商減 1</button>';
    h += '<button type="button" class="btn-tune" id="btn-tune-plus">商加 1</button>';
    h += '</div>';
    h += '<div class="div-note">' + a + ' ÷ ' + b + '：把 ' + b + ' 看成 ' + round + ' 試商；' +
      '調到「餘數 ＜ 除數」天平就平衡，再逐位往下算。</div>';
    return h + '</div>';
  }

  function buildSimp(a, b) {
    var ok = state.simpPick === 2;
    var wrong = state.simpPick > 0 && !ok;
    var h = '<div class="simp-board">';
    h += '<div class="simp-side"><span class="simp-tag">原式</span><b>' + a + ' ÷ ' + b + '</b></div>';
    h += '<div class="simp-mid">' + (ok ? '÷100 →' : '同消 ? 個 0') + '</div>';
    h += '<div class="simp-side' + (ok ? ' ok' : '') + '"><span class="simp-tag">等值</span><b>' + (ok ? '420 ÷ 3' : '?') + '</b></div>';
    h += '</div>';
    h += '<div class="simp-btns">';
    for (var n = 1; n <= 3; n++) {
      var cls = 'mini simp-btn';
      if (state.simpPick === n) cls += ok ? ' ok' : ' bad';
      h += '<button type="button" class="' + cls + '" data-simp="' + n + '">消 ' + n + ' 個 0</button>';
    }
    h += '</div>';
    if (ok) {
      h += '<div class="simp-note ok">✓ 42000÷100＝420、300÷100＝3，同消 2 個 0，商不變 → 420÷3</div>';
      h += renderBracket(420, 3, { step: state.simpStep });
    } else if (wrong) {
      h += '<div class="simp-note bad">✗ 除數 300 只有 2 個 0，不能消 ' + state.simpPick + ' 個；再想想看。</div>';
    } else {
      h += '<div class="simp-note">同時消去被除數與除數末尾相同個數的 0，商不變。</div>';
    }
    return h;
  }

  function renderDiv() {
    var a = state.div.a, b = state.div.b, kind = state.div.kind;
    var h = caseRow(DIV_CASES, a + '÷' + b, 'div');
    if (kind === 'div1') {
      h += '<div class="stage-hint">' + a + ' ÷ ' + b + '：標準長除法直式，不夠除就補 0 占位</div>';
      h += renderBracket(a, b, { isPlace: true });
    } else if (kind === 'simp') {
      h += '<div class="stage-hint">' + a + ' ÷ ' + b + '：被除數與除數同消末尾 0，商不變</div>';
      h += '<div class="div-board" data-board="simp">' + buildSimp(a, b) + '</div>';
    } else {
      h += '<div class="stage-hint">' + a + ' ÷ ' + b + '：先試商，再看天平調整</div>';
      h += buildBalance(a, b);
      h += renderBracket(a, b, {});
    }
    return h;
  }

  function bindDiv() {
    var stage = $('stage');
    if (!stage) return;
    var roundBtn = $('btn-round-est');
    if (roundBtn) roundBtn.addEventListener('click', function () {
      var a = state.div.a, b = state.div.b;
      var take = Math.min(String(b).length, String(a).length);
      var prefix = parseInt(String(a).slice(0, take), 10);
      var round = Math.max(10, Math.round(b / 10) * 10);
      state.trial = Math.max(1, Math.min(9, Math.floor(prefix / round) || 1));
      setMsg('把 ' + b + ' 看成 ' + round + '，試商 ' + state.trial);
      render();
    });
    var minusBtn = $('btn-tune-minus');
    if (minusBtn) minusBtn.addEventListener('click', function () {
      state.trial = Math.max(1, state.trial - 1);
      setMsg('調商：商減 1 → ' + state.trial);
      render();
    });
    var plusBtn = $('btn-tune-plus');
    if (plusBtn) plusBtn.addEventListener('click', function () {
      state.trial = Math.min(9, state.trial + 1);
      setMsg('調商：商加 1 → ' + state.trial);
      render();
    });
    var simpBtns = stage.querySelectorAll('[data-simp]');
    for (var i = 0; i < simpBtns.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          var n = Number(btn.dataset.simp);
          state.simpPick = n;
          state.simpStep = 0;
          setMsg(n === 2 ? '同消 2 個 0，商不變 → 420÷3' : '除數 300 只有 2 個 0，不能消 ' + n + ' 個');
          render();
        });
      })(simpBtns[i]);
    }
  }
  /* ---------- 高位估算：概數選項與精算直式 ---------- */
  function estFeedback(kind, idx) {
    if (idx < 0) return '先選一個概數算法，再按「揭開精算直式」對照。';
    var best = idx === 0;
    if (kind === 'mul') {
      return best
        ? '✓ 58 看成 60、317 看成 300 → 60×300=18000，最接近真正積 18386。'
        : '△ 這組概數也能抓量級，但 58 更接近 60、317 更接近 300，用 60×300 最省力。';
    }
    return best
      ? '✓ 503 看成 500、2159 看成 2000 → 2000÷500=4，估商 4 最順手。'
      : '△ 這組也能估出大約 3～4，但 503 最接近 500，用 500 最好算。';
  }

  function renderEst() {
    var e = state.est;
    var isMul = e.kind === 'mul';
    var labels = isMul
      ? ['60 × 300 = 18000', '50 × 300 = 15000', '60 × 400 = 24000', '50 × 400 = 20000']
      : ['2000 ÷ 500 = 4', '2000 ÷ 600 ≈ 3', '2100 ÷ 510 ≈ 4', '2200 ÷ 600 ≈ 3'];
    var h = caseRow(EST_CASES, e.a + (isMul ? '×' : '÷') + e.b, 'est');
    if (!state.estReveal) {
      h += '<div class="stage-hint">高位估算：先抓概數看量級，再揭開精算直式驗證</div>';
    }
    h += '<div class="est-box' + (state.estReveal ? ' revealed' : '') + '">';
    h += '<div class="est-left">';
    h += '<div class="est-q">' + e.a + (isMul ? ' × ' : ' ÷ ') + e.b + ' ≈ ？</div>';
    h += '<div class="est-choices">';
    for (var i = 0; i < labels.length; i++) {
      var cls = 'est-choice' + (state.estPick === i ? ' active' : '');
      h += '<button type="button" class="' + cls + '" data-est="' + i + '">' + labels[i] + '</button>';
    }
    h += '</div>';
    h += '<button type="button" class="mini pri" id="btn-reveal-exact">' + (state.estReveal ? '收起精算直式 ▲' : '揭開精算直式 🔍') + '</button>';
    h += '<div class="est-feedback' + (state.estPick >= 0 ? ' ok' : '') + '">' + estFeedback(e.kind, state.estPick) + '</div>';
    h += '</div>';
    h += '<div class="est-reveal' + (state.estReveal ? ' show' : '') + '" id="est-reveal">';
    if (state.estReveal) {
      h += isMul
        ? buildMulGrid(e.a, e.b, { revealAll: true, compact: true })
        : renderBracket(e.a, e.b, { step: 999 });
    }
    h += '</div>';
    h += '</div>';
    return h;
  }

  function bindEst() {
    var stage = $('stage');
    if (!stage) return;
    var choices = stage.querySelectorAll('[data-est]');
    for (var i = 0; i < choices.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          state.estPick = Number(btn.dataset.est);
          setMsg(state.estPick === 0 ? '概數抓對了！再揭開精算直式對照' : '這組概數也能抓量級，但還有更順手的整百數');
          render();
        });
      })(choices[i]);
    }
    var rev = $('btn-reveal-exact');
    if (rev) rev.addEventListener('click', function () {
      state.estReveal = !state.estReveal;
      setMsg(state.estReveal ? '精算直式已揭開，估算與精算互相驗證' : '已收起精算直式');
      render();
    });
  }

  /* ---------- 主渲染與事件 ---------- */
  function bindCases() {
    var stage = $('stage');
    if (!stage || isQMode) return;
    var chips = stage.querySelectorAll('.case-chip');
    for (var i = 0; i < chips.length; i++) {
      (function (chip) {
        chip.addEventListener('click', function () {
          var label = chip.dataset.label;
          var type = chip.dataset.case;
          if (type === 'mul') {
            for (var m = 0; m < MUL_CASES.length; m++) {
              if (MUL_CASES[m].label === label) state.mul = { a: MUL_CASES[m].a, b: MUL_CASES[m].b };
            }
            state.stepN = 1;
          } else if (type === 'div') {
            for (var d = 0; d < DIV_CASES.length; d++) {
              if (DIV_CASES[d].label === label) state.div = { a: DIV_CASES[d].a, b: DIV_CASES[d].b, kind: DIV_CASES[d].kind };
            }
            state.trial = trialStart(state.div.a, state.div.b);
            state.divStep = 1;
            state.simpPick = 0;
            state.simpStep = 0;
          } else {
            for (var e = 0; e < EST_CASES.length; e++) {
              if (EST_CASES[e].label === label) state.est = { a: EST_CASES[e].a, b: EST_CASES[e].b, kind: EST_CASES[e].kind };
            }
            state.estPick = -1;
            state.estReveal = false;
          }
          setMsg('已切換示例：' + label);
          render();
        });
      })(chips[i]);
    }
  }

  function render() {
    paintHeader();
    var tabs = document.querySelectorAll('.act-tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('on', Number(tabs[i].dataset.act) === state.act);
    }
    var html = '';
    if (state.act === 1) html = renderMul();
    else if (state.act === 2) html = renderDiv();
    else html = renderEst();
    var stage = $('stage');
    stage.innerHTML = html;
    bindCases();
    if (state.act === 1) bindMul();
    else if (state.act === 2) bindDiv();
    else bindEst();
  }

  function resetCurrent() {
    state.hl = false;
    state.carry = false;
    state.dragIdx = -1;
    state.simpPick = 0;
    state.simpStep = 0;
    state.estPick = -1;
    state.estReveal = false;
    state.stepN = isQMode ? 0 : 1;
    state.divStep = isQMode ? 0 : 1;
    state.trial = trialStart(state.div.a, state.div.b);
    setMsg('教具已重置');
    render();
  }

  var tabBtns = document.querySelectorAll('.act-tab');
  for (var tb = 0; tb < tabBtns.length; tb++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        if (isQMode) return;
        state.act = Number(btn.dataset.act);
        state.stepN = 1;
        state.divStep = 1;
        state.simpPick = 0;
        state.simpStep = 0;
        state.estPick = -1;
        state.estReveal = false;
        state.trial = trialStart(state.div.a, state.div.b);
        setMsg('');
        render();
      });
    })(tabBtns[tb]);
  }

  $('btn-next').addEventListener('click', function () {
    if (state.act === 1) {
      var need = mulParts(state.mul.a, state.mul.b).length + 1;
      if (state.stepN < need) {
        state.stepN++;
        setMsg(state.stepN > need - 1 ? '全部部分積與總和已揭開' : '已揭開第 ' + state.stepN + ' 層部分積');
      } else {
        setMsg('部分積與總和已全部揭開');
      }
    } else if (state.act === 2) {
      if (state.div.kind === 'simp') {
        if (state.simpPick !== 2) {
          setMsg('先選「同消幾個 0」，再一步一步看直式');
        } else if (state.simpStep < 3) {
          state.simpStep++;
          setMsg('420÷3 直式：已揭開第 ' + state.simpStep + ' 步');
        } else {
          setMsg('420÷3＝140，與原式答案相同');
        }
      } else {
        var plan = divPlan(state.div.a, state.div.b);
        var maxSteps = plan.ds.length - plan.firstQ;
        if (state.divStep < maxSteps) {
          state.divStep++;
          setMsg('除法直式：已揭開第 ' + state.divStep + ' 層計算');
        } else {
          setMsg('商 ' + plan.quotient + '、餘數 ' + plan.remainder + ' 已全部揭開');
        }
      }
    } else {
      state.estReveal = !state.estReveal;
      setMsg(state.estReveal ? '精算直式已揭開' : '已收起精算直式');
    }
    render();
  });

  $('btn-hl').addEventListener('click', function () {
    state.hl = !state.hl;
    setMsg(state.hl ? '已高光補 0 與占位數字' : '已關閉高光');
    render();
  });

  $('btn-carry').addEventListener('click', function () {
    state.carry = !state.carry;
    setMsg(state.carry ? '已顯示進位／乘積提示' : '已隱藏進位提示');
    render();
  });

  $('btn-reset').addEventListener('click', resetCurrent);

  render();
})();
</script>
</body>
</html>
