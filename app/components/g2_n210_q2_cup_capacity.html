<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-10-Q02 大杯小杯的二分之一</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; --juice:#ffb347; --juice-deep:#e8932f; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-label { font-size:11px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.t-name { font-size:10.5px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:5px 4px; font-size:13.5px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.status { text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-soft); min-height:18px; }
.status b { color:var(--ink); }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:6px; font-size:20px; font-weight:800; }
.v-eq .res { color:var(--mint-deep); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
.vq.show .v-eq { animation:rise .35s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
#cmp { opacity:0; transform:translateY(8px); transition:all .5s; }
#cmp.show { opacity:1; transform:translateY(0); }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>大杯小杯的二分之一</small>哥哥拿大馬克杯倒了 1/2 杯果汁，姐姐拿小水杯倒了 1/2 杯果汁，誰喝到的果汁比較多？</p>
  </div>
  <div class="card">
    <!-- 日系繪本場景：大馬克杯與小水杯各裝半杯果汁，點按鈕倒進一樣大的量杯比較 -->
    <svg class="scene-svg" viewBox="0 0 360 250" role="img" aria-label="大馬克杯和小水杯各裝半杯果汁">
      <!-- 哥哥的大馬克杯 -->
      <g>
        <path d="M40 55 L40 140 Q40 150 50 150 L140 150 Q150 150 150 140 L150 55 Z" fill="#fff" stroke="var(--ink)" stroke-width="2"/>
        <path d="M150 75 Q172 78 172 100 Q172 122 150 125" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <rect x="44" y="103" width="102" height="43" rx="4" fill="var(--juice)" stroke="none"/>
        <line x1="44" y1="103" x2="146" y2="103" stroke="var(--juice-deep)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="95" y="97" class="t-label">1/2 杯</text>
        <text x="95" y="168" class="t-name">哥哥的大馬克杯</text>
      </g>
      <!-- 姐姐的小水杯 -->
      <g>
        <path d="M235 92 L235 168 Q235 176 243 176 L307 176 Q315 176 315 168 L315 92 Z" fill="#fff" stroke="var(--ink)" stroke-width="2"/>
        <rect x="239" y="134" width="72" height="38" rx="4" fill="var(--juice)" stroke="none"/>
        <line x1="239" y1="134" x2="311" y2="134" stroke="var(--juice-deep)" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="275" y="128" class="t-label">1/2 杯</text>
        <text x="275" y="194" class="t-name">姐姐的小水杯</text>
      </g>
      <!-- 倒進一樣大的量杯比較 -->
      <g id="cmp">
        <text x="180" y="216" class="t-label">倒進一樣大的量杯 ↓</text>
        <g transform="translate(0,0)">
          <rect x="62" y="206" width="0" height="0" fill="none"/>
          <rect x="62" y="218" width="76" height="0" fill="none"/>
        </g>
      </g>
      <text x="180" y="246" class="t-caption">兩杯都是「1/2 杯」</text>
    </svg>
    <div class="tools">
      <button type="button" class="tool-btn" id="pour">倒出來比一比 🥛</button>
    </div>
    <p class="status" id="status">都寫「1/2 杯」，喝到的果汁一樣多嗎？</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-eq"><span>大杯的 1/2</span><span>&gt;</span><span class="res">小杯的 1/2</span></div>
    <p class="v-notes">1/2 杯是「<b>那個杯子</b>」的一半，<b>整體不同，一半就不同</b>：<br>大馬克杯整體大，一半的果汁就多；小水杯整體小，一半就少。<br>所以<b>哥哥喝到的比較多</b>。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var CHOICES = ['哥哥喝的比較多', '姐姐喝的比較多', '兩人喝得一樣多', '無法比較'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  var status = document.getElementById('status');
  var cmp = document.getElementById('cmp');
  var poured = false;
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  function el(name, attrs, parent) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  document.getElementById('pour').addEventListener('click', function () {
    if (poured) return;
    poured = true;
    cmp.textContent = '';
    el('text', { x: 180, y: 208, 'class': 't-label' }, cmp).textContent = '倒進一樣大的量杯 ↓';
    [[62, 52, '哥哥'], [212, 26, '姐姐']].forEach(function (d) {
      var x = d[0], h = d[1], who = d[2];
      el('rect', { x: x, y: 254 - 60, width: 80, height: 56, rx: 6, fill: '#fff', stroke: 'var(--ink)', 'stroke-width': 2 }, cmp);
      el('rect', { x: x + 4, y: 254 - 8 - h, width: 72, height: h, rx: 4, fill: 'var(--juice)' }, cmp);
      el('text', { x: x + 40, y: 254 + 6, 'class': 't-name' }, cmp).textContent = who;
    });
    cmp.classList.add('show');
    status.innerHTML = '一樣大的量杯裡，<b>大杯的一半</b>果汁比較高、比較多！';
    say('倒進一樣大的量杯，大杯的一半比較多。');
  });
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el2) { el2.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！大馬克杯的一半，實際果汁比小水杯的一半多。';
      vq.classList.add('show');
      say('答對！大馬克杯的一半比較多。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：1/2 是「那個杯子」的一半，杯子大小不同，一半會一樣多嗎？';
    say('再想想看：杯子大小不同，一半會一樣多嗎。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-10-Q02', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
