<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>G4-N-4-13 日常時間的計算・108課綱互動教具</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
:root{
  --bg:var(--bg-main); --card:var(--bg-card); --elev:var(--bg-elevated);
  --ink:var(--text-primary); --soft:var(--text-secondary); --line:var(--border-color);
  --a:var(--accent-primary); --mint:var(--accent-mint); --sky:var(--accent-sky);
  --lemon:var(--accent-lemon); --ok:#15803d; --warn:#b91c1c;
  --shadow:0 4px 12px var(--shadow-color); --radius:11px;
}
html[data-theme="dark"]{--ok:#4ade80;--warn:#fca5a5;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100vw;overflow-x:hidden;height:auto;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{margin:0;padding:8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{width:100%;max-width:520px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:20px;font-size:10px;color:var(--soft)}
.head b{font-size:11.5px;color:var(--ink);font-weight:900}
.head-right{display:flex;align-items:center;gap:5px}
#btn-theme{width:24px;height:24px;flex:0 0 24px;border:1.5px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
#modeTag{font-size:9.5px;font-weight:800;color:var(--a);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--elev);padding:3px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:900;color:var(--soft);white-space:nowrap}
.tab.active{background:var(--card);color:var(--a);box-shadow:0 2px 5px rgba(0,0,0,.08)}
body.q-mode .tabs{display:none!important}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);max-width:100%}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.badge{background:var(--elev);color:var(--a);font-size:9px;font-weight:900;padding:2px 6px;border-radius:999px;white-space:nowrap}
.title{font-size:11.5px;font-weight:900;color:var(--ink);line-height:1.25}
.desc{font-size:10px;line-height:1.35;color:var(--soft)}
.box{background:var(--elev);border:1px solid var(--line);border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.actrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
.actbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:3px 8px;font-size:10px;font-weight:900;transition:transform .08s}
.actbtn.main{border-color:var(--a);color:var(--a)}
.actbtn.sel,.actbtn.active{background:var(--a);color:#fff;border-color:var(--a)}
.actbtn:active{transform:translateY(1px)}
.msg{background:var(--elev);border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:10px;line-height:1.3;color:var(--ink);font-weight:700;text-align:left;min-height:18px}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.msg.warn{border-color:var(--warn);color:var(--warn)}
.explain{display:grid;grid-template-columns:36px 1fr;gap:2px 5px;font-size:9.5px;line-height:1.3;background:var(--elev);border-radius:7px;padding:4px 6px;border:1px dashed var(--line)}
.explain .k{color:var(--a);font-weight:900;white-space:nowrap}
.explain .v{color:var(--ink);min-width:0;word-break:break-word}
.explain .trap{color:var(--warn)}
[hidden]{display:none!important}

/* SVG 時間軸與互動區 */
.tl-svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.tl-label{font-size:10px;font-weight:800;fill:var(--ink)}
.tl-sub{font-size:9px;font-weight:700;fill:var(--soft)}
.tl-accent{font-size:10px;font-weight:900;fill:var(--a)}
.tl-ok{font-size:10px;font-weight:900;fill:var(--ok)}

/* 複名數對齊直式板 */
.col-board{display:grid;grid-template-columns:22px 1fr 22px 1fr 22px;gap:1px 3px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:900}
.col-h{font-size:9px;color:var(--soft);text-align:center;border-bottom:1px dashed var(--line);padding-bottom:1px}
.col-v{text-align:right;padding:1px 4px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.col-u{font-size:9.5px;color:var(--soft);text-align:left}
.col-op{text-align:center;color:var(--a);font-size:12px}
.col-line{grid-column:1/-1;height:1.5px;background:var(--ink);margin:1px 0;opacity:.75}
.strike{text-decoration:line-through;opacity:.45;font-size:10px;margin-right:2px}
.hi{color:var(--a);background:rgba(244,105,75,.14)}
html[data-theme="dark"] .hi{background:rgba(59,130,118,.28)}
.ok-cell{color:var(--ok)}

/* 廠字形長除法網格 (Q01) */
.ldiv{display:inline-grid;grid-template-columns:24px repeat(3,20px);gap:1px 2px;align-items:center;justify-items:center;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:900;margin:0 auto}
.ld-q{color:var(--ok)}
.ld-div{border-right:2px solid var(--ink);border-radius:0 0 5px 0;padding-right:4px}
.ld-top{border-top:2px solid var(--ink);width:100%;text-align:center}
.ld-sub{border-bottom:1.5px solid var(--ink);width:100%;text-align:center}

/* 左右雙欄緊湊排版 */
.two-col{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
.two-col-right{display:flex;flex-direction:column;gap:4px;min-width:0}

/* 互動輸入列 */
.inp-row{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;font-size:10.5px;font-weight:800}
.num-inp{width:46px;padding:2px 4px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:12px;font-weight:900;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.num-inp:focus{outline:none;border-color:var(--a)}
.chip-row{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:3px 7px;font-size:10.5px;font-weight:900;font-variant-numeric:tabular-nums}
.chip.accent{border-color:var(--a);color:var(--a)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pick-card{background:var(--card);border:1.5px solid var(--line);border-radius:7px;padding:4px 6px;font-size:9.5px;font-weight:800;text-align:left;line-height:1.25;transition:border-color .12s}
.pick-card.sel{border-color:var(--a);background:rgba(244,105,75,.10)}
html[data-theme="dark"] .pick-card.sel{background:rgba(59,130,118,.22)}
input[type=range]{width:100%;accent-color:var(--a);height:16px}

@media (max-width:390px){
  .head b{font-size:11px}
  .tab{font-size:9.5px;padding:4px 6px}
  .title{font-size:11px}
  .col-v{font-size:11px}
}
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div id="app">
  <div class="head">
    <b>N-4-13 日常時間的計算・跨日／跨時／跨分</b>
    <div class="head-right"><span id="modeTag">🌱 概念探索</span><button id="btn-theme" type="button" aria-label="切換主題">🌙</button></div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" type="button" data-act="0">活動一・跨日作息</button>
    <button class="tab" type="button" data-act="1">活動二・跨時旅程</button>
    <button class="tab" type="button" data-act="2">活動三・跨分直式</button>
  </nav>

  <section class="panel" id="act0"></section>
  <section class="panel" id="act1" hidden></section>
  <section class="panel" id="act2" hidden></section>
  <section class="panel" id="examPanel" hidden></section>
</div>

<script>
const P = new URLSearchParams(location.search);
const qParam = parseInt(P.get('q') || '0', 10);
const EXAM = qParam >= 1 && qParam <= 10;
const Q = EXAM ? qParam : 1;
const $ = id => document.getElementById(id);

window.__N413_MODE__ = EXAM ? 'exam' : 'concept';
window.__N413_Q__ = Q;

/* 主題同步 */
function applyTheme(t) {
  const theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  $('btn-theme').textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(P.get('theme') || localStorage.getItem('math108_theme') || 'light');
$('btn-theme').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('math108_theme', next);
  applyTheme(next);
};
window.addEventListener('message', e => {
  if (e && e.data && e.data.type === 'THEME_CHANGE') applyTheme(e.data.theme);
});

/* ================= 觀念探索模式（三道獨立生活情境，與真題零重複） ================= */
let actIdx = 0;
let c1Cursor = 585; // 露營睡眠：20:30 到 隔天06:15 = 585分 (9時45分)
let c2Step = 0;     // 高鐵旅程：10:40 + 2時35分
let c3Op = 'add';   // 烘焙教室：add (25分20秒+18分50秒) | sub (40分15秒-16分42秒)
let c3Step = 0;

function fmtHM(totalMin) {
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return `${h} 小時 ${m} 分鐘`;
}

function renderAct0() {
  // 情境：小宇的星空露營日誌（晚上 8:30 入睡 → 隔天早上 6:15 起床）
  // 總共 585 分鐘：前段 210 分 (20:30~24:00)，後段 375 分 (00:00~06:15)
  const ratio = Math.max(0, Math.min(1, c1Cursor / 585));
  const curMin = Math.round(c1Cursor);
  const absMin = (20 * 60 + 30 + curMin) % 1440;
  const ch = Math.floor(absMin / 60), cm = absMin % 60;
  const dayTag = (20 * 60 + 30 + curMin) >= 1440 ? '隔天' : '今天';
  const curStr = `${dayTag} ${String(ch).padStart(2, '0')}:${String(cm).padStart(2, '0')}`;
  const xEnd = 36 + 290 * ratio;
  const xMid = 36 + 290 * (210 / 585); // 午夜 24:00 位置

  $('act0').innerHTML = `
    <div class="card-head"><span class="badge">🌱 活動一・跨日作息時間線</span><span class="title">星空露營睡眠紀錄（午夜分段法）</span></div>
    <p class="desc">小宇 <b>晚上 8 時 30 分</b>（20:30）入睡，<b>隔天早上 6 時 15 分</b>（06:15）起床。拖動時間軸觀察如何以「午夜 24:00」分段！</p>
    <div class="box">
      <svg class="tl-svg" id="c1Svg" viewBox="0 0 360 76" aria-label="跨日時間軸">
        <rect x="36" y="28" width="290" height="10" rx="5" fill="var(--card)" stroke="var(--line)"/>
        <rect x="36" y="28" width="${Math.max(0, Math.min(xEnd, xMid) - 36).toFixed(1)}" height="10" rx="5" fill="var(--sky)"/>
        ${xEnd > xMid ? `<rect x="${xMid.toFixed(1)}" y="28" width="${(xEnd - xMid).toFixed(1)}" height="10" rx="5" fill="var(--mint)"/>` : ''}
        <line x1="${xMid.toFixed(1)}" y1="18" x2="${xMid.toFixed(1)}" y2="48" stroke="var(--a)" stroke-width="2" stroke-dasharray="3 2"/>
        <circle cx="36" cy="33" r="4.5" fill="var(--a)"/>
        <circle cx="${xEnd.toFixed(1)}" cy="33" r="6" fill="var(--a)" stroke="var(--card)" stroke-width="2"/>
        <text x="36" y="16" text-anchor="middle" class="tl-sub">20:30</text>
        <text x="${xMid.toFixed(1)}" y="14" text-anchor="middle" class="tl-accent">午夜 24:00 (0:00)</text>
        <text x="326" y="16" text-anchor="middle" class="tl-sub">隔天 06:15</text>
        <text x="88" y="57" text-anchor="middle" class="tl-label">今天段：3 時 30 分</text>
        <text x="235" y="57" text-anchor="middle" class="tl-label">隔天段：6 時 15 分</text>
        <text x="180" y="71" text-anchor="middle" class="tl-ok">目前停在 ${curStr}（已過 ${fmtHM(curMin)}）</text>
      </svg>
      <div class="actrow">
        <button class="actbtn ${curMin === 210 ? 'sel' : ''}" type="button" data-cur="210">停在午夜 (3時30分)</button>
        <button class="actbtn main ${curMin === 585 ? 'sel' : ''}" type="button" data-cur="585">到起床 (9時45分)</button>
      </div>
    </div>
    <div class="msg ok">💡 跨日分段：先算今天到午夜 24:00（3時30分），再加隔天凌晨（6時15分）＝ <b>9 小時 45 分鐘</b>。</div>
  `;

  const svg = $('c1Svg');
  let dragging = false;
  const updateFromClientX = (clientX) => {
    const r = svg.getBoundingClientRect();
    const vx = ((clientX - r.left) / r.width) * 360;
    const f = Math.max(0, Math.min(1, (vx - 36) / 290));
    c1Cursor = Math.round(f * 585);
    renderAct0();
  };
  svg.addEventListener('pointerdown', e => { dragging = true; svg.setPointerCapture && svg.setPointerCapture(e.pointerId); updateFromClientX(e.clientX); });
  svg.addEventListener('pointermove', e => { if (dragging) updateFromClientX(e.clientX); });
  svg.addEventListener('pointerup', () => { dragging = false; });
  $('act0').querySelectorAll('[data-cur]').forEach(b => b.onclick = () => { c1Cursor = +b.dataset.cur; renderAct0(); });
}

function renderAct1() {
  // 情境：小晴搭高鐵看海（10 時 40 分發車 ＋ 行車 2 小時 35 分鐘）
  const p1 = c2Step >= 1;
  const p2 = c2Step >= 2;
  const timeText = !p1 ? '10 時 40 分（出發）' : !p2 ? '12 時 40 分（＋2 小時）' : '13 時 15 分 ＝ 下午 1 時 15 分';

  $('act1').innerHTML = `
    <div class="card-head"><span class="badge">🌱 活動二・跨時旅程推算</span><span class="title">高鐵看海時刻表（12 時制 ↔ 24 時制）</span></div>
    <p class="desc">小晴搭高鐵 <b>上午 10 時 40 分</b>出發，車程 <b>2 小時 35 分鐘</b>，什麼時候到達海邊車站？</p>
    <div class="box">
      <svg class="tl-svg" viewBox="0 0 360 66" aria-label="高鐵跨午時刻線">
        <line x1="28" y1="36" x2="332" y2="36" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="48" cy="36" r="5" fill="var(--a)"/>
        <text x="48" y="54" text-anchor="middle" class="tl-label">10:40 出發</text>
        ${p1 ? `<path d="M48,32 Q128,8 208,32" fill="none" stroke="var(--sky)" stroke-width="2.5"/>
                <text x="128" y="14" text-anchor="middle" class="tl-accent">＋2 小時</text>
                <circle cx="208" cy="36" r="5" fill="var(--sky)"/>
                <text x="208" y="54" text-anchor="middle" class="tl-label">12:40</text>` : ''}
        ${p2 ? `<path d="M208,32 Q256,12 304,32" fill="none" stroke="var(--mint)" stroke-width="2.5"/>
                <text x="256" y="14" text-anchor="middle" class="tl-ok">＋35 分（滿60進1時）</text>
                <circle cx="304" cy="36" r="5.5" fill="var(--ok)"/>
                <text x="304" y="54" text-anchor="middle" class="tl-ok">13:15 (下午1:15)</text>` : ''}
      </svg>
      <div class="chip-row">
        <span class="chip ${p2 ? 'ok' : 'accent'}">目前時刻：${timeText}</span>
      </div>
      <div class="actrow">
        <button class="actbtn main" id="c2S1" type="button">① 先加 2 小時</button>
        <button class="actbtn" id="c2S2" type="button">② 再加 35 分鐘</button>
        <button class="actbtn" id="c2Rst" type="button">重置</button>
      </div>
    </div>
    <div class="msg ${p2 ? 'ok' : ''}">
      ${!p1 ? '點擊「① 先加 2 小時」，先跳到中午 12 時 40 分。' : !p2 ? '12 時 40 分 ＋ 35 分 ＝ 12 時 75 分，75 分滿 60 進 1 時！' : '✅ 12 時 75 分 ＝ 13 時 15 分；減去 12 時就是「下午 1 時 15 分」。'}
    </div>
  `;
  $('c2S1').onclick = () => { c2Step = 1; renderAct1(); };
  $('c2S2').onclick = () => { c2Step = 2; renderAct1(); };
  $('c2Rst').onclick = () => { c2Step = 0; renderAct1(); };
}

function renderAct2() {
  // 情境：烘焙教室烤餅乾（進位加法 25分20秒 + 18分50秒 / 退位減法 40分15秒 - 16分42秒）
  const isAdd = c3Op === 'add';
  const step1 = c3Step >= 1;
  const step2 = c3Step >= 2;
  const board = isAdd ? `
    <div class="col-board">
      <span></span><span class="col-h">分</span><span></span><span class="col-h">秒</span><span></span>
      <span class="col-op"></span><span class="col-v">25</span><span class="col-u">分</span><span class="col-v">20</span><span class="col-u">秒</span>
      <span class="col-op">＋</span><span class="col-v">18</span><span class="col-u">分</span><span class="col-v">50</span><span class="col-u">秒</span>
      <div class="col-line"></div>
      <span class="col-op">＝</span>
      <span class="col-v ${step2 ? 'ok-cell' : ''}">${!step1 ? '?' : !step2 ? '43' : '<span class="strike">43</span><span class="hi">44</span>'}</span><span class="col-u">分</span>
      <span class="col-v ${step2 ? 'ok-cell' : ''}">${!step1 ? '?' : !step2 ? '70' : '<span class="strike">70</span><span class="hi">10</span>'}</span><span class="col-u">秒</span>
    </div>` : `
    <div class="col-board">
      <span></span><span class="col-h">分</span><span></span><span class="col-h">秒</span><span></span>
      <span class="col-op"></span><span class="col-v">${step1 ? '<span class="strike">40</span><span class="hi">39</span>' : '40'}</span><span class="col-u">分</span>
      <span class="col-v">${step1 ? '<span class="strike">15</span><span class="hi">75</span>' : '15'}</span><span class="col-u">秒</span>
      <span class="col-op">−</span><span class="col-v">16</span><span class="col-u">分</span><span class="col-v">42</span><span class="col-u">秒</span>
      <div class="col-line"></div>
      <span class="col-op">＝</span>
      <span class="col-v ${step2 ? 'ok-cell' : ''}">${step2 ? '23' : '?'}</span><span class="col-u">分</span>
      <span class="col-v ${step2 ? 'ok-cell' : ''}">${step2 ? '33' : '?'}</span><span class="col-u">秒</span>
    </div>`;

  $('act2').innerHTML = `
    <div class="card-head"><span class="badge">🌱 活動三・跨分 60 進位直式</span><span class="title">烘焙教室計時器（滿 60 進 1 / 借 1 變 60）</span></div>
    <p class="desc">${isAdd ? '餅乾發酵 <b>25 分 20 秒</b>、烘烤 <b>18 分 50 秒</b>，共花多久？' : '原訂烘焙 <b>40 分 15 秒</b>，提早 <b>16 分 42 秒</b>結束，實際烤了多久？'}</p>
    <div class="box">
      <div class="actrow">
        <button class="actbtn ${isAdd ? 'sel' : ''}" type="button" data-op="add">進位加法（發酵＋烘烤）</button>
        <button class="actbtn ${!isAdd ? 'sel' : ''}" type="button" data-op="sub">退位減法（提早結束）</button>
      </div>
      ${board}
      <div class="actrow">
        <button class="actbtn main" id="c3S1" type="button">${isAdd ? '① 先各欄相加' : '① 借 1 分＝60 秒'}</button>
        <button class="actbtn" id="c3S2" type="button">${isAdd ? '② 滿 60 秒進 1 分' : '② 算出剩餘時間'}</button>
        <button class="actbtn" id="c3Rst" type="button">重置</button>
      </div>
    </div>
    <div class="msg ${step2 ? 'ok' : ''}">
      ${isAdd

  $('examPanel').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { st.pick = +b.dataset.pick; renderExam(); });
  if ($('inpA')) $('inpA').oninput = e => { st.uA = e.target.value; };
  if ($('inpB')) $('inpB').oninput = e => { st.uB = e.target.value; };

  $('verifyBtn').onclick = () => {
    if (Q === 2) {
      if (st.pick === null) { st.ok = false; st.msg = '請先點選一張情境卡片檢驗時刻或時間量！'; }
      else if (st.pick === 2) { st.ok = true; st.msg = '✓ 檢驗正確！這句描述的是「經過多久（時間量）」。'; }
      else { st.ok = false; st.msg = '⚠️ 這張卡片只標示了某個時間點（時刻），再試一張看看！'; }
    } else if (Q === 3) {
      if (st.pick === null) { st.ok = false; st.msg = '請先點選上方任一條進位規則進行檢驗！'; }
      else if (st.pick === 2) { st.ok = true; st.msg = '✓ 抓到破綻了！每個月天數不同，日與月不是 24 進位。'; }
      else { st.ok = false; st.msg = '⚠️ 這條敘述本身是正確的喔，請檢驗哪一條的進位法有問題！'; }
    } else {
      const a = parseInt(st.uA, 10), b = parseInt(st.uB, 10);
      const [ea, eb] = EXPECTED[Q];
      if (Number.isNaN(a) || Number.isNaN(b)) {
        st.ok = false; st.msg = '請先在空格填入數字，或先按上方步驟鈕觀察借位／進位！';
      } else if (a === ea && b === eb) {
        st.ok = true; st.msg = '✓ 算式驗算正確！請回上方外殼點選對應的答案選項。';
      } else {
        st.ok = false; st.msg = '⚠️ 數值還不對喔，檢查一下是否滿 60（或滿 24）忘記進位／借位！';
      }
    }
    renderExam();
  };

  $('revealSteps').onclick = () => {
    st.shown = !st.shown;
    renderExam();
  };
}

if (EXAM) {
  document.body.classList.add('q-mode');
  $('modeTag').textContent = `🎯 第 ${Q} 題`;
  $('examPanel').hidden = false;
  [0, 1, 2].forEach(i => { $('act' + i).hidden = true; });
  renderExam();
} else {
  $('modeTag').textContent = '🌱 概念探索';
  setAct(0);
}
</script>
</body>
</html>
