<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-11-Q05 單位換算與大小比較</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-num { font-size:11px; font-weight:800; fill:var(--ink-soft); }
.opts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:5px 2px; font-size:14px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.status { text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-soft); min-height:18px; }
.status b { color:var(--ink); }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:6px; font-size:18px; font-weight:800; }
.v-eq .res { color:var(--red); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
.vq.show .v-eq { animation:pop .3s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>單位換算與大小比較</small>在「6 公尺 7 公分 □ 670 公分」中，□ 裡應該填入哪一個符號？</p>
  </div>
  <div class="card">
    <!-- 日系繪本場景：同一條數線（公分）上排比較條 -->
    <svg class="scene-svg" viewBox="0 0 360 224" role="img" aria-label="6公尺7公分與670公分排在同一條公分數線上">
      <text x="180" y="18" class="t-caption">同一條「公分」數線</text>
      <g id="brk" opacity="0">
        <path d="M40 84 Q40 96 52 96 L262 96 Q274 96 274 84" fill="none" stroke="var(--red)" stroke-width="1.6"/>
        <text x="157" y="112" class="t-num" text-anchor="middle" fill="var(--red)">600 ＋ 7（都用公分）</text>
      </g>
      <rect x="40" y="52" width="240" height="22" rx="6" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/>
      <rect x="280" y="52" width="4" height="22" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="284" y1="38" x2="302" y2="30" stroke="var(--ink-soft)" stroke-width="1.2"/>
      <circle cx="312" cy="26" r="13" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="312" y="30" class="t-num" text-anchor="middle">7</text>
      <text x="160" y="67" class="t-num" fill="var(--ink)">6 公尺</text>
      <text x="40" y="46" class="t-num" text-anchor="start">6 公尺 7 公分</text>
      <rect x="40" y="130" width="268" height="22" rx="6" fill="var(--lemon)" stroke="var(--ink)" stroke-width="1.4"/>
      <text x="174" y="145" class="t-num" fill="var(--ink)">670 公分</text>
      <line x1="40" y1="176" x2="320" y2="176" stroke="var(--ink)" stroke-width="2"/>
      <g id="axis"></g>
      <text x="180" y="216" class="t-caption">先把兩邊都換成公分，再比長短</text>
    </svg>
    <div class="tools">
      <button type="button" class="tool-btn" id="tool">拆成 600 和 7 看看 🧩</button>
    </div>
    <p class="status" id="status">先統一單位，再把兩邊放到同一條數線上比。</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-eq"><span>6 公尺 7 公分</span><span>＝</span><span>600＋7</span><span>＝</span><span class="res">607 公分</span></div>
    <p class="v-notes">6 公尺＝<b>600 公分</b>，加 7 公分合起來是 <b>607 公分</b>。<br><b>607＜670</b>，所以 □ 裡要填<b>「＜」</b>。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ['>', '<', '=', '無法比較'];
  var ANSWER = 1;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  var status = document.getElementById('status');
  var tool = document.getElementById('tool');
  var on = false;
  var NS = 'http://www.w3.org/2000/svg';
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  (function buildAxis() {
    var axis = document.getElementById('axis');
    for (var cm = 0; cm <= 700; cm += 100) {
      var x = 40 + cm * 0.4;
      var l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x); l.setAttribute('x2', x);
      l.setAttribute('y1', 176); l.setAttribute('y2', cm % 200 === 0 ? 184 : 181);
      l.setAttribute('stroke', '#8a857b'); l.setAttribute('stroke-width', cm % 200 === 0 ? 1.8 : 1);
      axis.appendChild(l);
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', 195);
      t.setAttribute('class', 't-num'); t.setAttribute('text-anchor', 'middle');
      t.textContent = cm;
      axis.appendChild(t);
    }
  })();
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  tool.addEventListener('click', function () {
    on = !on;
    document.getElementById('brk').setAttribute('opacity', on ? '1' : '0');
    status.innerHTML = on ? '6 公尺拆成 <b>600 公分</b>，再加上 <b>7 公分</b>，兩邊都是公分了。' : '先統一單位，再把兩邊放到同一條數線上比。';
    if (on) say('六公尺是六百公分，再加上七公分。');
  });
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！6 公尺 7 公分＝607 公分，607＜670，要填「＜」。';
      vq.classList.add('show');
      say('答對！六百零七小於六百七十，要填小於。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：先把 6 公尺換成公分，兩邊單位一樣才能比大小。';
    say('再想想看：先把單位統一成公分。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-11-Q05', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
