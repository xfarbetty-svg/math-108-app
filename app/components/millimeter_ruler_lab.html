<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3-N-3-12 長度（毫米） 擬物實驗台</title>
    <style>
        :root {
            --bg: #fff9f0;
            --card: #ffffff;
            --coral: #ff8a65;
            --mint: #7bc9b2;
            --lemon: #ffd166;
            --text-dark: #333;
            --muted: #b0a08a;
            --success: #7bc9b2;
            --error: #e57373;
            --sky: #4fc3f7;
            --indigo: #5c6bc0;
            --purple: #8b5cf6;
            --amber: #f59e0b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: auto; min-height: auto; margin: 0; padding: 0; }
        body {
            padding: 6px;
            font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 100%;
            height: auto;
            min-height: auto;
            background: transparent;
            border: none;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .header {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin: 0;
            letter-spacing: 1px;
        }
        .question-box {
            background: var(--card);
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12.5px;
            line-height: 1.3;
            min-height: 34px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 14px rgba(149,117,76,0.08);
            border-left: 4px solid var(--coral);
        }
        .calc-card {
            background: var(--card);
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(149,117,76,0.08);
            padding: 3px 6px 4px;
        }
        .calc-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            width: 100%;
            max-width: 250px;
            height: auto;
            display: block;
        }
        .expr { font-size: 13.5px; fill: var(--text-dark); font-weight: 600; }
        .expr-coral { font-size: 13.5px; fill: var(--coral); font-weight: bold; }
        .expr-mint { font-size: 13px; fill: var(--mint); font-weight: bold; }
        .expr-red { font-size: 12.5px; fill: var(--error); font-weight: bold; }
        .expr-sky { font-size: 13px; fill: var(--sky); font-weight: bold; }
        .cap { font-size: 11.5px; min-height: 16px; text-align: center; color: var(--coral); font-weight: bold; line-height: 1.25; }
        .controls { display: flex; flex-direction: column; gap: 4px; }
        .step-btn, .check-btn {
            border: none;
            color: white;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 3px 8px rgba(149,117,76,0.15);
            transition: all 0.2s ease;
        }
        .step-btn { background: var(--mint); }
        .step-btn:hover { background: #66bb9a; }
        .check-btn { background: var(--coral); }
        .check-btn:hover { background: #ff7043; }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .option-btn {
            background: var(--bg-card);
            border: 1.5px solid #ebd9c8;
            color: var(--text-dark);
            padding: 6px 4px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            text-align: center;
            line-height: 1.2;
        }
        .option-btn:hover {
            border-color: var(--coral);
            background: #fff5ee;
        }
        .option-btn.selected {
            background: var(--coral);
            border-color: var(--coral);
            color: #fff;
            box-shadow: 0 3px 10px rgba(255,138,101,0.3);
        }
        .feedback {
            display: none;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.35;
            text-align: center;
            font-weight: 500;
        }
        .feedback.show { display: block; }
        .feedback.correct { background: #e8f7f1; color: #2e7d32; border: 1px solid var(--mint); }
        .feedback.wrong { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        /* 當被 iframe 嵌入時，隱藏重複的確認答案按鈕，由 shell 底部的檢查按鈕統一代理 */
        body.in-iframe .check-btn {
            display: none;
        }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div id="app">
    <div class="header">✦ G3-N-3-12 長度（毫米） 擬物實驗台 ✦</div>
    <div class="question-box" id="questionBox">載入題目中...</div>
    <div class="calc-card">
        <div class="calc-area">
            <svg id="drawSvg" viewBox="0 0 250 160">
                <g id="drawLayer"></g>
            </svg>
        </div>
        <div class="cap" id="capText">點擊「逐步算理」看毫米動態</div>
    </div>
    <div class="controls">
        <button class="step-btn" id="stepBtn" onclick="nextStep()">🔍 逐步算理演繹 (0/3)</button>
        <div class="options-grid" id="optionsGrid"></div>
        <button class="check-btn" id="checkBtn" onclick="checkAnswer()">確認答案</button>
        <div class="feedback" id="feedbackBox"></div>
    </div>
</div>

<script>
    /* ===== 10 題實體段考真題資料庫（SSOT） ===== */
    const QUESTIONS = [
        {
            q: 1,
            stem: "下面哪一項物品的厚度或長度，用「毫米」記錄比較適合？",
            options: [
                "操場跑道的長度",
                "數學課本的厚度（約 8 毫米）",
                "國旗竿的高度",
                "欖仁樹的高度"
            ],
            answer_index: 1,
            visual_mode: "sensible_thickness",
            final_reveal: "課本厚度約 8 毫米 (mm)",
            total_steps: 3,
            explanations: [
                "認識毫米：毫米是非常細微微小的長度單位",
                "排查公尺級：跑道(200m)、旗竿(10m)、大樹(8m)都太大",
                "生活量感：課本厚度約 8mm、硬幣厚度約 2mm 最合適 ✓"
            ],
            feedback: "答對了！毫米是用來測量薄物或微小長度的單位，課本厚度約 8 毫米！"
        },
        {
            q: 2,
            stem: "關於「公分」和「毫米」的關係，下列敘述何者正確？",
            options: [
                "1 公分跟 1 毫米是一樣的長度，只是說法不同",
                "1 公分等於 10 毫米，70 毫米也就是 7 公分",
                "1 毫米等於 10 公分",
                "1 公分等於 100 毫米"
            ],
            answer_index: 1,
            visual_mode: "ruler_scale_concept",
            final_reveal: "1 公分 ＝ 10 毫米 (1cm = 10mm)",
            total_steps: 3,
            explanations: [
                "觀察直尺：0 到 1 公分之間有 10 個等距小格",
                "單位定義：每一小格就是 1 毫米（1 mm）",
                "進率結論：1 公分 ＝ 10 毫米；70 毫米 ＝ 7 公分 ✓"
            ],
            feedback: "答對了！直尺上 1 大格分成 10 小格，1 公分等於 10 毫米！"
        },
        {
            q: 3,
            stem: "小美用直尺量一隻小甲蟲，發現牠的長度是 86 個 1 毫米。86 毫米也就是幾公分幾毫米？",
            options: [
                "8 公分 6 毫米",
                "86 公分 0 毫米",
                "80 公分 6 毫米",
                "0 公分 86 毫米"
            ],
            answer_index: 0,
            visual_mode: "converter_single_to_multi",
            final_reveal: "86 毫米 ＝ 8 公分 6 毫米",
            total_steps: 3,
            explanations: [
                "數值分拆：86 毫米 ＝ 80 毫米 ＋ 6 毫米",
                "整十換算：80 毫米 ＝ 8 個 10 毫米 ＝ 8 公分",
                "組合答案：8 公分 ＋ 6 毫米 ＝ 8 公分 6 毫米 ✓"
            ],
            feedback: "答對了！80 毫米等於 8 公分，加上 6 毫米就是 8 公分 6 毫米！"
        },
        {
            q: 4,
            stem: "一枝新蠟筆的長度是 6 公分 3 毫米，如果全部換算成「毫米」，是多少毫米？",
            options: [
                "603 毫米",
                "63 毫米",
                "9 毫米",
                "36 毫米"
            ],
            answer_index: 1,
            visual_mode: "converter_multi_to_single",
            final_reveal: "6 公分 3 毫米 ＝ 63 毫米",
            total_steps: 3,
            explanations: [
                "換算公分：1 公分 ＝ 10 毫米，6 公分 ＝ 60 毫米",
                "加上零星：60 毫米 ＋ 3 毫米 ＝ 63 毫米",
                "小心陷阱：不是 603 毫米（1 公分不是 100 毫米）✓"
            ],
            feedback: "答對了！6 公分等於 60 毫米，再加 3 毫米就是 63 毫米！"
        },
        {
            q: 5,
            stem: "把印章的一端對齊直尺的「0」刻度，另一端剛好指在「4 公分又往右數 7 個小格（毫米刻度）」。請問這個印章的長度是多少？",
            options: [
                "4 公分 7 毫米（也就是 47 毫米）",
                "4 公分 2 毫米",
                "7 公分 4 毫米",
                "40 公分 7 毫米"
            ],
            answer_index: 0,
            visual_mode: "ruler_reading_zero",
            final_reveal: "4 公分 7 毫米 ＝ 47 毫米",
            total_steps: 3,
            explanations: [
                "確認起點：印章左端對齊 0 刻度，無須扣除起點",
                "觀察大刻度：右端超過整數 4 公分",
                "細數小格：右數 7 小格即 7 毫米，合為 4cm 7mm (47mm) ✓"
            ],
            feedback: "答對了！起點對齊 0，終點在 4 公分過 7 小格，即 4 公分 7 毫米！"
        },
        {
            q: 6,
            stem: "小明拿一把起點磨損的斷尺測量橡皮擦，他把橡皮擦的左端對齊刻度「3 公分」，右端剛好落在刻度「8 公分 4 毫米」。請問這個橡皮擦的實際長度是多少？",
            options: [
                "8 公分 4 毫米",
                "11 公分 4 毫米",
                "5 公分 4 毫米",
                "3 公分 4 毫米"
            ],
            answer_index: 2,
            visual_mode: "broken_ruler_trap",
            final_reveal: "8cm 4mm － 3cm ＝ 5cm 4mm",
            total_steps: 3,
            explanations: [
                "警惕陷阱：起點在 3 公分而非 0 刻度！",
                "計算公式：實際長度 ＝ 終點刻度 － 起點刻度",
                "減法破招：8 公分 4 毫米 － 3 公分 ＝ 5 公分 4 毫米 ✓"
            ],
            feedback: "答對了！斷尺不能直接看終點，起點是 3 公分必須減掉，得到 5 公分 4 毫米！"
        },
        {
            q: 7,
            stem: "在下列長度比大小的題目中，何者填入的符號是正確的？",
            options: [
                "69 毫米 ＞ 9 公分 6 毫米",
                "7 公分 2 毫米 ＝ 702 毫米",
                "6 公分 7 毫米 ＞ 60 毫米",
                "14 公分 ＜ 104 毫米"
            ],
            answer_index: 2,
            visual_mode: "compare_length",
            final_reveal: "6 公分 7 毫米 (67mm) ＞ 60 毫米",
            total_steps: 3,
            explanations: [
                "統一度量衡：比大小前先把公分全部換成毫米",
                "驗算選項：6 公分 7 毫米 ＝ 67 毫米",
                "大小判定：67 毫米 ＞ 60 毫米，正確！✓"
            ],
            feedback: "答對了！6 公分 7 毫米等於 67 毫米，確實大於 60 毫米！"
        },
        {
            q: 8,
            stem: "算算看：「69 毫米 ＋ 8 公分 5 毫米」等於幾公分幾毫米？",
            options: [
                "14 公分 4 毫米",
                "15 公分 4 毫米",
                "14 公分 14 毫米",
                "154 公分 0 毫米"
            ],
            answer_index: 1,
            visual_mode: "addition_carry",
            final_reveal: "15 公分 4 毫米",
            total_steps: 3,
            explanations: [
                "複名數對齊：69 毫米 ＝ 6 公分 9 毫米",
                "毫米相加：9 ＋ 5 ＝ 14 毫米（滿 10 毫米進 1 公分，留 4 毫米）",
                "公分相加：6 ＋ 8 ＋ 進位 1 ＝ 15 公分，共 15 公分 4 毫米 ✓"
            ],
            feedback: "答對了！毫米位相加滿 10 毫米要向公分進 1，答案是 15 公分 4 毫米！"
        },
        {
            q: 9,
            stem: "算算看直式計算：「9 公分 3 毫米 － 1 公分 5 毫米」等於多少？",
            options: [
                "8 公分 2 毫米",
                "7 公分 8 毫米",
                "8 公分 8 毫米",
                "7 公分 2 毫米"
            ],
            answer_index: 1,
            visual_mode: "subtraction_borrow",
            final_reveal: "7 公分 8 毫米",
            total_steps: 3,
            explanations: [
                "毫米不夠減：3 毫米減 5 毫米不夠",
                "退位借公分：從 9 公分借 1 公分（換成 10 毫米），9 變 8",
                "計算毫米與公分：10 ＋ 3 － 5 ＝ 8 毫米，8 － 1 ＝ 7 公分 ✓"
            ],
            feedback: "答對了！借 1 公分當 10 毫米，13－5＝8 毫米，8－1＝7 公分，得 7 公分 8 毫米！"
        },
        {
            q: 10,
            stem: "黃色蠟筆長 32 毫米，紫色蠟筆比黃色蠟筆短 13 毫米。請問紫色蠟筆長多少毫米？也就是幾公分幾毫米？",
            options: [
                "19 毫米（也就是 1 公分 9 毫米）",
                "45 毫米（也就是 4 公分 5 毫米）",
                "21 毫米（也就是 2 公分 1 毫米）",
                "18 毫米（也就是 1 公分 8 毫米）"
            ],
            answer_index: 0,
            visual_mode: "crayon_difference",
            final_reveal: "19 毫米 ＝ 1 公分 9 毫米",
            total_steps: 3,
            explanations: [
                "列出算式：「比它短」用減法：32 － 13 ＝ 19 毫米",
                "單位換算：19 毫米 ＝ 10 毫米 ＋ 9 毫米 ＝ 1 公分 9 毫米",
                "檢驗確認：19 ＋ 13 ＝ 32 毫米，無誤 ✓"
            ],
            feedback: "答對了！32－13＝19 毫米，19 毫米換算就是 1 公分 9 毫米！"
        }
    ];

    /* ===== 全局狀態管理 ===== */
    let currentQ = 1;
    let currentStep = 0;
    let selectedOption = null;

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function init() {
        if (window.self !== window.top) {
            document.body.classList.add('in-iframe');
        }
        const qParam = parseInt(getQueryParam('q'), 10);
        if (qParam >= 1 && qParam <= 10) currentQ = qParam;
        renderQuestionUI();
    }

    function renderQuestionUI() {
        const qData = QUESTIONS[currentQ - 1];
        currentStep = 0;
        selectedOption = null;

        document.getElementById('questionBox').textContent = `Q${qData.q}. ${qData.stem}`;
        document.getElementById('stepBtn').textContent = `🔍 逐步算理演繹 (0/${qData.total_steps})`;
        document.getElementById('capText').textContent = "點擊「逐步算理」查看長度演繹";
        
        const fb = document.getElementById('feedbackBox');
        fb.className = "feedback";
        fb.textContent = "";

        // 渲染 4 個選項按鈕
        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = "";
        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.textContent = opt;
            btn.onclick = () => selectOption(idx);
            grid.appendChild(btn);
        });

        drawStage(0);
        notifyParentHeight();
    }

    function selectOption(idx) {
        selectedOption = idx;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((b, i) => {
            if (i === idx) b.classList.add('selected');
            else b.classList.remove('selected');
        });
    }

    function checkAnswer() {
        const qData = QUESTIONS[currentQ - 1];
        const fb = document.getElementById('feedbackBox');
        if (selectedOption === null) {
            fb.className = "feedback show wrong";
            fb.textContent = "請先選擇一個選項再按確認！";
            return;
        }

        if (selectedOption === qData.answer_index) {
            fb.className = "feedback show correct";
            fb.textContent = qData.feedback;
            currentStep = qData.total_steps;
            document.getElementById('stepBtn').textContent = `🔍 逐步算理演繹 (${currentStep}/${qData.total_steps})`;
            drawStage(currentStep);
        } else {
            fb.className = "feedback show wrong";
            fb.textContent = "再仔細想想看喔！可以點擊「逐步算理演繹」看看提示！";
        }
        notifyParentHeight();
    }

    function nextStep() {
        const qData = QUESTIONS[currentQ - 1];
        currentStep = (currentStep + 1) % (qData.total_steps + 1);
        document.getElementById('stepBtn').textContent = `🔍 逐步算理演繹 (${currentStep}/${qData.total_steps})`;
        
        if (currentStep === 0) {
            document.getElementById('capText').textContent = "點擊「逐步算理」查看長度演繹";
        } else {
            document.getElementById('capText').textContent = qData.explanations[currentStep - 1];
        }
        drawStage(currentStep);
        notifyParentHeight();
    }

    function notifyParentHeight() {
        setTimeout(() => {
            const app = document.getElementById('app');
            const h = app ? Math.min(app.offsetHeight + 10, 420) : 380;
            window.parent.postMessage({ type: 'resize', height: h }, '*');
        }, 50);
    }

    /* ===== 純向量 SVG 動態繪製 (10 種模式) ===== */
    function drawStage(step) {
        const layer = document.getElementById('drawLayer');
        layer.innerHTML = "";
        const qData = QUESTIONS[currentQ - 1];

        switch (qData.visual_mode) {
            case "sensible_thickness":
                drawQ1(layer, step);
                break;
            case "ruler_scale_concept":
                drawQ2(layer, step);
                break;
            case "converter_single_to_multi":
                drawQ3(layer, step);
                break;
            case "converter_multi_to_single":
                drawQ4(layer, step);
                break;
            case "ruler_reading_zero":
                drawQ5(layer, step);
                break;
            case "broken_ruler_trap":
                drawQ6(layer, step);
                break;
            case "compare_length":
                drawQ7(layer, step);
                break;
            case "addition_carry":
                drawQ8(layer, step);
                break;
            case "subtraction_borrow":
                drawQ9(layer, step);
                break;
            case "crayon_difference":
                drawQ10(layer, step);
                break;
        }
    }

    // Q1: 生活量感 (課本 vs 操場旗竿)
    function drawQ1(g, step) {
        g.innerHTML = `
            <rect x="10" y="10" width="230" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
            <!-- 遠景淡化跑道與大樹 -->
            <path d="M 20 120 Q 60 95 100 120" fill="none" stroke="#94a3b8" stroke-width="5" opacity="0.3"/>
            <text x="30" y="110" font-size="9" fill="#94a3b8">操場 200m</text>
            <rect x="80" y="50" width="6" height="50" fill="#a16207" opacity="0.4"/>
            <circle cx="83" cy="45" r="16" fill="#15803d" opacity="0.4"/>
            <text x="65" y="25" font-size="9" fill="#94a3b8">大樹 8m</text>

            <!-- 放大鏡微觀課本 -->
            <circle cx="170" cy="75" r="50" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
