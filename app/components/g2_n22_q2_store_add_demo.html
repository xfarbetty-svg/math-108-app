<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-2-Q02 文具店買文具（二位數進位加法）</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint: #7bc9b2;
  --mint-deep: #318a70;
  --lemon: #ffd166;
  --coral: #ff8a65;
  --sky: #4ea8de;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 14px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

/* 文具店貨架卡牌 + 直式展示區 */
.shop-stage {
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 8px 6px;
  gap: 10px;
}
.items-box {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.item-tag {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fdfbf7;
  border: 1.5px solid var(--line);
  padding: 4px 8px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
}
.item-icon { font-size: 16px; }
.price-pill {
  background: #fff3d6;
  color: #b45309;
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 900;
}

/* 直式算式小黑板 */
.vertical-board {
  background: #2b3a4a;
  color: #fff;
  border-radius: 10px;
  padding: 8px 14px;
  font-family: "Courier New", monospace;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.3;
  min-width: 110px;
  text-align: right;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.carry-row { font-size: 11px; color: var(--lemon); height: 14px; }
.v-line { border-bottom: 2px solid #fff; margin: 3px 0; }
.v-ans { color: var(--lemon); }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>112-1 內湖 期中 四、1</small>小明買了一支手電筒 42 元和一支自動鉛筆 29 元，一共要付多少元？</p>
  </div>
  <div class="card shop-stage">
    <div class="items-box">
      <div class="item-tag">
        <span class="item-icon">🔦</span>
        <span>手電筒</span>
        <span class="price-pill">42 元</span>
      </div>
      <div class="item-tag">
        <span class="item-icon">✏️</span>
        <span>自動鉛筆</span>
        <span class="price-pill">29 元</span>
      </div>
    </div>
    <div class="vertical-board">
      <div class="carry-row" id="v-carry">&nbsp;</div>
      <div>  4 2</div>
      <div>＋2 9</div>
      <div class="v-line"></div>
      <div class="v-ans" id="v-res">? ?</div>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['71 元', '61 元', '70 元', '69 元'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');

  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      if (c === '71 元') {
        document.getElementById('v-carry').textContent = '① ';
        document.getElementById('v-res').textContent = '7 1';
      } else if (c === '61 元') {
        document.getElementById('v-carry').textContent = '  ';
        document.getElementById('v-res').textContent = '6 1';
      } else {
        document.getElementById('v-carry').textContent = '  ';
        document.getElementById('v-res').textContent = c.replace(' 元', '');
      }
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！個位 2＋9＝11（寫 1 進 1），十位 1＋4＋2＝7，一共是 71 元。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：個位 2＋9 滿十要進位到十位喔！十位記得把進位的 1 加進去。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-2-Q02', answer: ANSWER };
})();
</script>
</body>
</html>
