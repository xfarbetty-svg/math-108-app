<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-3-Q05 287 公車上下車（兩步驟）</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --sky:#4ea8de; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:8px 10px 14px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:15px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.bar-svg { display:block; width:100%; height:auto; }
.t-in { font-size:13.5px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-know { font-size:12.5px; font-weight:800; fill:#175e4c; text-anchor:middle; }
.t-unk { font-size:12px; font-weight:800; fill:var(--red); text-anchor:middle; }
.t-flow { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-flow .q { fill:var(--red); font-size:13px; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:#fff; border-radius:10px; padding:8px 6px; font-size:13.5px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:8px 30px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-duo { display:flex; justify-content:center; gap:26px; }
.v-grid { display:grid; grid-template-columns:26px 34px 34px; align-items:end; row-gap:2px; font-size:20px; font-weight:800; text-align:center; }
.v-grid .lab { grid-column:1 / 4; font-size:11px; font-weight:800; color:var(--ink-soft); text-align:center; }
.v-grid .op { color:var(--ink-soft); }
.v-grid .vline { grid-column:1 / 4; border-top:2px solid var(--ink); margin-top:2px; }
.v-grid .res { color:var(--mint-deep); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
.vq.show .v-step1 { animation:fade .4s .15s both; }
.vq.show .v-step2 { animation:fade .4s .75s both; }
.vq.show .v-note { animation:fade .4s 1.3s both; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>113-1 內湖 期末 二、(2)</small>287 公車上原有 45 個人，到站後，有 23 個人下車，又有 16 個人上車，請問 287 公車上現在有幾個人？</p>
  </div>
  <div class="card">
    <!-- 車廂人流圖：上層原有 45 人；下層左下車 23（綠）＋右車上剩下 ？（虛線）。比例嚴格 23:22＝173.8:166.2；底列兩步驟流程 -->
    <svg class="bar-svg" viewBox="0 0 360 122" role="img" aria-label="公車人流圖：原有 45 人，下車 23 人，又有 16 人上車，現在幾人">
      <rect x="10" y="10" width="340" height="30" rx="6" fill="var(--lemon)" stroke="var(--ink)" stroke-width="1.6"/>
      <text x="180" y="30" class="t-in">🚌 原有 45 人</text>
      <rect x="10" y="58" width="173.8" height="30" rx="6" fill="var(--mint)" stroke="var(--mint-deep)" stroke-width="1.6"/>
      <text x="96.9" y="78" class="t-know">下車 23 人</text>
      <rect x="183.8" y="58" width="166.2" height="30" rx="6" fill="var(--paper)" stroke="var(--red)" stroke-width="1.6" stroke-dasharray="5 4"/>
      <text x="266.9" y="78" class="t-unk">車上剩下 ？ 人</text>
      <rect x="10" y="96" width="340" height="22" rx="11" fill="var(--sky)" opacity=".18"/>
      <text x="180" y="112" class="t-flow">又有 16 人上車 → 車上現在 <tspan class="q">？</tspan> 人</text>
    </svg>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-duo">
      <div class="v-grid v-step1">
        <span class="lab">先算：下車後</span>
        <span></span><span>4</span><span>5</span>
        <span class="op">－</span><span>2</span><span>3</span>
        <span class="vline"></span>
        <span></span><span class="res">2</span><span class="res">2</span>
      </div>
      <div class="v-grid v-step2">
        <span class="lab">再算：+16 上車</span>
        <span></span><span>2</span><span>2</span>
        <span class="op">＋</span><span>1</span><span>6</span>
        <span class="vline"></span>
        <span></span><span class="res">3</span><span class="res">8</span>
      </div>
    </div>
    <p class="v-notes">先算 <b>45 − 23 = 22</b>（下車要減掉），再算 <b>22 + 16 = 38</b>（上車要加回來）</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ['38 個人', '28 個人', '42 個人', '84 個人'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！45 − 23 = 22，22 + 16 = 38，車上現在有 38 個人。';
      vq.classList.add('show');
      say('答對！45 減 23 等於 22，22 加 16 等於 38，車上現在有 38 個人。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：先用 45 − 23 算出下車後剩下幾個人，再把上車的 16 人加回去喔！';
    say('再想想看：先用 45 減 23 算出下車後剩下幾個人，再把上車的 16 人加回去喔！');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-3-Q05', answer: 0 };
})();
</script>
</body>
</html>
