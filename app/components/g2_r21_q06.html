<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --primary-color: #6cace4;
            --secondary-color: #ffb7b2;
            --accent-color: #b2e2f2;
            --text-color: #4a4a4a;
            --bg-color: #fffaf0;
            --success-color: #81c784;
            --fail-color: #e57373;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .wrap {
            width: 100%;
            max-width: 480px;
            height: 420px;
            background-color: var(--bg-color);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 15px;
            border: 4px solid #e0e0e0;
        }

        .question {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            max-height: 120px;
            margin-bottom: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .opt-btn {
            background-color: var(--bg-card);
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            outline: none;
        }

        .opt-btn:hover {
            background-color: var(--accent-color);
            border-color: var(--primary-color);
        }

        .opt-btn.selected {
            background-color: var(--primary-color);
            color: white;
            border-color: #4a90e2;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
        }

        .check-btn {
            background-color: #ffcc80;
            border: none;
            border-radius: 25px;
            padding: 10px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #5d4037;
            cursor: pointer;
            box-shadow: 0 4px 0 #ef6c00;
            transition: transform 0.1s;
        }

        .check-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #ef6c00;
        }

        #feedback {
            height: 24px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
        }

        #feedback.success { color: var(--success-color); }
        #feedback.fail { color: var(--fail-color); }

        /* SVG Style */
        .card-bg { fill: #ffffff; stroke: #d1d1d1; stroke-width: 2; }
        .h-box { fill: #ffb7b2; } /* 百位 */
        .t-box { fill: #b2e2f2; } /* 十位 */
        .o-box { fill: #b2f2bb; } /* 個位 */
        .label-text { font-size: 14px; fill: #666; font-weight: bold; }
        .num-text { font-size: 24px; fill: #333; font-weight: bold; }
    </style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>

<div class="wrap">
    <div class="question">比較 345、354、435 這三個數的大小，哪一個數最大？</div>
    
    <div class="canvas-area">
        <svg viewBox="0 0 400 120" width="100%" height="120">
            <!-- 345 -->
            <g transform="translate(10, 10)">
                <rect x="0" y="0" width="110" height="90" rx="10" class="card-bg" />
                <rect x="10" y="35" width="25" height="40" rx="5" class="h-box" />
                <rect x="42" y="35" width="25" height="40" rx="5" class="t-box" />
                <rect x="74" y="35" width="25" height="40" rx="5" class="o-box" />
                <text x="15" y="65" class="num-text">3</text>
                <text x="47" y="65" class="num-text">4</text>
                <text x="79" y="65" class="num-text">5</text>
                <text x="55" y="25" text-anchor="middle" class="label-text">345</text>
            </g>
            <!-- 354 -->
            <g transform="translate(145, 10)">
                <rect x="0" y="0" width="110" height="90" rx="10" class="card-bg" />
                <rect x="10" y="35" width="25" height="40" rx="5" class="h-box" />
                <rect x="42" y="35" width="25" height="40" rx="5" class="t-box" />
                <rect x="74" y="35" width="25" height="40" rx="5" class="o-box" />
                <text x="15" y="65" class="num-text">3</text>
                <text x="47" y="65" class="num-text">5</text>
                <text x="79" y="65" class="num-text">4</text>
                <text x="55" y="25" text-anchor="middle" class="label-text">354</text>
            </g>
            <!-- 435 -->
            <g transform="translate(280, 10)">
                <rect x="0" y="0" width="110" height="90" rx="10" class="card-bg" />
                <rect x="10" y="35" width="25" height="40" rx="5" class="h-box" />
                <rect x="42" y="35" width="25" height="40" rx="5" class="t-box" />
                <rect x="74" y="35" width="25" height="40" rx="5" class="o-box" />
                <text x="15" y="65" class="num-text">4</text>
                <text x="47" y="65" class="num-text">3</text>
                <text x="79" y="65" class="num-text">5</text>
                <text x="55" y="25" text-anchor="middle" class="label-text">435</text>
            </g>
        </svg>
    </div>

    <div class="options-grid">
        <button class="opt-btn" onclick="selectOption(0)">1. 345</button>
        <button class="opt-btn" onclick="selectOption(1)">2. 354</button>
        <button class="opt-btn" onclick="selectOption(2)">3. 435</button>
        <button class="opt-btn" onclick="selectOption(3)">4. 一樣大</button>
    </div>

    <div class="controls">
        <button class="check-btn" onclick="window.check()">檢查答案</button>
        <div id="feedback"></div>
    </div>
</div>

<script>
    let selectedIndex = -1;
    const correctIndex = 2; // 435

    function selectOption(index) {
        selectedIndex = index;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((btn, i) => {
            if (i === index) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });
        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = '';
    }

    window.check = function() {
        const feedback = document.getElementById('feedback');
        if (selectedIndex === -1) {
            feedback.textContent = '請先選擇一個答案喔！';
            feedback.className = 'fail';
            return;
        }

        if (selectedIndex === correctIndex) {
            feedback.textContent = '太棒了！答對了！';
            feedback.className = 'success';
        } else {
            feedback.textContent = '再試試看，比較百位數的大小喔！';
            feedback.className = 'fail';
        }
    };
</script>

<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
