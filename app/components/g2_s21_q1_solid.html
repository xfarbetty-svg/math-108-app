<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-S-2-1-Q01 立體形體與生活物品</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --paper:#fffdf8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.stage { position:relative; width:100%; height:140px; border-radius:12px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); }
.stage-bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:brightness(.92) contrast(1.05); }
.stage-overlay { position:absolute; inset:0; background:linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,249,240,.3) 100%); backdrop-filter:blur(1.5px); }
.scene-svg { position:relative; z-index:2; display:block; width:100%; height:100%; }
.item { cursor:pointer; }
.item .hl { opacity:0; transition:opacity .25s; }
.item.sel .hl { opacity:1; }
.item .piece { transition:transform .2s; transform-box:fill-box; transform-origin:center bottom; }
.item.sel .piece { transform:translateY(-3px); }
.t-cap { font-size:11px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-num { font-size:9.5px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.status { text-align:center; font-size:11.5px; font-weight:800; color:var(--ink-soft); min-height:16px; margin-top:3px; }
.status b { color:var(--ink); }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:#fff; border-radius:10px; padding:5px 4px; font-size:12.5px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border:none; border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); cursor:pointer; }
.result-banner { display:none; border-radius:10px; padding:6px 10px; font-size:12px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>立體形體與生活物品</small>生活中哪一種物品可能是正方體？點點看玩具箱裡的東西，觀察它們的形狀！</p>
  </div>
  <div class="card">
    <div class="stage">
      <img src="../assets/demo/bg_toy_room.webp" class="stage-bg" alt="玩具房背景">
      <div class="stage-overlay"></div>
      <svg class="scene-svg" viewBox="0 0 360 140" role="img" aria-label="魔術方塊、垃圾桶、漱口杯與籃球">
        <!-- 地面陰影 -->
        <ellipse cx="55" cy="112" rx="28" ry="5" fill="rgba(61,58,52,.12)"/>
        <ellipse cx="145" cy="114" rx="26" ry="5" fill="rgba(61,58,52,.12)"/>
        <ellipse cx="235" cy="115" rx="20" ry="4.5" fill="rgba(61,58,52,.12)"/>
        <ellipse cx="315" cy="114" rx="24" ry="5" fill="rgba(61,58,52,.12)"/>

        <!-- ① 魔術方塊：Isometric 純 SVG 正方體（s=24）四階光影 -->
        <g class="item" id="it-cube" data-key="cube">
          <ellipse class="hl" cx="55" cy="112" rx="28" ry="6" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <polygon points="55,56 75.8,68 55,80 34.2,68" fill="#fff2b2" stroke="#fffdf8" stroke-width="1"/>
            <polygon points="34.2,68 55,80 55,104 34.2,92" fill="#ffd166" stroke="#fffdf8" stroke-width="1"/>
            <polygon points="55,80 75.8,68 75.8,92 55,104" fill="#e6b840" stroke="#fffdf8" stroke-width="1"/>
            <polygon points="55,56 75.8,68 55,80 34.2,68" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
            <polyline points="34.2,68 55,80 75.8,68" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
            <line x1="55" y1="56" x2="55" y2="104" stroke="var(--ink)" stroke-width="1.2"/>
            <!-- 魔術方塊貼面格線 -->
            <line x1="65.4" y1="62" x2="65.4" y2="86" stroke="rgba(61,58,52,.18)" stroke-width="1"/>
            <line x1="44.6" y1="62" x2="44.6" y2="86" stroke="rgba(61,58,52,.18)" stroke-width="1"/>
            <line x1="65.4" y1="62" x2="65.4" y2="86" stroke="rgba(61,58,52,.18)" stroke-width="1"/>
            <line x1="55" y1="68" x2="75.8" y2="80" stroke="rgba(61,58,52,.15)" stroke-width="1"/>
            <line x1="55" y1="92" x2="75.8" y2="80" stroke="rgba(61,58,52,.15)" stroke-width="1"/>
            <line x1="55" y1="68" x2="34.2" y2="80" stroke="rgba(61,58,52,.15)" stroke-width="1"/>
            <line x1="55" y1="92" x2="34.2" y2="80" stroke="rgba(61,58,52,.15)" stroke-width="1"/>
          </g>
          <text x="55" y="133" class="t-num">魔術方塊</text>
        </g>

        <!-- ② 教室垃圾桶 -->
        <g class="item" id="it-bin" data-key="bin">
          <ellipse class="hl" cx="145" cy="114" rx="26" ry="6" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <polygon points="123,74 167,74 162,108 128,108" fill="#7bc9b2" stroke="#2a7e65" stroke-width="1.5"/>
            <ellipse cx="145" cy="108" rx="17" ry="4.5" fill="#7bc9b2" stroke="#2a7e65" stroke-width="1.5"/>
            <ellipse cx="145" cy="74" rx="22" ry="6.5" fill="#a8dfd0" stroke="#2a7e65" stroke-width="1.5"/>
            <ellipse cx="145" cy="74" rx="15" ry="4" fill="#5fb39e"/>
            <line x1="138" y1="80" x2="139" y2="104" stroke="rgba(42,126,101,.35)" stroke-width="1"/>
            <line x1="152" y1="80" x2="151" y2="104" stroke="rgba(42,126,101,.35)" stroke-width="1"/>
          </g>
          <text x="145" y="133" class="t-num">教室垃圾桶</text>
        </g>

        <!-- ③ 漱口水的杯子 -->
        <g class="item" id="it-cup" data-key="cup">
          <ellipse class="hl" cx="235" cy="115" rx="20" ry="5" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <path d="M218,80 L218,108 Q235,116 252,108 L252,80 Z" fill="#f7a8b8" stroke="#d16a7f" stroke-width="1.5"/>
            <ellipse cx="235" cy="80" rx="17" ry="5.5" fill="#fbc9d4" stroke="#d16a7f" stroke-width="1.5"/>
            <ellipse cx="235" cy="80" rx="11" ry="3.2" fill="#e78ea1"/>
          </g>
          <text x="235" y="133" class="t-num">漱口水的杯子</text>
        </g>

        <!-- ④ 籃球 -->
        <g class="item" id="it-ball" data-key="ball">
          <ellipse class="hl" cx="315" cy="114" rx="24" ry="6" fill="#2a7e65" opacity="0"/>
          <g class="piece">
            <circle cx="315" cy="90" r="22" fill="#f59e4c" stroke="#b45309" stroke-width="1.5"/>
            <path d="M315,68 C303,80 303,100 315,112" fill="none" stroke="#b45309" stroke-width="1.6"/>
            <path d="M293,90 Q315,101 337,90" fill="none" stroke="#b45309" stroke-width="1.6"/>
            <path d="M302,74 Q308,71 313,70" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
          </g>
          <text x="315" y="133" class="t-num">籃球</text>
        </g>
      </svg>
    </div>
    <p class="status" id="status">點一個物品，仔細看看它的形狀！</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" type="button" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ["魔術方塊", "教室垃圾桶", "漱口水的杯子", "籃球"];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var status = document.getElementById('status');
  var TEXTS = {
    cube: '魔術方塊：方方正正，每一個面都是<b>一樣大的正方形</b>！',
    bin: '教室垃圾桶：上寬下窄，各個面不是每個都一樣大。',
    cup: '漱口水的杯子：圓柱體，上面是圓圓的開口。',
    ball: '籃球：球體，整顆都是彎彎的面。'
  };
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  // 魔術方塊「6 個面都一樣大」切換觀察：輪流點亮 3 個看得到的面 → 全部亮起
  var cubeG = document.getElementById('it-cube');
  var faces = cubeG.querySelectorAll('.piece > polygon');
  var tourTimer = null, tourStep = -1;
  function stopTour() {
    if (tourTimer) { clearInterval(tourTimer); tourTimer = null; }
    tourStep = -1;
    Array.prototype.forEach.call(faces, function (f) { f.style.filter = ''; });
  }
  cubeG.addEventListener('click', function () {
    var wasSel = cubeG.classList.contains('sel');
    select('cube');
    if (wasSel) { stopTour(); status.innerHTML = '魔術方塊收起來了，再點一次可以再觀察！'; return; }
    stopTour();
    tourStep = 0;
    tourTimer = setInterval(function () {
      Array.prototype.forEach.call(faces, function (f) { f.style.filter = ''; });
      if (tourStep >= faces.length) {
        stopTour();
        Array.prototype.forEach.call(faces, function (f) { f.style.filter = 'brightness(1.12)'; });
        status.innerHTML = '看得見的 3 個面都一樣大，轉過去的另外 3 個面也一樣——<b>6 個面都是一樣大的正方形！</b>';
        say('六個面都是一樣大的正方形！');
        return;
      }
      faces[tourStep].style.filter = 'brightness(1.18) saturate(1.2)';
      status.innerHTML = '觀察第 <b>' + (tourStep + 1) + '</b> 個面：是一樣大的正方形嗎？';
      tourStep += 1;
    }, 550);
  });

  function select(key) {
    ['it-cube', 'it-bin', 'it-cup', 'it-ball'].forEach(function (id) {
      document.getElementById(id).classList.toggle('sel', id === 'it-' + key);
    });
    status.innerHTML = TEXTS[key];
    say(TEXTS[key].replace(/<[^>]+>/g, ''));
  }
  ['bin', 'cup', 'ball'].forEach(function (key) {
    document.getElementById('it-' + key).addEventListener('click', function () { stopTour(); select(key); });
  });

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！魔術方塊每一個面都是一樣大的正方形，它可能是正方體。';
      say('答對！魔術方塊每一個面都是一樣大的正方形。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：只有「6 個面都是一樣大的正方形」的物品才可能是正方體喔！';
    say('再想想看：六個面都是一樣大的正方形，才可能是正方體。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-S-2-1-Q01', answer: ANSWER };
})();
</script>
</body>
</html>
