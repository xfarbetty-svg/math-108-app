<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-14-Q10 相對日期與星期推算</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-num { font-size:11px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.t-note { font-size:10.5px; font-weight:800; fill:var(--mint-deep); text-anchor:start; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:#fff; border-radius:10px; padding:5px 4px; font-size:13px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.status { text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-soft); min-height:18px; }
.status b { color:var(--ink); }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.video-guide-banner { margin-bottom:8px; text-align:center; }
.video-link { display:inline-flex; align-items:center; gap:6px; background:#ff0000; color:#fff; text-decoration:none; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:800; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:6px; font-size:18px; font-weight:800; }
.v-eq .res { color:var(--red); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
.vq.show .v-eq { animation:pop .3s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
#tearFx { opacity:0; transition:opacity .3s; }
#calCard { transition:transform .35s, opacity .35s; }
#calCard.tearing { transform:rotate(9deg) translateY(14px); opacity:0; }
#calDate { font-size:30px; font-weight:800; fill:var(--ink); text-anchor:middle; }
#calWeek { font-size:16px; font-weight:800; fill:var(--mint-deep); text-anchor:middle; }
#calTag { font-size:13px; font-weight:800; fill:#fff; text-anchor:middle; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>相對日期與星期推算</small>今天是 6 月 24 日星期二，請問「後天」是幾月幾日星期幾？</p>
  </div>
  <div class="card">
    <!-- 日系繪本撕曆：今天 6/24 星期二，撕兩頁翻到後天 -->
    <svg class="scene-svg" id="scene" viewBox="0 0 360 224" role="img" aria-label="撕曆，今天 6 月 24 日星期二">
      <text x="120" y="18" class="t-caption">手繪撕曆</text>
      <!-- 撕曆本體 -->
      <rect x="52" y="26" width="120" height="128" rx="12" fill="#fffdf8" stroke="var(--ink)" stroke-width="2.4"/>
      <rect x="52" y="26" width="120" height="30" rx="12" fill="var(--grape)"/>
      <text x="112" y="47" class="t-num" fill="#fff" font-size="12">6 月</text>
      <g id="calCard">
        <text id="calDate" x="112" y="96">6/24</text>
        <text id="calWeek" x="112" y="126">星期二</text>
        <rect id="calTagBg" x="82" y="136" width="60" height="0" fill="var(--grape)"/>
        <text id="calTag" x="112" y="148" fill="var(--ink)" font-size="12">今天</text>
      </g>
      <!-- 撕下的紙片特效 -->
      <g id="tearFx">
        <rect x="96" y="120" width="34" height="20" rx="3" fill="#fffdf8" stroke="var(--line)" stroke-width="1.4" transform="rotate(-14 113 130)"/>
        <rect x="120" y="112" width="30" height="18" rx="3" fill="var(--lemon)" stroke="var(--line)" stroke-width="1.4" transform="rotate(12 135 121)"/>
      </g>
      <!-- 星期軌道 -->
      <g id="weekTrack">
        <text x="205" y="60" class="t-note">一星期有 7 天：</text>
        <text x="262" y="80" class="t-num">一・二・三・四・五・六・日</text>
        <text x="205" y="104" class="t-note">今天＋1＝明天</text>
        <text x="205" y="124" class="t-note">今天＋2＝後天</text>
        <text x="262" y="146" class="t-num" fill="var(--red)">撕 2 頁就是往後 2 天</text>
      </g>
      <text x="180" y="196" class="t-num" id="footNote">撕曆：一天撕一頁，星期也往前一天</text>
      <text x="180" y="214" class="t-num">點撕曆看看後天是哪一天！</text>
    </svg>
    <div class="tools">
      <button type="button" class="tool-btn" id="tool">翻到後天 📅</button>
      <button type="button" class="tool-btn" id="reset">回到今天 ↺</button>
    </div>
    <p class="status" id="status">撕 1 頁是明天，撕 2 頁是後天——星期幾也跟著往前走！</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="video-guide-banner">
      <a class="video-link" href="https://youtu.be/8eyE6HICK7A" target="_blank" rel="noopener noreferrer">📺 觀看教學微影片《大月小月彩虹溜滑梯與二月彩蛋》</a>
    </div>
    <div class="v-eq"><span>今天＋2 天</span><span>＝</span><span class="res">6 月 26 日星期四</span></div>
    <p class="v-notes">今天 6/24（二）→ 明天 6/25（<b>三</b>）→ 後天 6/26（<b>四</b>）；<br>後天＝今天 <b>＋2 天</b>，日期與星期都要往前推 2 格，<br>所以後天是 <b>6 月 26 日星期四</b>。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var calCard = document.getElementById('calCard');
  var calDate = document.getElementById('calDate');
  var calWeek = document.getElementById('calWeek');
  var calTag = document.getElementById('calTag');
  var tearFx = document.getElementById('tearFx');
  var status = document.getElementById('status');
  var tool = document.getElementById('tool');
  var busy = false;
  var state = 0; // 0=今天, 1=明天, 2=後天
  var PAGES = [
    { date: '6/24', week: '星期二', tag: '今天', say: '' },
    { date: '6/25', week: '星期三', tag: '明天' },
    { date: '6/26', week: '星期四', tag: '後天' }
  ];
  function render(i) {
    calDate.textContent = PAGES[i].date;
    calWeek.textContent = PAGES[i].week;
    calTag.textContent = PAGES[i].tag;
  }
  function tearOne(next, note, done) {
    calCard.classList.add('tearing');
    tearFx.setAttribute('opacity', '1');
    setTimeout(function () {
      render(next);
      calCard.classList.remove('tearing');
      setTimeout(function () {
        tearFx.setAttribute('opacity', '0');
        if (note) status.innerHTML = note;
        if (done) done();
      }, 300);
    }, 380);
  }
  tool.addEventListener('click', function () {
    if (busy) return;
    if (state === 2) { state = 0; render(0); status.textContent = '回到今天 6/24（星期二），再點一次翻到後天！'; return; }
    busy = true;
    state = 1;
    if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play('撕下一頁，明天。');
    tearOne(1, '撕下 6/24 → 翻過 <b>明天 6/25（星期三）</b>…', function () {
      state = 2;
      if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play('再撕一頁，後天。');
      tearOne(2, '再撕一頁：<b>後天是 6/26（星期四）</b>！', function () { busy = false; });
    });
  });
  document.getElementById('reset').addEventListener('click', function () {
    if (busy) return;
    state = 0;
    render(0);
    status.textContent = '撕 1 頁是明天，撕 2 頁是後天——星期幾也跟著往前走！';
  });
  render(0);

  var CHOICES = ['6 月 25 日星期三', '6 月 26 日星期四', '6 月 23 日星期一', '6 月 26 日星期五'];
  var ANSWER = 1;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！24（二）＋2 天＝6 月 26 日星期四。';
      vq.classList.add('show');
      say('答對！六月二十六日星期四。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：後天要往前 2 天，6/24 星期二往前走 2 格。';
    say('再想想看：後天是加兩天。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-14-Q10', answer: ANSWER };
})();
</script>
</body>
</html>
