<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-7-Q03 九宮格積 24 熱點</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 8px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.grid { text-align: center; }
.grid-title { font-size: 11px; font-weight: 900; color: #4f46e5; letter-spacing: 2px; margin-bottom: 2px; }
.grid-stage { display: flex; justify-content: center; }
.found-line { font-size: 13px; font-weight: 900; color: #4f46e5; margin-top: 2px; min-height: 16px; }
.find-btn {
  margin-top: 3px;
  border: 2px solid #4f46e5;
  background: var(--bg-card);
  color: #4f46e5;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.find-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #e0e7ff; color: #4f46e5; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 6px 4px;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card grid">
    <p class="stem"><small>112-2 內湖 期中 一、(8)</small>在九九乘法表裡，積是 24 的乘法算式有哪四個？</p>
    <div class="grid-title">✦ 九九乘法表熱點矩陣 ✦</div>
    <div class="grid-stage" id="grid-stage"></div>
    <div class="found-line" id="found-line"></div>
    <div>
      <button type="button" class="find-btn" id="find">點亮積是 24 的格子</button>
      <span class="mode-label" id="mode-label">目前：未點亮</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['3×8、8×3、4×6、6×4', '2×12、12×2、3×8、8×3', '3×8、4×6、2×8、4×8', '1×24、3×8、4×6、6×4'];
  var ANSWER = 0;
  var picked = -1;
  var lit = false;

  var stage = document.getElementById('grid-stage');
  var foundLine = document.getElementById('found-line');
  var findBtn = document.getElementById('find');
  var modeLabel = document.getElementById('mode-label');

  /* 九九乘法表 9×9 縮小版；四個對稱熱點 (3,8)(8,3)(4,6)(6,4) */
  var HOT = [[3, 8], [8, 3], [4, 6], [6, 4]];
  function tableSVG(isLit) {
    var s = '<svg width="212" height="172" viewBox="0 0 212 172">';
    var x0 = 30, y0 = 22, cw = 19, ch = 16;
    for (var h = 1; h <= 9; h++) {
      s += '<text x="' + (x0 + (h - 0.5) * cw) + '" y="' + (y0 - 6) + '" font-size="9" font-weight="900" text-anchor="middle" fill="#4f46e5">' + h + '</text>';
      s += '<text x="' + (x0 - 8) + '" y="' + (y0 + (h - 0.5) * ch + 4) + '" font-size="9" font-weight="900" text-anchor="middle" fill="#4f46e5">' + h + '</text>';
    }
    for (var r = 1; r <= 9; r++) {
      for (var c = 1; c <= 9; c++) {
        var x = x0 + (c - 1) * cw, y = y0 + (r - 1) * ch;
        var isHot = HOT.some(function (p) { return p[0] === r && p[1] === c; });
        if (isLit && isHot) {
          s += '<rect x="' + (x + 0.5) + '" y="' + (y + 0.5) + '" width="' + (cw - 1) + '" height="' + (ch - 1) + '" rx="3" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>';
          s += '<text x="' + (x + cw / 2) + '" y="' + (y + ch - 3.5) + '" font-size="9" font-weight="900" text-anchor="middle" fill="#7c2d12">' + (r * c) + '</text>';
        } else {
          s += '<text x="' + (x + cw / 2) + '" y="' + (y + ch - 3.5) + '" font-size="8.5" font-weight="400" text-anchor="middle" fill="#b8b2a6">' + (r * c) + '</text>';
        }
      }
    }
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = tableSVG(lit);
    if (lit) {
      foundLine.textContent = '3×8、8×3、4×6、6×4——對稱的交叉點！';
      modeLabel.textContent = '目前：已點亮';
      findBtn.textContent = '全部蓋起來';
    } else {
      foundLine.textContent = '找找看：哪幾格是 24？';
      modeLabel.textContent = '目前：未點亮';
      findBtn.textContent = '點亮積是 24 的格子';
    }
  }

  findBtn.addEventListener('click', function () { lit = !lit; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！兩個因數都不出 1～9：3×8、8×3、4×6、6×4 四個對稱交叉點。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：九九乘法表的兩個因數最大只能到 9——2×12、1×24 的 12 和 24 都超出表外；2×8＝16、4×8＝32 積也不是 24。';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-7-Q03', answer: ANSWER };

  render();
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
