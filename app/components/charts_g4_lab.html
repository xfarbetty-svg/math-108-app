<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>D-4-1 報讀與製作長條圖、折線圖・108課綱互動教具（三活動＋真題雙軌）</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
:root{
  --bg:var(--bg-main); --card:var(--bg-card); --elev:var(--bg-elevated);
  --ink:var(--text-primary); --soft:var(--text-secondary); --line:var(--border-color);
  --a:var(--accent-primary); --mint:var(--accent-mint); --sky:var(--accent-sky);
  --lemon:var(--accent-lemon); --ok:#15803d; --warn:#b91c1c;
  --shadow:0 6px 16px var(--shadow-color); --radius:12px;
}
html[data-theme="dark"]{--ok:#4ade80;--warn:#fca5a5;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100vw;overflow-x:hidden;height:auto;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{margin:0;padding:8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{width:100%;max-width:470px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:5px}
.head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:18px;font-size:10px;color:var(--soft)}
.head b{font-size:12px;color:var(--ink);font-weight:900}
.head-right{display:flex;align-items:center;gap:5px}
#btn-theme{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
#modeTag{font-size:9.5px;font-weight:800;color:var(--a);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--elev);padding:3px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:5px 8px;border-radius:999px;font-size:10.5px;font-weight:900;color:var(--soft);white-space:nowrap}
.tab.active{background:var(--card);color:var(--a);box-shadow:0 2px 5px rgba(0,0,0,.08)}
body.q-mode .tabs{display:none!important}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);max-width:100%}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.badge{background:var(--elev);color:var(--a);font-size:9.5px;font-weight:900;padding:2px 7px;border-radius:999px;white-space:nowrap}
.title{font-size:12px;font-weight:900;color:var(--ink);line-height:1.3}
.desc{font-size:10.5px;line-height:1.4;color:var(--soft)}
.msg{background:var(--elev);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:10px;line-height:1.35;color:var(--ink);font-weight:700;text-align:left;min-height:18px}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.actrow{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.actbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 9px;font-size:10.5px;font-weight:900;transition:transform .08s}
.actbtn.main{border-color:var(--a);color:var(--a)}
.actbtn.sel,.actbtn.active{background:var(--a);color:#fff;border-color:var(--a)}
.actbtn:active{transform:translateY(1px)}
.explain{display:grid;grid-template-columns:46px 1fr;gap:2px 6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;line-height:1.35;background:var(--elev);border-radius:8px;padding:5px 7px;border:1px dashed var(--line)}
.explain .k{color:var(--a);font-weight:900;white-space:nowrap}
.explain .v{color:var(--ink);min-width:0;word-break:break-word}
.explain .trap{color:var(--warn)}
[hidden]{display:none!important}
.chart-wrap{background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:3px 4px;line-height:0;max-width:100%}
svg.chart{width:100%;height:auto;max-height:150px;display:block;font-family:-apple-system,"Noto Sans TC",sans-serif}
svg.chart text{font-size:9px;fill:var(--soft)}
svg.chart text.val{fill:var(--a);font-weight:900;font-size:10px}
svg.chart text.hi{fill:var(--ok);font-weight:900;font-size:10px}
svg.chart .grid{stroke:var(--line);stroke-width:.6}
svg.chart .axis{stroke:var(--ink);stroke-width:1.1;opacity:.8}
svg.chart .wave{stroke:var(--a);stroke-width:1.6;fill:none}
svg.chart rect.bar{fill:var(--mint);stroke:var(--line);stroke-width:.5;cursor:pointer;transition:fill .12s}
svg.chart rect.bar.alt{fill:var(--sky)}
svg.chart rect.bar.on{fill:var(--a)}
svg.chart rect.bar.hi{fill:var(--ok)}
svg.chart circle.pt{fill:var(--card);stroke:var(--a);stroke-width:1.8;cursor:pointer}
svg.chart circle.pt.alt{stroke:var(--lemon)}
svg.chart circle.pt.on{fill:var(--a)}
svg.chart polyline.ln{fill:none;stroke:var(--a);stroke-width:1.9}
svg.chart polyline.ln.alt{fill:none;stroke:var(--lemon);stroke-width:1.9;stroke-dasharray:4 3}
svg.chart line.mark{stroke:var(--ok);stroke-width:1.2;stroke-dasharray:3 2}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 122px;gap:6px;align-items:start}
.side{display:flex;flex-direction:column;gap:4px;font-size:9.5px;line-height:1.35;color:var(--soft)}
.side b{color:var(--ink);font-size:10px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:9.5px;font-weight:800;color:var(--soft)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px}
.mini-tbl{width:100%;border-collapse:collapse;font-size:9.5px;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mini-tbl th,.mini-tbl td{padding:2px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;white-space:nowrap}
.mini-tbl th{background:var(--elev);color:var(--a);font-weight:900;text-align:center;font-size:9px}
.mini-tbl td:last-child{text-align:right;font-weight:800}
.mini-tbl tr:last-child td{border-bottom:none}
@media(max-width:390px){
  .head b{font-size:11px}
  .tab{font-size:10px;padding:5px 6px}
  .title{font-size:11.5px}
  .two-col{grid-template-columns:minmax(0,1fr) 104px}
}
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div id="app">
  <div class="head">
    <b>D-4-1 長條圖、折線圖・報讀與製作</b>
    <div class="head-right"><span id="modeTag">🌱 概念探索</span><button id="btn-theme" type="button" aria-label="切換主題">🌙</button></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" type="button" data-act="0">活動一・長條圖</button>
    <button class="tab" type="button" data-act="1">活動二・波浪省略</button>
    <button class="tab" type="button" data-act="2">活動三・增減陡峭</button>
  </nav>
  <section class="panel" id="act0"></section>
  <section class="panel" id="act1" hidden></section>
  <section class="panel" id="act2" hidden></section>
  <section class="panel" id="examPanel" hidden></section>
</div>
<script>
const P = new URLSearchParams(location.search);
const qParam = parseInt(P.get('q') || '0', 10);
const EXAM = qParam >= 1 && qParam <= 10;
const Q = EXAM ? qParam : 1;
const $ = (id) => document.getElementById(id);
const AX = 'var(--ink)', AS = 'var(--soft)', AA = 'var(--a)', AM = 'var(--mint)', AL = 'var(--lemon)', AG = 'var(--ok)';

function applyTheme(t) {
  const theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  $('btn-theme').textContent = theme === 'dark' ? '☀️' : '🌙';
}
applyTheme(P.get('theme') || localStorage.getItem('math108_theme') || 'light');
$('btn-theme').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('math108_theme', next);
  applyTheme(next);
};
window.addEventListener('message', (e) => {
  if (e && e.data && e.data.type === 'THEME_CHANGE') applyTheme(e.data.theme);
});

function explainHTML(c, st) {
  if (!st.shown) return '';
  return `<div class="explain">
    <span class="k">觀念</span><span class="v">${c.concept}</span>
    <span class="k">步驟</span><span class="v">${c.steps.join(' → ')}</span>
    <span class="k trap">陷阱</span><span class="v trap">${c.trap}</span>
  </div>`;
}
function wrap(inner) { return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 340 148" role="img" aria-label="統計圖表">${inner}</svg></div>`; }
function gridV(x0, x1, yTop, yBot, max, step, unit) {
  let s = '';
  for (let t = 0; t <= max; t += step) {
    const y = yBot - (t / max) * (yBot - yTop);
    s += `<line class="grid" x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}"/>`;
    s += `<text x="${x0 - 3}" y="${(y + 3).toFixed(1)}" text-anchor="end">${t}</text>`;
  }
  s += `<line class="axis" x1="${x0}" y1="${yTop}" x2="${x0}" y2="${yBot}"/>`;
  s += `<line class="axis" x1="${x0}" y1="${yBot}" x2="${x1}" y2="${yBot}"/>`;
  if (unit) s += `<text x="${x0 - 3}" y="${yTop - 4}" text-anchor="end">${unit}</text>`;
  return s;
}
function waveAt(x, y) {
  let d = `M${x - 12} ${y}`;
  for (let i = 0; i < 6; i++) d += ` q3 -4 6 0 q3 4 6 0`;
  return `<path class="wave" d="${d}"/>`;
}
function waveY(x, yMid) {
  return `<path class="wave" d="M${x} ${yMid - 7} c-5 2.2 5 4.6 0 7 c-5 2.4 5 4.8 0 7"/>`;
}
function vBars(cats, vals, st, opt) {
  opt = opt || {};
  const max = opt.max || 12, step = opt.step || 2, unit = opt.unit || '';
  const x0 = 34, x1 = 330, yT = 14, yB = 116, n = cats.length, gw = (x1 - x0) / n;
  let s = gridV(x0, x1, yT, yB, max, step, unit);
  if (opt.break) s += waveAt(x0 + gw * 0.5, yB + 4);
  cats.forEach((c, i) => {
    const bw = Math.min(30, gw * 0.56), bx = x0 + gw * i + (gw - bw) / 2;
    const h = Math.min(1, vals[i] / max) * (yB - yT);
    s += `<rect class="bar ${st.reveal[i] ? 'on' : ''}" data-i="${i}" x="${bx.toFixed(1)}" y="${(yB - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`;
    s += `<text x="${(bx + bw / 2).toFixed(1)}" y="${yB + 12}" text-anchor="middle">${c}</text>`;
    if (st.reveal[i]) s += `<text class="val" x="${(bx + bw / 2).toFixed(1)}" y="${(yB - h - 3).toFixed(1)}" text-anchor="middle">${vals[i]}</text>`;
  });
  return wrap(s);
}
function vGrouped(cats, aVals, bVals, st, opt) {
  const max = opt.max, step = opt.step, x0 = 34, x1 = 330, yT = 14, yB = 116, n = cats.length, gw = (x1 - x0) / n;
  let s = gridV(x0, x1, yT, yB, max, step, opt.unit);
  cats.forEach((c, i) => {
    const bw = gw * 0.28, base = x0 + gw * i + gw * 0.08;
    [aVals, bVals].forEach((arr, k) => {
      const h = (arr[i] / max) * (yB - yT), bx = base + k * (bw + 2);
      s += `<rect class="bar ${k === 1 ? 'alt' : ''} ${st.reveal[i] ? 'on' : ''}" data-i="${i}" x="${bx.toFixed(1)}" y="${(yB - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`;
      if (st.reveal[i]) s += `<text class="val" x="${(bx + bw / 2).toFixed(1)}" y="${(yB - h - 2).toFixed(1)}" text-anchor="middle">${arr[i]}</text>`;
    });
    s += `<text x="${(base + bw).toFixed(1)}" y="${yB + 12}" text-anchor="middle">${c}</text>`;
  });
  return wrap(s);
}
function lines(labels, series, st, opt) {
  const brk = !!opt.break;
  const min = brk ? opt.min : (opt.fullMin !== undefined ? opt.fullMin : opt.min);
  const step = (!brk && opt.fullStep !== undefined) ? opt.fullStep : opt.step;
  const max = opt.max, x0 = 38, x1 = 330, yT = 16, yB = 118, n = labels.length;
  const yStart = brk ? (yB - 20) : yB;
  const px = (i) => x0 + (i / (n - 1 || 1)) * (x1 - x0);
  const py = (v) => yStart - ((v - min) / (max - min)) * (yStart - yT);
  let s = '';
  for (let t = min; t <= max + 1e-6; t += step) {
    const tv = Math.round(t * 10) / 10;
    const y = py(tv);
    s += `<line class="grid" x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}"/>`;
    s += `<text x="${x0 - 4}" y="${(y + 3).toFixed(1)}" text-anchor="end">${tv}</text>`;
  }
  if (brk) {
    const yMid = (yStart + yB) / 2;
    s += `<text x="${x0 - 4}" y="${yB + 3}" text-anchor="end">0</text>`;
    s += `<line class="axis" x1="${x0}" y1="${yT}" x2="${x0}" y2="${(yMid - 7).toFixed(1)}"/>`;
    s += waveY(x0, yMid);
    s += `<line class="axis" x1="${x0}" y1="${(yMid + 7).toFixed(1)}" x2="${x0}" y2="${yB}"/>`;
    s += `<text x="${x0 + 6}" y="${(yMid + 3).toFixed(1)}" style="font-size:8.5px;fill:var(--a);font-weight:800">～ 省略 0～${min}</text>`;
  } else {
    s += `<line class="axis" x1="${x0}" y1="${yT}" x2="${x0}" y2="${yB}"/>`;
  }
  s += `<line class="axis" x1="${x0}" y1="${yB}" x2="${x1}" y2="${yB}"/>`;
  if (opt.unit) s += `<text x="${x0 - 4}" y="${yT - 5}" text-anchor="end">(${opt.unit})</text>`;
  series.forEach((se, k) => {
    const pts = se.values.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
    s += `<polyline class="ln ${k ? 'alt' : ''}" points="${pts}"/>`;
    se.values.forEach((v, i) => {
      s += `<circle class="pt ${k ? 'alt' : ''} ${st.reveal[i] ? 'on' : ''}" data-i="${i}" cx="${px(i).toFixed(1)}" cy="${py(v).toFixed(1)}" r="3.4"/>`;
      if (st.reveal[i]) s += `<text class="val" x="${px(i).toFixed(1)}" y="${(py(v) - 5).toFixed(1)}" text-anchor="middle">${v}</text>`;
    });
  });
  labels.forEach((l, i) => { s += `<text x="${px(i).toFixed(1)}" y="${yB + 12}" text-anchor="middle">${l}</text>`; });
  return wrap(s);
}
function hBars(rows, st, opt) {
  const max = opt.max, step = opt.step, x0 = 66, x1 = 318, yT = 14, rh = 116 / rows.length;
  const maxVal = opt.hiMax ? Math.max(...rows.map(r => r.v)) : -1;
  let s = '';
  for (let t = 0; t <= max; t += step) {
    const x = x0 + (t / max) * (x1 - x0);
    s += `<line class="grid" x1="${x.toFixed(1)}" y1="${yT}" x2="${x.toFixed(1)}" y2="${yT + rh * rows.length}"/>`;
    s += `<text x="${x.toFixed(1)}" y="${yT + rh * rows.length + 11}" text-anchor="middle">${t}</text>`;
  }
  if (opt.unit) s += `<text x="${x1 + 4}" y="${yT + rh * rows.length + 11}" style="font-size:8.5px;fill:var(--soft)">(${opt.unit})</text>`;
  s += `<line class="axis" x1="${x0}" y1="${yT}" x2="${x0}" y2="${yT + rh * rows.length}"/>`;
  s += `<line class="axis" x1="${x0}" y1="${yT + rh * rows.length}" x2="${x1}" y2="${yT + rh * rows.length}"/>`;
  if (opt.break) s += waveAt(x0 + 8, yT + rh * rows.length - 2);
  rows.forEach((r, i) => {
    const yy = yT + rh * i + 3, hh = rh - 6, w = (r.v / max) * (x1 - x0);
    const showVal = st.reveal[i] || st.shown;
    const isHi = opt.hiMax && (st.step === 1 || st.shown) && r.v === maxVal;
    const barCls = `bar ${isHi ? 'hi' : (showVal ? 'on' : '')}`;
    s += `<rect class="${barCls}" data-i="${i}" x="${x0}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="2"/>`;
    s += `<text x="${x0 - 4}" y="${(yy + hh / 2 + 3).toFixed(1)}" text-anchor="end">${r.label}</text>`;
    if (showVal) s += `<text class="${isHi ? 'hi' : 'val'}" x="${(x0 + w + 4).toFixed(1)}" y="${(yy + hh / 2 + 3).toFixed(1)}">${r.v}${isHi ? ' 本' : ''}</text>`;
  });
  return wrap(s);
}
function pictogram(rows, st) {
  const x0 = 48, x1 = 318, yT = 18, yB = 122, max = 600, cw = (x1 - x0) / 6, rh = (yB - yT) / rows.length;
  let s = `<text x="${x0}" y="12" style="font-size:8.5px;fill:var(--soft)">一大格(整碗)＝100 碗　半格(半碗)＝50 碗（點列報讀）</text>`;
  for (let t = 0; t <= max; t += 50) {
    const x = x0 + (t / max) * (x1 - x0);
    if (t % 100 === 0) {
      s += `<line class="grid" x1="${x.toFixed(1)}" y1="${yT}" x2="${x.toFixed(1)}" y2="${yB}"/>`;
      s += `<text x="${x.toFixed(1)}" y="${yB + 11}" text-anchor="middle">${t}</text>`;
    } else {
      s += `<line class="grid" stroke-dasharray="2 2" opacity=".45" x1="${x.toFixed(1)}" y1="${yT}" x2="${x.toFixed(1)}" y2="${yB}"/>`;
    }
  }
  s += `<line class="axis" x1="${x0}" y1="${yT}" x2="${x0}" y2="${yB}"/><line class="axis" x1="${x0}" y1="${yB}" x2="${x1}" y2="${yB}"/>`;
  s += `<text x="${x1 + 3}" y="${yB + 11}" style="font-size:8.5px;fill:var(--soft)">(碗)</text>`;
  rows.forEach((r, i) => {
    const yy = yT + i * rh, full = Math.floor(r.v / 100), half = r.v % 100 >= 50;
    const fillMain = st.reveal[i] ? AA : 'var(--sky)';
    const fillHalf = st.reveal[i] ? AA : AM;
    s += `<text x="${x0 - 4}" y="${(yy + rh / 2 + 3).toFixed(1)}" text-anchor="end" style="font-size:9px;fill:var(--ink)">${r.label}</text>`;
    for (let k = 0; k < full; k++) {
      const bx = x0 + k * cw + cw * 0.16, bw = cw * 0.68, by = yy + 4;
      s += `<path d="M${bx.toFixed(1)} ${by.toFixed(1)} h${bw.toFixed(1)} l-${(bw * 0.14).toFixed(1)} ${(rh - 8).toFixed(1)} h-${(bw * 0.72).toFixed(1)} z" fill="${fillMain}" stroke="${AS}" stroke-width=".65"/>`;
    }
    if (half) {
      const bx = x0 + full * cw + cw * 0.1, bw = cw * 0.34, by = yy + 4;
      s += `<path d="M${bx.toFixed(1)} ${by.toFixed(1)} h${bw.toFixed(1)} v${(rh - 8).toFixed(1)} h-${(bw * 0.72).toFixed(1)} z" fill="${fillHalf}" stroke="${AS}" stroke-width=".65"/>`;
    }
    s += `<rect data-i="${i}" x="${x0}" y="${yy.toFixed(1)}" width="${x1 - x0}" height="${rh.toFixed(1)}" style="fill:transparent;stroke:none;cursor:pointer"/>`;
    if (st.reveal[i]) s += `<text class="hi" x="${(x0 + (r.v / max) * (x1 - x0) + 4).toFixed(1)}" y="${(yy + rh / 2 + 3).toFixed(1)}">${r.v} 碗</text>`;
  });
  return wrap(s);
}
function barGradeSum(rows, st) {
  return vBars(rows.map(r => r.label), rows.map(r => r.v), st, {max:40, step:10, unit:'人'});
}
function axisDemo(st) {
  const hi = st.step === 1 || st.reveal[0] || st.reveal[1];
  const reqC = hi ? 'var(--ok)' : 'var(--ink)';
  const reqW = hi ? 'font-weight:900;' : '';
  const brkC = 'var(--a)';
  // 左圖：體重統計 (有 ～)
  let s = `<g data-i="0" style="cursor:pointer">`;
  s += `<rect x="6" y="4" width="156" height="140" rx="6" fill="var(--card)" stroke="${st.reveal[0] || hi ? AA : 'var(--line)'}" stroke-width="${st.reveal[0] || hi ? '1.2' : '.7'}"/>`;
  s += `<text x="84" y="16" text-anchor="middle" style="font-size:9.5px;${reqW}fill:${reqC}">① 體重統計圖（有 ～）</text>`;
  s += `<text x="32" y="27" text-anchor="end" style="font-size:8px;${reqW}fill:${reqC}">(公斤)</text>`;
  // Y 軸 0 -> ～ -> 40, 50, 60
  const x0L = 34, x1L = 148, yTL = 32, ySL = 96, yBL = 114;
  [40, 50, 60].forEach((v) => {
    const y = ySL - ((v - 40) / 20) * (ySL - yTL);
    s += `<line class="grid" x1="${x0L}" y1="${y.toFixed(1)}" x2="${x1L}" y2="${y.toFixed(1)}"/>`;
    s += `<text x="${x0L - 3}" y="${(y + 3).toFixed(1)}" text-anchor="end" style="font-size:8px">${v}</text>`;
  });
  s += `<text x="${x0L - 3}" y="${yBL + 3}" text-anchor="end" style="font-size:8px">0</text>`;
  s += `<line class="axis" x1="${x0L}" y1="${yTL}" x2="${x0L}" y2="${ySL + 2}"/>`;
  s += waveY(x0L, (ySL + yBL) / 2);
  s += `<line class="axis" x1="${x0L}" y1="${yBL - 2}" x2="${x0L}" y2="${yBL}"/><line class="axis" x1="${x0L}" y1="${yBL}" x2="${x1L}" y2="${yBL}"/>`;
  s += `<text x="${x0L + 5}" y="${((ySL + yBL) / 2 + 3).toFixed(1)}" style="font-size:7.5px;fill:${brkC};font-weight:900">～ 省略</text>`;
  [[64, 48, '甲'], [110, 56, '乙']].forEach(([bx, v, lb]) => {
    const yt = ySL - ((v - 40) / 20) * (ySL - yTL);
    s += `<rect x="${bx}" y="${yt.toFixed(1)}" width="24" height="${(yBL - yt).toFixed(1)}" fill="var(--mint)" stroke="${AS}" stroke-width=".5" rx="2"/>`;
    s += `<text x="${bx + 12}" y="${yBL + 10}" text-anchor="middle" style="font-size:8px;${reqW}fill:${reqC}">${lb}</text>`;
  });
  s += `<text x="84" y="138" text-anchor="middle" style="font-size:8px;fill:${brkC};font-weight:800">跳過大段才用 ～（非必要）</text></g>`;

  // 右圖：借書統計 (無 ～)
  s += `<g data-i="1" style="cursor:pointer">`;
  s += `<rect x="178" y="4" width="156" height="140" rx="6" fill="var(--card)" stroke="${st.reveal[1] || hi ? AA : 'var(--line)'}" stroke-width="${st.reveal[1] || hi ? '1.2' : '.7'}"/>`;
  s += `<text x="256" y="16" text-anchor="middle" style="font-size:9.5px;${reqW}fill:${reqC}">② 借書統計圖（無 ～）</text>`;
  s += `<text x="204" y="27" text-anchor="end" style="font-size:8px;${reqW}fill:${reqC}">(本)</text>`;
  const x0R = 206, x1R = 320, yTR = 32, yBR = 114;
  [0, 2, 4, 6].forEach((v) => {
    const y = yBR - (v / 6) * (yBR - yTR);
    s += `<line class="grid" x1="${x0R}" y1="${y.toFixed(1)}" x2="${x1R}" y2="${y.toFixed(1)}"/>`;
    s += `<text x="${x0R - 3}" y="${(y + 3).toFixed(1)}" text-anchor="end" style="font-size:8px">${v}</text>`;
  });
  s += `<line class="axis" x1="${x0R}" y1="${yTR}" x2="${x0R}" y2="${yBR}"/><line class="axis" x1="${x0R}" y1="${yBR}" x2="${x1R}" y2="${yBR}"/>`;
  [[228, 3, '甲'], [276, 5, '乙']].forEach(([bx, v, lb]) => {
    const yt = yBR - (v / 6) * (yBR - yTR);
    s += `<rect x="${bx}" y="${yt.toFixed(1)}" width="24" height="${(yBR - yt).toFixed(1)}" fill="var(--sky)" stroke="${AS}" stroke-width=".5" rx="2"/>`;
    s += `<text x="${bx + 12}" y="${yBR + 10}" text-anchor="middle" style="font-size:8px;${reqW}fill:${reqC}">${lb}</text>`;
  });
  s += `<text x="256" y="138" text-anchor="middle" style="font-size:8px;fill:${reqC};font-weight:800">必要：標題、單位、類別</text></g>`;
  return wrap(s);
}

  const cfg = EXAMS[Q];

      : `已報讀 ${picked.length}/6 個年級，目前累計 ${sum} 人。`;
  } else if (Q === 9 && (st.step || st.reveal[0] || st.reveal[1])) {
    qMsg = '兩張圖都有「標題、單位、類別」；只有跳過大段刻度才用 ～，所以 ～ 非必要。';
  }
  $('examPanel').innerHTML = `<div class="card-head"><span class="badge">${cfg.badge}</span><span class="title">${cfg.title}</span></div>
    ${body}
    <div class="msg" id="qMsg">${qMsg}</div>
    <div class="actrow">
      <button class="actbtn main" id="qAct1" type="button">${st.step ? '✓ ' + cfg.act : '① ' + cfg.act}</button>
      <button class="actbtn" id="rbtn" type="button">${st.shown ? '收起算理' : '一步一步看算理 🔍'}</button>
      <button class="actbtn" id="qReset" type="button">重置</button>
    </div>
    ${explainHTML(cfg, st)}`;
  $('examPanel').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { st.reveal[+b.dataset.i] = true; renderExam(); });
  $('qAct1').onclick = () => { st.step = 1; st.reveal = st.reveal.map(() => true); renderExam(); };
  $('rbtn').onclick = () => { st.shown = !st.shown; renderExam(); };
  $('qReset').onclick = () => { st.step = 0; st.shown = false; st.reveal = st.reveal.map(() => false); st.c2Break = true; renderExam(); };
}

if (EXAM) {
  document.body.classList.add('q-mode');
  $('tabs').hidden = true;
  $('modeTag').textContent = '🎯 真題演練 Q' + Q;
  $('act0').hidden = $('act1').hidden = $('act2').hidden = true;
  $('examPanel').hidden = false;
  window.__D41_MODE__ = 'exam';
  window.__D41_Q__ = Q;
  window.__D41_MODULE__ = EXAMS[Q].module;
  window.__D41_STATE__ = st;
  renderExam();
} else {
  $('modeTag').textContent = '🌱 概念探索';
  window.__D41_MODE__ = 'concept';
  window.__D41_Q__ = 0;
  window.__D41_MODULE__ = 'concept_only';
  renderAct0(); renderAct1(); renderAct2(); showAct(0);
  $('tabs').querySelectorAll('.tab').forEach(t => t.onclick = () => showAct(+t.dataset.act));
}
</script>
</body>
</html>
