<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>S-4-1 角度與量角器・108 課綱互動教具</title>
<link rel="stylesheet" href="../styles/theme-tokens.css">
<style>
:root{
  --bg:var(--bg-main, #fcfbf9);
  --card:var(--bg-card, #ffffff);
  --ink:var(--text-primary, #1e293b);
  --ink-soft:var(--text-secondary, #64748b);
  --line:var(--border-color, #e2e8f0);
  --a:var(--accent-primary, #2563eb);
  --mint:var(--accent-mint, #0d9488);
  --sky:var(--accent-sky, #0284c7);
  --elev:var(--bg-elevated, #f1f5f9);
  --ok:#16a34a; --warn:#ea580c; --err:#dc2626;
  --shadow:0 3px 10px rgba(0,0,0,0.06);
  --radius:12px;
  --ang-fill:rgba(37, 99, 235, 0.18);
  --ang-stroke:#2563eb;
  --ang-b-fill:rgba(234, 88, 12, 0.18);
  --ang-b-stroke:#ea580c;
  --ang-ok-fill:rgba(22, 163, 74, 0.20);
  --ang-ok-stroke:#16a34a;
  --prot-bg:rgba(255,255,255,0.88);
  --prot-ring:#94a3b8;
}
html[data-theme="dark"]{
  --bg:#0f172a; --card:#1e293b; --ink:#f8fafc; --ink-soft:#94a3b8;
  --line:#334155; --elev:#1e293b; --ok:#4ade80; --warn:#fb923c; --err:#f87171;
  --shadow:0 3px 10px rgba(0,0,0,0.28);
  --ang-fill:rgba(96, 165, 250, 0.24);
  --ang-stroke:#60a5fa;
  --ang-b-fill:rgba(251, 146, 60, 0.24);
  --ang-b-stroke:#fb923c;
  --ang-ok-fill:rgba(74, 222, 128, 0.24);
  --ang-ok-stroke:#4ade80;
  --prot-bg:rgba(15,23,42,0.86);
  --prot-ring:#64748b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;max-width:100vw;overflow-x:hidden;height:auto;min-height:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:4px 8px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
[hidden]{display:none!important}
#app{width:100%;max-width:480px;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:4px;overflow:visible}

.head{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--ink-soft);min-height:22px}
.head-left{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.head b{font-size:12px;color:var(--ink);white-space:nowrap}
.head-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
#btn-theme{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}

.activity-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:var(--elev);padding:3px;border-radius:999px;flex-wrap:nowrap;max-width:100%}
.activity-nav::-webkit-scrollbar{display:none}
.act-btn{flex:0 0 auto;padding:4px 9px;font-size:11px;font-weight:800;border-radius:999px;color:var(--ink-soft);white-space:nowrap;transition:all .15s}
.act-btn.active{background:var(--card);color:var(--a);box-shadow:0 2px 5px rgba(0,0,0,.08)}

.act-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);max-width:100%;overflow:visible}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.card-badge{background:var(--elev);color:var(--a);font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;white-space:nowrap}
.card-title{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.stage-canvas{width:100%;background:var(--elev);border-radius:10px;border:1px solid var(--line);padding:2px;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none}
.stage-canvas svg{width:100%;max-width:340px;height:128px;display:block;touch-action:none;user-select:none}

.interact-panel{background:var(--elev);border:1px solid var(--line);border-radius:9px;padding:4px 6px;display:flex;flex-direction:column;gap:4px;text-align:center;max-width:100%}
.btn-grid{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;align-items:center}
.btn-action{background:var(--card);border:1.2px solid var(--line);color:var(--ink);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:7px;white-space:nowrap}
.btn-action:hover{border-color:var(--a)}
.btn-action.primary{background:var(--a);border-color:var(--a);color:#fff}
.btn-action.active{background:var(--a);border-color:var(--a);color:#fff}

.info-bubble{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:10.5px;line-height:1.32;color:var(--ink);font-weight:700;text-align:left;min-height:18px}
.info-bubble.ok{border-color:var(--ok);color:var(--ok)}
.info-bubble.warn{border-color:var(--warn);color:var(--warn)}

.steps-box{background:var(--card);border:1.5px solid var(--ok);border-radius:8px;padding:5px 7px;font-size:10px;line-height:1.35;color:var(--ink);display:flex;flex-direction:column;gap:2px;text-align:left}
.step-line b{color:var(--ok);margin-right:3px}

/* 嚴格雙模式隔離：q-mode 下強制隱藏所有概念活動頁籤與卡片 */
.q-mode .activity-nav,
.q-mode #act-0-view,
.q-mode #act-1-view,
.q-mode #act-2-view{display:none!important}
</style>
<script src="../js/audio_manager.js"></script>
</head>
<body>
<div id="app">
  <div class="head">
    <div class="head-left">
      <b>📐 角度與量角器實驗室</b>
      <span id="qtag" class="card-badge" hidden></span>
    </div>
    <div class="head-right">
      <button type="button" id="btn-theme">🌙 深色</button>
    </div>
  </div>

  <nav class="activity-nav" id="activityNav">
    <button type="button" class="act-btn active" data-act="0">① 鱷魚張嘴</button>
    <button type="button" class="act-btn" data-act="1">② 摺扇開合</button>
    <button type="button" class="act-btn" data-act="2">③ 尋寶量角器</button>
  </nav>

  <!-- 活動一：張嘴鱷魚比大小（邊長不影響角的大小） -->
  <section class="act-card" id="act-0-view">
    <div class="card-head">
      <span class="card-badge">活動一・張嘴鱷魚</span>
      <span class="card-title">拉長鱷魚嘴巴，角度會變大嗎？</span>
    </div>
    <div class="stage-canvas">
      <svg id="svg0" viewBox="0 0 340 128"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action primary" id="act0Short">短嘴 45mm</button>
        <button type="button" class="btn-action" id="act0Long">長嘴 105mm</button>
        <button type="button" class="btn-action" id="act0Ang35">張開 35°</button>
        <button type="button" class="btn-action" id="act0Ang70">張開 70°</button>
      </div>
      <div class="info-bubble" id="act0Msg">拖曳橘色圓點 P 拉長/縮短鱷魚嘴巴，或上下調整張開角度，驗證邊長與角度關係！</div>
    </div>
  </section>

  <!-- 活動二：摺扇開合百寶箱（銳角/直角/鈍角/平角/周角） -->
  <section class="act-card" id="act-1-view" hidden>
    <div class="card-head">
      <span class="card-badge">活動二・摺扇開合</span>
      <span class="card-title">拖曳扇骨從 0° 展開到 360° 周角</span>
    </div>
    <div class="stage-canvas">
      <svg id="svg1" viewBox="0 0 340 128"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action" id="act1Right">直角 90°</button>
        <button type="button" class="btn-action" id="act1Straight">平角 180°</button>
        <button type="button" class="btn-action" id="act1Full">周角 360°</button>
        <button type="button" class="btn-action" id="act1Reset">銳角 45°</button>
      </div>
      <div class="info-bubble" id="act1Msg">拖曳橘色扇骨把手，觀察 90° 直角、180° 平角與 360° 周角的即時分類變化！</div>
    </div>
  </section>

  <!-- 活動三：校園尋寶量角器（對齊 0° 實測） -->
  <section class="act-card" id="act-2-view" hidden>
    <div class="card-head">
      <span class="card-badge">活動三・尋寶量角</span>
      <span class="card-title">轉動量角器對齊 0° 線讀出夾角</span>
    </div>
    <div class="stage-canvas">
      <svg id="svg2" viewBox="0 0 340 128"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid">
        <button type="button" class="btn-action primary" id="act2C0">關卡 A (60°)</button>
        <button type="button" class="btn-action" id="act2C1">關卡 B (135°)</button>
        <button type="button" class="btn-action" id="act2C2">關卡 C (90°)</button>
        <button type="button" class="btn-action" id="act2Snap">自動對齊 0°</button>
      </div>
      <div class="info-bubble" id="act2Msg">拖曳橘色旋轉把手轉動半圓量角器，使 0° 線對齊基準路線後讀出尋寶夾角！</div>
    </div>
  </section>

  <!-- 真題實驗區（?q=1..10 專屬） -->
  <section class="act-card" id="exam-view" hidden>
    <div class="card-head">
      <span class="card-badge" id="qBadge">真題實驗</span>
      <span class="card-title" id="qTitle">載入中</span>
    </div>
    <div class="stage-canvas">
      <svg id="examStage" viewBox="0 0 340 128"></svg>
    </div>
    <div class="interact-panel">
      <div class="btn-grid" id="examControls"></div>
      <div class="info-bubble" id="examMsg">先操作上方實驗按鈕觀察角度變化，再於題幹區選出正確答案！</div>
      <div class="steps-box" id="stepsBox" hidden></div>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';
  const params = new URLSearchParams(location.search);
  const qNum = parseInt(params.get('q') || '0', 10);
  const isExam = qNum >= 1 && qNum <= 10;
  window.__S41_MODE__ = isExam ? ('q' + qNum) : 'concept';

  /* ---------- 主題同步（支援 theme-tokens / #btn-theme / THEME_CHANGE） ---------- */
  const btnTheme = document.getElementById('btn-theme');
  function applyTheme(t){
    const dark = t === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    btnTheme.textContent = dark ? '☀️ 淺色' : '🌙 深色';
  }
  applyTheme(params.get('theme') === 'dark' ? 'dark' : 'light');
  btnTheme.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });
  window.addEventListener('message', (ev) => {
    if (ev.data && ev.data.type === 'THEME_CHANGE') applyTheme(ev.data.theme);
  });

  /* ---------- SVG 工具 ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text){
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function polar(cx, cy, r, degCCW){
    const rad = degCCW * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy - r * Math.sin(rad)];
  }
  function sectorPath(cx, cy, r, startDeg, sweepDeg){
    if (sweepDeg <= 0.1) return '';
    if (sweepDeg >= 359.5) {
      return `M ${cx} ${cy - r} A ${r} ${r} 0 1 0 ${cx - 0.1} ${cy - r} Z`;
    }
    const [x1, y1] = polar(cx, cy, r, startDeg);
    const [x2, y2] = polar(cx, cy, r, startDeg + sweepDeg);
    const large = sweepDeg > 180 ? 1 : 0;
    return `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 ${large} 0 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
  }
  function drawProtractor(svg, cx, cy, R, rotDeg = 0, showInner = true, highlightDeg = null){
    const g = el('g', { transform: `rotate(${rotDeg} ${cx} ${cy})` });
    // 半圓透明底
    g.appendChild(el('path', {
      d: `M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy} Z`,
      fill: 'var(--prot-bg)', stroke: 'var(--prot-ring)', 'stroke-width': 1.5
    }));
    // 內半圓
    g.appendChild(el('path', {
      d: `M ${cx - R * 0.62} ${cy} A ${R * 0.62} ${R * 0.62} 0 0 1 ${cx + R * 0.62} ${cy}`,
      fill: 'none', stroke: 'var(--prot-ring)', 'stroke-width': 0.8, 'stroke-dasharray': '2,2'
    }));
    // 刻度（0 到 180，每 5 度一小格，每 10 度標字，每 30 度標字）
    for (let d = 0; d <= 180; d += 5) {
      const outerDeg = 180 - d; // d=0 在左(180°), d=180 在右(0°)
      const isMajor = d % 30 === 0;
      const isTen = d % 10 === 0;
      const len = isMajor ? 8 : (isTen ? 5.5 : 3);
      const [x1, y1] = polar(cx, cy, R, outerDeg);
      const [x2, y2] = polar(cx, cy, R - len, outerDeg);
      g.appendChild(el('line', {
        x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1),
        stroke: isMajor ? 'var(--ink)' : 'var(--ink-soft)', 'stroke-width': isMajor ? 1.2 : 0.7
      }));
      if (isMajor) {
        const [ox, oy] = polar(cx, cy, R - 15, outerDeg);
        g.appendChild(el('text', {
          x: ox.toFixed(1), y: (oy + 3).toFixed(1), 'font-size': 7.5, 'font-weight': 800,
          'text-anchor': 'middle', fill: 'var(--a)'
        }, String(d)));
        if (showInner) {
          const [ix, iy] = polar(cx, cy, R * 0.62 - 9, outerDeg);
          g.appendChild(el('text', {
            x: ix.toFixed(1), y: (iy + 2.5).toFixed(1), 'font-size': 6.8, 'font-weight': 700,
            'text-anchor': 'middle', fill: 'var(--warn)'
          }, String(180 - d)));
        }
      }
    }
    if (highlightDeg !== null) {
      const [hx, hy] = polar(cx, cy, R + 4, 180 - highlightDeg);
      g.appendChild(el('circle', { cx: hx.toFixed(1), cy: hy.toFixed(1), r: 4, fill: 'var(--ok)' }));
    }
    g.appendChild(el('circle', { cx, cy, r: 3, fill: 'var(--ink)' }));
    svg.appendChild(g);
    return g;
  }

  /* ---------- 狀態物件供 CDP 測試 ---------- */
  window.__S41_STATE__ = {
    act0Len: 55, act0Deg: 45,
    act1Deg: 45,
    act2ProtRot: -25, act2Case: 0
  };

  /* ---------- 活動分頁切換 ---------- */
  const actViews = [0,1,2].map(i => document.getElementById('act-' + i + '-view'));
  const navBtns = [...document.querySelectorAll('.act-btn')];
  function showActivity(idx){
    navBtns.forEach((b, i) => b.classList.toggle('active', i === idx));
    actViews.forEach((v, i) => { v.hidden = (i !== idx); });
  }
  navBtns.forEach(b => b.addEventListener('click', () => showActivity(Number(b.dataset.act))));

  /* ---------- 概念活動一：張嘴鱷魚（邊長與角度無關） ---------- */
  const svg0 = document.getElementById('svg0');
  const act0Msg = document.getElementById('act0Msg');
  function renderAct0(){
    const { act0Len, act0Deg } = window.__S41_STATE__;
    svg0.innerHTML = '';
    const cx = 72, cy = 98;
    // 左側固定小鱷魚參考組 (45px, 同角度)
    svg0.appendChild(el('path', { d: sectorPath(cx, cy, 24, 0, act0Deg), fill: 'var(--ang-fill)' }));
    const [rx, ry] = polar(cx, cy, act0Len, act0Deg);
    const [bx, by] = [cx + act0Len, cy];
    // 嘴巴上下顎
    svg0.appendChild(el('line', { x1: cx, y1: cy, x2: bx, y2: by, stroke: 'var(--ok)', 'stroke-width': 4, 'stroke-linecap': 'round' }));
    svg0.appendChild(el('line', { x1: cx, y1: cy, x2: rx.toFixed(1), y2: ry.toFixed(1), stroke: 'var(--a)', 'stroke-width': 4, 'stroke-linecap': 'round' }));
    // 鱷魚眼睛與牙齒裝飾
    svg0.appendChild(el('circle', { cx: cx + 8, cy: cy - 10, r: 4, fill: 'var(--ok)' }));
    svg0.appendChild(el('circle', { cx: cx + 9, cy: cy - 10, r: 1.5, fill: '#fff' }));
    // 拖曳把手 P
    svg0.appendChild(el('circle', { cx: rx.toFixed(1), cy: ry.toFixed(1), r: 7, fill: 'var(--warn)', stroke: '#fff', 'stroke-width': 2, style: 'cursor:grab' }));
    svg0.appendChild(el('text', { x: (rx + 9).toFixed(1), y: (ry - 4).toFixed(1), 'font-size': 10, 'font-weight': 800, fill: 'var(--warn)' }, 'P'));
    svg0.appendChild(el('text', { x: cx + 28, y: cy - 6, 'font-size': 11, 'font-weight': 900, fill: 'var(--a)' }, act0Deg + '°'));
    // 右側即時讀數卡
    svg0.appendChild(el('rect', { x: 222, y: 18, width: 108, height: 88, rx: 10, fill: 'var(--card)', stroke: 'var(--line)' }));
    svg0.appendChild(el('text', { x: 276, y: 40, 'font-size': 10, 'font-weight': 800, 'text-anchor': 'middle', fill: 'var(--ink-soft)' }, '嘴邊長度'));
    svg0.appendChild(el('text', { x: 276, y: 58, 'font-size': 14, 'font-weight': 900, 'text-anchor': 'middle', fill: 'var(--ink)' }, Math.round(act0Len) + ' mm'));
    svg0.appendChild(el('text', { x: 276, y: 78, 'font-size': 10, 'font-weight': 800, 'text-anchor': 'middle', fill: 'var(--ink-soft)' }, '張開角度'));
    svg0.appendChild(el('text', { x: 276, y: 97, 'font-size': 15, 'font-weight': 900, 'text-anchor': 'middle', fill: 'var(--a)' }, act0Deg + '°'));
    act0Msg.textContent = `邊長 ${Math.round(act0Len)} mm，角度仍維持 ${act0Deg}°！邊畫得再長，只要張開程度不變，角的大小都一樣。`;
  }
  let drag0 = false;
  svg0.addEventListener('pointerdown', (e) => { drag0 = true; svg0.setPointerCapture(e.pointerId); update0(e); });
  svg0.addEventListener('pointermove', (e) => { if (drag0) update0(e); });
  svg0.addEventListener('pointerup', () => { drag0 = false; });
  function update0(e){
    const r = svg0.getBoundingClientRect();
    const x = (e.clientX - r.left) * (340 / r.width);
    const y = (e.clientY - r.top) * (128 / r.height);
    const dx = x - 72, dy = 98 - y;
    const len = Math.max(40, Math.min(125, Math.hypot(dx, dy)));
    const deg = Math.max(15, Math.min(85, Math.round(Math.atan2(Math.max(5, dy), Math.max(10, dx)) * 180 / Math.PI)));
    window.__S41_STATE__.act0Len = len;
    window.__S41_STATE__.act0Deg = deg;
    renderAct0();
  }
  document.getElementById('act0Short').onclick = () => { window.__S41_STATE__.act0Len = 45; renderAct0(); };
  document.getElementById('act0Long').onclick = () => { window.__S41_STATE__.act0Len = 105; renderAct0(); };
  document.getElementById('act0Ang35').onclick = () => { window.__S41_STATE__.act0Deg = 35; renderAct0(); };
  document.getElementById('act0Ang70').onclick = () => { window.__S41_STATE__.act0Deg = 70; renderAct0(); };

  /* ---------- 概念活動二：摺扇開合（銳角/直角/鈍角/平角/周角） ---------- */
  const svg1 = document.getElementById('svg1');
  const act1Msg = document.getElementById('act1Msg');
  function classifyDeg(d){
    if (d === 360) return ['周角', 'var(--ok)', '轉完一整圈 = 4 個直角 = 360°'];
    if (d > 180) return ['優角（大於平角）', 'var(--sky)', '超過 180° 平角、小於 360° 周角'];
    if (d === 180) return ['平角', 'var(--ok)', '兩邊拉成一條直線 = 2 個直角 = 180°'];
    if (d > 90) return ['鈍角', 'var(--warn)', '大於 90° 直角、小於 180° 平角'];
    if (d === 90) return ['直角', 'var(--ok)', '正好 90°（方正垂直，標示直角記號）'];
    return ['銳角', 'var(--a)', '小於 90° 直角的尖角'];
  }
  function renderAct1(){
    const d = window.__S41_STATE__.act1Deg;
    svg1.innerHTML = '';
    const cx = 110, cy = 66, R = 48;
    // 摺扇扇面
    svg1.appendChild(el('circle', { cx, cy, r: R, fill: 'none', stroke: 'var(--line)', 'stroke-dasharray': '3,3' }));
    svg1.appendChild(el('path', { d: sectorPath(cx, cy, R, 0, d), fill: 'var(--ang-fill)', stroke: 'var(--ang-stroke)', 'stroke-width': 1.5 }));
    // 起始扇骨 (0°)

          svg.appendChild(el('path', { d: sectorPath(95, 88, 42, 0, 90), fill: 'var(--ang-fill)', stroke: 'var(--a)', 'stroke-width': 2 }));
          svg.appendChild(el('rect', { x: 95, y: 78, width: 10, height: 10, fill: 'none', stroke: 'var(--a)', 'stroke-width': 1.5 }));
          svg.appendChild(el('text', { x: 112, y: 66, 'font-size': 11, 'font-weight': 900, fill: 'var(--a)' }, '∠1 (直角)'));
          svg.appendChild(el('path', { d: sectorPath(240, 88, 42, 0, 130), fill: 'var(--ang-b-fill)', stroke: 'var(--warn)', 'stroke-width': 2 }));
          svg.appendChild(el('text', { x: 245, y: 66, 'font-size': 11, 'font-weight': 900, fill: 'var(--warn)' }, '∠2 (130°)'));
        } else {
          svg.appendChild(el('path', { d: sectorPath(cx, cy, R, 0, 90), fill: 'var(--ang-fill)', stroke: 'var(--a)', 'stroke-width': 1.5 }));
          svg.appendChild(el('path', { d: sectorPath(cx, cy, R, 90, 130), fill: 'var(--ang-b-fill)', stroke: 'var(--warn)', 'stroke-width': 1.5 }));
          svg.appendChild(el('line', { x1: cx - R - 6, y1: cy, x2: cx + R + 6, y2: cy, stroke: 'var(--line)', 'stroke-dasharray': '3,2' }));
          svg.appendChild(el('text', { x: cx + 18, y: cy - 18, 'font-size': 10, 'font-weight': 800, fill: 'var(--a)' }, '90°'));
          svg.appendChild(el('text', { x: cx - 32, y: cy + 8, 'font-size': 10, 'font-weight': 800, fill: 'var(--warn)' }, '130°'));
        }
        ctrls.innerHTML = '';
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn-action primary';
        b.textContent = this.state.merged ? '拆開兩個角' : '將 ∠1 與 ∠2 併攏合起來';
        b.onclick = () => { this.state.merged = !this.state.merged; msg.textContent = this.state.merged ? '∠1(90°) 和 ∠2(130°) 併攏跨過 180° 平角線了，請算出總角度！' : '點擊按鈕把兩個角併攏觀察。'; this.render(svg, ctrls, msg); };
        ctrls.appendChild(b);
      }
    },
    9: {
      badge: 'Q9・鐘面指針旋轉', title: '從數字 11 順時針轉到數字 4',
      steps: ['鐘面一圈 360° 平分成 12 大格，每 1 大格是 30°。', '從 11 順時針數到 4（11→12→1→2→3→4），共走 5 大格。', '30° × 5 ＝ 150 度。'],
      state: { stepsMoved: 0 },
      render(svg, ctrls, msg){
        svg.innerHTML = '';
        const cx = 130, cy = 64, R = 52;
        svg.appendChild(el('circle', { cx, cy, r: R, fill: 'var(--card)', stroke: 'var(--ink-soft)', 'stroke-width': 2 }));
        // 12 數字：12 在頂 (90°), 順時針每格 -30° => pos(num) = 90 - num*30
        for (let n = 1; n <= 12; n++) {
          const [nx, ny] = polar(cx, cy, R - 10, 90 - n * 30);
          svg.appendChild(el('text', { x: nx.toFixed(1), y: (ny + 3.5).toFixed(1), 'font-size': 9, 'font-weight': 800, 'text-anchor': 'middle', fill: (n === 11 || n === 4) ? 'var(--warn)' : 'var(--ink)' }, String(n)));
        }
        const startDeg = 90 - 11 * 30; // 120° (數字 11)
        const mv = this.state.stepsMoved;
        if (mv > 0) {
          svg.appendChild(el('path', { d: sectorPath(cx, cy, R * 0.65, startDeg - mv * 30, mv * 30), fill: 'var(--ang-b-fill)' }));
        }
        const [sx, sy] = polar(cx, cy, R - 18, startDeg);
        const [ex, ey] = polar(cx, cy, R - 18, startDeg - mv * 30);
        svg.appendChild(el('line', { x1: cx, y1: cy, x2: sx.toFixed(1), y2: sy.toFixed(1), stroke: 'var(--ink-soft)', 'stroke-width': 2.5, 'stroke-dasharray': '3,2' }));
        svg.appendChild(el('line', { x1: cx, y1: cy, x2: ex.toFixed(1), y2: ey.toFixed(1), stroke: 'var(--warn)', 'stroke-width': 3.5, 'stroke-linecap': 'round' }));
        svg.appendChild(el('circle', { cx, cy, r: 3, fill: 'var(--ink)' }));
        svg.appendChild(el('text', { x: 256, y: 58, 'font-size': 12, 'font-weight': 900, 'text-anchor': 'middle', fill: 'var(--ink)' }, `已順時針走 ${mv} 大格`));
        svg.appendChild(el('text', { x: 256, y: 80, 'font-size': 10.5, 'font-weight': 700, 'text-anchor': 'middle', fill: 'var(--ink-soft)' }, '提示：1 大格 = 30°'));
        ctrls.innerHTML = '';
        const b1 = document.createElement('button'); b1.type = 'button'; b1.className = 'btn-action primary';
        b1.textContent = '順時針走 1 大格';
        b1.onclick = () => { if (this.state.stepsMoved < 6) this.state.stepsMoved++; msg.textContent = this.state.stepsMoved === 5 ? '到數字 4 了！共走了 5 大格，請計算總度數！' : `目前走了 ${this.state.stepsMoved} 大格，目標走到數字 4。`; this.render(svg, ctrls, msg); };
        const b2 = document.createElement('button'); b2.type = 'button'; b2.className = 'btn-action';
        b2.textContent = '重回數字 11'; b2.onclick = () => { this.state.stepsMoved = 0; msg.textContent = '請按「順時針走 1 大格」數數看從 11 到 4 共走幾格！'; this.render(svg, ctrls, msg); };
        ctrls.appendChild(b1); ctrls.appendChild(b2);
      }
    },
    10: {
      badge: 'Q10・指定角度作圖', title: '左邊對齊外圈 0°，試點出 125° 位置',
      steps: ['左邊黑線對齊「外圈 0°」，數刻度時要看外圈數字。', '從左邊外圈 0° 順時針經過 90° 再往右到 125°（鈍角）。', '不可點在外圈 55°（那是銳角）或誤看內圈 125°。'],
      state: { pickOuter: 55 },
      render(svg, ctrls, msg){
        svg.innerHTML = '';
        const cx = 170, cy = 104, R = 80;
        drawProtractor(svg, cx, cy, R, 0, true);
        const od = this.state.pickOuter;
        svg.appendChild(el('path', { d: sectorPath(cx, cy, R * 0.65, 180 - od, od), fill: 'var(--ang-fill)' }));
        svg.appendChild(el('line', { x1: cx, y1: cy, x2: cx - R - 8, y2: cy, stroke: 'var(--ink)', 'stroke-width': 3 }));
        const [px, py] = polar(cx, cy, R + 8, 180 - od);
        svg.appendChild(el('line', { x1: cx, y1: cy, x2: px.toFixed(1), y2: py.toFixed(1), stroke: 'var(--warn)', 'stroke-width': 3 }));
        svg.appendChild(el('circle', { cx: px.toFixed(1), cy: py.toFixed(1), r: 4.5, fill: 'var(--warn)' }));
        ctrls.innerHTML = '';
        [['點外圈 55° (內圈125°)', 55], ['點外圈 125° (內圈55°)', 125], ['點外圈 135°', 135]].forEach(([t, v]) => {
          const b = document.createElement('button'); b.type = 'button'; b.className = 'btn-action' + (od === v ? ' active' : '');
          b.textContent = t; b.onclick = () => { this.state.pickOuter = v; msg.textContent = `目前畫出張開為外圈 ${v}° 的角，觀察哪一個才是真正大於 90° 的 125° 鈍角！`; this.render(svg, ctrls, msg); };
          ctrls.appendChild(b);
        });
      }
    }
  };

  if (isExam) {
    document.body.classList.add('q-mode');
    document.getElementById('qtag').hidden = false;
    document.getElementById('qtag').textContent = 'Q' + qNum;
    document.getElementById('exam-view').hidden = false;
    const meta = EXAM_META[qNum];
    document.getElementById('qBadge').textContent = meta.badge;
    document.getElementById('qTitle').textContent = meta.title;

    const svg = document.getElementById('examStage');
    const ctrls = document.getElementById('examControls');
    const msg = document.getElementById('examMsg');
    const stepsBox = document.getElementById('stepsBox');
    stepsBox.hidden = true;
    stepsBox.innerHTML = meta.steps.map((s, i) => `<div class="step-line"><b>步驟 ${i + 1}：</b>${s}</div>`).join('');

    const revBtn = document.createElement('button');
    revBtn.type = 'button'; revBtn.id = 'revealSteps'; revBtn.className = 'btn-action';
    revBtn.textContent = '一步一步看算理 🔍';
    revBtn.onclick = () => { stepsBox.hidden = !stepsBox.hidden; revBtn.textContent = stepsBox.hidden ? '一步一步看算理 🔍' : '收合算理'; };

    const origRender = meta.render.bind(meta);
    meta.render = function(s, c, m){
      origRender(s, c, m);
      c.appendChild(revBtn);
    };
    meta.render(svg, ctrls, msg);
  } else {
    renderAct0();
    renderAct1();
    renderAct2();
  }
})();
</script>
</body>
</html>
