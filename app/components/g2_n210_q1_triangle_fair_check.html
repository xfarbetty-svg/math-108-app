<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-10-Q01 三角形非等分判定</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-num { font-size:11px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:var(--bg-card); border-radius:10px; padding:5px 4px; font-size:13px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.tools { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; }
.tool-btn { border:2px solid var(--mint-deep); background:#eafaf4; color:var(--mint-deep); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:800; cursor:pointer; }
.status { text-align:center; font-size:12.5px; font-weight:800; color:var(--ink-soft); min-height:18px; }
.status b { color:var(--ink); }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:6px; font-size:20px; font-weight:800; }
.v-eq .res { color:var(--red); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
.vq.show .v-eq { animation:pop .3s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>三角形非等分判定</small>圖中的大三角形被切成 6 塊，塗色部分是 1/6 嗎？哪一個說法是正確的？</p>
  </div>
  <div class="card">
    <!-- 日系繪本場景：大三角形切成 6 塊大小明顯不均的區塊，塗色其中 1 塊 -->
    <svg class="scene-svg" viewBox="0 0 360 224" role="img" aria-label="大三角形切成 6 塊大小不均的區塊，塗色其中一塊">
      <g id="pieces">
        <polygon points="180,28 28,200 88,200" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="180,28 88,200 133,200" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="180,28 133,200 238,200" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="180,28 238,200 268,200" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="180,28 268,200 313,200" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
        <polygon points="180,28 313,200 332,200" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
      </g>
      <text x="58"  y="188" class="t-num">①</text>
      <text x="110" y="188" class="t-num">②</text>
      <text x="185" y="188" class="t-num">③ 塗色</text>
      <text x="253" y="188" class="t-num">④</text>
      <text x="290" y="188" class="t-num">⑤</text>
      <text x="322" y="188" class="t-num">⑥</text>
      <text x="180" y="220" class="t-caption">切成 6 塊的大三角形</text>
    </svg>
    <div class="tools">
      <button type="button" class="tool-btn" id="cmp">把 6 塊上色比一比 🎨</button>
    </div>
    <p class="status" id="status">上色之後，仔細看看每一塊一樣大嗎？</p>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-eq"><span>6 塊</span><span>≠</span><span class="res">6 等分</span></div>
    <p class="v-notes">分數的「分」就是<b>平分</b>：每一份要<b>一樣大</b>才公平。<br>這 6 塊<b>大小都不一樣</b>，塗色那塊比其他塊大很多，<br>所以它<b>不是</b>全部的 1/6。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ['是，因為塗色的部分是 6 份中的 1 份', '是，因為平分成 6 份', '不是，因為 6 份沒有一樣大', '無法判斷'];
  var ANSWER = 2;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  var status = document.getElementById('status');
  var cmpBtn = document.getElementById('cmp');
  var on = false;
  var PALETTE = ['#ffe9c9', '#d9f2e6', '#f7a8b8', '#fff3bf', '#e2dcf7', '#cde8f7'];
  var ORIG = '#fffdf8';
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  cmpBtn.addEventListener('click', function () {
    on = !on;
    var polys = document.querySelectorAll('#pieces polygon');
    Array.prototype.forEach.call(polys, function (p, i) {
      if (i === 2) return;
      p.setAttribute('fill', on ? PALETTE[i] : ORIG);
    });
    status.innerHTML = on ? '上色比一比：6 塊的<b>大小都不一樣</b>，份數一樣不等於平分！' : '上色之後，仔細看看每一塊一樣大嗎？';
    if (on) say('上色比一比，六塊的大小都不一樣。');
  });
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！6 塊沒有一樣大，塗色部分不是 1/6。';
      vq.classList.add('show');
      say('答對！六塊沒有一樣大，塗色部分不是六分之一。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：數數看不夠——每一份要一樣大才是平分，這 6 塊一樣大嗎？';
    say('再想想看：每一份要一樣大才是平分。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-10-Q01', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
