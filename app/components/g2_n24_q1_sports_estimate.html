<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-4-Q01 體育用品店估算湊 500 元</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint: #7bc9b2;
  --mint-deep: #318a70;
  --lemon: #ffd166;
  --coral: #ff8a65;
  --sky: #4ea8de;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 14px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 15px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

/* 貨架展示區 */
.shelf {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  padding: 4px 0;
}
.prod {
  border: 2px solid var(--line);
  border-radius: 10px;
  background: #fdfbf7;
  padding: 6px 2px 5px;
  text-align: center;
  transition: all 0.18s;
}
.prod svg { display: block; margin: 0 auto 3px; }
.prod .p-name { font-size: 10.5px; font-weight: 800; display: block; }
.prod .p-price { font-size: 11px; font-weight: 900; color: #b45309; display: block; }
.prod.sel { border-color: var(--mint-deep); background: #eafaf4; transform: translateY(-2px); }
.prod.sel .p-price { color: var(--mint-deep); }
.est-hint {
  margin-top: 6px;
  font-size: 11px;
  font-weight: 800;
  color: var(--mint-deep);
  background: #eafaf4;
  border-radius: 999px;
  padding: 4px 10px;
  text-align: center;
  line-height: 1.4;
}

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: var(--bg-card);
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
<link rel="stylesheet" href="../styles/theme-tokens.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>111-2 內湖 期中 五、2</small>宥廷在體育用品店買3個不一樣物品，大約花500元，他可能是買了什麼呢？</p>
  </div>
  <div class="card">
    <div class="shelf" id="shelf"></div>
    <div class="est-hint" id="hint">點下方選項，看看每件商品的概數</div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var PRODS = [
    { n: '護腕', p: 102 },
    { n: '襪子', p: 99 },
    { n: '帽子', p: 297 },
    { n: '毛巾', p: 198 },
    { n: '籃球', p: 503 }
  ];
  var ICONS = [
    '<svg width="30" height="26" viewBox="0 0 30 26"><rect x="8" y="9" width="14" height="9" rx="4" fill="none" stroke="#4ea8de" stroke-width="2.2"/></svg>',
    '<svg width="30" height="26" viewBox="0 0 30 26"><path d="M9 5 L21 5 L23 21 L7 21 Z" fill="none" stroke="#ff8a65" stroke-width="2.2" stroke-linejoin="round"/></svg>',
    '<svg width="30" height="26" viewBox="0 0 30 26"><path d="M6 14 a9 9 0 0 1 18 0 l4 4 -6 1 -2 -4 -10 0 -2 4 -6 -1 Z" fill="none" stroke="#318a70" stroke-width="2" stroke-linejoin="round"/></svg>',
    '<svg width="30" height="26" viewBox="0 0 30 26"><rect x="6" y="6" width="18" height="14" rx="2" fill="none" stroke="#ffd166" stroke-width="2.2"/><line x1="6" y1="13" x2="24" y2="13" stroke="#ffd166" stroke-width="2"/></svg>',
    '<svg width="30" height="26" viewBox="0 0 30 26"><circle cx="15" cy="13" r="9" fill="none" stroke="#c2410c" stroke-width="2.4"/><path d="M15 4 Q11 13 15 22" fill="none" stroke="#c2410c" stroke-width="2"/></svg>'
  ];
  var CHOICES = ['護腕、襪子和帽子', '護腕、襪子和毛巾', '毛巾、帽子和籃球', '襪子、毛巾和籃球'];
  var TRIOS = [[0, 1, 2], [0, 1, 3], [3, 2, 4], [1, 3, 4]];
  var ANSWER = 0;
  var picked = -1;

  var shelf = document.getElementById('shelf');
  PRODS.forEach(function (prod, i) {
    var d = document.createElement('div');
    d.className = 'prod';
    d.id = 'prod-' + i;
    d.innerHTML = ICONS[i] + '<span class="p-name">' + prod.n + '</span><span class="p-price">' + prod.p + ' 元</span>';
    shelf.appendChild(d);
  });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      markTrio(TRIOS[i]);
      hide();
    });
    optBox.appendChild(b);
  });

  function r100(v) { return Math.round(v / 100) * 100; }
  function markTrio(trio) {
    PRODS.forEach(function (_, i) { document.getElementById('prod-' + i).classList.toggle('sel', trio.indexOf(i) >= 0); });
    var parts = trio.map(function (i) { return PRODS[i].n + PRODS[i].p + '→約' + r100(PRODS[i].p); });
    var sum = trio.reduce(function (a, i) { return a + r100(PRODS[i].p); }, 0);
    document.getElementById('hint').textContent = parts.join('、') + '，合計約 ' + sum + ' 元';
  }

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！102→約100、99→約100、297→約300，100＋100＋300＝500，大約花 500 元。';
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：把選到的三件商品各自取概數（約整百）加加看，有沒有剛好湊成大約 500 元？';
    return { ok: false, picked: picked };
  };

  window.__q = { id: 'G2-N-2-4-Q01', answer: ANSWER };
})();
</script>
<script>
/* theme bridge: 同步外殼 Light/Dark，无私自提交按鈕 */
(function () {
  try {
    var t = localStorage.getItem('math108_theme') || 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'THEME_CHANGE' && e.data.theme) {
      document.documentElement.dataset.theme = e.data.theme;
      try { localStorage.setItem('math108_theme', e.data.theme); } catch (err) {}
    }
  });
})();
</script>
</body>
</html>
