<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-9-Q01 果凍同樂會（除法平分概念）</title>
<style>
:root { --ink:#3d3a34; --ink-soft:#8a857b; --mint:#7bc9b2; --mint-deep:#318a70; --lemon:#ffd166; --line:#f0e7da; --bg:#fff9f0; --red:#d64545; --paper:#fffdf8; --pink:#f7a8b8; --grape:#b8a7e8; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif; padding:6px 8px 8px; max-width:100vw; overflow-x:hidden; }
.wrap { max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:4px; }
.card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:5px 8px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.stem { font-size:13.5px; font-weight:800; line-height:1.35; }
.stem small { display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
.scene-svg { display:block; height:125px; width:auto; margin:0 auto; max-width:100%; }
.t-label { font-size:11px; font-weight:800; fill:var(--ink-soft); text-anchor:middle; }
.t-name { font-size:10.5px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.t-caption { font-size:12px; font-weight:800; fill:var(--ink); text-anchor:middle; }
.opts { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.opt-btn { border:2px solid var(--line); background:#fff; border-radius:10px; padding:5px 4px; font-size:13px; font-weight:800; color:var(--ink); text-align:center; transition:all .15s; }
.opt-btn.sel { border-color:var(--mint-deep); background:#eafaf4; }
.footer-action { text-align:center; }
.check-btn { border-radius:999px; padding:5px 22px; font-size:14px; font-weight:800; background:var(--mint-deep); color:#fff; box-shadow:0 4px 10px rgba(49,138,112,.3); }
.result-banner { display:none; border-radius:10px; padding:7px 10px; font-size:12.5px; font-weight:700; line-height:1.4; text-align:center; }
.result-banner.success { display:block; background:#dcfce7; color:#166534; }
.result-banner.fail { display:block; background:#fee2e2; color:#991b1b; }
.vq { display:none; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:10px 12px 12px; box-shadow:0 6px 18px rgba(120,90,40,.08); }
.vq.show { display:block; }
.v-eq { display:flex; justify-content:center; align-items:baseline; gap:8px; font-size:22px; font-weight:800; }
.v-eq .res { color:var(--mint-deep); }
.v-eq .unit { font-size:13px; font-weight:800; color:var(--ink-soft); }
.v-notes { margin-top:8px; font-size:11.5px; font-weight:700; line-height:1.55; color:var(--ink-soft); text-align:center; }
.v-notes b { color:var(--ink); }
.v-notes .warn { color:var(--red); }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
.vq.show .v-eq { animation:pop .3s .15s both; }
.vq.show .v-notes { animation:fade .4s .8s both; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>果凍同樂會</small>如如邀請 3 個好朋友到家裡，她準備了 12 個果凍。如如和 3 個好朋友，一個人可以平分到幾個果凍？</p>
  </div>
  <div class="card">
    <!-- 日系繪本靜態場景：上排 4 個人（如如＋3 位好朋友）各有一個小盤子，下排 12 個果凍 -->
    <svg class="scene-svg" viewBox="0 0 360 198" role="img" aria-label="場景：如如和 3 個好朋友共 4 個人，桌上放著 12 個果凍">
      <!-- 四個人 -->
      <g>
        <!-- 如如（綠衣＋蝴蝶結） -->
        <circle cx="60" cy="42" r="17" fill="#ffe3c9" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M46 36 Q60 26 74 36 L74 32 Q60 22 46 32 Z" fill="#5b4636" stroke="none"/>
        <path d="M70 30 l7 -5 -1 7 6 2 -7 3 Z" fill="var(--red)" stroke="none"/>
        <circle cx="54" cy="42" r="1.8" fill="var(--ink)"/>
        <circle cx="66" cy="42" r="1.8" fill="var(--ink)"/>
        <path d="M55 48 Q60 52 65 48" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="49" y="59" width="22" height="16" rx="8" fill="var(--mint)" stroke="var(--mint-deep)" stroke-width="1.4"/>
        <text x="60" y="88" class="t-name">如如</text>
        <!-- 好朋友 1（檸檬衣） -->
        <circle cx="140" cy="42" r="17" fill="#ffe3c9" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M126 34 Q140 24 154 34 L154 30 Q140 20 126 30 Z" fill="#3d3a34" stroke="none"/>
        <circle cx="134" cy="42" r="1.8" fill="var(--ink)"/>
        <circle cx="146" cy="42" r="1.8" fill="var(--ink)"/>
        <path d="M135 48 Q140 52 145 48" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="129" y="59" width="22" height="16" rx="8" fill="var(--lemon)" stroke="#d9a83f" stroke-width="1.4"/>
        <text x="140" y="88" class="t-name">好朋友</text>
        <!-- 好朋友 2（粉衣） -->
        <circle cx="220" cy="42" r="17" fill="#ffe3c9" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M206 36 Q214 26 222 30 Q232 26 234 36 Q226 32 220 34 Q214 32 206 36 Z" fill="#6b4a3a" stroke="none"/>
        <circle cx="214" cy="42" r="1.8" fill="var(--ink)"/>
        <circle cx="226" cy="42" r="1.8" fill="var(--ink)"/>
        <path d="M215 48 Q220 52 225 48" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="209" y="59" width="22" height="16" rx="8" fill="var(--pink)" stroke="#d67a8c" stroke-width="1.4"/>
        <text x="220" y="88" class="t-name">好朋友</text>
        <!-- 好朋友 3（紫衣） -->
        <circle cx="300" cy="42" r="17" fill="#ffe3c9" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M286 36 Q292 26 300 28 Q308 26 314 36 Q306 30 300 32 Q294 30 286 36 Z" fill="#2f2f2f" stroke="none"/>
        <circle cx="294" cy="42" r="1.8" fill="var(--ink)"/>
        <circle cx="306" cy="42" r="1.8" fill="var(--ink)"/>
        <path d="M295 48 Q300 52 305 48" fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="289" y="59" width="22" height="16" rx="8" fill="var(--grape)" stroke="#8d7bc4" stroke-width="1.4"/>
        <text x="300" y="88" class="t-name">好朋友</text>
        <!-- 四個小盤子 -->
        <ellipse cx="60"  cy="96" rx="20" ry="6" fill="#fff" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <ellipse cx="140" cy="96" rx="20" ry="6" fill="#fff" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <ellipse cx="220" cy="96" rx="20" ry="6" fill="#fff" stroke="var(--ink-soft)" stroke-width="1.3"/>
        <ellipse cx="300" cy="96" rx="20" ry="6" fill="#fff" stroke="var(--ink-soft)" stroke-width="1.3"/>
      </g>
      <line x1="18" y1="110" x2="342" y2="110" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 5"/>
      <!-- 12 個果凍：6 欄 × 2 排 -->
      <g id="jellies">
        <g transform="translate(38,130)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(97,130)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(156,130)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--lemon)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(215,130)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--grape)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(274,130)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(333,130)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(38,160)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--lemon)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(97,160)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--grape)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(156,160)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(215,160)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(274,160)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--lemon)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
        <g transform="translate(333,160)"><path d="M-9 0 Q-9 -11 0 -11 Q9 -11 9 0 Z" fill="var(--grape)" stroke="var(--ink)" stroke-width="1.4"/><path d="M-10 0 L10 0 L7 8 L-7 8 Z" fill="#fffdf8" stroke="var(--ink)" stroke-width="1.3"/></g>
      </g>
      <text x="180" y="190" class="t-caption">桌上放了 12 個果凍</text>
    </svg>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action"><button class="check-btn" onclick="check()">檢查答案</button></div>
  <div class="result-banner" id="banner"></div>
  <div class="vq" id="vq" aria-live="polite">
    <div class="v-eq"><span>12</span><span>÷</span><span>4</span><span>=</span><span class="res">3</span><span class="unit">（個）</span></div>
    <p class="v-notes">平分的對象不只是 3 個好朋友，<span class="warn">還要加上如如自己</span>：<br><b>3 ＋ 1 ＝ 4 個人</b>，12 個果凍平分給 4 人，<br>每人分到 <b>12 ÷ 4 ＝ 3 個</b>果凍。</p>
  </div>
</div>
<script src="../js/audio_manager.js"></script>
<script>
(function () {
  'use strict';
  var CHOICES = ['3 個', '4 個', '6 個', '12 個'];
  var ANSWER = 0;
  var picked = -1;
  var optBox = document.getElementById('opts');
  var banner = document.getElementById('banner');
  var vq = document.getElementById('vq');
  function say(text) { if (window.AudioManager && typeof window.AudioManager.play === 'function') window.AudioManager.play(text); }
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; vq.classList.remove('show'); }
  window.check = function () {
    if (picked < 0) return { ok: false, picked: picked, msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！12 ÷ 4 = 3，一個人可以分到 3 個果凍。';
      vq.classList.add('show');
      say('答對！12 除以 4 等於 3，一個人可以分到 3 個果凍。');
      return { ok: true, picked: picked };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想看：平分果凍的人，除了 3 個好朋友，還有如如自己喔！先算出一共有幾個人。';
    say('再想想看：平分果凍的人，除了 3 個好朋友，還有如如自己喔！先算出一共有幾個人。');
    return { ok: false, picked: picked };
  };
  window.__q = { id: 'G2-N-2-9-Q01', answer: 0 };
})();
</script>
</body>
</html>
