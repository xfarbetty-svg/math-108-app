<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>035 繪本插畫 × 028 純向量微教具融合示範</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #7a756b;
  --mint: #7bc9b2;
  --mint-deep: #2a7e65;
  --lemon: #ffd166;
  --line: #f0e7da;
  --bg: #fff9f0;
  --paper: #fffdf8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 6px 8px 8px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap {
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 10px;
  box-shadow: 0 6px 18px rgba(120,90,40,.08);
}
.stem {
  font-size: 13.5px;
  font-weight: 800;
  line-height: 1.35;
}
.stem small {
  display: inline-block;
  background: #eef7f4;
  color: var(--mint-deep);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10.5px;
  font-weight: 800;
  margin-right: 4px;
}
/* 035 融合舞台：以 035 教室插畫作為情境底圖，中央置入精確純 SVG 鐘面 */
.stage {
  position: relative;
  width: 100%;
  height: 160px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
}
.stage-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 30%;
  filter: brightness(0.92) contrast(1.05);
}
.stage-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(255,255,255,0.45) 0%, rgba(255,249,240,0.3) 100%);
  backdrop-filter: blur(1.5px);
}
.scene-svg {
  position: relative;
  z-index: 2;
  display: block;
  width: 100%;
  height: 100%;
}
.t-caption { font-size: 11px; font-weight: 800; fill: var(--ink); text-anchor: middle; }
.t-num { font-size: 10px; font-weight: 800; fill: var(--ink-soft); text-anchor: middle; }
.opts {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 6px 4px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  transition: all .15s;
}
.opt-btn.sel {
  border-color: var(--mint-deep);
  background: #eafaf4;
}
.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 6px 24px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(42,126,101,.3);
  cursor: pointer;
}
.tools {
  display: flex;
  justify-content: center;
  margin-top: 4px;
}
.tool-btn {
  border: 1.5px solid var(--mint-deep);
  background: #eafaf4;
  color: var(--mint-deep);
  border-radius: 999px;
  padding: 4px 14px;
  font-size: 11.5px;
  font-weight: 800;
  cursor: pointer;
}
.status {
  text-align: center;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--ink-soft);
  margin-top: 2px;
}
.status b { color: var(--ink); }
#hlG { opacity: 0; transition: opacity .35s; }
.zoomed #hlG { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <p class="stem"><small>035 繪本插畫 × 向量教具融合</small>教室的牆上掛著時鐘，時針在 3 和 4 之間，分針走了 9 大格又 2 小格，現在是幾時幾分？</p>
  </div>
  
  <div class="card">
    <!-- 035 背景插畫 + 028 精確純 SVG 鐘面融合舞台 -->
    <div class="stage" id="stage">
      <img src="../assets/demo/bg_classroom.webp" class="stage-bg" alt="035 日系教室背景">
      <div class="stage-overlay"></div>
      
      <svg class="scene-svg" id="scene" viewBox="0 0 360 160">
        <!-- 教室時鐘外框（木質與陰影） -->
        <circle cx="180" cy="80" r="74" fill="rgba(255,253,248,0.92)" stroke="#5c4328" stroke-width="5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.18))"/>
        <circle cx="180" cy="80" r="70" fill="#fffdf8" stroke="#f0e7da" stroke-width="1.5"/>
        
        <!-- 高亮大格與小格動態層 -->
        <g id="hlG">
          <path id="arcBig" fill="none" stroke="#ffd166" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
          <path id="arcSmall" fill="none" stroke="#ff6b6b" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
        </g>
        
        <!-- 刻度與數字 -->
        <g id="ticks"></g>
        <g id="nums"></g>
        
        <!-- 零誤差指針：時針 (3 時 47 分) 與分針 (47 分) -->
        <g id="hands">
          <line id="hourHand" x1="180" y1="80" x2="180" y2="44" stroke="#2a7e65" stroke-width="5" stroke-linecap="round"/>
          <line id="minHand" x1="180" y1="80" x2="180" y2="22" stroke="#3d3a34" stroke-width="3" stroke-linecap="round"/>
          <circle cx="180" cy="80" r="5" fill="#ffd166" stroke="#3d3a34" stroke-width="2"/>
        </g>
      </svg>
    </div>
    
    <div class="tools">
      <button type="button" class="tool-btn" id="tool">點亮分針刻度 ✨ (9 大格 + 2 小格)</button>
    </div>
    <p class="status" id="status">觀察教室時鐘：時針在 3 和 4 之間，分針指在 47 分</p>
  </div>
  
  <div class="opts">
    <button class="opt-btn sel" type="button">3 時 47 分</button>
    <button class="opt-btn" type="button">4 時 47 分</button>
    <button class="opt-btn" type="button">3 時 9 分</button>
    <button class="opt-btn" type="button">4 時 11 分</button>
  </div>
  
  <div class="footer-action">
    <button class="check-btn" type="button">檢查答案</button>
  </div>
</div>

<script>
(function() {
  var CX = 180, CY = 80, R = 64;
  function polar(deg, r) {
    var rad = (deg - 90) * Math.PI / 180;
    return [CX + r * Math.cos(rad), CY + r * Math.sin(rad)];
  }
  var ticks = document.getElementById('ticks');
  var nums = document.getElementById('nums');
  var NS = 'http://www.w3.org/2000/svg';
  
  for (var i = 0; i < 60; i++) {
    var deg = i * 6;
    var isBig = (i % 5 === 0);
    var p1 = polar(deg, R);
    var p2 = polar(deg, R - (isBig ? 7 : 3.5));
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', p1[0]); l.setAttribute('y1', p1[1]);
    l.setAttribute('x2', p2[0]); l.setAttribute('y2', p2[1]);
    l.setAttribute('stroke', isBig ? '#3d3a34' : '#b0a99f');
    l.setAttribute('stroke-width', isBig ? 2 : 1);
    ticks.appendChild(l);
  }
  for (var h = 1; h <= 12; h++) {
    var pos = polar(h * 30, R - 14);
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', pos[0]); t.setAttribute('y', pos[1] + 3.5);
    t.setAttribute('class', 't-num');
    t.textContent = h;
    nums.appendChild(t);
  }
  
  // 9 大格黃弧 + 2 小格紅弧
  var b0 = polar(0, R + 2), b1 = polar(270, R + 2);
  document.getElementById('arcBig').setAttribute('d', 'M' + b0[0] + ' ' + b0[1] + ' A' + (R+2) + ' ' + (R+2) + ' 0 1 1 ' + b1[0] + ' ' + b1[1]);
  var s0 = polar(270, R + 2), s1 = polar(282, R + 2);
  document.getElementById('arcSmall').setAttribute('d', 'M' + s0[0] + ' ' + s0[1] + ' A' + (R+2) + ' ' + (R+2) + ' 0 0 1 ' + s1[0] + ' ' + s1[1]);
  
  // 3 時 47 分指針旋轉
  document.getElementById('hourHand').setAttribute('transform', 'rotate(' + (3 * 30 + 47 / 60 * 30).toFixed(1) + ' ' + CX + ' ' + CY + ')');
  document.getElementById('minHand').setAttribute('transform', 'rotate(282 ' + CX + ' ' + CY + ')');
  
  var tool = document.getElementById('tool');
  var stage = document.getElementById('stage');
  var status = document.getElementById('status');
  var on = false;
  tool.addEventListener('click', function() {
    on = !on;
    stage.classList.toggle('zoomed', on);
    status.innerHTML = on ? '動態高亮：黃色 <b>9 大格＝45 分</b>，紅色 <b>再加 2 小格＝47 分</b>！' : '觀察教室時鐘：時針在 3 和 4 之間，分針指在 47 分';
  });
})();
</script>
</body>
</html>
