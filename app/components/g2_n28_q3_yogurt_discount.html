<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G2-N-2-8-Q03 優酪乳特價省錢記</title>
<style>
:root {
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --mint-deep: #318a70;
  --line: #f0e7da;
  --bg: #fff9f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 8px 10px 10px;
  max-width: 100vw;
  overflow-x: hidden;
}
.wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 10px;
  box-shadow: 0 6px 18px rgba(120, 90, 40, 0.08);
}
.stem { font-size: 14.5px; font-weight: 800; line-height: 1.35; }
.stem small { display: block; font-size: 10.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }

.market { text-align: center; }
.market-title { font-size: 11px; font-weight: 900; color: #0e7490; letter-spacing: 2px; margin-bottom: 2px; }
.market-stage { display: flex; justify-content: center; }
.market-line { font-size: 13.5px; font-weight: 900; color: #0e7490; margin-top: 2px; min-height: 17px; }
.flip-btn {
  margin-top: 3px;
  border: 2px solid #0e7490;
  background: #fff;
  color: #0e7490;
  border-radius: 999px;
  padding: 3px 14px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.15s;
}
.flip-btn:active { transform: scale(0.94); }
.mode-label { display: inline-block; margin-left: 8px; border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 900; background: #cffafe; color: #0e7490; }

.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.opt-btn {
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 10px;
  padding: 8px 6px;
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.opt-btn.sel { border-color: var(--mint-deep); background: #eafaf4; color: var(--mint-deep); }

.footer-action { text-align: center; }
.check-btn {
  border: none;
  border-radius: 999px;
  padding: 8px 30px;
  font-size: 14px;
  font-weight: 800;
  background: var(--mint-deep);
  color: #fff;
  box-shadow: 0 4px 10px rgba(49, 138, 112, 0.3);
  cursor: pointer;
}
.result-banner {
  display: none;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
}
.result-banner.success { display: block; background: #dcfce7; color: #166534; }
.result-banner.fail { display: block; background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card market">
    <p class="stem"><small>114-1 永安 期末 五、(3)</small>一瓶優酪乳原價 45 元，今天特價 40 元，爸爸買了 6 瓶，共便宜了多少元？</p>
    <div class="market-title">✦ 超市特價標籤機 ✦</div>
    <div class="market-stage" id="market-stage"></div>
    <div class="market-line" id="market-line"></div>
    <div>
      <button type="button" class="flip-btn" id="flip">收進省下銅板</button>
      <span class="mode-label" id="mode-label">目前：看標價</span>
    </div>
  </div>
  <div class="opts" id="opts"></div>
  <div class="footer-action">
    <button class="check-btn" onclick="check()">檢查答案</button>
  </div>
  <div class="result-banner" id="banner"></div>
</div>
<script>
(function () {
  'use strict';
  var CHOICES = ['30 元', '5 元', '240 元', '270 元'];
  var ANSWER = 0;
  var picked = -1;
  var revealed = false;

  var stage = document.getElementById('market-stage');
  var line = document.getElementById('market-line');
  var flipBtn = document.getElementById('flip');
  var modeLabel = document.getElementById('mode-label');

  function bottle(x, y) {
    var s = '';
    s += '<rect x="' + (x + 8) + '" y="' + (y - 2) + '" width="8" height="12" rx="2" fill="#93c5fd" stroke="#1e40af" stroke-width="1"/>';
    s += '<rect x="' + x + '" y="' + y + '" width="24" height="38" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>';
    s += '<rect x="' + (x + 4) + '" y="' + (y + 12) + '" width="16" height="14" rx="2" fill="#fff" stroke="#93c5fd" stroke-width="1"/>';
    return s;
  }

  function marketSVG(isRevealed) {
    var s = '<svg width="316" height="150" viewBox="0 0 316 150">';
    /* 貨架：6 瓶優酪乳 */
    s += '<rect x="10" y="96" width="296" height="6" rx="3" fill="#d6d3d1"/>';
    for (var i = 0; i < 6; i++) {
      var x = 16 + i * 50;
      s += bottle(x, 58);
      s += '<text x="' + (x + 12) + '" y="112" font-size="9.5" font-weight="900" text-anchor="middle" fill="#1e40af">45→40</text>';
      if (isRevealed) {
        s += '<circle cx="' + (x + 12) + '" cy="126" r="8" fill="#fde047" stroke="#a16207" stroke-width="1.5"/>';
        s += '<text x="' + (x + 12) + '" y="130" font-size="9" font-weight="900" text-anchor="middle" fill="#713f12">5</text>';
      } else {
        s += '<text x="' + (x + 12) + '" y="130" font-size="9" font-weight="900" text-anchor="middle" fill="#a8a29e">?</text>';
      }
    }
    if (!isRevealed) {
      s += '<text x="158" y="22" font-size="11" font-weight="900" text-anchor="middle" fill="#64748b">每瓶 45 元降到 40 元，一瓶省幾元？</text>';
      s += '<text x="158" y="146" font-size="10" font-weight="900" text-anchor="middle" fill="#64748b">先算一瓶省多少，再想 6 瓶</text>';
    } else {
      s += '<text x="158" y="22" font-size="11" font-weight="900" text-anchor="middle" fill="#b45309">每瓶省：45−40＝5 元，6 瓶就是 6 個 5</text>';
      /* 儲蓄罐 */
      s += '<rect x="236" y="96" width="70" height="34" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>';
      s += '<rect x="266" y="90" width="14" height="6" rx="2" fill="#b45309"/>';
      s += '<text x="271" y="117" font-size="11" font-weight="900" text-anchor="middle" fill="#7c2d12">30 元</text>';
      s += '<rect x="14" y="96" width="212" height="16" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>';
      s += '<text x="120" y="108" font-size="10.5" font-weight="900" text-anchor="middle" fill="#065f46">5 元 × 6 瓶 ＝ 30 元</text>';
      s += '<text x="120" y="146" font-size="10" font-weight="900" text-anchor="middle" fill="#3d3a34">共便宜了 30 元</text>';
    }
    s += '</svg>';
    return s;
  }

  function render() {
    stage.innerHTML = marketSVG(revealed);
    if (revealed) {
      line.textContent = '先減：45−40＝5（元／瓶）→ 再乘：5×6＝30';
      modeLabel.textContent = '目前：已收進銅板';
      flipBtn.textContent = '再看標價';
    } else {
      line.textContent = '每瓶 45 元降到 40 元';
      modeLabel.textContent = '目前：看標價';
      flipBtn.textContent = '收進省下銅板';
    }
  }

  flipBtn.addEventListener('click', function () { revealed = !revealed; render(); hide(); });

  var optBox = document.getElementById('opts');
  CHOICES.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'opt-btn';
    b.type = 'button';
    b.textContent = c;
    b.addEventListener('click', function () {
      picked = i;
      Array.prototype.forEach.call(optBox.children, function (el) { el.classList.remove('sel'); });
      b.classList.add('sel');
      hide();
    });
    optBox.appendChild(b);
  });

  var banner = document.getElementById('banner');
  function hide() { banner.className = 'result-banner'; banner.textContent = ''; }

  window.check = function () {
    if (picked < 0) return { ok: false, answer: '', msg: '請先選一個答案' };
    if (picked === ANSWER) {
      banner.className = 'result-banner success';
      banner.textContent = '答對！先算每瓶省 45−40＝5 元，再算 5×6＝30 元。';
      return { ok: true, answer: CHOICES[picked] };
    }
    banner.className = 'result-banner fail';
    banner.textContent = '再想想：題目問「便宜多少」——先算每瓶差價 45−40＝5，再乘 6 瓶，不是算全部的錢。';
    return { ok: false, answer: CHOICES[picked] };
  };

  window.__q = { id: 'G2-N-2-8-Q03', correct_index: ANSWER, choices: CHOICES };

  render();
})();
</script>
</body>
</html>
