<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>N-3-1 一萬以內的數具象實驗室</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --success: #27ae60;
            --fail: #e74c3c;
            --bg: #f8f9fa;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: #fff;
            color: var(--primary);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px;
            height: 100vh;
        }
        #container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .source-tag {
            font-size: 10px;
            color: #95a5a6;
            text-align: right;
            letter-spacing: 0.5px;
        }
        .stem-box {
            background: #ecf0f1;
            border-left: 4px solid var(--accent);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            font-weight: 500;
        }
        .stage-area {
            background: var(--bg);
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
        }
        /* Q1 & General PV Table */
        .pv-table {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            width: 100%;
            margin-bottom: 6px;
        }
        .pv-cell {
            background: #fff;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            text-align: center;
            padding: 4px 2px;
        }
        .pv-label {
            font-size: 11px;
            color: #7f8c8d;
            font-weight: bold;
            border-bottom: 1px dashed #eee;
            padding-bottom: 2px;
            margin-bottom: 4px;
        }
        .pv-slot {
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .blk1000 {
            width: 28px;
            height: 28px;
            background: #27ae60;
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }
        .rod10 {
            width: 8px;
            height: 38px;
            background: #e67e22;
            border-radius: 2px;
        }
        .ghost-zero {
            font-size: 11px;
            color: #bdc3c7;
            border: 1px dashed #bdc3c7;
            border-radius: 3px;
            padding: 4px;
        }
        .formula-line {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
            margin-top: 4px;
            min-height: 18px;
        }
        .act-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(41,128,185,0.3);
            margin: 4px 0;
        }
        .act-btn:active { transform: scale(0.96); }

        /* Q2 Digit Board */
        .digit-board { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
        .digit-tile {
            background: #fff; border: 2px solid #bdc3c7; border-radius: 6px;
            width: 65px; height: 75px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .digit-tile.active { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        .dnum { font-size: 26px; font-weight: bold; color: var(--primary); }
        .dlabel { font-size: 10px; color: #7f8c8d; }
        .dval { font-size: 9px; color: var(--accent); }

        /* Q3 Car Train */
        .train-row { display: flex; gap: 4px; align-items: center; justify-content: center; width: 100%; overflow-x: auto; padding: 6px 0; }
        .car {
            background: #34495e; color: #fff; padding: 6px 6px; border-radius: 4px;
            font-size: 11px; font-weight: bold; min-width: 44px; text-align: center;
            border-bottom: 3px solid #e74c3c;
        }
        .car.fill { background: #2980b9; }

        /* Q4 Word Cards */
        .word-group { display: flex; gap: 6px; margin: 8px 0; }
        .word-btn {
            background: #fff; border: 1px solid #3498db; color: #3498db;
            padding: 6px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer;
        }

        /* Q5 Cmp Row */
        .cmp-row { display: flex; gap: 16px; justify-content: center; margin: 10px 0; }
        .cmp-num {
            background: #fff; border: 1px solid #ccc; border-radius: 6px;
            padding: 8px 12px; font-size: 22px; font-weight: bold; letter-spacing: 2px;
        }
        .cmp-num span.hot { color: #e74c3c; text-decoration: underline; }

        /* Q6 Card Slots */
        .card-row { display: flex; gap: 6px; margin: 8px 0; }
        .num-card {
            background: #f39c12; color: #fff; width: 34px; height: 42px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;
        }
        .slot-row { display: flex; gap: 6px; margin: 6px 0; }
        .card-slot {
            width: 44px; height: 44px; border: 2px dashed #95a5a6; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; background: #fff;
        }

        /* Q7 Coin Area */
        .coin-area { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 6px 0; }
        .coin-k { background: #27ae60; color: #fff; border-radius: 3px; font-size: 10px; font-weight: bold; padding: 4px 6px; }
        .coin-h { background: #e74c3c; color: #fff; border-radius: 3px; font-size: 10px; font-weight: bold; padding: 4px 6px; }
        .coin-t { background: #f39c12; color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .coin-o { background: #95a5a6; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }

        /* Q8 Diff Calc */
        .diff-calc { font-size: 18px; font-weight: bold; font-family: monospace; text-align: center; line-height: 1.6; }

        /* Q9 Rule Input */
        .rule-row { display: flex; gap: 4px; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; }
        .rule-input { width: 50px; text-align: center; border: 1px solid #3498db; border-radius: 3px; padding: 2px; font-weight: bold; }

        /* Q10 Carry Box */
        .carry-box { background: #fffbe6; border: 1px solid #ffe58f; padding: 6px 10px; border-radius: 4px; font-size: 11px; width: 100%; text-align: center; line-height: 1.5; }

        /* Options & Check */
        .opt-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 4px;
        }
        .opt-grid.single-col {
            grid-template-columns: 1fr;
        }
        .opt-btn {
            background: #fff;
            border: 1.5px solid #dcdde1;
            padding: 8px 6px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--primary);
            cursor: pointer;
            text-align: center;
        }
        .opt-btn.active {
            border-color: var(--accent);
            background: #ebf5fb;
            color: var(--accent);
            font-weight: bold;
        }
        .result-banner {
            font-size: 11px;
            line-height: 1.3;
            padding: 6px 8px;
            border-radius: 4px;
            text-align: center;
            display: none;
            margin-top: 4px;
        }
        .result-banner.success { display: block; background: #e8f8f5; color: #27ae60; border: 1px solid #a3e4d7; }
        .result-banner.fail { display: block; background: #fdedec; color: #e74c3c; border: 1px solid #f5b7b1; }
    </style>
</head>
<body>

<div id="container">
    <div class="source-tag" id="srcTag">真題來源：載入中...</div>
    <div class="stem-box" id="stemBox">題目載入中...</div>
    
    <div class="stage-area" id="stageArea">
        <!-- 動態教具渲染區 -->
    </div>
    
    <div class="result-banner" id="resultBanner"></div>
    <div class="opt-grid" id="optGrid"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const qnum = parseInt(urlParams.get('q') || '1', 10);
    const $ = id => document.getElementById(id);
    let selectedAnswer = null;

    const DATA = {
        1: {
            source: '高雄市永安國小 114-1 期中 · 一、是非題 · 第 1 題',
            stem: '判斷是非：5 個千和 3 個十合起來是 5030。',
            opts: ['⭕ 對', '❌ 錯'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="pv-table">
                        <div class="pv-cell"><div class="pv-label">千位</div><div class="pv-slot" id="slotK"></div></div>
                        <div class="pv-cell"><div class="pv-label">百位</div><div class="pv-slot"><div class="ghost-zero">0 占位</div></div></div>
                        <div class="pv-cell"><div class="pv-label">十位</div><div class="pv-slot" id="slotT"></div></div>
                        <div class="pv-cell"><div class="pv-label">個位</div><div class="pv-slot"><div class="ghost-zero">0 占位</div></div></div>
                    </div>
                    <button class="act-btn" onclick="expandFormula()">展開位值算式 ▶</button>
                    <div class="formula-line" id="formulaLine"></div>`;
                for(let i=0; i<5; i++) $('slotK').innerHTML += '<div class="blk1000">1000</div>';
                for(let i=0; i<3; i++) $('slotT').innerHTML += '<div class="rod10"></div>';
            },
            action() {
                $('formulaLine').innerHTML = '5000 ＋ 0 ＋ 30 ＋ 0 ＝ 5030';
            }
        },
        2: {
            source: '高雄市永安國小 114-1 期中 · 二、選擇題 · 第 1 題',
            stem: '阿姨在網路上團購肉乾，一共花了 2356 元。千位數字和百位數字合起來是多少？',
            opts: ['5', '7', '9', '11'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="digit-board">
                        <div class="digit-tile" id="tileK" onclick="liftDigit('K')"><span class="dnum">2</span><span class="dlabel">千位</span><span class="dval">代表 2000</span></div>
                        <div class="digit-tile" id="tileH" onclick="liftDigit('H')"><span class="dnum">3</span><span class="dlabel">百位</span><span class="dval">代表 300</span></div>
                        <div class="digit-tile"><span class="dnum">5</span><span class="dlabel">十位</span><span class="dval">代表 50</span></div>
                        <div class="digit-tile"><span class="dnum">6</span><span class="dlabel">個位</span><span class="dval">代表 6</span></div>
                    </div>
                    <div class="formula-line" id="q2Formula">點擊「千位」與「百位」數字</div>`;
            },
            action(target) {
                if(target === 'K') $('tileK').classList.toggle('active');
                if(target === 'H') $('tileH').classList.toggle('active');
                $('q2Formula').innerHTML = '題目問「數字」相加：千位數字 2 ＋ 百位數字 3 ＝ <b>5</b>！';
            }
        },
        3: {
            source: '高雄市永安國小 114-1 期中 · 三、填填看 · 第 1 題',
            stem: '按照數的順序填填看：495 ➔ ( ) ➔ 505 ➔ ( ) ➔ ( ) ➔ ( ) ➔ 525',
            opts: ['500、510、515、520', '496、506、516、521', '500、506、512、518', '490、500、510、520'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="train-row">
                        <div class="car">495</div><div style="font-size:10px">➔</div>
                        <div class="car fill" id="c1">?</div><div style="font-size:10px">➔</div>
                        <div class="car">505</div><div style="font-size:10px">➔</div>
                        <div class="car fill" id="c2">?</div><div style="font-size:10px">➔</div>
                        <div class="car fill" id="c3">?</div><div style="font-size:10px">➔</div>
                        <div class="car fill" id="c4">?</div><div style="font-size:10px">➔</div>
                        <div class="car">525</div>
                    </div>
                    <button class="act-btn" onclick="fillCars()">發動小車 (規律 ＋5) ▶</button>
                    <div class="formula-line" id="q3Formula">觀察相鄰兩數規律</div>`;
            },
            action() {
                $('c1').innerText = '500'; $('c2').innerText = '510'; $('c3').innerText = '515'; $('c4').innerText = '520';
                $('q3Formula').innerHTML = '規律是「每次加 5」：495 跨整百進位到 500！';
            }
        },
        4: {
            source: '高雄市永安國小 114-1 期中 · 三、填填看 · 第 3 題',
            stem: '「八千零六」記作什麼？',
            opts: ['8006', '8060', '8600', '806'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="word-group">
                        <button class="word-btn" onclick="placeWord('K')">八千</button>
                        <button class="word-btn" onclick="placeWord('Z')">零</button>
                        <button class="word-btn" onclick="placeWord('O')">六</button>
                    </div>
                    <div class="pv-table">
                        <div class="pv-cell"><div class="pv-label">千</div><div class="pv-slot" id="wK">-</div></div>
                        <div class="pv-cell"><div class="pv-label">百</div><div class="pv-slot" id="wH">-</div></div>
                        <div class="pv-cell"><div class="pv-label">十</div><div class="pv-slot" id="wT">-</div></div>
                        <div class="pv-cell"><div class="pv-label">個</div><div class="pv-slot" id="wO">-</div></div>
                    </div>
                    <div class="formula-line" id="q4Formula">點字卡放入位值表</div>`;
            },
            action(target) {
                if(target === 'K') $('wK').innerText = '8';
                if(target === 'Z') { $('wH').innerText = '0'; $('wT').innerText = '0'; }
                if(target === 'O') $('wO').innerText = '6';
                $('q4Formula').innerHTML = '讀作一個「零」，百位與十位都要用 0 占位 ➔ <b>8006</b>';
            }
        },
        5: {
            source: '高雄市永安國小 114-1 期中 · 六、比大小 · 第 1、2 題',
            stem: '四位數大小比較：(1) 4388 與 4368 哪一個比較小？ (2) 6008、5999、6100 哪一個最大？',
            opts: ['(1) 4368 比較小；(2) 6100 最大', '(1) 4388 比較小；(2) 6008 最大', '(1) 4368 比較小；(2) 5999 最大', '(1) 4388 比較小；(2) 6100 最大'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="cmp-row">
                        <div class="cmp-num">4 3 <span id="d1">8</span> 8</div>
                        <div style="font-size:20px; align-self:center">vs</div>
                        <div class="cmp-num">4 3 <span id="d2">6</span> 8</div>
                    </div>
                    <button class="act-btn" onclick="cmpStep()">從高位開始比 ▶</button>
                    <div class="formula-line" id="q5Formula">千位 4=4，百位 3=3...</div>`;
            },
            action() {
                $('d1').classList.add('hot'); $('d2').classList.add('hot');
                $('q5Formula').innerHTML = '比到十位：8 ＞ 6 ➔ <b>4368 比較小</b>！';
            }
        },
        6: {
            source: '臺北市內湖國小 114-1 期中 · 二、填填看 · 第 3 題',
            stem: '用 0、7、2、8 四個數字排成四位數，排成的「最大四位數」是多少？「最小四位數」是多少？',
            opts: ['最大是 8720，最小是 2078', '最大是 8720，最小是 0278', '最大是 8720，最小是 2087', '最大是 8702，最小是 2078'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="card-row">
                        <div class="num-card">0</div><div class="num-card">7</div><div class="num-card">2</div><div class="num-card">8</div>
                    </div>
                    <div class="slot-row" id="slots">
                        <div class="card-slot">千</div><div class="card-slot">百</div><div class="card-slot">十</div><div class="card-slot">個</div>
                    </div>
                    <button class="act-btn" onclick="arrangeCards()">排排看演示 ▶</button>
                    <div class="formula-line" id="q6Formula">注意：最小四位數千位不能是 0！</div>`;
            },
            action() {
                $('slots').innerHTML = `
                    <div class="card-slot" style="background:#d5f5e3">2</div>
                    <div class="card-slot">0</div>
                    <div class="card-slot">7</div>
                    <div class="card-slot">8</div>`;
                $('q6Formula').innerHTML = '最大由大排到小 8720；最小千位選 2 ➔ <b>2078</b>！';
            }
        },
        7: {
            source: '臺北市內湖國小 114-1 期中 · 二、填填看 · 第 6 題',
            stem: '小明存錢筒裡有 8 張千元鈔、14 張百元鈔、7 個十元硬幣和 3 個一元硬幣，合起來是多少元？',
            opts: ['9473 元', '81473 元', '8147 元', '9470 元'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="coin-area" id="coinArea">
                        <div class="coin-k">8張千 (8000)</div>
                        <div class="coin-h">14張百 (1400)</div>
                        <div class="coin-t">70</div>
                        <div class="coin-o">3</div>
                    </div>
                    <button class="act-btn" onclick="sumCoins()">滿十進千動畫 ▶</button>
                    <div class="formula-line" id="q7Formula">14張百元 ＝ 1張千元 ＋ 4張百元</div>`;
            },
            action() {
                $('coinArea').innerHTML = `
                    <div class="coin-k" style="background:#1e8449">9張千 (9000)</div>
                    <div class="coin-h">4張百 (400)</div>
                    <div class="coin-t">70</div>
                    <div class="coin-o">3</div>`;
                $('q7Formula').innerHTML = '8000 ＋ 1400 ＋ 70 ＋ 3 ＝ <b>9473 元</b>！';
            }
        },
        8: {
            source: '臺北市內湖國小 114-1 期中 · 一、選擇題 · 第 3 題',
            stem: '把「最大的四位數」減去「最小的三位數」，算出來的答案是多少？',
            opts: ['9899', '9999', '9900', '9890'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="diff-calc">
                      最大四位數：9999<br>
                    －最小三位數： 100<br>
                    ────────────────
                    </div>
                    <button class="act-btn" onclick="calcDiff()">計算結果 ▶</button>
                    <div class="formula-line" id="q8Formula">最小三位數是 100（不是 000）</div>`;
            },
            action() {
                $('q8Formula').innerHTML = '9999 － 100 ＝ <b>9899</b>！';
            }
        },
        9: {
            source: '臺北市內湖國小 114-1 期中 · 二、填填看 · 第 4 題(2)',
            stem: '按照數的規律填填看：1980 ➔ 1990 ➔ ( 甲 ) ➔ ( 乙 ) ➔ 2020。甲和乙分別是多少？',
            opts: ['甲是 2000，乙是 2010', '甲是 1991，乙是 1992', '甲是 2000，乙是 2001', '甲是 19100，乙是 19110'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="rule-row">
                        <span>1980</span><span>➔</span>
                        <span>1990</span><span>➔</span>
                        <input class="rule-input" id="r1" value="甲"><span>➔</span>
                        <input class="rule-input" id="r2" value="乙"><span>➔</span>
                        <span>2020</span>
                    </div>
                    <button class="act-btn" onclick="findRule()">跨千位連鎖進位 ▶</button>
                    <div class="formula-line" id="q9Formula">規律：每次 ＋10</div>`;
            },
            action() {
                $('r1').value = '2000'; $('r2').value = '2010';
                $('q9Formula').innerHTML = '1990 ＋ 10 跨千位進位到 <b>2000</b>，再加 10 是 <b>2010</b>！';
            }
        },
        10: {
            source: '臺北市內湖國小 113-1 期中 · 一、選擇題 · 第 1 題',
            stem: '3 個千、8 個百、20 個十和 18 個一合起來是多少？',
            opts: ['4018', '3838', '4008', '382018'],
            ans: 0,
            render() {
                $('stageArea').innerHTML = `
                    <div class="carry-box">
                        3個千 (3000) ＋ 8個百 (800)<br>
                        ＋ 20個十 (200) ＋ 18個一 (18)
                    </div>
                    <button class="act-btn" onclick="combineCarry()">進位合體演示 ▶</button>
                    <div class="formula-line" id="q10Formula">20個十＝200，與8個百合體滿千！</div>`;
            },
            action() {
                $('q10Formula').innerHTML = '800＋200＝1000 進位！3000＋1000＋18 ＝ <b>4018</b>！';
            }
        }
    };

    const current = DATA[qnum] || DATA[1];
    $('srcTag').innerText = current.source;
    $('stemBox').innerText = current.stem;
    current.render();

    // 全域函式供 HTML onclick 調用
    window.expandFormula = () => current.action && current.action();
    window.liftDigit = (t) => current.action && current.action(t);
    window.fillCars = () => current.action && current.action();
    window.placeWord = (t) => current.action && current.action(t);
    window.cmpStep = () => current.action && current.action();
    window.arrangeCards = () => current.action && current.action();
    window.sumCoins = () => current.action && current.action();
    window.calcDiff = () => current.action && current.action();
    window.findRule = () => current.action && current.action();
    window.combineCarry = () => current.action && current.action();

    // 渲染選項
    const optGrid = $('optGrid');
    if (current.opts.length > 2 && current.opts[0].length > 10) {
        optGrid.classList.add('single-col');
    }
    current.opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => {
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedAnswer = idx;
        };
        optGrid.appendChild(btn);
    });

    // 供外層 shell 調用
    window.check = function() {
        const banner = $('resultBanner');
        if (selectedAnswer === null) {
            banner.className = 'result-banner fail';
            banner.innerText = '請先選擇一個選項再檢查！';
            return;
        }
        if (selectedAnswer === current.ans) {
            banner.className = 'result-banner success';
            banner.innerText = '🎉 答對了！算理分析正確！';
        } else {
            banner.className = 'result-banner fail';
            banner.innerText = '❌ 再想想看喔！點擊上方按鈕看看算理演示！';
        }
    };
    window.checkAnswer = window.check;
</script>

</body>
</html>
