<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>G3-N-3-3 乘以一位數多元題型教具</title>
    <style>
        :root {
            --bg: #fff9f0;
            --card: #ffffff;
            --coral: #ff8a65;
            --mint: #7bc9b2;
            --lemon: #ffd166;
            --text-dark: #333;
            --muted: #b0a08a;
            --success: #7bc9b2;
            --error: #e57373;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: auto; min-height: auto; margin: 0; padding: 0; }
        body {
            padding: 6px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 100%;
            height: auto;
            min-height: auto;
            background: transparent;
            border: none;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .header {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin: 0;
            letter-spacing: 1px;
        }
        .question-box {
            background: var(--card);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.35;
            min-height: 38px;
            display: flex;
            align-items: center;
            box-shadow: 0 6px 18px rgba(149,117,76,0.10);
            border-left: 4px solid var(--coral);
        }
        .calc-card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(149,117,76,0.10);
            padding: 4px 8px 6px;
        }
        .calc-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        svg {
            width: 100%;
            max-width: 240px;
            height: auto;
            display: block;
        }
        .digit { font-size: 23px; font-weight: 600; fill: var(--text-dark); font-family: 'Courier New', Courier, monospace; }
        .digit-reveal { font-size: 23px; font-weight: 600; fill: var(--mint); font-family: 'Courier New', Courier, monospace; }
        .digit-wrong { font-size: 23px; font-weight: 600; fill: var(--error); font-family: 'Courier New', Courier, monospace; }
        .op { font-size: 21px; fill: var(--text-dark); }
        .grid-line { stroke: #e8ddcc; stroke-width: 1; stroke-dasharray: 2 3; }
        .hline { stroke: var(--text-dark); stroke-width: 2; stroke-linecap: round; }
        .place-label { font-size: 9px; fill: var(--muted); }
        .hl-rect { fill: rgba(255,138,101,0.14); stroke: var(--coral); stroke-width: 1.5; stroke-dasharray: 4 3; rx: 6; }
        .bubble-c { fill: var(--coral); }
        .bubble-t { font-size: 12px; fill: #fff; font-weight: bold; text-anchor: middle; }
        .cap { font-size: 12px; min-height: 17px; text-align: center; color: var(--coral); font-weight: bold; line-height: 1.3; }
        .expr { font-size: 17px; fill: var(--text-dark); font-weight: 600; }
        .expr-coral { font-size: 17px; fill: var(--coral); font-weight: bold; }
        .expr-reveal { font-size: 18px; fill: var(--mint); font-weight: bold; }
        .box-mark { font-size: 20px; fill: var(--coral); font-weight: bold; }
        .controls { display: flex; flex-direction: column; gap: 6px; }
        .step-btn, .check-btn {
            border: none;
            color: white;
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 3px 10px rgba(149,117,76,0.18);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .step-btn { background: linear-gradient(135deg, var(--coral), #ff9e85); }
        .check-btn { background: linear-gradient(135deg, var(--mint), #93d8c4); }
        .step-btn:active, .check-btn:active { transform: scale(0.95) translateY(1px); box-shadow: 0 1px 4px rgba(149,117,76,0.18); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .opt-btn {
            height: 36px;
            border: 2px solid #f0e6d8;
            background: var(--card);
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 2px 6px rgba(149,117,76,0.08);
        }
        .opt-btn:active { transform: scale(0.96); }
        .opt-btn.selected { border-color: var(--coral); background: #fff3ec; }
        .feedback {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 22px;
            border-radius: 999px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
        }
        .success { background: var(--mint); }
        .fail { background: var(--error); }
    </style>
</head>
<body>

<div id="app">
    <div class="header">臺北市內湖國小 ＋ 高雄市永安國小段考真題</div>
    <div class="question-box" id="qText">載入中...</div>

    <div class="calc-card">
        <div class="calc-area" id="calc-area">
            <svg id="svgCanvas" viewBox="0 0 240 150">
                <g id="drawLayer"></g>
            </svg>
        </div>
        <div class="cap" id="stepCap"></div>
    </div>

    <div class="controls">
        <button class="step-btn" onclick="nextStep()">一步一步看算理 ▶</button>
        <div class="options-grid" id="options"></div>
        <button class="check-btn" onclick="checkAnswer()">檢查答案</button>
    </div>

    <div id="feedback" class="feedback"></div>
</div>

<script>
    const QUESTIONS = {
        1:  { mode: 'pattern', stem: '觀察算式的規律：已知 9 × 7 ＝ 63，請問 900 × 7 ＝ ( ? )', correct: '6300', choices: ['6300', '630', '63000', '63'],
              cards: ['9 × 7 = 63', '90 × 7 = 630', '900 × 7 = 6300'],
              caps: ['規律起點：9 × 7 = 63（九九乘法基本題）', '被乘數 9 擴大 10 倍變 90，積也擴大 10 倍 → 630', '被乘數 9 擴大 100 倍變 900，積就擴大 100 倍 → 6300，尾巴補 2 個 0'] },
        2:  { mode: 'bar', stem: '下面哪一個算式的答案最大？（動動腦：不用算出答案喔！）', correct: '99 × 6', choices: ['99 × 6', '98 × 6', '92 × 6', '84 × 6'],
              rows: [['99 × 6', 99], ['98 × 6', 98], ['92 × 6', 92], ['84 × 6', 84]],
              caps: ['四個算式的乘數都是 6，都是「6 個一數」', '乘數相同時，被乘數越大，積就越大', '99 最大 → 99 × 6 的答案最大，完全不用計算！'] },
        3:  { mode: 'estimate', stem: '估算「29 × 5」，請選出最接近正確答案的選項：', correct: '150', choices: ['150', '100', '120', '130'],
              caps: ['估算：把 29 看成最接近的整十數 30', '用 30 × 5 = 150 估算', '所以 29 × 5 最接近 150'] },
        4:  { mode: 'debug', stem: '小明在直式計算 33 × 4 時，算出答案是 122，請問他哪裡算錯了？', correct: '十位忘記加個位進位的 1', choices: ['十位忘記加個位進位的 1', '個位 3×4 乘錯了', '十位 3×4 乘錯了', '百位少寫一個 1'],
              caps: ['小明的答案 122：個位 2 對了，問題出在十位！', '個位：3 × 4 = 12，寫 2 進 1（小明這步沒錯）', '十位：3 × 4 ＋ 進位的 1 = 13，小明忘記加進位才寫成 12', '正解：33 × 4 = 132'] },
        5:  { mode: 'calc', stem: '用直式算算看：309 × 3 ＝ ( ? )', a: '309', m: 3, product: '927', correct: '927', choices: ['927', '907', '972', '279'] },
        6:  { mode: 'calc', stem: '用直式算算看：125 × 8 ＝ ( ? )', a: '125', m: 8, product: '1000', correct: '1000', choices: ['1000', '960', '900', '1060'] },
        7:  { mode: 'calc', stem: '一箱運動飲料有 24 瓶，超商老闆進貨了 9 箱，一共有幾瓶運動飲料？', a: '24', m: 9, product: '216', correct: '216 瓶', choices: ['216 瓶', '206 瓶', '184 瓶', '225 瓶'],
              iconMode: 'crate', iconCap: '貨架上 9 箱飲料，每箱 24 瓶 → 求 9 個 24，列式 24 × 9' },
        8:  { mode: 'calc', stem: '一個精美鉛筆盒賣 95 元，老師買了 3 個當作期中考獎品，一共要付多少元？', a: '95', m: 3, product: '285', correct: '285 元', choices: ['285 元', '275 元', '295 元', '185 元'],
              iconMode: 'shop', iconCap: '一個鉛筆盒 95 元，買 3 個 → 求 3 個 95，列式 95 × 3' },
        9:  { mode: 'balance', stem: '在天平兩端放入算式，哪邊會比較重？在 □ 中填入正確符號：405 × 6 □ 405 × 7', correct: '＜', choices: ['＜', '＞', '＝'],
              caps: ['天平左盤：405 × 6，就是 6 個 405', '天平右盤：405 × 7，就是 7 個 405', '右邊比左邊多 1 個 405 → 右盤下沉：405 × 6 ＜ 405 × 7'] },
        10: { mode: 'calc', stem: '大雄的零用錢有 70 元，胖虎的零用錢是大雄的 3 倍，請問胖虎有多少元？', a: '70', m: 3, product: '210', correct: '210 元', choices: ['210 元', '73 元', '140 元', '270 元'],
              iconMode: 'coins', iconCap: '「3 倍」就是 3 個 70，列式 70 × 3（不是 70 ＋ 3）' }
    };

    const PLACE_CN = ['個位', '十位', '百位', '千位'];
    const PLACE_CHAR = ['個', '十', '百', '千'];

    const urlParams = new URLSearchParams(window.location.search);
    const qId = urlParams.get('q') || 1;
    const q = QUESTIONS[qId];
    let currentStep = 0;
    let selectedAns = null;

    /* 逐位直式乘法步驟引擎：由個位往高位逐位演繹，自動生成步驟說明與進位氣泡 */
    function computeSteps() {
        const steps = [];
        if (q.iconCap) steps.push({ type: 'icon', cap: q.iconCap });
        const aDigits = q.a.split('');
        let carry = 0;
        for (let p = 0; p < q.product.length; p++) {
            let digit, newCarry = 0, cap;
            if (p < aDigits.length) {
                const ad = Number(aDigits[aDigits.length - 1 - p]);
                const val = ad * q.m + carry;
                digit = val % 10;
                newCarry = Math.floor(val / 10);
                cap = `${PLACE_CN[p]}：${ad} × ${q.m} = ${val}`;
                if (val >= 10) cap += `，寫 ${digit} 進 ${newCarry}`;
            } else {
                digit = carry;
                cap = `把進位的 ${carry} 落下來`;
            }
            steps.push({ type: 'place', p, digit, carryOut: newCarry, cap, carryIn: carry });
            carry = newCarry;
        }
        return steps;
    }
    const STEPS = q.mode === 'calc' ? computeSteps() : [];

    function totalSteps() {
        return q.mode === 'calc' ? STEPS.length : q.caps.length;
    }

    function setCap() {
        const el = document.getElementById('stepCap');
        if (currentStep === 0) { el.innerText = '按「一步一步看算理」開始演繹！'; return; }
        if (q.mode === 'calc') el.innerText = STEPS[currentStep - 1].cap;
        else el.innerText = q.caps[currentStep - 1];
    }

    function init() {
        document.getElementById('qText').innerText = q.stem;
        renderOptions();
        render();
    }

    function renderOptions() {
        const container = document.getElementById('options');
        const shuffled = [...q.choices].sort(() => Math.random() - 0.5);
        container.innerHTML = '';
        shuffled.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = c;
            btn.onclick = () => {
                selectedAns = c;
                document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            };
            container.appendChild(btn);
        });
    }

    /* ===== 模式 1：規律探索卡片鏈 ===== */
    function renderPattern() {
        const layer = document.getElementById('drawLayer');
        document.getElementById('svgCanvas').setAttribute('viewBox', '0 0 240 160');
        let svg = '';
        q.cards.forEach((c, i) => {
            const y = 14 + i * 38;
            const shown = currentStep > i;
            svg += `<rect x="30" y="${y}" width="180" height="30" rx="9" fill="${shown ? '#e8f7f1' : '#ffffff'}" stroke="${shown ? '#7bc9b2' : '#f0e6d8'}" stroke-width="1.5"/>`;
            svg += `<text x="120" y="${y + 21}" text-anchor="middle" class="${shown ? 'expr-reveal' : 'expr'}" style="font-size:16px">${c}</text>`;
        });
        if (currentStep >= 3) {
            svg += `<text x="120" y="152" text-anchor="middle" class="expr-coral" style="font-size:13px">積跟著擴大 100 倍 → 尾巴補 2 個 0</text>`;
        }
        layer.innerHTML = svg;
        setCap();
    }

    /* ===== 模式 2：乘數相同條形對比（免算比大小） ===== */
    function renderBar() {
        const layer = document.getElementById('drawLayer');
        document.getElementById('svgCanvas').setAttribute('viewBox', '0 0 240 150');
        let svg = '';
        q.rows.forEach((r, i) => {
            const y = 12 + i * 28;
            svg += `<text x="8" y="${y + 15}" class="expr" style="font-size:12px">${r[0]}</text>`;
            const w = Math.round((r[1] / 99) * 78);
            svg += `<rect x="88" y="${y + 1}" width="${w}" height="18" rx="5" fill="${i === 0 ? '#ff8a65' : '#d8ccc0'}"/>`;
            svg += `<text x="${88 + w + 5}" y="${y + 15}" class="place-label" style="font-size:9px">${r[1]}</text>`;
        });
        if (currentStep >= 1) {
            svg += `<text x="120" y="132" text-anchor="middle" class="place-label" style="font-size:10px">乘數都是 6 →「6 個一數」</text>`;
        }
        if (currentStep >= 2) {
            svg += `<rect x="84" y="9" width="126" height="24" rx="7" fill="none" stroke="#ff8a65" stroke-width="2"/>`;
        }
        if (currentStep >= 3) {
            svg += `<text x="120" y="147" text-anchor="middle" class="expr-coral" style="font-size:12px">99 最大 → 99 × 6 積最大！</text>`;
        }
        layer.innerHTML = svg;
        setCap();
    }

    /* ===== 模式 3：數線估算尺 ===== */
    function renderEstimate() {
        const layer = document.getElementById('drawLayer');
        document.getElementById('svgCanvas').setAttribute('viewBox', '0 0 240 150');
        let svg = '';
        const x = v => 20 + (v - 20) * (200 / 15);
        svg += `<line x1="14" y1="40" x2="226" y2="40" class="hline" />`;
        [20, 25, 30, 35].forEach(v => {
            svg += `<line x1="${x(v)}" y1="34" x2="${x(v)}" y2="46" stroke="#8a7a66" stroke-width="1.5"/>`;
            svg += `<text x="${x(v)}" y="60" text-anchor="middle" class="place-label" style="font-size:10px">${v}</text>`;
        });
        svg += `<circle cx="${x(29)}" cy="40" r="5" fill="#ff8a65" />`;
        svg += `<text x="${x(29)}" y="24" text-anchor="middle" class="expr" style="font-size:12px">29</text>`;
        if (currentStep >= 1) {
            svg += `<path d="M ${x(29)} 40 q ${(x(30) - x(29)) / 2} -18 ${x(30) - x(29)} 0" fill="none" stroke="#7bc9b2" stroke-width="2" stroke-dasharray="4 3"/>`;
            svg += `<circle cx="${x(30)}" cy="40" r="5" fill="#7bc9b2" />`;
            svg += `<text x="${x(30)}" y="24" text-anchor="middle" class="expr-reveal" style="font-size:12px">30</text>`;
        }
        if (currentStep >= 2) {
            svg += `<text x="120" y="92" text-anchor="middle" class="expr">30 × 5 = <tspan class="expr-reveal">150</tspan></text>`;
        }
        if (currentStep >= 3) {
            svg += `<circle cx="120" cy="122" r="16" class="bubble-c" />`;
            svg += `<text x="120" y="127" text-anchor="middle" class="bubble-t" style="font-size:13px">150</text>`;
        }
        layer.innerHTML = svg;
        setCap();
    }

    /* ===== 模式 4：改錯放大鏡（直式偵錯） ===== */
    function renderDebug() {
        const layer = document.getElementById('drawLayer');
        document.getElementById('svgCanvas').setAttribute('viewBox', '0 0 240 152');
        let svg = '';
        svg += `<text x="108" y="13" text-anchor="middle" class="place-label">百位</text>`;
        svg += `<text x="150" y="13" text-anchor="middle" class="place-label">十位</text>`;
        svg += `<text x="192" y="13" text-anchor="middle" class="place-label">個位</text>`;
        svg += `<text x="150" y="52" text-anchor="middle" class="digit">3</text>`;
        svg += `<text x="192" y="52" text-anchor="middle" class="digit">3</text>`;
        svg += `<text x="45" y="82" class="op">×</text>`;
        svg += `<text x="192" y="82" text-anchor="middle" class="digit">4</text>`;
        svg += `<line x1="40" y1="90" x2="216" y2="90" class="hline" />`;
        // 小明的錯誤答案 122
        svg += `<text x="108" y="124" text-anchor="middle" class="digit">1</text>`;
        const tensCls = currentStep >= 4 ? 'digit-reveal' : (currentStep >= 1 ? 'digit-wrong' : 'digit');
        svg += `<text x="150" y="124" text-anchor="middle" class="${tensCls}">${currentStep >= 4 ? 3 : 2}</text>`;
        svg += `<text x="192" y="124" text-anchor="middle" class="digit">2</text>`;
        if (currentStep >= 1 && currentStep < 4) {
            svg += `<circle cx="150" cy="118" r="15" fill="none" stroke="#e57373" stroke-width="2" stroke-dasharray="4 3"/>`;
        }
        if (currentStep >= 3) {
            svg += `<circle cx="150" cy="70" r="10" class="bubble-c" />`;
            svg += `<text x="150" y="74" class="bubble-t">1</text>`;
        }
        if (currentStep >= 4) {
            svg += `<text x="120" y="146" text-anchor="middle" class="expr-coral" style="font-size:13px">正解：33 × 4 = 132</text>`;
        }
        layer.innerHTML = svg;
        setCap();
    }

    /* ===== 生活情境圖示（模式 7/8/10 頂部插畫帶） ===== */
    const ICONS = {
        crate() {
            let s = '';
            for (let i = 0; i < 9; i++) {
                const x = 6 + i * 26;
                s += `<rect x="${x}" y="2" width="20" height="20" rx="3" fill="#ffe0b2" stroke="#c8a27a" stroke-width="1"/>`;
                s += `<line x1="${x}" y1="13" x2="${x + 20}" y2="13" stroke="#c8a27a" stroke-width="1"/>`;
                s += `<circle cx="${x + 6}" cy="8" r="2.2" fill="#7bc9b2"/><circle cx="${x + 14}" cy="8" r="2.2" fill="#7bc9b2"/>`;
            }
            s += `<text x="120" y="27" text-anchor="middle" class="place-label" style="font-size:10px">每箱 24 瓶 × 9 箱</text>`;
            return s;
        },
        shop() {
            let s = '';
            for (let i = 0; i < 3; i++) {
                const x = 10 + i * 58;
                s += `<rect x="${x}" y="2" width="46" height="22" rx="6" fill="#dcedc8" stroke="#9dbb7a" stroke-width="1.2"/>`;
                s += `<line x1="${x + 9}" y1="2" x2="${x + 9}" y2="24" stroke="#9dbb7a" stroke-width="1"/>`;
                s += `<rect x="${x + 32}" y="10" width="8" height="6" rx="2" fill="#ff8a65"/>`;
            }
            s += `<rect x="178" y="4" width="56" height="18" rx="5" fill="#ffd166" stroke="#e0b84f" stroke-width="1"/>`;
            s += `<text x="206" y="17" text-anchor="middle" style="font-size:11px;font-weight:bold;fill:#6b5b3e">95 元</text>`;
            s += `<text x="120" y="27" text-anchor="middle" class="place-label" style="font-size:10px">鉛筆盒 1 個 95 元 × 3 個</text>`;
            return s;
        },
        coins() {
            let s = '';
            const pile = (cx, cy) => {
                let t = '';
                for (let k = 0; k < 3; k++) t += `<ellipse cx="${cx}" cy="${cy - k * 5}" rx="11" ry="4" fill="#ffd166" stroke="#d8ab3e" stroke-width="1"/>`;
                return t;
            };
            s += pile(45, 13);
            s += `<text x="45" y="27" text-anchor="middle" class="place-label" style="font-size:10px">大雄 70 元</text>`;
            for (let i = 0; i < 3; i++) s += pile(130 + i * 36, 13);
            s += `<text x="166" y="27" text-anchor="middle" class="place-label" style="font-size:10px">胖虎：3 堆 70 元</text>`;
            return s;
        }
    };

    /* ===== 直式乘法計算台（模式 5/6/7/8/10 共用引擎） ===== */
    function renderCalc() {
        const layer = document.getElementById('drawLayer');
        const svgEl = document.getElementById('svgCanvas');
        const yOff = q.iconCap ? 28 : 0;
        svgEl.setAttribute('viewBox', `0 0 240 ${150 + yOff}`);
        svgEl.style.maxWidth = q.iconCap ? '200px' : '';
        let svg = q.iconCap ? ICONS[q.iconMode]() : '';
        const prod = q.product.split('');
        const cols = prod.length;
        const colX = i => 195 - (cols - 1 - i) * 42; // i=0 最左欄

        // 欄位分隔虛線與位值標籤
        for (let i = 1; i < cols; i++) {
            const x = colX(i) - 21;
            svg += `<line x1="${x}" y1="${18 + yOff}" x2="${x}" y2="${140 + yOff}" class="grid-line" />`;
        }
        for (let j = 0; j < cols; j++) {
            svg += `<text x="${colX(j)}" y="${13 + yOff}" text-anchor="middle" class="place-label">${PLACE_CHAR[cols - 1 - j]}</text>`;
        }

        // 高亮當前演繹欄位
        const cur = STEPS[currentStep - 1];
        if (cur && cur.type === 'place') {
            const j = cols - 1 - cur.p;
            svg += `<rect x="${colX(j) - 20}" y="${30 + yOff}" width="40" height="106" rx="6" class="hl-rect" />`;
        }

        // 被乘數（上排）
        const aDigits = q.a.split('');
        for (let p = 0; p < aDigits.length; p++) {
            const j = cols - 1 - p;
            svg += `<text x="${colX(j)}" y="${60 + yOff}" text-anchor="middle" class="digit">${aDigits[aDigits.length - 1 - p]}</text>`;
        }

        // 乘號與乘數（下排，對齊個位）
        svg += `<text x="45" y="${90 + yOff}" class="op">×</text>`;
        svg += `<text x="${colX(cols - 1)}" y="${90 + yOff}" text-anchor="middle" class="digit">${q.m}</text>`;

        // 底線
        svg += `<line x1="40" y1="${98 + yOff}" x2="216" y2="${98 + yOff}" class="hline" />`;

        // 積（由右至左逐位揭示）
        for (let p = 0; p < cols; p++) {
            if (currentStep >= p + 1) {
                svg += `<text x="${colX(cols - 1 - p)}" y="${132 + yOff}" text-anchor="middle" class="digit-reveal">${prod[cols - 1 - p]}</text>`;
            }
        }

        // 進位氣泡（珊瑚橘圓圈白字，漂浮於被進位欄上方）
        for (let s = 0; s < currentStep; s++) {
            const st = STEPS[s];
            if (st.type === 'place' && st.carryOut > 0 && st.p + 1 < cols) {
                const x = colX(cols - 1 - (st.p + 1));
                svg += `<circle cx="${x}" cy="${28 + yOff}" r="10" class="bubble-c" />`;
                svg += `<text x="${x}" y="${32 + yOff}" class="bubble-t">${st.carryOut}</text>`;
            }
        }

        layer.innerHTML = svg;
        setCap();
    }

    /* ===== 模式 9：算式天平 ===== */
    function renderBalance() {
        const layer = document.getElementById('drawLayer');
        document.getElementById('svgCanvas').setAttribute('viewBox', '0 0 240 152');
        const tilt = currentStep >= 3;
        let svg = '';
        svg += `<rect x="113" y="72" width="14" height="50" rx="4" fill="#c8a27a"/>`;
        svg += `<rect x="86" y="120" width="68" height="8" rx="4" fill="#c8a27a"/>`;
        svg += `<g transform="rotate(${tilt ? 7 : 0} 120 70)">`;
        svg += `<rect x="26" y="66" width="188" height="7" rx="3.5" fill="#a5825e"/>`;
        svg += `<line x1="52" y1="73" x2="52" y2="92" stroke="#a5825e" stroke-width="1.5"/>`;
        svg += `<line x1="188" y1="73" x2="188" y2="92" stroke="#a5825e" stroke-width="1.5"/>`;
        svg += `<path d="M32 92 h40 l-7 13 h-26 z" fill="${currentStep === 1 ? '#ffd8cc' : '#e3d5c2'}" stroke="#c8b39a" stroke-width="1"/>`;
        svg += `<text x="52" y="89" text-anchor="middle" class="expr" style="font-size:12px">405 × 6</text>`;
        svg += `<path d="M168 92 h40 l-7 13 h-26 z" fill="${currentStep === 2 ? '#ffd8cc' : '#e3d5c2'}" stroke="#c8b39a" stroke-width="1"/>`;
        svg += `<text x="188" y="89" text-anchor="middle" class="expr" style="font-size:12px">405 × 7</text>`;
        svg += `</g>`;
        if (tilt) {
            svg += `<text x="120" y="147" text-anchor="middle" class="expr-coral" style="font-size:15px">405 × 6 ＜ 405 × 7</text>`;
        }
        layer.innerHTML = svg;
        setCap();
    }

    function render() {
        if (q.mode === 'calc') renderCalc();
        else if (q.mode === 'pattern') renderPattern();
        else if (q.mode === 'bar') renderBar();
        else if (q.mode === 'estimate') renderEstimate();
        else if (q.mode === 'debug') renderDebug();
        else renderBalance();
    }

    function nextStep() {
        const total = totalSteps();
        currentStep = currentStep + 1 > total ? 0 : currentStep + 1;
        render();
    }

    function checkAnswer() {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        if (selectedAns === q.correct) {
            fb.innerText = '太棒了！計算正確';
            fb.className = 'feedback success';
            currentStep = totalSteps();
            render();
        } else {
            fb.innerText = '再試試看喔！';
            fb.className = 'feedback fail';
        }
        setTimeout(() => fb.style.display = 'none', 2000);
    }

    init();
</script>

</body>
</html>
