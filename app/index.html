<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>028-1 國小數學APP｜108 課綱 G1~G6 主入口</title>
  <style>
    /* ===== 日系手繪溫暖童趣 ===== */
    :root {
      --cream: #FBF6EE;
      --paper: #FFFDF8;
      --ink: #4A3F35;
      --ink-soft: #8A7B6C;
      --green: #7BC47F;
      --green-deep: #4E9B54;
      --gold: #F5C451;
      --gold-deep: #E0A62E;
      --pink: #F6B8B8;
      --blue: #9EC9E8;
      --line: #4A3F35;
      --shadow: 0 4px 0 rgba(74, 63, 53, .18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--cream);
      color: var(--ink);
      font-family: "Yuanti TC", "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
      min-height: 100vh;
      padding: 14px 12px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #app { width: 100%; max-width: 960px; display: flex; flex-direction: column; gap: 14px; }

    /* ===== Hero ===== */
    .hero { text-align: center; padding: 10px 0 2px; }
    .hero-emoji { font-size: 42px; }
    .hero h1 { font-size: 22px; letter-spacing: 1px; }
    .hero-sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }

    /* ===== 年級藥丸導航 ===== */
    .grade-nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .pill {
      border: 2.5px solid var(--line); border-radius: 999px;
      background: var(--paper); color: var(--ink);
      font-size: 15px; font-weight: bold; font-family: inherit;
      padding: 9px 16px; cursor: pointer;
      box-shadow: var(--shadow); transition: transform .12s, background .12s;
    }
    .pill:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(74,63,53,.18); }
    .pill-active { background: var(--gold); }
    .pill-emoji { margin-right: 5px; }

    /* ===== 單元卡片 ===== */
    .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .unit-card {
      text-align: left; font-family: inherit; color: var(--ink);
      border: 2.5px solid var(--line); border-radius: 18px;
      background: var(--paper); padding: 16px; cursor: default;
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px;
    }
    button.unit-card { cursor: pointer; transition: transform .12s; }
    button.unit-card:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(74,63,53,.18); }
    .unit-ready { background: linear-gradient(150deg, #FFFDF8 55%, #F3F9EE); border-color: var(--green-deep); border-width: 3px; }
    .unit-locked { opacity: .82; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .code-badge {
      font-size: 12px; font-weight: bold; letter-spacing: .5px;
      border: 2px solid var(--ink); border-radius: 8px; padding: 2px 8px; background: #FFF;
    }
    .code-ready { background: var(--green); border-color: var(--green-deep); color: #fff; }
    .badge { font-size: 11px; border-radius: 999px; padding: 3px 10px; font-weight: bold; }
    .badge-ready { background: var(--gold); border: 2px solid var(--gold-deep); color: #6b4a00; }
    .badge-upcoming { background: #EFEAE2; border: 2px dashed var(--ink-soft); color: var(--ink-soft); }
    .card-name { font-size: 18px; font-weight: 900; }
    .card-core, .card-visual { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
    .card-cta { margin-top: 4px; font-size: 14px; font-weight: bold; color: var(--green-deep); }
    .card-cta-muted { color: var(--ink-soft); font-weight: normal; }

    /* ===== 測驗舞台：頂部 ===== */
    .stage-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn-back {
      border: 2.5px solid var(--line); border-radius: 12px; background: var(--paper);
      font-family: inherit; font-weight: bold; font-size: 13px; padding: 8px 12px; cursor: pointer;
      box-shadow: var(--shadow);
    }
    .btn-back:active { transform: translateY(2px); box-shadow: none; }
    .stage-title { display: flex; align-items: center; gap: 8px; }
    .stage-title h2 { font-size: 18px; }
    .exam-source {
      font-size: 11.5px; color: var(--ink-soft);
      border: 2px dashed var(--ink-soft); border-radius: 10px; padding: 6px 10px; background: #FFF9EE;
    }

    /* ===== 題號分頁 ===== */
    .q-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
    .q-tab {
      flex: 0 0 auto; border: 2.5px solid var(--line); border-radius: 14px;
      background: var(--paper); font-family: inherit; cursor: pointer;
      padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; text-align: center;
      box-shadow: var(--shadow);
    }
    .q-tab-num { font-size: 13px; font-weight: 900; }
    .q-tab-title { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
    .q-tab-active { background: var(--green); border-color: var(--green-deep); }
    .q-tab-active .q-tab-title { color: #EAF7EA; }
    .q-tab-visited:not(.q-tab-active) { background: #FDF3D7; }

    /* ===== iframe 舞台 ===== */
    .stage-frame {
      border: 3px solid var(--line); border-radius: 20px; overflow: hidden;
      background: var(--paper); box-shadow: var(--shadow);
    }
    .demo-frame { display: block; width: 100%; height: 640px; border: 0; background: #fff; }

    /* ===== 底部導航 ===== */
    .stage-bottom { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn-nav {
      border: 2.5px solid var(--line); border-radius: 999px; background: var(--paper);
      font-family: inherit; font-size: 15px; font-weight: bold; padding: 11px 20px; cursor: pointer;
      box-shadow: var(--shadow);
    }
    .btn-nav:active { transform: translateY(2px); box-shadow: none; }
    .btn-disabled { opacity: .38; pointer-events: none; }
    .btn-submit { background: var(--gold); border-color: var(--gold-deep); }

    /* ===== 結算彈窗 ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(74, 63, 53, .45);
      display: flex; align-items: center; justify-content: center; z-index: 99; padding: 16px;
    }
    .result-card {
      background: var(--paper); border: 3px solid var(--line); border-radius: 22px;
      max-width: 360px; width: 100%; padding: 22px; text-align: center; box-shadow: 0 8px 0 rgba(74,63,53,.2);
    }
    .result-emoji { font-size: 44px; }
    .result-card h3 { margin: 6px 0 2px; }
    .result-unit { font-size: 13px; color: var(--ink-soft); }
    .result-count { font-size: 15px; font-weight: bold; margin: 8px 0; }
    .result-list { list-style: none; text-align: left; margin: 8px 0; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
    .res-miss { color: var(--ink-soft); }
    .result-note { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 12px; }
    .btn-close { width: 100%; }

    /* ===== 三端自適應 ===== */
    @media (max-width: 767px) {           /* 手機 390px 基準 */
      body { padding: 10px 8px 22px; }
      .hero h1 { font-size: 19px; }
      .unit-grid { grid-template-columns: 1fr; }
      .stage-title h2 { font-size: 15px; }
      .exam-source { font-size: 10.5px; }
      .demo-frame { height: 580px; }
      .btn-nav { font-size: 14px; padding: 10px 14px; }
      .stage-bottom { position: sticky; bottom: 0; }
    }
    @media (min-width: 768px) {           /* 平板 */
      .demo-frame { height: 640px; }
    }
    @media (min-width: 960px) {           /* 電腦寬螢幕 */
      .demo-frame { height: 680px; }
      .hero h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="shell.js"></script>
</body>
</html>
