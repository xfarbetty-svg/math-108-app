<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小數學冒險 · 108 課綱一到六年級</title>
<style>
:root {
  --bg: #fff9f0;
  --card: #ffffff;
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --coral: #ff8a65;
  --coral-deep: #f4694b;
  --mint: #7bc9b2;
  --sky: #7db8e8;
  --lemon: #ffd166;
  --lilac: #b39ddb;
  --line: #f0e7da;
  --shadow: 0 10px 30px rgba(120, 90, 40, 0.08);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  min-height: 100%;
  background:
    radial-gradient(circle at 8% 4%, rgba(255, 209, 102, 0.18), transparent 34%),
    radial-gradient(circle at 94% 90%, rgba(123, 200, 178, 0.16), transparent 36%),
    var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding-bottom: 40px;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ===== 頂部導航列 ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255, 249, 240, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px 12px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
.brand .sub { font-size: 11px; color: var(--ink-soft); }
.grade-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.grade-nav::-webkit-scrollbar { display: none; }
.grade-btn {
  flex: 0 0 auto; padding: 9px 18px; border-radius: 999px;
  background: var(--card); border: 2px solid var(--line);
  font-size: 14px; font-weight: 700; color: var(--ink-soft);
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s, color 0.15s;
}
.grade-btn:active { transform: scale(0.94); }
.grade-btn.active {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, var(--coral), var(--coral-deep));
  box-shadow: 0 6px 14px rgba(244, 105, 75, 0.3);
}

/* ===== 主內容 ===== */
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 0; }

/* 年級首頁 */
.grade-hero { margin-bottom: 18px; }
.grade-hero .hero-card {
  background: var(--card); border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow); border: 1px solid var(--line);
}
.hero-card .stage-tag { display: inline-block; font-size: 11px; color: var(--ink-soft); background: #f6f1e7; border-radius: 999px; padding: 3px 10px; margin-bottom: 8px; }
.hero-card h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.hero-card p { font-size: 13px; color: var(--ink-soft); }
.unit-list { display: grid; gap: 12px; grid-template-columns: 1fr; }
.unit-card {
  position: relative; text-align: left; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow);
  transition: transform 0.15s, box-shadow 0.15s;
}
.unit-card:active { transform: scale(0.98); }
.unit-card.ready { border: 2px solid var(--coral); background: linear-gradient(135deg, #fff 0%, #fff3ec 100%); }
.unit-card.ready:active { transform: scale(0.97); box-shadow: 0 14px 30px rgba(244, 105, 75, 0.18); }
.unit-card.locked { opacity: 0.65; box-shadow: none; cursor: default; }
.unit-card .code {
  display: inline-block; font-size: 11px; font-weight: 800; color: var(--coral-deep);
  background: #ffe8de; border-radius: 8px; padding: 2px 8px; margin-bottom: 6px;
}
.unit-card.locked .code { color: var(--ink-soft); background: #f4efe6; }
.unit-card h3 { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
.unit-card .hint { font-size: 12px; color: var(--ink-soft); }
.badge-ready {
  position: absolute; top: 14px; right: 14px;
  font-size: 11px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--coral), var(--coral-deep));
  border-radius: 999px; padding: 4px 10px;
  box-shadow: 0 4px 10px rgba(244, 105, 75, 0.3);
}
.badge-upcoming {
  position: absolute; top: 14px; right: 14px;
  font-size: 11px; font-weight: 700; color: var(--ink-soft);
  background: #f4efe6; border-radius: 999px; padding: 4px 10px;
}
.badge-plan {
  display: inline-block; margin-top: 8px;
  font-size: 11px; font-weight: 700; color: var(--lilac);
  background: #f1ecf9; border-radius: 999px; padding: 4px 10px;
}
.start-arrow { position: absolute; bottom: 14px; right: 16px; font-size: 15px; color: var(--coral-deep); font-weight: 800; }

/* 籌備中年級藍圖 */
.blueprint {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px;
}
.blueprint .plan-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--lilac), #9575cd);
  border-radius: 999px; padding: 5px 14px; margin-bottom: 12px;
}
.blueprint h2 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
.blueprint .desc { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
.topic-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.topic-chip {
  background: #faf6ee; border: 1px dashed #e3d9c6; border-radius: 12px;
  padding: 10px 12px; font-size: 12px; color: var(--ink-soft);
}
.topic-chip b { display: block; font-size: 12px; color: var(--ink); margin-bottom: 2px; }
.pending-note { margin-top: 14px; font-size: 11px; color: var(--ink-soft); line-height: 1.6; }

/* ===== 單元測驗舞台 ===== */
.stage-wrap { display: none; }
.stage-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.btn-back {
  font-size: 13px; font-weight: 700; color: var(--coral-deep);
  background: var(--card); border: 2px solid var(--line);
  border-radius: 999px; padding: 8px 14px;
}
.progress-box { text-align: right; }
.progress-num { font-size: 15px; font-weight: 800; color: var(--coral-deep); }
.progress-source { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #eadfcc; transition: all 0.2s; }
.dot.on { background: var(--coral); transform: scale(1.25); }
.dot.done { background: var(--mint); }
.stage-title { text-align: center; font-size: 17px; font-weight: 800; margin-bottom: 12px; }
.stage-frame {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--line);
  overflow: hidden;
}
.stage-frame iframe { display: block; width: 100%; border: 0; }
.stage-nav { display: flex; gap: 10px; margin-top: 16px; }
.stage-nav button {
  flex: 1; min-height: 52px; border-radius: 16px;
  font-size: 15px; font-weight: 800;
  transition: transform 0.15s, box-shadow 0.15s;
}
.stage-nav button:active { transform: scale(0.96); }
.btn-prev { background: var(--card); color: var(--ink-soft); border: 2px solid var(--line); }
.btn-next { background: linear-gradient(135deg, var(--coral), var(--coral-deep)); color: #fff; box-shadow: 0 8px 18px rgba(244, 105, 75, 0.3); }
.btn-finish { background: linear-gradient(135deg, var(--mint), #4fa88e); color: #fff; box-shadow: 0 8px 18px rgba(79, 168, 142, 0.3); flex: 1.4 !important; }
.stage-nav button:disabled { opacity: 0.4; }

/* ===== 交卷結算 ===== */
.result-wrap { display: none; }
.result-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
}
.result-card h2 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 4px; }
.result-card .rsub { text-align: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; }
.result-item { border-top: 1px dashed var(--line); padding: 14px 2px; }
.result-item .rtitle { font-weight: 800; font-size: 14.5px; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.result-item .rsrc { font-size: 11px; color: var(--ink-soft); font-weight: 400; }
.result-item .rlabel { font-size: 12px; font-weight: 800; color: var(--mint); margin: 6px 0 2px; }
.result-item .rexp { font-size: 13px; line-height: 1.7; color: var(--ink); }
.result-item .rdemo { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
.result-actions { display: flex; gap: 10px; }
.result-actions button { flex: 1; min-height: 52px; border-radius: 16px; font-size: 15px; font-weight: 800; }
.note-offline {
  display: none; margin: 10px 0 0; padding: 10px 14px; border-radius: 12px;
  background: #fff3cd; color: #8a6d1a; font-size: 12px; line-height: 1.6;
}
@media (min-width: 700px) {
  .unit-list { grid-template-columns: 1fr 1fr; }
  .stage-title { font-size: 19px; }
  .brand h1 { font-size: 19px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>🎨 小數學冒險</h1>
      <span class="sub">108 課綱 · 一到六年級 · 純離線真題</span>
    </div>
    <nav class="grade-nav" id="gradeNav" aria-label="年級導航"></nav>
  </div>
</header>

<main>
  <section id="gradeView"></section>

  <section id="stageView" class="stage-wrap">
    <div class="stage-head">
      <button class="btn-back" id="btnBack">← 回單元列表</button>
      <div class="progress-box">
        <div class="progress-num" id="progressNum"></div>
        <div class="progress-source" id="progressSource"></div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="stage-title" id="stageTitle"></div>
    <div class="stage-frame"><iframe id="stageFrame" title="具象考題教具"></iframe></div>
    <div class="stage-nav">
      <button class="btn-prev" id="btnPrev">上一題</button>
      <button class="btn-next" id="btnNext">下一題 →</button>
      <button class="btn-finish" id="btnFinish">交卷結算</button>
    </div>
  </section>

  <section id="resultView" class="result-wrap"></section>

  <div class="note-offline" id="offlineNote"></div>
</main>

<script src="shell.js"></script>
</body>
</html>
