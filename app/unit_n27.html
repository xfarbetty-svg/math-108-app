<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-2-7 乘法算式與倍數關係</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.55}
header{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;padding:24px 16px;text-align:center}
header h1{font-size:1.4rem}
header p{opacity:.9;font-size:.9rem;margin-top:4px}
main{max-width:860px;margin:0 auto;padding:16px}
.panel{background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.05rem;color:#334155;border-left:5px solid #8b5cf6;padding-left:8px;margin-bottom:10px}
.demo{max-width:560px;margin:0 auto}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.ctrl label{font-size:.85rem;display:flex;flex-direction:column;gap:2px;min-width:150px}
.ctrl b{color:#7c3aed}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{border:2px solid #e2e8f0;border-radius:12px;padding:12px;background:#fafafa}
.card .num{display:inline-block;background:#ede9fe;color:#6d28d9;font-weight:700;font-size:.75rem;border-radius:999px;padding:2px 10px;margin-bottom:6px}
.card .stem{font-size:.95rem;margin-bottom:8px}
.card .viz{margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:9px 12px;margin:5px 0;font-size:.9rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:#8b5cf6;background:#f5f3ff}
.opt:disabled{cursor:default;opacity:.75}
.opt.correct{border-color:#16a34a;background:#dcfce7;opacity:1;font-weight:700}
.opt.wrong{border-color:#dc2626;background:#fee2e2}
.verdict{font-weight:700;font-size:.85rem;margin-top:6px;min-height:1.2em}
.score{position:sticky;top:0;background:#1e293b;color:#fff;font-weight:700;font-size:.85rem;border-radius:999px;padding:6px 14px;display:inline-block;margin-bottom:12px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9}
.drawer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);padding:16px;max-height:60vh;overflow:auto;z-index:10;transform:translateY(0);transition:transform .25s}
.drawer.hide{transform:translateY(110%)}
.drawer h3{font-size:1rem;margin-bottom:8px;padding-right:40px}
.drawer .dtext{font-size:.9rem;color:#334155}
.drawer .close{position:absolute;top:10px;right:10px;background:#e2e8f0;border:none;border-radius:50%;width:32px;height:32px;font-size:1rem;cursor:pointer}
.hidden{display:none}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}header h1{font-size:1.6rem}}
@media(min-width:1000px){.cards{grid-template-columns:1fr 1fr}main{max-width:960px}}
</style>
</head>
<body>
<header>
  <h1>N-2-7 乘法算式與倍數關係</h1>
  <p>被乘數與乘數的意義 ・ 「幾的幾倍」 ・ 單位量與單位數的正確列式</p>
</header>
<main>
  <section class="panel">
    <h2>🧮 教具：multiple-relator</h2>
    <div class="demo">
      <multiple-relator id="demo" base="6" multiplier="4" item-label="個" group-label="盒"></multiple-relator>
      <div class="ctrl">
        <label>每份個數（被乘數）<span>每盒裝 <b id="bV">6</b> 個</span><input id="bR" type="range" min="1" max="9" value="6" aria-label="每份個數"></label>
        <label>份數（乘數）<span>共 <b id="mV">4</b> 盒</span><input id="mR" type="range" min="1" max="9" value="4" aria-label="份數"></label>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>📝 單元測驗（共 10 題）</h2>
    <div class="score" id="score">已作答 0 / 10 ・ 答對 0</div>
    <div class="cards" id="cards"></div>
    <p id="err" class="hidden" style="color:#b91c1c;font-size:.85rem;margin-top:8px"></p>
  </section>
</main>

<div id="mask" class="mask hidden"></div>
<aside id="drawer" class="drawer hide" aria-hidden="true">
  <button class="close" id="dClose" aria-label="關閉">✕</button>
  <h3 id="dTitle"></h3>
  <div class="dtext" id="dText"></div>
</aside>

<script src="components/multiple-relator.js"></script>
<script>
(function () {
  'use strict';
  var DataFile = '../data/curriculum_v3/g2_n27_multiplication_formula.json';
  var demo = document.getElementById('demo');
  var bR = document.getElementById('bR'), mR = document.getElementById('mR');
  var bV = document.getElementById('bV'), mV = document.getElementById('mV');
  function sync() {
    demo.setAttribute('base', bR.value);
    demo.setAttribute('multiplier', mR.value);
    bV.textContent = bR.value;
    mV.textContent = mR.value;
  }
  bR.addEventListener('input', sync);
  mR.addEventListener('input', sync);

  var mask = document.getElementById('mask'), drawer = document.getElementById('drawer');
  var dTitle = document.getElementById('dTitle'), dText = document.getElementById('dText');
  function openDrawer(title, html) {
    dTitle.textContent = title;
    dText.innerHTML = html;
    mask.classList.remove('hidden');
    drawer.classList.remove('hide');
    drawer.setAttribute('aria-hidden', 'false');
  }
  function closeDrawer() {
    mask.classList.add('hidden');
    drawer.classList.add('hide');
    drawer.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('dClose').addEventListener('click', closeDrawer);
  mask.addEventListener('click', closeDrawer);

  var total = 0, right = 0, answered = 0;
  var score = document.getElementById('score');
  function upd() { score.textContent = '已作答 ' + answered + ' / ' + total + ' ・ 答對 ' + right; }

  fetch(DataFile).then(function (r) {
    if (!r.ok) { throw new Error('HTTP ' + r.status); }
    return r.json();
  }).then(function (qs) {
    if (!Array.isArray(qs)) { throw new Error('資料不是 JSON 陣列'); }
    total = qs.length;
    var box = document.getElementById('cards');
    qs.forEach(function (q, i) {
      var card = document.createElement('article');
      card.className = 'card';
      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = '第 ' + (i + 1) + ' 題';
      card.appendChild(num);
      var stem = document.createElement('p');
      stem.className = 'stem';
      stem.textContent = q.stem;
      card.appendChild(stem);

      var ve = q.visual_engine || {};
      if (ve.component === 'multiple-relator' && ve.attrs) {
        var viz = document.createElement('div');
        viz.className = 'viz';
        var mr = document.createElement('multiple-relator');
        Object.keys(ve.attrs).forEach(function (k) { mr.setAttribute(k, ve.attrs[k]); });
        viz.appendChild(mr);
        card.appendChild(viz);
      }

      var opts = document.createElement('div');
      var verdict = document.createElement('div');
      verdict.className = 'verdict';
      (q.choices || []).forEach(function (c, j) {
        var btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = c;
        btn.addEventListener('click', function () {
          if (btn.disabled) { return; }
          var ok = j === q.answer_index;
          Array.prototype.forEach.call(opts.children, function (b) {
            b.disabled = true;
            if (b === opts.children[q.answer_index]) { b.classList.add('correct'); }
          });
          if (!ok) { btn.classList.add('wrong'); }
          verdict.textContent = ok ? '✅ 答對了！' : '❌ 答錯了，看解析～';
          verdict.style.color = ok ? '#16a34a' : '#dc2626';
          answered++;
          if (ok) { right++; }
          upd();
          openDrawer(ok ? '✅ 第 ' + (i + 1) + ' 題：答對了！' : '❌ 第 ' + (i + 1) + ' 題：正解是「' + q.choices[q.answer_index] + '」', q.explanation || '');
        });
        opts.appendChild(btn);
      });
      card.appendChild(opts);
      card.appendChild(verdict);
      box.appendChild(card);
    });
    upd();
  }).catch(function (e) {
    var err = document.getElementById('err');
    err.classList.remove('hidden');
    err.textContent = '載入題目失敗（' + e.message + '）。請改用本機伺服器開啟本頁（例如在專案根目錄執行 python -m http.server 8000），不要直接用 file:// 開啟。';
  });
})();
</script>
</body>
</html>
