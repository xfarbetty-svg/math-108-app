  <style>

      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 100;

    }
    .status-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;

      color: #991B1B;
      background: #FEF2F2;
      border-left: 3px solid var(--red);
      padding: 7px 10px;
      border-radius: 4px;
      line-height: 1.45;
    }

    /* ── 底部導航 ── */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .action-btn {
      min-height: 46px;
      flex: 1;
      padding: 0 16px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
      touch-action: manipulation;
    }
    .btn-next { background: var(--accent); color: #FFF; }
    .btn-next:hover { background: var(--accent-hover); }
    .btn-prev { background: #EEF2F6; color: var(--ink); border: 1px solid var(--border); flex: 0 0 auto; padding: 0 14px; }
    .action-btn[disabled] { opacity: .4; cursor: default; }

    /* ── 完成小結 ── */
    .summary-card {
      display: none;
      background: var(--green-bg);
      border: 1.5px solid #86EFAC;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      line-height: 1.5;
    }
    .summary-card.show { display: block; }

    /* ── 載入失敗提示（不靜默吞錯） ── */
    .load-error {
      display: none;
      background: #FEF2F2;
      border: 1.5px solid #FCA5A5;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.6;
      color: #991B1B;
    }
    .load-error.show { display: block; }
    .load-error code { background: #FEE2E2; padding: 1px 5px; border-radius: 4px; }

    /* ── 離線 / file:// 降級提示（中性灰，不是錯誤） ── */
    .offline-note {
      display: none;
      background: #F1F5F9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      line-height: 1.5;
    }
    .offline-note.show { display: block; }
    .offline-note b { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .expl-drawer { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <!-- 頂部狀態列 < 40px -->
  <header class="status-bar">
    <div class="status-left">
      <span class="badge-unit" id="unitBadge">G1 速驗</span>
      <span class="status-title" id="unitTitle">四大教具 × 段考真題</span>
    </div>
    <span class="status-progress" id="statusProgress">0 / 40</span>
  </header>

  <!-- 四教具切換列 -->
  <nav class="station-nav" id="stationNav" aria-label="教具單元切換"></nav>

  <!-- 主體 -->
  <main class="quiz-layout">
    <div class="load-error" id="loadError" role="alert"></div>
    <div class="offline-note" id="offlineNote" role="status"></div>

    <!-- 左欄：題幹與教具 -->
    <section class="left-panel">
      <div class="card">
        <div class="stem-header">
          <span class="question-no" id="questionIndexText">第 1 / 10 題</span>
          <span class="source-ghost" id="questionSource">段考真題</span>
        </div>
        <div class="stem-text" id="questionStem">載入中...</div>
      </div>

      <div class="visual-stage">
        <div class="frames-container" id="visualStage"></div>
        <div class="tool-bar" id="toolBar"></div>
      </div>
    </section>

    <!-- 右欄：選項與詳解 -->
    <section class="right-panel">
      <div class="card">
        <div class="choices-grid" id="choicesGrid"></div>
      </div>

      <div class="expl-drawer" id="explDrawer">
        <div class="expl-title"><span>💡 破招算理分解</span></div>
        <div class="breakdown-box">
          <div class="breakdown-step" id="step1"></div>
          <div class="breakdown-step" id="step2"></div>
          <div class="breakdown-step" id="step3"></div>
          <div class="formula-tag" id="formulaTag"></div>
        </div>
        <div class="trap-alert" id="trapAlert"></div>
      </div>

      <div class="summary-card" id="summaryCard"></div>

      <div class="nav-bar">
        <button class="action-btn btn-prev" id="btnPrev">← 上一題</button>
        <button class="action-btn btn-next" id="btnNext">下一題 →</button>
      </div>
    </section>
  </main>

  <script>
    /* 四教具 × 對應段考題庫（單一真相：沿用 data/curriculum_v3 題庫，不複製題目） */
    var STATIONS = [
      { unit: 'N-1-3', name: '湊十法', icon: '🔟', title: '湊十法與拆十法',
        file: 'g1_n13_make_ten.json', engine: 'ten-frame-grid' },
      { unit: 'N-1-2', name: '比多少', icon: '🔴', title: '比較型減法（多多少）',
        file: 'g1_n12_diff_compare.json', engine: 'dual-track-diff' },
      { unit: 'R-1-1', name: '等號天平', icon: '⚖️', title: '等號的平衡意義',
        file: 'g1_r11_balance_equal.json', engine: 'balance-beam' },
      { unit: 'N-1-4', name: '反推數線', icon: '📏', title: '加減逆算與解題',
        file: 'g1_n14_solve_problem.json', engine: 'glass-number-line' }
    ];

    var currentStation = 0;
    /* 每站狀態：{ idx, answers: {qid: choiceIdx} } */
    var stationState = STATIONS.map(function () { return { idx: 0, answers: {} }; });
    var answered = false;      /* 本題是否已作答（當前渲染） */
    var loading = true;

    /* 深連結：#N-1-3 直接開啟對應教具（速驗/截圖用） */
    (function initStationFromHash() {
      var key = (location.hash || '').replace('#', '');
      for (var i = 0; i < STATIONS.length; i++) {
        if (STATIONS[i].unit === key) { currentStation = i; break; }
      }
    })();

    var visualStage = document.getElementById('visualStage');
    var toolBar = document.getElementById('toolBar');
    var choicesGrid = document.getElementById('choicesGrid');
    var explDrawer = document.getElementById('explDrawer');
    var summaryCard = document.getElementById('summaryCard');

    /* ── 內嵌題庫（file:// 直開的無縫降級來源；內容與 data/curriculum_v3 同步） ── */
    var OFFLINE_BANK = (function () {
      var el = document.getElementById('offlineBank');
      if (!el) return {};
      try {
        return JSON.parse(el.textContent || '{}') || {};
      } catch (e) {
        document.getElementById('loadError').innerHTML =
          '⚠️ 內嵌題庫解析失敗：<code>' + escapeHtml(e.message) + '</code>';
        document.getElementById('loadError').classList.add('show');
        return {};
      }
    })();

    function validateBank(data, label) {
      if (!Array.isArray(data) || !data.length) throw new Error(label + ' 題庫為空');
      for (var i = 0; i < data.length; i++) {
        var q = data[i];
        if (!q || !q.id || !q.stem || !Array.isArray(q.choices) || !q.choices.length) {
          throw new Error(label + ' 第 ' + (i + 1) + ' 題欄位不完整');
        }
        if (typeof q.answer_index !== 'number' || q.answer_index < 0 || q.answer_index >= q.choices.length) {
          throw new Error(label + ' 第 ' + (i + 1) + ' 題 answer_index 越界');
        }
      }
      return data;
    }

    /* 單一單元載入：先試遠端 JSON，失敗或 file:// 則用內嵌資料（不丟錯給使用者） */
    function loadStation(st) {
      var offline = function (reason) {
        var fb = OFFLINE_BANK[st.file];
        if (!fb) throw new Error(st.file + ' 遠端取得失敗（' + reason + '），且無內嵌資料');
        var data = validateBank(fb, st.file + '（內嵌）');
        st.questions = data;
        st.offline = true;
        return data;
      };

      if (location.protocol === 'file:') {
        /* file:// 下 fetch 必被瀏覽器封鎖，直接走內嵌，連 console 錯誤都不產生 */
        try { return Promise.resolve(offline('file:// 不支援 fetch')); }
        catch (e) { return Promise.reject(e); }
      }

      return fetch('../data/curriculum_v3/' + st.file).then(function (r) {
        if (!r.ok) throw new Error(st.file + ' HTTP ' + r.status);
        return r.json();
      }).then(function (data) {
        st.questions = validateBank(data, st.file);
        st.offline = false;
        return st.questions;
      }).catch(function (err) {
        return offline(err.message);
      });
    }

    function loadAll() {
      var tasks = STATIONS.map(loadStation);
      return Promise.all(tasks).then(function () {
        loading = false;
        buildStationNav();
        showOfflineNote();
        render();
      }).catch(function (err) {
        loading = false;
        var box = document.getElementById('loadError');
        box.innerHTML = '⚠️ 題庫載入失敗：<code>' + escapeHtml(err.message) + '</code><br>' +
          '請確認以本機 HTTP 伺服器開啟（例如在專案根目錄執行 <code>python -m http.server 8000</code>），' +
          '再前往 <code>/app/g1_exam_showcase.html</code>。';
        box.classList.add('show');
        document.getElementById('questionStem').textContent = '無法載入題庫。';
      });
    }

    /* 降級說明（中性提示，非錯誤） */
    function showOfflineNote() {
      var count = 0, total = 0;
      STATIONS.forEach(function (st) {
        if (!st.questions) return;
        total += st.questions.length;
        if (st.offline) count += 1;
      });
      if (!count) return;
      var note = document.getElementById('offlineNote');
      note.innerHTML = count === STATIONS.length
        ? '📦 <b>離線模式</b>：以 file:// 直接開啟，已使用內嵌題庫，' + total + ' 題完整可用。'
        : '📦 <b>部分離線</b>：' + count + ' 個單元改用內嵌題庫，' + total + ' 題完整可用。';
      note.classList.add('show');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ── 站點切換列 ── */
    function buildStationNav() {
      var nav = document.getElementById('stationNav');
      nav.innerHTML = '';
      STATIONS.forEach(function (st, i) {
        var b = document.createElement('button');
        b.className = 'station-chip';
        b.type = 'button';
        b.setAttribute('data-station', String(i));
        b.innerHTML = '<span class="chip-top">' + st.icon + ' ' + st.name + '</span>' +
                      '<span class="chip-sub" id="chipSub-' + i + '"></span>';
        b.onclick = function () {
          if (currentStation === i) return;
          currentStation = i;
          if (history.replaceState) history.replaceState(null, '', '#' + st.unit);
          render();
        };
        nav.appendChild(b);
      });
      updateNav();
    }

    function updateNav() {
      var nav = document.getElementById('stationNav');
      var chips = nav.querySelectorAll('.station-chip');
      var totalDoneAll = 0;
      STATIONS.forEach(function (st, i) {
        var done = Object.keys(stationState[i].answers).length;
        totalDoneAll += done;
        var total = st.questions ? st.questions.length : 0;
        var sub = document.getElementById('chipSub-' + i);
        if (sub) sub.textContent = done + ' / ' + total + ' 題';
        if (chips[i]) {
          chips[i].classList.toggle('active', i === currentStation);
          chips[i].classList.toggle('all-done', total > 0 && done === total);
        }
      });
      document.getElementById('statusProgress').textContent = totalDoneAll + ' / 40';
    }

    /* ── 主渲染 ── */
    function render() {
      var st = STATIONS[currentStation];
      if (!st.questions) return;
      var state = stationState[currentStation];
      if (state.idx >= st.questions.length) state.idx = st.questions.length - 1;

      var q = st.questions[state.idx];
      var prevAnswer = state.answers[q.id];
      answered = prevAnswer !== undefined;

      document.getElementById('unitBadge').textContent = st.unit;
      document.getElementById('unitTitle').textContent = st.title;
      document.getElementById('questionIndexText').textContent =
        '第 ' + (state.idx + 1) + ' / ' + st.questions.length + ' 題';
      document.getElementById('questionSource').textContent = q.source || '段考真題';
      document.getElementById('questionStem').textContent = q.stem;

      renderVisual(st, q);
      renderChoices(q, prevAnswer);
      renderNav(st, state);
      renderSummary(st, state);
      updateNav();

      if (prevAnswer !== undefined) showExplanation(q);
      else {
        explDrawer.classList.remove('open');
        document.getElementById('step1').textContent = '';
        document.getElementById('step2').textContent = '';
        document.getElementById('step3').textContent = '';
        document.getElementById('formulaTag').textContent = '';
        document.getElementById('trapAlert').textContent = '';
      }
    }

    /* ── 教具渲染（每次重建，避免跨題殘留狀態） ── */
    function renderVisual(st, q) {
      visualStage.innerHTML = '';
      toolBar.innerHTML = '';
      var props = (q.visual_engine && q.visual_engine.props) || {};

      if (st.engine === 'ten-frame-grid') {
        var fL = document.createElement('ten-frame-grid');
        fL.setAttribute('fill-color', '#DC2626');
        fL.setCount(props.left_initial || 0);
        var fR = document.createElement('ten-frame-grid');
        fR.setAttribute('fill-color', '#2563EB');
        fR.setCount(props.right_initial || 0);
        visualStage.appendChild(fL);
        visualStage.appendChild(fR);
        var need = Math.max(0, (props.target || 10) - (props.left_initial || 0));
        if (props.operation === 'add' && need > 0 && (props.right_initial || 0) >= need) {
          toolBtn('▶ 演示湊十', 'primary', function () {
            fL.setCount(props.target || 10);
            fR.setCount((props.right_initial || 0) - need);
            toolBar.innerHTML = '';
            toolHint('紅框湊滿 ' + (props.target || 10) + '，藍框剩 ' +
              ((props.right_initial || 0) - need) + ' 顆');
          });
          toolHint('紅框還差 ' + need + ' 顆才滿十');
        }
      } else if (st.engine === 'dual-track-diff') {
        var dtd = document.createElement('dual-track-diff');
        dtd.setAttribute('top-count', String(props.top_count != null ? props.top_count : 8));
        dtd.setAttribute('bottom-count', String(props.bottom_count != null ? props.bottom_count : 5));
        /* 未作答前不揭露差值算式；回看已作答題目則直接顯示 */
        dtd.setAttribute('show-formula', answered ? 'true' : 'false');
        visualStage.appendChild(dtd);
        var legend = document.createElement('div');
        legend.className = 'track-legend';
        legend.innerHTML =
          '<span class="legend-item"><span class="legend-dot" style="background:#EF4444"></span>' +
            escapeHtml(props.top_label || '上軌') + '</span>' +
          '<span class="legend-item"><span class="legend-dot" style="background:#3B82F6"></span>' +
            escapeHtml(props.bottom_label || '下軌') + '</span>';
        visualStage.appendChild(legend);
        toolHint('綠虛線＝一對一一樣多；黃框＝多出來的部分');
      } else if (st.engine === 'balance-beam') {
        var beam = document.createElement('balance-beam');
        beam.setAttribute('left-weight', String(props.left_weight != null ? props.left_weight : 5));
        beam.setAttribute('right-weight', String(props.right_weight != null ? props.right_weight : 2));
        beam.setAttribute('animate', 'true');
        visualStage.appendChild(beam);
        if (props.interactive) {
          var right = props.right_weight != null ? props.right_weight : 2;
          toolBtn('右邊 ＋1 克', 'primary', function () {
            if (right >= 20) return;
            right += 1;
            beam.setAttribute('right-weight', String(right));
            toolHint('右邊目前 ' + right + ' 克');
          });
          toolBtn('重設', '', function () {
            right = props.right_weight != null ? props.right_weight : 2;
            beam.setAttribute('right-weight', String(right));
            toolHint('右邊目前 ' + right + ' 克');
          });
          toolHint('右邊目前 ' + right + ' 克');
        } else {
          toolHint('觀察天平：左邊 ＝ 右邊 才會平衡');
        }
      } else if (st.engine === 'glass-number-line') {
        var line = document.createElement('glass-number-line');
        visualStage.appendChild(line);
        if (typeof line.setEquation === 'function') {
          line.setEquation({
            mode: props.mode,
            start: props.start,
            jump: props.jump,
            end: props.end
          });
        }
        toolBtn('倒退反推', 'primary', function () { line.stepReverse(); });
        toolBtn('揭曉答案', '', function () { line.reveal(); });
        toolBtn('重設', '', function () { line.setEquation(props); });
      }
    }

    function toolBtn(label, cls, handler) {
      var b = document.createElement('button');
      b.className = 'tool-btn' + (cls ? ' ' + cls : '');
      b.type = 'button';
      b.textContent = label;
      b.onclick = handler;
      toolBar.appendChild(b);
    }

    function toolHint(text) {
      var span = document.createElement('span');
      span.className = 'tool-hint';
      span.textContent = text;
      toolBar.appendChild(span);
    }

    /* ── 選項 ── */
    function renderChoices(q, prevAnswer) {
      choicesGrid.innerHTML = '';
      q.choices.forEach(function (text, i) {
        var btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.type = 'button';
        btn.textContent = text;
        if (prevAnswer !== undefined) {
          btn.disabled = true;
          if (i === q.answer_index) btn.classList.add('correct');
          else if (i === prevAnswer) btn.classList.add('wrong');
        } else {
          btn.onclick = function () { onSelectChoice(i); };
        }
        choicesGrid.appendChild(btn);
      });
    }

    function onSelectChoice(choiceIdx) {
      if (answered) return;
      answered = true;
      var st = STATIONS[currentStation];
      var state = stationState[currentStation];
      var q = st.questions[state.idx];
      state.answers[q.id] = choiceIdx;

      var btns = choicesGrid.querySelectorAll('.choice-btn');
      btns.forEach(function (b, i) {
        b.disabled = true;
        if (i === q.answer_index) b.classList.add('correct');
        else if (i === choiceIdx) b.classList.add('wrong');
      });

      /* 答題後才揭露雙軌差值算式 */
      var dtd = visualStage.querySelector('dual-track-diff');
      if (dtd) dtd.setAttribute('show-formula', 'true');

      showExplanation(q);
      renderSummary(st, state);
      updateNav();
    }

    function showExplanation(q) {
      var ex = q.explanation || {};
      var tree = ex.breakdown_tree || ex;
      document.getElementById('step1').textContent = '① ' + (tree.step_1 || '');
      document.getElementById('step2').textContent = '② ' + (tree.step_2 || '');
      document.getElementById('step3').textContent = '③ ' + (tree.step_3 || '');
      document.getElementById('formulaTag').textContent = ex.formula || '';
      document.getElementById('trapAlert').textContent = ex.trap_warning ? '⚠️ ' + ex.trap_warning : '';
      explDrawer.classList.add('open');
    }

    /* ── 導航 ── */
    function renderNav(st, state) {
      var prev = document.getElementById('btnPrev');
      var next = document.getElementById('btnNext');
      prev.disabled = state.idx === 0;
      next.disabled = state.idx >= st.questions.length - 1;
      next.textContent = state.idx >= st.questions.length - 1 ? '已是本單元最後一題' : '下一題 →';
    }

    document.getElementById('btnPrev').onclick = function () {
      var state = stationState[currentStation];
      if (state.idx > 0) { state.idx -= 1; render(); }
    };

    document.getElementById('btnNext').onclick = function () {
      var st = STATIONS[currentStation];
      var state = stationState[currentStation];
      if (state.idx < st.questions.length - 1) { state.idx += 1; render(); }
    };

    /* ── 小結 ── */
    function renderSummary(st, state) {
      var ids = Object.keys(state.answers);
      if (!st.questions || ids.length < st.questions.length) {
        summaryCard.classList.remove('show');
        return;
      }
      var correct = st.questions.filter(function (q) {
        return state.answers[q.id] === q.answer_index;
      }).length;
      summaryCard.textContent = '🎉 ' + st.unit + ' ' + st.name + '：' + st.questions.length +
        ' 題全部作答完成，答對 ' + correct + ' 題' +
        (correct === st.questions.length ? '，全對！' : '，可切回前面題號再看詳解。');
      summaryCard.classList.add('show');
    }

    /* 鍵盤左右切題（桌機速驗） */
    document.addEventListener('keydown', function (e) {
      if (loading) return;
      if (e.key === 'ArrowLeft') document.getElementById('btnPrev').click();
      if (e.key === 'ArrowRight') document.getElementById('btnNext').click();
    });

    loadAll();
  </script>
</body>
</html>
