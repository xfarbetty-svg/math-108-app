<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>概念探索小教室 · 028-1 國小數學</title>
<style>
:root {
  --bg: #fff9f0;
  --card: #ffffff;
  --ink: #3d3a34;
  --ink-soft: #8a857b;
  --coral: #ff8a65;
  --coral-deep: #f4694b;
  --mint: #7bc9b2;
  --mint-deep: #48a88b;
  --sky: #7db8e8;
  --sky-deep: #4a94d4;
  --lemon: #ffd166;
  --lemon-deep: #e09f18;
  --line: #f0e7da;
  --shadow: 0 8px 24px rgba(120, 90, 40, 0.08);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html {
  height: 100%;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}
body {
  min-height: 100%;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  position: relative;
  background:
    radial-gradient(circle at 10% 8%, rgba(255, 209, 102, 0.18), transparent 36%),
    radial-gradient(circle at 90% 92%, rgba(123, 200, 178, 0.16), transparent 38%),
    var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  padding: 12px 12px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

.app-wrapper {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ===== 頂部導航與單元切換 ===== */
.header-nav {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.brand-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 800;
  color: var(--ink);
}
.brand-badge {
  background: var(--coral);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.5px;
}
.btn-back-home {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  padding: 4px 10px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

/* 膠囊單元切換按鈕 */
.module-tabs {
  display: flex;
  background: #ede6d8;
  padding: 4px;
  border-radius: 999px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 800;
  border-radius: 999px;
  transition: all 0.2s ease;
  color: var(--ink-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.tab-btn.active {
  background: #ffffff;
  color: var(--coral-deep);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* ===== 卡片通用風格 ===== */
.card-section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-tts {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #fff5ee;
  border: 1px solid #ffd8c7;
  color: var(--coral-deep);
  font-size: 12px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 999px;
  transition: transform 0.15s;
}
.btn-tts:active { transform: scale(0.96); }

/* ===== 故事情境導讀 ===== */
.story-box {
  background: linear-gradient(135deg, #fff9f0 0%, #fff4e3 100%);
  border: 1.5px dashed #ffd166;
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 13.5px;
  line-height: 1.6;
  color: #5a4a32;
}
.story-lead {
  font-weight: 800;
  color: #b56c00;
  margin-bottom: 4px;
}
.magic-code {
  display: inline-block;
  background: #ffffff;
  border: 1.5px solid var(--lemon);
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 800;
  color: #c46e00;
  margin-top: 6px;
}

/* ===== 自由探索沙盒 (Sandbox) ===== */
.sandbox-card {
  gap: 14px;
}
.visual-stage {
  width: 100%;
  background: #faf7f2;
  border-radius: 14px;
  border: 1px solid var(--line);
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.svg-canvas-wrap {
  width: 100%;
  max-width: 320px;
  display: flex;
  justify-content: center;
}
.svg-canvas-wrap svg {
  width: 100%;
  height: auto;
  max-height: 220px;
}

/* 沙盒即時儀表看板 */
.measure-meter {
  width: 100%;
  background: #ffffff;
  border: 2px solid var(--mint);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(123, 200, 178, 0.15);
}
.meter-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
}
.meter-value-big {
  font-size: 19px;
  font-weight: 900;
  color: var(--mint-deep);
  letter-spacing: 0.5px;
}
.meter-value-sub {
  font-size: 13px;
  font-weight: 700;
  color: #557b6f;
}
.speech-bubble {
  background: #eef8f5;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 12px;
  color: #2e6858;
  font-weight: 700;
  margin-top: 4px;
  display: inline-block;
}

/* 物品互動按鈕托盤 */
.items-rack {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}
.rack-title {
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.items-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.item-btn {
  background: #fdfaf6;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 8px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}
.item-btn:hover {
  background: #fff;
  border-color: var(--coral);
}
.item-btn:active {
  transform: scale(0.95);
  background: #fff2ed;
}
.item-icon {
  font-size: 24px;
  line-height: 1;
}
.item-name {
  font-size: 11px;
  font-weight: 800;
  color: var(--ink);
}
.item-weight-tag {
  font-size: 10px;
  font-weight: 700;
  color: var(--coral-deep);
  background: #ffebe5;
  padding: 1px 4px;
  border-radius: 4px;
}

/* 沙盒動作控制列 */
.sandbox-actions {
  display: flex;
  gap: 8px;
  width: 100%;
}
.action-btn {
  flex: 1;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  transition: transform 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.action-btn:active { transform: scale(0.97); }
.btn-reset {
  background: #f0ebe4;
  color: var(--ink);
}
.btn-random {
  background: #eef6fd;
  color: var(--sky-deep);
  border: 1px solid #c9e2fa;
}

/* ===== 3 張生活實戰秘笈小卡 (Flashcards) ===== */
.flashcards-container {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.flashcard-nav {
  display: flex;
  gap: 6px;
  justify-content: center;
}
.dot-btn {
  width: 24px;
  height: 6px;
  border-radius: 999px;
  background: #e0d7c7;
  transition: all 0.2s;
}
.dot-btn.active {
  background: var(--coral);
  width: 32px;
}
.flashcard {
  background: #fdfaf6;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.25s ease;
}
.card-header-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 6px;
  width: fit-content;
}
.badge-blue { background: #e3f2fd; color: #1976d2; }
.badge-orange { background: #fff3e0; color: #e65100; }
.badge-red { background: #ffebee; color: #c62828; }
.flashcard-content {
  font-size: 13px;
  line-height: 1.55;
  color: #4a453e;
}
.flashcard-formula {
  background: #ffffff;
  border: 1px solid #eedec7;
  border-radius: 8px;
  padding: 6px 10px;
  font-weight: 800;
  color: #9c5200;
  font-size: 13.5px;
  margin-top: 4px;
}

/* ===== 信心出發按鈕 ===== */
.start-quiz-btn {
  background: linear-gradient(135deg, var(--coral) 0%, var(--coral-deep) 100%);
  color: #ffffff;
  padding: 14px 20px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 900;
  box-shadow: 0 8px 20px rgba(244, 105, 75, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.start-quiz-btn:active {
  transform: scale(0.98);
  box-shadow: 0 4px 12px rgba(244, 105, 75, 0.25);
}

/* 指針動態旋轉過渡 */
#scale-needle {
  transform-origin: 150px 140px;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#water-surface {
  transition: y 0.5s cubic-bezier(0.25, 1, 0.5, 1), height 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}
</style>
</head>

<div class="app-wrapper">

    <!-- 互動按鈕架 -->
    <div class="items-rack">
      <div class="rack-title">
        <span id="rack-label">點擊將物品放上秤盤：</span>

      </div>
      <div class="items-grid" id="items-grid-container">
        <!-- 動態物品按鈕 -->
      </div>
    </div>

    <!-- 沙盒動作按鈕 -->
    <div class="sandbox-actions">
      <button class="action-btn btn-reset" onclick="resetSandbox()">
        <span>🔄</span>
        <span id="btn-reset-text">清空秤盤</span>
      </button>
      <button class="action-btn btn-random" onclick="randomFillSandbox()">
        <span>🎲</span>
        <span id="btn-random-text">隨機搭配</span>
      </button>
    </div>
  </section>

  <!-- 3. 三張生活實戰秘笈小卡 (Flashcards) -->
  <section class="card-section">
    <div class="section-title-row">
      <div class="section-title">
        <span>💡</span>
        <span>30 秒掌握三大核心秘笈</span>
      </div>
      <div class="flashcard-nav">
        <button class="dot-btn active" id="dot-0" onclick="showCard(0)"></button>
        <button class="dot-btn" id="dot-1" onclick="showCard(1)"></button>
        <button class="dot-btn" id="dot-2" onclick="showCard(2)"></button>
      </div>
    </div>

    <div class="flashcards-container" id="cards-container">

  </section>

  <!-- 4. 信心啟航按鈕 -->
  <button class="start-quiz-btn" onclick="startChallenge()">
    <span>🚀</span>
    <span id="start-btn-text">我懂了！出發挑戰段考真題</span>
  </button>

</div>

let currentMod = "weight";
let currentVal = 0;
let currentCardIdx = 0;

// ===== 初始化 =====
function init() {
  renderModule(currentMod);
}

// 切換單元
function switchModule(modKey) {
  if (currentMod === modKey) return;
  currentMod = modKey;
  currentVal = 0;
  currentCardIdx = 0;
  
  document.getElementById("tab-weight").classList.toggle("active", modKey === "weight");
  document.getElementById("tab-capacity").classList.toggle("active", modKey === "capacity");
  
  renderModule(modKey);
}

// 渲染當前單元內容
function renderModule(modKey) {
  const m = MODULES[modKey];
  
  // 1. 故事導讀
  document.getElementById("story-emoji").textContent = m.storyEmoji;
  document.getElementById("story-title").textContent = m.storyTitle;
  document.getElementById("story-text-box").innerHTML = `
    <div class="story-lead">${m.storyLead}</div>
    <div>${m.storyText}</div>
    <div class="magic-code">${m.magicCode}</div>
  `;
  
  // 2. 沙盒標題與控制
  document.getElementById("sandbox-title").textContent = m.sandboxTitle;
  document.getElementById("meter-label").textContent = m.meterLabel;
  document.getElementById("btn-reset-text").textContent = m.btnResetText;
  document.getElementById("btn-random-text").textContent = m.btnRandomText;
  document.getElementById("rack-label").textContent = m.rackLabel;
  
  // 3. 渲染 SVG 畫布
  renderCanvas(modKey);
  
  // 4. 渲染物品按鈕架
  const grid = document.getElementById("items-grid-container");
  grid.innerHTML = m.items.map(it => `
    <button class="item-btn" onclick="addItem(${it.val}, '${it.name}', '${it.icon}')">
      <span class="item-icon">${it.icon}</span>
      <span class="item-name">${it.name}</span>
      <span class="item-weight-tag">${it.tag}</span>
    </button>
  `).join("");
  
  // 5. 渲染秘笈卡片
  showCard(0);
  
  // 6. 更新度量與指針
  updateMeterDisplay();
  
  // 7. 按鈕文本更新
  document.getElementById("start-btn-text").textContent = `我懂了！出發挑戰【${m.name}】段考真題`;
}

// 物品放入沙盒
let currentItemsOnPlate = [];
function addItem(val, name, icon) {
  const m = MODULES[currentMod];
  if (currentVal + val > m.maxCapacity) {
    // 溫和提示滿了
    document.getElementById("meter-bubble").textContent = `⚠️ 已經裝滿 ${m.maxCapacity} ${m.unitB_en} 囉！先清空再重新玩玩看！`;
    return;
  }
  currentVal += val;
  currentItemsOnPlate.push(icon);
  if (currentItemsOnPlate.length > 5) currentItemsOnPlate.shift();
  updateMeterDisplay(name, val);
}

// 清空沙盒
function resetSandbox() {
  currentVal = 0;
  currentItemsOnPlate = [];
  updateMeterDisplay();
  const m = MODULES[currentMod];
  document.getElementById("meter-bubble").textContent = `💡 已清空！點點看下方物品，放上${currentMod === 'weight' ? '秤盤' : '量杯'}試試看！`;
}

// 隨機放幾樣
function randomFillSandbox() {
  const m = MODULES[currentMod];
  resetSandbox();
  const pickCount = Math.floor(Math.random() * 2) + 2; // 2~3樣
  for (let i = 0; i < pickCount; i++) {
    const item = m.items[Math.floor(Math.random() * (m.items.length - 2))]; // 挑中小物品
    if (currentVal + item.val <= m.maxCapacity) {
      currentVal += item.val;
      currentItemsOnPlate.push(item.icon);
    }
  }
  updateMeterDisplay("隨機驚喜組合", currentVal);
}

// 更新儀表板與視覺動畫
function updateMeterDisplay(lastItemName, addedVal) {
  const m = MODULES[currentMod];
  const rate = m.rate;
  const major = Math.floor(currentVal / rate);
  const minor = currentVal % rate;

  // 1. 數值更新
  document.getElementById("meter-value-primary").textContent = `${major} ${m.unitA} ${minor} ${m.unitB}`;
  document.getElementById("meter-value-secondary").textContent = `＝ ${currentVal} ${m.unitB} (${m.unitB_en})`;

  // 2. 趣味文字泡泡回饋
  const bubble = document.getElementById("meter-bubble");
  if (currentVal === 0) {
    bubble.textContent = `💡 點點看下方物品，放上${currentMod === 'weight' ? '秤盤' : '量杯'}看指針轉動！`;
  } else if (lastItemName) {
    if (major > 0 && minor === 0) {
      bubble.textContent = `🎉 太神奇了！剛好整整 ${major} ${m.unitA}（也就是 ${currentVal} ${m.unitB}）！`;
    } else if (major > 0) {
      bubble.textContent = `✨ 放上【${lastItemName}】，現在超過 ${major} ${m.unitA} 了，指針指向 ${major} ${m.unitA} 又 ${minor} ${m.unitB}！`;
    } else {
      bubble.textContent = `👍 放上【${lastItemName}】(+${addedVal}${m.unitB_en})，現在是 ${minor} ${m.unitB}！`;
    }
  }

  // 3. 視覺動態更新
  if (currentMod === "weight") {
    // 旋轉指針 (3000g = 360度)
    const deg = (currentVal / 3000) * 360;
    const needle = document.getElementById("scale-needle");
    if (needle) {
      needle.style.transform = `rotate(${deg}deg)`;
    }
    const plateText = document.getElementById("plate-items-text");
    if (plateText) {
      plateText.textContent = currentItemsOnPlate.slice(-4).join(" ");
    }
  } else {
    // 容量水面高度 (0 mL = y215 h0, 2000 mL = y55 h160)
    const water = document.getElementById("water-surface");
    const wave = document.getElementById("water-wave");
    if (water && wave) {
      const maxHeight = 160;
      const h = (currentVal / 2000) * maxHeight;
      const y = 215 - h;
      water.setAttribute("y", y);
      water.setAttribute("height", h);
      wave.setAttribute("cy", y);
    }
  }
}

// ===== 秘笈小卡展示 =====
function showCard(idx) {
  currentCardIdx = idx;
  const m = MODULES[currentMod];
  const cardData = m.cards[idx];
  
  // 更新圓點狀態
  for (let i = 0; i < 3; i++) {
    const dot = document.getElementById(`dot-${i}`);
    if (dot) dot.classList.toggle("active", i === idx);
  }
  
  const container = document.getElementById("cards-container");
  container.innerHTML = `
    <div class="flashcard">
      <div class="card-header-badge ${cardData.badgeClass}">${cardData.badge}</div>
      <div style="font-size: 14px; font-weight: 800; color: var(--ink); margin-top: 2px;">${cardData.title}</div>
      <div class="flashcard-content">${cardData.desc}</div>
      <div class="flashcard-formula">${cardData.formula}</div>
    </div>
  `;
}

// ===== 語音導讀 (Web Speech API 臺灣腔 zh-TW) =====
function playVoiceGuide() {
  const m = MODULES[currentMod];
  const textToRead = `${m.storyTitle}。${m.storyLead}。${m.storyText.replace(/<[^>]+>/g, '')}。${m.magicCode}`;
  
  if (!("speechSynthesis" in window)) {
    alert("您的瀏覽器暫不支援自動語音播放，請閱讀卡片導讀文字喔！");
    return;
  }
  
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(textToRead);
  utter.lang = "zh-TW";
  utter.rate = 0.92; // 稍慢、親切
  utter.pitch = 1.1; // 輕快親切兒少口吻
  window.speechSynthesis.speak(utter);
}

// ===== 信心挑戰按鈕 =====
function startChallenge() {
  const m = MODULES[currentMod];
  if (currentMod === "capacity") {
    // 跳轉到已上線的容量單元
    window.location.href = `index.html#${m.code}`;
  } else {
    // 重量單元先彈出自信過關鼓勵
    alert(`🎉 太棒了！你已經掌握了【${m.name}】的核心量感與 $1\\text{kg}=1000\\text{g}$ 的通關密碼！\n\n現在你已經具備滿滿的信心，準備好進入真題修煉囉！`);
  }
}

window.addEventListener("DOMContentLoaded", init);
