<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>白兔米米的數學小教室：12 格長條巧克力（N-3-9 同分母分數）</title>
<style>
  :root {
    --ink: #0f172a;
    --gold: #f1c40f;
    --chalk-gold: #fde68a;
    --blue: #38bdf8;
    --orange: #fb923c;
    --amber: #ffbf00;
    --panel: rgba(15, 23, 42, 0.92);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #1b2a45 0%, #0b1220 55%, #070b14 100%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 14px 12px 18px; gap: 10px;
  }

  /* ---------- 頂部 ---------- */
  .header-bar { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .header-title {
    font-size: clamp(0.9rem, 2vw, 1.22rem); font-weight: 800; color: var(--chalk-gold);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; line-height: 1.25;
  }
  .badge-comfort {
    background: rgba(46, 204, 113, 0.16); border: 1px solid rgba(46, 204, 113, 0.75);
    color: #6ee7a8; padding: 3px 9px; border-radius: 999px;
    font-size: clamp(0.56rem, 1.1vw, 0.72rem); font-weight: 700; letter-spacing: 0.2px;
  }
  .header-unit { font-size: clamp(0.6rem, 1.1vw, 0.82rem); color: #94a3b8; text-align: right; white-space: nowrap; }
  .counter-pill {
    width: 100%; max-width: 1000px; background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px;
    padding: 6px 10px; display: flex; align-items: center; justify-content: space-around; gap: 6px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
  }
  .counter-item { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
  .counter-label { font-size: clamp(0.5rem, 1vw, 0.64rem); color: #94a3b8; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .counter-val { font-size: clamp(0.78rem, 1.7vw, 1.08rem); font-weight: 800; color: var(--chalk-gold); font-variant-numeric: tabular-nums; line-height: 1.15; }
  .counter-val.blue { color: var(--blue); }
  .counter-val.orange { color: var(--orange); }
  .counter-sep { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.14); flex: 0 0 auto; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .dot.blue { background: var(--blue); box-shadow: 0 0 6px rgba(56, 189, 248, 0.9); }
  .dot.orange { background: var(--orange); box-shadow: 0 0 6px rgba(251, 146, 60, 0.9); }
  .dot.dark { background: #334155; box-shadow: inset 0 0 0 1px #64748b; }

  /* ==================================================================
     一體化教室舞台：單一空間，無 48:52 硬分割
     水平分帶（幾何零遮擋）：
       米米 x∈[1%,27%]  |  講台 x∈[29%,42%]  |  黑板 x∈[44%,98%]
     z-index：底圖 0 < 光 1 < 黑板 2 < 講台 3 < 米米 5 < 氣泡 6 < 字幕 8
     ================================================================== */
  .stage-wrapper {
    position: relative; width: 100%; max-width: 1000px;
    height: clamp(240px, 44vw, 420px);
    border-radius: 16px; overflow: hidden; background: #d9b383;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    isolation: isolate;
  }
  .classroom-wall {
    position: absolute; left: 0; right: 0; top: 0; height: 74%; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, #f8e9c9 0%, #efd9b0 70%, #e2c79a 100%);
    box-shadow: inset 0 -8px 18px rgba(90, 50, 20, 0.16);
  }
  .classroom-wall::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 20%;
    background: repeating-linear-gradient(90deg, #d9b383 0 26px, #c9a06f 26px 28px);
    border-top: 3px solid #b98a55;
  }
  .classroom-floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26%; z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, rgba(84, 47, 18, 0.18) 0 1px, transparent 1px 38px),
      repeating-linear-gradient(0deg, #c68f5c 0 26px, #ad7442 26px 29px, #c9945f 29px 55px, #ad7442 55px 58px),
      linear-gradient(180deg, #d9ab77, #a46f3f);
  }
  .classroom-glow {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 52% at 50% -8%, rgba(255, 246, 214, 0.55) 0%, rgba(255, 246, 214, 0) 72%),
      radial-gradient(ellipse 74% 34% at 50% 100%, rgba(60, 28, 8, 0.3) 0%, rgba(60, 28, 8, 0) 72%);
  }

  /* 掛牆教室黑板（往中間聚攏居中，left: 37%，絕不遮擋米米） */
  .blackboard {
    position: absolute; z-index: 2;
    left: 37%; right: 4%; top: 7%; bottom: 27%;
    border: clamp(5px, 1vw, 10px) solid #8a5a2b; border-radius: 8px;
    background: linear-gradient(160deg, rgba(32, 60, 48, 0.97), rgba(17, 37, 29, 0.98));
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.42), inset 0 0 0 2px rgba(253, 230, 138, 0.18), inset 0 0 26px rgba(0, 0, 0, 0.32);
    padding: clamp(5px, 1vw, 12px) clamp(6px, 1.2vw, 14px);
    display: flex; flex-direction: column; justify-content: center; gap: clamp(4px, 0.9vw, 10px);
    overflow: visible;
  }
  .blackboard::after {
    content: ''; position: absolute; left: -3%; right: -3%; bottom: -11px; height: 10px;
    background: linear-gradient(180deg, #a9723a, #7d4f24); border-radius: 0 0 4px 4px;
    box-shadow: 0 3px 5px rgba(0, 0, 0, 0.42); pointer-events: none;
  }
  .board-title {
    font-size: clamp(0.66rem, 1.55vw, 1.06rem); font-weight: 800; color: #f8fafc;
    letter-spacing: 0.4px; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; gap: 4px; flex: 0 0 auto; line-height: 1.2;
  }
  .choc-bar-wrap { position: relative; width: 100%; flex: 0 0 auto; }
  .choc-bar {
    position: relative; display: flex; gap: 2px; width: 100%;
    height: clamp(28px, 4vw, 52px); padding: 3px; border-radius: 8px; background: #43230c;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 6px 12px -4px rgba(0, 0, 0, 0.55);
  }
  .seg {
    flex: 1 1 0; min-width: 0; position: relative; border-radius: 3px;
    transition: filter 0.35s ease, box-shadow 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .seg::after {
    content: ''; position: absolute; inset: 1px 1px 42%; border-radius: 2px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0)); pointer-events: none;
  }
  .seg.blue { background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 52%, #0284c7 100%); box-shadow: inset 0 -3px 0 rgba(3, 105, 161, 0.55); }
  .seg.orange { background: linear-gradient(180deg, #fdba74 0%, #fb923c 52%, #ea580c 100%); box-shadow: inset 0 -3px 0 rgba(154, 52, 18, 0.55); }
  .seg.dark { background: linear-gradient(180deg, #5b6b82 0%, #334155 56%, #1e293b 100%); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.55); }
  .seg.lit { filter: brightness(1.18) saturate(1.1); }
  .seg.lit.blue { box-shadow: inset 0 -3px 0 rgba(3, 105, 161, 0.55), 0 0 12px rgba(56, 189, 248, 0.95); }
  .seg.lit.orange { box-shadow: inset 0 -3px 0 rgba(154, 52, 18, 0.55), 0 0 12px rgba(251, 146, 60, 0.95); }
  .seg.pop { animation: segPop 0.5s ease; }
  @keyframes segPop { 0% { transform: translateY(0) scale(1); } 45% { transform: translateY(-4px) scale(1.06); } 100% { transform: translateY(0) scale(1); } }
  .choc-labels {
    display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 2px; width: 100%;
    margin-top: 3px; padding: 0 3px;
    font-size: clamp(0.48rem, 1vw, 0.72rem); font-weight: 800; line-height: 1.2;
  }
  .lbl { white-space: nowrap; text-align: center; opacity: 0; transform: translateY(-2px); transition: opacity 0.4s ease, transform 0.4s ease; }
  .lbl.show { opacity: 1; transform: translateY(0); }
  .lbl.blue-lbl { color: #7dd3fc; }
  .lbl.orange-lbl { color: #fdba74; }
  .choc-legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 8px;
    font-size: clamp(0.46rem, 0.98vw, 0.66rem); color: #d7e3dc; font-weight: 700; line-height: 1.25; flex: 0 0 auto;
  }
  .choc-legend span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  .focus-ring {
    position: absolute; left: 83.333%; top: 50%;
    width: clamp(38px, 6vw, 74px); height: clamp(38px, 6vw, 74px);
    border-radius: 50%; border: 2px solid rgba(241, 196, 15, 0.9);
    background: radial-gradient(circle, rgba(241, 196, 15, 0.26) 0%, rgba(241, 196, 15, 0.05) 68%, transparent 100%);
    box-shadow: 0 0 18px rgba(241, 196, 15, 0.55); transform: translate(-50%, -50%);
    pointer-events: none; opacity: 0; transition: opacity 0.4s ease; z-index: 5;
  }
  .focus-ring.on { opacity: 1; animation: focusPulse 2s ease-in-out infinite; }
  @keyframes focusPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.82; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }
  .board-center { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; flex: 0 0 auto; text-align: center; }
  .unit-note {
    font-size: clamp(0.78rem, 1.9vw, 1.3rem); font-weight: 900; color: #fff7cc;
    text-shadow: 0 0 14px rgba(253, 230, 138, 0.85), 0 1px 0 rgba(0, 0, 0, 0.4);
    opacity: 0; transform: scale(0.96); transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .unit-note.show { opacity: 1; transform: scale(1); animation: glowPulse 2.2s ease-in-out infinite; }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 10px rgba(253, 230, 138, 0.7), 0 1px 0 rgba(0, 0, 0, 0.4); }
    50% { text-shadow: 0 0 20px rgba(253, 230, 138, 1), 0 0 6px rgba(241, 196, 15, 0.9), 0 1px 0 rgba(0, 0, 0, 0.4); }
  }
  .equation-big { font-size: clamp(0.8rem, 2.1vw, 1.6rem); font-weight: 900; color: #f8fafc; line-height: 1.3; letter-spacing: 0.2px; white-space: nowrap; }
  .foundation {
    display: inline-block; color: #fff3c4; font-weight: 900; padding: 0 3px;
    border: 2px solid var(--gold); border-bottom-width: 4px; border-radius: 4px;
    background: rgba(241, 196, 15, 0.2); box-shadow: 0 0 10px rgba(241, 196, 15, 0.7);
    position: relative;
  }
  .foundation::before {
    content: '🔒'; position: absolute; left: 50%; top: -0.95em; transform: translateX(-50%);
    font-size: 0.5em; line-height: 1; text-shadow: 0 0 4px #000;
  }
  .eq-note {
    font-size: clamp(0.5rem, 1.05vw, 0.76rem); font-weight: 700; color: #fef3c7;
    background: rgba(241, 196, 15, 0.12); border: 1px solid rgba(253, 230, 138, 0.45);
    border-radius: 999px; padding: 2px 8px; margin-top: 2px;
  }
  .quiz-card {
    width: 100%; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 9px; padding: clamp(4px, 0.9vw, 9px) clamp(6px, 1.1vw, 12px); text-align: center; flex: 0 0 auto;
  }
  .quiz-q { font-size: clamp(0.6rem, 1.35vw, 0.92rem); font-weight: 800; color: #e0f2fe; line-height: 1.35; margin-bottom: 5px; }
  .quiz-opts { display: flex; justify-content: center; gap: 8px; }
  .quiz-opt {
    flex: 1 1 0; min-height: 30px; border: 1px solid rgba(253, 230, 138, 0.55);
    background: rgba(15, 23, 42, 0.45); color: #f8fafc; border-radius: 8px;
    font-family: inherit; font-size: clamp(0.66rem, 1.4vw, 0.94rem); font-weight: 800;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 2px;
    padding: 3px 5px; transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .quiz-opt:hover { background: rgba(253, 230, 138, 0.18); }
  .quiz-opt:active { transform: scale(0.97); }
  .quiz-opt.picked-correct { background: rgba(46, 204, 113, 0.32); border-color: #2ecc71; color: #d1fae5; }
  .quiz-opt.picked-wrong { background: rgba(239, 68, 68, 0.3); border-color: #ef4444; color: #fee2e2; }
  .quiz-fb { margin-top: 4px; font-size: clamp(0.5rem, 1.05vw, 0.72rem); font-weight: 800; line-height: 1.3; min-height: 1.1em; color: #cbd5e1; }
  .quiz-fb.ok { color: #6ee7a8; }
  .quiz-fb.no { color: #fca5a5; }
  .finale-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex: 0 0 auto; }
  .medal {
    font-size: clamp(0.62rem, 1.4vw, 0.94rem); font-weight: 900; color: #fff3c4;
    text-shadow: 0 0 12px rgba(241, 196, 15, 0.9); white-space: nowrap;
  }
  .challenge-btn {
    border: 1px solid var(--chalk-gold); background: rgba(241, 196, 15, 0.22); color: #fffbeb;
    border-radius: 999px; padding: 4px 10px; font-family: inherit;
    font-size: clamp(0.58rem, 1.25vw, 0.84rem); font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .challenge-btn:hover { background: rgba(241, 196, 15, 0.4); }

  /* 講台：介於米米與黑板之間，z=3 */
  .podium {
    position: absolute; z-index: 3; left: 29%; width: 7%; bottom: 18%; height: 26%;
    border-radius: 3px 3px 2px 2px;
    background: linear-gradient(180deg, #b88147 0%, #9a6837 42%, #7d4f24 100%);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.22), 0 8px 14px rgba(0, 0, 0, 0.42);
    pointer-events: none;
  }
  .podium::before {
    content: ''; position: absolute; left: -10%; right: -10%; top: -7%; height: 14%;
    background: linear-gradient(180deg, #d19a5c, #a06d36); border-radius: 4px;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.35);
  }
  .podium::after {
    content: ''; position: absolute; left: 22%; right: 22%; top: 24%; height: 46%;
    background: rgba(60, 32, 10, 0.22); border-radius: 2px;
  }

  /* 米米：原廠 3D 黏土高清底圖為唯一視覺錨點（mimi_front_1024.png），z=5，與黑板幾何零重疊 */
  .mimi-zone {
    position: absolute; z-index: 5; left: 4%; width: 32%; bottom: 25%; height: 64%;
    display: flex; align-items: flex-end; justify-content: center; pointer-events: none;
  }
  .mimi-wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
  /* 原廠 3D 黏土米米本尊：完整還原琥珀大眼／櫻花粉耳／粉嫩小鼻／薄荷綠吊帶褲（附木釦） */
  .mimi-anchor {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    object-fit: cover; object-position: 65% center;
    -webkit-mask-image: radial-gradient(ellipse 92% 96% at 50% 56%, #000 62%, transparent 100%);
    mask-image: radial-gradient(ellipse 92% 96% at 50% 56%, #000 62%, transparent 100%);
    transform-origin: 50% 82%;
    filter: drop-shadow(0 12px 10px rgba(70, 34, 10, 0.42));
    will-change: transform, filter;
  }
  /* 純淨自然的微表情：說話呼吸微動／答對歡呼雀躍／答錯好奇歪頭 */
  .mimi-wrap.speaking .mimi-anchor { animation: mimiBreathe 2.4s ease-in-out infinite; }
  .mimi-wrap.cheer .mimi-anchor { animation: mimiCheer 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2; }
  .mimi-wrap.tilt .mimi-anchor { animation: mimiTilt 0.55s ease-in-out 2; }
  @keyframes mimiBreathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.012); }
  }
  @keyframes mimiCheer {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
    55% { transform: translateY(-8px) scale(1.05) rotate(-1.5deg); }
  }
  @keyframes mimiTilt {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    50% { transform: rotate(-4deg) translateY(-1px); }
  }
  .mimi-speech-bubble {
    display: none !important; /* 一體化舞台：台詞由底部字幕承接，氣泡绝不壓在米米頭上 */
    position: absolute; z-index: 6; left: 1%; top: 4%; width: 40%; max-width: 40%;
    background: rgba(255, 255, 255, 0.97); color: var(--ink); border-radius: 14px;
    padding: 6px 10px; font-size: clamp(0.56rem, 1.25vw, 0.88rem); font-weight: 800; line-height: 1.35;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.38), 0 0 0 2px var(--gold);
    animation: bubbleBounce 3.2s ease-in-out infinite;
  }
  .mimi-speech-bubble::after {
    content: ''; position: absolute; bottom: -8px; right: 18%;
    border-width: 9px 8px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.97) transparent transparent;
  }
  @keyframes bubbleBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

  /* 字幕條 */
  .caption-banner {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 94%; background: rgba(11, 18, 32, 0.9); border: 1px solid rgba(253, 230, 138, 0.32);
    border-radius: 10px; padding: 6px 12px; text-align: center;
    font-size: clamp(0.58rem, 1.3vw, 0.92rem); font-weight: 700; line-height: 1.35; color: #ffffff;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55); z-index: 8;
  }
  .caption-banner.speaking { box-shadow: 0 0 0 2px rgba(253, 230, 138, 0.45), 0 10px 22px rgba(0, 0, 0, 0.55); border-color: rgba(253, 230, 138, 0.72); }
  .mimi-speech-bubble.speaking { box-shadow: 0 10px 22px rgba(0, 0, 0, 0.38), 0 0 0 2px var(--gold), 0 0 14px rgba(241, 196, 15, 0.35); }
  .mimi-wrap.speaking .mimi-anchor { filter: drop-shadow(0 12px 10px rgba(70, 34, 10, 0.42)) drop-shadow(0 0 10px rgba(253, 230, 138, 0.42)); }

  /* ---------- 控制列 ---------- */
  .controls-panel {
    width: 100%; max-width: 1000px; background: #16233a; border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px; padding: 9px 12px; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }
  .timeline-container { display: flex; align-items: center; gap: 8px; }
  .time-label { font-size: clamp(0.56rem, 1.1vw, 0.74rem); font-family: ui-monospace, Consolas, monospace; color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .timeline-bar { flex: 1; height: 8px; background: #334155; border-radius: 999px; position: relative; cursor: pointer; touch-action: none; }
  .timeline-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #f59e0b, #ef4444); pointer-events: none; }
  .timeline-fill::after {
    content: ''; position: absolute; right: -5px; top: 50%; width: 11px; height: 11px;
    border-radius: 50%; background: #fde68a; transform: translateY(-50%); box-shadow: 0 0 8px rgba(253, 230, 138, 0.9);
  }
  .buttons-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .playback-btns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: #2b3d5c; color: #fff; border: none; padding: 6px 12px; min-height: 32px; border-radius: 8px;
    font-family: inherit; font-size: clamp(0.62rem, 1.2vw, 0.86rem); font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s, transform 0.15s; white-space: nowrap;
  }
  .btn:hover { background: #3b5175; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #f59e0b; color: #1a1005; }
  .btn-primary:hover { background: #fbbf24; }
  .phase-selectors { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-chip {
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14); color: #cbd5e1;
    padding: 5px 10px; min-height: 30px; border-radius: 7px; font-family: inherit;
    font-size: clamp(0.56rem, 1.1vw, 0.76rem); font-weight: 700; cursor: pointer; white-space: nowrap;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .btn-chip:hover { background: rgba(255, 255, 255, 0.14); }
  .btn-chip.active { background: var(--chalk-gold); border-color: var(--chalk-gold); color: #0f172a; font-weight: 800; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    body { padding: 8px 6px 10px; gap: 7px; justify-content: flex-start; }
    .header-bar { align-items: flex-start; }
    .header-unit { display: none; }
    .counter-pill { padding: 5px 6px; border-radius: 10px; }
    .counter-label { font-size: 0.5rem; gap: 3px; }
    .counter-val { font-size: 0.82rem; }
    .counter-sep { height: 18px; }
    .stage-wrapper { height: 244px; border-radius: 12px; }
    .mimi-speech-bubble { padding: 4px 6px; border-radius: 11px; top: 3%; }
    .blackboard { gap: 3px; }
    .choc-bar { height: 28px; }
    .controls-panel { padding: 7px 8px; gap: 6px; border-radius: 11px; }
    .btn { min-height: 34px; padding: 5px 9px; }
    .btn-chip { min-height: 30px; padding: 4px 7px; }
    .phase-selectors { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .btn-chip { width: 100%; text-align: center; }
    .playback-btns { width: 100%; }
    .playback-btns .btn { flex: 1 1 0; justify-content: center; }
    .time-label { font-size: 0.56rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mimi-anchor, .mimi-wrap.speaking .mimi-anchor, .mimi-wrap.cheer .mimi-anchor,
    .mimi-wrap.tilt .mimi-anchor, .mimi-speech-bubble, .focus-ring.on, .unit-note.show { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="header-bar">
    <div class="header-title">
      <span>🐰 白兔米米的數學小教室</span>
      <span class="badge-comfort">🎬 一體化教室情境劇院 · N-3-9</span>
    </div>
    <div class="header-unit">N-3-9 簡單同分母分數：3/12 + 7/12 = 10/12</div>
  </div>

  <div class="counter-pill" role="status" aria-live="polite">
    <div class="counter-item"><span class="counter-label"><i class="dot blue"></i>米米藍塊</span><span class="counter-val blue" id="cntBlue">3</span></div>
    <div class="counter-sep"></div>
    <div class="counter-item"><span class="counter-label"><i class="dot orange"></i>朋友橘塊</span><span class="counter-val orange" id="cntOrange">7</span></div>
    <div class="counter-sep"></div>
    <div class="counter-item"><span class="counter-label">總計</span><span class="counter-val" id="cntTotal">10</span></div>
    <div class="counter-sep"></div>
    <div class="counter-item"><span class="counter-label">分數</span><span class="counter-val" id="cntFraction">—</span></div>
  </div>

  <!-- 一體化教室舞台（無 48:52 分割） -->
  <div class="stage-wrapper" id="stageWrapper">
    <div class="classroom-wall" aria-hidden="true"></div>
    <div class="classroom-floor" aria-hidden="true"></div>
    <div class="classroom-glow" aria-hidden="true"></div>

    <!-- 右側：掛牆黑板（教具與算式都在這裡） -->
    <div class="blackboard" id="blackboard">
      <div class="board-title">🍫 12 格長條巧克力</div>
      <div class="choc-bar-wrap">
        <div class="choc-bar" id="chocBar" role="img" aria-label="一條平分成 12 塊的巧克力：前 3 塊藍色、中間 7 塊橘色、最後 2 塊深灰色">
          <div class="focus-ring" id="focusRing" aria-hidden="true"></div>
        </div>
        <div class="choc-labels" id="chocLabels">
          <div class="lbl blue-lbl" id="lblBlue" style="grid-column: 1 / span 3;">3/12 條</div>
          <div class="lbl orange-lbl" id="lblOrange" style="grid-column: 4 / span 7;">7/12 條</div>
        </div>
      </div>
      <div class="choc-legend">
        <span><i class="dot blue"></i>米米 3 塊</span>
        <span><i class="dot orange"></i>朋友 7 塊</span>
        <span><i class="dot dark"></i>剩下 2 塊</span>
      </div>
      <div class="board-center" id="boardCenter">
        <div class="unit-note" id="unitNote">每一塊 = 1/12 條</div>
        <div class="equation-wrap" id="equationWrap" hidden>
          <div class="equation-big" id="equationBig"></div>
          <div class="eq-note" id="eqNote">分母 12 是地基，永遠不變</div>
        </div>
        <div class="quiz-card" id="quizCard" hidden>
          <div class="quiz-q" id="quizQ">請在黑板上點選正確答案：合起來是幾條呢？</div>
          <div class="quiz-opts">
            <button class="quiz-opt" type="button" id="optCorrect" data-ans="correct" aria-label="回答 12 分之 10 條">10/12 條</button>
            <button class="quiz-opt" type="button" id="optWrong" data-ans="wrong" aria-label="回答 24 分之 10 條">10/24 條</button>
          </div>
          <div class="quiz-fb" id="quizFb" role="status" aria-live="polite"></div>
        </div>
        <div class="finale-row" id="finaleRow" hidden>
          <span class="medal" id="medal">🏅 十二分之十條！</span>
          <button class="challenge-btn" type="button" id="challengeBtn">進入挑戰 →</button>
        </div>
      </div>
    </div>

    <!-- 中間：講台 -->
    <div class="podium" id="podium" aria-hidden="true"></div>

    <!-- 左側：米米老師原廠 3D 黏土高清底圖（唯一視覺錨點），與黑板幾何零重疊 -->
    <div class="mimi-speech-bubble" id="mimiBubble">🐰 哈囉小朋友！今天我們有一條平分成 12 塊的巧克力喔！</div>
    <div class="mimi-zone" id="mimiZone">
      <div class="mimi-wrap" id="mimiWrap">
        <img id="mimiAnchor" class="mimi-anchor" src="assets_hosts/g3_mimi/textures/mimi_front_1024.png" alt="原廠 3D 黏土白兔米米老師" aria-hidden="true">
      </div>
    </div>

    <div class="caption-banner" id="captionText" role="status" aria-live="polite">
      嗨！小朋友，我是米米！你看，我這裡有一條超好吃的巧克力！
    </div>
  </div>

  <div class="controls-panel">
    <div class="timeline-container">
      <span class="time-label" id="timeLabel">00:00</span>
      <div class="timeline-bar" id="timelineBar" role="slider" tabindex="0" aria-label="播放進度" aria-valuemin="0" aria-valuemax="85" aria-valuenow="0">
        <div class="timeline-fill" id="timelineFill"></div>
      </div>
      <span class="time-label" id="totalTimeLabel" style="color:#94a3b8;">01:24</span>
    </div>
    <div class="buttons-row">
      <div class="playback-btns">
        <button class="btn btn-primary" id="btnPlayPause" type="button">▶ 播放</button>
        <button class="btn" id="btnRestart" type="button">↺ 重頭演繹</button>
        <button class="btn" id="btnAudioToggle" type="button">🔊 音效: 開</button>
      </div>
      <div class="phase-selectors">
        <button class="btn-chip active" type="button" data-phase="0">① 情境導入</button>
        <button class="btn-chip" type="button" data-phase="1">② 單位分數</button>
        <button class="btn-chip" type="button" data-phase="2">③ 核心算理</button>
        <button class="btn-chip" type="button" data-phase="3">④ 總結互動</button>
      </div>
    </div>
  </div>

<script>
  'use strict';

  const SEG_COUNT = 12;
  const TIMELINE_PATH = 'audio/g3_n39_timeline.json';

  /* 預設值 = ffprobe 實測 mp3 時長按比例映射至全集 84.74s；JSON 載入後覆寫 */
  const DEFAULT_ACTS = [
    { act: 1, id: 'act1', title: '情境導入', file: 'audio/act1.mp3', start: 0.0, duration: 22.35, end: 22.35 },
    { act: 2, id: 'act2', title: '單位分數', file: 'audio/act2.mp3', start: 22.35, duration: 20.22, end: 42.57 },
    { act: 3, id: 'act3', title: '核心算理', file: 'audio/act3.mp3', start: 42.57, duration: 25.17, end: 67.74 },
    { act: 4, id: 'act4', title: '總結互動', file: 'audio/act4.mp3', start: 67.74, duration: 17.00, end: 84.74 }
  ];
  const TIMELINE = { full: 'audio/g3_n39_hsiaochen.mp3', acts: DEFAULT_ACTS.map((a) => Object.assign({}, a)) };
  let FULL_DURATION = TIMELINE.acts[3].end;

  let playMode = 'full', actIndex = 0, isPlaying = false, seeking = false;
  let lastPhase = -1, quizAnswered = null;

  /* 圖示標示 / 字幕。字幕內文由 JSON 的 text 覆寫（SSOT） */
  const PHASES = [
    { bubble: '🐰 我是米米！一條巧克力平分成 12 塊喔！',
      caption: '嗨！小朋友，我是米米！你看，我這裡有一條超好吃的巧克力！我們把它平分成 12 塊。我拿了其中的 3 塊，好朋友拿了 7 塊！嘿嘿，你有沒有發現，我們兩個人合起來，到底是拿了這整條巧克力的幾分之幾呢？' },
    { bubble: '🐰 1、2、3⋯⋯到 10！每一塊是 1/12 條！',
      caption: '我們來數數看喔！3 塊加上 7 塊，1、2、3……到 10！總共是 10 塊！但是，我們要怎麼用「分數」記下來呢？別忘了，整條巧克力原本平分成了 12 塊，所以每一小塊，都是「十二分之一」條喔！' },
    { bubble: '🐰 分母 12 是地基，永不改變！',
      caption: '所以呀，米米的 3 塊就是十二分之三條，好朋友的 7 塊就是十二分之七條。合起來的 10 塊，就是 12 塊裡面的 10 塊，也就是——「十二分之十」條！小朋友注意看：分母 12 代表「一整條平分幾塊」，它就像房子的地基，是絕對不會變的！我們只要把上面的分子加起來就好囉！' },
    { bubble: '🐰 分母看平分幾份，分子看拿走幾份！',
      caption: '太棒了！答案就是十二分之十條！記住米米的祕笈：「分母看平分幾份，分子看拿走幾份」！你已經把分數相加的祕密完全搞懂囉！換你動手挑戰看看吧，掰掰！' }
  ];

  const $ = (id) => document.getElementById(id);
  const mimiBubble = $('mimiBubble'), mimiWrap = $('mimiWrap'), mimiAnchor = $('mimiAnchor');
  const captionText = $('captionText');
  const cntBlue = $('cntBlue'), cntOrange = $('cntOrange'), cntTotal = $('cntTotal'), cntFraction = $('cntFraction');
  const chocBar = $('chocBar'), focusRing = $('focusRing'), lblBlue = $('lblBlue'), lblOrange = $('lblOrange');
  const unitNote = $('unitNote'), equationWrap = $('equationWrap'), equationBig = $('equationBig');
  const quizCard = $('quizCard'), quizFb = $('quizFb'), finaleRow = $('finaleRow');
  const optCorrect = $('optCorrect'), optWrong = $('optWrong'), quizOpts = [optCorrect, optWrong];
  const timeLabel = $('timeLabel'), totalTimeLabel = $('totalTimeLabel');
  const timelineBar = $('timelineBar'), timelineFill = $('timelineFill');
  const btnPlayPause = $('btnPlayPause'), btnRestart = $('btnRestart'), btnAudioToggle = $('btnAudioToggle');
  const phaseChips = Array.from(document.querySelectorAll('.btn-chip'));
  const audio = new Audio();
  audio.preload = 'auto';

  /* ---------- 12 等分巧克力 ---------- */
  const segEls = Array.from({ length: SEG_COUNT }, (_, i) => {
    const kind = i < 3 ? 'blue' : (i < 10 ? 'orange' : 'dark');
    const el = document.createElement('div');
    el.className = `seg ${kind}`;
    el.dataset.kind = kind;
    el.dataset.index = String(i + 1);
    el.setAttribute('aria-hidden', 'true');
    chocBar.insertBefore(el, focusRing);
    return el;
  });

  const FOUNDATION = (n) => `<span class="foundation">${n}</span>`;
  const equationHTML =
    `<span style="color:#38bdf8;">3</span>/${FOUNDATION(12)}` +
    ` + <span style="color:#fb923c;">7</span>/${FOUNDATION(12)}` +
    ` = <span style="color:#f1c40f;">10</span>/${FOUNDATION(12)}`;

  function formatTime(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  function getTotalSeconds() { return playMode === 'act' ? TIMELINE.acts[actIndex].duration : FULL_DURATION; }
  function phaseIndexFull(t) {
    for (let i = 0; i < TIMELINE.acts.length; i++) if (t < TIMELINE.acts[i].end) return i;
    return TIMELINE.acts.length - 1;
  }
  function currentPhase(t) { return playMode === 'act' ? actIndex : phaseIndexFull(t); }
  function setSpeaking(on) {
    mimiWrap.classList.toggle('speaking', !!on);
    captionText.classList.toggle('speaking', !!on);
    mimiBubble.classList.toggle('speaking', !!on);
  }
  function updatePlayButton() {
    btnPlayPause.textContent = isPlaying ? '⏸ 暫停' : '▶ 播放';
    btnPlayPause.classList.toggle('btn-primary', !isPlaying);
  }
  function clearMimiReaction() { mimiWrap.classList.remove('cheer', 'tilt'); }
  function resetQuiz() {
    quizAnswered = null; quizFb.textContent = ''; quizFb.className = 'quiz-fb';
    quizOpts.forEach((b) => { b.classList.remove('picked-correct', 'picked-wrong'); b.disabled = false; });
  }

  /* 原廠 3D 黏土高清底圖為唯一視覺錨點：不受幕次切換影響，僅以 CSS 微動態回應劇情 */
  mimiAnchor.addEventListener('animationend', (e) => {
    if (e.animationName === 'mimiCheer' || e.animationName === 'mimiTilt') clearMimiReaction();
  });

  function applyPhaseVisuals(phase) {
    phaseChips.forEach((chip, i) => chip.classList.toggle('active', i === phase));
    const cfg = PHASES[phase];
    if (!(phase === 3 && quizAnswered !== null)) mimiBubble.textContent = cfg.bubble;
    captionText.textContent = cfg.caption;

    cntBlue.textContent = '3'; cntOrange.textContent = '7'; cntTotal.textContent = '10';
    cntFraction.textContent = phase >= 1 ? '10/12' : '—';

    segEls.forEach((el, i) => {
      const taken = i < 10;
      el.classList.toggle('lit', taken);
      const pop = phase === 0 ? taken : (phase === 1 ? i === 9 : (phase === 2 ? taken : false));
      el.classList.toggle('pop', pop);
    });
    focusRing.classList.toggle('on', phase >= 1);
    lblBlue.classList.toggle('show', phase >= 1);
    lblOrange.classList.toggle('show', phase >= 1);

    unitNote.classList.remove('show');
    equationWrap.hidden = true;
    quizCard.hidden = true;
    finaleRow.hidden = true;

    if (phase === 1) {
      unitNote.textContent = '每一塊 = 1/12 條';
      unitNote.classList.add('show');
    } else if (phase === 2) {
      equationBig.innerHTML = equationHTML;
      equationWrap.hidden = false;
    } else if (phase === 3) {
      quizCard.hidden = false;
      finaleRow.hidden = false;
      if (quizAnswered === null) { quizFb.textContent = ''; quizFb.className = 'quiz-fb'; }
    }
  }

  function renderFrame(t) {
    const total = getTotalSeconds();
    const clamped = Math.max(0, Math.min(total, t || 0));
    const phase = currentPhase(clamped);
    timeLabel.textContent = formatTime(clamped);
    totalTimeLabel.textContent = formatTime(total);
    timelineFill.style.width = total > 0 ? `${(clamped / total) * 100}%` : '0%';
    timelineBar.setAttribute('aria-valuemax', String(Math.ceil(total)));
    timelineBar.setAttribute('aria-valuenow', String(Math.round(clamped)));
    if (phase !== lastPhase) {
      if (lastPhase === 3 && phase !== 3) { resetQuiz(); clearMimiReaction(); }
      if (phase !== 3) clearMimiReaction();
      lastPhase = phase;
    }
    applyPhaseVisuals(phase);
  }

  function pausePlay(updateUi) {
    isPlaying = false;
    try { audio.pause(); } catch (e) {}
    setSpeaking(false);
    if (updateUi !== false) updatePlayButton();
  }
  async function playFromCurrent() {
    const total = getTotalSeconds();
    if (audio.currentTime >= total - 0.05 && total > 0) audio.currentTime = 0;
    try {
      await audio.play(); isPlaying = true; setSpeaking(true); updatePlayButton();
    } catch (e) { isPlaying = false; setSpeaking(false); updatePlayButton(); }
  }
  function seek(t) {
    const total = getTotalSeconds();
    const clamped = Math.max(0, Math.min(total, t || 0));
    try { audio.currentTime = clamped; } catch (e) {}
    renderFrame(clamped);
  }
  function setMode(mode, idx) {
    playMode = mode; actIndex = typeof idx === 'number' ? idx : 0;
    const src = playMode === 'full' ? TIMELINE.full : TIMELINE.acts[actIndex].file;
    if (audio.getAttribute('src') !== src) audio.src = src;
    try { audio.currentTime = 0; } catch (e) {}
  }
  function restartShow() {
    pausePlay(); resetQuiz(); clearMimiReaction(); lastPhase = -1;
    setMode('full', 0); renderFrame(0);
    playFromCurrent();
  }

  btnPlayPause.addEventListener('click', () => {
    if (isPlaying) { pausePlay(); return; }
    const src = playMode === 'full' ? TIMELINE.full : TIMELINE.acts[actIndex].file;
    if (audio.getAttribute('src') !== src) audio.src = src;
    playFromCurrent();
  });
  btnRestart.addEventListener('click', restartShow);
  btnAudioToggle.addEventListener('click', () => {
    audio.muted = !audio.muted;
    btnAudioToggle.textContent = audio.muted ? '🔇 音效: 關' : '🔊 音效: 開';
  });
  audio.addEventListener('timeupdate', () => { if (!seeking) renderFrame(audio.currentTime || 0); });
  audio.addEventListener('ended', () => {
    isPlaying = false; setSpeaking(false); updatePlayButton(); renderFrame(getTotalSeconds());
  });
  audio.addEventListener('pause', () => {
    if (!audio.ended) { isPlaying = false; setSpeaking(false); updatePlayButton(); }
  });
  audio.addEventListener('play', () => { isPlaying = true; setSpeaking(true); updatePlayButton(); });

  function seekFromEvent(e) {
    const rect = timelineBar.getBoundingClientRect();
    seek(((e.clientX - rect.left) / rect.width) * getTotalSeconds());
  }
  timelineBar.addEventListener('pointerdown', (e) => { seeking = true; timelineBar.setPointerCapture(e.pointerId); seekFromEvent(e); });
  timelineBar.addEventListener('pointermove', (e) => { if (seeking) seekFromEvent(e); });
  const endSeek = (e) => {
    if (!seeking) return;
    seeking = false;
    if (timelineBar.hasPointerCapture(e.pointerId)) { try { timelineBar.releasePointerCapture(e.pointerId); } catch (err) {} }
  };
  timelineBar.addEventListener('pointerup', endSeek);
  timelineBar.addEventListener('pointercancel', endSeek);
  timelineBar.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { seek((audio.currentTime || 0) + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { seek((audio.currentTime || 0) - 1); e.preventDefault(); }
  });

  phaseChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      const phase = parseInt(chip.dataset.phase, 10);
      if (Number.isNaN(phase)) return;
      pausePlay(); resetQuiz(); clearMimiReaction(); lastPhase = -1;
      setMode('act', phase); renderFrame(0);
      playFromCurrent();
    });
  });

  optCorrect.addEventListener('click', () => {
    if (quizAnswered !== null) return;
    quizAnswered = 'correct';
    optCorrect.classList.add('picked-correct');
    quizOpts.forEach((b) => { b.disabled = true; });
    quizFb.className = 'quiz-fb ok';
    quizFb.textContent = '正確！10 塊就是 10/12 條。';
    mimiBubble.textContent = '🐰 答對了！太聰明了！🎉';
    void mimiWrap.offsetWidth; mimiWrap.classList.add('cheer');
  });
  optWrong.addEventListener('click', () => {
    if (quizAnswered !== null) return;
    quizAnswered = 'wrong';
    optWrong.classList.add('picked-wrong');
    quizOpts.forEach((b) => { b.disabled = true; });
    quizFb.className = 'quiz-fb no';
    quizFb.textContent = '再想想：分母代表總共有幾塊喔！';
    mimiBubble.textContent = '🐰 不對喔！一整條一直都只有 12 塊，分母不能相加喔！💡';
    void mimiWrap.offsetWidth; mimiWrap.classList.add('tilt');
  });
  $('challengeBtn').addEventListener('click', () => {
    window.location.href = '../../components/fraction_lab.html?q=7';
  });

  /* ---------- 由 JSON 載入四幕台詞與時間軸（SSOT），離線時用內建實測值 ---------- */
  fetch(TIMELINE_PATH)
    .then((r) => { if (!r.ok) throw new Error('timeline HTTP ' + r.status); return r.json(); })
    .then((cfg) => {
      if (!Array.isArray(cfg.acts) || cfg.acts.length !== 4) return;
      cfg.acts.forEach((a, i) => {
        const t = TIMELINE.acts[i];
        t.title = a.title;
        if (typeof a.start === 'number') t.start = a.start;
        if (typeof a.duration === 'number') t.duration = a.duration;
        if (typeof a.end === 'number') t.end = a.end;
        if (typeof a.text === 'string' && a.text.trim()) PHASES[i].caption = a.text;
      });
      FULL_DURATION = TIMELINE.acts[TIMELINE.acts.length - 1].end;
      timelineBar.setAttribute('aria-valuemax', String(Math.ceil(FULL_DURATION)));
      renderFrame(audio.currentTime || 0);
    })
    .catch(() => { /* 離線 / file:// 降級：沿用內建實測值 */ });

  equationBig.innerHTML = equationHTML;
  setMode('full', 0);
  renderFrame(0);
  window.addEventListener('resize', () => renderFrame(audio.currentTime || 0));
</script>
</body>
</html>
