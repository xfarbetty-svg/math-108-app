<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>白兔米米的數學小教室：12 格長條巧克力（N-3-9 同分母分數）</title>
<style>
  :root {
    --ink: #0f172a;
    --gold: #f1c40f;
    --chalk-gold: #fde68a;
    --blue: #38bdf8;
    --orange: #fb923c;
    --mint: #2ecc71;
    --fur: #fdfefe;
    --ear-pink: #ffd1dc;
    --amber: #ffbf00;
    --panel: rgba(15, 23, 42, 0.92);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    background: radial-gradient(ellipse at 50% 0%, #1b2a45 0%, #0b1220 55%, #070b14 100%);
    color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 14px 12px 18px;
    gap: 10px;
  }

  /* ---------- 頂部狀態欄 ---------- */
  .header-bar {
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .header-title {
    font-size: clamp(0.9rem, 2vw, 1.22rem);
    font-weight: 800;
    color: var(--chalk-gold);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    line-height: 1.25;
  }
  .badge-comfort {
    background: rgba(46, 204, 113, 0.16);
    border: 1px solid rgba(46, 204, 113, 0.75);
    color: #6ee7a8;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: clamp(0.56rem, 1.1vw, 0.72rem);
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .header-unit {
    font-size: clamp(0.6rem, 1.1vw, 0.82rem);
    color: #94a3b8;
    text-align: right;
    white-space: nowrap;
  }

  /* ---------- 頂部計數指示牌 ---------- */
  .counter-pill {
    width: 100%;
    max-width: 1000px;
    background: var(--panel);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 6px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.45);
  }
  .counter-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    min-width: 0;
  }
  .counter-label {
    font-size: clamp(0.5rem, 1vw, 0.64rem);
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .counter-val {
    font-size: clamp(0.78rem, 1.7vw, 1.08rem);
    font-weight: 800;
    color: var(--chalk-gold);
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .counter-val.blue { color: var(--blue); }
  .counter-val.orange { color: var(--orange); }
  .counter-sep {
    width: 1px;
    height: 22px;
    background: rgba(255, 255, 255, 0.14);
    flex: 0 0 auto;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex: 0 0 auto;
  }
  .dot.blue { background: var(--blue); box-shadow: 0 0 6px rgba(56, 189, 248, 0.9); }
  .dot.orange { background: var(--orange); box-shadow: 0 0 6px rgba(251, 146, 60, 0.9); }
  .dot.dark { background: #334155; box-shadow: inset 0 0 0 1px #64748b; }

  /* ---------- 主舞台 ---------- */
  .stage-wrapper {
    position: relative;
    width: 100%;
    max-width: 1000px;
    height: clamp(240px, 44vw, 420px);
    border-radius: 16px;
    overflow: hidden;
    background: #b57f4e;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    isolation: isolate;
  }

  /* 100% 共用溫馨森林木質教室底圖（木紋地板 + 天花板暖光） */
  .stage-backdrop {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 62% 58% at 50% -6%, rgba(255, 240, 200, 0.92) 0%, rgba(255, 232, 178, 0.42) 42%, rgba(255, 226, 160, 0) 72%),
      repeating-linear-gradient(0deg, rgba(84, 47, 18, 0.16) 0 1px, rgba(84, 47, 18, 0) 1px 38px),
      repeating-linear-gradient(90deg, #c68f5c 0 68px, #ad7442 68px 72px, #c9945f 72px 140px, #ad7442 140px 144px),
      linear-gradient(180deg, #d9ab77 0%, #c68f5c 48%, #a46f3f 100%);
    pointer-events: none;
  }
  .stage-backdrop::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 34% at 50% 100%, rgba(60, 28, 8, 0.34) 0%, rgba(60, 28, 8, 0) 70%),
      radial-gradient(ellipse 40% 26% at 50% 4%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
    pointer-events: none;
  }
  /* 天花板光源光柱 */
  .light-shaft {
    position: absolute;
    left: 50%;
    top: -18%;
    width: 52%;
    height: 96%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 246, 214, 0.5) 0%, rgba(255, 246, 214, 0.12) 45%, rgba(255, 246, 214, 0) 72%);
    pointer-events: none;
    z-index: 1;
  }

  .stage-inner {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    height: 100%;
  }

  /* ---------- 左側 48% 角色安全區 ---------- */
  .actor-zone {
    position: relative;
    width: 48%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 4px 46px;
  }
  .mimi-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .mimi-svg {
    height: 100%;
    width: auto;
    max-width: 96%;
    overflow: visible;
    filter: drop-shadow(0 12px 10px rgba(70, 34, 10, 0.42));
    transition: transform 0.35s ease;
  }
  .mimi-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 12px 10px rgba(70, 34, 10, 0.42));
    display: block;
  }
  .mimi-wrap.has-video .mimi-svg {
    display: none;
  }
  .mimi-wrap.no-video .mimi-video {
    display: none;
  }
  .mimi-wrap.no-video .mimi-svg {
    display: block;
  }

  /* 角色待機呼吸動畫 */
  .mimi-body {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(1.012, 1.028) translateY(-1px); }
  }
  .mimi-ear-left {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: earSwayL 4.2s ease-in-out infinite;
  }
  .mimi-ear-right {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: earSwayR 4.2s ease-in-out infinite;
  }
  @keyframes earSwayL {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes earSwayR {
    0%, 100% { transform: rotate(2deg); }
    50% { transform: rotate(-3deg); }
  }
  .mimi-eyes {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: blink 5.4s infinite;
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }
  .mimi-arm-point {
    transform-box: fill-box;
    transform-origin: 8% 88%;
    animation: pointSwing 2.8s ease-in-out infinite;
  }
  @keyframes pointSwing {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-4deg); }
  }

  /* 互動回饋：耳朵歡呼 / 歪頭提示 */
  .mimi-wrap.cheer .mimi-ear-left {
    animation: earCheerL 0.35s ease-in-out 4;
  }
  .mimi-wrap.cheer .mimi-ear-right {
    animation: earCheerR 0.35s ease-in-out 4;
  }
  @keyframes earCheerL {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(-16deg) translateY(-3px); }
  }
  @keyframes earCheerR {
    0%, 100% { transform: rotate(2deg); }
    50% { transform: rotate(16deg) translateY(-3px); }
  }
  .mimi-wrap.tilt .mimi-svg {
    transform: rotate(-7deg) translateX(-2px);
    transform-origin: 50% 88%;
  }
  .mimi-wrap.tilt .mimi-video {
    transform: rotate(-7deg) translateX(-2px);
    transform-origin: 50% 88%;
  }

  /* 角色氣泡 */
  .mimi-speech-bubble {
    position: absolute;
    right: 6px;
    top: 8px;
    max-width: 94%;
    background: rgba(255, 255, 255, 0.97);
    color: var(--ink);
    border-radius: 14px;
    padding: 6px 10px;
    font-size: clamp(0.58rem, 1.35vw, 0.92rem);
    font-weight: 800;
    line-height: 1.35;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.38), 0 0 0 2px var(--gold);
    animation: bubbleBounce 3.2s ease-in-out infinite;
    z-index: 6;
  }
  .mimi-speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -8px;
    right: 22%;
    border-width: 9px 8px 0;
    border-style: solid;
    border-color: rgba(255, 255, 255, 0.97) transparent transparent;
  }
  @keyframes bubbleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* ---------- 右側 52% 半透明磨砂黑板演武場 ---------- */
  .blackboard-zone {
    position: relative;
    width: 52%;
    height: 100%;
    padding: 10px 10px 50px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wooden-blackboard {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    border: 4px solid #8a5a2b;
    background: rgba(28, 52, 42, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 16px 30px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(253, 230, 138, 0.2);
    padding: clamp(5px, 1vw, 12px) clamp(6px, 1.2vw, 14px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(4px, 0.9vw, 10px);
    overflow: hidden;
  }
  .board-title {
    font-size: clamp(0.66rem, 1.55vw, 1.06rem);
    font-weight: 800;
    color: #f8fafc;
    letter-spacing: 0.4px;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 auto;
    line-height: 1.2;
  }

  /* 12 格長條巧克力 */
  .choc-bar-wrap {
    position: relative;
    width: 100%;
    flex: 0 0 auto;
  }
  .choc-bar {
    position: relative;
    display: flex;
    gap: 2px;
    width: 100%;
    height: clamp(30px, 4vw, 52px);
    padding: 3px;
    border-radius: 8px;
    background: #43230c;
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.5),
      0 6px 12px -4px rgba(0, 0, 0, 0.55);
  }
  .seg {
    flex: 1 1 0;
    min-width: 0;
    position: relative;
    border-radius: 3px;
    transition: filter 0.35s ease, box-shadow 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .seg::after {
    content: '';
    position: absolute;
    inset: 1px 1px 42%;
    border-radius: 2px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  .seg.blue {
    background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 52%, #0284c7 100%);
    box-shadow: inset 0 -3px 0 rgba(3, 105, 161, 0.55);
  }
  .seg.orange {
    background: linear-gradient(180deg, #fdba74 0%, #fb923c 52%, #ea580c 100%);
    box-shadow: inset 0 -3px 0 rgba(154, 52, 18, 0.55);
  }
  .seg.dark {
    background: linear-gradient(180deg, #5b6b82 0%, #334155 56%, #1e293b 100%);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.55);
  }
  .seg.lit {
    filter: brightness(1.18) saturate(1.1);
  }
  .seg.lit.blue {
    box-shadow: inset 0 -3px 0 rgba(3, 105, 161, 0.55), 0 0 12px rgba(56, 189, 248, 0.95);
  }
  .seg.lit.orange {
    box-shadow: inset 0 -3px 0 rgba(154, 52, 18, 0.55), 0 0 12px rgba(251, 146, 60, 0.95);
  }
  .seg.pop {
    animation: segPop 0.5s ease;
  }
  @keyframes segPop {
    0% { transform: translateY(0) scale(1); }
    45% { transform: translateY(-4px) scale(1.06); }
    100% { transform: translateY(0) scale(1); }
  }

  .choc-labels {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 0 2px;
    width: 100%;
    margin-top: 3px;
    padding: 0 3px;
    font-size: clamp(0.5rem, 1.05vw, 0.72rem);
    font-weight: 800;
    line-height: 1.2;
  }
  .lbl {
    white-space: nowrap;
    text-align: center;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .lbl.show { opacity: 1; transform: translateY(0); }
  .lbl.blue-lbl { color: #7dd3fc; }
  .lbl.orange-lbl { color: #fdba74; }

  .choc-legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px 8px;
    font-size: clamp(0.46rem, 0.98vw, 0.66rem);
    color: #d7e3dc;
    font-weight: 700;
    line-height: 1.25;
    flex: 0 0 auto;
  }
  .choc-legend span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  /* 聚焦點金色脈衝光圈（第 10 塊位置） */
  .focus-ring {
    position: absolute;
    left: 83.333%;
    top: 50%;
    width: clamp(40px, 6.4vw, 74px);
    height: clamp(40px, 6.4vw, 74px);
    margin-left: -0.5px;
    border-radius: 50%;
    border: 2px solid rgba(241, 196, 15, 0.9);
    background: radial-gradient(circle, rgba(241, 196, 15, 0.26) 0%, rgba(241, 196, 15, 0.05) 68%, transparent 100%);
    box-shadow: 0 0 18px rgba(241, 196, 15, 0.55);
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
    z-index: 5;
  }
  .focus-ring.on {
    opacity: 1;
    animation: focusPulse 2s ease-in-out infinite;
  }
  @keyframes focusPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.82; }
    50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; filter: drop-shadow(0 0 10px #f1c40f); }
  }

  /* 黑板中央內容區 */
  .board-center {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 0 0 auto;
    text-align: center;
  }
  .unit-note {
    font-size: clamp(0.78rem, 1.9vw, 1.3rem);
    font-weight: 900;
    color: #fff7cc;
    text-shadow: 0 0 14px rgba(253, 230, 138, 0.85), 0 1px 0 rgba(0,0,0,0.4);
    letter-spacing: 0.5px;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .unit-note.show {
    opacity: 1;
    transform: scale(1);
    animation: glowPulse 2.2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 10px rgba(253,230,138,0.7), 0 1px 0 rgba(0,0,0,0.4); }
    50% { text-shadow: 0 0 20px rgba(253,230,138,1), 0 0 6px rgba(241,196,15,0.9), 0 1px 0 rgba(0,0,0,0.4); }
  }

  .equation-big {
    font-size: clamp(0.95rem, 2.4vw, 1.7rem);
    font-weight: 900;
    color: #f8fafc;
    line-height: 1.25;
    letter-spacing: 0.5px;
  }
  .denom-glow {
    color: #fde68a;
    text-shadow: 0 0 10px rgba(241, 196, 15, 0.95), 0 0 18px rgba(241, 196, 15, 0.55);
    font-weight: 900;
  }
  .eq-note {
    font-size: clamp(0.52rem, 1.15vw, 0.78rem);
    font-weight: 700;
    color: #fef3c7;
    background: rgba(241, 196, 15, 0.12);
    border: 1px solid rgba(253, 230, 138, 0.45);
    border-radius: 999px;
    padding: 2px 10px;
    margin-top: 2px;
  }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    line-height: 1;
    margin: 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .frac .fnum {
    padding: 0 3px 1px;
    border-bottom: 2px solid currentColor;
  }
  .frac .fden {
    padding: 1px 3px 0;
  }

  /* 互動驗收 */
  .quiz-card {
    width: 100%;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(125, 211, 252, 0.45);
    border-radius: 9px;
    padding: clamp(5px, 1vw, 10px) clamp(6px, 1.1vw, 12px);
    text-align: center;
    flex: 0 0 auto;
  }
  .quiz-q {
    font-size: clamp(0.64rem, 1.45vw, 0.98rem);
    font-weight: 800;
    color: #e0f2fe;
    line-height: 1.35;
    margin-bottom: 6px;
  }
  .quiz-opts {
    display: flex;
    justify-content: center;
    gap: 8px;
  }
  .quiz-opt {
    flex: 1 1 0;
    min-height: 34px;
    border: 1px solid rgba(253, 230, 138, 0.55);
    background: rgba(15, 23, 42, 0.45);
    color: #f8fafc;
    border-radius: 8px;
    font-family: inherit;
    font-size: clamp(0.7rem, 1.5vw, 1rem);
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px 6px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .quiz-opt:hover { background: rgba(253, 230, 138, 0.18); }
  .quiz-opt:active { transform: scale(0.97); }
  .quiz-opt.picked-correct {
    background: rgba(46, 204, 113, 0.32);
    border-color: #2ecc71;
    color: #d1fae5;
  }
  .quiz-opt.picked-wrong {
    background: rgba(239, 68, 68, 0.3);
    border-color: #ef4444;
    color: #fee2e2;
  }
  .quiz-fb {
    margin-top: 5px;
    font-size: clamp(0.52rem, 1.1vw, 0.76rem);
    font-weight: 800;
    line-height: 1.3;
    min-height: 1.2em;
    color: #cbd5e1;
  }
  .quiz-fb.ok { color: #6ee7a8; }
  .quiz-fb.no { color: #fca5a5; }
  [hidden] { display: none !important; }

  /* ---------- 底部字幕條 ---------- */
  .caption-banner {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 94%;
    background: rgba(11, 18, 32, 0.9);
    border: 1px solid rgba(253, 230, 138, 0.32);
    border-radius: 10px;
    padding: 6px 12px;
    text-align: center;
    font-size: clamp(0.6rem, 1.35vw, 0.95rem);
    font-weight: 700;
    line-height: 1.35;
    color: #ffffff;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.55);
    z-index: 8;
  }
  .caption-banner .highlight {
    color: var(--chalk-gold);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ---------- 底部控制列 ---------- */
  .controls-panel {
    width: 100%;
    max-width: 1000px;
    background: #16233a;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 9px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }
  .timeline-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .time-label {
    font-size: clamp(0.56rem, 1.1vw, 0.74rem);
    font-family: ui-monospace, Consolas, monospace;
    color: #cbd5e1;
    font-variant-numeric: tabular-nums;
  }
  .timeline-bar {
    flex: 1;
    height: 8px;
    background: #334155;
    border-radius: 999px;
    position: relative;
    cursor: pointer;
    touch-action: none;
  }
  .timeline-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;

<script>
  'use strict';

  const SEG_COUNT = 12;
  const TIMELINE = {
    full: 'audio/g3_n39_hsiaochen.mp3',
    acts: [

  /* ---------- Wan 2.2 四幕影片（相對路徑，支援離線） ---------- */
  const ACT_VIDEOS = [
    'video/mimi_n39_act1.mp4',

  let actIndex = 0;
  let isPlaying = false;

  let lastPhase = -1;
  let quizAnswered = null;
  let videoBroken = false;

  const segKinds = [];

    segKinds.push(i < 3 ? 'blue' : (i < 10 ? 'orange' : 'dark'));
  }

    chocBar.insertBefore(el, focusRing);

  const PHASES = [

  function formatTime(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
  }

  function getTotalSeconds() {
    if (playMode === 'act') return TIMELINE.acts[actIndex].duration;
    return FULL_DURATION;
  }

  function phaseIndexFull(t) {
    if (t < TIMELINE.acts[1].start) return 0;
    if (t < TIMELINE.acts[2].start) return 1;
    if (t < TIMELINE.acts[3].start) return 2;
    return 3;
  }

  function currentPhase(t) {
    return playMode === 'act' ? actIndex : phaseIndexFull(t);
  }

  function setSpeaking(on) {
    mimiWrap.classList.toggle('speaking', !!on);
    captionText.classList.toggle('speaking', !!on);
    mimiBubble.classList.toggle('speaking', !!on);
  }

  /* ---------- 影片播放 / 幕次切換 / 容錯回退 ---------- */
  function playMimiVideo() {
    if (videoBroken) return;
    try {
      const p = mimiVideo.play();
      if (p && typeof p.catch === 'function') p.catch(() => { /* 自動播放受阻時靜默降級 */ });
    } catch (e) { /* 影片不可用時略過 */ }
  }

  function pauseMimiVideo() {
    if (videoBroken) return;
    try { mimiVideo.pause(); } catch (e) { /* 已卸載時忽略 */ }
  }

  function syncPhaseVideo(phase) {
    if (videoBroken) return;
    const next = ACT_VIDEOS[phase] || ACT_VIDEOS[0];
    if (mimiVideo.getAttribute('src') !== next) {
      mimiVideo.setAttribute('src', next);
      try { mimiVideo.load(); } catch (e) { /* 尚未就緒時略過 */ }
    }
    if (isPlaying) playMimiVideo();
  }

  mimiVideo.addEventListener('error', () => {
    // 影片缺失或解碼失敗：平滑回退至原版 SVG 米米
    videoBroken = true;
    mimiWrap.classList.remove('has-video');
    mimiWrap.classList.add('no-video');
    try { mimiVideo.pause(); } catch (e) { /* 已卸載時忽略 */ }
  });

  function updatePlayButton() {
    if (isPlaying) {
      btnPlayPause.textContent = '⏸ 暫停';
      btnPlayPause.classList.remove('btn-primary');
    } else {
      btnPlayPause.textContent = '▶ 播放';
      btnPlayPause.classList.add('btn-primary');
    }
  }

  function clearMimiReaction() {
    mimiWrap.classList.remove('cheer', 'tilt');
  }

  function resetQuiz() {
    quizAnswered = null;
    quizFb.textContent = '';
    quizFb.className = 'quiz-fb';
    quizOpts.forEach((b) => {
      b.classList.remove('picked-correct', 'picked-wrong');
      b.disabled = false;
    });
  }

  function applyPhaseVisuals(phase) {
    phaseChips.forEach((chip, i) => chip.classList.toggle('active', i === phase));

    const cfg = PHASES[phase];
    // 若第 4 幕已作答，保留作答後的泡泡與回饋
    if (!(phase === 3 && quizAnswered !== null)) {
      mimiBubble.textContent = cfg.bubble;
    }
    captionText.textContent = cfg.caption;

    // 頂部計數：依規格第 1 幕即顯示 3、7、10
    cntBlue.textContent = '3';
    cntOrange.textContent = '7';
    cntTotal.textContent = '10';
    cntFraction.textContent = phase >= 1 ? '10/12' : '—';

    // 巧克力動態著色導引
    segEls.forEach((el, i) => {
      const isTaken = i < 10;
      el.classList.toggle('lit', isTaken);
      // 各階段微動態：第1幕全亮已取塊、第2幕聚焦、第3幕強調
      if (phase === 0) {
        el.classList.toggle('pop', i < 10);
      } else if (phase === 1) {
        el.classList.toggle('pop', i === 9);
      } else if (phase === 2) {
        el.classList.toggle('pop', i < 10);
      } else {
        el.classList.remove('pop');
      }
    });

    // 金色光圈導引：第 2 幕起標定第 10 塊位置
    focusRing.classList.toggle('on', phase >= 1);

    // 分數標註顯示
    lblBlue.classList.toggle('show', phase >= 1);
    lblOrange.classList.toggle('show', phase >= 1);

    // 黑板中央內容切換
    unitNote.classList.remove('show');
    equationWrap.hidden = true;
    quizCard.hidden = true;

    if (phase === 0) {
      // 第 1 幕：數塊數（不額外中央提示，聚焦巧克力與字幕）
    } else if (phase === 1) {
      // 第 2 幕：12 塊裡的幾塊
      unitNote.textContent = '每一塊 = 1/12 條';
      unitNote.classList.add('show');
    } else if (phase === 2) {
      // 第 3 幕：算式抽象化（分母 12 金色微光高亮）
      equationBig.innerHTML =
        `<span style="color:#38bdf8;">3</span>/<span class="denom-glow">12</span>` +
        ` + <span style="color:#fb923c;">7</span>/<span class="denom-glow">12</span>` +
        ` = <span style="color:#f1c40f;">10</span>/<span class="denom-glow">12</span>`;
      equationWrap.hidden = false;
    } else if (phase === 3) {
      // 第 4 幕：互動驗收（未作答前不在泡泡外洩漏答案提示）
      quizCard.hidden = false;
      if (quizAnswered === null) {
        quizFb.textContent = '';
        quizFb.className = 'quiz-fb';
      }
    }

    // 左側 48% 舞台影片與幕次同步（換幕才換檔，播放中自動續播）
    syncPhaseVideo(phase);
  }

  function renderFrame(t) {
    const total = getTotalSeconds();
    const clamped = Math.max(0, Math.min(total, t || 0));
    const phase = currentPhase(clamped);

    timeLabel.textContent = formatTime(clamped);
    totalTimeLabel.textContent = formatTime(total);
    timelineFill.style.width = total > 0 ? `${(clamped / total) * 100}%` : '0%';
    timelineBar.setAttribute('aria-valuemax', String(Math.ceil(total)));
    timelineBar.setAttribute('aria-valuenow', String(Math.round(clamped)));

    if (phase !== lastPhase) {
      // 切換分鏡時，若離開第4幕則清除互動狀態；進入第4幕保留當前作答
      if (lastPhase === 3 && phase !== 3) {
        resetQuiz();
        clearMimiReaction();
      }
      if (phase !== 3) {
        clearMimiReaction();
      }
      lastPhase = phase;
    }

    applyPhaseVisuals(phase);
  }

  /* ---------- 播放控制 ---------- */
  function pausePlay(updateUi) {
    isPlaying = false;
    try { audio.pause(); } catch (e) { /* 離線/解碼異常時靜默降級 */ }
    pauseMimiVideo();
    setSpeaking(false);
    if (updateUi !== false) updatePlayButton();
  }

  async function playFromCurrent() {
    const total = getTotalSeconds();
    if (!Number.isNaN(audio.duration) && audio.duration > 0 && audio.currentTime >= audio.duration - 0.05) {
      audio.currentTime = 0;
    } else if (audio.currentTime >= total - 0.05 && total > 0) {
      audio.currentTime = 0;
    }
    try {
      await audio.play();
      isPlaying = true;
      setSpeaking(true);
      playMimiVideo();
      updatePlayButton();
    } catch (e) {
      // 自動播放受阻等情境：優雅降級等待使用者點擊後解鎖
      isPlaying = false;
      setSpeaking(false);
      updatePlayButton();
    }
  }

  function seek(t) {
    const total = getTotalSeconds();
    const clamped = Math.max(0, Math.min(total, t || 0));
    try {
      if (!Number.isNaN(audio.duration) && audio.duration > 0) {
        audio.currentTime = Math.min(clamped, audio.duration);
      } else {
        audio.currentTime = clamped;
      }
    } catch (e) { /* 容錯：尚未就緒時略過 */ }
    renderFrame(clamped);
  }

  function setMode(mode, idx) {
    playMode = mode;
    actIndex = typeof idx === 'number' ? idx : 0;
    const src = playMode === 'full' ? TIMELINE.full : TIMELINE.acts[actIndex].file;
    if (audio.getAttribute('src') !== src) {
      audio.src = src;
    }
    try { audio.currentTime = 0; } catch (e) { /* 尚未載入時略過 */ }
  }

  function restartShow() {
    pausePlay();
    resetQuiz();
    clearMimiReaction();
    lastPhase = -1;
    setMode('full', 0);
    renderFrame(0);
    // 重播：影片歸零並重新起播
    if (!videoBroken) {
      try { mimiVideo.currentTime = 0; } catch (e) { /* 尚未就緒時略過 */ }
    }
    playFromCurrent();
  }

  btnPlayPause.addEventListener('click', () => {
    if (isPlaying) {
      pausePlay();
      return;
    }
    // 依目前模式續播：連續播放用全景語音，特定幕次用該幕語音
    const src = playMode === 'full' ? TIMELINE.full : TIMELINE.acts[actIndex].file;
    if (audio.getAttribute('src') !== src) {
      audio.src = src;
    }
    playFromCurrent();
  });

  btnRestart.addEventListener('click', () => {
    restartShow();
  });

  btnAudioToggle.addEventListener('click', () => {
    audio.muted = !audio.muted;
    btnAudioToggle.textContent = audio.muted ? '🔇 音效: 關' : '🔊 音效: 開';
  });

  audio.addEventListener('timeupdate', () => {
    if (seeking) return;
    renderFrame(audio.currentTime || 0);
  });

  audio.addEventListener('ended', () => {
    isPlaying = false;
    pauseMimiVideo();
    setSpeaking(false);
    updatePlayButton();
    renderFrame(getTotalSeconds());
  });

  audio.addEventListener('pause', () => {
    // 非拖曳造成的暫停同步狀態
    if (!audio.ended) {
      isPlaying = false;
      pauseMimiVideo();
      setSpeaking(false);
      updatePlayButton();
    }
  });

  audio.addEventListener('play', () => {
    isPlaying = true;
    setSpeaking(true);
    playMimiVideo();
    updatePlayButton();
  });

  /* 時間軸：點擊 + 拖曳 */
  function seekFromEvent(e) {
    const rect = timelineBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    seek(ratio * getTotalSeconds());
  }
  timelineBar.addEventListener('pointerdown', (e) => {
    seeking = true;
    timelineBar.setPointerCapture(e.pointerId);
    seekFromEvent(e);
  });
  timelineBar.addEventListener('pointermove', (e) => {
    if (seeking) seekFromEvent(e);
  });
  const endSeek = (e) => {
    if (!seeking) return;
    seeking = false;
    if (timelineBar.hasPointerCapture(e.pointerId)) {
      try { timelineBar.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    }
  };
  timelineBar.addEventListener('pointerup', endSeek);
  timelineBar.addEventListener('pointercancel', endSeek);
  timelineBar.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { seek((audio.currentTime || 0) + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { seek((audio.currentTime || 0) - 1); e.preventDefault(); }
  });

  phaseChips.forEach((chip) => {
    chip.addEventListener('click', () => {
      const phase = parseInt(chip.dataset.phase, 10);
      if (Number.isNaN(phase)) return;
      pausePlay();
      resetQuiz();
      clearMimiReaction();
      lastPhase = -1;
      setMode('act', phase);
      renderFrame(0);
      // 點選幕次：影片從該幕開頭播放
      if (!videoBroken) {
        try { mimiVideo.currentTime = 0; } catch (e) { /* 尚未就緒時略過 */ }
      }
      // 點選幕次即播對應分段語音
      playFromCurrent();
    });
  });

  /* ---------- 第 4 幕互動驗收 ---------- */
  optCorrect.addEventListener('click', () => {
    if (quizAnswered !== null) return;
    quizAnswered = 'correct';
    optCorrect.classList.add('picked-correct');
    quizOpts.forEach((b) => { b.disabled = true; });
    quizFb.className = 'quiz-fb ok';
    quizFb.textContent = '正確！10 塊就是 10/12 條。';
    mimiBubble.textContent = '🐰 答對了！太聰明了！🎉';
    clearMimiReaction();
    // 觸發耳朵歡呼動畫
    void mimiWrap.offsetWidth;
    mimiWrap.classList.add('cheer');
  });

  optWrong.addEventListener('click', () => {
    if (quizAnswered !== null) return;
    quizAnswered = 'wrong';
    optWrong.classList.add('picked-wrong');
    quizOpts.forEach((b) => { b.disabled = true; });
    quizFb.className = 'quiz-fb no';
    quizFb.textContent = '再想想：分母代表總共有幾塊喔！';
    mimiBubble.textContent = '🐰 不對喔！一整條一直都只有 12 塊，分母不能相加喔！💡';
    clearMimiReaction();
    // 觸發歪頭提示
    void mimiWrap.offsetWidth;
    mimiWrap.classList.add('tilt');
  });

  /* ---------- 初始化 ---------- */
  equationBig.innerHTML =
    `<span style="color:#38bdf8;">3</span>/<span class="denom-glow">12</span>` +
    ` + <span style="color:#fb923c;">7</span>/<span class="denom-glow">12</span>` +
    ` = <span style="color:#f1c40f;">10</span>/<span class="denom-glow">12</span>`;
  setMode('full', 0);
  renderFrame(0);
  window.addEventListener('resize', () => renderFrame(audio.currentTime || 0));
</script>
</body>
</html>
