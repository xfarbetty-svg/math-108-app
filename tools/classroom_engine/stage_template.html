<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
<title>米米兔概念小教室 2D 渲染引擎</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: #F8F4EA;
    font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg#stage {
    width: 1920px;
    height: 1080px;
    display: block;
  }
  .ink { stroke: #1E293B; stroke-linecap: round; stroke-linejoin: round; }
  .txt-ink { fill: #1E293B; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  /* Toggled on the element currently framed by the amber focus glow.
     Non-destructive marker only: never touches stroke/filter/opacity. */
  .is-highlighted { --focus-active: 1; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm beige subtle dot pattern for infinite canvas -->
    <pattern id="warmGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.8" fill="#DFD6C0" />
    </pattern>

    <!-- Soft drop shadows -->
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.10" />
    </filter>
    <filter id="subShadow" x="-4%" y="-15%" width="108%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E293B" flood-opacity="0.14" />
    </filter>
    <filter id="bubbleShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1E293B" flood-opacity="0.16" />
    </filter>

    <!-- Clip for Right 75% Infinite Canvas (x: 480..1920) -->
    <clipPath id="rightCanvasClip">
      <rect x="480" y="0" width="1440" height="1080" />
    </clipPath>
    <!-- Clip for Full 100% Canvas (x: 0..1920) -->
    <clipPath id="fullCanvasClip">
      <rect x="0" y="0" width="1920" height="1080" />
    </clipPath>
  </defs>

  <!-- 1. Full Warm Beige Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#F8F4EA" />

  <!-- 2. Infinite Canvas Stage Container (Clipped to 75% or 100% Full Stage) -->
  <g id="canvas-clip-group" clip-path="url(#rightCanvasClip)">
    <!-- Subtle warm dot-grid moving with camera -->
    <g id="world-camera">
      <rect x="-1200" y="-400" width="9000" height="2000" fill="url(#warmGrid)" />
      <!-- Unit-specific infinite canvas scenes injected here -->
      <g id="world-content"></g>
    </g>
  </g>

  <!-- 3. Left 25% Stage Backdrop (x: 0..480) & Unit Identity Badge -->
  <g id="left-stage-bg">
    <g id="left-stage-backdrop">
      <rect x="0" y="0" width="480" height="1080" fill="#F2EBD9" />
      <line x1="480" y1="0" x2="480" y2="1080" stroke="#D8CEB8" stroke-width="3" />
    </g>
    <!-- Unit Identity Badge (Top Left) -->
    <g id="unit-badge-group" transform="translate(36, 36)">
      <rect x="0" y="0" width="408" height="62" rx="18" fill="#FFFDF8" stroke="#1E293B" stroke-width="3" filter="url(#cardShadow)" />
      <rect x="10" y="10" width="96" height="42" rx="12" fill="#E15B48" />
      <text id="badge-code" x="58" y="38" text-anchor="middle" font-size="22" font-weight="900" fill="#FFFFFF">S-3-3</text>
      <text id="badge-title" x="122" y="39" font-size="24" font-weight="800" class="txt-ink">圓｜概念小教室</text>
    </g>
  </g>

  <!-- 4. Top-Right Chapter Progress Pill -->
  <g id="chapter-pill" transform="translate(1520, 34)">
    <rect x="0" y="0" width="364" height="52" rx="26" fill="#FFFDF8" stroke="#1E293B" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle id="chapter-dot" cx="28" cy="26" r="9" fill="#E15B48" />
    <text id="chapter-label" x="48" y="34" font-size="22" font-weight="800" class="txt-ink">1/4 情境導入</text>
  </g>

  <!-- 5. Mimi Illustration Root & Floor Shadow (Dynamic Position & Poses) -->
  <!-- Anchor at feet center (x, y); natural breathing + speaking nod -->
  <g id="mimi-root" transform="translate(240, 880)">
    <!-- Soft floor shadow under Mimi's feet (moves with Mimi) -->
    <ellipse id="mimi-shadow" cx="0" cy="4" rx="118" ry="20" fill="#DDD2BC" opacity="0.85" />
    <g id="mimi-breathe">
      <g id="mimi-nod">
        <image id="mimi-img" href="../../app/assets/characters/mimi_stand.png"
               x="-219" y="-640" width="438" height="640"
               preserveAspectRatio="xMidYMid meet" />
      </g>
    </g>
  </g>
               preserveAspectRatio="xMidYMid meet" />
      </g>
    </g>
  </g>

  <!-- 6. Soft Amber Focus Glow (highlights the matching element on right 75% canvas) -->
  <defs>
    <filter id="focusGlowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="focusGlowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
  </defs>
  <g id="focus-glow-fx" opacity="0" pointer-events="none">
    <rect id="focus-glow-aura" x="0" y="0" width="100" height="100" rx="28"
          fill="#FDE68A" fill-opacity="0.08" stroke="#F59E0B" stroke-width="14"
          opacity="0.45" filter="url(#focusGlowBlur)" />
    <rect id="focus-glow-box" x="0" y="0" width="100" height="100" rx="28"
          fill="none" stroke="#F59E0B" stroke-width="5"
          opacity="0.85" filter="url(#focusGlowSoft)" />
    <circle id="focus-glow-dot" cx="0" cy="0" r="7" fill="#D97706" stroke="#FFFDF8" stroke-width="2.5" />
  </g>

  <!-- 7. Mimi Head Emotion Bubble (?, 💡, !) -->
  <!-- Positioned cleanly above-right of Mimi's ears at (370, 224) -->
  <g id="mimi-bubble" transform="translate(370, 224) scale(0)" filter="url(#bubbleShadow)">
    <!-- Cloud/comic bubble body -->
    <path d="M-54,-46 C-54,-74 54,-74 54,-46 C66,-46 66,24 44,28 L12,28 L-16,52 L-8,28 L-44,28 C-66,24 -66,-46 -54,-46 Z" fill="#FFFDF8" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />
    <!-- Icon: Question ? -->
    <g id="bubble-icon-question" opacity="0">
      <text x="0" y="6" text-anchor="middle" font-size="62" font-weight="900" fill="#D97706" stroke="#1E293B" stroke-width="1.5">?</text>
    </g>
    <!-- Icon: Exclamation ! -->
    <g id="bubble-icon-alert" opacity="0">
      <text x="0" y="6" text-anchor="middle" font-size="64" font-weight="900" fill="#E15B48" stroke="#1E293B" stroke-width="1.5">!</text>
    </g>
    <!-- Icon: Lightbulb 💡 (Pure vector SVG so zero emoji font issues) -->
    <g id="bubble-icon-idea" opacity="0" transform="translate(0, -14)">
      <!-- Rays -->
      <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="-34" x2="0" y2="-43" />
        <line x1="25" y1="-24" x2="32" y2="-30" />
        <line x1="-25" y1="-24" x2="-32" y2="-30" />
        <line x1="32" y1="0" x2="40" y2="0" />
        <line x1="-32" y1="0" x2="-40" y2="0" />
      </g>
      <!-- Bulb glass -->
      <path d="M-20,-4 C-20,-20 20,-20 20,-4 C20,8 12,14 10,22 L-10,22 C-12,14 -20,8 -20,-4 Z" fill="#FDE047" stroke="#1E293B" stroke-width="3.2" stroke-linejoin="round" />
      <!-- Filament -->
      <path d="M-5,10 L-2,0 L2,0 L5,10" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" />
      <!-- Base -->
      <rect x="-9" y="22" width="18" height="7" rx="2" fill="#94A3B8" stroke="#1E293B" stroke-width="2.5" />
      <rect x="-6" y="29" width="12" height="5" rx="2" fill="#64748B" stroke="#1E293B" stroke-width="2" />
    </g>
  </g>

  <!-- 7.5. Dynamic Feedback Badge (✓ Correct / ✗ Trap) -->
  <g id="feedback-badge" opacity="0" pointer-events="none" filter="url(#cardShadow)">
    <rect id="feedback-badge-bg" x="-130" y="-36" width="260" height="72" rx="36" fill="#10B981" stroke="#1E293B" stroke-width="3.5" />
    <text id="feedback-badge-icon" x="-80" y="12" font-size="38" font-weight="900" fill="#FFFFFF">✓</text>
    <text id="feedback-badge-text" x="18" y="10" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF"></text>
  </g>

  <!-- 8. Bottom High-Contrast Subtitle Bar (y: 916..1004, safe margin >=76px from bottom) -->
  <g id="subtitle-bar" transform="translate(960, 960)" filter="url(#subShadow)">
    <rect id="subtitle-bg" x="-780" y="-44" width="1560" height="88" rx="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="4" />
    <text id="subtitle-text" x="0" y="13" text-anchor="middle" font-size="35" font-weight="800" class="txt-ink"></text>
  </g>
</svg>

<!-- Injected timeline + unit plugin scripts -->
<script id="timeline-data" type="application/json">{}</script>
<script id="unit-plugin-script"></script>

<script>
(function () {
  "use strict";

  // Easing utilities
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function easeInOutCubic(t) {
    t = clamp01(t);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function easeOutBack(t) {
    t = clamp01(t);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function lerp(a, b, t) { return a + (b - a) * t; }

  const timeline = JSON.parse(document.getElementById("timeline-data").textContent || "{}");
  const cues = timeline.cues || [];
  const unitMeta = timeline.unit || {};

  // Update header badge
  if (unitMeta.code) document.getElementById("badge-code").textContent = unitMeta.code;
  if (unitMeta.short_title) document.getElementById("badge-title").textContent = unitMeta.short_title;

  // Build unit-specific infinite canvas scenes
  const worldContent = document.getElementById("world-content");
  if (window.UNIT_PLUGIN && typeof window.UNIT_PLUGIN.buildWorld === "function") {
    window.UNIT_PLUGIN.buildWorld(worldContent, timeline);
  }

  // DOM refs
  const worldCamera = document.getElementById("world-camera");
  const mimiRoot = document.getElementById("mimi-root");
  const mimiImg = document.getElementById("mimi-img");
  const mimiBreathe = document.getElementById("mimi-breathe");
  const mimiNod = document.getElementById("mimi-nod");
  const focusGlow = document.getElementById("focus-glow-fx");
  const focusAura = document.getElementById("focus-glow-aura");
  const focusBox = document.getElementById("focus-glow-box");
  const focusDot = document.getElementById("focus-glow-dot");
  const bubbleGroup = document.getElementById("mimi-bubble");
  const bubbleIcons = {
    question: document.getElementById("bubble-icon-question"),
    alert: document.getElementById("bubble-icon-alert"),
    idea: document.getElementById("bubble-icon-idea")
  };
  const feedbackBadge = document.getElementById("feedback-badge");
  const feedbackBadgeBg = document.getElementById("feedback-badge-bg");
  const feedbackBadgeIcon = document.getElementById("feedback-badge-icon");
  const feedbackBadgeText = document.getElementById("feedback-badge-text");
  const subtitleBar = document.getElementById("subtitle-bar");
  const subtitleBg = document.getElementById("subtitle-bg");
  const subtitleText = document.getElementById("subtitle-text");
  const chapterLabel = document.getElementById("chapter-label");
  const chapterDot = document.getElementById("chapter-dot");

  const CHAPTER_COLORS = ["#E15B48", "#2563EB", "#D97706", "#059669"];

  // Layout mode setup
  const isFullStage = (timeline.layout === "full_stage");
  if (isFullStage) {
    const clipGrp = document.getElementById("canvas-clip-group");
    if (clipGrp) clipGrp.setAttribute("clip-path", "url(#fullCanvasClip)");
    const leftBackdrop = document.getElementById("left-stage-backdrop");
    if (leftBackdrop) leftBackdrop.setAttribute("opacity", "0");
    const badgeGrp = document.getElementById("unit-badge-group");
    if (badgeGrp) badgeGrp.setAttribute("transform", "translate(48, 34)");
  }

  // Focus glow state (kept across frames so it can glide between targets)
  const glowState = { key: null, rect: null, from: null, t0: 0 };
  let highlightedEl = null;
  let currentPose = null;

  // Resolve which DOM selector the amber glow should frame right now.
  // cue.focusSequence wins over cue.focusTarget; `until` is cue progress (0..1).
  function pickFocusTarget(cue, cueProgress) {
    if (!cue) return null;
    const seq = cue.focusSequence;
    if (Array.isArray(seq) && seq.length) {
      for (let i = 0; i < seq.length; i++) {
        const step = seq[i];
        const until = (step.until === undefined || step.until === null) ? 1 : Number(step.until);
        if (cueProgress < until) return step.target;
      }
      return seq[seq.length - 1].target;
    }
    return cue.focusTarget || null;
  }

  // Compute Mimi position, pose and orientation in full_stage mode
  function getMimiAt(t) {
    if (!cues.length) return { x: 260, y: 880, pose: "wave", flip: false, scale: 1.0 };
    let idx = 0;
    for (let i = 0; i < cues.length; i++) {
      if (t >= cues[i].start - 0.55) idx = i;
    }
    const defaultMimi = { x: 260, y: 880, pose: "wave", flip: false, scale: 1.0 };
    const cur = cues[idx].mimi ? { ...defaultMimi, ...cues[idx].mimi } : defaultMimi;
    const prev = (idx > 0 && cues[idx - 1].mimi) ? { ...defaultMimi, ...cues[idx - 1].mimi } : cur;
    const transDur = 0.85;
    const transStart = cues[idx].start - 0.55;
    const changed = (cur.x !== prev.x || cur.y !== prev.y);
    if (!changed || idx === 0 || t < transStart) {
      return {
        ...cur,
        pose: (t >= cues[idx].start - 0.1) ? cur.pose : prev.pose,
        flip: (t >= cues[idx].start - 0.1) ? cur.flip : prev.flip
      };
    }
    const p = easeInOutCubic((t - transStart) / transDur);
    return {
      x: lerp(prev.x, cur.x, p),
      y: lerp(prev.y, cur.y, p),
      pose: (p >= 0.45) ? cur.pose : prev.pose,
      flip: (p >= 0.45) ? cur.flip : prev.flip,
      scale: lerp(prev.scale || 1.0, cur.scale || 1.0, p)
    };
  }

  // Compute smooth camera state at time t
  function getCameraAt(t) {
    if (!cues.length) return { x: 0, y: 0, zoom: 1 };
    const defaultCam = { x: 0, y: 0, zoom: 1 };
    let idx = 0;
    for (let i = 0; i < cues.length; i++) {
      if (t >= cues[i].start - 0.55) idx = i;
    }
    const cur = cues[idx].camera || defaultCam;
    const prev = idx > 0 ? (cues[idx - 1].camera || defaultCam) : cur;
    const transDur = 0.95;
    const transStart = cues[idx].start - 0.55;
    const changed = (cur.x !== prev.x || cur.y !== prev.y || cur.zoom !== prev.zoom);
    if (!changed || idx === 0) return cur;
    const p = easeInOutCubic((t - transStart) / transDur);
    return {
      x: lerp(prev.x, cur.x, p),
      y: lerp(prev.y, cur.y, p),
      zoom: lerp(prev.zoom, cur.zoom, p)
    };
  }

  // Find active cue and speaking state
  function getCueState(t) {
    if (!cues.length) return { cue: null, idx: -1, isSpeaking: false, cueProgress: 0 };
    let activeIdx = 0;
    let isSpeaking = false;
    for (let i = 0; i < cues.length; i++) {
      if (t >= cues[i].start) activeIdx = i;
      if (t >= cues[i].start && t <= cues[i].end) {
        isSpeaking = true;
        activeIdx = i;
        break;
      }
    }
    const cue = cues[activeIdx];
    const cueProgress = clamp01((t - cue.start) / Math.max(0.01, cue.end - cue.start));
    return { cue, idx: activeIdx, isSpeaking, cueProgress };
  }

  // Deterministic render function called by headless Playwright for every frame
  window.renderAtTime = function (t) {
    const { cue, idx, isSpeaking, cueProgress } = getCueState(t);

    // 1. Camera Pan & Zoom (Full Stage center = (960, 540); Split 25% center = (1200, 500))
    const cam = getCameraAt(t);
    const cx = isFullStage ? 960 : 1200;
    const cy = isFullStage ? 540 : 500;
    const tx = (isFullStage ? 0 : 480) - cam.x;
    const ty = -cam.y;
    worldCamera.setAttribute(
      "transform",
      `translate(${cx}, ${cy}) scale(${cam.zoom.toFixed(4)}) translate(${-cx + tx}, ${-cy + ty})`
    );

    // 2. Mimi Position, Pose & Animation
    let mimiInfo = { x: 240, y: 880, flip: false };
    if (isFullStage) {
      const m = getMimiAt(t);
      mimiInfo = m;
      const flipScale = m.flip ? -1 : 1;
      const s = m.scale || 1.0;
      mimiRoot.setAttribute(
        "transform",
        `translate(${m.x.toFixed(2)}, ${m.y.toFixed(2)}) scale(${(flipScale * s).toFixed(3)}, ${s.toFixed(3)})`
      );
      if (currentPose !== m.pose) {
        mimiImg.setAttribute("href", `../../app/assets/mimi_poses/pose_${m.pose}.png`);
        mimiImg.setAttribute("x", "-248");
        mimiImg.setAttribute("y", "-640");
        mimiImg.setAttribute("width", "496");
        mimiImg.setAttribute("height", "640");
        currentPose = m.pose;
      }
    }

    const breathY = Math.sin(t * 2.0) * 3.2;
    const breathX = Math.sin(t * 1.4) * 1.3;
    mimiBreathe.setAttribute("transform", `translate(${breathX.toFixed(2)}, ${breathY.toFixed(2)})`);

    // Speaking: slightly stronger nod; idle: barely perceptible
    const nodAmp = isSpeaking ? 1 : 0.18;
    const nodY = Math.abs(Math.sin(t * 3.1)) * 3.4 * nodAmp;
    const nodRot = Math.sin(t * 3.1 + 0.6) * 1.4 * nodAmp;
    mimiNod.setAttribute(
      "transform",
      `translate(0, ${nodY.toFixed(2)}) rotate(${nodRot.toFixed(2)}, 0, -320)`
    );

    // 3. Soft Amber Focus Glow — dynamically aligned to the live DOM/SVG rect
    const focusSel = (cue && t >= cue.start - 0.15) ? pickFocusTarget(cue, cueProgress) : null;
    let focusEl = null;
    let focusVisible = false;
    if (focusSel) {
      try { focusEl = document.querySelector(focusSel); } catch (e) { focusEl = null; }
    }
    if (focusEl && focusEl.getBoundingClientRect) {
      const r = focusEl.getBoundingClientRect();
      if (r.width > 0.5 && r.height > 0.5) {
        const breath = 12 + 3 * Math.sin(t * 2.6);
        const want = {
          x: r.left - breath,
          y: r.top - breath,
          w: r.width + breath * 2,
          h: r.height + breath * 2
        };
        const key = focusSel + "@" + (cue ? cue.id : "");
        if (glowState.key !== key) {
          glowState.from = glowState.rect ? { ...glowState.rect } : { ...want };
          glowState.key = key;
          glowState.t0 = t;
        }
        const k = glowState.rect
          ? ((t - glowState.t0) < -0.001 ? 1 : easeInOutCubic(clamp01((t - glowState.t0) / 0.32)))
          : 1;
        const from = glowState.from || want;
        const cur = {
          x: lerp(from.x, want.x, k),
          y: lerp(from.y, want.y, k),
          w: lerp(from.w, want.w, k),
          h: lerp(from.h, want.h, k)
        };
        glowState.rect = cur;

        const enterP = easeInOutCubic((t - (cue.start - 0.15)) / 0.45);

        focusGlow.setAttribute("opacity", (enterP * 0.95).toFixed(3));
        focusGlow.setAttribute("transform", "translate(0, 0)");
        [focusAura, focusBox].forEach((node) => {
          node.setAttribute("x", cur.x.toFixed(1));
          node.setAttribute("y", cur.y.toFixed(1));
          node.setAttribute("width", Math.max(1, cur.w).toFixed(1));
          node.setAttribute("height", Math.max(1, cur.h).toFixed(1));
          node.setAttribute("rx", "28");
        });
        focusDot.setAttribute("cx", (cur.x + cur.w / 2).toFixed(1));
        focusDot.setAttribute("cy", (cur.y - 8).toFixed(1));

        if (highlightedEl !== focusEl) {
          if (highlightedEl) highlightedEl.classList.remove("is-highlighted");
          focusEl.classList.add("is-highlighted");
          highlightedEl = focusEl;
        }
        focusVisible = true;
      }
    }
    if (!focusVisible) {
      if (highlightedEl) {
        highlightedEl.classList.remove("is-highlighted");
        highlightedEl = null;
      }
      glowState.key = null;
      glowState.rect = null;
      focusGlow.setAttribute("opacity", "0");
    }

    // 4. Head Emotion Bubble (?, 💡, !)
    const bubbleType = (cue && cue.bubble && t >= cue.start) ? cue.bubble : null;
    if (bubbleType && bubbleIcons[bubbleType]) {
      const bElapsed = t - cue.start;
      const bScale = easeOutBack(Math.min(1, bElapsed / 0.38));
      const bFloat = Math.sin(t * 4.2) * 5;
      const bx = isFullStage ? (mimiInfo.x + (mimiInfo.flip ? -140 : 140)) : 370;
      const by = isFullStage ? (mimiInfo.y - 656 + bFloat) : (224 + bFloat);
      bubbleGroup.setAttribute("transform", `translate(${bx.toFixed(1)}, ${by.toFixed(1)}) scale(${bScale.toFixed(3)})`);
      Object.keys(bubbleIcons).forEach((k) => {
        bubbleIcons[k].setAttribute("opacity", k === bubbleType ? "1" : "0");
      });
    } else {
      bubbleGroup.setAttribute("transform", "translate(370, 224) scale(0)");
    }

    // 4.5. Dynamic Feedback Badge (✓ / ✗)
    const badge = (cue && cue.badge && t >= cue.start && t <= (cue.end + 0.35)) ? cue.badge : null;
    if (badge && feedbackBadge) {
      const bElapsed = t - cue.start;
      const bScale = easeOutBack(Math.min(1, bElapsed / 0.35));
      const bx = badge.x || 960;
      const by = badge.y || 320;
      feedbackBadge.setAttribute("transform", `translate(${bx}, ${by}) scale(${bScale.toFixed(3)})`);
      feedbackBadge.setAttribute("opacity", "1");
      if (badge.type === "trap") {
        feedbackBadgeBg.setAttribute("fill", "#EF4444");
        feedbackBadgeIcon.textContent = "✗";
      } else {
        feedbackBadgeBg.setAttribute("fill", "#10B981");
        feedbackBadgeIcon.textContent = "✓";
      }
      feedbackBadgeText.textContent = badge.text || "";
      const bw = Math.max(200, (badge.text || "").length * 30 + 110);
      feedbackBadgeBg.setAttribute("x", (-bw / 2).toFixed(0));
      feedbackBadgeBg.setAttribute("width", bw.toFixed(0));
      feedbackBadgeIcon.setAttribute("x", (-bw / 2 + 36).toFixed(0));
      feedbackBadgeText.setAttribute("x", (16).toFixed(0));
    } else if (feedbackBadge) {
      feedbackBadge.setAttribute("opacity", "0");
    }

    // 5. Chapter Pill
    if (cue && cue.chapter_label) {
      chapterLabel.textContent = cue.chapter_label;
      chapterDot.setAttribute("fill", CHAPTER_COLORS[(cue.scene || 0) % CHAPTER_COLORS.length]);
    }

    // 6. Bottom Subtitle Bar
    if (cue && cue.subtitle && t >= cue.start - 0.05 && t <= cue.end + 0.25) {
      subtitleBar.setAttribute("opacity", "1");
      subtitleText.textContent = cue.subtitle;
      // Dynamically adjust card width to fit text cleanly with padding
      const charCount = cue.subtitle.length;
      const w = Math.max(760, Math.min(1760, charCount * 38 + 110));
      subtitleBg.setAttribute("x", (-w / 2).toFixed(0));
      subtitleBg.setAttribute("width", w.toFixed(0));
    } else {
      subtitleBar.setAttribute("opacity", "0");
    }

    // 7. Unit-Specific World Animation
    if (window.UNIT_PLUGIN && typeof window.UNIT_PLUGIN.updateWorld === "function") {
      window.UNIT_PLUGIN.updateWorld(t, cue, cueProgress, timeline);
    }
  };

  // Render initial frame 0
  window.renderAtTime(0);
})();
</script>
</body>
</html>
